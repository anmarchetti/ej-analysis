receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317" # OTLP gRPC (for traces and metrics)
      http:
        endpoint: "0.0.0.0:4318" # OTLP HTTP (optional)

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]