    - ID: "e259e500-b38e-41fe-82db-8b604bcf9e75"
      Hint: Description
      Value: "When a customer is associated with Hotel Theme profiles and the customer have not met Guest Details page, an automated marketing push notification will be sent to the recipient. The intention is to re-engage the recipient and to encourage them to buy the preferable holiday package. Appropriate timings will differ depending on the sales cycle of the product. In our example, we show 2 push notifications over 5 hours."
