      Value: Abandoned Cart Automation Plan
    - ID: "e259e500-b38e-41fe-82db-8b604bcf9e75"
      Hint: Description
      Value: "When a customer fails to complete an order, an automated marketing push notification will be sent to the recipient. The intention is to re-engage the recipient and to encourage them to complete the order. Appropriate timings will differ depending on the sales cycle of the product. In our example, we show 2 push notifications over 5 days. To discourage misuse of any promotional codes in this campaign, brands may wish to set a limit to the number of times a recipient can re-enter this campaign."
