---
ID: "960dca04-8722-4de2-bb7a-7569ea74b01e"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Hotel Image Report
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $time = Get-Date -UFormat %s -Millisecond 0
    $filename = "Hotel_Image_Report_$time.xlsx"
    $folderPath = "$($SitecoreDataFolder)\ExportData"
    $filePath = "$($folderPath)\$filename"
    
    function Create-Data-Folder {
    	param($path)
    	if (!(Test-Path $path))
    	{
    		New-Item -ItemType Directory -Force -Path $path
    	}
    }
    
    function Find-Hotels-Items {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    		@{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    
    	Write-Host "$($items.Count) Hotels were found"
    
    	return $items
    }
    
    function Prepare-Data {
    	param($items)
    
    	$data = @()
    	foreach ($searchResultItem in $items) {
    
    		$item = Get-Item -Path master: -Id $searchResultItem.ItemId
    		$rows = Get-Data-From-Item -Item $item
    		$data += $rows
    	}
    
    	Write-Host "Hotel's report has been prepered"
    
    	return $data
    }
    
    
    function Get-Children-By-Template {
    	param($parent,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.TemplateId -eq $templateId } | Select -First 1
    
    	return $item.Children
    }
    
    
    function Get-Data-From-Item
    {
    	param($item)
    
    	# hotel' child folders
    	$images = Get-Children-By-Template -Parent $item -templateId "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}"
    	
    	$rows = @()
    	foreach ($image in $images) {
    		$data = @{
    			HotelCode = $item['Code']
    			ImageName = $image.Name
    			ImageUrlSmall = $image['Small']
    			ImageUrlMedium = $image["Medium"]
    			ImageUrlLarge = $image['Large']
    		}
    		$rows += $data
    	}
    
    	return $rows
    }
    
    #find hotels items
    $items = Find-Hotels-Items
    
    #Prepare items to table format
    $table = Prepare-Data -items $items
    
    Create-Data-Folder -Path $folderPath
    
    Import-Function -Name ConvertTo-Xlsx
    
    [byte[]]$outobject = $table | ForEach-Object { New-Object PSObject -Property $_ } | ConvertTo-Xlsx
    
    Out-Download -Name $filename -InputObject $outobject 
