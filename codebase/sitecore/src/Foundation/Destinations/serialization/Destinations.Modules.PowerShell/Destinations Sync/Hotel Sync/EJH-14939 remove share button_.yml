Path: "/sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/EJH-14939 remove share button duplicates"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $shareButtonRenderingId = "{8FC67B08-BA02-4D1C-B5A2-BC0CA048E3C2}"
    
    function Find-Hotels-Items {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    		@{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
    		@{ Filter = "StartsWith"; Field = "_fullpath"; Value = "/sitecore/content/EasyJet/Holidays/Home/Destinations"; }
    		@{ Filter = "Equals"; Field = "_name"; Value = "__Standard Values"; "Invert" = $true}
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    
    	Write-Host "$($items.Count) Hotels were found"
    
    	return $items
    }
    
    function Update-Share-Button-Rendering($item){
        $renderingsInstances = @()
        Get-Rendering -Item $item | 
        Foreach-Object { 
            if($_.itemId -eq $shareButtonRenderingId){
                $renderingsInstances += $_
            }
        }
    
        if($renderingsInstances.Count -gt 1){
            for($i = 0; $i -lt ($renderingsInstances.Count - 1); $i++){
                Remove-Rendering -Item $item -Instance $renderingsInstances[$i]
            }
        }
    }
    
    function Update-Hotels(){
        $hotels = Find-Hotels-Items
        foreach($hotel in $hotels){
            $hotelItem = $hotel.GetItem()
            Update-Share-Button-Rendering -Item $hotelItem
        }
    }
    
    Update-Hotels
