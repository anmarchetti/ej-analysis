---
ID: "c4683647-62a9-4693-90a0-03f9058271ce"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/EJH-13273 Add Resort Info to Hotel Browse Pages"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Rendering-Index ($item,$renderingItemId) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemID -eq $renderingItemId) {
    			return $i
    		}
    		$i++
    	}
    }
    
    $criteria = @(
    	@{ Filter = "Equals"; Field = "_templatename"; Value = "Hotel"; }
    	@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    )
    
    $props = @{
    	Index = "sitecore_destinations_master_index"
    	Criteria = $criteria
    }
    
    $items = Find-Item @props | ForEach-Object { Get-Item -Path master: -Id $_.ItemID }
    Write-Host "$($items.Count) hotels were found"
    
    foreach ($item in $items)
    {
    	# Find Resort Info item and rendering
    	$resortInfoRenderingId = "{ECB6DA05-21A2-490B-80CD-439A652F8EF3}"
    	$resortInfoRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Resort Info Block"
    	$resortInfoRenderingItem = Get-Item -Path $resortInfoRenderingPath -Id $resortInfoRenderingId | New-Rendering -PlaceHolder "/body"
    	$resortInfoRendering = Get-Rendering -Item $item | Where-Object { $_.ItemID -eq $resortInfoRenderingId }
    
    	#Find Component Wrapper item and rendering to wrap Resort Info later
    	$componentWrapperPlaceHolder = 'body'
    	$componentWrapperRenderingPath = "/sitecore/layout/Renderings/Project/Holidays/Component Wrapper"
    	$componentWrapperItem = Get-Item -Database "master" -Path $componentWrapperRenderingPath | New-Rendering -PlaceHolder $componentWrapperPlaceHolder
    
    
    	if ($resortInfoRendering -eq $null) {
    		#Add Wrapper to the item
    		Add-Rendering -Item $item -PlaceHolder $componentWrapperPlaceHolder -Instance $componentWrapperItem
    
    		#Select exactly that Wrapper that was added above as need to get it's uniqueId to set to Resort Info placeholder
    		$wrapperForResortInfo = Get-Rendering -Item $item | Select-Object -Last 1
    
    		#Form Wrapper placeholder
    		$resortPlaceholder = '/body/component-wrapper-inner-' + $wrapperForResortInfo.UniqueId + '-0'
    
    		#Add Resort Info rendering to the item
    		Add-Rendering -Item $item -PlaceHolder $resortPlaceholder -Instance $resortInfoRenderingItem
    
    		Write-Host "Resort Info Rendering was added to $($item.Name)"
    
    		# Find Hotel Location Browse rendering
    		$hotelLocationRenderingId = "{2A0502A1-FCA8-4A2E-A2DE-49FAFEBA8A2B}"
    		$hotelLocationRenderingIndex = Get-Rendering-Index -Item $item -RenderingItemId $hotelLocationRenderingId
    		$hotelLocationRendering = Get-Rendering -Item $item | Where-Object { $_.ItemID -eq $hotelLocationRenderingId }
    
    		# Get updated Resort Info rendering if it was added above
    		$resortInfoRenderingUpdatedValue = Get-Rendering -Item $item | Where-Object { $_.ItemID -eq $resortInfoRenderingId }
    
    		if ($hotelLocationRendering -ne $null -and $resortInfoRenderingUpdatedValue -ne $null) {
    			# Swap Hotel Location with Resort Info
    			Set-Rendering -Item $item -Instance $resortInfoRenderingUpdatedValue -Index $hotelLocationRenderingIndex
    			Write-Host "Hotel Location Rendering swapped places with Resort Info Rendering"
    
    
    			# Find Virtual Hotel Facilities rendering as need to replace Resort Wrapper under it
    			$virtualFacilitiesRenderingId = "{F7A0AB8E-3596-4F3B-8749-29114C5E3A40}"
    			$virtualFacilitiesRenderingIndex = Get-Rendering-Index -Item $item -RenderingItemId $virtualFacilitiesRenderingId
    			$virtualFacilitiesRendering = Get-Rendering -Item $item | Where-Object { $_.ItemID -eq $virtualFacilitiesRenderingId }
    
    			# Move Resort Info Wrapper under Virtual Facilities
    			Set-Rendering -Item $item -Instance $wrapperForResortInfo -Index ($virtualFacilitiesRenderingIndex + 1)
    			Write-Host "Resort Info Wrapper set place under Virtual Facilities"
    
    			# Up Resort Info to be placed under Resort Info Wrapper
    			$resortInfoRenderingIndex = Get-Rendering-Index -Item $item -RenderingItemId $resortInfoRenderingId
    			Set-Rendering -Item $item -Instance $resortInfoRenderingUpdatedValue -Index ($resortInfoRenderingIndex - 1)
    			Write-Host "Resort Info set place under Resort Info Wrapper"
    		}
    	}
    } 
