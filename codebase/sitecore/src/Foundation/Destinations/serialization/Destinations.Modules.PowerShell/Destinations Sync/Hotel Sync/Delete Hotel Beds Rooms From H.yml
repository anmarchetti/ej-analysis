ID: "2dd58a70-3b5c-4728-9b34-702e69dffc55"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Delete Hotel Beds Rooms From Hotels
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $hotelBedsRoomTypesFolderId = "{4DA61BDC-6C93-4A50-AAB3-69A6FF84B648}" # HotelBeds data folder under RoomTypes ID
    $accommodationRoomId = "{BA1EC5C3-14C7-40B3-8B69-D020590DA1F3}"
    
    function Find-Hotels-Items {
        $criteria = @(
            @{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
            @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
            @{ Filter = "StartsWith"; Field = "code_s"; Value="X9"; "Invert" = $true}
            @{ Filter = "StartsWith"; Field = "_fullpath"; Value="/sitecore/content/EasyJet/Holidays/Home/Destinations/"; }
        )
    
        $props = @{
            Index = "sitecore_destinations_master_index"
            Criteria = $criteria
        }
    
        $items = Find-Item @props
        Write-Host "Number of Hotels retrived: " $items.Count -ForegroundColor Green
    
        return $items
    }
    
    function Get-Children-By-Template {
        param($parent,$templateId)
        
        $children = Get-ChildItem -Item $parent -Recurse | Where-Object { $_.TemplateId -eq $templateId }
    
        return ,$children
    }
    
    $hotels = Find-Hotels-Items
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
            New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
            New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
                New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                    foreach($hotel in $hotels){
                        $hotelItem = Get-Item -Path "master:" -ID $hotel.ItemId
                        $rooms = Get-Children-By-Template -Parent $hotelItem -TemplateId $accommodationRoomId
    
                        foreach($room in $rooms){
                            $roomTypeId = $room["RoomType"]
    
                            if ($roomTypeId -ne $null -or $roomTypeId -ne ""){
                                $roomTypeItem = Get-Item -Path "master:" -ID $roomTypeId
    
                                if ($roomTypeItem.Paths.LongId.Contains($hotelBedsRoomTypesFolderId)){
                                    Write-Host "Room with ID $($room.ID) is removed"
                                    $room | Remove-Item -Recurse
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    
