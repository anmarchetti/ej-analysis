  Hint: Script
  Value: |
    function GetAccommodationRooms()
    {
        $criteria = @(
            @{Filter = "Equals"; Field ="_templatename"; Value = "Accommodation Rooms Folder"}
        )
    
        $props = @{
            Index = "sitecore_destinations_master_index"
            Criteria = $criteria
        }
    
        $result = New-Object Collections.Generic.List[object] 
    	$rooms = Find-Item @props
        foreach($room in $rooms) 
        {
            $roomItem = $room.GetItem()
            if($roomItem.Name.Contains("HBG"))
            {
                $code = $roomItem["Code"]
                if($code.StartsWith("X9"))
                    {
                        
                    }
                    else
                    {
                        $result.Add([ordered]@{
                        "Hotel name" = $roomItem.Parent.Name
                        "Room Id" = $roomItem.Id
                        "Room Path" = $roomItem.Paths.FullPath
                        code = $code
                        })
                    }
            }
        }
    	return $result
    }
    
    function Download($data)
    {
        Import-Function -Name ConvertTo-Xlsx
    
        [byte[]]$outobject = $data | ForEach-Object { New-Object PSObject -Property $_ } | ConvertTo-Xlsx
        $date = Get-Date -Format "MMddyyyyHHmmss"
        Out-Download -Name "report-$($date).xlsx" -InputObject $outobject 
    }
    
    $indexName = "sitecore_destinations_master_index"
    $result = GetAccommodationRooms
    Download -Data $result
    Write-Host "Script is completed"
