Path: "/sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/WP-61 Clear Accommodation Room Description"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function GetAccommodationRoomsFolder 
    {
        param([String]$indexName)
    
        $criteria = @(
            @{Filter = "Equals"; Field ="_templatename"; Value = "Accommodation Rooms Folder"}
        )
    
        $props = @{
            Index = $indexName
            Criteria = $criteria
        }
    
    	$items = Find-Item @props
    	Write-Host "Number of Accommodation Rooms Folder retrived: " $items.Count -ForegroundColor Green
    	return $items
    }
    
    $indexName = "sitecore_destinations_master_index"
    $folderList = GetAccommodationRoomsFolder -IndexName $indexName
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
        New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
            New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
                New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                    foreach($folder in $folderList) 
                    {
                        $folderItem = $folder.GetItem()
                        foreach($room in $folderItem.Children)
                        {
                            $value = $room.Fields["Description"].Value
                        	if ([string]::IsNullOrEmpty($value))
                            {
                                continue;
                            } 
                            else
                            {
                               $room.Editing.BeginEdit()
                               $room["Description"] = ""
                               $room.Editing.EndEdit()
                            }             	
                        }
                    }
                }
            }
        }   
    }
    
    Write-Host "Script is completed"
