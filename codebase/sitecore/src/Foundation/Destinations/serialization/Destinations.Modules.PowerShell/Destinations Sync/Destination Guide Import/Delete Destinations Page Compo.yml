Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Destination Guide Import/Delete Destinations Page Components
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Delete Page Components Script
    
    #region Delete-Page-Components
    function Delete-Page-Components {
    	param($destinationItems)
    
    	foreach ($searchResultItem in $destinationItems)
    	{
    		$destinationItem = Get-Item -Path master: -Id $searchResultItem.ItemId
    			Delete-Datasources -item $destinationItem
    
    			Write-Host "Deleted datasource for page - " $destinationItem.Paths.FullPath
    	}
    }
    
    #endregion
    
    function Remove-Children-Items {
    	param($Item)
    
    	New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
    		Get-ChildItem -Item $Item | Remove-Item -Recurse
    	}
    }
    
    function Delete-Datasources {
    	param($item)
    
    	#get page component folder
    	$pageComponenFolderItem = Get-Dest-Item -Parent $item -itemName "Page Components"
    
    	if ($pageComponenFolderItem -ne $null) {
    		Remove-Children-Items -Item $pageComponenFolderItem
    	}
    }
    
    #region helper
    function Get-Dest-Item {
    	param($parent,$itemName)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	return $item
    }
    #endregion   
    
    #region Search Destinations 
    function Find-Destinations-Items {
        param($tempateName)
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    		@{ Filter = "Equals"; Field = "_templatename"; Value = $tempateName; }
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    
    	return $items
    }
    #endregion
    
    
    #Find Country Items Skip Greece
    $countryItems = Find-Destinations-Items -tempateName "Country" | ? {$_.Name -ne "Greece"} 
    
    #Find Region Items Skip Santorini
    $regionItems = Find-Destinations-Items -tempateName "Region" |  ? {$_.Name -ne "Santorini"}
    
    #Find Resorts Items Skip Kamari
    $resortItems = Find-Destinations-Items -tempateName "Resort" |  ? {$_.Name -ne "Kamari"}
    
    
    #Delete Country Items
    Delete-Page-Components -destinationItems $countryItems
    
    #Delete Region Items
    Delete-Page-Components -destinationItems $regionItems
    
    #Delete Resorts Items
    Delete-Page-Components -destinationItems $resortItems
