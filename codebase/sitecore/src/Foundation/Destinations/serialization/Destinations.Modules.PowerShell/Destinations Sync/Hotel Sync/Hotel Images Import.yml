ID: "1e406fec-4b7b-49c6-bd7d-43db2643c4ce"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Hotel Images Import
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $bucket = 'easyjet-holidays-public'
    $AKey = '<access key id>'
    $SKey = '<access secret key>'
    $region = 'eu-west-1'
    $urlPath = "https://easyjet-holidays-public.s3-eu-west-1.amazonaws.com/"
    $csvFileName = "S3-Images.1578578566.csv"
    
    $isRemoveImagesMode = $true
    $externalImageTemplate = "{E4B3BB73-22AB-4843-A816-3AA32EDDC7DC}"
    
    $time = Get-Date -UFormat %s -Millisecond 0
    $folderPath = "$($SitecoreDataFolder)\ExportData"
    $logPath = "$($folderPath)\Not_Matched_Hotels_Codes.log.$($time).csv"
    
    #Initialize-AWSDefaultConfiguration -AccessKey $AKey -SecretKey $SKey -Region $region
    $hotelIds = $null
    
    function Find-Hotels-Items {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    	)
    
    	# sitecore_master_index used here because sitecore_destinations_master_index didn't have hotelbedscode field
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    	Write-Host "Number of Hotels retrived: " $items.Count -ForegroundColor Green
    	$itemsHashTable = @{}
    	$items | Select-Object Fields | ForEach-Object {
    		#Contracted hotels
    		if ($_.Fields.ContainsKey("code") -and $_.Fields["code"] -notmatch "X9") {
    			$itemsHashTable[$_.Fields["code"]] = $_.Fields["_uniqueid"]
    		}
    		
    		if ($_.Fields.ContainsKey("hotelbedscode")) {
    			$itemsHashTable[$_.Fields["hotelbedscode"]] = $_.Fields["_uniqueid"]
    		}
    	}
    
    	return $itemsHashTable
    }
    
    function Get-Images-From-S3 {
    	param($BucketName)
    
    	Write-Host "######## Get Images from S3 folder #########" -ForegroundColor Cyan
    
    	$hotels = Get-S3Object -BucketName $BucketName | Where { $_.Key -notmatch "/small/|/large/|/medium/" } |
    	Group-Object -Property { $_.Key.Split('_')[0].trim() } -AsHashTable -AsString
    
    	$data = @{}
    
    	foreach ($key in $hotels.Keys)
    	{
    		$images = New-Object System.Collections.ArrayList
    
    		foreach ($image in $hotels[$key]) {
    			$indexOfFolder = $image.Key.LastIndexOf('/')
    
    			if ($indexOfFolder -ne -1) {
    				$imageData = New-Object ImageData
    
    				$imageData.Name = [System.IO.Path]::GetFileNameWithoutExtension($image.Key)
    				$imageData.Small = $image.Key.Insert($indexOfFolder,"/small")
    				$imageData.Medium = $image.Key.Insert($indexOfFolder,"/medium")
    				$imageData.Large = $image.Key.Insert($indexOfFolder,"/large")
    
    				$images.Add($imageData) | Out-Null
    			}
    
    		}
    		$data.Add($key,$images)
    	}
    
    	Write-Host "######## Images is taken from S3 folder #########" -ForegroundColor Cyan
    
    	return $data
    }
    
    function Get-Images-From-CSV {
    
    	Write-Host "######## Get Images from CSV #########" -ForegroundColor Cyan
    
    	$groupedDataset = @{}
    	#Read *.cvs file
    	$csvFile = $SitecoreDataFolder + "\ImportData\" + $csvFileName
    	$table = Import-Csv $csvFile -Delimiter ","
    	$hotels = $table | Group-Object -Property { $_.Code } -AsHashTable -AsString
    
    	$data = @{}
    
    	foreach ($key in $hotels.Keys)
    	{
    		$images = New-Object System.Collections.ArrayList
    
    		foreach ($image in $hotels[$key]) {
    
    			$imageData = New-Object ImageData
    
    			$imageData.Name = $image.Name
    			$imageData.Small = $image.Small
    			$imageData.Medium = $image.Medium
    			$imageData.Large = $image.Large
    			$images.Add($imageData) | Out-Null
    
    		}
    		$data.Add($key,$images)
    	}
    
    	Write-Host "######## Images is taken from CSV file #########" -ForegroundColor Cyan
    
    	return $data
    }
    
    #region helper
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		New-Item -Parent $parent -Name $itemName -ItemType $templateId
    	}
    
    	return $item
    }
    
    function Remove-Children-Items-ByTemplate {
    	param($Item, $templateId)
    
    	New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
    		Get-ChildItem -Item $Item | Where-Object {$_.TemplateId -eq $templateId -and ![string]::IsNullOrEmpty($_["Code"])} | Remove-Item
    	}
    }
    
    #endregion
    
    class imagedata{
    	[string]$Name
    	[string]$Small
    	[string]$Medium
    	[string]$Large
    }
    
    #Find Destionations Items
    $hotelIds = Find-Hotels-Items
    
    #$images = Get-Images-From-S3 -BucketName $bucket
    $images = Get-Images-From-CSV
    
    Write-Host "Num of Images: " $images.Count -ForegroundColor Green
    
    Write-Host "######## Updating Images #########" -ForegroundColor Cyan
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
    	New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
    		New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
    
    				$notMatchedHotelImages = @()
    				$count = 0
    				foreach ($hotelCode in $images.Keys)
    				{
    
    					$hotelPath = $hotelIds[$hotelCode]
    					if ($hotelPath -ne $null) {
    
    						$hotelItem = Get-Item -Path "master:" -Uri $hotelPath
    
    						#get image folder 
    						$imageFolder = Get-Or-Create-Item -Parent $hotelItem -itemName "Images" -templateId "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}"
    
    						#do not update if images folder contains at least one item 
    						<#if ($imageFolder.Children.Count -gt 0) {
    							continue
    						}
    						else {#>
    							#clear image folder
    							if ($isRemoveImagesMode)
    							{
    								Remove-Children-Items-ByTemplate -Item $imageFolder -templateId $externalImageTemplate
    							}
    
    							try {
    								$imagesData = $images[$hotelCode]
    								foreach ($imageData in $imagesData)
    								{
    									$imageItem = Get-Or-Create-Item -Parent $imageFolder -itemName $imageData.Name -templateId "{E4B3BB73-22AB-4843-A816-3AA32EDDC7DC}"
    
    									$imageItem.Editing.BeginEdit()
    									$imageItem["Small"] = $imageData.Small
    									$imageItem["Medium"] = $imageData.Medium
    									$imageItem["Large"] = $imageData.Large
    									$imageItem.Editing.EndEdit()
    
    
    								}
    							} catch {
    								Write-Host "Can't updated hotel's images with $hotelCode code" -ForegroundColor Red
    								$notMatchedHotelImages += $hotelCode
    								continue
    							}
    
    							Write-Host "Hotel with hotel beds code  $hotelCode updated" -ForegroundColor Cyan
    							$count++
    						#}
    					} else {
    						$notMatchedHotelImages += $hotelCode
    						Write-Host "Hotel with hotel beds $hotelCode was not found" -ForegroundColor Yellow
    					}
    				}
    
    				Write-Host "Updated number of hotels: $count" -ForegroundColor Cyan
    
    				$notMatchedHotelImages | ForEach-Object { [pscustomobject]@{ NotMatchedHotelCodes = $_ } } | Export-Csv -Path $logPath -Delimiter ',' -NoTypeInformation
    		}
    	}
    } 
