  Value: |
    $criteria = @(
    	@{ Filter = "Equals"; Field = "_templatename"; Value = "Hotel"; }
    	@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    )
    
    $props = @{
    	Index = "sitecore_destinations_master_index"
    	Criteria = $criteria
    }
    
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
    }
    
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $sign, $specificPlaceholder){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if($index -gt 0)
                {
                    $incrementIndex = $index
                    if ($sing -ne 0){
                        $incrementIndex = $index + $sign
                    }
                
                    if($specificPlaceholder -ne $null){
                        Add-New-Rendering -Item $item -Placeholder "$($_.Placeholder)/$($specificPlaceholder)-$($_.UniqueId)-0" -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex 
                    }
                    else{
                        Add-New-Rendering -Item $item -Placeholder $_.Placeholder -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex
                    }
                }
                return
            }
        }
    }
    
    $items = Find-Item @props | ForEach-Object { Get-Item -Path master: -Id $_.ItemID }
    Write-Host "$($items.Count) hotels were found"
    
     $data= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Share Holiday Button" -ErrorAction SilentlyContinue
    
    if ($data -ne $null){
       foreach ($item in $items)
    {
    	
    Add-Rendering-To -Item $item -RenderingId "{9DD28F7B-516B-4C51-87E9-3FC748CF9112}" -NewRenderingId "{8FC67B08-BA02-4D1C-B5A2-BC0CA048E3C2}" -Datasource $data.ItemPath -Sign 0 -SpecificPlaceholder "share-holiday-button"
    
    } 
    }
    
    
