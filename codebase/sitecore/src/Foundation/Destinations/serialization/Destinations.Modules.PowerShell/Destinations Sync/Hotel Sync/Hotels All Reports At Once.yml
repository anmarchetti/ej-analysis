---
ID: "d6a42362-b40b-4130-9e93-3b54963e068a"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Hotels All Reports At Once
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function -Name ConvertTo-Xlsx
    Import-Function -Name Export-Xlsx
    
    # Accessible reports
    $dataReportName = "Data"
    $roomsReportName = "Rooms"
    $imagesReportName = "Images"
    $boardsReportName = "Boards"
    $facilitiesReportName = "Facilities"
    
    $reportNameRoots = @($dataReportName, $roomsReportName, $imagesReportName, $boardsReportName, $facilitiesReportName) # Remove not needed report names to genenerate only needed reports
    
    $folderPath = "$($SitecoreDataFolder)\ExportData"
    
    
    $imagesFolderTemplateId = "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}"
    $facilityFolderTemplateId = "{5C397782-6810-460A-AB57-84E9AB67514C}"
    $roomsFolderTemplateId = "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"
    $boardsFolderTemplateId = "{AA2B6E6C-AE94-4E48-AE95-D77DA154FE9B}"
    
    $roomTypeIdToRoomCodeMapper = @{}
    $facilityTypeIdToFacilityNameCodeMapper = @{}
    
    function Create-Data-Folder {
    	param($path)
    	if (!(Test-Path $path))
    	{
    		New-Item -ItemType Directory -Force -Path $path
    	}
    }
    
    function Find-Hotels-Items {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    		@{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
    		@{ Filter = "Equals"; Field = "_name"; Value = "__Standard Values"; "Invert" = $true}
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    
    	Write-Host "$($items.Count) Hotels were found"
    
    	return $items
    }
    
    function Prepare-Data {
    	param($items, $numberOfReports, $neededReportNames)
    
        [array[]]$rows = @()
    
        for($i = 0; $i -lt $numberOfReports; $i++){
            $rows += ,@()
        }
        
    	foreach ($searchResultItem in $items) {
    
            $item = Get-Item -Path master: -Id $searchResultItem.ItemId
            
            $reportsRows = Get-Data-From-Item -Item $item -NeededReportNames $neededReportNames
            
            $i = 0
    
            foreach($reportRows in $reportsRows){
                $reportRows | ForEach-Object { $rows[$i] += ,$_ }
                $i++
            }
    	}
    
    	Write-Host "Hotel's report has been prepared"
    
    	return ,$rows
    }
    
    
    function Get-Browse-Url {
    	param($item)
    	$path = $item.Paths.ContentPath -replace "/EasyJet/Holidays/Home/Destinations/",$sitePath
    	$validPath = $path -replace "\s+",'-'
    	return $validPath.ToLower()
    }
    
    function Get-Children-By-Parent-Template {
    	param($parent,$templateId)
        
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.TemplateId -eq $templateId } | Select -First 1
    
    	return $item.Children
    }
    
    function Get-Children-Count-By-Template-Deep {
    	param($parent, $childTemplateId)
        
    	$childItems = Get-ChildItem -Item $parent | Where-Object {$_.TemplateId -eq $childTemplateId}
    	
    	if ($childItems -eq $null){
    	    return 0
    	}
    	
    	return $childItems.Children.Count
    }
    
    function Get-S3-Images-Count
    {
    	param($images)
    
    	if ($images -eq $null)
    	{
    		return 0
    	}
    
    	$s3Images = $images | Where { $_['Small'].Contains('amazonaws.com') }
    
    	if ($s3Images -eq $null)
    	{
    		return 0
    	}
    
    	return $s3Images.Count
    }
    
    function Get-Room-Name-Type{
        param($room)
    
        $name = $room.Fields["Name"].Value
    
        $type = Get-Room-Code -Room $room
    
        $result = @{}
        $result.Add("UniqueId", $room.ID)
        $result.Add("Name", $name)
        $result.Add("Type", $type)
    
        return $result
    }
    
    
    function Get-Board-Name-Description
    {
        param($board)
    
        $name = $board.Name
        $description = $board.Fields["Description"].Value
    
        $result = @{}
        $result.Add("Name", $name)
        $result.Add("Description", $description)
    
        return $result
    }
    
    function Get-Facility-Data {
        param($facility)
        
        
        $facilityTypeItem = $null
        
        $facilityTypeId = $facility.Fields["FacilityType"].Value
    
        $facilityName = ""
        $facilityCode = ""
    
        if($facilityTypeId -ne ""){
    
            if ($facilityTypeIdToFacilityNameCodeMapper.ContainsKey($facilityTypeId)){
                $fd = $facilityTypeIdToFacilityNameCodeMapper[$facilityTypeId]
                $facilityName = $fd["Name"]
                $facilityCode = $fd["Code"]
            }else{
                $facilityTypeItem = Get-Item "master:" -ID $facilityTypeId
    
                if($facilityTypeItem -ne $null)
                {
                    $facilityName = $facilityTypeItem.Fields["Name"].Value
    
                    if($facilityName -eq ""){
                        $facilityName = $facilityTypeItem.Name
                    }
    
                    $facilityCode = $facilityTypeItem.Fields["Code"].Value
                    
                    $fd = @{}
                    $fd.Add("Name", $facilityName)
                    $fd.Add("Code", $facilityCode)
                    $facilityTypeIdToFacilityNameCodeMapper.Add($facilityTypeId, $fd)
                }
            }
        }
        
        $result = @{}
        $result.Add("FacilityName", $facilityName)
        $result.Add("FacilityCode", $facilityCode)
        $result.Add("Distance", $facility.Fields["Distance"].Value)
        $result.Add("ShowOnSite", $facility.Fields["ShowOnSite"].Value)
    
        return $result
    }
    
    function Get-Image-Data
    {
        param($image, $roomcode)
        
        $result = @{}
        $result.Add("ItemName", $image.Name)
        $result.Add("RoomCode", $roomcode)
        $result.Add("Small", $image.Fields["Small"])
        $result.Add("Medium", $image.Fields["Medium"])
        $result.Add("Large", $image.Fields["Large"])
        $result.Add("ShowOnSite", $image.Fields["ShowOnSite"])
        
        return $result
    }
    
    function Get-Room-Code
    {
        param($room)
        
        $roomTypeId = $room.Fields["RoomType"].Value
        $typeItem = $null
        $type = ""
    
    
        if ($roomTypeId -ne ""){
            if($roomTypeIdToRoomCodeMapper.ContainsKey($roomTypeId)){
                $type = $roomTypeIdToRoomCodeMapper[$roomTypeId]
            }else{
    
                    $typeItem = Get-Item -Path "master:" -ID $roomTypeId     
                    if ($typeItem -ne $null) 
                    {
                        $type = $typeItem.Fields["Code"].Value
                    }    
    
                $roomTypeIdToRoomCodeMapper.Add($roomTypeId, $type)
            }            
        }
        
        return $type
    }
    
    function Get-Room-Images
    {
        param($room)
        
        $room_images_folder = $room.Children | Where-Object { $_.TemplateId -eq $imagesFolderTemplateId }
        
        if($room_images_folder -ne $null){
            return $room_images_folder.Children
        }
    }
    
    function GetAirports ($value) {
    	$ids = $value.Split("|")
    	$airports = @()
    	$names = @()
    	$ids | ForEach-Object {
    		if (![string]::IsNullOrEmpty($_)) {
    			$airports += Get-Item master: -Id $_
    		}
    	}
    
    	$airports | ForEach-Object {
    		$names += $_.Name
    	}
    
    	$result = [system.String]::Join(", ",$names)
    	$result
    }
    
    function Get-Hotels-Data-Report-Data
    {
        param($hotel, $images, $facilities, $rooms, $boards)
    
        $rooms_images_count = 0
        
        if($rooms -ne $null){
    
            $rooms | ForEach-Object { Get-Children-Count-By-Template-Deep -Parent $_ -childTemplateId $imagesFolderTemplateId } | ForEach-Object { $rooms_images_count += $_ }
            
        }
        
    	$data = [ordered]@{
    		ATCom = $item['Code']
    		HBG = $item['HotelBedsCode']
    		TripAdvisorId = $item['TripAdvisorId']
    		HotelName = $item["Name"]
    		Description = $item['HotelDescription']
    		BrowseUrl = Get-Browse-Url -Item $item
    		VersionNumber = $item.Versions.Count
    		IsExternalAccommadation = [System.Convert]::ToBoolean([int]$item["ExternalAccommodation"].Value)
    		NumberOfSubfolder = $item.Children.Count
    		CountOfImages = $images.Count #Image Folder TemplateId
    		CountOfFacilities = $facilities.Count #Facility Folder TemplateId
    		CountOfRooms = $rooms.Count #Room Folder TemplateId
    		CountOfBoards = $boards.Count #Board Folder TemplateId
    		Airports = GetAirports ($item['Airports'])
    		Lat = $item['Latitude']
    		Long = $item['Longitude']
    		Strapline = $item['Strapline']
    		KSP1 = $item['KeySellingPoint1']
    		KSP2 = $item['KeySellingPoint2']
    		HotelStarRating = $item['StarRating']
    		TripAdviserRating = $item['HotelRating']
    		RestortCode = $item.Parent['Code']
    		CountOfImagesFromS3 = Get-S3-Images-Count -images $images
    		CountOfImagesInRooms = $rooms_images_count
    	}
    
        return $data
    }
    
    function Get-Hotels-Rooms-Data
    {
        param($hotel, $rooms)
    
        $rooms_data = @()
        $images_per_room = @{}
        
        if($rooms -ne $null){
    
            foreach($room in $rooms)
            {
                $images_count = Get-Children-Count-By-Template-Deep -Parent $room -childTemplateId $imagesFolderTemplateId
                $room_id = $room.ID
                $images_per_room.Add($room_id, $images_count)
            }
            
            $rooms_data = $rooms | ForEach-Object { Get-Room-Name-Type -Room $_ }
        }
        
        
        $data = @()
        
        $atcomValue = $item['Code']
        $hotelNameValue = $item['Name']
    
        if($rooms_data.Count -eq 0){
        	$data += [ordered]@{
        		ATCom = $atcomValue
        		HotelName = $hotelNameValue
        		ImagesPerRoom = 0
        		RoomName = ""
        		RoomType = ""
        	}
        } else {
            foreach($room_data in $rooms_data){
                
                $data += [ordered]@{
                    ATCom = $atcomValue
            		HotelName = $hotelNameValue
            		ImagesPerRoom = $images_per_room[$room_data["UniqueId"]]
            		RoomName = $room_data["Name"]
            		RoomType = $room_data["Type"]
                }
            }
        }
    
        return $data
    }
    
    function Get-Hotels-Images-Data
    {
        param($hotel, $images)
    
        $images_data = @()
    	$images_data += $images | Where-Object { $_ -ne $null} | ForEach-Object { Get-Image-Data -Image $_ -RoomCode "" }
    	
    	
    	$rooms | Where-Object  {$_ -ne $null } | ForEach-Object { 
    
    	    $room_code = Get-Room-Code -Room $_
    	    
    	    
    	    $room_images = @()
    	    $room_images += Get-Room-Images $_
    
            foreach($room_image in $room_images){
    	        $images_data += Get-Image-Data -Image $room_image -RoomCode $room_code
    	    }
    	}
    	
        
        $data = @()
    
        $atcomValue = $item['Code']
        $hotelNameValue = $item['Name']
        
        if($images_data.Count -eq 0){
        	$data += [ordered]@{
        		ATCom = $atcomValue
        		HotelName = $hotelNameValue
        		RoomCode = ""
        		ItemName = ""
        		Small = ""
        		Medium = ""
        		Large = ""
        		ShowOnSite = ""
        	}
        }
        else{
    
            foreach($image_data in $images_data){
                
                $data += [ordered]@{
                    ATCom = $atcomValue
            		HotelName = $hotelNameValue
            		RoomCode = $image_data["RoomCode"]
            		ItemName = $image_data["ItemName"]
            		Small = $image_data["Small"]
            		Medium = $image_data["Medium"]
            		Large = $image_data["Large"]
            		ShowOnSite = $image_data["ShowOnSite"]
                }
            } 
        }
    
        return $data
    }
    
    function Get-Hotels-Boards-Data
    {
        param($hotel, $boards)
    
        $boards_data = @()
    	
    	if ($boards -ne $null){
    	    $boards_data += $boards | ForEach-Object {Get-Board-Name-Description -Board $_ }  
        }
        
        $data = @()
    
        $atcomValue = $item['Code']
        $hotelNameValue = $item['Name']
    
        if($boards_data.Count -eq 0){
        	$data += [ordered]@{
        		ATCom = $atcomValue
        		HotelName = $hotelNameValue
        		BoardName = ""
        		BoardDescription = ""
        	}
        }else{
            foreach($board_data in $boards_data){
                $data += [ordered]@{
                    ATCom = $atcomValue
            		HotelName = $hotelNameValue
            		BoardName = $board_data["Name"]
            		BoardDescription = $board_data["Description"]
                }
            }
        }
    
        return $data
    }
    
    function Get-Hotels-Facilities-Data
    {
        param($hotel, $facilities)
    
        $facilities_data = @()
    	$facilities_data += $facilities | Where-Object {$_ -ne $null } | ForEach-Object { Get-Facility-Data $_ }
    	
        $data = @()
        
        $atcomValue = $item['Code']
        $hotelNameValue = $item['Name']
    
        if($facilities_data.Count -eq 0){
        	$data += [ordered]@{
        		ATCom = $atcomValue
        		HotelName = $hotelNameValue
        		FacilityName = ""
        		Distance = ""
        		ShowOnSite = ""
        	}
        }else{
            foreach($facility_data in $facilities_data){
                $data += [ordered]@{
                    ATCom = $atcomValue
            		HotelName = $hotelNameValue
            		FacilityName = $facility_data["FacilityName"]
            		FacilityCode = $facility_data["FacilityCode"]
            		Distance = $facility_data["Distance"]
            		ShowOnSite = $facility_data["ShowOnSite"]
                }
            }
        }
    
        return $data
    }
    
    function Get-Data-From-Item
    {
    	param($item, $neededReportNames)
    
    	# hotel' child folders
    	$images = Get-Children-By-Parent-Template -Parent $item -templateId $imagesFolderTemplateId
    	$facilities = Get-Children-By-Parent-Template -Parent $item -templateId $facilityFolderTemplateId
    	$rooms = Get-Children-By-Parent-Template -Parent $item -templateId $roomsFolderTemplateId
    	$boards = Get-Children-By-Parent-Template -Parent $item -templateId $boardsFolderTemplateId
        
        $data = @()
    
        $hotelsDataReport = @()
        $hotelsRoomsReport = @() 
        $hotelsImagesReport = @()
        $hotelsBoardsReport = @()
        $hotelsFacilitiesReport = @()
    
        if($neededReportNames -contains $dataReportName){
            $hotelsDataReport += Get-Hotels-Data-Report-Data -Hotel $item -Images $images -Facilities $facilities -Rooms $rooms -Boards $boards
        }
    
        if($neededReportNames -contains $roomsReportName){
            $hotelsRoomsReport += Get-Hotels-Rooms-Data -Hotel $item -Rooms $rooms
        }
    
        if($neededReportNames -contains $imagesReportName){
            $hotelsImagesReport += Get-Hotels-Images-Data -Hotel $item -Images $images
        }
    
        if($neededReportNames -contains $boardsReportName){
            $hotelsBoardsReport += Get-Hotels-Boards-Data -Hotel $item -Boards $boards
        }
    
        if($neededReportNames -contains $facilitiesReportName){
            $hotelsFacilitiesReport += Get-Hotels-Facilities-Data -Home $item -Facilities $facilities
        }
    
        $data = ,@($hotelsDataReport, $hotelsRoomsReport, $hotelsImagesReport, $hotelsBoardsReport, $hotelsFacilitiesReport) |  Where {$_.Count -ne 0}
    
    	return ,$data
    }
    
    function Save-Reports-As-Xlsx{
        param($reports, $reportNameRoots)
    
        $i = 0
    
        $objectsWithDataToDownload = @()
    
        $time = Get-Date -UFormat %s -Millisecond 0
        foreach($report in $reports){
            if($reportNameRoots[$i] -ne $null){
            $filename = "Hotel$($reportNameRoots[$i++])Report_$time.xlsx"
            $resultPath = "$($folderPath)\$($filename)"
    
            $objectWithData = $report | ForEach-Object { New-Object PSObject -Property $_ }
            
            $objectWithData | Export-Xlsx -Path $resultPath # Export objectWithData in Xlsx format to file system on server
            Write-Host "Report is saved on file system to $($resultPath)"
            
                if ($objectWithData -ne $null){
                    $dict = @{}
                    $dict.Add('Filename', $filename)
                    $dict.Add('ObjectWithData', $objectWithData)
                
                    $objectsWithDataToDownload += ,$dict
                }
            }
        }
    
        return ,$objectsWithDataToDownload
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    #find hotels items
    $items = Find-Hotels-Items
    #Prepare items to table format
    $reports = Prepare-Data -items $items -NumberOfReports $reportNameRoots.Count -NeededReportNames $reportNameRoots | Where-Object { $_.Count -ne 0 }
    
    Create-Data-Folder -Path $folderPath
    
    $outobjects = Save-Reports-As-Xlsx -Reports $reports -ReportNameRoots $reportNameRoots
    
    $stopWatch.Stop()
    Write-Output "Info: Elapsed time - $($StopWatch.Elapsed)" 
    
    foreach($outobject in $outobjects){
        [byte[]]$outobjectDownload = $outobject['ObjectWithData'] | ConvertTo-Xlsx # Prepare objectWithData to be downloaded by user.
        Out-Download -Name $outobject['Filename'] -InputObject $outobjectDownload
    }
