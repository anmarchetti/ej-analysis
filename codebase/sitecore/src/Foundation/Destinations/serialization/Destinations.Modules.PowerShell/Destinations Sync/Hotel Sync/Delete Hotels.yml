ID: "12867f03-6861-4bd2-b5eb-be967a08bfda"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Delete Hotels
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $filePath = "$SitecoreDataFolder\ImportData\Duplicate Hotels to Delete.csv"
    
    $criteria = @(
    	@{ Filter = "Equals"; Field = "_templatename"; Value = "Hotel"; }
    	@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    )
    
    $props = @{
    	Index = "sitecore_destinations_master_index"
    	Criteria = $criteria
    }
    
    $items = Find-Item @props | ForEach-Object { Get-Item -Path master: -Id $_.ItemId }
    
    Write-Host "Find $($items.Count) hotels"
    
    $atcomCodeList = @{}
    Import-Csv $filePath -Delimiter ',' | ForEach-Object { $atcomCodeList[$_.'ATCom'] =
    	@{
    		Atcom = $_.'ATCom'
    		HotelName = $_.'HotelName'
    		ResortCode = $_.'RestortCode'
    	}
    }
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
    	New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
    		New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
    			New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
    
    				$count = 0
    				foreach ($item in $items)
    				{
    
    					$hotel = $atcomCodeList[$item["Code"]]
    					
    					if ($hotel -ne $null -and $hotel.HotelName -eq $item["Name"] -and $item.Parent["Code"] -eq $hotel.ResortCode)
    					{
    						Write-Host "Delete hotel with $($item['Code']) - $($item['Name']) code - Resort $($item.Parent['Code'])"
    
    						$item | Remove-Item -Permanently -Recurse
    
    						$count++
    
    					}
    				}
    
    
    				Write-Host "$count Hotels are successfully removed!"
    			}
    		}
    	}
    }
    
