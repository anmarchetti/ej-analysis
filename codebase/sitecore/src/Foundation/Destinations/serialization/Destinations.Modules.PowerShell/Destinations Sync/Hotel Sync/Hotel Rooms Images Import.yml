---
ID: "75551fee-37d8-4d19-afdd-e07e1f712615"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Hotel Rooms Images Import
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $csvFileName = "S3-Rooms-Images.1576833722.csv"
    
    $externalImageTemplate = "{E4B3BB73-22AB-4843-A816-3AA32EDDC7DC}"
    
    $time = Get-Date -UFormat %s -Millisecond 0
    $folderPath = "$($SitecoreDataFolder)\ExportData"
    $logPath = "$($folderPath)\Not_Matched_Hotels_Codes.log.$($time).csv"
    
    $hotelIds = $null
    
    function Find-Hotels-Items {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607"; }
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    	Write-Host "Number of Hotels retrived: " $items.Count -ForegroundColor Green
    
    	return $items
    }
    
    #region helper
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		New-Item -Parent $parent -Name $itemName -ItemType $templateId
    	}
    
    	return $item
    }
    
    function Remove-Children-Items-ByTemplate {
    	param($Item,$templateId)
    
    	New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
    		Get-ChildItem -Item $Item | Where-Object { $_.TemplateId -eq $templateId } | Remove-Item
    	}
    }
    
    #endregion
    
    function Get-Images-From-CSV {
    
    	Write-Host "######## Get Images from CSV #########" -ForegroundColor Cyan
    
    	$groupedDataset = @{}
    	#Read *.cvs file
    	$csvFile = $SitecoreDataFolder + "\ImportData\" + $csvFileName
    	$table = Import-Csv $csvFile -Delimiter ","
    	$hotels = $table | Group-Object -Property { $_.HotelCode } -AsHashTable -AsString
    
    	$data = @{}
    
    	foreach ($key in $hotels.Keys)
    	{
    		$images = New-Object System.Collections.ArrayList
    
    		foreach ($image in $hotels[$key]) {
    
    			$imageData = New-Object ImageData
    
    			$imageData.RoomCode = $image.RoomCode
    			$imageData.Small = $image.Small
    			$imageData.Medium = $image.Medium
    			$imageData.Large = $image.Large
    			$images.Add($imageData) | Out-Null
    
    		}
    		$data.Add($key,$images)
    	}
    
    	Write-Host "######## Images is taken from CSV file #########" -ForegroundColor Cyan
    
    	return $data
    }
    
    class imagedata{
    	[string]$RoomCode
    	[string]$Small
    	[string]$Medium
    	[string]$Large
    }
    
    #Find Destionations Items
    $hotels = Find-Hotels-Items
    
    $images = Get-Images-From-CSV
    
    Write-Host "Num of Images: " $images.Count -ForegroundColor Green
    
    Write-Host "######## Updating Hotel's Room Images #########" -ForegroundColor Cyan
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
    	New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
    			New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
                    New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
    				$count = 0
    				foreach ($hotel in $hotels)
    				{ try {
    						$hotelItem = Get-Item -Path "master:" -Id $hotel.ItemID
    						$imageData = $images[$hotelItem["Code"]]
    						if ($hotelItem -ne $null -and $imageData -ne $null) {
    
    							#get room folder
    							$roomFolder = Get-Or-Create-Item -Parent $hotelItem -itemName "Rooms" -templateId "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"
    
    							foreach ($roomItem in $roomFolder.Children) {
    								$roomTypeItem = Get-Item -Path "master:" -Id $roomItem["RoomType"]
    
    								$imageRoomsData = $imageData | Where-Object { $_.RoomCode -like "$($roomTypeItem['Code'])*" }
    								if ($imageRoomsData -ne $null) {
    									$imageFolder = Get-Or-Create-Item -Parent $roomItem -itemName "Images" -templateId "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}"
    
    									foreach ($imageRoom in $imageRoomsData)
    									{
    										$imageItem = Get-Or-Create-Item -Parent $imageFolder -itemName $imageRoom.RoomCode -templateId "{E4B3BB73-22AB-4843-A816-3AA32EDDC7DC}"
    
    										$imageItem.Editing.BeginEdit()
    										$imageItem["Small"] = $imageRoom.Small
    										$imageItem["Medium"] = $imageRoom.Medium
    										$imageItem["Large"] = $imageRoom.Large
    										$imageItem.Editing.EndEdit()
    									}
    								}
    							}
    							Write-Host $hotelItem["Code"] "Hotel rooms updated" -ForegroundColor Cyan
                                $count++
    						}
    						else {
    							Write-Host $hotelItem["Code"] "for this hotel does not find images" -ForegroundColor Yellow
    						}
    					} catch {
    						Write-Host $_.Exception.Message $hotelItem["Code"]
    						continue
    					}
    				}
                   Write-Host "$count Hotels have been updated" -ForegroundColor Cyan
    			}
    	}
    	}
    } 
