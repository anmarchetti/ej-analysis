ID: "cc34df64-38bf-4d14-919e-752ee4b7541f"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Delete Zero Links Facilities
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $deleteFacilityWithZeroLinks = $true
    $facilityTypesFolderPath = "master:/sitecore/content/EasyJet/Holidays/Data/Facility Types"
    $facilityTypesGroupTemplateId = "{7E1CEEB8-9A59-4584-91E8-6014A5B0FF56}"
    
    function Get-Children-From-Folder-By-Folder-Template {
        param($parent,$templateId)
        
        $items = Get-ChildItem -Item $parent | Where-Object { $_.TemplateId -eq $templateId }
    
        $children = @()
    
        $items | ForEach-Object {$children += $_.Children}
    
        return ,$children
    }
    
    $facilityTypesFolderItemExists = Test-Path -Path $facilityTypesFolderPath
    
    if ($facilityTypesFolderItemExists){
        $facilityTypesFolderItem = Get-Item -Path $facilityTypesFolderPath
            New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
                New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
                    New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
                        New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                                $facilityTypeItems = Get-Children-From-Folder-By-Folder-Template -Parent $facilityTypesFolderItem -TemplateId $facilityTypesGroupTemplateId
    
                                foreach($facilityTypeItem in $facilityTypeItems){
                                    try {
                                        $links = Get-ItemReferrer -Item $facilityTypeItem
    
                                        if ($links.Count -eq 0){
                                            Write-Host "Facility Type with id $($facilityTypeItem.ID) has 0 links"
    
                                            if ($deleteFacilityWithZeroLinks){
                                                $facilityTypeItem | Remove-Item
                                                Write-Host "Facility item has deleted"
                                            }
                                        }
                                    } catch [System.NullReferenceException]{
                                        Write-Host "Facility type item with $($facilityTypeItem.ID) contains broken links"
                                    }
                                }
                        }
                    }
                }
            }
    }else{
        Write-Host "Facility folder not exist"
    }
    
    
