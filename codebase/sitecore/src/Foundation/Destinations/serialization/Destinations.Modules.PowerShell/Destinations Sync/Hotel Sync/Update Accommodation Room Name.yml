---
ID: "d8822b5f-4ed9-42bb-bc39-ec8f5036eddf"
Parent: "4c10d78f-07b6-469e-929f-cb4b460bb11e"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Update Accommodation Room Name
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $filePath = "$($SitecoreDataFolder)\ImportData\Room_name_header.csv"
    $roomsFolderTemplateId = "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"
    $roomTypeTemplateId = "{85911381-FCEA-453C-89A7-D8B86532EBE0}"
    $roomItemTemplateId = "{BA1EC5C3-14C7-40B3-8B69-D020590DA1F3}"
    
    $atcomTypeFolder = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Room Types/Atcom"
    
    function Get-Or-Create-ReferenceType-ByCode {
    	param($parent,$itemName, $code,$name, $templateId)
        
    	if ($roomTypes[$code] -ne $null) {
    		return $roomTypes[$code]
    	}
        
        $validName = [Sitecore.Data.Items.ItemUtil]::ProposeValidItemName($itemName)
    	$referenceItem = New-Item -Parent $parent -Name $validName -ItemType $templateId
    
    	$referenceItem.Editing.BeginEdit()
    	$referenceItem["Code"] = $code
    	$referenceItem["Name"] = $name
    	$referenceItem.Editing.EndEdit()
    	
    	$roomTypes[$code] += $referenceItem
    
    	return $referenceItem
    }
    
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		$validName = [Sitecore.Data.Items.ItemUtil]::ProposeValidItemName($itemName)
    		return New-Item -Parent $parent -Name $validName -ItemType $templateId
    	}
    
    	return $item
    }
    
    function Get-ReferenceTypes {
    	param($parent)
    
    	$referenceTypes = @{}
    	foreach ($item in $parent.GetChildren()) {
    		if (![string]::IsNullOrEmpty($item["Code"])) {
    			$referenceTypes[$item["Code"]] = $item
    		}
    	}
    	return $referenceTypes
    }
    
    function get-items($templateName, $path){
        $criteria = @(
            @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
            @{ Filter = "Equals"; Field = "_templatename"; Value = $templateName; }
            @{ Filter = "StartsWith"; Field = "_fullpath"; Value = $path; }
        )
    
        $props = @{
            Index = "sitecore_destinations_master_index"
            Criteria = $criteria
        }
        $items = Find-Item @props
        return $items
    }
    
    function get-hotel-items(){
        return get-items -TemplateName "Hotel" -Path "/sitecore/content/EasyJet/Holidays/Home/Destinations/"
    }
    
    function Import-Accommodations-Csv-File {
    	param($filePath)
    	$hashTable = @{}
    
    	$csvFile = Import-Csv $filePath -Delimiter ','
    
    	foreach ($row in $csvFile) {
            $hotelId = $row.'ACCOM_CODE'
            if(![string]::IsNullOrEmpty($hotelId)){
                $hashValue=$NULL
                $room=@{
    		                Code=$row.'ROOM_CODE'
    		                Name=$row.'ROOM_NAME'
    		          }
                if($hashTable.ContainsKey($hotelId) -ne $true)
                {
    		        $hashValue = New-Object Collections.Generic.List[Object]
    		        $hashValue.add($room)
    		        $objTemp = @{ $hotelId = $hashValue }
    		        $hashTable += $objTemp
                }
                else {
                    $hashTable[$hotelId].add($room)
                }
    
            }
    	}
    	return $hashTable
    }
    
    function create-room-item{
        
        param($roomsFolder, $roomData, $atcomTypeFolder)
        $roomItem = Get-Or-Create-Item $roomsFolder $roomData['Name'] $roomItemTemplateId
                    
        $roomType = Get-Or-Create-ReferenceType-ByCode $atcomTypeFolder "$($roomData.Code) - $($roomData.Name)" $roomData.Code $roomData.Name $roomTypeTemplateId
        	
        $roomItem.Editing.BeginEdit()
        $roomItem.Fields['Name'].Value = $roomData.Name
        $roomItem.Fields['RoomType'].Value = $roomType.Id
        
        $wasEdited=$roomItem.Editing.EndEdit()
        
        if($wasEdited)
        {
            Write-Host "item: $($roomitem.Name)  $($roomitem.Id) was created."
        }
    }
    
    function update-accommodation-room-name($accommodations, $hotelItems)
    {
        ForEach ($searchResultItem in $hotelItems) 
        {
            if (($accommodations.keys -contains $searchResultItem['Code_s']) -ne $true){
                continue
            }
            
            $item = Get-Item -Path master: -ID $searchResultItem.ItemId
            
            $roomsFolder = $item.GetChildren() | Where-Object {$_.TemplateName -eq "Accommodation Rooms Folder"} | Select -First 1
    
            if($roomsFolder -ne $null)
            {
                $roomsFolderChildrenCodesItems = @{}
                
                $roomsFolder.GetChildren() | ForEach {
                    $roomTypeId = $_.Fields['RoomType'].Value
                    
                    if (![string]::IsNullOrEmpty($roomTypeId)){
                        $roomType = Get-Item -Path "master:" -ID $roomTypeId
                        $roomsFolderChildrenCodesItems[$roomType.Fields['Code'].Value] = $_
                    }
                }
                
                
                ForEach($roomData in $accommodations[$item.Fields['Code'].Value])
                {
                    if ($roomsFolderChildrenCodesItems.keys -contains $roomData.Code){
                            $roomItem = $roomsFolderChildrenCodesItems[$roomData.Code]
                            $roomItem.Editing.BeginEdit()
                            $roomItem.Fields['Name'].Value=$roomData.Name
                            $wasEdited=$roomItem.Editing.EndEdit()
                            if($wasEdited)
                            {
                                Write-Host "item: $($roomitem.Name)  $($roomitem.Id) was updated"
                            }
                    }else{
                        create-room-item $roomsFolder $roomData $atcomTypeFolder
                    }
                }
                
            } else {
                $roomsFolder = Get-Or-Create-Item $searchResultItem.GetItem() "Rooms" $roomsFolderTemplateId
                
                ForEach($roomData in $accommodations[$item.Fields['Code'].Value]){
                    
                    create-room-item $roomsFolder $roomData $atcomTypeFolder
                }
            }
        }
    }
    
    $roomTypes = Get-ReferenceTypes -Parent $atcomTypeFolder
    $accommodations = Import-Accommodations-Csv-File $filePath
    $hotelItems = get-hotel-items
    
    update-accommodation-room-name -Accommodations $accommodations -HotelItems $hotelItems
    
    Write-Host "Script is completed."
