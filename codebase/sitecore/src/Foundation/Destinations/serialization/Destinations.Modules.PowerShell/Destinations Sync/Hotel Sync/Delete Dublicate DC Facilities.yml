Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Destinations Sync/Hotel Sync/Delete Dublicate DC Facilities
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #before run this script make sure that database is relinked
    
    $turnOffEvents = $true
    $items = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Data/Facility Types/DC Facilities"
    
    $hashTable = @{}
    
    function DeleteDuplicateDcFacilities {
        foreach ($item in $items) {
        	if ($hashTable[$item["Code"]] -ne $null) {
        		$newItem = $hashTable[$item["Code"]]
        		$links = Get-ItemReferrer -Item $item -ItemLink
        		foreach ($link in $links)
        		{
        			$linkedItem = Get-Item -Path master:\ -Id $link.SourceItemID
        			$itemField = $linkedItem.Fields[$link.SourceFieldID]
        			$field = [Sitecore.Data.Fields.FieldTypeManager]::GetField($itemField)
        
        			#change link
        			$linkedItem.Editing.BeginEdit()
        			$field.Relink($link,$newItem)
        			$linkedItem.Editing.EndEdit() | Out-Null
        			Write-Host "Item with ID: $($linkedItem.ID) is relinked"
        		}
        		#remove duplicate
        		$path = $item.Paths.FullPath
        		Write-Host $path "Deleted"
        	    $item | Remove-Item 
        	} else {
        		$hashTable[$item["Code"]] = $item
        	}
        } 
    }
    
        if ($turnOffEvents) {
            New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
                New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
                    New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                        DeleteDuplicateDcFacilities
                    }
                }
            }
        } else {
            DeleteDuplicateDcFacilities  
        }
    
    
