Path: /sitecore/system/Modules/PowerShell/Script Library/Dialogs/ResolveBlob
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    $blobId = "6AD6D276-D598-4DEE-BB7F-5D5F030BE0F7"
    
    
    $items = Get-ChildItem -Path "master:/sitecore/media library" -Recurse | Where-Object { $_.Fields["Blob"] -ne $null }
    
    
    $matchedItems = $items | Where-Object { $_.Fields["Blob"].Value -eq $blobId }
    
    
    foreach ($item in $matchedItems) {
        Write-Host "Gefunden: $($item.Paths.FullPath)"
    }
    
