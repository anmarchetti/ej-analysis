      Value: |
        <p>We're following the <a rel="noopener noreferrer" href="https://www.gov.uk/foreign-travel-advice/israel" target="_blank">latest travel advice for Israel</a> and in line with this, we've paused any new and existing holidays there until later in the year for now. We'll continue to carefully review our operations given the situation.</p>
        <p>For customers with existing bookings, we're reviewing these on a rolling basis. If we need to cancel your holiday, we'll contact you directly. If you're wanting to go ahead and make a change to your booking, choose an alternative destination, or cancel your holiday for easyJet holidays credit, you can do so as part of our <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/why-book-with-us" target="_blank">Ultimate Flexibility</a>. View <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/help?helpCategory=changes&amp;helpQuestion=amend" target="_blank">our help centre</a> to find out how.</p>
        <p>We'd also recommend keeping up to date with the UK's Foreign, Commonwealth and Development Office travel advice for official guidance on travel to Israel or nearby countries <a rel="noopener noreferrer" href="https://www.gov.uk/foreign-travel-advice" target="_blank">https://www.gov.uk/foreign-travel-advice</a>.</p>
