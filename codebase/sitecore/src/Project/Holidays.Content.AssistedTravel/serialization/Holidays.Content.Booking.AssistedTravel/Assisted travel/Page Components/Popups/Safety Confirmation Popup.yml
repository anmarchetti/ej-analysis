        <p style="margin-top:0;">Pour votre sécurité et votre bien-être, nous vous demandons de confirmer que vous acceptez ces mesures de sécurité. Si vous ne pouvez pas les accepter, veuillez contacter notre équipe d'assistance, qui vous aidera directement.</p>
        <p><strong><a href="tel:+33481499425" style="text-decoration: underline;">+33 4 81 49 94 25</a></strong> ou au <strong><a href="tel:+41223240012" style="text-decoration: underline;">+41 22 324 00 12</a></strong></p>
        <p>(sélectionnez l’option 2 puis 4)</p>
        <p style="margin-bottom:0;">tous les jours de 9 h 00 à 18 h 00. Prix d'un appel local. Le tarif des appels passés depuis un mobile ou d’autres réseaux peut varier.</p>
