    Fields:
    - ID: "150db42b-c916-4f2d-985b-6f73b5613708"
      Hint: Label
      Value: Independent travel safety declaration
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260327T121539Z
    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
        <h2>I confirm that in an emergency I can:</h2>
        <ul>
            <li><span>unfasten my seat belt</span></li>
            <li><span>leave a seat and reach an emergency exit unaided</span></li>
            <li><span>find and put on a life jacket</span></li>
            <li><span>put on an oxygen mask without assistance</span></li>
            <li><span>understand the safety briefing (including those in accessible formats)</span></li>
        </ul>
        </div>
        <div style="height: 1px; background: #D7E2E5; width: 100%"></div>
        <div>
        <h2>I understand that the Cabin Crew will not be able to help me with:</h2>
        <ul>
            <li><span>eating and drinking</span></li>
            <li><span>personal care</span></li>
            <li><span>toileting needs</span></li>
            <li><span>taking medication</span></li>
        </ul>
        </div>
        </div>
