      Hint: Label
      Value: Déclaration de sécurité pour les voyageurs sans accompagnateur
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260327T134943Z
    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
        <h2>Je confirme qu'en cas d'urgence, je suis capable de:</h2>
        <ul>
            <li><span>détacher ma ceinture de sécurité</span></li>
            <li><span>quitter mon siège et rejoindre une issue de secours sans aide</span></li>
            <li><span>trouver et enfiler un gilet de sauvetage</span></li>
            <li><span>enfiler un masque à oxygène sans aide</span></li>
            <li><span>comprendre les consignes de sécurité (y compris celles présentées dans des formats accessibles)</span></li>
        </ul>
        </div>
        <div style="height: 1px; background: #D7E2E5; width: 100%"></div>
        <div>
        <h2>Je comprends que le personnel de cabine ne sera pas en mesure de m'aider pour :</h2>
        <ul>
            <li><span>manger et boire</span></li>
            <li><span>les soins personnels</span></li>
            <li><span>les besoins liés à la toilette</span></li>
            <li><span>la prise de médicaments</span></li>
        </ul>
        </div>
        </div>
