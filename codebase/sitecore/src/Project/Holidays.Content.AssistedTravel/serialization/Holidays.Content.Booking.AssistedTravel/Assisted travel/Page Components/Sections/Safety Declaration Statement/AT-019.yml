    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
        <h2>Ich bestätige, dass ich im Notfall:</h2>
        <ul>
            <li><span>meinen Sicherheitsgurt öffnen kann</span></li>
            <li><span>meinen Sitz verlassen und einen Notausgang alleine erreichen kann</span></li>
            <li><span>eine Schwimmweste finden und anziehen kann</span></li>
            <li><span>eine Sauerstoffmaske ohne Hilfe aufsetzen kann</span></li>
            <li><span>die Sicherheitsanweisungen verstehen kann (auch in barrierefreien Formaten)</span></li>
        </ul>
        </div>
        <div style="height: 1px; background: #D7E2E5; width: 100%"></div>
        <div>
        <h2>Ich verstehe, dass das Kabinenpersonal mir nicht helfen kann mit:</h2>
        <ul>
            <li><span>Essen und Trinken</span></li>
            <li><span>persönlicher Pflege</span></li>
            <li><span>Toilettengängen</span></li>
            <li><span>Medikamenteneinnahme</span></li>
        </ul>
        </div>
        </div>
