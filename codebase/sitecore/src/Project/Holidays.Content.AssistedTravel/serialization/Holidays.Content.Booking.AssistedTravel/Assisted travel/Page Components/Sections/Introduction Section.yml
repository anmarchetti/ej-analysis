    - ID: "d409ba7c-6358-4e6d-8f45-4981c7f1ee88"
      Hint: IntroductionText
      Value: |
        <div>
        <h2>Tell us about the support you need</h2>
        <div>
        <p>We'll ask you a few questions so we can arrange the support you need for your journey.</p>
        <p>We'll share this information with our airline, transfer and hotel partners so they can prepare for your arrival. While some requests depend on availability and may not always be possible, we'll do everything we can to arrange the right assistance.</p>
        <p>If we need any additional information, a member of our team will get in touch.</p>
        </div>
        </div>
        <div>
        <h2>What this forms covers</h2>
        <ul>
            <li><strong>Different accessibility needs:</strong> mobility, visual or hearing impairments, assistance dogs, nut allergies, and non-visible disabilities.</li>
            <li><strong>Airport assistance:</strong> Help getting through the airport, boarding the aircraft, or reaching your seat.</li>
            <li><strong>Transfers:</strong> Help getting to your transfer and between the airport and your hotel.</li>
            <li><strong>Hotel:</strong> Accessibility features you may need where you're staying.</li>
        </ul>
        </div>
        <div>
        <h2>What you may need before starting</h2>
        <ul>
            <li>Details of any mobility aids you&rsquo;ll be travelling with (model, battery type, weight, dimensions). If it folds, provide folded dimensions; if not, provide fully unfolded dimensions.</li>
            <li>Please consider your mobility and the support you may need, such as help through the airport, to the aircraft, up steps, during transfers, and at your destination.</li>
            <li>Accessibility modifications based on room type and equipment.</li>
        </ul>
        </div>
        <div>
        <h2>Need further assistance?</h2>
        <p>If you need further help please <strong><a style="text-decoration: underline;" id="contact-us-btn">contact us</a></strong>.</p>
        </div>
