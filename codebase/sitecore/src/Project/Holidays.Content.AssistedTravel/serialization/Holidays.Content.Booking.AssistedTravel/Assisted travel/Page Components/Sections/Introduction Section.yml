    - ID: "d409ba7c-6358-4e6d-8f45-4981c7f1ee88"
      Hint: IntroductionText
      Value: |
        <div>
        <h2>Informiere uns, welche Unterstützung du benötigst</h2>
        <div>
        <p>Wir stellen dir ein paar Fragen, damit wir die passende Unterstützung für deine Reise organisieren können.</p>
        <p>Wir teilen diese Informationen mit unserer Fluggesellschaft, unseren Transfer- und Hotelpartnern, damit sie sich auf deine Ankunft vorbereiten können. Manche Anfragen hängen von der Verfügbarkeit ab und sind nicht immer möglich, aber wir tun alles, um die richtige Unterstützung zu organisieren.</p>
        <p>Wenn wir weitere Informationen brauchen, meldet sich jemand aus unserem Team bei dir.</p>
        </div>
        </div>
        <div>
        <h2>Was dieses Formular abdeckt</h2>
        <ul>
            <li><strong>Verschiedene Mobilitätsbedürfnisse:</strong> Mobilität, Seh- oder Hörbeeinträchtigungen, Assistenzhunde, Nussallergien und nicht sichtbare Behinderungen.</li>
            <li><strong>Hilfe am Flughafen:</strong> Unterstützung beim Durchqueren des Flughafens, beim Einsteigen ins Flugzeug oder beim Erreichen deines Sitzplatzes.</li>
            <li><strong>Transfers:</strong> Hilfe beim Erreichen deines Transfers und zwischen Flughafen und Hotel.</li>
            <li><strong>Hotel:</strong> Barrierefreie Ausstattung, die du während deines Aufenthalts brauchen könntest.</li>
        </ul>
        </div>
        <div>
        <h2>Was du brauchst bevor du beginnst</h2>
        <ul>
            <li>Details zu den Mobilitätshilfen, mit denen du reist (Modell, Batterietyp, Gewicht, Masse). Wenn sie faltbar sind, gib die Masse im gefalteten Zustand an; wenn nicht, die Masse im geöffneten Zustand.</li>
            <li>Überlege, welche Unterstützung du wann brauchst. Zum Beispiel Unterstützung am Flughafen, zum Flugzeug, auf Treppen, bei Transfers und am Zielort.</li>
            <li>Lass uns wissen, ob du barrierefreie Anpassungen in Bezug auf Zimmertyp und -ausstattung benötigst, besonders hinsichtlich Mobilitätshilfen. </li>
        </ul>
        </div>
        <div>
        <h2>Brauchst du zusätzliche Unterstützung?</h2>
        <p>Wenn du weitere Unterstützung brauchst, <strong><a style="text-decoration: underline;" id="contact-us-btn">kontaktiere uns bitte</a></strong>.</p>
        </div>
