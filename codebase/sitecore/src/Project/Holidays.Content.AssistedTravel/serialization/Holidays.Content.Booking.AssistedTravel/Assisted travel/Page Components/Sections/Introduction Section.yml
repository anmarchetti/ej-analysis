    - ID: "d409ba7c-6358-4e6d-8f45-4981c7f1ee88"
      Hint: IntroductionText
      Value: |
        <div>
        <h2>Informez-vous de l’assistance dont vous avez besoin</h2>
        <div>
        <p>Nous allons vous poser quelques questions afin de pouvoir organiser l'assistance dont vous avez besoin pour votre séjour.</p>
        <p>Nous transmettrons ces informations à nos partenaires (compagnie aérienne, prestataires de transfert et hôtels) afin qu'ils puissent se préparer à votre arrivée. Bien que certaines demandes dépendent des disponibilités et ne puissent pas toujours être satisfaites, nous ferons tout notre possible pour vous fournir l'assistance dont vous avez besoin.</p>
        <p>Si nous avons besoin d'informations supplémentaires, un membre de notre équipe vous contactera.</p>
        </div>
        </div>
        <div>
        <h2>Ce que couvre ce formulaire</h2>
        <ul>
            <li><strong>Différents besoins en matière d'accessibilité:</strong> mobilité réduite, déficience visuelle ou auditive, chiens d'assistance, allergies aux fruits à coque et handicaps invisibles.</li>
            <li><strong>Assistance à l'aéroport:</strong> aide pour se déplacer dans l'aéroport, embarquer dans l'avion ou rejoindre votre siège.</li>
            <li><strong>Transferts:</strong> aide pour rejoindre votre transfert et pour les trajets entre l'aéroport et votre hôtel.</li>
            <li><strong>Hôtel:</strong> équipements d'accessibilité dont vous pourriez avoir besoin sur votre lieu de séjour.</li>
        </ul>
        </div>
        <div>
        <h2>Ce dont vous pourriez avoir besoin avant de commencer</h2>
        <ul>
            <li>Veuillez fournir des informations sur les aides à la mobilité que vous emporterez avec vous (modèle, type de batterie, poids, dimensions). Si l'aide à la mobilité est pliable, indiquez ses dimensions une fois pliée ; sinon, indiquez ses dimensions une fois dépliée.</li>
            <li>Veuillez tenir compte de votre mobilité et de l'assistance dont vous pourriez avoir besoin, par exemple pour vous déplacer dans l'aéroport, monter à bord de l'avion, monter des marches, lors des correspondances et à votre destination.</li>
            <li>Les équipements d'accessibilité dont vous pourriez avoir besoin à l'hôtel et dans votre chambre, en tenant compte des aides à la mobilité que vous emporterez avec vous.</li>
        </ul>
        </div>
        <div>
        <h2>Besoin de plus d’assistance ?</h2>
        <p>Si vous avez besoin d’aide supplémentaire, veuillez <strong><a style="text-decoration: underline;" id="contact-us-btn">nous contacter</a></strong>.</p>
        </div>
