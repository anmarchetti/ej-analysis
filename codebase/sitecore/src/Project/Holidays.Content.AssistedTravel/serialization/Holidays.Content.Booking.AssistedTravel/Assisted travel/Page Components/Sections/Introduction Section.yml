    - ID: "d409ba7c-6358-4e6d-8f45-4981c7f1ee88"
      Hint: IntroductionText
      Value: |
        <div>
        <h2>Welche Art von Unterstützung benötigst du?</h2>
        <div>
        <p>Wir stellen dir ein paar Fragen, damit wir die passende Unterstützung für deine Reise organisieren können.</p>
        <p>Wir leiten diese Informationen an die Fluggesellschaft, das Hotel und unseren Transferpartner weiter, damit sie sich auf deine Ankunft vorbereiten können. Manche Anfragen hängen von der Verfügbarkeit ab und können nicht immer erfüllt werden, aber wir tun alles, um die passende Unterstützung zu organisieren.</p>
        <p>Wenn wir weitere Informationen brauchen, meldet sich jemand aus unserem Team bei dir.</p>
        </div>
        </div>
        <div>
        <h2>Was dieses Formular abdeckt</h2>
        <ul>
            <li><strong>Verschiedene Bedürfnisse in Bezug auf Barrierefreiheit:</strong> Mobilität, Seh- oder Hörbeeinträchtigungen, Assistenzhunde, Nussallergien und nicht sichtbare Behinderungen.</li>
            <li><strong>Hilfe am Flughafen:</strong> Unterstützung beim Passieren des Flughafens, beim Einsteigen ins Flugzeug oder beim Erreichen deines Sitzplatzes.</li>
            <li><strong>Transfers:</strong> Hilfe beim Erreichen deines Transfers und zwischen Flughafen und Hotel.</li>
            <li><strong>Hotel:</strong> Barrierefreie Ausstattung während deinem Aufenthalt.</li>
        </ul>
        </div>
        <div>
        <h2>Was du brauchst, bevor du beginnst</h2>
        <ul>
            <li>Angaben zu den Mobilitätshilfen, mit denen du reist (Modell, Akkutyp, Gewicht, Größe). Bei faltbaren Modellen, gib die Abmessungen im gefalteten Zustand an; wenn nicht, die Abmessungen im augeklappten Zustand.</li>
            <li>Überlege, welche Unterstützung du wann brauchst. Zum Beispiel Unterstützung am Flughafen, auf dem Weg zum Flugzeug, bei Treppenstufen, beim Transfer und am Reiseziel.</li>
            <li>Lass uns wissen, ob du barrierefreie Anpassungen in Bezug auf Hotelausstattung und Zimmertyp benötigst, besonders hinsichtlich Mobilitätshilfen.</li>
        </ul>
        </div>
        <div>
        <h2>Brauchst du zusätzliche Unterstützung?</h2>
        <p>Wenn du weitere Hilfe brauchst, wende dich <strong><a style="text-decoration: underline;" id="contact-us-btn">bitte an unser Team</a></strong>.</p>
        </div>
