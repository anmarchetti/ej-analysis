      Hint: Description
      Value: |
        <p style="margin-top:0;">To travel with a companion, another adult must be included in your booking.
        </p>
        <p>As there are no other adult customers listed, this request can&rsquo;t be completed online.&#x2028Please contact our Assistance team on:</p>
        <p><strong><a href="tel:+443309126593" style="text-decoration: underline;">+44 330 912 6593</a></strong></p>
        <p>(select option 2 and then option 4)</p>
        <p>Monday to Sunday, from 8am to 8pm. Cost of a local call. Calls from mobile or other networks may vary.</p>
        <p style="margin-bottom:0;">If you use British Sign Language (BSL), you can now get in touch with us through <strong><a rel="noopener noreferrer" href="https://www.convo.io/uk/home" target="_blank" style="text-decoration: underline;">Convo</a></strong>.</p>
    - ID: "f188bb1b-8b02-498b-8215-7d8bb319e603"
      Hint: Title
      Value: We couldn’t find another adult companion in this booking
