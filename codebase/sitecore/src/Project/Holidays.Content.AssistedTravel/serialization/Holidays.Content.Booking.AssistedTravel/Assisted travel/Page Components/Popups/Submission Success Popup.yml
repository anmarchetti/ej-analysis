        </div>
        </div>
        <p>We&rsquo;ve shared your request for assistance with the teams preparing for your journey, including the airport, hotel and transfer partners where needed.</p>
        <p>While requests can&rsquo;t always be guaranteed, we&rsquo;ll do our best to arrange the support you need and will contact you if we require any further information.</p>
        <h4 style="margin-bottom: 8px; margin-top:24px;">What happens next</h4>
        <p>You&rsquo;ll receive a confirmation email at <strong>{email}</strong> shortly. If we need any further information, we&rsquo;ll contact you before you travel.</p>
