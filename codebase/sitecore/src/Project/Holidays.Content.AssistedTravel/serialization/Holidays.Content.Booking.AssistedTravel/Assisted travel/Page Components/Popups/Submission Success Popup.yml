        <span>{passengerName}</span>
        </div>
        </div>
        <p>Nous avons transmis votre demande d'assistance aux équipes chargées d'organiser votre séjour, notamment à nos partenaires aéroportuaires, hôteliers et de transport, le cas échéant.</p>
        <p>Bien que nous ne puissions pas toujours garantir la satisfaction de toutes les demandes, nous ferons de notre mieux pour vous fournir l'assistance dont vous avez besoin et nous vous contacterons si nous avons besoin d'informations complémentaires.</p>
