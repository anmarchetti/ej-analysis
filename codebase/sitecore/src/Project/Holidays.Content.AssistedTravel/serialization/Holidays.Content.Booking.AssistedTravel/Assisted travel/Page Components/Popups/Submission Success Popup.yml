        <span>{passengerName}</span>
        </div>
        </div>
        <p>Wir haben deine Anfrage zur Unterstützung mit den Teams geteilt, die deine Reise vorbereiten, darunter das Flughafenpersonal, Hotel und Transferpartner, sofern erforderlich.</p>
        <p>Obwohl wir nicht immer garantieren können, dass alle Wünsche erfüllt werden, tun wir unser Bestes, um die benötigte Unterstützung zu organisieren und melden uns bei dir, falls wir weitere Informationen benötigen.</p>
        <h4 style="margin-bottom: 8px; margin-top:24px;">Nächsten Schritte</h4>
        <p>Du erhältst in Kürze eine Bestätigungs-E-Mail an <strong>{email}</strong>. Falls wir weitere Informationen benötigen, kontaktieren wir dich vor deiner Abreise.</p>
