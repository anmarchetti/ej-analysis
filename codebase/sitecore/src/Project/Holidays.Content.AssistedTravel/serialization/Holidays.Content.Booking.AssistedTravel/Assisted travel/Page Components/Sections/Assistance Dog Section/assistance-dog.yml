    - ID: "3f5caa15-f44c-4d1d-83ff-30fa729c25f2"
      Hint: LabelSummary
      Value: Zulassungskriterien für Assistenzhunde
    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <p style="margin-top:8px;">Nur anerkannte Assistenzhunde dürfen mit ins Flugzeug. Du musst offizielle Dokumente vorlegen, die bestätigen, dass dein Hund entsprechend ausgebildet wurde. </p>
        <p>Die Ausbildungsnachweise müssen von einer Organisation stammen, die bei einer der folgenden Stellen akkreditiert ist:</p>
        <ul>
            <li><span>Assistance Dogs International (ADI) oder einer ihrer Zweigstellen</span></li>
            <li><span>International Guide Dog Federation (IGDF)</span></li>
            <li><span>Assistance Dog Assessment Agency (ADAA)</span></li>
            <li><span>Eine andere anerkannte Organisation, die denselben oder höheren Standards entspricht</span></li>
        </ul>
        <p>In einigen Ländern ist die Einreise mit Assistenzhunden nicht gestattet. Wenn du die oben genannten Voraussetzungen erfüllst, müssen wir zudem sicherstellen, dass unsere Transfer- und Hotelpartner deinen Assistenzhund im Rahmen deiner Ferien akzeptieren.</p>
        <p>Bitte vergewissere dich, dass du die oben genannten Voraussetzungen erfüllst, bevor du das Formular absendest. Sobald das Formular bei uns eingegangen ist, prüfen wir deine Anfrage. Falls wir weitere Informationen brauchen, setzen wir uns mit dem Hauptreisenden in Verbindung. Mehr Infos findest du in unseren <strong><a style="text-decoration: underline;" href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z" target="_blank">FAQs</a></strong>.</p>
        <p style="margin-bottom:0px;">Du kannst dich auch gerne <strong><a style="text-decoration: underline;" id="contact-us-btn">an unser Team wenden</a></strong>, das dir bei der Überprüfung deiner Unterlagen hilft oder mit dir die Anforderungen besprechen kann. </p>
