    - ID: "150db42b-c916-4f2d-985b-6f73b5613708"
      Hint: Label
      Value: Check your eligibility to travel with an assistance dog
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260327T121539Z
    - ID: "3f5caa15-f44c-4d1d-83ff-30fa729c25f2"
      Hint: LabelSummary
      Value: Eligibility rules for assistance dogs
    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <div>
        <p style="margin-top:8px;"><strong>Please note: </strong>only recognised assistance dogs are permitted on board the aircraft. You will need to provide evidence that your dog has been trained to the required standards.</p>
        <p>Training documentation must be issued by an organisation accredited by one of the following:</p>
        <ul>
            <li><span>Assistance Dogs International (ADI), or one of its regional chapters (including Assistance Dogs UK &ndash; ADUK)</span></li>
            <li><span>International Guide Dog Federation (IGDF)</span></li>
            <li><span>Assistance Dog Assessment Agency (ADAA)</span></li>
            <li><span>Trained by another recognised organisation that meets the same or higher standards</span></li>
        </ul>
        <p>Please be aware that service dog registration certificates alone are not accepted as proof of training.</p>
        <p>Some countries do not permit the entry of assistance dogs. If you meet the requirements above, we will also need to confirm that our transfer and hotel partners are able to accommodate your assistance dog as part of your holiday.</p>
        <p>Please ensure you meet the above requirements before submitting the form. Once the form is submitted, we&rsquo;ll review your request and contact the lead customer if we need any further information or to provide support. You can find more information on our <strong><a style="text-decoration: underline;" href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z" target="_blank">help pages</a></strong>.</p>
        <p style="margin-bottom:0px;">If you&rsquo;d prefer, you can <strong><a style="text-decoration: underline;" id="contact-us-btn">contact us</a></strong> and our Assistance team will be able to help check your documentation or talk you through the requirements.</p>
        </div>
