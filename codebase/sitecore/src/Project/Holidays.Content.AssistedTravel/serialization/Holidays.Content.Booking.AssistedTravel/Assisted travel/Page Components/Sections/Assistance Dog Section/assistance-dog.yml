    - ID: "150db42b-c916-4f2d-985b-6f73b5613708"
      Hint: Label
      Value: Vérifiez si vous pouvez voyager avec un chien d'assistance
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260327T134943Z
    - ID: "3f5caa15-f44c-4d1d-83ff-30fa729c25f2"
      Hint: LabelSummary
      Value: Conditions d'éligibilité pour les chiens d'assistance
    - ID: "533fccf8-ef23-4e80-a2d9-1ff408aeed0c"
      Hint: Description
      Value: |
        <p style="margin-top:8px;"><strong>Remarque :</strong> seuls les chiens d'assistance certifiés sont autorisés à bord de l'avion. Vous devrez fournir la preuve que votre chien a été formé conformément aux normes requises.</p>
        <p>Les documents attestant de la formation doivent être délivrés par un organisme accrédité par l'une des organisations suivantes :</p>
        <ul>
            <li><span>Assistance Dogs International (ADI), ou l'une de ses sections régionales</span></li>
            <li><span>International Guide Dog Federation (IGDF)</span></li>
            <li><span>Formé par un autre organisme reconnu répondant à des normes équivalentes ou supérieures</span></li>
        </ul>
        <p>Veuillez noter que les certificats d'enregistrement des chiens d'assistance ne sont pas acceptés à eux seuls comme preuve de formation.</p>
        <p>Certains pays n'autorisent pas l'entrée des chiens d'assistance. Si vous remplissez les conditions ci-dessus, nous devrons également nous assurer que nos partenaires de transfert et d'hébergement sont en mesure d'accueillir votre chien d'assistance dans le cadre de vos vacances.</p>
        <p>Veuillez vous assurer que vous remplissez les conditions ci-dessus avant de soumettre le formulaire. Une fois le formulaire soumis, nous examinerons votre demande et contacterons le client principal si nous avons besoin d'informations complémentaires ou pour vous apporter notre aide. Vous trouverez plus d'informations sur nos <strong><a style="text-decoration: underline;" href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z" target="_blank">pages d'aide</a></strong>.</p>
        <p style="margin-bottom:0px;">Si vous préférez, vous pouvez <strong><a style="text-decoration: underline;" id="contact-us-btn">nous contacter</a></strong> et notre équipe d'assistance pourra vous aider à vérifier vos documents ou vous expliquer les conditions requises.</p>
