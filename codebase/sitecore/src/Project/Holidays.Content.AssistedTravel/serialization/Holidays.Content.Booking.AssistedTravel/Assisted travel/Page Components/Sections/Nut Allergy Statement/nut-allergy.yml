        <div>
        <h2>Nut allergy Special Assistance Request</h2>
        <p><span><strong>Please note:</strong> </span><span>Submitting this request doesn't replace the need to tell our cabin crew or an appropriate person at the hotel (and the transfer driver if applicable).</span></p>
        <p><span>On your flight, <strong>please let our cabin crew know</strong> when you board the aircraft so they're aware and can support you during your flight. We'll always do our best to help &mdash; including making onboard announcements and stopping the sale of nut products.&nbsp;&nbsp;</span></p>
        <p><span></span><span>You <strong>must also tell the hotel, restaurant or bar</strong> when you arrive. It&rsquo;s your responsibility to do this. And when you&rsquo;re on holiday, it&rsquo;s also really worth checking that the person serving you understands what you&rsquo;re asking for.</span></p>
        <p><span></span><span><strong>We&rsquo;re unable to guarantee a completely allergen-free</strong> environment on board our aircraft, at your hotel or on your transfer</span></p>
        </div>
