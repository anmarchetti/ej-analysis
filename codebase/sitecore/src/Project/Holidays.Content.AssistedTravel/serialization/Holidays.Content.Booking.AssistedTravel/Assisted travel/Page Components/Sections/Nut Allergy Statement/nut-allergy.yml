      Hint: Description
      Value: |
        <h2>Demande d'assistance sp&eacute;ciale pour une allergie aux noix</h2>
        <p><strong>Remarque </strong>: l'envoi de cette demande ne dispense pas de pr&eacute;venir notre personnel de bord ou une personne comp&eacute;tente &agrave; l'h&ocirc;tel (ainsi que le chauffeur de transfert, le cas &eacute;ch&eacute;ant). Lors de votre vol, <strong>veuillez en informer notre personnel de bord</strong> d&egrave;s votre embarquement afin qu'il soit au courant et puisse vous aider pendant le vol.
        </p>
        <p>Nous ferons toujours de notre mieux pour vous aider, notamment en diffusant des annonces &agrave; bord et en suspendant la vente de produits contenant des fruits &agrave; coque. </p>
        <p>Vous <strong>devez &eacute;galement en informer l'h&ocirc;tel, le restaurant ou le bar</strong> &agrave; votre arriv&eacute;e. Il est de votre responsabilit&eacute; de le faire. Et lorsque vous &ecirc;tes en vacances, il est &eacute;galement tr&egrave;s important de v&eacute;rifier que la personne qui vous sert comprend bien ce que vous demandez.
        </p>
        <p><strong>Nous ne sommes pas en mesure de garantir un environnement totalement exempt d'allerg&egrave;nes</strong> &agrave; bord de nos avions, &agrave; votre h&ocirc;tel ou lors de votre transfert</p>
