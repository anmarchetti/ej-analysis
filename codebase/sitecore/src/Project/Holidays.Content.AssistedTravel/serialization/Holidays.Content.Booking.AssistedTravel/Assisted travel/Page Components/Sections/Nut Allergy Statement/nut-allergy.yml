        <h2>Anfrage f&uuml;r Unterst&uuml;tzung bei Nussallergie</h2>
        <p><strong>Bitte beachten: </strong>Wenn du diese Anfrage stellst, ersetzt das nicht die Pflicht, unser Kabinenpersonal oder eine zust&auml;ndige Person im Hotel (sowie gegebenenfalls den Transferfahrer) zu informieren. <strong>Bitte gib unserem Kabinenpersonal beim Einstieg ins Flugzeug Bescheid</strong>, damit sie vorbereitet sind und dich w&auml;hrend deinem Flug unterst&uuml;tzen k&ouml;nnen.</p>
        <p>Wir tun immer unser Bestes, um zu helfen, darunter auch Durchsagen an Bord und die Einstellung des Verkaufs von Nussprodukten.</p>
        <p><strong>Du musst auch im Hotel, Restaurant oder in der Bar Bescheid geben</strong>, wenn du ankommst. Das liegt in deiner Verantwortung. Und wenn du im Urlaub bist, solltest du unbedingt darauf achten, dass die Person, die dich bedient, versteht, was du brauchst.</p>
