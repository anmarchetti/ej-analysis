        <h2>Anfrage f&uuml;r Unterst&uuml;tzung bei Nussallergie</h2>
        <p><strong>Bitte beachte: </strong>Wenn du diese Anfrage stellst, ersetzt das nicht die Pflicht, unser Kabinenpersonal oder eine passende Person im Hotel (und den Transferfahrer, falls zutreffend) zu informieren. <strong>Bitte gib unserem Kabinenpersonal beim Einsteigen ins Flugzeug Bescheid</strong>, damit sie informiert sind und dich w&auml;hrend des Fluges unterst&uuml;tzen k&ouml;nnen.</p>
        <p>Wir tun immer unser Bestes, um zu helfen, wie zum Beispiel eine Lautsprechermitteilun an Bord und das Stoppen des Verkaufs von Produkten mit N&uuml;ssen.</p>
        <p><strong>Du musst auch im Hotel, Restaurant oder in der Bar Bescheid geben</strong>, wenn du ankommst. Das liegt in deiner Verantwortung. Und wenn du in den Ferien bist, lohnt es sich sicherzustellen, dass die Person, die dich bedient, versteht, was du brauchst.</p>
        <p><strong>Wir k&ouml;nnen leider keine komplett allergenfreie Umgebung</strong> im Flugzeug, im Hotel oder beim Transfer garantieren.</p>
