Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Extensions/EasyJet/Functions/Get Rendering And Index By RenderingId
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-RenderingAndIndexByRenderingId {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory=$true)]
            $Page,
            [Parameter(Mandatory=$true)]
            [string]$ItemId,
            [int]$Index = 0,
            [bool]$FinalLayout = $false,
            [bool]$ThrowOnError = $true
        )
    
        # Validate GUID
        try {
            $guid = [Guid]$ItemId
        }
        catch {
            if ($ThrowOnError) { throw "ItemId '$ItemId' is not a valid GUID." }
            return [pscustomobject]@{ Rendering = $null; Index = -1 }
        }
    
        # Ensure item exists
        $item = Get-Item -Id $guid -Path "master:" -ErrorAction SilentlyContinue
        if ($null -eq $item) {
            if ($ThrowOnError) { throw "Item '$ItemId' not found." }
            return [pscustomobject]@{ Rendering = $null; Index = -1 }
        }
    
        # Get renderings
        $renderings = if ($FinalLayout) { Get-Rendering -Item $Page -FinalLayout } else { Get-Rendering -Item $Page }
        if ($null -eq $renderings -or $renderings.Count -eq 0) {
            if ($ThrowOnError) { throw "No renderings found." }
            return [pscustomobject]@{ Rendering = $null; Index = -1 }
        }
    
        # Find matching rendering (support Nth occurrence via Index)
        for ($i = 0; $i -lt $renderings.Count; $i++) {
            if ([Guid]::Parse($renderings[$i].ItemId) -eq $guid) {
                if ($Index -lt 1) {
                    return [pscustomobject]@{ Rendering = $renderings[$i]; Index = $i }
                }
                $Index--
            }
        }
    
        if ($ThrowOnError) { throw "Rendering with ItemId '$ItemId' was not found." }
        return [pscustomobject]@{ Rendering = $null; Index = -1 }
    }
    
