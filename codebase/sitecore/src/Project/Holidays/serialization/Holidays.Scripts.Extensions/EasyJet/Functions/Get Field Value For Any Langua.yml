Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Extensions/EasyJet/Functions/Get Field Value For Any Language
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function GetFieldValueInAnyLanguage {
        param(
            [Item]$item,
            [string]$field,
            [string[]]$languages
        )
    
        $fieldDef = $item.Template.Fields | Where-Object { $_.Name -eq $field }
        if($fieldDef -and $fieldDef.Shared) {
            $langToCheck = if($languages -contains "en") { "en" } else { $languages[0] }
            $versionItem = Get-Item -Path ("master:" + $item.Paths.FullPath) -Language $langToCheck -ErrorAction SilentlyContinue
            if($versionItem -and $versionItem.Versions.Count -gt 0) {
                return $versionItem.$field
            }
            return $null
        } else {
            foreach($lang in $languages) {
                $versionItem = Get-Item -Path ("master:" + $item.Paths.FullPath) -Language $lang -ErrorAction SilentlyContinue
                if($versionItem -and $versionItem.Versions.Count -gt 0) {
                    $val = $versionItem.$field
                    if([string]::IsNullOrEmpty($val) -eq $false) {
                        return $val
                    }
                }
            }
            return $null
        }
    }
