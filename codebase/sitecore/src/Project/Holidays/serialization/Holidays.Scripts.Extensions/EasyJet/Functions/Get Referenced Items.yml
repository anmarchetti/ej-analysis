DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-ReferencedItems {
        param(
            [Item[]]$itemsToCheck,
            [string[]]$languages
        )
    
        $referencedItems = New-Object System.Collections.Generic.List[Item]
        foreach($ci in $itemsToCheck) {
            $fieldNames = Get-ItemField -Item $ci -IncludeStandardFields -ReturnType Name | Where-Object { $_ -notmatch "^__" -or $_ -eq "__Renderings" } | Select-Object -ExpandProperty $_
            if($fieldNames -and $fieldNames.Count -gt 0) {
                foreach($fieldName in $fieldNames) {
                    $val = GetFieldValueInAnyLanguage -item $ci -field $fieldName -languages $languages
                    if($val -and $val -match "\{[0-9A-Fa-f-]+\}") {
                        $guids = [regex]::Matches($val, "\{[0-9A-Fa-f-]+\}") | ForEach-Object { $_.Value }
                        foreach($g in $guids) {
                            $linkedItem = Get-Item "master:$g" -ErrorAction SilentlyContinue
                            if($linkedItem -and -not $allItems.Contains($linkedItem)) {
                                $referencedItems.Add($linkedItem)
                            }
                        }
                    }
                }
            }
        }
        return $referencedItems
    }
