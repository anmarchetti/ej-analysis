SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $Global:MeasureCommandStartTimes = @{}
    $Global:MeasureCommandCumulativeTimes = @{}
    $Global:FirstStartTime = $null
    $Global:LastStopTime = $null
    
    Add-Type -AssemblyName System.Configuration
    $envRole = [System.Configuration.ConfigurationManager]::AppSettings["localenv:define"]
    
    function Start-Measure {
        if ($envRole -ne "Production") {
            $callStack = Get-PSCallStack
            if ($callStack.Count -gt 1) {
                $Name = $callStack[1].FunctionName
            } else {
                $Name = "Global"
            }
            
            $currentTime = Get-Date
            $Global:MeasureCommandStartTimes[$Name] = $currentTime
    
            if ($Global:FirstStartTime -eq $null) {
                $Global:FirstStartTime = $currentTime
            }
        }
    }
    
    function Stop-Measure {
        if ($envRole -ne "Production") {
            $callStack = Get-PSCallStack
            if ($callStack.Count -gt 1) {
                $Name = $callStack[1].FunctionName
            } else {
                $Name = "Global"
            }
    
            $currentTime = Get-Date
            $Global:LastStopTime = $currentTime
    
            if ($Global:MeasureCommandStartTimes.ContainsKey($Name)) {
                $startTime = $Global:MeasureCommandStartTimes[$Name]
                $elapsedTime = $currentTime - $startTime
                $elapsedSeconds = $elapsedTime.TotalSeconds
    
                if ($Global:MeasureCommandCumulativeTimes.ContainsKey($Name)) {
                    $Global:MeasureCommandCumulativeTimes[$Name] += $elapsedSeconds
                } else {
                    $Global:MeasureCommandCumulativeTimes[$Name] = $elapsedSeconds
                }
                $Global:MeasureCommandStartTimes.Remove($Name)
            }
        }
    }
    
    function Show-CumulativeTimes {
        if ($envRole -ne "Production") {
            $totalDuration = ($Global:LastStopTime - $Global:FirstStartTime).TotalSeconds
    
            $resultsTable = @()
            foreach ($result in $Global:MeasureCommandCumulativeTimes.GetEnumerator()) {
                $time = $result.Value
                $roundedTime = [math]::Round($time, 2)
                $percentage = ($time / $totalDuration) * 100
    
                $resultsTable += New-Object PSObject -Property @{
                    Name = $result.Key
                    Duration = "{0:N2} sec" -f $roundedTime
                    Percentage = $percentage
                }
            }
    
            Write-Host ""
            Write-Host "------------------------------------------------------------------"
            Write-Host "Total Duration: $totalDuration Seconds"
            Write-Host "------------------------------------------------------------------"
            $resultsTable | Sort-Object Percentage -Descending | Format-Table Name, Duration, @{Name="Percentage"; Expression={"{0:N2}%" -f $_.Percentage}} -AutoSize
            Write-Host "------------------------------------------------------------------"
        }
    }
    
