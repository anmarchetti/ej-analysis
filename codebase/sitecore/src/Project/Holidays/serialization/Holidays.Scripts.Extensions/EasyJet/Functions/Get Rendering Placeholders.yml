Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Extensions/EasyJet/Functions/Get Rendering Placeholders
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-RenderingPlaceholders {
        param(
    
            [Parameter(Mandatory = $true)]
            [string]$RenderingId,
            
            [Parameter(Mandatory = $false)]
            [int]$RenderingIndex = 0,
            
            [Parameter(Mandatory = $true)]
            [string]$PagePath ,
            
            [Parameter(Mandatory = $false)]
            [bool]$FinalLayout = $false
        )
    
        $PagePath = "master:/$($PagePath)"
        $page = Get-Item -Path $PagePath -ErrorAction SilentlyContinue
        if ($null -eq $page) 
        {
            Write-Host "`tPage '$PagePath' not found" -ForegroundColor Red
            return
        }
        $result= Get-RenderingAndIndexByRenderingId -Page $page -ItemId $RenderingId -Index $RenderingIndex -FinalLayout $FinalLayout
        $targetRendering=$result.Rendering;
        
        $Uid=$targetRendering.UniqueId
        if ($null -eq $Uid) 
        {
            Write-Host "`tUniqueId not found" -ForegroundColor Red
            return
        }
        
        $placeholderPaths = Get-Item $PagePath |
                            Get-Rendering |
                            Select-Object -ExpandProperty Placeholder -Unique
    
        $regex = '^(?<Placeholder>.*?)-(?<Guid>\{[0-9A-Fa-f-]{36}\})-(?<Index>\d+)$'
        $uidNorm = $Uid.Trim().ToLowerInvariant()
    
        $matches = foreach ($path in $placeholderPaths) {
            foreach ($seg in ($path -split '/')) {
                if ($seg -match $regex) {
                    if ($Matches.Guid.ToLowerInvariant() -eq $uidNorm) {
                        [pscustomobject]@{
                            Placeholder = $Matches.Placeholder
                            Uid         = $Matches.Guid
                        }
                    }
                }
            }
        }
    
      return  $matches | Select-Object -ExpandProperty Placeholder -Unique
    }
    
    
    
