SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Get Rendering And Index By RenderingId"
    
    function Update-RenderingPlaceHolder
    {
        param(
            [Parameter(Mandatory = $true)]
            [string]$PagePath,
            
            [Parameter(Mandatory = $true)]
            [string] $RenderingId,
            [Parameter(Mandatory = $false)]
            [int]$RenderingIndex = 0,
    
            [Parameter(Mandatory = $true)]
            [string]$Placeholder,
            
            [Parameter(Mandatory = $true)]
            [string]$TargetRenderingId,
            
            [Parameter(Mandatory = $false)]
            [int]$TargetRenderingIndex = 0,
    
            [Parameter(Mandatory = $false)]
            [bool]$FinalLayout
        )
    
        $PagePath = "master:/$($PagePath)"
        $page = Get-Item -Path $PagePath -ErrorAction SilentlyContinue
        if ($null -eq $page) 
        {
            Write-Host "`tPage '$PagePath' not found" -ForegroundColor Red
            return
        }
            
    
        $PagePath = "master:/$($TargetRenderingPath)"
        
        $result= Get-RenderingAndIndexByRenderingId -Page $page -ItemId $TargetRenderingId -Index $TargetRenderingIndex -FinalLayout $FinalLayout
        $targetRendering=$result.Rendering;
    
        $result= Get-RenderingAndIndexByRenderingId -Page $page -ItemId $RenderingId -Index $RenderingIndex -FinalLayout $FinalLayout
        $existingRendering=$result.Rendering;
        
    
        Write-Host ""
        Write-Host "`tUpdating Rendering Placeholder..." -ForegroundColor Yellow
        
    
        $existingRendering| 
        Foreach-Object { 
            $original=$_.PlaceHolder
            $_.PlaceHolder = "$Placeholder-$($targetRendering.UniqueId)-0"
            Write-Host "`tChanging Placeholder from '$($original)' to '$($_.PlaceHolder)'" -ForegroundColor Green
            if($FinalLayout -eq 1 -or $FinalLayout -eq $true)
            {
                Set-Rendering -Item $page -Instance $_ -FinalLayout
            }
            else
            {
                Set-Rendering -Item $page -Instance $_
            }
            
        }
        
    
        Write-Host "`tSuccess!"  -ForegroundColor Green
    
    }
    
    
    function UpdateRenderingPlaceholder 
    {
        param(
            [Parameter(Mandatory = $true)]
            $renderingInfo
        )
    
    
    
    
        $PagePath                   = $renderingInfo.PagePath 
        $RenderingId                = $renderingInfo.RenderingId
        $RenderingIndex             = $renderingInfo.RenderingIndex
        $TargetRenderingId        = $renderingInfo.TargetRenderingId
        $TargetRenderingIndex        = $renderingInfo.TargetRenderingIndex
        $Placeholder                = $renderingInfo.Placeholder
        $UpdateFinalLayoutAsWell    = $renderingInfo.UpdateFinalLayoutAsWell
        if($UpdateFinalLayoutAsWell -eq $null)
        {
            $UpdateFinalLayoutAsWell = $false
        }
        Write-Host ""
        Write-Host ""
        Write-Host "Processing '$PagePath'" -ForegroundColor Cyan
        Update-RenderingPlaceHolder -PagePath $PagePath -RenderingId $RenderingId -RenderingIndex $RenderingIndex -TargetRenderingIndex $TargetRenderingIndex -TargetRenderingId $TargetRenderingId -Placeholder $Placeholder
        
        if($UpdateFinalLayoutAsWell -eq 1 -or $UpdateFinalLayoutAsWell -eq $true)
        {
            Update-RenderingPlaceHolder -PagePath $PagePath -RenderingId $RenderingId -RenderingIndex $RenderingIndex -TargetRenderingIndex $TargetRenderingIndex -TargetRenderingId $TargetRenderingId -Placeholder $Placeholder  -FinalLayout $true
        }
    
        Write-Host "`tAll rendering placeholderss updated successfully" -ForegroundColor Green
    }
    
