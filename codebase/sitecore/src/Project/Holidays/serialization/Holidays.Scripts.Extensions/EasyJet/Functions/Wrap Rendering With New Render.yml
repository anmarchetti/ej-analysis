SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Renderings"
    Import-Function "Move Rendering Child Placeholders"
    Import-Function "Update Rendering Placeholder"
    Import-Function "Update Rendering Parameters"
    
    function Wrap-RenderingWithNewRendering
    {
        param(
            [Parameter(Mandatory = $true)]
            [string]$WrapperTitle,
            
            [Parameter(Mandatory = $true)]
            [string]$PagePath,
    
            [Parameter(Mandatory = $true)]
            [string]$RenderingId,
            
            [Parameter(Mandatory = $false)]
            [int]$RenderingIndex = 0,
            
            [Parameter(Mandatory = $true)]
            [string]$WrapperRenderingId,
            
            [Parameter(Mandatory = $false)]
            [int]$WrapperRenderingIndex = 0,
    
            [Parameter(Mandatory = $true)]
            [string]$Placeholder,
            
            [Parameter(Mandatory = $true)]
            [string]$WrapIntoPlaceholder,
            
            [Parameter(Mandatory = $true)]
            [string]$WrapperPlaceholder,
    
            [Parameter(Mandatory = $false)]
            [System.Collections.Hashtable]
            $Parameters = $null,
            
            [Parameter(Mandatory = $false)]
            [System.Collections.Hashtable]
            $WrapperParameters = $null,
    
            [Parameter(Mandatory = $false)]
            [string]$PlaceBeforeRenderingId = $null,
            
            [Parameter(Mandatory = $false)]
            [int]$PlaceBeforeRenderingIndex = 1,
            
            [Parameter(Mandatory = $false)]
            [bool]$UpdateFinalLayoutAsWell = $false
    
        )
    
    
        Write-Host ""
        Write-Host ""
        Write-Host ""
        Write-Host "`tWrap Rendering With New Rendering ..." -ForegroundColor Yellow
            
                
        $myRenderings = @(
            @{ 
                Title          = $WrapperTitle
                PagePath       = $PagePath
                RenderingId  = $WrapperRenderingId
                Placeholder    = $WrapperPlaceholder
                PlaceBeforeRenderingId = $PlaceBeforeRenderingId
                PlaceBeforeRenderingIndex = $PlaceBeforeRenderingIndex
                UpdateFinalLayoutAsWell = $UpdateFinalLayoutAsWell
                Parameters= $WrapperParameters
            }
        )
        ImportRenderings -renderingsToAttach $myRenderings
        
        
        
        $myRenderings = 
        @(
            @{ 
        
                PagePath       = $PagePath
                TargetPlaceholder=$WrapIntoPlaceholder
                SourcePlaceholder=$Placeholder
                SourceRenderingId=$RenderingId
                SourceRenderingIndex=$RenderingIndex
                TargetRenderingId=$WrapperRenderingId
                UpdateFinalLayoutAsWell = $UpdateFinalLayoutAsWell
            }
        )
        MoveRenderingChildPlaceholders -renderingInfo $myRenderings
        
        $WrapIntoPlaceholder= $WrapIntoPlaceholder.Trim("/")
        $WrapperPlaceholder = "/$($WrapperPlaceholder.Trim("/"))/$WrapIntoPlaceholder"
        
        $myRenderings = 
        @(
            @{ 
        
                PagePath       = $PagePath
                RenderingId=$RenderingId
                RenderingIndex=$RenderingIndex
                TargetRenderingId=$WrapperRenderingId
                Placeholder    = $WrapperPlaceholder
                UpdateFinalLayoutAsWell = $UpdateFinalLayoutAsWell
            }
        )
        UpdateRenderingPlaceholder -renderingInfo $myRenderings
        
        $myRenderings = 
        @(
            @{ 
        
                PagePath       = $PagePath
                RenderingId=$RenderingId
                RenderingIndex=$RenderingIndex
                UpdateFinalLayoutAsWell = $UpdateFinalLayoutAsWell
                Parameters= $Parameters
            }
        )
        UpdateRenderingParameters -renderingInfo $myRenderings
    
    
    
        Write-Host ""
        Write-Host ""
        Write-Host ""
    }
    
    function WrapRenderingWithNewRendering 
    {
        param(
            [Parameter(Mandatory = $true)]
            $renderingInfo
        )
    
        $WrapperTitle                      = $renderingInfo.WrapperTitle
        $PagePath                   = $renderingInfo.PagePath 
        $RenderingId              = $renderingInfo.RenderingId
        $RenderingIndex              = $null
        $WrapperRenderingId              = $renderingInfo.WrapperRenderingId
        $WrapperRenderingIndex              = $null
        $Placeholder                = $renderingInfo.Placeholder
        $WrapIntoPlaceholder                = $renderingInfo.WrapIntoPlaceholder
        $WrapperPlaceholder                = $renderingInfo.WrapperPlaceholder
    	$Parameters                 = $null
    	$WrapperParameters                = $null
        $UpdateFinalLayoutAsWell= $renderingInfo.UpdateFinalLayoutAsWell
        $PlaceBeforeRenderingId = $null
        $PlaceBeforeRenderingIndex = $null
            
        if($null -ne $renderingInfo.RenderingIndex)
        {
            $RenderingIndex =[int]::Parse( $renderingInfo.RenderingIndex)
        }
        
        if($null -ne $renderingInfo.PlaceBeforeRenderingIndex)
        {
            $PlaceBeforeRenderingIndex =[int]::Parse( $renderingInfo.PlaceBeforeRenderingIndex)
        }
        
        if($null -ne $renderingInfo.PlaceBeforeRenderingId)
        {
            $PlaceBeforeRenderingId = $renderingInfo.PlaceBeforeRenderingId
        }
         
        if($null -ne $renderingInfo.WrapperRenderingIndex)
        {
            $WrapperRenderingIndex =[int]::Parse( $renderingInfo.WrapperRenderingIndex)
        }
    
        if($UpdateFinalLayoutAsWell -eq $null)
        {
            $UpdateFinalLayoutAsWell = $false
        }
        
        if($null -ne $renderingInfo.Parameters)
        {
            $Parameters = $renderingInfo.Parameters
        }
        
        if($null -ne $renderingInfo.WrapperParameters)
        {
            $WrapperParameters = $renderingInfo.WrapperParameters
        }
    
        Write-Host ""
        Write-Host ""
        Write-Host "Processing '$PagePath'" -ForegroundColor Cyan
    
    
    
        Wrap-RenderingWithNewRendering  -PlaceBeforeRenderingId $PlaceBeforeRenderingId -PlaceBeforeRenderingIndex $PlaceBeforeRenderingIndex -WrapperTitle $WrapperTitle -PagePath $PagePath -RenderingId $RenderingId -RenderingIndex $RenderingIndex -WrapperRenderingId $WrapperRenderingId -WrapperRenderingIndex $WrapperRenderingIndex -Placeholder $Placeholder -WrapIntoPlaceholder $WrapIntoPlaceholder -WrapperPlaceholder $WrapperPlaceholder -Parameters $Parameters -WrapperParameters $WrapperParameters -UpdateFinalLayoutAsWell $UpdateFinalLayoutAsWell
        
    }
    
