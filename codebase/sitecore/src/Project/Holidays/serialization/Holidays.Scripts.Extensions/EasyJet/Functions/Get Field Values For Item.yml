Path: /sitecore/system/Modules/PowerShell/Script Library/SPE/Extensions/EasyJet/Functions/Get Field Values For Item
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    function Normalize-SitecoreIdString {
        param(
            [Parameter(Mandatory=$true)]
            [string]$Value
        )
    
        $id = $null
        if ([Sitecore.Data.ID]::TryParse($Value, [ref]$id)) {
            return $id.ToString()
        }
    
        return $Value
    }
    function GetFieldValuesForItem {
        param(
            $Item,
            $Fields,
            $Languages
        )
    
        $result = @{}
        foreach($field in $Fields) {
            $langValues = @{}
    
    
            if($Item[$field] -eq $null) {
                Write-Warning "Field '$field' not found in template '$($Item.TemplateName)'. Skipping..."
                continue
            }
    
            if($Item.Fields[$field].Shared) { 
                $sharedLang = "en"
                $versionItem = Get-Item -Path ("master:" + $Item.Paths.FullPath) -Language $sharedLang -ErrorAction SilentlyContinue
                if($versionItem -and $versionItem.Versions.Count -gt 0) {
                    $val = $versionItem.$field
                    if(-not $val) { $val = "" }
                    $langValues[$sharedLang] = Normalize-SitecoreIdString $val
                } else {
                    $langValues[$sharedLang] = ""
                }
            } else {
                foreach($lang in $Languages) {
                    $versionItem = Get-Item -Path ("master:" + $Item.Paths.FullPath) -Language $lang -ErrorAction SilentlyContinue
                    if($versionItem -and $versionItem.Versions.Count -gt 0) {
                        $val = $versionItem.$field
                        if(-not $val) { $val = "" }
                        $langValues[$lang] = Normalize-SitecoreIdString $val
                    } else {
                        $langValues[$lang] = ""
                    }
                }
            }
    Write-Host "_________"
    
            $result[$field] = $langValues
        }
        return $result
    }
    
Languages:
