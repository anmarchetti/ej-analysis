SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-NextSortorder {
        $maxSortOrder = Get-ChildItem -Path ("master:/sitecore/system/Modules/PowerShell/Script Library/Content Sync") -Recurse -ErrorAction SilentlyContinue | 
                        Sort-Object -Property { [int]$_.__Sortorder } -Descending | 
                        Select-Object -First 1 -ExpandProperty __Sortorder
    
        $nextSortOrder = ([int]$maxSortOrder) + 1
        return $nextSortOrder
    }
    
