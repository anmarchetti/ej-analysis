- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-RenderingByUID {
        param(
            [Parameter(Mandatory = $true)]
            $Page,
            [Parameter(Mandatory = $false)]
            [GUID] $UID,
            [Parameter(Mandatory = $false)]
            [bool]$FinalLayout
            
            
        )
    
        $renderings = $null
        if($FinalLayout -eq 1 -or $FinalLayout -eq $true)
        {
            $renderings = Get-Rendering -Item $Page -FinalLayout
        }
        else
        {
            $renderings = Get-Rendering -Item $Page 
        }
        $index = 0
        for ($i = 0; $i -lt $renderings.Count; $i++) 
        {
            if ([GUID]::Parse($renderings[$i].UniqueId) -eq $UID) 
            {
                return ($renderings[$i])
            }
        }
       Write-Host "`tRendering with uid '$UID' not found" -ForegroundColor Red
       return $null
    }
    
    
    
    
