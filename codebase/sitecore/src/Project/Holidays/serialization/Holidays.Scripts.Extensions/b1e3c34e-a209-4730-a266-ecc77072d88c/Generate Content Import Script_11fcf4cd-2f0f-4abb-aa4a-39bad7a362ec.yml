- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    Import-Function "Get Next Sortorder"
    
    function AddVIfStartsWithNumber {
            param (
            [String]$InputString
        )
    
        if ($InputString -match '^\d+') {
    
            return "v$InputString"
        }
        return $InputString
    }
    
    function GetFieldVariableName{
            param (
            [Item]$Item,
            [String]$Language,
            [String]$FieldName
        )
        $field = ( "$($field)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $id = ( "$($Item.ID)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $lang = ( "$($Language)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $ver = ( "$($Item.Version)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $name = ( "$($Item.Name)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $varName= "$($name)_$($field)_$($id)_$($lang)_v$($ver)"
        return AddVIfStartsWithNumber -InputString $varName;
    }
    
    function GetItemIdVariableName{
            param (
            [Item]$Item
        )
        $path=$Item.Paths.FullPath.Replace("/sitecore/content/EasyJet/","")
        $name = ( "$($path)" -replace "[^a-zA-Z0-9]", "").ToLower()
        $varName= "$($name)_Id"
        return AddVIfStartsWithNumber -InputString $varName;
    }
    
    function Replace-WithVarIfNeeded {
        param (
            [string]$Value,
            [hashtable]$XmlVars,
            [Item]$Item,
            [String]$FieldName,
            [String]$Language
            
        )
        $varName=GetFieldVariableName -Item $Item -Language $Language -FieldName $FieldName
        if($XmlVars.ContainsKey($varName)){
            return "`$$varName"
        }
    
        return "`"$Value`""
    }
    function Has-SpecialCharacters {
        param (
            [string] $subject
        )
        $arr=$subject.TocharArray()
    
        Foreach ($Char in $arr) {
            If ($Char -match '[!@#$%^&*(),.?":{}|<>]') {
                return true
            }
        }
    
       return false
    }
    function Generate-ContentImportScript {
        param (
            [array]$ItemsSelections,
            [string[]]$Languages,
            [string] $TargetItemPath
        )
        
        $idVariablesPlaceholder='IDVARIABLESPLACEHOLDER'
        $allItemFieldValues = @()
        foreach ($selection in $ItemsSelections) {
            $itemID    = $selection.Item.ID
            
            $item    = $selection.Item
            $language    = $selection.Language
            $fields  = $selection.Fields
    
            $values  = GetFieldValuesForItem -Item $item -Fields $fields -Languages $Languages
            $allItemFieldValues += @{
                Item        = $item
                Fields      = $fields
                FieldValues = $values
            }
        }
    
    
    
    $xmlFieldTypes = @("General Link",
    "Image with Focal Point",
    "layout",
    "Image")
    
        $xmlVariables = @{}
        $idVariables= @{}
        foreach ($itemData in $allItemFieldValues) {
          $idVarName=  GetItemIdVariableName -Item $itemData.Item
          
            if (-not $idVariables.ContainsKey($idVarName) ) {
                $value="$($itemData.Item.Id)"
                $value=($value -replace '`','``')
                $value=($value -replace '\$', '`$')
                $idVariables[$idVarName] = $value
            }
                        
                        
            foreach ($field in $itemData.FieldValues.Keys) {
                $fieldType = $itemData.Item.Fields[$field].Type
                
                foreach ($lang in $itemData.FieldValues[$field].Keys) {
    
                    $value = $itemData.FieldValues[$field][$lang];
                    
                    $varName = GetFieldVariableName -Item $itemData.Item -FieldName $field -Language $lang
                  
                    if (($value -and $xmlFieldTypes.Contains($fieldType)) -or $value -match '[!@#$%^&*(),.?":{}|<>]') {
                        if (-not $xmlVariables.ContainsKey($varName) ) {
                            $value=($value -replace '`','``')
                            $value=($value -replace '\$', '`$')
                            $xmlVariables[$varName] = $value
                        }
                    }
                }
            }
        }
    
        $scriptLines = @()
        $scriptLines += 'Import-Function "Import Content"'
        
        $scriptLines += $idVariablesPlaceholder
        
    
    
        foreach ($varName in $xmlVariables.Keys) {
            $value = $xmlVariables[$varName]
            $scriptLines += "`$$varName = @`""
            $scriptLines += "$($value)"
            $scriptLines += "`"@"
        }
    
    
    
    
    
        $scriptLines += "`$itemsToCreate = @("
        foreach ($itemData in $allItemFieldValues) {
            $id           = $itemData.Item.ID.ToString().ToUpper()
            $path         = $itemData.Item.Paths.FullPath
            $templatePath = $itemData.Item.Template.InnerItem.Paths.FullPath
    
            $scriptLines += "    @{"
            $scriptLines += "        Path        = `"$path`""
            $scriptLines += "        TemplatePath = `"$templatePath`""
            if ($id) {
                $scriptLines += "        Id          = `"$id`""
            }
    
            if ($itemData.Fields.Count -gt 0) {
                $scriptLines += "        Fields      = @{"
                foreach ($field in $itemData.Fields) {
                    $val = $itemData.FieldValues[$field]
                    if ($val -is [hashtable]) {
                        $scriptLines += "            `"$field`" = @{"
                        foreach ($lang in $val.Keys) {
                            $langVal = $val[$lang]
                            $scriptLines += "                `"$lang`" = " + (Replace-WithVarIfNeeded $langVal $xmlVariables $itemData.Item $field $lang)
                        }
                        $scriptLines += "            }"
                    } else {
                        $scriptLines += "            `"$field`" = " + (Replace-WithVarIfNeeded $langVal $xmlVariables $itemData.Item $field "en")
                    }
                }
                $scriptLines += "        }"
            }
            $scriptLines += "    },"
        }
    
    
        if ($scriptLines.Count -gt 0 -and $scriptLines[-1].Trim().EndsWith(",")) {
            $scriptLines[-1] = $scriptLines[-1].TrimEnd(',')
        }
    
        $scriptLines += ")"
        $scriptLines += "ImportContent -itemsToCreate `$itemsToCreate"
    
        $processedLines = $scriptLines | ForEach-Object {
            $line = $_
    
            foreach ($key in $idVariables.Keys) {
                $value = $idVariables[$key]
                $line = $line.Replace("`"$($value)`"", "`$$key")
                $line = $line.Replace($value, "`$$key")
                $line = $line.Replace($value.Trim("{","}"), "`$$key")
                $line = $line.Replace($value.ToLower(), "`$$key")
                $line = $line.Replace($value.Trim("{","}").ToLower(), "`$$key")
            }
        
            return $line
        }
        
        $finalScript = $processedLines -join "`r`n"
        
        $idVariableDefinition=@()
        foreach ($varName in $idVariables.Keys) {
            $value = $idVariables[$varName]
            $idVariableDefinition += "`$$varName = `"$value`""
        }
        $idVariableDefinitionScript = $idVariableDefinition -join "`r`n"
    
        $finalScript= $finalScript.Replace( $idVariablesPlaceholder, $idVariableDefinitionScript)
    
        $sortOrder= (Get-NextSortorder)
    
        $itemsToCreateScript = @(
            @{
                Path        = $TargetItemPath
                TemplatePath = "/sitecore/templates/Modules/PowerShell Console/PowerShell Script"
                Fields      = @{
                    "Script" = $finalScript
                    "__Sortorder" = "$($sortOrder)"
                }
            }
        )
        ImportContent -itemsToCreate $itemsToCreateScript
    }
    
