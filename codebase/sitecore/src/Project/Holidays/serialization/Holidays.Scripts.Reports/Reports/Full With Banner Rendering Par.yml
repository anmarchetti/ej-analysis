Path: /sitecore/system/Modules/PowerShell/Script Library/Reports/Full With Banner Rendering Parameters Report
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $oldReport = $true
    
    
    function OldReportModel
    {
        return [PSCustomObject]@{
                        Page           = $item.Paths.FullPath
                        UniqueId = $rendering.UniqueId
                        Language       = $item.Language.Name
                        TextAlignment = $params.TextAlignment
                        CTATheme   =   $params.CTATheme
                        TitleStyle = $params.TitleStyle
                        IsSlimVersion = $params.IsSlimVersion
                        IsGenericContentVersion = $params.IsGenericContentVersion
                        PillColour = $params.PillColour
                    }
    }
    
    function NewReportModel{
        return [PSCustomObject]@{
                        Page           = $item.Paths.FullPath
                        UniqueId = $rendering.UniqueId
                        Language       = $item.Language.Name
                        TextAlignment = $params.TextAlignment
                        CTATheme   =   $params.CTATheme
                        TitleStyle = $params.TitleStyle
                        Version = $params.Version
                        TitleFontSize = $params.TitleFontSize                  
                    }
    }
    
    
    
    # Function to retrieve rendering usage
    function Get-RenderingUsage {
        param (
            [string]$RenderingName
        )
    
        # Search all items in the content tree for the rendering
        $items = Get-ItemReferrer -Path "master:/sitecore/layout/Renderings/Feature/PageContent/Full Width Banner"
    
        $result = @()
    
        foreach ($item in $items) {
            # Get the renderings associated with the item
            $renderings = Get-Rendering -Item $item | Where-Object { $_.ItemId -eq "{9548AF18-BCAB-4DAE-A754-B3A99C14A429}" }
            
            foreach ($rendering in $renderings) {
                # Extract rendering parameters
                $params = Get-RenderingParameter -Rendering $rendering
                    
                $row = $null
                if($oldReport){
                    $row = OldReportModel
                }else{
                    $row = NewReportModel
                }
                    
                $result += $row
            }
        }
    
        if (-not $result) {
            Write-Host "No items found using rendering '$RenderingName'."
        }
    
        return $result
    }
    
    
    
    # Execute the function and output results
    $renderingUsage = Get-RenderingUsage -RenderingName $renderingName
    
    if ($renderingUsage) {
        # Output results in a grid view or CSV file
        $renderingUsage | Show-ListView 
    } else {
        Write-Host "No pages found using the rendering '$renderingName'."
    }
    
