- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function -Name ConvertTo-Xlsx
    Import-Function -Name Export-Xlsx
    
    $sourceDb = "master"
    $dateNow = Get-Date -Format "dd/MM/yyyy"
    
    $reportsFolderPath = "/sitecore/media library/Files/easyJet Hotel Report Export"
    
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function Save-Document ($reportsFolderPath,$reportFolderName,$reportName,$data) {
    	$reportsFolder = Get-Or-Create-Item -Path "$($reportsFolderPath)/$($reportFolderName)" -Template "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
    	$item = New-Item -Path "$($reportsFolder.Paths.FullPath)/$reportName" -ItemType "{962B53C4-F93B-4DF9-9821-415C867B8903}"
    	$data = $data | ForEach-Object { New-Object PSObject -Property $_ }
    	[byte[]]$data = $data | ConvertTo-Xlsx
    	[Sitecore.Data.Items.MediaItem]$mediaItem = $item
    	[Sitecore.Resources.Media.Media]$media = [Sitecore.Resources.Media.MediaManager]::GetMedia($mediaItem);
    	$stream = New-Object System.IO.MemoryStream
    	$stream.Write($data,0,$data.Count)
    	$media.SetStream($stream,"xlsx");
    	$stream.Close();
    	Out-Download -Name "$($reportName).xlsx" -InputObject $data
    }
    
    function Get-ItemBasedOnTemplate {
        param(
            [string]$TemplateId
        )
    
        $queue = New-Object System.Collections.Queue
        $processedLookup = New-Object System.Collections.Generic.HashSet[string]
        if(-not(Test-Path -Path "master:$($TemplateId)")) { return }
        $processedLookup.Add($TemplateId) > $null  
        Get-ItemReferrer -Id $TemplateId -ItemLink | 
            Where-Object { $_.SourceItemID } | 
            ForEach-Object { $queue.Enqueue($_.SourceItemID) }
    
        $database = Get-Database -Name "master"
        while($queue.Count -and ($referrerId = $queue.Dequeue())) {
            if($processedLookup.Contains($referrerId)) { continue }
            $processedLookup.Add($referrerId) > $null
            $referrer = $database.GetItem($referrerId)
            if(!$referrer) { continue }
            if($referrer.Paths.FullPath.StartsWith("/sitecore/templates")) { 
                if($referrer.Name -eq "__Standard values") { continue }
                foreach($referrerItemLink in Get-ItemReferrer -Id $referrerId -ItemLink | Where-Object { $_.SourceItemID }) {
                    $queue.Enqueue($referrerItemLink.SourceItemID)
                }
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrerId, $database)
            } else {
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrer)
            }
            
            if ($itemTemplate -and $itemTemplate.DescendsFromOrEquals($TemplateId)) {
                $referrer
            }
        }
    }
    
    function Prepare-Data {
    	param($items)
    
    	$rows = @()
    
    	foreach ($item in $items) {
    		$row = Get-Data-From-Item -Item $item
    		$rows += $row
    		$i = 0
    	}
    
        if($rows.Count -eq 0) {
            $rows +=[ordered]@{
                GIATA = ""
    		    HotelAtcomCodes = ""
    		    HGBCode = ""
    		    TripAdvisorID = ""
    		    CountryName = ""
    		    RegionName = ""
    		    ResortName = ""
    		    HotelName = ""
    		    HotelStarRating = ""
    		    LastVersionNumber =  ""
    		    "Trip Advisor Rating Version" =  ""
    		    "Item Version Creation DateTime" = ""
    		    PublishedStatus = ""
            }
        }
        
    	Write-Host "Trip adviser report has been prepared"
    
    	return $rows
    }
    
    function Get-PublishedStatus ($item) {
    	$path = $item.ItemPath -replace ('/','\')
    	$itemExists = Test-Path -Path "web:$($path)"
    
    	if ($itemExists)
    	{
    		return "true"
    	}
    	else
    	{
    		return "false"
    	}
    }
    
    
    function Get-Data-From-Item
    {
    	param($item)
        
        $lastVersionItem =  $item.Versions.GetLatestVersion();
        $lastVersionNumber = $lastVersionItem.Version.Number
        $atcomCodes = @()
    	$item.Children | Where { $_.TemplateId -eq "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}" } | %{ $atcomCodes += $_["Code"] }
    	$reportRow = [ordered]@{
    		GIATA = $item["GiataCode"]
    		ATComCodes = $atcomCodes -join "| "
    		HGBCode = $item["HotelBedsCode"]
    		TripAdvisorID = $item["TripAdvisorId"]
    		CountryName = $item.Parent.Parent.Parent["Name"]
    		RegionName = $item.Parent.Parent["Name"]
    		ResortName = $item.Parent["Name"]
    		HotelName = $item["Name"]
    		HotelStarRating = $item["StarRating"]
    		LastVersionNumber =  $lastVersionNumber
    	}
    	
        $previousVersionCount = 6
    	$versions = $item.Versions.GetVersions() | Select -Last $previousVersionCount | Sort-Object -Property Version -Descending
    	$i = 0
    	
    	foreach($versionItem in $versions)
    	{
    	    if($i -eq 0){
    	        $reportRow.Add("Trip Advisor Rating LastVersion", $versionItem["HotelRating"])
                $reportRow.Add("Item Version Creation DateTime LastVersion", [Sitecore.DateUtil]::FormatIsoDate($versionItem["__Created"]))
    	    }else{
    	        $reportRow.Add("Trip Advisor Rating LastVersion-$($i)", $versionItem["HotelRating"])
                $reportRow.Add("Item Version Creation DateTime LastVersion-$($i)", [Sitecore.DateUtil]::FormatIsoDate($versionItem["__Created"]))
    	    }
            $i++
        }
    
    	$status = Get-PublishedStatus($item)
    	$reportRow.Add("PublishedStatus", $status)
    
    
    	return $reportRow
    }
    
    function Save-Reports-As-Xlsx {
    	param($report,$reportName)
    
    	$time = Get-Date -UFormat %s -Millisecond 0
    	$date = Get-Date -Format "dd_MM_yyyy"
    
    	$filename = "TripAdvisorReport_$($date)_$time"
    	$resultFolder = "TripAdvisor Reports"
    
    	Save-Document -ReportsFolderPath $reportsFolderPath -ReportFolderName $resultFolder -ReportName $filename.Replace(" ","") -Data $report
    
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    #find hotels items
    $hotelTemplate = "{28E5E169-8F72-4F90-A277-280A8302B607}"
    $items = Get-ItemBasedOnTemplate -TemplateId $hotelTemplate | Sort-Object -Property Version -Descending 
    $items = $items | Where-Object { $_.Paths.FullPath.StartsWith("/sitecore/content/EasyJet/Holidays/Home/Destinations") }
    
    $itemCount = $items | Measure-Object | Select-Object -Expand Count
    Write-Log "Hotels were found $($itemCount)"
    Write-Host "Hotels were found $($itemCount)"
    
    #Prepare items to table format
    $report = Prepare-Data -items $items
    
    Save-Reports-As-Xlsx -Report $report -ReportName $tripAdviserReportName
    
    $stopWatch.Stop()
    Write-Output "Info: Elapsed time - $($StopWatch.Elapsed)" 
