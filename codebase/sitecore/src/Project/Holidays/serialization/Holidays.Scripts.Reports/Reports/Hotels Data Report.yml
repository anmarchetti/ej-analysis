    function Get-Hotels-Data-Report-Data
    {
        param($hotel, $images, $facilities, $rooms, $boards)
        Start-Measure
        $rooms_images_count = 0
        $rooms_facilities_count = 0
        
        if($rooms -ne $null){
    
            $rooms | ForEach-Object { Get-Children-Count-By-Template-Deep -Parent $_ -childTemplateId $imagesFolderTemplateId } | ForEach-Object {  $rooms_images_count += $_ }
            $rooms | ForEach-Object { Get-Children-Count-By-Template-Deep -Parent $_ -childTemplateId $roomsFacilitiesFolderTemplateId } | ForEach-Object {  $rooms_facilities_count += $_ }
        }
        $atcomCodes = @()
    	$item.Children | Where { $_.TemplateId -eq "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}" } | %{ $atcomCodes += $_["Code"] }
        
    	$data = [ordered]@{
    	    Date = $dateNow
    		HotelAtcomCodes = $atcomCodes -join "| "
    		GIATA = $item['GiataCode']
    		HBG = $item['HotelBedsCode']
    		TripAdvisorId = $item['TripAdvisorId']
    		HotelName = $item["Name"]
    		Description = $item['HotelDescription']
    		BrowseUrl = Get-Browse-Url -Item $item
    		VersionNumber = $item.Versions.Count
    		IsExternalAccommadation = [System.Convert]::ToBoolean([int]$item["ExternalAccommodation"].Value)
    		NumberOfSubfolder = $item.Children.Count
    		CountOfImages = $images.Count #Image Folder TemplateId
    		CountOfFacilities = $facilities.Count #Facility Folder TemplateId
    		CountOfRooms = $rooms.Count
    		CountOfBoards = $boards.Count #Board Folder TemplateId
    		Airports = GetAirports ($item['Airports'])
    		Lat = $item['Latitude']
    		Long = $item['Longitude']
    		Strapline = $item['Strapline']
    		KSP1 = $item['KeySellingPoint1']
    		KSP2 = $item['KeySellingPoint2']
    		HotelStarRating = $item['StarRating']
    		TripAdviserRating = $item['HotelRating']
    		CountryCode = $item.Parent.Parent.Parent['Code']
        	CountryName = $item.Parent.Parent.Parent['Name']
        	RegionCode = $item.Parent.Parent['Code']
        	RegionName = $item.Parent.Parent['Name']
    		ResortCode = $item.Parent['Code']
    		ResortName = $item.Parent['Name']
    		HotelThemeCode = Get-ThemeType-Code -ThemeTypeId $item['HotelTheme']
    		TypeCode = Get-ThemeType-Code -ThemeTypeId $item['Types']
    		CountOfImagesFromS3 = Get-S3-Images-Count -images $images
    		CountOfImagesInRooms = $rooms_images_count
    		CountOfFacilitiesInRooms = $rooms_facilities_count
    		Published = GetPublishedStatus($hotel) 
    	}
        Stop-Measure
        return $data
    }
    
    function Get-Hotels-Rooms-Data
    {
        param($hotel, $rooms, $hotelInfo)
        Start-Measure
        $rooms_data = @()
        $images_per_room = @{}
        $facilities_per_room = @{}
        
        if($rooms -ne $null){
    
            foreach($room in $rooms)
            {
                $images_count = Get-Children-Count-By-Template-Deep -Parent $room -childTemplateId $imagesFolderTemplateId
                $facilities_count = Get-Children-Count-By-Template-Deep -Parent $room -childTemplateId $roomsFacilitiesFolderTemplateId
                $room_id = $room.ID
                $images_per_room.Add($room_id, $images_count)
                $facilities_per_room.Add($room_id, $facilities_count)
            }
            
            $rooms_data = $rooms | ForEach-Object { Get-Room-Name-Type -Room $_ }
        }
        
        
        $data = @()
        
        $giataCode = $item["GiataCode"]
        $hotelNameValue = $item['Name']
    
        if($rooms_data.Count -eq 0){
        	$data += ($hotelInfo + [ordered]@{
        	    Date = $dateNow
        		GIATA = $giataCode
        		HotelName = $hotelNameValue
        		RoomFolder = ""
        		RoomType = ""
        		RoomName = ""
        		ImagesPerRoom = 0
        		FacilitiesPerRoom = 0
        		Published = GetPublishedStatus($item)
        	})
        } else {
            foreach($room_data in $rooms_data){
                
                $data += ($hotelInfo + [ordered]@{
                    Date = $dateNow
                    GIATA = $giataCode
            		HotelName = $hotelNameValue
            		RoomFolder = $room_data["RoomFolder"]
            		RoomType = $room_data["Type"]
            		RoomName = $room_data["Name"]
            		ImagesPerRoom = $images_per_room[$room_data["UniqueId"]]
            		FacilitiesPerRoom = $facilities_per_room[$room_data["UniqueId"]]
            		Published = $room_data["PublishedStatus"]
                })
            }
        }
        Stop-Measure
        return $data
    }
    
    
