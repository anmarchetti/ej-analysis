    function Get-Data-From-Item
    {
    	param($item, $neededReportNames)
        Start-Measure
    
        $hotelInfo = Get-Additional-Hotel-Info -HotelItem $item
        
    	# hotel' child folders
    	
    	$images = Get-Children-By-Parent-Template -Parent $item -templateId $imagesFolderTemplateId
        $facilities = Get-Children-By-Parent-Template -Parent $item -templateId $facilityFolderTemplateId
        $rooms = Get-Rooms -Parent $item -templateId $roomsFolderTemplateId
        $boards = Get-Children-By-Parent-Template -Parent $item -templateId $boardsFolderTemplateId
        
        $data = @()
    
        if($neededReportNames -contains $dataReportName){
      $hotelsDataReport = Get-Hotels-Data-Report-Data -Hotel $item -Images $images -Facilities $facilities -Rooms $rooms -Boards $boards 
            $data += ,$hotelsDataReport
        }
    
        if($neededReportNames -contains $roomsReportName){
            $hotelsRoomsReport = Get-Hotels-Rooms-Data -Hotel $item -Rooms $rooms -HotelInfo $hotelInfo
            $data += ,$hotelsRoomsReport
        }
    
        if($neededReportNames -contains $imagesReportName){
            $hotelsImagesReport = Get-Hotels-Images-Data -Hotel $item -Images $images -HotelInfo $hotelInfo
            $data += ,$hotelsImagesReport
        }
    
        if($neededReportNames -contains $boardsReportName){
            $hotelsBoardsReport = Get-Hotels-Boards-Data -Hotel $item -Boards $boards -HotelInfo $hotelInfo 
            $data += ,$hotelsBoardsReport
        }
    
        if($neededReportNames -contains $facilitiesReportName){
            $hotelsFacilitiesReport = Get-Hotels-Facilities-Data -Hotel $item -Facilities $facilities -HotelInfo $hotelInfo
            $data += ,$hotelsFacilitiesReport
        }
        Stop-Measure
    	return ,$data  |  Where {$_ -ne $null}
    }
    
    function Save-Reports{
        param($reports, $reportNameRoots)
        
        Start-Measure
    
        $i = 0
    
        $time = Get-Date -UFormat %s -Millisecond 0
        $date = Get-Date -Format "dd_MM_yyyy"
        foreach($report in $reports){
            if($reportNameRoots[$i] -ne $null){
                $reportName = $reportNameRoots[$i++]
                $filename = "Hotel$($reportName)Report_$($date)_$time"
                $resultFolder = "Hotel $($reportName) Reports"
            
                Save-Document-ToCsv -ReportsFolderPath $reportsFolderPath -ReportFolderName $resultFolder -ReportName $filename.Replace(" ", "") -Data $report
            }
        }
    
        Stop-Measure
    }
    
    #find hotels items
    $hotelTemplate = "{28E5E169-8F72-4F90-A277-280A8302B607}"
    
    
    $items =  Get-ItemBasedOnTemplate -TemplateId $hotelTemplate 
    $items = $items | Where-Object { $_.Paths.FullPath.StartsWith("/sitecore/content/EasyJet/Holidays/Home/Destinations") }
    $itemCount = $items | Measure-Object | Select-Object -Expand Count
    
    Write-Log "Hotels were found $($itemCount)"
    Write-Host "Hotels were found $($itemCount)"
    
    #Prepare items to table format
    
    $reports = Prepare-Data -items $items -NumberOfReports $reportNameRoots.Count -NeededReportNames $reportNameRoots | Where-Object { $_.Count -ne 0 }
    
    Save-Reports -Reports $reports -ReportNameRoots $reportNameRoots | Where { $_.Name -ne $null }
    
    Show-CumulativeTimes
