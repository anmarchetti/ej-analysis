    function GetAirports ($value) {
        Start-Measure
    	$ids = $value.Split("|")
    	$airports = @()
    	$names = @()
    	$ids | ForEach-Object {
    		if (![string]::IsNullOrEmpty($_)) {
    			$airports += Get-Item $sourceDb":" -Id $_ -ErrorAction SilentlyContinue
    		}
    	}
    
    	$airports | ForEach-Object {
    		$names += $_.Name
    	}
    
    	$result = [system.String]::Join(", ",$names)
    	$result
        Stop-Measure
    }
    
