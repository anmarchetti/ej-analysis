    function Get-Or-Create-Item($path, $template){
        Start-Measure
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        Stop-Measure
        return $item
    }
    
    function Save-Document-ToCsv($reportsFolderPath, $reportFolderName, $reportName, $data){
            Start-Measure
            $reportsFolder = Get-Or-Create-Item -Path "$($reportsFolderPath)/$($reportFolderName)" -Template "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
            $item = New-Item -Path "$($reportsFolder.Paths.FullPath)/$reportName" -ItemType "{962B53C4-F93B-4DF9-9821-415C867B8903}"
            $data = $data | ForEach-Object { New-Object PSObject -Property $_ }
            $csv = $data | ConvertTo-Csv -NoTypeInformation
            [Sitecore.Data.Items.MediaItem]$mediaItem = $item
            [Sitecore.Resources.Media.Media] $media = [Sitecore.Resources.Media.MediaManager]::GetMedia($mediaItem);
            $stream = New-Object System.IO.MemoryStream
            $txt = New-Object System.IO.StreamWriter($stream)
            $csv | ForEach-Object { $txt.WriteLine($_)}
            $txt.Flush()
            $media.SetStream($stream, "csv");
            Out-Download -Name "$($reportName).csv" -InputObject $stream
            $stream.Close();
            Stop-Measure
    }
    
    function Get-ItemBasedOnTemplate {
        param(
            [string]$TemplateId
        )
        Start-Measure
        $queue = New-Object System.Collections.Queue
        $processedLookup = New-Object System.Collections.Generic.HashSet[string]
        if(-not(Test-Path -Path "master:$($TemplateId)")) { return }
        $processedLookup.Add($TemplateId) > $null  
        Get-ItemReferrer -Id $TemplateId -ItemLink | 
            Where-Object { $_.SourceItemID } | 
            ForEach-Object { $queue.Enqueue($_.SourceItemID) }
    
        $database = Get-Database -Name "master"
        while($queue.Count -and ($referrerId = $queue.Dequeue())) {
            if($processedLookup.Contains($referrerId)) { continue }
            $processedLookup.Add($referrerId) > $null
            $referrer = $database.GetItem($referrerId)
            if(!$referrer) { continue }
            if($referrer.Paths.FullPath.StartsWith("/sitecore/templates")) { 
                if($referrer.Name -eq "__Standard values") { continue }
                foreach($referrerItemLink in Get-ItemReferrer -Id $referrerId -ItemLink | Where-Object { $_.SourceItemID }) {
                    $queue.Enqueue($referrerItemLink.SourceItemID)
                }
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrerId, $database)
            } else {
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrer)
            }
            
            if ($itemTemplate -and $itemTemplate.DescendsFromOrEquals($TemplateId)) {
                $referrer
            }
        }
        Stop-Measure
    }
    
    function Prepare-Data {
        param($items, $numberOfReports, $neededReportNames)
        Start-Measure
        $rows = @()
        for ($i = 0; $i -lt $numberOfReports; $i++) {
            $rows += ,[System.Collections.ArrayList]@()
        }
        $totalItems = $items.Count
        $itemIndex = 0
        foreach ($item in $items) {
            $reportsRows = Get-Data-From-Item -Item $item -NeededReportNames $neededReportNames
            $i = 0
            $percentComplete = ($itemIndex / $totalItems) * 100
            Write-Progress -Activity "Preparing Data" -Status "$itemIndex of $totalItems items processed" -PercentComplete $percentComplete
            foreach ($reportRows in $reportsRows) {
                $reportRows | ForEach-Object { $rows[$i].AddRange(@(,$_)) }
                $i++
            }
            $itemIndex++
        }
    
        $i = 0
        foreach ($row in $rows) {
            Write-Host "prepared $($row.Count) rows for $($neededReportNames[$i]) report"
            Write-Log "prepared $($row.Count) rows for $($neededReportNames[$i]) report"
            $i++
        }
    
        Write-Host "Hotel's report has been prepared"
        Write-Log "Hotel's report has been prepared"
    
        Stop-Measure
        return ,$rows
    }
    
    
