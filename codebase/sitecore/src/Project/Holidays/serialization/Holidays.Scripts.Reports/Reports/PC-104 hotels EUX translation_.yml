    Import-Function -Name ConvertTo-Xlsx
    Import-Function -Name Export-Xlsx
    
    Import-Function -Name PerformanceProfiler
    
    function Get-Or-Create-Item($path, $template){
        Start-Measure
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        Stop-Measure
        return $item
    }
    
    function Save-Document-ToCsv($reportsFolderPath, $reportFolderName, $reportName, $reportData){
            Start-Measure
            $reportsFolder = Get-Or-Create-Item -Path "$($reportsFolderPath)/$($reportFolderName)" -Template "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
            write-host $reportsFolder.FullPath
            $item = New-Item -Path "$($reportsFolder.Paths.FullPath)/$reportName" -ItemType "{962B53C4-F93B-4DF9-9821-415C867B8903}"
            #$reportData = $reportData | ForEach-Object { New-Object PSObject -Property $_ }
            $csv = $reportData | ConvertTo-Csv -NoTypeInformation
            [Sitecore.Data.Items.MediaItem]$mediaItem = $item
            [Sitecore.Resources.Media.Media] $media = [Sitecore.Resources.Media.MediaManager]::GetMedia($mediaItem);
            $stream = New-Object System.IO.MemoryStream
            $txt = New-Object System.IO.StreamWriter($stream)
            $csv | ForEach-Object { $txt.WriteLine($_)}
            $txt.Flush()
            $media.SetStream($stream, "csv");
            Out-Download -Name "$($reportName).csv" -InputObject $stream
            $stream.Close();
            Stop-Measure
    }
    
    function Save-Report{
        param($report, $reportNameRoot)
        
        Start-Measure
    
        $i = 0
    
        $time = Get-Date -UFormat %s -Millisecond 0
        $date = Get-Date -Format "dd_MM_yyyy"
        $reportName = $reportNameRoot
        $filename = "Hotel$($reportName)Report_$($date)_$time"
        $resultFolder = "Hotel $($reportName) Reports"
    
        Save-Document-ToCsv -ReportsFolderPath $reportsFolderPath -ReportFolderName $resultFolder -ReportName $filename.Replace(" ", "") -ReportData $report
    
        Stop-Measure
    }
    
    function Is-Publishable($item, $langCode){
        $lang = [Sitecore.Globalization.Language]::Parse($langCode)
        $langItem = $item.Database.GetItem($item.ID, $lang)
        if ($langItem -and $langItem.Versions.Count -gt 0 -and
        $langItem.Publishing.IsPublishable([datetime]::UtcNow, $true)) {
            "Yes"
        } else {
            "No"
        }
    }
    
    function Get-VersionCount($item, $langCode) {
        $lang = [Sitecore.Globalization.Language]::Parse($langCode)
        $langItem = $item.Database.GetItem($item.ID, $lang)
        if (-not $langItem) { return "No versions" }
        if($langItem.Versions.Count -eq ""){
            return "No translation"
        }
        
        return $langItem.Versions.Count
    }
    
    function Is-VersionPublished($item, $langCode) {
        $lang = [Sitecore.Globalization.Language]::Parse($langCode)
        $webDb = Get-Database "web"
        $webItem = $webDb.GetItem($item.ID, $lang)
        if($webItem -and $webItem.Versions.Count -gt 0){
            return "Yes"
        }
        return "No"
    }
    
    
    function GetHotelInfo($item){
        $atcomFolders = Get-ChildItem -Path $item.ProviderPath | Where-Object { $_.TemplateName -eq "Accommodation Rooms Folder"}
        $atcomCodes = ""
        $isFirst = $true
        foreach($atcomFolder in  $atcomFolders){
            if($isfirst){
            $atcomCodes += "$($atcomFolder['Code'])" 
            $isFirst = $false
            }else {
                $atcomCodes += "|$($atcomFolder['Code'])"
            }
            
            return [PSCustomObject]@{
                GIATACode                       = $item["Giatacode"]
                AccomCode                       = $atcomCodes
                HotelName                       = $item.Name
                Country                         = $item.Parent.Parent.Parent.Name
                Region                          = $item.Parent.Parent.Name
                Resort                          = $item.Parent.Name
                UK_Versions            = Get-VersionCount $item "en"
                UK_Publishable         = Is-Publishable $item "en"
                UK_Published           = Is-VersionPublished $item "en"
        
                French_FR_Versions     = Get-VersionCount $item "fr-FR"
                French_FR_Publishable  = Is-Publishable $item "fr-FR"
                French_FR_Published    = Is-VersionPublished $item "fr-FR"
        
                German_DE_Versions     = Get-VersionCount $item "de-DE"
                German_DE_Publishable  = Is-Publishable $item "de-DE"
                German_DE_Published    = Is-VersionPublished $item "de-DE"
        
                French_CH_Versions     = Get-VersionCount $item "fr-CH"
                French_CH_Publishable  = Is-Publishable $item "fr-CH"
                French_CH_Published    = Is-VersionPublished $item "fr-CH"
        
                German_CH_Versions     = Get-VersionCount $item "de-CH"
                German_CH_Publishable  = Is-Publishable $item "de-CH"
                German_CH_Published    = Is-VersionPublished $item "de-CH"
            }
        }
    }
    
    function Get-ItemBasedOnTemplate {
        param(
            [string]$TemplateId
        )
        Start-Measure
        $queue = New-Object System.Collections.Queue
        $processedLookup = New-Object System.Collections.Generic.HashSet[string]
        if(-not(Test-Path -Path "master:$($TemplateId)")) { return }
        $processedLookup.Add($TemplateId) > $null  
        Get-ItemReferrer -Id $TemplateId -ItemLink | 
            Where-Object { $_.SourceItemID } | 
            ForEach-Object { $queue.Enqueue($_.SourceItemID) }
    
        $database = Get-Database -Name "master"
        while($queue.Count -and ($referrerId = $queue.Dequeue())) {
            if($processedLookup.Contains($referrerId)) { continue }
            $processedLookup.Add($referrerId) > $null
            $referrer = $database.GetItem($referrerId)
            if(!$referrer) { continue }
            if($referrer.Paths.FullPath.StartsWith("/sitecore/templates")) { 
                if($referrer.Name -eq "__Standard values") { continue }
                foreach($referrerItemLink in Get-ItemReferrer -Id $referrerId -ItemLink | Where-Object { $_.SourceItemID }) {
                    $queue.Enqueue($referrerItemLink.SourceItemID)
                }
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrerId, $database)
            } else {
                $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrer)
            }
            
            if ($itemTemplate -and $itemTemplate.DescendsFromOrEquals($TemplateId)) {
                $referrer
            }
        }
        Stop-Measure
    }
    
    $exportData = @()
    $reportsFolderPath = "/sitecore/media library/Files/easyJet Hotel Report Export"
    
    #find hotels items
    $hotelTemplate = "{28E5E169-8F72-4F90-A277-280A8302B607}"
    
    $items =  Get-ItemBasedOnTemplate -TemplateId $hotelTemplate
    $items = $items | Where-Object { $_.Paths.FullPath.StartsWith("/sitecore/content/EasyJet/Holidays/Home/Destinations") }
    $itemCount = $items | Measure-Object | Select-Object -Expand Count  
    
    Write-Log "Hotels were found $($itemCount)"
    Write-Host "Hotels were found $($itemCount)"
    
    foreach($hotel in $items)
    {
        $hotelData= GetHotelInfo -item $hotel
        $exportData += $hotelData
    }
    
    Save-Report -report $exportData -reportNameRoot "Translations"
