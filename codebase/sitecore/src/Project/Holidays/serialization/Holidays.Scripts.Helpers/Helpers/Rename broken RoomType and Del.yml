Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Rename broken RoomType and Delete dublicates
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #before run this script make sure that database is relinked
    
    $items = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Data/Room Types/Atcom"
    
    $hashTable = @{}
    
    function DeleteDuplicate-AtcomRoomType {
        foreach ($item in $items) {
        	if ($hashTable[$item["Code"]] -ne $null) {
        		$newItem = $hashTable[$item["Code"]]
        		$links = Get-ItemReferrer -Item $item -ItemLink
        		Write-Host "Item with ID: $($newItem.ID) has $($links.Count) links"
        		foreach ($link in $links)
        		{
        			$linkedItem = Get-Item -Path master:\ -Id $link.SourceItemID
        			$itemField = $linkedItem.Fields[$link.SourceFieldID]
        			$field = [Sitecore.Data.Fields.FieldTypeManager]::GetField($itemField)
        
        			#change link
        			$linkedItem.Editing.BeginEdit()
        			$field.Relink($link,$newItem)
        			$linkedItem.Editing.EndEdit() | Out-Null
        			Write-Host "Item with ID: $($linkedItem.ID) is relinked"
        		}
        		#remove duplicate
        		$path = $item.Paths.FullPath
        		Write-Host $path "Deleted"
        	    $item | Remove-Item 
        	} else {
        		$hashTable[$item["Code"]] = $item
        	}
        } 
    }
    
    
    function Rename-AtcomRoomType {
        foreach ($item in $items) {
            
            $code = $item["Code"]
            $name = $item["Name"]
            $itemName = "$($code) - $($name)"
            
            if($itemName -ne $item.Name){
                Write-Host "Item $($item.Name) will be renamed as $($itemName)" 
                $item.Editing.BeginEdit()
                $item.Name = [Sitecore.Data.Items.ItemUtil]::ProposeValidItemName($itemName)
                $item.Editing.EndEdit()
            }
        } 
    }
        
    Rename-AtcomRoomType
    DeleteDuplicate-AtcomRoomType
