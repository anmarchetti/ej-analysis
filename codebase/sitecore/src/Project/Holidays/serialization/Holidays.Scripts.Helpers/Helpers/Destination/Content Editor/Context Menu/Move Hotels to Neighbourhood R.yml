---
ID: "8d7c9f55-ca54-430f-8b22-74ee20fa3531"
Parent: "e4ec9c3b-66d5-4d3f-9333-05d096cd2b6c"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Destination/Content Editor/Context Menu/Move Hotels to Neighbourhood Resorts
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    <#
    .SYNOPSIS
        Move hotels from city resorts to neighbourhood resorts, create redirects, and optionally update Resort field on hotels.
        CSV format must contain From, To, ID where 'From' is existing URL, 'To' is new URL, and 'ID' is the item ID.
    #>
    
    $database = "master"
    $errorList = New-Object System.Collections.Generic.List[System.String]
    $warningList = New-Object System.Collections.Generic.List[System.String]
    $movedItems = New-Object System.Collections.Generic.List[System.String]
    
    function Log-Warning {
        param (
            [string]$Message
        )
    
        Write-Warning $Message
        $warningList.Add($Message) | Out-Null
    }
    
    function Resolve-SelectedItem {
        param (
            $Value
        )
    
        if ($null -eq $Value) {
            return $null
        }
    
        if ($Value -is [Sitecore.Data.Items.Item]) {
            return $Value
        }
    
        if ($Value.PSObject.Properties.Match("ItemPath").Count -gt 0) {
            return Get-Item -Path $Value.ItemPath -ErrorAction SilentlyContinue
        }
    
        if ($Value -is [string]) {
            return Get-Item -Path $Value -ErrorAction SilentlyContinue
        }
    
        return $null
    }
    
    function Get-CsvDataFromItem {
        param (
            [Sitecore.Data.Items.Item]$CsvItem
        )
    
        if ($null -eq $CsvItem.Fields["Blob"]) {
            return $null
        }
    
        [System.IO.Stream]$blobStream = $CsvItem.Fields["Blob"].GetBlobStream()
        try {
            $bytes = New-Object byte[] $blobStream.Length
            [void]$blobStream.Read($bytes, 0, $blobStream.Length)
        }
        finally {
            $blobStream.Close()
        }
    
        return ([System.Text.Encoding]::UTF8.GetString($bytes)) | ConvertFrom-Csv -Delimiter ","
    }
    
    function Validate-Csv-Row {
        param (
            [psobject]$Row,
            [int]$RowIndex
        )
        if ([string]::IsNullOrEmpty($Row.From)) {
            return "Row $RowIndex 'From' field is empty - cannot move item."
        }
        if ([string]::IsNullOrEmpty($Row.To)) {
            return "Row $RowIndex 'To' field is empty - cannot move item."
        }
        if ([string]::IsNullOrEmpty($Row.ID)) {
            return "Row $RowIndex 'ID' field is empty - cannot move item."
        }
        return $null
    }
    
    function Convert-Url-ToSitecorePath {
        param (
            [string]$Url
        )
    
        if ([string]::IsNullOrEmpty($Url)) {
            return $null
        }
    
        if ($Url -match "^master:") {
            return $Url
        }
    
        if ($Url -match "^/sitecore") {
            return "master:$Url"
        }
    
        $localUrl    = $Url -replace '-', ' '
        $urlSegments = $localUrl -split '/'
        if ($urlSegments.Length -ge 2) {
            $urlSegments = $urlSegments[0..($urlSegments.Length - 2)]
        }
        $joined      = $urlSegments -join '/'
        return $joined -replace 'https://www.easyjet.com/en/holidays/', 'master:/sitecore/content/EasyJet/Holidays/Home/Destinations/'
    }
    
    function Move-SitecoreItem {
        param (
            [Sitecore.Data.Items.Item]$SourceItem,
            [string]$DestinationPath
        )
        Move-Item -Path $SourceItem.Paths.FullPath -Destination $DestinationPath
    }
    
    function Create-RedirectItem {
        param (
            [string]$OriginalPath,
            [Sitecore.Data.Items.Item]$MovedItem,
            [string]$OriginalDisplayName
        )
    
        $redirectTemplateId = "{D6E273D0-4C78-4ABD-B412-5C98E7C9DB94}"
        $redirectItem = Get-Item -Path "master:$($OriginalPath)" -ErrorAction SilentlyContinue
        $wasCreated = $false
        if (-not $redirectItem) {
            $redirectItem = New-Item -Path "master:$($OriginalPath)" -ItemType $redirectTemplateId
            $wasCreated = $true
        }
        elseif ($redirectItem.TemplateID.ToString().ToUpperInvariant() -ne $redirectTemplateId) {
            Log-Warning "Existing item at '$OriginalPath' is not a redirect; skipping redirect creation."
            return $null
        }
    
        $redirectLink = '<link text="" anchor="" linktype="internal" class="" title="" target="" querystring="" id="{0}" />' -f $MovedItem.ID
    
        $redirectItem.Editing.BeginEdit()
        $redirectItem["__Display name"] = $OriginalDisplayName
        $redirectItem["RedirectUrl"] = $redirectLink
        $redirectItem["RedirectType"] = '301'
        $redirectItem["__Icon"]      = "Applications/32x32/navigate_cross.png"
        $redirectItem["__Sortorder"] = "150"
        $redirectItem.Editing.EndEdit() | Out-Null
    
        return $redirectItem
    }
    
    function Add-Language {
        param (
            [Sitecore.Data.Items.Item]$MovedItem,
            [Sitecore.Data.Items.Item]$RedirectItem,
            [string]$Lang
        )
    
        $movedLangItem = Get-Item -Path $MovedItem.Paths.FullPath -Language $Lang -ErrorAction SilentlyContinue
        if ($movedLangItem -eq $null) {
            Write-Host "Item $($MovedItem.Paths.FullPath) does not have lang version in $Lang"
            return
        }
    
        $redirectedLangItem = Get-Item -Path $RedirectItem.Paths.FullPath -Language $Lang -ErrorAction SilentlyContinue
        if ($redirectedLangItem -ne $null -and $redirectedLangItem.Versions.GetVersions().Count -ne 0) {
            return
        }
    
        Add-ItemLanguage -Item $RedirectItem -TargetLanguage $Lang -IfExist Skip | Out-Null
    
        $redirectedLangItem = Get-Item -Path $RedirectItem.Paths.FullPath -Language $Lang -ErrorAction SilentlyContinue
        if ($redirectedLangItem -ne $null) {
            $redirectedLangItem.Editing.BeginEdit()
            $redirectedLangItem["__Display name"] = $movedLangItem.DisplayName
            $redirectedLangItem.Editing.EndEdit() | Out-Null
    
            Write-Host "Added lang $Lang redirect to $($redirectedLangItem.Paths.FullPath)"
        }
    }
    
    function Update-ResortOnHotel {
        param (
            [Sitecore.Data.Items.Item]$HotelItem,
            [Sitecore.Data.Items.Item]$ResortItem
        )
    
        $languages = "en", "fr-CH", "de-CH", "de-DE", "fr-FR"
    
        foreach ($language in $languages) {
            $resortLangItem = Get-Item -Path "master:" -ID $ResortItem.ID -Language $language -ErrorAction SilentlyContinue
            if ($resortLangItem -eq $null -or $resortLangItem.Versions.Count -eq 0) {
                continue
            }
    
            $hotelLangItem = Get-Item -Path "master:" -ID $HotelItem.ID -Language $language -ErrorAction SilentlyContinue
            if ($hotelLangItem -eq $null -or $hotelLangItem.Versions.Count -eq 0) {
                continue
            }
    
            $resortName = $resortLangItem.Fields["Name"].Value
            if ([string]::IsNullOrEmpty($resortName)) {
                continue
            }
    
            $value = $hotelLangItem.Fields["Resort"].Value
            if ($value -ne $resortName) {
                $hotelLangItem.Editing.BeginEdit()
                $hotelLangItem["Resort"] = $resortName
                $hotelLangItem.Editing.EndEdit()
            }
        }
    }
    
    function Move-HotelWithRedirect {
        param (
            [Sitecore.Data.Items.Item]$SourceItem,
            [string]$DestinationPath,
            [bool]$UpdateResort,
            [Sitecore.Data.Items.Item]$ResortForUpdate,
            [string]$LogPrefix
        )
    
        $originalPath = $SourceItem.Paths.FullPath
        $originalDisplayName = $SourceItem.DisplayName
    
        Move-SitecoreItem -SourceItem $SourceItem -DestinationPath $DestinationPath
        Write-Host "$LogPrefix Moved '$originalPath' to '$DestinationPath'."
        $cleanDestinationPath = $DestinationPath
        if ($cleanDestinationPath -like "master:*") {
            $cleanDestinationPath = $cleanDestinationPath.Substring(7)
        }
        $movedItems.Add("$originalPath -> $cleanDestinationPath") | Out-Null
    
        $movedItemPath = "$($DestinationPath)/$($SourceItem.Name)"
        $movedItem = Get-Item -Path $movedItemPath
        if (-not $movedItem) {
            throw "$LogPrefix Failed to retrieve item after move. Path '$movedItemPath' not found."
        }
    
        $redirectItem = Create-RedirectItem -OriginalPath $originalPath -MovedItem $movedItem -OriginalDisplayName $originalDisplayName
        if ($redirectItem) {
            @('en', 'de-CH', 'de-DE', 'fr-CH', 'fr-FR') | % {
                Add-Language -MovedItem $movedItem -RedirectItem $redirectItem -Lang $_
            }
        }
    
        if ($redirectItem) {
            Write-Host "$LogPrefix Created redirect item '$originalPath'"
        }
    
        if ($UpdateResort -and $movedItem.TemplateName -eq "Hotel") {
            $resortItem = $ResortForUpdate
            if ($resortItem -eq $null) {
                $resortItem = $movedItem.Parent
            }
    
            if ($resortItem -ne $null) {
                Update-ResortOnHotel -HotelItem $movedItem -ResortItem $resortItem
                Write-Host "$LogPrefix Updated Resort field for hotel '$($movedItem.Paths.FullPath)'."
            }
        }
    }
    
    function Process-Csv-Row {
        param (
            [psobject]$Row,
            [int]$RowIndex,
            [bool]$UpdateResort
        )
    
        $errorMsg = Validate-Csv-Row -Row $Row -RowIndex $RowIndex
        if ($errorMsg) {
            throw $errorMsg
        }
    
        $sourceItem = Get-Item -Path master: -ID $Row.ID
        if (-not $sourceItem) {
            throw "Row $RowIndex No Sitecore item found with ID '$($Row.ID)'."
        }
    
        if ($sourceItem.TemplateName -ne "Hotel") {
            Log-Warning "Row $RowIndex Skipping item '$($sourceItem.Paths.FullPath)' because it is not a Hotel template."
            return
        }
    
        if ($SitecoreContextItem -and $sourceItem.Paths.FullPath -notlike "$($SitecoreContextItem.Paths.FullPath)*") {
            Log-Warning "Row $RowIndex Skipping item '$($sourceItem.Paths.FullPath)' because it is not under the context resort '$($SitecoreContextItem.Paths.FullPath)'."
            return
        }
    
        $destinationPath = Convert-Url-ToSitecorePath -Url $Row.To
        if ([string]::IsNullOrEmpty($destinationPath)) {
            throw "Row $RowIndex Invalid destination path from '$($Row.To)'."
        }
    
        Move-HotelWithRedirect -SourceItem $sourceItem -DestinationPath $destinationPath -UpdateResort $UpdateResort -ResortForUpdate $null -LogPrefix "Row $RowIndex"
    }
    
    function Process-Csv-Data {
        param (
            [Sitecore.Data.Items.Item]$CsvItem,
            [bool]$UpdateResort
        )
    
        $csvData = Get-CsvDataFromItem -CsvItem $CsvItem
        if (-not $csvData) {
            Log-Warning "No CSV data found."
            return
        }
    
        $counter = 0
        foreach ($row in $csvData) {
            Write-Host "Processing row $counter..."
            try {
                Process-Csv-Row -Row $row -RowIndex $counter -UpdateResort $UpdateResort
            }
            catch {
                $errorList.Add($_.Exception.Message) | Out-Null
                Log-Warning $_.Exception.Message
            }
            finally {
                $counter++
            }
        }
    }
    
    function Process-TreeSelection {
        param (
            [Sitecore.Data.Items.Item]$TargetResort,
            $SelectedHotels,
            [bool]$UpdateResort
        )
    
        if ($TargetResort -eq $null) {
            Show-Alert "Target resort not found."
            return
        }
    
        $destinationPath = "master:$($TargetResort.Paths.FullPath)"
    
        $selectedItems = @()
        foreach ($entry in $SelectedHotels) {
            $item = Resolve-SelectedItem -Value $entry
            if ($item) {
                $selectedItems += $item
            }
        }
    
        if ($selectedItems.Count -eq 0) {
            Show-Alert "No hotels selected."
            return
        }
    
        $index = 0
        foreach ($hotelItem in $selectedItems) {
            $index++
            if ($hotelItem.TemplateName -ne "Hotel") {
                Log-Warning "Skipping non-hotel item '$($hotelItem.Paths.FullPath)'."
                continue
            }
    
            if ($hotelItem.Parent -ne $null -and $hotelItem.Parent.ID -eq $TargetResort.ID) {
                Log-Warning "Skipping '$($hotelItem.Paths.FullPath)' because it is already under the target resort."
                continue
            }
    
            try {
                Move-HotelWithRedirect -SourceItem $hotelItem -DestinationPath $destinationPath -UpdateResort $UpdateResort -ResortForUpdate $TargetResort -LogPrefix "Tree $index"
            }
            catch {
                $errorList.Add($_.Exception.Message) | Out-Null
                Log-Warning $_.Exception.Message
            }
        }
    }
    
    $options = [ordered]@{
        "CSV (Media Library)"  = "CSV"
        "Manual selection" = "Tree"
    }
    
    $modeResult = Read-Variable -Title "Move Hotels to Neighbourhood Resorts" `
        -Description "Choose input mode." `
        -Parameters @(
            @{
                Name     = "InputMode"
                Title    = "Input mode"
                Options  = $options
                Value    = "CSV"
                Tooltip  = "Choose whether to use CSV or Tree selection."
            }
        ) -Width 420 -Height 220
    
    if ($modeResult -ne "ok") {
        return
    }
    
    $paramList = @()
    if ($InputMode -eq "CSV") {
        $paramList += @{
            Name    = "CsvMediaItem"
            Title   = "CSV file"
            Editor  = "droptree"
            Source  = "/sitecore/media library"
            Tooltip = "Select a single CSV item from the Media Library."
        }
    }
    else {
        $paramList += @{
            Name    = "TargetResort"
            Title   = "Target neighbourhood resort"
            Editor  = "droptree"
            Source  = "DataSource=$($SitecoreContextItem.Parent.Paths.FullPath)&IncludeTemplatesForSelection=Resort"
            Tooltip = "Pick the resort that hotels should be moved to."
        }
        $paramList += @{
            Name    = "SelectedHotels"
            Title   = "Hotels to move"
            Editor  = "treelist"
            Source  = "DataSource=$($SitecoreContextItem.Paths.FullPath)&IncludeTemplatesForSelection=Hotel"
            Tooltip = "Select one or more hotels."
        }
    }
    
    $paramList += @{
        Name         = "UpdateResort"
        Title        = "Update Resort field on hotels"
        Editor       = "checkbox"
        Value        = $true
        Tooltip      = "When checked, update Hotel.Resort field if empty for moved hotels."
    }
    
    $dialogProps = @{
        Title       = "Move Hotels to Neighbourhood Resorts"
        Description = "Provide the inputs for the selected mode."
        Parameters  = $paramList
        Width       = 650
        Height      = 500
        ShowHints   = $true
    }
    
    $result = Read-Variable @dialogProps
    if ($result -ne "ok") {
        return
    }
    
    if ($InputMode -eq "Tree") {
        $targetResortItem = Resolve-SelectedItem -Value $TargetResort
        if (-not $targetResortItem) {
            Show-Alert "Target resort not found."
            return
        }
    
        if ($targetResortItem.TemplateName -ne "Resort") {
            Show-Alert "Target resort must be a Resort template item."
            return
        }
    }
    
    $csvItem = $null
    if ($InputMode -eq "CSV") {
        $csvItem = Resolve-SelectedItem -Value $CsvMediaItem
        if (-not $csvItem) {
            Show-Alert "CSV item not found. Please select a valid CSV file."
            return
        }
    }
    
    $updateResort = ($UpdateResort -eq $true -or $UpdateResort -eq 1 -or $UpdateResort -eq "1")
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
        if ($InputMode -eq "CSV") {
            Process-Csv-Data -CsvItem $csvItem -UpdateResort $updateResort
        }
        else {
            Process-TreeSelection -TargetResort $targetResortItem -SelectedHotels $SelectedHotels -UpdateResort $updateResort
        }
    }
    
    $summaryLines = @()
    if ($movedItems.Count -ne 0) {
        Write-Host "Moved items:"
        $movedItems | % { Write-Host $_ }
    
        $summaryLines += "Moved items:"
        $summaryLines += $movedItems
        $summaryLines += ""
    }
    
    if ($errorList.Count -ne 0) {
        $summaryLines += "Failed items:"
        $summaryLines += $errorList
        $summaryLines += ""
    }
    
    if ($warningList.Count -ne 0) {
        $summaryLines += "Warnings:"
        $summaryLines += $warningList
        $summaryLines += ""
    }
    
    if ($summaryLines.Count -ne 0) {
        $summaryTitle = "Move summary"
        if ($errorList.Count -ne 0) {
            $summaryTitle = "Move completed with errors"
        }
    
        $summaryText = $summaryLines -join "`r`n"
        Read-Variable -Title $summaryTitle -Description "Move summary (moved items and failures)." -Parameters @(
            @{
                Name   = "Summary"
                Title  = "Summary"
                Editor = "multitext"
                Lines  = 20
                Value  = $summaryText
            }
        ) -OkButtonName "Close" -Width 800 -Height 500 | Out-Null
    }
    
    Close-Window
