Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Copy Persanalization Rules
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $renderingItemId = "{6C234F53-080F-4C8E-AC01-CE83E3C28998}" #Html block
    $placeholder = "header"
    $sourcePath = "/sitecore/content/EasyJet/Holidays/Home"
    $targetPath = "/sitecore/content/EasyJet/Holidays/Home/Hotel Details"
    
    function Get-ContentRenderingId {
    	param(
    		[item]$Item,
    		[string]$RenderingItemId,
    		[string]$Placeholder
    	)
    
    	$renderingItem = Get-Item -Path "master:" -Id $RenderingItemId
    	return (Get-Rendering -Item $Item -PlaceHolder $Placeholder -Rendering $renderingItem).UniqueId
    }
    
    function Copy-RenderingRules {
    	[CmdletBinding()]
    	param(
    		[Parameter(Mandatory = $true,Position = 0)]
    		[Sitecore.Data.Items.Item]$SourceItem,
    		[Parameter(Mandatory = $true,Position = 1)]
    		$SourceRenderingGUID,
    		[Parameter(Mandatory = $true,Position = 2)]
    		[Sitecore.Data.Items.Item]$TargetItem,
    		[Parameter(Mandatory = $true,Position = 3)]
    		$TargetRenderingGUID
    	)
    
    	<# Get the rules as an XML Element #>
    	$sourceItemSharedLayoutField = $SourceItem.Fields[[Sitecore.FieldIDs]::LayoutField]
        $sourceSharedLayoutXml = [Sitecore.Data.Fields.LayoutField]::GetFieldValue($sourceItemSharedLayoutField)
        
    	[xml]$sourceRenderingsXML = New-Object -TypeName XML
    	$sourceRenderingsXML.loadxml($sourceSharedLayoutXml)
    	$sourceXpathQ = "r/d/r[@uid='$($SourceRenderingGUID)']/rls"
    	$sourceRuleElement = $sourceRenderingsXML.SelectSingleNode($sourceXpathQ)
    	
    
    	<# Get the target rendering as an XML Element #>
    	$targetItemSharedLayoutField = $TargetItem.Fields[[Sitecore.FieldIDs]::LayoutField]
        $targetSharedLayoutXml = [Sitecore.Data.Fields.LayoutField]::GetFieldValue($targetItemSharedLayoutField)
    	
    	[xml]$targetRenderingsXML = New-Object -TypeName XML
    	$targetRenderingsXML.loadxml($targetSharedLayoutXml)
    	$targetXpathQ = "r/d/r[@uid='$($TargetRenderingGUID)']"
    	$TargetRendering = $targetRenderingsXML.SelectSingleNode($targetXpathQ)
    
    	<#Append the rules element to the target rendering element  #>
    	$TargetRendering.AppendChild($targetRenderingsXML.ImportNode($sourceRuleElement,$true)) > $null
    
    	<# Output the Renderings XML to the final renderings field on the target #>
    	$TargetItem.Editing.BeginEdit()
    	$TargetItem."__Renderings" = $targetRenderingsXML.OuterXML
    	$TargetItem.Editing.EndEdit() > $null
    
    }
    
    
    $sourceItem = Get-Item -Path "master:" -Query $sourcePath
    $sourceRenderingId = Get-ContentRenderingId -Item $sourceItem -RenderingItemId $renderingItemId -PlaceHolder $placeholder
    
    $targetItem = Get-Item -Path "master:" -Query $targetPath
    $targetRenderingId = Get-ContentRenderingId -Item $targetItem -RenderingItemId $renderingItemId -PlaceHolder $placeholder
    
    if($targetRenderingId){
      Copy-RenderingRules -SourceItem $sourceItem -SourceRenderingGUID $sourceRenderingId -TargetItem $targetItem -TargetRenderingGUID $targetRenderingId
      Write-Host "Presentation's rules have been copied from $($sourceItem.ItemPath) to $($targetItem.ItemPath)"
    }
    
