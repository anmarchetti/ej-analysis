    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Create-New-Highlights-From-Tips($datasource){
            $childIds = "";
            $isFirst = $true;
            $item =  Get-Item -Path "master:" -ID $datasource
            $highlights = Get-ChildItem -path $item.FullPath
            foreach($child in $highlights){
                if($isFirst){
                    $childIds = $child.ID
                    $isFirst = $false
                } else{
                    $childIds = "$($childIds)|$($child.ID)"
                }
                
                $imageLink = $child['Icon']
                
                $child.ChangeTemplate($highlightTemplate)
                $child.Editing.BeginEdit()
                $child["Image"] = $imageLink
                $child.Editing.EndEdit()
            }
            
            Move-Item -Path $item.ID -Destination $highlightFolder.ID
            Set-ItemTemplate -Item $item -TemplateItem $highlightTabTemplate
            $item.Editing.BeginEdit()
            $item["Title"] = "Top tips"
            $item["Highlights"] = $childIds
            $item["__SortOrder"]= "51"
            $item.Editing.EndEdit()
            
            @('fr-CH', 'fr-FR') | % {
                Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Meilleures astuces";
            }
                        
            @('de-CH', 'de-DE') | % {
                Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Beste Tipps";
            }
    }
    
    function Create-New-Highlights-From-Promo-Blocks($item, $titlesData, $order){
            $childIds = "";
            $isFirst = $true;
            $highlights = Get-ChildItem -path $item.FullPath
            foreach($child in $highlights){
                if($isFirst){
                    $childIds = $child.ID
                    $isFirst = $false
                } else{
                    $childIds = "$($childIds)|$($child.ID)"
                }
                
                $child.ChangeTemplate($highlightTemplate)
            }
            
            Move-Item -Path $item.ID -Destination $highlightFolder.ID
            Set-ItemTemplate -Item $item -TemplateItem $highlightTabTemplate
            $item.Editing.BeginEdit()
            $item["Title"] = $titlesData.en
            $item["Highlights"] = $childIds
            $item["__SortOrder"]= $order
            $item.Editing.EndEdit()
            
            @('fr-CH', 'fr-FR') | % {
                Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value $titlesData.fr;
            }
                        
            @('de-CH', 'de-DE') | % {
                Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value $titlesData.de;
            }
    }
    
    
    function Get-Or-Create-Item($path, $template){
            $item = gi -Path "master:$($path)" -ErrorAction SilentlyContinue
            
            if ($item -ne $null) {
               return $item
            }
               
            return New-Item -Path $path -ItemType $template
        }
    
    function Update-Datasources($item){
        Write-host "Updating item $($item.FullPath)"
        $renderings = Get-Rendering -Item $item -FinalLayout
        
        $promoBlocks = $renderings | Where-Object { $_.ItemId -eq $promoBlocksRendringId }
        $destinationInfo = $renderings | Where-Object { $_.ItemId -eq $destinationInfoBlockRenderingId }
        $insiderTipList = $renderings | Where-Object { $_.ItemId -eq $insiderTipsListRenderingId }
        
        $pageComponentsFolderPath = "$($item.FullPath)/Page Components"
        $pageComponentsFolder = Get-Item -path $pageComponentsFolderPath -ErrorAction SilentlyContinue
        
        if($pageComponentsFolder -eq $null){
            return
            Write-host "Item doesn't have Page Components folder. Stopping updating $($item.FullPath)"
        }
        
        $highlightPath = "$($item.FullPath)/Page Components"
        $highlightFolder = Get-ChildItem -path $highlightPath | Where-Object { $_.TemplateId -eq $highlightsFolderTemplateId }
        $highlightRendring = $renderings | Where-Object { $_.ItemId -eq $highlightsRenderingId }
        $highlightRendring.placeholder -match "/body/component-wrapper-inner-(?<highlights>.*)-0"
        $highlightComponentWrapperId = $matches['highlights']
        
        if($highlightFolder -eq $null){
            $folderPath = "$($highlightPath)/Highlights"
            $highlightFolder = Get-Or-Create-Item -path $folderPath -template $highlightsFolderTemplateId
            
            if($highlightRendring -ne $null){
                $highlightRendring.datasource = $highlightFolder.ID
                Set-Rendering -Item $item -Instance $highlightRendring
            }
        }
        
        if($destinationInfo -ne $null){
            $destinationInfoDatasource = Get-Item -Path "master:" -ID $destinationInfo.Datasource
            if(($destinationInfoDatasource.Title -ne $null -and $destinationInfoDatasource.Title -ne "") -or ($destinationInfoDatasource.Description -ne $null -and $destinationInfoDatasource.Description -ne "")){
                $textBlocksPath = "$($highlightPath)/Text Blocks"
                $itemToDelete = Get-ChildItem -path $highlightPath -Recurse | Where-Object { $_.TemplateId -eq $textBlockToDeleteTemplateId -And $_.Name -eq $textBlockToDeleteName}
                
                if($itemToDelete -ne $null){
                   $itemToDelete | Remove-Item
                }
            }
        }
        
        # Move insiderTipList
        if($insiderTipList -ne $null -and $insiderTipList.Datasource -ne ""){
            $textBlockToRemove = $renderings | Where-Object { $_.ItemId -eq $textBlockRendringId -and $_.placeholder -eq $insiderTipList.placeholder }
            $textBlockToRemoveDatasource = Get-Item -Path "master:" -ID $textBlockToRemove.Datasource
            $textBlockToRemove.placeholder -match "/body/component-wrapper-inner-(?<insiderTips>.*)-0"
            $componentWrapperToDeleteId = $matches['insiderTips']
            $componentWrapperToDelete = $renderings | Where-Object { $_.UniqueID -eq $componentWrapperToDeleteId}
            
            Create-New-Highlights-From-Tips -datasource $insiderTipList.Datasource
            if($textBlockToRemoveDatasource -ne $null){
                $textBlockToRemoveDatasource | Remove-Item
            }
            
            if($componentWrapperToDelete.UniqueID -ne $highlightComponentWrapperId){
                Remove-Rendering -Item $item -instance $componentWrapperToDelete
            }
            Remove-Rendering -Item $item -instance $textBlockToRemove
            Remove-Rendering -Item $item -instance $insiderTipList
        }
        
        # Move promoBlocs datasource
        if($promoBlocks -ne $null -and $promoBlocks.Datasource -ne ""){
            if($promoBlocks.Count -eq "1"){
                $promoBlockItem = Get-Item -Path "master:" -ID $promoBlocks.Datasource
                
                $textBlockToRemove = $renderings | Where-Object { $_.ItemId -eq $textBlockRendringId -and $_.placeholder -eq $promoBlocks.placeholder }
                $textBlockToRemoveDatasource = Get-Item -Path "master:" -ID $textBlockToRemove.Datasource
                $textBlockToRemove.placeholder -match "/body/component-wrapper-inner-(?<promoBlock>.*)-0"
                $componentWrapperToDeleteId = $matches['promoBlock']
                $componentWrapperToDelete = $renderings | Where-Object { $_.UniqueID -eq $componentWrapperToDeleteId}
                
                if($promoBlockItem.Name -eq "Best things to do list"){
                    Create-New-Highlights-From-Promo-Blocks -item $promoBlockItem -titlesData $bestThingToDoTranslationData -order "50"
                } else {
                    Create-New-Highlights-From-Promo-Blocks -item $promoBlockItem -titlesData $keyDatesData -order "52"
                }
                
                if($textBlockToRemoveDatasource -ne $null){
                    $textBlockToRemoveDatasource | Remove-Item
                }
                
                if($componentWrapperToDelete.UniqueID -ne $highlightComponentWrapperId){
                    Remove-Rendering -Item $item -instance $componentWrapperToDelete
                }
                
                Remove-Rendering -Item $item -instance $textBlockToRemove
                Remove-Rendering -Item $item -instance $promoBlocks
            }
            
            if($promoBlocks.Count -gt "1"){
                foreach($promoBlock in $promoBlocks){
                    $promoBlockItem = Get-Item -Path "master:" -ID $promoBlock.Datasource
                    $textBlockToRemove = $renderings | Where-Object { $_.ItemId -eq $textBlockRendringId -and $_.placeholder -eq $promoBlock.placeholder }
                    $textBlockToRemoveDatasource = Get-Item -Path "master:" -ID $textBlockToRemove.Datasource
                    $textBlockToRemove.placeholder -match "/body/component-wrapper-inner-(?<promoBlock>.*)-0"
                    $componentWrapperToDeleteId = $matches['promoBlock']
                    $componentWrapperToDelete = $renderings | Where-Object { $_.UniqueID -eq $componentWrapperToDeleteId}
                
                    if($promoBlockItem.Name -eq "Best things to do list"){
                        Create-New-Highlights-From-Promo-Blocks -item $promoBlockItem -titlesData $bestThingToDoTranslationData -order "50"
                    } else {
                        Create-New-Highlights-From-Promo-Blocks -item $promoBlockItem -titlesData $keyDatesData -order "52"
                    }
                    
                    if($textBlockToRemoveDatasource -ne $null){
                        $textBlockToRemoveDatasource | Remove-Item
                    }
                    
                    if($componentWrapperToDelete.UniqueID -ne $highlightComponentWrapperId){
                        Remove-Rendering -Item $item -instance $componentWrapperToDelete
                    }
                    Remove-Rendering -Item $item -instance $textBlockToRemove
                    Remove-Rendering -Item $item -instance $promoBlock
                }
            }
        }
        
        Write-host "Finished Updating item $($item.FullPath) successfully"
    }
    
    $destinationInfoBlockRenderingId = '{C425F05C-0B8B-4EEC-B528-360E18F4EB17}'
    $promoBlocksRendringId = '{FF441699-4D65-45C1-B565-E87714B5A278}'
    $insiderTipsListRenderingId = '{5C8585BB-1BED-46C8-AD5B-93088A0B2E54}'
    $textBlockRendringId = '{43546A28-D231-4287-96D2-25DEF529F1A5}'
    
    $destinationInfoBlocksTemplateId = '{82C5913D-9B19-4455-B0D3-1D8317FF85EE}'
    $promoBlocksTemplatedId = '{EB30259D-FF9A-46CB-8E0C-4616B148F3A8}'
    $insiderTipsListTemplatedId = '{A5727395-0B58-464F-B6CC-83E450109E4E}'
    
    $textBlockToDeleteTemplateId = '{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}'
    $textBlockToDeleteName = 'Intro heading and description'
    
    $highlightsRenderingId = '{2D6A5BC4-CE48-4619-AC42-02D1C94D8B44}'
    $highlightsFolderTemplateId = '{E6EBE2B8-4CB6-47D3-86FE-7CD2E0EF6B6C}'
    $highlightTabTemplatePath = '/sitecore/templates/Feature/Destinations/Destination Highlights Tab'
    $highlightTemplatePath = '/sitecore/templates/Feature/Destinations/Destination Highlight'
    
    $highlightTabTemplate = Get-Item -Path "master:$($highlightTabTemplatePath)"
    $highlightTemplate = Get-Item -Path "master:$($highlightTemplatePath)"
    
    $bestThingToDoTranslationData =@{
        en="Best things to do";
        fr="Les meilleures choses à faire";
        de="Die besten Dinge, die man tun kann";
    };
                                    
    $keyDatesData =@{
        en="Key dates";
        fr="Dates clés";
        de="Schlüsseldaten";
    };
    
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" -or $_.TemplateName -eq "VirtualCountry" }
    
    #Loop through all items
    foreach ($countryItem in $countryItems) {
        Update-Datasources -item $countryItem
    
        $regions = Get-ChildItem -Path $countryItem.ProviderPath | Where-Object { $_.TemplateName -eq "Region" -or $_.TemplateName -eq "VirtualRegion" }
        foreach ($region in $regions) {
            Update-Datasources -item $region
            
            $resorts = Get-ChildItem -Path $region.ProviderPath | Where-Object { $_.TemplateName -eq "Resort"}
            foreach ($resort in $resorts) {
                Update-Datasources -item $resort
            }
        }
    }
    
