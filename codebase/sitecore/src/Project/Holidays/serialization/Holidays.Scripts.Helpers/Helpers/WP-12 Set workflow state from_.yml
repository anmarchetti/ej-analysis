Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/WP-12 Set workflow state from published to approved"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Define the start item
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    
    $oldState = "{b4ea6b39-09db-441c-b100-39782b3fbf07}"
    $newState = "{A47E8B4F-A0EE-40F2-B1A1-B3CE91C0F79A}"
    
    $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" -or $_.TemplateName -eq "VirtualCountry" }
    
    function ChangeWorkflowState {
      param($item, $oldState, $newState)
            $currentState = $item["__Workflow state"]
    
            if ($currentState.ToLower() -eq $oldState.ToLower()) {
               $item.Editing.BeginEdit()
               $item["__Workflow state"] = $newState
               $item.Editing.EndEdit()
            }
    }
    
    # Loop through all items
    foreach ($countryItem in $countryItems) {
        ChangeWorkflowState -item $countryItem -oldState $oldState -newState $newState
    
        $regions = Get-ChildItem -Path $countryItem.ProviderPath | Where-Object { $_.TemplateName -eq "Region" -or $_.TemplateName -eq "VirtualRegion" }
        foreach ($region in $regions) {
            ChangeWorkflowState -item $region -oldState $oldState -newState $newState
            
            $resorts = Get-ChildItem -Path $region.ProviderPath | Where-Object { $_.TemplateName -eq "Resort"}
            foreach ($resort in $resorts) {
                ChangeWorkflowState -item $resort -oldState $oldState -newState $newState
                
                $hotels = Get-ChildItem -Path $resort.ProviderPath | Where-Object { $_.TemplateName -eq "Hotel"}
                foreach ($hotel in $hotels) {
                    ChangeWorkflowState -item $hotel -oldState $oldState -newState $newState
                }
            }
        }
    }
