Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/MAN-526_Fix-hotel-mobile-basket-rendering"
DB: master
SharedFields:
    - ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
      Hint: Script
      Value: |
          function FindBrokeHotels {
            param($item)
                $renderings = Get-Rendering -item $item
          
                $rendering = $renderings | Where-Object { $_.ItemId -eq '{6FA1CB94-968D-42C0-AB28-1564B765AC97}' }
          
                if($rendering -eq $null) {
                    Write-Host $item.Name
          
                    $renderingItem = Get-Item -Path "master:" -Id '{6FA1CB94-968D-42C0-AB28-1564B765AC97}' | New-Rendering
                    Add-Rendering -Item $item -DataSource '/sitecore/content/EasyJet/Holidays/Data/Mobile Basket' -Instance $renderingItem -PlaceHolder 'body'
                }
          }
          
          
          function Update-children($items) {
            foreach ($item in $items) {
                if ($item.TemplateId -eq "{28E5E169-8F72-4F90-A277-280A8302B607}") {
                    FindBrokeHotels($item)
                } elseif ($item.Children -and $item.Children.Count -gt 0) {
                    Update-Children($item.Children)
                }
            }
          }
          
          $root = Get-Item "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
          $hotels = $root.Children
          
          Write-Host "Date and time is: $((Get-Date).ToString())"
          
          Update-children -Items $hotels
          
          Write-Host "Date and time is: $((Get-Date).ToString())"

