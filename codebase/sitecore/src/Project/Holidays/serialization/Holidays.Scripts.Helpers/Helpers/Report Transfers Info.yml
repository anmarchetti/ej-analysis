Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Report Transfers Info
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $criteria = @(
        @{Filter = "StartsWith"; Field = "_fullpath"; Value = "/sitecore/content/EasyJet/Holidays/Data/Transfers Info" },
        @{Filter = "Equal"; Field = "_template"; Value = "{434E365E-D63B-4A66-9E88-88C07EC2B97D}" }
    )
    $props = @{
        Index = "sitecore_transferinfo_master_index"
        Criteria = $criteria
    }
    
    function Get-Transfers-Info(){
        $transfersInfo = New-Object Collections.Generic.List[object] 
        $items = Find-Item @props | Select-Object -Expand "Fields" 
        foreach($transferInfo in $items){
            $transfersInfo.Add([ordered]@{
                    name = $transferInfo.name
                    airportid = $transferInfo.airportid
                    resortid = $transferInfo.resortid
                    resortname = $transferInfo.resortname
                    duration = $transferInfo.duration
                    arrivalinstr = $transferInfo.arrivalinstr
                    depinstr = $transferInfo.depinstr
                    transfertype = $transferInfo.type
                    productid = $transferInfo.productid
                })
        }
        return $transfersInfo
    }
    
    function Download($data)
    {
        Import-Function -Name ConvertTo-Xlsx
    
        [byte[]]$outobject = $data | ForEach-Object { New-Object PSObject -Property $_ } | ConvertTo-Xlsx
        $date = Get-Date -Format "MMddyyyyHHmmss"
        Out-Download -Name "report-$($date).xlsx" -InputObject $outobject 
    }
    
    $transfersInfo = Get-Transfers-Info
    Download -Data $transfersInfo
