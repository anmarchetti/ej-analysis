SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $customerFeedbackRenderingId = "{5295B583-8B18-4FCD-A1B0-10F7F965FD4A}"
    $customersFeedbackDatasourcePath = "/sitecore/content/EasyJet/Holidays/Data/Customers Feedback"
    
    # Pages in the templates folder where need to set dataSource
    $pages = [System.Collections.Generic.List[string]]@()
    $pages.Add("Destinations/Country") > $null
    $pages.Add("Destinations/Region") > $null
    $pages.Add("Destinations/Resort") > $null
    $pages.Add("Promo Page") > $null
    
    function Update-Rendering-DataSource($item, $renderingId, $dataSource) {
        $rendering = Get-Rendering -Item $item | Where-Object {$_.ItemId -eq $renderingId} | Select -First 1
        
        if($rendering -ne $null){
            Set-Rendering -Item $item -Instance $rendering -DataSource $dataSource
        }
    }
    
    function Set-Datasource-To-Template($path, $renderingId, $dataSource) {
        $pagePath = "/sitecore/templates/Project/Holidays/Pages/" + $path + "/__Standard Values"
        $pageStandardValues = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    
        if($pageStandardValues -ne $null) {
            Update-Rendering-DataSource -Item $pageStandardValues -RenderingId $renderingId -DataSource $dataSource
            Write-Host $path"/__StandardValues updated"
        }
    }
    
    foreach($pagePath in $pages) {
        Set-Datasource-To-Template -path $pagePath -renderingId $customerFeedbackRenderingId -dataSource $customersFeedbackDatasourcePath
    }
    
