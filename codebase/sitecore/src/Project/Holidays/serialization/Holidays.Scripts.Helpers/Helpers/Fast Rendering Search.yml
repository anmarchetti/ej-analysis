---
ID: "89a34c6a-4ada-4c97-a9d2-4840aaec9d96"
Parent: "a526d511-21c8-4534-a668-c72875bbbf40"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Fast Rendering Search
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $rootPath     = ""
    $excludePath  = ""
    $renderingId  = ""
    
    $paramName  = ""
    $paramValues = @("")
    
    $ridU = $renderingId.ToUpperInvariant()
    
     $i = 0
     $progressEvery = 200
     $heartbeatSeconds = 30
     $startedAt = [System.Diagnostics.Stopwatch]::StartNew()
     $lastProgressAt = [TimeSpan]::Zero
    
     Get-ChildItem -Path $rootPath -Recurse |
         Where-Object {
             -not (
                $_.ItemPath.StartsWith($excludePath, [System.StringComparison]::OrdinalIgnoreCase)
             )
         } |
         ForEach-Object {
        $i++
        $elapsed = $startedAt.Elapsed
        $shouldReport = ($i % $progressEvery -eq 0) -or ($i -eq 1) -or
            (($elapsed - $lastProgressAt).TotalSeconds -ge $heartbeatSeconds)
        if ($shouldReport) {
            $lastProgressAt = $elapsed
            Write-Progress `
                -Activity "Scanning items" `
                -Status "$i processed ($($elapsed.ToString('hh\:mm\:ss'))) $($_.ItemPath)"
        }
    
        $item = $_
        if (-not $item -or -not $item.TemplateID) { return }
        $tid  = $item.TemplateID.ToString()
    
        # Quick item-level candidate check (cheap string scan)
        $itemShared = $item["__Renderings"]
        $itemFinal  = $item["__Final Renderings"]
    
        $isCandidate =
            (($itemShared -and $itemShared.ToUpperInvariant().Contains($ridU)) -or
             ($itemFinal  -and $itemFinal.ToUpperInvariant().Contains($ridU)))
    
        if (-not $isCandidate) { return }
            
        try {
            $hasRendering = Get-Rendering -Item $item |
            Where-Object {
                if ($_.ItemId -ne $renderingId -or -not $_.Parameters) { return $false }
    
                $p = [System.Web.HttpUtility]::ParseQueryString($_.Parameters)
    
                $p[$paramName] -in $paramValues
            }
        } catch {
            Write-Warning "Get-Rendering failed for $($item.ItemPath): $($_.Exception.Message)"
            return
        }
        if ($hasRendering) {
            [pscustomobject]@{
                Name     = $item.Name
                ItemPath = $item.ItemPath
                ID       = $item.ID
                Template = $item.TemplateName
            }
        }
    }
    
    $totalElapsed = $startedAt.Elapsed.ToString("hh\:mm\:ss")
    $doneMessage = "Done. Processed $i items in $totalElapsed."
    Write-Progress -Activity "Scanning items" -Completed
    Write-Information $doneMessage -InformationAction Continue
    Write-Host $doneMessage
    
    
