Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/EJH-16523 Update Dictionary"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Edit Singular Item Reference
    
    $singularKey = "Payment.Labels.LUG.23Singular"
    $singularPhrase = "hold bag up to 23kg"
    $singularItem = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$singularKey']"
    
    if ($singularItem -ne $null) {
            $singularItem.Editing.BeginEdit()
            $singularItem["Phrase"] = $singularPhrase
            $singularItem.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $singularItem.Name "successfully updated"
    }
    
    # Edit Plural Item Reference
    
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Payment/Labels/23 Hold Luggage Plural"
    $key = "Payment.Labels.LUG.23Plural"
    $phrase = "hold bags up to 23kg"
    
    $pluralItem = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($pluralItem -ne $null) {
            $pluralItem.Editing.BeginEdit()
            $pluralItem["Key"] = $key
            $pluralItem["Phrase"] = $phrase
            $pluralItem.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $pluralItem.Name "successfully updated"
    }
