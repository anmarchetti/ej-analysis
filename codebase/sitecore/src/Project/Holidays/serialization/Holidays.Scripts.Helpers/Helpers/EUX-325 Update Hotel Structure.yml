- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Script that move hotel atcom code to room level
    
    function Update-Room($roomFolder, $prefix, $code){
        if($roomFolder -ne $null){
            $roomFolder.Editing.BeginEdit()
            $roomFolder.Name = "Rooms - $($prefix)"
            $roomFolder.Fields["Code"].Value = $code
            $roomFolder.Editing.EndEdit()
        }
    }
    
    function Update-SourceCodes($root){
        $hotels = $root.Children
        
        foreach ($item in $hotels) {
    	    if($item.TemplateId -ne "{28E5E169-8F72-4F90-A277-280A8302B607}"){
    	        continue;
    	    }
    	    $item.Paths.FullPath
            $prefix = $null
            if($item["Code"] -like 'X9*'){
                $prefix = "HBG"
            }else{
                $prefix = "DC"
            }
            $rooms = Get-ChildItem -Item $item | Where-Object {$_.TemplateId -eq "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"}
            if($rooms.Count -eq 1){
                Update-Room $rooms $prefix $item["Code"]
            }
            if($rooms.Count -eq 0){
                $folder = New-Item -Parent $item -Name "Rooms" -ItemType "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"
                Update-Room $folder $prefix $item["Code"]
            }
    	}
    
    }
    
    function UpdateSourceCodes-Recursive($root){
        
        foreach($child in $root.Children){
            if($child.TemplateId -eq "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}")
            {
                 Update-SourceCodes $child
            }else{
                UpdateSourceCodes-Recursive $child
            }  
        }
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    $root =  Get-Item master:/sitecore/content/EasyJet/Holidays/Home/Destinations
    
    UpdateSourceCodes-Recursive $root
    
    $stopWatch.Stop()
    Write-Output "Info: Elapsed time - $($StopWatch.Elapsed)" 
