Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/EJH-15691 - EcoFacility"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Has-Rendering ($item,$renderingItemId) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemID -eq $renderingItemId) {
    		    $i++
    		}
    	}
    	return $i -eq 0 
    }
    
    $criteria = @(
    	@{ Filter = "Equals"; Field = "_templatename"; Value = "Hotel"; }
    	@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    )
    
    $props = @{
    	Index = "sitecore_destinations_master_index"
    	Criteria = $criteria
    }
    
    $items = Find-Item @props | ForEach-Object { Get-Item -Path master: -Id $_.ItemID }
    Write-Host "$($items.Count) hotels were found"
    
    foreach ($item in $items)
    {
    	$ecoFacilityRenderingId = "{8B4B958A-7F3C-4404-9003-DE7F4CC3AABF}"
    	$ecoFacilityRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Eco Certified"
        $placeholder = "/body/component-wrapper-inner-{899fc320-c167-4b90-8418-8d99e78a1b99}-0/main-{53250e02-2f1e-4343-823c-9ed80a6cfe52}-0/eco-certified-{9957765d-ee5d-4157-b475-9661d3155d64}-0"
        if(Has-Rendering -item $item -renderingItemId $ecoFacilityRenderingId){
            $renderingItem = Get-Item -Database "master" -Path $ecoFacilityRenderingPath | New-Rendering -Placeholder $placeholder
            Add-Rendering -Item $item -PlaceHolder $placeholder -Instance $renderingItem
            Write-Host $item.Paths.FullPath
        }
        
    } 
