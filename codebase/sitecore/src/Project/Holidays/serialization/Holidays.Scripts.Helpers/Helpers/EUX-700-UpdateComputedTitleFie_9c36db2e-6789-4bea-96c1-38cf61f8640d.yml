    $langs = @(
        "de-CH",
        "de-DE"
    )
    
    foreach ($lang in $langs){
        foreach ($dictionary in $dictionaries) {
            
            $path ="master:/sitecore/content/EasyJet/Holidays/Home/$($dictionary.key)"
        	$item = Get-Item -Path $path  -Language $lang -ErrorAction SilentlyContinue
        
        	if ($item -ne $null) {
        	    
                if($item["ComposedTitle"] -ne $null ){
                    if(!$item["ComposedTitle"]){
                        $item.Editing.BeginEdit()
                		$item["ComposedTitle"] = $dictionary.phrase
                		$item.Editing.EndEdit() | Out-Null
                 		Write-Host "Item successfully updated:" $path "; "
                    }else{
                        Write-Host "Field Already Populated:" $path "; " $dictionary.Key "; " $dictionary.phrase
                    }
                }else{
                   	Write-Host "Field Not Found:" $path "; " $dictionary.Key "; "
                }
                
            }else{
            	    Write-Host "Item not found:" $path "; " $dictionary.Key "; "
            }
        }
    }
    
