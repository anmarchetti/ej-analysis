Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Clean Up Reports Data
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function CleanUp-Reports ($reportsFolder,$lifetime) {
    	if ($reportsFolder -ne $null) {
    		foreach ($reportItem in $reportsFolder.Children) {
    		    if($reportItem.TemplateId -eq $mediaFolderTemplateId){
    		        CleanUp-Reports -reportsFolder $reportItem -lifetime $lifetime
    		    }
    		    
    			$created = ([Sitecore.Data.Fields.DateField]$reportItem.Fields["__created"]).DateTime
    			$diffInMonths = [datetime]::Now.Subtract($created).Days / 30
    			if ($diffInMonths -gt $lifetime) {
    				$reportItem | Remove-Item
    				Write-Host "Report - $($reportItem.Name) successfully deleted"
    			}
    		}
    	}
    }
    
    
    $mediaFolderTemplateId = [Sitecore.Data.ID]::Parse("{FE5DD826-48C6-436D-B87A-7C4210C7413B}") 
    $hotelReportsFolder = Get-Item -Path "/sitecore/media library/Files/easyJet Hotel Report Export" -ErrorAction SilentlyContinue
    $bulkToolReportsFolder = Get-Item -Path "/sitecore/media library/Files/Bulk Tool Reports" -ErrorAction SilentlyContinue
    
    CleanUp-Reports -reportsFolder $hotelReportsFolder -lifetime 12 # Lifetime of reports in months
    CleanUp-Reports -reportsFolder $bulkToolReportsFolder -lifetime 3 # Lifetime of reports in months
