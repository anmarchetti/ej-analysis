- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $filePath = "/sitecore/media library/Files/Broken Image Job - Restore List"
    $sourceDb = "master"
    
    function Get-File-Data () {
        try {
            $file = Get-Item -Path $filePath -ErrorAction SilentlyContinue
            $rows = @()
            [System.IO.Stream]$body = $file.Fields["Blob"].GetBlobStream()
            $contents = New-Object byte[] $body.Length
            $body.Read($contents, 0, $body.Length) | Out-Null
            $body.Close()
            $csv = [System.Text.Encoding]::Default.GetString($contents)
            $csv = $csv.Split([System.Environment]::NewLine) | Where-Object { $_ -ne "" }
            foreach ($row in $csv | Select-Object -Skip 1) {
                $columns = Get-Columns -RowData $row -Take 2
                $rowValue = @{ 
                    Code  = $columns[0]
                    Name = $columns[1]
                }
    
                $rows += $rowValue
                
            }
    
            return $rows
        }
        catch {
            Write-Host "Error occurred opening document with path: $($filePath)"
            return $null
        }
    }
    
     
    
    function Get-Columns ($rowData, $take) {
        $columns = $rowData.Split(',')
        return $columns | Select-Object -First $take
    }
    
     
    
    function Find-Destinations-By-Code($code) {
        $criteria = @(
            @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
            @{ Filter = "Equals"; Field = "_language"; Value = "en"; }
            @{ Filter = "Equals"; Field = "_template"; Value = "28e5e1698f724f90a277280a8302b607" }
            @{ Filter = "Equals"; Field = "code_s"; Value = $code }
        )
    
        $props = @{
            Index    = "sitecore_destinations_$($sourceDb)_index"
            Criteria = $criteria
        }
    
        $item = Find-Item @props | Select-Object -First 1
        
        return $item
    }
    
    function Get-Index{
        param($items, $code)
        $i = 0;
        foreach($item in $items){
            if($item["Code"] -eq $code){
                return $i + 1; 
            }
            $i++
        }
        return -1;
        
    } 
     
     
    
    function Get-Package($packageName, $packageData){
        $dublicates = @()
        $Package = New-Package -Name $packageName;
        $Package.Sources.Clear();
        $Package.Metadata.Author = "Alex";
        $Package.Metadata.Version = Get-Date -Format FileDateTimeUniversal;
        ForEach ($item in $packageData)
        {
            #Skip dublicates hotel
             $items = $item.Parent.Children | Where-Object { $_.Name -eq $item.Name }
             if($items.Count -gt 1)
             {
                Write-Host "Has dublicate hotels: " $item["Name"]
                $dublicates += [ordered]@{
                    Code = $item["Code"]
                    HotelName = $item["Name"]
                    ItemPath = $item.Paths.FullPath
                    Index = Get-Index -items $items -code $item["Code"]
                }
                continue;
            }
            $imagesFolderItem = $item.Children | Where-Object { $_.TemplateId -eq "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}" } | Select-Object -First 1
            if($imagesFolderItem -ne $null){
                $Source = $imagesFolderItem | New-ItemSource -Name "N/A" -InstallMode Overwrite
                $Package.Sources.Add($Source); 
    
            }
        }
     
        Export-Package -Project $package -Path "$($package.Name).zip" -Zip
        Download-File "$SitecorePackageFolder\$($package.Name).zip"
        
         if($dublicates.Count -gt 1){
            Import-Function -Name ConvertTo-Xlsx
            [byte[]]$outobject = $dublicates | ForEach-Object { New-Object PSObject -Property $_ } | ConvertTo-Xlsx
    
            Out-Download -Name "Dublicates hotel $($packageName).xlsx" -InputObject $outobject 
         }
    }
    
     
    
    $data = Get-File-Data
    $countries = [ordered]@{}
    foreach($row in $data){
        $item =  Find-Destinations-By-Code -Code $row.Code
        if($item -ne $null){
            $item = $item.GetItem()
            if(($countries.Keys | Where-Object { $_ -eq $item.Parent.Parent.Parent.Name } | Select-Object -First 1) -eq $null) {
                $countries[$item.Parent.Parent.Parent.Name] = @()
            }
            $countries[$item.Parent.Parent.Parent.Name] += $item
        }
    }
    
    
    foreach ($country in $countries.GetEnumerator()) {
        Get-Package -PackageName "$($country.key) Hotels Images" -PackageData $country.Value
    }
