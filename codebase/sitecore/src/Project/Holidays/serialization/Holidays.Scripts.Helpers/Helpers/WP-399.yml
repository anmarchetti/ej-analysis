DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $oldImagePrefix = "https://easyjet-holidays-images-prod.s3-eu-west-1.amazonaws.com";
    
    #$newImagePrefix = "https://ejh-web-dev-images.s3-eu-west-1.amazonaws.com";
    #$newImagePrefix = "https://ejh-web-test-images.s3-eu-west-1.amazonaws.com";
    $newImagePrefix = "https://ejh-web-prod-images.s3-eu-west-1.amazonaws.com";
    
    
    $sourceDb = "master"
    $rootItemPath = "$($sourceDb):/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $imagesFolderTemplateId = "{AF7DAAA8-8099-4F22-A607-F0E1FBA6AD0D}"
    $externalImageTemplateId = "{E4B3BB73-22AB-4843-A816-3AA32EDDC7DC}"
    $roomsFolderTemplateId = "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"
    $hotelTemplateId = "{28E5E169-8F72-4F90-A277-280A8302B607}"
    $accommodationRoomTemplateId = "{BA1EC5C3-14C7-40B3-8B69-D020590DA1F3}"
    
    function Has-BaseTemplate ($item,$baseTemplateId)
    {
    	if ($item -eq $null)
    	{
    		return false;
    	}
    	$template = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($item);
    	return $template -ne $null -and $template.InheritsFrom($baseTemplateId);
    }
    
    function Get-Hotels-Recursive ($root,$list) {
    	foreach ($child in $root.Children) {
    		if (Has-BaseTemplate -Item $child -baseTemplateId "{168F65DC-9ECD-4A6E-AD93-A46464E45F79}") {
    			if ($child.TemplateId -eq "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}")
    			{
    				foreach ($item in $child.Children) {
    					if ($item.TemplateId -ne $hotelTemplateId) {
    						continue;
    					}
    					$list.Add($item) > $null
    				}
    			}
    			else {
    				Get-Hotels-Recursive $child $list
    			}
    		}
    	}
    }
    
    function Get-RoomsImages-Folder($rooms, $list) {
        foreach($room in $rooms) {
            $roomsImagesFolder = $room.Children | Where { $_.TemplateId -eq $imagesFolderTemplateId }
            foreach($folder in $roomsImagesFolder) {
                $list.Add($folder) > $null
            }
        }
    }
    
    function Get-Rooms($roomsFolder, $list) {
         foreach($folder in $roomsFolder) {
            $rooms = $folder.Children | Where { $_.TemplateId -eq $accommodationRoomTemplateId }
            foreach($room in $rooms) {
                $list.Add($room) > $null
            }
        }   
    }
    
    function Get-ImagesFolder($hotels, $list) {
         foreach($hotel in $hotels) {
            $rooms = [System.Collections.ArrayList]@()
            $roomsImagesFolder = [System.Collections.ArrayList]@()
            
            $hotelImagesFolders = $hotel.Children | Where { $_.TemplateId -eq $imagesFolderTemplateId }
            foreach($hotelImagesFolder in $hotelImagesFolders) {
                $list.Add($hotelImagesFolder) > $null
            }
            $roomsFolder = $hotel.Children | Where { $_.TemplateId -eq $roomsFolderTemplateId }
            Get-Rooms $roomsFolder $rooms
            Get-RoomsImages-Folder $rooms $roomsImagesFolder
            foreach($roomImagesFolder in $roomsImagesFolder) {
                $list.Add($roomImagesFolder) > $null
            }
        }   
    }
    
    function Get-ExternalImages($imagesFolders, $list) {
         foreach($folder in $imagesFolders) {
            $images = $folder.Children | Where { ($_.TemplateId -eq $externalImageTemplateId) -and ($_.Fields["Small"].Value.StartsWith($oldImagePrefix)) }
            foreach($image in $images) {
                $list.Add($image) > $null
            }
        }   
    }
    
    
    function Run-Image-Update {
    	$hotels = [System.Collections.ArrayList]@()
    	$roomsImagesFolder = [System.Collections.ArrayList]@()
    	$images = [System.Collections.ArrayList]@()
    	
    	$root = Get-Item $rootItemPath
    	Get-Hotels-Recursive $root $hotels
    	Write-Host "Found" $hotels.Count "hotels"
    	
        Get-ImagesFolder $hotels $roomsImagesFolder
        Write-Host "Found" $roomsImagesFolder.Count "rooms images folder"
        
        Get-ExternalImages $roomsImagesFolder $images
        Write-Host "Found" $images.Count "external s3 images with prefix $oldImagePrefix"
        Write-Host "Starting updating images"
        
        $totalTimes = $images.Count
        $i = 0
        New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
        	New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
            	New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
            	    foreach($image in $images) {
            	        $i++
                            $image.Editing.BeginEdit()
                            $image.Fields["Small"].Value = $image.Fields["Small"].Value.Replace($oldImagePrefix, $newImagePrefix)  
                            $image.Fields["Medium"].Value = $image.Fields["Medium"].Value.Replace($oldImagePrefix, $newImagePrefix)   
                            $image.Fields["Large"].Value = $image.Fields["Large"].Value.Replace($oldImagePrefix, $newImagePrefix)   
                            $image.Editing.EndEdit() | Out-Null
                        $percentComplete = ($i / $totalTimes) * 100
                        Write-Progress -Activity 'Processing' -Status "Updated $i/$totalTimes images" -PercentComplete $percentComplete
                    }
            	}
        	}
    	}
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    Run-Image-Update
    
    $stopWatch.Stop()
    Write-Host "completed. Elapsed time - $($StopWatch.Elapsed)" -ForegroundColor Green 
