- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Has-BaseTemplate($item, $baseTemplateId)
    {
        if ($item -eq $null)
        {
            return false;
        }
        $template = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($item);
        return $template -ne $null -and $template.InheritsFrom($baseTemplateId);
    }
    
    function Protect-Item($item)
    {
        $item.Editing.BeginEdit()
        $item.Appearance.ReadOnly = $true
        $item.Editing.EndEdit()
    }
    
    function Set-OriginalItem($originalItem, $cloneItem){
        $cloneItem.Editing.BeginEdit()
        $cloneItem["__OriginalItem"] = $originalItem.ID
        $cloneItem.Editing.EndEdit()
    }
    
    function Clone-Recursive($source, $dest){
        New-ItemClone -Item $source -Destination $dest 
        $destPath = $source.Paths.FullPath -replace "Holidays", "TradePortal"
        $destItem = Get-Item -Path $destPath
        Protect-Item -item $destItem
        Set-OriginalItem -originalItem $source -cloneItem $destItem
        
        foreach($child in $source.Children){
            if(Has-BaseTemplate -item $child -baseTemplateId "{168F65DC-9ECD-4A6E-AD93-A46464E45F79}"){
                 $path = "$($dest.Paths.FullPath)/$($source.Name)"
                 $newDest = Get-Item master:$path
                 Clone-Recursive -source $child -dest $newDest
            }   
        }
    }
    
    $root =  Get-Item master:/sitecore/content/EasyJet/Holidays/Home/Destinations/Morocco
    $newTarget = Get-Item master:/sitecore/content/EasyJet/TradePortal/Home/Destinations
    
    Clone-Recursive -source $root -dest $newTarget
