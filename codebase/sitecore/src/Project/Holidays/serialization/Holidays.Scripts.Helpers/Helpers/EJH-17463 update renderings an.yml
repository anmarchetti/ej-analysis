Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/EJH-17463 update renderings and change templates"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function UpdateRendring {
      param($item)
            $rendering = $item["__Renderings"]
            write-host $rendering
            
            if($rendering.Contains('<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"><p:d /></r>')){
                $newValue = $rendering.Replace('<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"><p:d /></r>','<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"></r>')
                $item.Editing.BeginEdit()
                $item["__Renderings"] = $newValue
                $item.Editing.EndEdit()
                Write-Host "Changed rendering"
            }
    }
    
    function ChangeTemplate {
      param($item)
            $trackingValue = $item["__Tracking"]
            if($trackingValue.Contains('<key name="city" value="10" />')){
                $item.ChangeTemplate($regionCityTemplate)
            }
    }
    
    $regionCityTemplatePath = '/sitecore/templates/Project/Holidays/Pages/Destinations/Region - City'
    $regionCityTemplate = Get-Item -Path "master:$($regionCityTemplatePath)"
    
    # Loop through all items
    
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" -or $_.TemplateName -eq "VirtualCountry" }
    
    foreach ($countryItem in $countryItems) {
        $regions = Get-ChildItem -Path $countryItem.ProviderPath | Where-Object { $_.TemplateName -eq "Region" -or $_.TemplateName -eq "VirtualRegion" }
        foreach ($region in $regions) {
            UpdateRendring -item $region
            ChangeTemplate -item $region
        }
    }
    
