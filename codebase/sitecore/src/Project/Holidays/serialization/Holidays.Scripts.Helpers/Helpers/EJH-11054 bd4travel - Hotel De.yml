ID: "98e73894-119b-4df6-b7b7-a16e803c5957"
Parent: "a526d511-21c8-4534-a668-c72875bbbf40"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/EJH-11054 bd4travel - Hotel Details Browse - Other Hotel Options"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemID = "{718C3803-BF16-4F0F-9C47-57A97264BC06}"
    $itemPath = "/sitecore/content/EasyJet/Holidays/Data/Recommended Hotels Carousel Folder/Recommended Hotels Grid Browse"
    $data = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    # Remove old DataSource if ID isn't correct 
    if ($data -ne $null -and $data.ID -ne $itemID) {
    	$data | Remove-Item
    	Write-Host "Old" $data.Name "removed"
    	$data = $null
    } 
    
    # Create new DataSource with correct ID
    if (-not $data) {
    	$data = New-Item -Path $itemPath -ItemType "{439330F2-BA2B-4D2D-9198-188D525F5877}" -ForceId $itemID
    	Write-Host "New" $data.Name "created"
    }
    
    if ($data -ne $null) {
    	$data.Editing.BeginEdit()
    	$data["Title"] = "Holidays we think you'll like"
    	$data["BD4PlacementId"] = 'ejh-reco-pdp-browse-twolines'
    	$data["NumberOfRequestedHotelBD4"] = '40'
    	$data["MinNumberOfHotelsToShowComponent"] = '1'
    	$data["InitialNumberOfHotelsDesktop"] = '8'
    	$data["InitialNumberOfHotelsMobile"] = '4'
    	$data.Editing.EndEdit() | Out-Null;
    	Write-Host $data.Name "updated";
    }
    
    function Find-Destinations-Items {
    	param($tempateName)
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    		@{ Filter = "Equals"; Field = "_templatename"; Value = $tempateName; }
    	)
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    
    	return $items
    }
    
    $recommendedRend = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Destination Recommended Hotels";
    $hotels = Find-Destinations-Items -tempateName "Hotel"
    
    foreach ($hotel in $hotels)
    {
    	$item = Get-Item -Path master: -Id $hotel.ItemId -ErrorAction SilentlyContinue
    
    	if ($item -ne $null) {
    		Get-Rendering -Item $item -Rendering $recommendedRend | ForEach-Object {
    			$_.Datasource = $data.ID;
    			Set-Rendering -Item $item -Instance $_
    			Write-Host "Item" $hotel.Name
    		}
    	}
    }
    
    
