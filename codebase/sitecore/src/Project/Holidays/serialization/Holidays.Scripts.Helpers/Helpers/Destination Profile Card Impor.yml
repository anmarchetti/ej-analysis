- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    ### Note: Rebuild 'sitecore_destinations_master_index' before run this script. ###
    
    $filePath = "$($SitecoreDataFolder)\ImportData\destination-profile-cards.csv"
    
    function Get-ProfileCards {
    	param([Sitecore.Analytics.Data.ContentProfile]$profileItem,$profileCardKeys)
    
    	$presetInfoList = @();
    
    	if ($profileItem -eq $null -or $profileCardKeys -eq $null)
    	{
    		return $presetInfoList;
    	}
    
    	foreach ($key in $profileCardKeys)
    	{
    		$preset = $profileItem.GetPreset($key);
    
    		if ($preset -ne $null)
    		{
    			$presetInfoList += $preset.Alias.ToLower();
    		}
    	}
    
    	return $presetInfoList;
    }
    
    #region Update Items and their Presentation Details
    function Set-Profile-Types {
    	param($importData,$destinationItems)
    
    	foreach ($profileData in $importData)
    	{
    		$destinationItemSearchResult = $destinationItems[$profileData.Code]
    		if ($destinationItemSearchResult -ne $null) {
    			$item = Get-Item -Path master: -Id $destinationItemSearchResult.ItemId
    			$profileName = $profileData.Profile
    			$trackingField = New-Object Sitecore.Analytics.Data.TrackingField ($item.Fields["__tracking"]);
    
    			[Sitecore.Analytics.Data.ContentProfile]$hotelThemesProfile = $trackingField.Profiles | Where-Object { $_.Name -like "Hotel Themes" }
    
    			if ($hotelThemesProfile -ne $null)
    			{
    				$presetInfo = Get-ProfileCards -profileItem $hotelThemesProfile -profileCardKeys @( $profileName)
    
    				$dictionary = New-Object 'System.Collections.Generic.Dictionary`2[System.String,System.Double]'
    
    				[double]$presetCount = 100 / $presetInfo.Count;
    
    				foreach ($key in $presetInfo)
    				{
    					$dictionary.Add($key,$presetCount);
    				}
    
    				$hotelThemesProfile.SaveToField = $true;
    				$hotelThemesProfile.Presets = $dictionary;
    
    				[Sitecore.Analytics.Data.TrackingField]::UpdateKeyValues($hotelThemesProfile);
    			}
    
    			$currentTrackingFieldValue = $null;
    			if ([string]::IsNullOrEmpty($trackingField.Value))
    			{
    				$currentTrackingFieldValue = [System.Xml.Linq.XDocument]::Parse("<tracking></tracking>")
    			} else {
    				$currentTrackingFieldValue = [System.Xml.Linq.XDocument]::Parse($trackingField.Value);
    			}
    
    			[System.Xml.Linq.XDocument]$newTrackingFieldValue = $currentTrackingFieldValue;
    			[System.Xml.Linq.XElement]$tracking = $newTrackingFieldValue.Element("tracking");
    			if ($tracking -eq $null)
    			{
    				$tracking = New-Object System.Xml.Linq.XElement -ArgumentList "tracking";
    				$newTrackingFieldValue.Add($tracking);
    			}
    
    			$list = $tracking.Elements("profile");
    
    			foreach ($profile in $list)
    			{
    				$profile.Remove();
    			}
    
    			foreach ($profile in $trackingField.Profiles)
    			{
    				if ($profile.SaveToField) {
    					$savedProfile = $profile.ToXElement()
    					$tracking.Add($savedProfile);
    				}
    			}
    
    
    			$item.Editing.BeginEdit();
    			$item["__tracking"] = $newTrackingFieldValue.ToString();
    			$item.Editing.EndEdit() > $null;
    
    			Write-Host "Set profile type $($profileName) for $($item.Paths.FullPath)"
    		}
    	}
    }
    
    #region import data from file
    function Import-Destination-From-Csv-File {
    	param($filePath)
    	$data = @()
    
    	$csvFile = Import-Csv $filePath -Delimiter ','
    
    	foreach ($row in $csvFile) {
    		$profileName = $row.'ProfileType'
    		if (-not ([string]::IsNullOrEmpty($profileName))) {
    			$objTemp = @{
    				Name = $row.'Name'
    				Code = $row.'Code'
    				Profile = $row.'ProfileType'
    			}
    
    			$data += $objTemp
    		}
    
    	}
    
    	return $data
    }
    
    
    function Get-Destinations {
    	$regionTemplateId = [Sitecore.Data.ID]::Parse("{2F42EC14-7E56-467A-B300-AB9723C74546}")
    	$virtualRegionTemplateId = [Sitecore.Data.ID]::Parse("{799ECB20-C605-4A6C-A32B-27222BDBB91E}")
    	$resortTemplateId = [Sitecore.Data.ID]::Parse("{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}")
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Where = 'TemplateId = @0 Or TemplateId=@1 Or TemplateId=@2'
    		WhereValues = $regionTemplateId,$virtualRegionTemplateId,$resortTemplateId
    	}
    
    	$items = Find-Item @props
    
    	$hash = @{}
    	$items | ForEach-Object { 
    	    if(-not ([string]::IsNullOrEmpty($_.Fields.code))){
    	        $hash[$_.Fields.code] = $_ 
    	    }
    	}
    
    
    	Write-Host "$($hash.Count) resort and regions have been found."
    
    	return $hash
    }
    
    
    
    #Import cvs file
    $importData = Import-Destination-From-Csv-File -FilePath $filePath
    
    #Get destinations Region, Resort, Virtual Region
    $destinationItems = Get-Destinations
    
    #Update Description Items
    Set-Profile-Types -importData $importData -destinationItems $destinationItems 
