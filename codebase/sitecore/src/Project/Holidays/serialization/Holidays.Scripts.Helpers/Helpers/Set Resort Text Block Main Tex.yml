ID: "ed795275-5b13-4afd-8c26-1c8b5aeca0ad"
Parent: "a526d511-21c8-4534-a668-c72875bbbf40"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Set Resort Text Block Main Text To True
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Find-Resort-Items {
        $criteria = @(
            @{ Filter = "Equals"; Field = "_template"; Value = "538939b307ec4c23bf8c3a68de0fdc93"; }
            @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
        )
    
        $props = @{
            Index = "sitecore_destinations_master_index"
            Criteria = $criteria
        }
    
        $items = Find-Item @props
        Write-Host "Number of Resorts retrived: " $items.Count -ForegroundColor Green
    
        return $items
    }
    
    function Get-Children-By-Template{
        param($parent, $templateId)
    
        $children = Get-ChildItem -Item $parent | Where-Object { $_.TemplateId -eq $templateId }
    
        return ,$children
    }
    
    function Get-Children-By-Template-Item-Name {
        param($parent,$templateId, $itemName)
        
        $children = Get-ChildItem -Item $parent -Recurse | Where-Object { $_.TemplateId -eq $templateId -And $_.Name -eq $itemName }
    
        return ,$children
    }
    
    $resorts = Find-Resort-Items
    
    
    $pageComponentsFolderTemplateId = "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    $textBlockTemplateId = "{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}"
    $textBlockName = "Intro Heading and Description"
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
        New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
            foreach($resortSolr in $resorts){
    
                $resort = Get-Item -Path "master:" -ID $resortSolr.ItemId
    
                $pageComponentsFolders = Get-Children-By-Template -Parent $resort -TemplateId $pageComponentsFolderTemplateId
    
                if ($pageComponentsFolders.Count -eq 0){
                        Write-Host "Text block with ($textBlockName) text was not found under resort with id $($resort.ID)"
                    }
    
                foreach($pageComponentsFolder in $pageComponentsFolders){
                    $textBlock = Get-Children-By-Template-Item-Name -Parent $pageComponentsFolder -TemplateId $textBlockTemplateId -ItemName $textBlockName | Select -First 1        
    
                    if ($textBlock -ne $null){
                        $textBlock.Editing.BeginEdit()
                        $textBlock.Fields["IsMainText"].Value = "1"
                        $textBlock.Editing.EndEdit()
                    }else {
                        Write-Host "Text block with ($textBlockName) text was not found under resort with id $($resort.ID)"
                    }
                }
            }
        }
    }
