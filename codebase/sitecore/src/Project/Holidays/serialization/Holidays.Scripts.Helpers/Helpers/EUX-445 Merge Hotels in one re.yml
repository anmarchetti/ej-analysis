- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $hbgPrefix = 'X9*'
    function Has-BaseTemplate($item, $baseTemplateId)
    {
        if ($item -eq $null)
        {
            return false;
        }
        $template = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($item);
        return $template -ne $null -and $template.InheritsFrom($baseTemplateId);
    }
    
    function Get-Items-Recursive($root, $list){
        foreach($child in $root.Children){
            if(Has-BaseTemplate -item $child -baseTemplateId "{168F65DC-9ECD-4A6E-AD93-A46464E45F79}"){
                if($child.TemplateId -eq "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}")
                {
                    foreach ($item in $child.Children) {
    	                if($item.TemplateId -ne "{28E5E169-8F72-4F90-A277-280A8302B607}"){
    	                    continue;
    	                }
    	                $list.Add($item) > $null
                    }
                }
                else{
                    Write-Host $child.Paths.FullPath
                    Get-Items-Recursive $child $list
                }
            }
        }
    }
    
    function Is-Published {
    	param($item)
    	$path = $item.Paths.FullPath
    	return Test-Path -Path "web:\$($path)"
    }
    
    # Both hotels should be published
    # One version of hotel should be HBG and other DC
    function Is-Valid {
    	param(
    		$item1,$item2
    	)
    	$isPublishedItem1 = Is-Published -Item $item1
    	$isPublishedItem2 = Is-Published -Item $item2
    	if ($isPublishedItem1 -and $isPublishedItem2)
    	{
    
    		if ($item1["Code"] -NotLike $hbgPrefix -and $item2["Code"] -like $hbgPrefix) {
    			return $true
    		}
    		if ($item1["Code"] -Like $hbgPrefix -and $item2["Code"] -NotLike $hbgPrefix) {
    			return $true
    		}
    	}
    	return $false
    }
    
    function Prepare-Data {
    	param($items)
    	$rows = [System.Collections.ArrayList]@()
    	foreach ($item in $items) {
    		$validItems = $item.Group | Group-Object { $_.DisplayName } | Sort-Object -Property Count -Descending | Select-Object -First 1 
            $validItems = $validItems.Group | Where-Object { Is-Published $_ }
    		if ($validItems.Count -eq 2) {
    			if (Is-Valid -item1 $validItems[0] -item2 $validItems[1]) {
    				foreach ($validItem in $validItems) {
    					$disName = $validItem.DisplayName
    					$customItem = [pscustomobject]@{
    						"DisplayName" = $disName
    						"GIATA" = $validItem["GiataCode"]
    						"AccomCode" = $validItem["Code"]
    						"FullPath" = $validItem.Paths.FullPath
    						"IsPublished" = Test-Path -Path "web:\$($validItem.Paths.FullPath)"
    					}
    					$rows.Add($customItem) > $null
    				}
    			}
    		}
    	}
    	Write-Host "Hotel diff report has been prepared $($rows.Count)"
    	return $rows
    }
    
    function Move-HBGRoomsToDC{
        param($hbgHotel, $dcHotel)
        
        $hbgRooms = Get-ChildItem -Item $hbgHotel | Where-Object {$_.TemplateId -eq "{1762DFC8-B872-41A2-A7C1-A54B93DD6CCD}"}
        
        $hbgRooms | Move-Item -Destination $dcHotel.Paths.FullPath
    }
    
    function Merge-Hotels {
    	param($items)
    	$rows = [System.Collections.ArrayList]@()
    	foreach ($item in $items) {
    		$validItems = $item.Group | Group-Object { $_.DisplayName } | Sort-Object -Property Count -Descending | Select-Object -First 1 
            $validItems = $validItems.Group | Where-Object { Is-Published $_ }
    
    		if ($validItems.Count -eq 2) {
    			if (Is-Valid -item1 $validItems[0] -item2 $validItems[1]) {
    			    $item1 = $validItems[0]
    	            $item2 = $validItems[1]
    	    
    	            #Find DC version of hotel and HBG version of hotel
                    $dcItem = $null
                    $hbgItem = $nll
                    if($item1["Code"] -Like $hbgPrefix){
                        $hbgItem = $item1
                    }else{
                        $dcItem = $item1
                    }
            
                    if($item2["Code"] -Like $hbgPrefix){
                        $hbgItem = $item2
                    }else{
                        $dcItem = $item2
                    }
                    
                    Move-HBGRoomsToDC -hbgHotel $hbgItem -dcHotel $dcItem
                    
                    Write-Host $dcItem.Paths.FullPath
                    # Remove HBG version
                    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
    	                New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
    		                New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
    			                New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                                    $hbgItem | Remove-Item -Recurse -Permanently | out-null
                                }
    		                }
    	                }
                    }
                    
    			}
    		}
    	}
    	return $rows
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    $list = [System.Collections.ArrayList]@()
    $root =  Get-Item "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    Get-Items-Recursive $root $list
    $items = $list | Group-Object { $_["GiataCode"] } | Where-Object { $_.Count -gt 1 }
    
    $itemCount = $items | Measure-Object | Select-Object -Expand Count
    Write-Log "Hotels were found $($itemCount)"
    Write-Host "Hotels were found $($itemCount)"
    
    Merge-Hotels $items
    #Prepare items to table format
    #Prepare-Data -items $items | Show-ListView
    
    $stopWatch.Stop()
    
    Write-Host "Info: Elapsed time - $($StopWatch.Elapsed)"
