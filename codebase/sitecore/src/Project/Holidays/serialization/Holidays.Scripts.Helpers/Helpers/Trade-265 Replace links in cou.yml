Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/Trade-265 Replace links in countries navigation"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $navigations = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Data/Navigations/Countries"
    foreach($navigation in $navigations.Children){
        try{
            $destinationUrl = ($navigation.Name -replace " ", "-").ToLower()
            $url = "/en/holidays/trade-portal/$destinationUrl"
            $linkText = $navigation.Name
            $linkValue = '<link text="{0}" linktype="external" url="{1}" anchor="" target="" rel="" />' -f $linkText, $url
            
            $navigation.Editing.BeginEdit()
            $navigation.Fields["Link"].Value = $linkValue
            $navigation.Editing.EndEdit() | Out-Null 
        }catch{
            Write-Warning "Cannot proccess navigation item $($navigation.Name)" 
            Write-Warning $Error[0]
        }
    }
    
    $links = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Navigations/Destinations Groups"
    foreach($item in $links.Children){
        #skip top adults holiday
        if($item.Name -ne "Top Adult Holidays"){
            $linkValue = '<link text="{0}" linktype="external" url="/en/holidays/trade-portal/destinations" anchor="" target="" rel="" />' -f $item.Name
            $item.Editing.BeginEdit()
            $item["Link"] = $linkValue
            $item.Editing.EndEdit() | Out-Null
        }
    }
    
