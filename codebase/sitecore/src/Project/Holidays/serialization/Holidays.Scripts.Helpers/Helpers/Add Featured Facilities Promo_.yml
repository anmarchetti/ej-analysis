Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Add Featured Facilities Promo items to each Hotel
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $rootItemPath = "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    
    $countryTemplateId = "{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}"
    $regionTemplateId = "{2F42EC14-7E56-467A-B300-AB9723C74546}"
    $resortTemplateId = "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}"
    $hotelTemplateId = "{28E5E169-8F72-4F90-A277-280A8302B607}"
    
    $pageComponentsTemplateId = "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    $promoBlocksFolderTemplateId = "{EB30259D-FF9A-46CB-8E0C-4616B148F3A8}"
    $promoBlockTemplateId = "{84ACB697-5638-4525-9801-B31CAC2E0394}"
    
    $promoBlockComponentTemplate = "{FF441699-4D65-45C1-B565-E87714B5A278}"
    
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		New-Item -Parent $parent -Name $itemName -ItemType $templateId
    	}
    
    	return $item
    }
    
    function Add-Promo-Facilities-To-Hotels(){
        $counties = Get-ChildItem -Path $rootItemPath | Where { $_.TemplateID -eq  $countryTemplateId}
        $counties.length
        
     	New-UsingBlock (New-Object Sitecore.Data.DatabaseCacheDisabler) {
    		New-UsingBlock (New-Object Sitecore.Data.Events.EventDisabler) {
    		    New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                    foreach($country in $counties){
                        $regions = $country.Children | Where { $_.TemplateID -eq  $regionTemplateId}
                        foreach($region in $regions){
                            $resorts = $region.Children | Where { $_.TemplateID -eq  $resortTemplateId}
                            foreach($resort in $resorts){
                                $hotels = $resort.Children | Where { $_.TemplateID -eq  $hotelTemplateId}
                                
                                foreach($hotel in $hotels){
                                    $pageComponenFolderItem = Get-Or-Create-Item -Parent $hotel -itemName "Page Components" -templateId $pageComponentsTemplateId
                                    $pageComponenFolderItem.Editing.BeginEdit()
                        			$pageComponenFolderItem["__sortorder"] = 0
                        			$pageComponenFolderItem.Editing.EndEdit() | Out-Null
                        			
                                    $promoBlockFolderItem = Get-Or-Create-Item -Parent $pageComponenFolderItem -itemName "Featured Facilities" -templateId $promoBlocksFolderTemplateId
                                    $promoBlockFolderItem.Editing.BeginEdit()
                        			$promoBlockFolderItem["FeaturedFacilities"] = 1
                        			$promoBlockFolderItem.Editing.EndEdit() | Out-Null
                        			
                        			Get-Or-Create-Item -Parent $promoBlockFolderItem -itemName "Featured Facility 1" -templateId $promoBlockTemplateId | Out-Null
                        			Get-Or-Create-Item -Parent $promoBlockFolderItem -itemName "Featured Facility 2" -templateId $promoBlockTemplateId | Out-Null
                        			Get-Or-Create-Item -Parent $promoBlockFolderItem -itemName "Featured Facility 3" -templateId $promoBlockTemplateId | Out-Null
                        			
                        			$rendering = Get-Rendering -Item $hotel | Where-Object {$_.ItemId -eq $promoBlockComponentTemplate} | Select -First 1
                
                                    if($rendering -ne $null){
                        			    $rendering.DataSource = $promoBlockFolderItem.Id; 
                                        Set-Rendering -Item $hotel -Instance $rendering
                                    
                                        Write-Host "Featured Facilities DataSource was added to $($hotel.name) ($($hotel.id))"
                                    } else {
                                        Write-Warn "Promo Blocks component was not found on $($hotel.name) ($($hotel.id)) hotel"
                                    }
                
                                }
                            }
                        }
                    }
    		    }
    		}
     	}
        Write-Host "Rendering parameters updated"
    }
    
    Add-Promo-Facilities-To-Hotels
