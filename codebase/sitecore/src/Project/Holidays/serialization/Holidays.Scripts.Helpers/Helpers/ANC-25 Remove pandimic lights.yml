Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/ANC-25 Remove pandimic lights"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Remove Renderings
    $pagesPandemicLevelBanner = Get-ItemReferrer -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Banner'
     
    foreach($item in $pagesPandemicLevelBanner){
        $renderingItem = Get-Item -Path "master:" -Id "{1DED9C91-5753-4C0A-917B-B44AF0E57DB1}"
        $rendering = Get-Rendering -Item $item -PlaceHolder "*header*" -Rendering $renderingItem 
        if($rendering -ne $null){
            Remove-Rendering -Item $item -UniqueId $rendering.UniqueId
            Write-Host $item.Name  "Pandemic Level Banner Rendering successfully deleted"
        }       
    }
     
    $pagesPandemicLeveDestinations = Get-ItemReferrer -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Destinations'
     
    foreach($item in $pagesPandemicLeveDestinations){
        $renderingItem = Get-Item -Path "master:" -Id "{47F6707C-CA76-4BD9-88CF-51F80A660D13}"
        $rendering = Get-Rendering -Item $item -Rendering $renderingItem 
        if($rendering -ne $null){
            Remove-Rendering -Item $item -UniqueId $rendering.UniqueId
            Write-Host $item.Name  "Pandemic Level Destinations Rendering successfully deleted"
        }       
    }
     
    $pages = Get-ItemReferrer -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Requirement Block'
     
    foreach($item in $pages){
        $renderingItem = Get-Item -Path "master:" -Id "{EB77E008-E0AF-431E-B2A9-055890889410}"
        $rendering = Get-Rendering -Item $item -Rendering $renderingItem 
        if($rendering -ne $null){
            Remove-Rendering -Item $item -UniqueId $rendering.UniqueId
            Write-Host $item.Name  "Pandemic Level Requirement Block Rendering successfully deleted"
        }       
    }
     
    $pages = Get-ItemReferrer -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Search'
     
    foreach($item in $pages){
        $renderingItem = Get-Item -Path "master:" -Id "{463C3762-0B50-4F16-AAD3-5622CF3A1C4B}"
        $rendering = Get-Rendering -Item $item -Rendering $renderingItem 
        if($rendering -ne $null){
            Remove-Rendering -Item $item -UniqueId $rendering.UniqueId
            Write-Host $item.Name  "Pandemic Level Search Block Rendering successfully deleted"
        }       
    }
     
    Get-Item -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Banner' | Remove-Item -Permanently 
    Get-Item -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Destinations' | Remove-Item -Permanently 
    Get-Item -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Requirement Block' | Remove-Item -Permanently 
    Get-Item -path 'master:/sitecore/layout/Renderings/Feature/Destinations/Pandemic Levels/Pandemic Level Search' | Remove-Item -Permanently
     
    #Remove Pandemic Level Datasources
    Get-Item -path 'master:/sitecore/content/EasyJet/Holidays/Data/Pandemic Levels States' | Remove-Item -Permanently -Recurse
     
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level State' | Remove-Item -Permanently
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level States Folder' | Remove-Item -Permanently
     
    Get-ItemReferrer -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Requirement Block' | Remove-Item -Permanently -Recurse
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Requirement Block' | Remove-Item -Permanently
     
    Get-ItemReferrer -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Search' | Remove-Item -Permanently -Recurse
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Search' | Remove-Item -Permanently
     
    Get-ItemReferrer -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Destinations' | Remove-Item -Permanently -Recurse
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels/Pandemic Level Destinations' | Remove-Item -Permanently 
    Get-Item -path 'master:/sitecore/templates/Feature/Destinations/Pandemic Levels' | Remove-Item -Permanently
     
     
