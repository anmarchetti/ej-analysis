Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Set Search Pod Parameters To True
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Set-Rendering-Parameters($item){
        $renderingInstance =  Get-Rendering -Item $item -Rendering $searchPodRendering
            
        if($renderingInstance -eq $null){
            return;
        }
        Set-Rendering -Item $item -Instance $renderingInstance -Parameter $parameters
    }
    
    function Traverse-Items($parentItem){
        ForEach($country in $parentItem.GetChildren()){
            Set-Rendering-Parameters($country)
            ForEach($region in $country.GetChildren()){
                Set-Rendering-Parameters($region)
                ForEach($resort in $region.GetChildren()){
                    Set-Rendering-Parameters($resort)
                    ForEach($hotel in $resort.GetChildren()){
                        Set-Rendering-Parameters($hotel)
                    }
                }
            }
        }
        Write-Host "Rendering parameters updated"
    }
    
    $destinationsPagesRootFolderPath = "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    
    $destinationsPagesRootFolderPathItem = Get-Item -Path $destinationsPagesRootFolderPath
    
    $destinationPageCountries = $destinationsPagesRootFolderPathItem.GetChildren()
    
    $searchPodRenderingPath = "master:/sitecore/layout/Renderings/Foundation/Destinations/Search Pod"
    
    $searchPodRendering = Get-Item -Path $searchPodRenderingPath
    
    $parameters = [ordered]@{"IsSticky"="1"; "ShowTitle"="1";}
    
    Traverse-Items -parentItem $destinationsPagesRootFolderPathItem
    
    
