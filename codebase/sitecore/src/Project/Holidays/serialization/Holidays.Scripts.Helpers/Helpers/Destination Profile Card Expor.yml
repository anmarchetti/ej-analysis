Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Destination Profile Card Export
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    ### Note: Rebuild 'sitecore_destinations_master_index' before run this script. ###
    
    function Get-Destinations {
    	$regionTemplateId = [Sitecore.Data.ID]::Parse("{2F42EC14-7E56-467A-B300-AB9723C74546}")
    	$virtualRegionTemplateId = [Sitecore.Data.ID]::Parse("{799ECB20-C605-4A6C-A32B-27222BDBB91E}")
    	$resortTemplateId = [Sitecore.Data.ID]::Parse("{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}")
    
    	$props = @{
    		Index = "sitecore_destinations_master_index"
    		Where = 'TemplateId = @0 Or TemplateId=@1 Or TemplateId=@2'
    		WhereValues = $regionTemplateId,$virtualRegionTemplateId,$resortTemplateId
    	}
    
    	$items = Find-Item @props
    
    	Write-Host "$($items.Count) resort and regions have been found."
    
    	return $items
    }
    
    function Prepare-Data {
    	param($items)
    
    	$data = @()
    	foreach ($searchResultItem in $items) {
    
    		$item = Get-Item -Path master: -Id $searchResultItem.ItemId
    		$rows = Get-Data-From-Item -Item $item
    		$rows | ForEach-Object { $data += $_ }
    	}
    
    	Write-Host "Destinations profile card report has been prepered."
    
    	return $data
    }
    
    function Get-Data-From-Item
    {
    	param($item)
    
    	$tracker = New-Object Sitecore.Analytics.Data.TrackingField ($item.Fields["__tracking"]);
    	$profiles = $tracker.Profiles
    	$profileName = ""
    	foreach ($profile in $profiles)
    	{
    		if ($profile.Presets.Keys -ne $null) {
    			$profileName = [system.String]::Join("|",$profile.Presets.Keys)
    		}
    	}
    
    	$data = [ordered]@{
    		Name = $item.Name
    		Code = $item['Code']
    		ProfileType = $profileName
    	}
    
    	return $data
    }
    
    #find destination items
    $items = Get-Destinations
    
    #prepare items to table format
    $table = Prepare-Data -items $items
    
    
    [string[]]$outobject = $table | ForEach-Object { New-Object PSObject -Property $_ } | ConvertTo-Csv -Delimiter ',' | Select-Object -Skip 1
    $date = Get-Date -Format "MMddyyyyHHmmss"
    Out-Download -Name "destination-profile-cards-$($date).csv" -InputObject $outobject 
