---
ID: "fbf64dbd-4587-44c8-9ec9-13b19e673d82"
Parent: "a526d511-21c8-4534-a668-c72875bbbf40"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/WP-459 - import room name translations"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $languages = @('fr-FR', 'de-DE')
    $ignoredField = @('Description', 'Image', 'Content')
    
    $importCsvMediaPath = "master:/sitecore/media library/Default Website/HotelRoomsReport_short"
    $roomNameTranslationsFrColumnName = "RoomNameFr"
    $roomNameTranslationsDeColumnName = "RoomNameDe"
    
    function Import-Data-From-Csv-File {
    	$data = @()
        $media = Get-Item -Path $importCsvMediaPath
        # Read media stream into a byte array
        [system.io.stream]$body = $media.Fields["blob"].GetBlobStream()
        try 
        {
            $contents = New-Object byte[] $body.Length
            $body.Read($contents, 0, $body.Length) | Out-Null
        } 
        finally 
        {
            $body.Close()    
        }
    
        # Convert the stream into a collection of objects
        $csv = [System.Text.Encoding]::Default.GetString($contents) | ConvertFrom-Csv
    
    	foreach ($row in $csv) {
    		$atcomCodes = $row.'HotelAtcomCodes'
    		$giata = $row.'GIATA'
    		$roomFolder = $row.'RoomFolder'
    		$roomType = $row.'RoomType'
    		$roomNameFr = $row.$roomNameTranslationsFrColumnName
    		$roomNameDe = $row.$roomNameTranslationsDeColumnName
    		
    		$objTemp = @{
    			AtcomCodes = $atcomCodes
    			Giata = $giata
    			RoomFolder = $roomFolder
    			RoomType = $roomType
    			RoomNameFr = $roomNameFr
    			RoomNameDe =$roomNameDe
    		}
    
    		$data += $objTemp
    	}
    
    	return $data
    }
    
    function Run-Import {
        New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
        	$data = Import-Data-From-Csv-File;
        
        	foreach($row in $data) {
        	    
            	$criteriaTemplate  = @(
            		@{ Filter = "Equals"; Field = "_templatename"; Value = "Hotel"; }
            	)
            	$atcomCode = $row.AtcomCodes.Split('|')[0]
            	$predicateTemplate = New-SearchPredicate -Operation Or -Criteria $criteriaTemplate
            	
            	$criteriaGiata = @{Filter = "Equals"; Field = "tmp_code"; Value = $row.Giata.Trim()}
            	$criteriaCode = @{Filter = "Contains"; Field = "sources"; Value = $atcomCode.Trim()}
            	$predicateGitata = New-SearchPredicate -Criteria $criteriaGiata
            	$predicateCode = New-SearchPredicate -Criteria $criteriaCode
                $predicateGiataOrCode = New-SearchPredicate -First $predicateGitata -Second $predicateCode -Operation Or
                
                $predicateCodeAndTemplate = New-SearchPredicate -First $predicateTemplate -Second $predicateGiataOrCode -Operation And
                
            	$props = @{
            		Index = "sitecore_destinations_master_index"
            		WherePredicate = $predicateCodeAndTemplate
            	}
            
            	$hotel = Find-Item @props -First 1 | Get-Item
            	if($hotel -eq $null) {
            	    Write-Output "no hotel found for atcomCodes:$($row.AtcomCodes) - giata:$($row.Giata)"
            	}
            	else {
            	       $roomFolder = $hotel.Children | Where { $_.Name -eq $row.RoomFolder }
            	       foreach($room in $roomFolder.Children) {
            	           
            	           $roomTypeId = $room["RoomType"]
            	           $roomTypeItem = Get-Item -Path master: -ID $roomTypeId
            	           if($roomTypeItem["Code"] -eq $row.RoomType) {
            	               
            	               Add-ItemLanguage -Item $room -IfExist Skip -TargetLanguage $languages -Language "en" -IgnoredFields $ignoredField | Out-Null
            	               
            	               if($row.RoomNameFr -ne "") {
            	                   
            	                    $roomFr = Get-Item -Path master: -ID $room.Id -Language "fr-FR"
            	                    $newRoomNameFr = $row.RoomNameFr.Trim()
            	                    if($roomFr.Fields["Name"].Value -ne $newRoomNameFr) {
                	                    $roomFr.Editing.BeginEdit()
                                        $roomFr.Fields["Name"].Value = $newRoomNameFr
                                        $roomFr.Editing.EndEdit() | Out-Null
            	                    }
            	               }
            	               
            	               if($row.RoomNameDe -ne "") {
            	                   
            	                    $roomDe = Get-Item -Path master: -ID $room.Id -Language "de-DE"
            	                    $newRoomNameDe = $row.RoomNameDe.Trim()
            	                    
            	                    if($roomDe.Fields["Name"].Value -ne $newRoomNameDe) {
                	                    $roomDe.Editing.BeginEdit()
                                        $roomDe.Fields["Name"].Value = $newRoomNameDe
                                        $roomDe.Editing.EndEdit() | Out-Null
            	                    }
            	               }
            	               break
            	           }
            	     }
            	}
        	}
        }
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    Run-Import
    
    $stopWatch.Stop()
    Write-Host "completed. Elapsed time - $($StopWatch.Elapsed)" -ForegroundColor Green 
