Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/BOOK-455 restore resort info component in browse"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $RenderingId = "{ECB6DA05-21A2-490B-80CD-439A652F8EF3}" # Resort Info Block
    $KeepUniqueId = "{92C5BED3-9249-45EA-9BAB-E4E9CFDFD75F}" # rendering from the Standard values
    # Define the start item
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    
    # script removes other renderings if there is any, keeping only variant from the standard values
    
    $count = 0
    
    function Remove-ExtraRenderingInstance {
        param(
            [Parameter(Mandatory = $true)]
            [Sitecore.Data.Items.Item]$PageItem
        )
    
        $targetRenderingId = $RenderingId.ToLowerInvariant()
        $keepUid = $KeepUniqueId.ToLowerInvariant()
    
        $matchingRenderings = Get-Rendering -Item $PageItem | Where-Object {
            $_.ItemID.ToString().ToLowerInvariant() -eq $targetRenderingId
        }
    
        if (-not $matchingRenderings -or $matchingRenderings.Count -le 1) {
            return
        }
    
        $renderingToRemove = $matchingRenderings | Where-Object {
            $_.UniqueId.ToString().ToLowerInvariant() -ne $keepUid
        } | Select-Object -First 1
    
        if (-not $renderingToRemove) {
            return
        }
    
        Remove-Rendering -Item $PageItem -Instance $renderingToRemove
        
        $global:count += 1
    }
    
    
    # Loop through all items
    
    
        "Start scanning destination items"
        $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" -or $_.TemplateName -eq "VirtualCountry" }
        foreach ($countryItem in $countryItems) {
            "Checking country $($countryItem.Name)..."
        
            $regions = Get-ChildItem -Path $countryItem.ProviderPath | Where-Object { $_.TemplateName -eq "Region" -or $_.TemplateName -eq "VirtualRegion" -or "Region - City" }
            foreach ($region in $regions) {
                
                $resorts = Get-ChildItem -Path $region.ProviderPath | Where-Object { $_.TemplateName -eq "Resort"}
                foreach ($resort in $resorts) {
                    
                    $hotels = Get-ChildItem -Path $resort.ProviderPath | Where-Object { $_.TemplateName -eq "Hotel"}
                    foreach ($hotel in $hotels) {
                        Remove-ExtraRenderingInstance -PageItem $hotel
                    }
                }
            }
        }
        
        Write-Host "Total Hotels Updated: $($global:count)"
