ID: "f75e2ed6-0a10-4f06-81ab-9f06fd6edf00"
Parent: "a526d511-21c8-4534-a668-c72875bbbf40"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Helpers/Transfers Duplicates Finder
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $transfers = Get-ChildItem -path "/sitecore/content/EasyJet/Holidays/Data/Transfers Info" -Recurse | Where { $_.TemplateID -eq "{434E365E-D63B-4A66-9E88-88C07EC2B97D}"  }
    
    $numOfDuplicates = 0
    $array = @()
    $transfers | ForEach-Object {
        $transfer = $_
    
    	if($transfer -ne $null){
    	           
                $transfersToCheck = $array | Where-Object -FilterScript { $_.Fields["ProductID"].Value -eq $transfer.Fields["ProductID"].Value }
                if($transfersToCheck -ne $null)
                {
                    $transferName = $transfer.Name
                    #$roomToProcess | Remove-Item
                    Write-Host "$($transfersToCheck.Name) $($transfersToCheck.ItemPath) ($($transfersToCheck.id)) - original $([Sitecore.DateUtil]::IsoDateToDateTime($transfersToCheck.Fields['__Updated'].Value).ToString('dd-MM-yyyy HH:mm:ss'))" -ForegroundColor green
                    Write-Host $transferName $transfer.ItemPath "($($transfer.id)) - duplicate " $([Sitecore.DateUtil]::IsoDateToDateTime($transfer.Fields['__Updated'].Value).ToString("dd-MM-yyyy HH:mm:ss")) -ForegroundColor red
                    $numOfDuplicates++
                    
                    $originalDate = [Sitecore.DateUtil]::IsoDateToDateTime($transfersToCheck.Fields['__Updated'].Value)
                    $duplicateDate = [Sitecore.DateUtil]::IsoDateToDateTime($transfer.Fields['__Updated'].Value)
                    if($originalDate -lt $duplicateDate){
                        Write-Host "$($transfersToCheck.Name) $($transfersToCheck.ItemPath) ($($transfersToCheck.id)) $($originalDate.ToString('dd-MM-yyyy HH:mm:ss')) original was removed" -BackgroundColor green
                        $array += $transfer
                        #$transfersToCheck | Remove-Item
                    } elseif($originalDate -gt $duplicateDate){
                        Write-Host "$($transfer.Name) $($transfer.ItemPath) ($($transfer.id)) $($duplicateDate.ToString('dd-MM-yyyy HH:mm:ss')) duplicate was removed" -BackgroundColor red
                        #$transfer | Remove-Item
                    } else {
                        Write-Host "Require manual check $($transfer.Name) $($transfer.ItemPath) ($($transfer.id)) and ($($transfersToCheck.id))"
                    }
                }
                else {
                    #Write-Host "$($transfer.Name) ($($transfer.id)) original room" -ForegroundColor green
                    $array += $transfer
                }
        }
        
        #Write-Host "$($transfer.Name) was processed"
    }
    Write-Host "$($numOfDuplicates) were found"
