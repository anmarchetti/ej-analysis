  Value: |
    function UnpublishItems
    {
        param([Array]$items)
        
         New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
                 New-UsingBlock (New-Object Sitecore.Data.BulkUpdateContext) {
                    
                foreach($item in $items)
                {
                    if($item.Fields["__Never publish"].Value -ne "1")
                    {
                        $item.Editing.BeginEdit();
                        $item["__Never publish"] = "1";
                        if($item.Editing.EndEdit())
                        {
                           Publish-Item $item -Target "web" -PublishMode SingleItem 
                           Write-Host "Item with ID: $($item.ID) and Code: $($item["Code"]) is unpublished" 
                        }
                    }
                }
             }
        }
    }
    
    function GetHotelItems
    {
        param([String]$indexName, [Array]$hotelCodes)
        
        $hotelItems = @()
        
        foreach($hotelCode in $hotelCodes)
        {
            $criteria = @(
                @{Filter = "Equals"; Field ="_templatename"; Value = "Hotel"}
                @{Filter = "Equals"; Field="code"; Value = $hotelCode }
                @{Filter = "Equals"; Field = "_latestversion"; Value = "1"}
            )
            
            $props = @{
                Index = $indexName
                Criteria = $criteria
            }
            
            $hotel = Find-Item @props
            
            if ($hotel -ne $null)
            {
                $hotelItems += $hotel.GetItem()
            } else 
            {
                Write-Host "Hotel $hotelCode is null" -ForegroundColor "red"
            }
            
        }
        
        return $hotelItems
    }
    
