    function Get-File ($filePath) {
        try {
            $file = @{
                FileType = ""
                Data     = New-Object System.Collections.ArrayList
            }
            $item = Get-Item -Path $filePath
            [System.IO.Stream]$body = $item.Fields["Blob"].GetBlobStream()
            $contents = New-Object byte[] $body.Length
            $body.Read($contents, 0, $body.Length) | Out-Null
            $body.Close()
                
                
            $data = [System.Text.Encoding]::UTF8.GetString($contents) | ConvertFrom-Csv -Delimiter ","
            foreach ($row in $data) {
                $file.Data.Add($row)
            }
                
            foreach ($fileType in $fileTypes) {
                $type = $data[0] | Get-Member -MemberType Properties | Select-Object Name | Where-Object { $_.Name -like $fileType }
                if ($type -ne $null) {
                    $file.FileType = $fileType
                }
            }
    
            return $file
        }
        catch {
            Write-Host "Error occurred opening document with path: $($filePath)"
            return $null
        }
    }
    
    function Update-Questions-And-Answers($item, $faqData) {  
        $pageComponents = $item.Children | Where-Object { $_.TemplateId -eq $pageComponentsTemplateId } | Select-Object -First 1
        if ($pageComponents -eq $null) {
            $pageComponents = New-Item -Path "$($item.Paths.FullPath)/Page Components" -ItemType $pageComponentsTemplateId
        }
        
        $questionsAndAnswersFolder = $pageComponents.Children | Where-Object { $_.TemplateId -eq $questionsAndAnswersFolderTemplateId } | Select-Object -First 1
        
        if ($questionsAndAnswersFolder -eq $null) {
            $questionsAndAnswersFolder = New-Item -Path "$($pageComponents.Paths.FullPath)/Question and Answer" -ItemType $questionsAndAnswersFolderTemplateId
        }
        
        $order = 100
        foreach ($data in $faqData | Where-Object { $_.Question.Length -gt 0}) {
            $questionName = $data.Question.Substring(0, $data.Question.Length - 1)
            $questionPath = "$($questionsAndAnswersFolder.Paths.FullPath)/$($questionName)"
            $questionItem = Get-item -Path $questionPath -ErrorAction SilentlyContinue
            if ($questionItem -eq $null) {
                $questionItem = New-Item -Path $questionPath -ItemType $questionsAndAnswersTemplateId
            }
            $questionItem.Editing.BeginEdit()
            $questionItem.Fields["Question"].Value = $data.Question 
            $questionItem.Fields["Answer"].Value = $data.Answer 
            $questionItem.Fields["__Sortorder"].Value = $order
            $questionItem.Editing.EndEdit() > $null
            $order += $order
        }
    }
    
    function Create-Highlights($parentPath, $data) {
        $ids = @()
        if ($data -eq $null) {
            return $ids
        }
    
        $number = 1
        foreach($highlight in $data){
            if([string]::IsNullOrWhiteSpace($highlight.Title) -eq $false){
                $highlightName = $highlight.Title
            }
            else {
                $highlightName = "Highlight $($number)"
            }
            $highlightPath = "$($parentPath)/$($highlightName)"
            $highlightItem = Get-item -Path $highlightPath -ErrorAction SilentlyContinue
            if ($highlightItem -eq $null) {
                $highlightItem = New-Item -Path $highlightPath -ItemType $hightlightTemplateId
            }
                
            $highlightItem.Editing.BeginEdit()
            $highlightItem.Fields["Title"].Value = $highlight.Title
            $highlightItem.Fields["Description"].Value = $highlight.Description 
            $highlightItem.Fields["__Sortorder"].Value = $number * 100
            $highlightItem.Editing.EndEdit() > $null
            $ids += $highlightItem.Id
            $number++
        }
        
        return $ids
    }
    
    function Update-Hightlights($item, $hightlightsData, $highlightsTitle) {
        $pageComponents = $item.Children | Where-Object { $_.TemplateId -eq $pageComponentsTemplateId } | Select-Object -First 1
        if ($pageComponents -eq $null) {
            $pageComponents = New-Item -Path "$($item.Paths.FullPath)/Page Components" -ItemType $pageComponentsTemplateId
        }
        
        $hightlightsFolder = $pageComponents.Children | Where-Object { $_.TemplateId -eq $hightlightsFolderTemplateId } | Select-Object -First 1
        
        if ($hightlightsFolder -eq $null) {
            $hightlightsFolder = New-Item -Path "$($pageComponents.Paths.FullPath)/Highlights" -ItemType $hightlightsFolderTemplateId
        }
        if([string]::IsNullOrWhiteSpace($highlightsTitle) -eq $false){
            $hightlightsFolder.Editing.BeginEdit()
            $hightlightsFolder.Fields["Header"].Value = $highlightsTitle
            $hightlightsFolder.Editing.EndEdit() > $null
        }
    
        foreach ($data in $hightlightsData) {
            $notEmptyHighlights = $data.Highlights | Where-Object { [string]::IsNullOrWhiteSpace($_.Description) -eq $false}
            if ([string]::IsNullOrWhiteSpace($data.TabName) -eq $false -AND $notEmptyHighlights.Count -gt 0) {
                $highlightTabPath = "$($hightlightsFolder.Paths.FullPath)/$($data.TabName)"
                $highlightTabItem = Get-item -Path $highlightTabPath -ErrorAction SilentlyContinue
                if ($highlightTabItem -eq $null) {
                    $highlightTabItem = New-Item -Path $highlightTabPath -ItemType $hightlightTabTemplateId
                }
                
                $highlights = $data.Highlights | Where-Object { [string]::IsNullOrWhiteSpace($_.Description) -eq $false }
                $ids = Create-Highlights -ParentPath $highlightTabPath -Data $highlights
                if ($ids -ne $null -and $ids.Count -gt 0) {
                    $highlightTabItem.Editing.BeginEdit()
                    $highlightTabItem.Fields["Title"].Value = $data.TabName
                    $highlightTabItem.Fields["Highlights"].Value = [string]::Join("|", $ids)
                    $highlightTabItem.Editing.EndEdit() > $null
                    
                }
            }
            else {
                $highlights = $data.Highlights | Where-Object { [string]::IsNullOrWhiteSpace($_.Title) -eq $false -and [string]::IsNullOrWhiteSpace($_.Description) -eq $false }
                $ids = Create-Highlights -ParentPath "$($pageComponents.Paths.FullPath)/Highlights" $highlights 
            }
        }
        
        $renderingItem = Get-Item -Path $hightlightRenderingId
        $rendering = Get-Rendering -Item $item  -Rendering $renderingItem
        Set-Rendering -Item $item -Instance $rendering -DataSource $hightlightsFolder.Id
    }
    
    function Find-Destination-By-Code($code, $templateId) {
        $criteria = @(
            @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
            @{ Filter = "Equals"; Field = "_language"; Value = "en"; }
            @{ Filter = "Equals"; Field = "_template"; Value = $templateId; }
            @{ Filter = "Equals"; Field = "code"; Value = $code }
        )
    
        $props = @{
            Index    = "sitecore_destinations_master_index"
            Criteria = $criteria
        }
    
        $item = Find-Item @props | Select-Object -First 1
        if ($item -ne $null) {
            return $item.GetItem()
        }
        
        return $null
    }
    function Get-Pairs($data, $firstName, $secondName) {
        $result = @()
        $number = 1
    
        while (($obj = $data."$($firstName)$($number)") -ne $null) {
            $result += [pscustomobject]@{
                "$firstName"  = $data."$($firstName)$($number)".Replace("/", " - ").Replace("\", " - ");
                "$secondName" = $data."$($secondName)$($number)";
            }
            $number++
        }
        return $result
    }
    function Get-Highlights-By-Paragraph($text){
        $highlights = @()
        if([string]::IsNullOrWhiteSpace($text) -eq $false){
            foreach($paragraph in $text.Trim([System.Environment]::NewLine).Split([System.Environment]::NewLine) | Where-Object { ![string]::IsNullOrWhiteSpace($_) }){
                $highlights += [pscustomobject]@{
                                    Description = $paragraph
                                    }
            }
        }
        return $highlights
    }
    
    function Process-File($fileData) {
        $fileType = $fileData.FileType
        foreach ($row in $fileData.Data) {
            if ($fileType -like "country") {
                $item = Find-Destination-By-Code -Code $row.Code -TemplateId $countryTemplateId
                if ($item -ne $null) {
                    $faqData = Get-Pairs -Data $row -FirstName "Question" -SecondName "Answer"
                    Update-Questions-And-Answers -Item $item -FaqData $faqData
                    $highlightsData = @(
                        [pscustomobject]@{
                            TabName    = "Places To Visit";
                            Highlights = Get-Highlights-By-Paragraph -text $row.PlacesToVisit
                        },
                        [pscustomobject]@{
                            TabName    = "Shopping";
                            Highlights = Get-Highlights-By-Paragraph -text $row.Shopping
                        }
                    )
                    Update-Hightlights -Item $item -HightlightsData $highlightsData
                }
            }
            elseif ($fileType -like "region") {
                $item = Find-Destination-By-Code -Code $row.Code -TemplateId $regionTemplateId
                if ($item -ne $null) {
                    $faqData = Get-Pairs -Data $row -FirstName "Question" -SecondName "Answer"
                    Update-Questions-And-Answers -Item $item -FaqData $faqData
                    $highlightsData = @(
                        [pscustomobject]@{
                            TabName    = "Places To Visit";
                            Highlights = Get-Highlights-By-Paragraph -text $row.PlacesToVisit
                        },
                        [pscustomobject]@{
                            TabName    = "Shopping";
                            Highlights = Get-Highlights-By-Paragraph -text $row.Shopping
                        },
                        [pscustomobject]@{
                            TabName    = "Food & Drink";
                            Highlights = Get-Highlights-By-Paragraph -text $row.FoodAndDrink
                        },
                        [pscustomobject]@{
                            TabName    = "Things To Do";
                            Highlights = Get-Highlights-By-Paragraph -text $row.ThingsToDo
                        },
                        [pscustomobject]@{
                            TabName    = "Nightlife";
                            Highlights = Get-Highlights-By-Paragraph -text $row.Nightlife
                        }
                    )
                    Update-Hightlights -Item $item -HightlightsData $highlightsData
                }
            }
            elseif ($fileType -like "resort") {
                $item = Find-Destination-By-Code -Code $row.Code -TemplateId $resortTemplateId
                if ($item -ne $null) {
                    $faqData = Get-Pairs -Data $row -FirstName "Question" -SecondName "Answer"
                    Update-Questions-And-Answers -Item $item -FaqData $faqData
                    $highlightsData = @(
                        [pscustomobject]@{
                            Highlights = Get-Pairs -Data $row -FirstName "Title" -SecondName "Description";
                        }
                    )
                    Update-Hightlights -Item $item -HightlightsData $highlightsData -HighlightsTitle $row.Title
                }
            }
        }
    }
    
    function Precess-Files($fiels) {
        foreach ($file in $files) {
            $fileData = Get-File -FilePath $file
            Process-File -File $fileData
        }
    }
    
    Precess-Files -Fiels $files
