Path: "/sitecore/system/Modules/PowerShell/Script Library/Helpers/WP-739 Run HBG Images To S3 Sync"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $startItemPath = "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $reportFolderPath = "master:/sitecore/media library/Files/easyJet Hotel Report Export/HBG Images To S3 Sync Reports"
    $reportFolderName = "HBG Images To S3 Sync Reports"
    $reportFolderParentPath = "master:/sitecore/media library/Files/easyJet Hotel Report Export"
    $mediaFolderTemplateId = "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
    
    try {
        Write-Host "--- HBG Images To S3 Sync ---"
        Write-Host "Start item path: $startItemPath"
        
        $reportFolderItem = Get-Item -Path $reportFolderPath -ErrorAction SilentlyContinue
        if (-not $reportFolderItem) {
            Write-Host "Report folder not found, creating: $reportFolderPath"
            $reportFolderItem = New-Item -Path $reportFolderParentPath -Name $reportFolderName -ItemType $mediaFolderTemplateId -ErrorAction Stop
        }
        Write-Host "Report folder: $($reportFolderItem.Paths.FullPath)"
    
        $startItem = Get-Item -Path $startItemPath -ErrorAction Stop
        if (-not $startItem) {
            throw "Start item not found: $startItemPath"
        }
        Write-Host "Start item resolved: $($startItem.Paths.FullPath) (ID: $($startItem.ID))"
    
        $args = New-Object easyJet.Foundation.Destinations.Pipelines.Arguments.DestinationPipelineArgs
        $args.Parent = $startItem
        $args.LastUpdateTime = [System.DateTime]::UtcNow
        
        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
        Write-Host "Running HotelBedsHbgImagesToS3SyncPipeline..."
        [Sitecore.Pipelines.CorePipeline]::Run("HotelBedsHbgImagesToS3SyncPipeline", $args)
        $stopwatch.Stop()
    
        $elapsed = $stopwatch.Elapsed
        Write-Host "HotelBedsHbgImagesToS3SyncPipeline completed in $($elapsed.Hours)h $($elapsed.Minutes)m $($elapsed.Seconds)s."
        
        if ($args.Aborted) {
            Write-Warning "Pipeline was aborted. Check Sitecore logs for details."
        }
    }
    catch {
        Write-Error "FAILED: $($_.Exception.Message)"
        Write-Error $_.ScriptStackTrace
    }
