Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SELF-391_FIllup-Unavailable-product-popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item -path "/sitecore/content/EasyJet/Holidays/Data/Product Unavailable Popup" -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["Title"] = "{title} is no longer available";
        $item["Description"] = "<p>We’re unable to offer this {title} to this holiday. </p>";
        $item["CTA"] = "Back to {title}";
        $item["Icon"] = '<image mediaid="{A484212A-377A-4DC9-8754-BABFE7701E3D}" />';
        
        Write-Host "Item" "Finished";
        $item.Editing.EndEdit() | Out-Null
    }
