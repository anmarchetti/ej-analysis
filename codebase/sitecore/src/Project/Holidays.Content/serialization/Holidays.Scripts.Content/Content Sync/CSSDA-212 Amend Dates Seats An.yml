- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    # Page
    $amendDatesSeatsAndBagsPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Seats And Bags"
    
    # Create Amend Dates Page
    $amendDatesSeatsAndBagsPage = Get-Or-Create-Item -Path $amendDatesSeatsAndBagsPagePath -Template "{6E83925E-BED1-4B7E-A78D-0E5837F2429E}"
    
    #Update Amend Dates Page details
    if ($amendDatesSeatsAndBagsPage -ne $null) {
    	$amendDatesSeatsAndBagsPage.Editing.BeginEdit();
    	$amendDatesSeatsAndBagsPage["Name"] = "Amend Dates Seats and Bags";
    	$amendDatesSeatsAndBagsPage["Title"] = "Seats And Bags";
    	$amendDatesSeatsAndBagsPage["Description"] = "Change your Seats And Bags";
    	$amendDatesSeatsAndBagsPage["Icon"] = "Office/32x32/office_chair.png";
    	$amendDatesSeatsAndBagsPage.Editing.EndEdit() | Out-Null;
    }
    
    #Create Page Components Folder
    $amendDatesPageComponentsPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Seats And Bags/Page Components";
    $amendDatesPageComponentsItem = Get-Or-Create-Item -Path $amendDatesPageComponentsPath -Template "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    #Create Amend Dates Seats And Bags component
    $amendDatesSeatsAndBagsComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Seats And Bags/Page Components/Seats And Bags";
    $amendDatesSeatsAndBagsComponentItem = Get-Or-Create-Item -Path $amendDatesSeatsAndBagsComponentPath -Template "{42400B6F-4523-424A-BFC9-165A145D6FA3}"
    
    #Update Amend Dates component
    if ($amendDatesSeatsAndBagsComponentItem -ne $null) {
    	$amendDatesSeatsAndBagsComponentItem.Editing.BeginEdit();
    	$amendDatesSeatsAndBagsComponentItem["Title"] = "Select your Seats & Bags";
    	$amendDatesSeatsAndBagsComponentItem["Subtitle"] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit.";
    	$amendDatesSeatsAndBagsComponentItem["Icon"] = "Office/32x32/office_chair.png";
    	$amendDatesSeatsAndBagsComponentItem.Editing.EndEdit() | Out-Null;
    }
    
    #Add layout controls to page
    $amendDatesSeatsAndBagsRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Dates/Amend Dates Seats And Bags";
    $amendDatesSeatsAndBagsRendering = Get-Item -Path $amendDatesSeatsAndBagsRenderingPath;
    
    if ($amendDatesSeatsAndBagsRendering -ne $null) {
    	Add-Or-Update-Page-Rendering -page $amendDatesSeatsAndBagsPage -renderingPath $amendDatesSeatsAndBagsRenderingPath -renderingPlaceholder "/body" -dataSourcePath "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Seats And Bags/Page Components/Seats And Bags"
    }
    
    $pageItem = Get-Item -Path $amendDatesSeatsAndBagsPagePath;
    $renderedAmendDatesSeatsAndBags = Get-Rendering -Item $pageItem -Render $amendDatesSeatsAndBagsRendering;
    
    $pageTemplateId = "{6E83925E-BED1-4B7E-A78D-0E5837F2429E}"
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Slim Footer" -pageTemplateId $pageTemplateId 
