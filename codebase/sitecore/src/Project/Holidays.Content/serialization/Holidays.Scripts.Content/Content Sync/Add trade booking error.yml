SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $component = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/Page Components/View Bookings" -ErrorAction SilentlyContinue
    
    function Get-Page-Href ($pagePath) {
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        
        if($page -ne $null) {
            return "~/link.aspx?_id=$($page.ID.ToShortID())&amp;_z=z"
        }
        
        return ""
    }
    
    if($component -ne $null) {
        $loginHref = Get-Page-Href -pagePath "/sitecore/content/EasyJet/Holidays/Home/Login"
        
        $component.Editing.BeginEdit()
        $component["TradeBookingAddingError"] = "You booked your holiday through a travel agent. We won't be able to add it to your account. You can see your holiday at any time by entering your booking reference and last name <a href='$($loginHref)'>here</a>."
        $component.Editing.EndEdit() | Out-Null
        
         Write-Host "Trade Booking Error added to" $component.Name
    }
