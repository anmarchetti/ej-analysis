- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Delete-Rendering($pagePath, $renderingId){
        $page = Get-Item -Path $pagePath
        $allRenderings = Get-Rendering -Item $page
        
        foreach($rendering in $allRenderings){
             if($rendering.ItemId -eq $renderingId){
                 Remove-Rendering -Item $page -Instance $rendering
                 Write-Host "ItemId: " $rendering.ItemId "successfully removed";
             }
         }
    }
    
    # delete all Luggage (cabin bags) renderings from all pages
    $bagsRenderingId = '{9FD91E19-714F-4313-9E52-FF77B4E9F030}'
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking' -renderingId $bagsRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation' -renderingId $bagsRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking' -renderingId $bagsRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Confirmation' -renderingId $bagsRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking' -renderingId $bagsRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/TradePortal/Home/Booking' -renderingId $bagsRenderingId
    
    # delete all Luggage (cabin bags) data sources from all Page Components folders
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Luggage/2 x Cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Luggage/2 x Small cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Small cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/View Booking/Page Components/Luggage/2 x Cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/View Booking/Page Components/Luggage/2 x Small cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/Confirmation/Page Components/Luggage/2 x Cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/Confirmation/Page Components/Luggage/2 x Small cabin bags' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Write-Host "Luggage (cabin bags) data sources successfully removed";
    
    # delete Luggage Folder data source rendering from Extras Page
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Page Components/Luggage' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/Page Components/Luggage' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Write-Host "Luggage Folder data sources successfully removed";
    
    # move seats renderings from lugagge
    function Get-Rendering-Index-On-Layout($item, $renderingId){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId){
                $incrementIndex = $index
                return $index
            }
        }
        
        return $index
    }
    
    function Get-Rendering-Custom($page, $renderingId){
        $rendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $renderingId}
        
        if($rendering.Count -gt 1){
            $rendering = $rendering[0]
        }
        
        return $rendering
    }
    
    $luggageRenderingId = '{A9AB43A5-41EA-40AD-AC79-0343E6AD5111}'
    $seatAndBagsRenderingId = '{7910DC7C-14B7-48F1-9256-C570F700F085}'
    $seatMapRenderingId = '{F7F45094-B88B-47D0-975F-3854B4AE9A41}'
    
    function Move-Seats-Renderings($path){
        $seatAndBagsPath = "$($path)/Data/Seat And Bags"
        $seatMapPath = "$($path)/Data/SeatsMap"
        $pagePath = "$($path)/Home/Booking"
        $parentItem = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        
        $lugaggeRendering = Get-Rendering-Custom -page $parentItem -renderingId $luggageRenderingId
        $seatAndBagsRendering = Get-Rendering-Custom -page $parentItem -renderingId $seatAndBagsRenderingId
        $seatMapRendering = Get-Rendering-Custom -page $parentItem -renderingId $seatMapRenderingId
     
        # we setup seats and bags component on Luggage Component Place
        $lugaggeRenderingPlaceholder = $lugaggeRendering.Placeholder
        $seatMapPlaceholder = "$($lugaggeRenderingPlaceholder)/seat-map-$($seatAndBagsRendering.UniqueId)-0"
        
        $luggageRenderingIndex = Get-Rendering-Index-On-Layout -item $parentItem -renderingId $luggageRenderingId
        if($luggageRenderingIndex.Count -gt 1){
            $luggageRenderingIndex = $luggageRenderingIndex[0]
        }
        
        Set-Rendering -Item $parentItem -Instance $seatAndBagsRendering -PlaceHolder $lugaggeRenderingPlaceholder -Index $luggageRenderingIndex
        Set-Rendering -Item $parentItem -Instance $seatMapRendering -PlaceHolder $seatMapPlaceholder -Index ($luggageRenderingIndex+1)
        
        if ($path -eq '/sitecore/content/EasyJet/TradePortal') {
            $cabinBagsRendering = Get-Rendering-Custom -page $parentItem -renderingId '{EDCABB4F-676C-4418-BBEE-4E0009F946E5}'
            $holdLuggageRendering = Get-Rendering-Custom -page $parentItem -renderingId '{89F16941-1EA9-4990-88BD-794D3B45292D}'
            Set-Rendering -Item $parentItem -Instance $cabinBagsRendering -PlaceHolder $lugaggeRenderingPlaceholder -Index ($luggageRenderingIndex+2)
            Set-Rendering -Item $parentItem -Instance $holdLuggageRendering -PlaceHolder $lugaggeRenderingPlaceholder -Index ($luggageRenderingIndex+3)
        }
        Remove-Rendering -Item $parentItem -Instance $lugaggeRendering
        Write-Host "Seats renderings on" $pagePath "successfully moved";
    }
    
    Move-Seats-Renderings -Path '/sitecore/content/EasyJet/Holidays'
    Move-Seats-Renderings -Path '/sitecore/content/EasyJet/TradePortal'
         
