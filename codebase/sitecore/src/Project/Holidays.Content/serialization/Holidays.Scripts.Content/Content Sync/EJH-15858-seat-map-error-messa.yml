    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}"
    $seatMap.Editing.BeginEdit()
    $seatMap["SeriesSeatFlights"] = "<p><strong>Looking to pick your seats or add more bags?</strong></p><p>Seats will be available for reservation after booking has been confirmed. Please check back then to book seats and upgrade your cabin bag allowance.</p>"
    $seatMap["BookingOutOfSync"] = "<p><strong>Looking to pick your seats or add more bags?</strong></p><p>Seats will be available for reservation after booking has been confirmed. Please check back then to book seats and upgrade your cabin bag allowance.</p>"
