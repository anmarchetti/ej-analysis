- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    $sustainabilityPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Sustainability";
    $pagePath = "$($sustainabilityPagePath)/Offset Carbon Emissions"
    $pageComponentsPath = "$($pagePath)/Page Components"
    $pageTemplateId = "{BD854CD0-B257-4376-A928-F8CC431ACC47}"
    
    # Add page and page components folder data source
    $page = Get-Or-Create-Item -Path $pagePath -TemplateId $pageTemplateId
    Get-Or-Create-Item -Path $pageComponentsPath -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Add content data source
    $banner = Get-Or-Create-Item -Path "$($pageComponentsPath)/Top Banner" -TemplateId "{37FD0BA3-1FF2-499F-8680-BA6A54F10AB4}"
    Get-Or-Create-Item -Path "$($pageComponentsPath)/Text Blocks" -TemplateId "{AB8D608B-3B9D-4ECB-9BA3-8C61306D7A41}"
    $content = Get-Or-Create-Item -Path "$($pageComponentsPath)/Text Blocks/Article" -TemplateId "{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}"
    
    if ($content -ne $null) {
        $content.Editing.BeginEdit()
        $content["Title"] = "easyJet holidays becomes the first major tour operator to offset carbon emissions from its package holidays";
        $content["Description"] = '<ul><li>From today easyJet holidays is&nbsp;the first major tour operator to&nbsp;offset the carbon emissions from its package holidays&nbsp;&mdash; comprising the fuel used for flights and in-destination transfers, as&nbsp;well as&nbsp;the energy used from hotel stays</li><li>Today&rsquo;s announcement means holiday packages are offset without any cost being passed on&nbsp;to&nbsp;its customers</li><li>The move comes in&nbsp;to&nbsp;force from today and has also been retrospectively applied to&nbsp;all holidays since the new operator launched in&nbsp;November 2019</li><li>It&nbsp;is&nbsp;the first step announced in&nbsp;the holiday operator&rsquo;s sustainability journey with more to&nbsp;be&nbsp;revealed soon on&nbsp;its strategy, long-term commitments and actions</li></ul><p>The news comes in&nbsp;the same week as&nbsp;international travel has restarted and means all future package holidays are carbon offset as&nbsp;well as&nbsp;the holiday company retrospectively offsetting the emissions for all holidays operated since it&nbsp;launched in&nbsp;November 2019.</p><p>easyJet holidays has announced its carbon offsetting news now ahead of&nbsp;plans to&nbsp;launch its full sustainability strategy very soon. This first step from the holiday operator builds on&nbsp;the airline, easyJet, which, in&nbsp;November 2019, became the first major airline to&nbsp;offset the carbon emissions from the fuel used on&nbsp;all its flights. At&nbsp;the same time, easyJet focuses on&nbsp;minimising carbon emissions in&nbsp;its current operations through flying a&nbsp;modern fleet of&nbsp;fuel efficient aircraft and by&nbsp;operating them as&nbsp;efficiently as&nbsp;possible. Since 2000, the airline has cut its carbon emissions per passenger, per kilometre by&nbsp;a&nbsp;third. While easyJet believes that offsetting is&nbsp;the best way to&nbsp;address its carbon emissions right now, it&nbsp;is&nbsp;only an&nbsp;interim measure until radical new technologies are available and easyJet is&nbsp;actively involved in&nbsp;the development of&nbsp;all-electric, hybrid and hydrogen propulsion to&nbsp;achieve zero-emission flying in&nbsp;the future. The airline is&nbsp;committed to&nbsp;transitioning as&nbsp;soon as&nbsp;these technologies are available and viable. easyJet, has also committed to&nbsp;action beyond carbon, such as&nbsp;to&nbsp;rapidly reduce waste and single-use plastic usage on&nbsp;board and within its supply chain.</p><p>easyJet, and now easyJet holidays, undertakes carbon offsetting through schemes accredited by&nbsp;two of&nbsp;the highest verification standards, Gold Standard and VCS. They will include forestry, renewable and community-based projects.</p><p>Garry Wilson, easyJet holidays CEO, said; &laquo;I&rsquo;m personally very passionate about sustainability and it&rsquo;s an&nbsp;area I&rsquo;ve been involved&nbsp;in, and committed&nbsp;to, throughout my&nbsp;time in&nbsp;the travel industry. While it&rsquo;s a&nbsp;difficult challenge to&nbsp;tackle within travel, it&rsquo;s something that&rsquo;s really important to&nbsp;us at&nbsp;easyJet and easyJet holidays and we&rsquo;ve got to&nbsp;do&nbsp;all we&nbsp;can. We&rsquo;ve spent a&nbsp;lot of&nbsp;time when we&rsquo;ve not had customers travelling working on&nbsp;our sustainability plans. We&nbsp;believe there&rsquo;s a&nbsp;real opportunity to&nbsp;play our part to&nbsp;re-open tourism sustainably. easyJet and easyJet holidays are famous for making travel affordable and accessible to&nbsp;so&nbsp;many people, so&nbsp;I&rsquo;m really proud that from today we&nbsp;become the first major tour operator to&nbsp;offset the carbon emissions from our holidays&nbsp;&mdash; so&nbsp;the fuel used on&nbsp;our flights and transfers and the energy used in&nbsp;hotel stays&nbsp;&mdash; and being able to&nbsp;do&nbsp;this without passing on&nbsp;any cost to&nbsp;the customer. People have a&nbsp;choice in&nbsp;how they travel and if&nbsp;people choose to&nbsp;go&nbsp;on&nbsp;holiday abroad, we&nbsp;want to&nbsp;be&nbsp;the best choice they can make. Our news today on&nbsp;carbon offsetting for holidays is&nbsp;just the first step. We&nbsp;look forward to&nbsp;sharing what else we&rsquo;re committing to&nbsp;with our full sustainability strategy and our longer-term actions very soon.&raquo;</p><p>easyJet holidays is&nbsp;also committed to&nbsp;upholding labour standards, promoting health, safety and wellbeing, and respecting equal pay rights by&nbsp;working with its partners to&nbsp;ensure high standards are maintained across the supply chain. The holiday firm also encourages all its direct hotel partners to&nbsp;actively work towards certification that meets the Global Sustainable Tourism Council standards.</p><h3>Notes to&nbsp;editors:</h3><p>For more information, interview requests or&nbsp;imagery, please contact the team on&nbsp;<a href="mailto:Holidays.pressoffice@easyjet.com?subject=information%20request">Holidays.pressoffice@easyjet.com</a>&nbsp;/ <a href="tel:01582 525374">01582 525374</a></p><h3>About easyJet holidays:</h3><p>easyJet holidays offers great-value beach, city and lakes holidays to&nbsp;more than 100 destinations across Europe, directly through their website and through over 3000 travel agent partners. The ATOL-protected holidays company combines easyJet&rsquo;s flexible flight programme, handpicked hotels and best-in-class technology to&nbsp;provide hassle-free personalised holiday experiences which can be&nbsp;secured with a&nbsp;deposit of&nbsp;just &pound;60 per person. The holidays operator is&nbsp;an&nbsp;ABTA member too, providing additional reassurance to&nbsp;customers under the UK&rsquo;s most trusted travel scheme.</p><p>With a&nbsp;range of&nbsp;holiday types, from adult and family to&nbsp;luxury and undiscovered, transfers included on&nbsp;beach holidays, 23kg hold luggage included as&nbsp;standard on&nbsp;all bookings, and over 5,000&nbsp;hotels, across over 500&nbsp;resorts, customers can holiday the way they want.</p><p>All easyJet holidays are covered by&nbsp;its Protection Promise, an&nbsp;industry leading policy giving customers ultimate flexibility, protection and reassurance and letting them book with total confidence. The Promise offers a&nbsp;refund guarantee, freedom to&nbsp;change a&nbsp;booking, a&nbsp;reduced balance due date, a&nbsp;Best Price Guarantee, deposit refunds, and Covid commitments to&nbsp;ensure flexibility if&nbsp;there are known restrictions at&nbsp;home or&nbsp;in&nbsp;destination.</p><h3>About our commitment to&nbsp;carbon offsetting:</h3><ul><li>WHAT IS&nbsp;CARBON OFFSETTING? &mdash;&nbsp;Carbon offsetting provides revenues to&nbsp;projects that reduce CO2 emissions to&nbsp;the atmosphere or&nbsp;take CO2 from the atmosphere. This means compensating for every tonne of&nbsp;CO2 emitted by&nbsp;ensuring there is&nbsp;one tonne less in&nbsp;the atmosphere&nbsp;&mdash; by&nbsp;reducing CO2 by&nbsp;preventing its release or&nbsp;physically removing it&nbsp;from the air (e.g., by&nbsp;planting more trees).</li><li>DOES IT&nbsp;WORK? &mdash;&nbsp;Offsetting works because one tonne of&nbsp;CO2 has the same climate impact wherever it&nbsp;is&nbsp;emitted. So&nbsp;a&nbsp;tonne of&nbsp;CO2 released by&nbsp;an&nbsp;easyJet aircraft can genuinely be&nbsp;&laquo;offset&raquo; by&nbsp;contributing to&nbsp;such projects.</li><li>CARBON OFFSETTING IN&nbsp;PRACTICE&nbsp;&mdash; easyJet: The majority of&nbsp;easyJet&rsquo;s carbon footprint is&nbsp;due to&nbsp;the use of&nbsp;aviation fuel to&nbsp;power flight. easyJet constantly measures exactly how much fuel is&nbsp;used for its flights, and thus how much CO2&nbsp;is produced, which is&nbsp;3.157 kilograms of&nbsp;CO2for every kilogram of&nbsp;aviation fuel used. Further, we&nbsp;use well known aviation standards and benchmarks to&nbsp;estimate the amount of&nbsp;other greenhouse gases we&nbsp;generate, and account for them on&nbsp;a&nbsp;CO2equivalent basis. We&nbsp;then offset this quantity of&nbsp;CO2by purchasing carbon credits which have a&nbsp;measured impact on&nbsp;carbon reduction.</li><li>CARBON OFFSETTING IN&nbsp;PRACTICE&nbsp;&mdash; easyJet holidays: We&nbsp;calculate the carbon offsetting emissions to&nbsp;cover:</li><li>the fuel used for flights (see above)</li><li>hotel stays (which is&nbsp;based on&nbsp;the number of&nbsp;guest nights stayed, the number of&nbsp;customers, and then calculated based on&nbsp;country specific CO2e/room/night emissions using published DEFRA carbon factors)</li><li>transfers (which are based on&nbsp;the number of&nbsp;customers, the type of&nbsp;transfer such as&nbsp;whether it&rsquo;s a&nbsp;shared bus or&nbsp;a&nbsp;private taxi, the distance from the airport to&nbsp;the region customers are staying, and calculated on&nbsp;CO2e/passenger/km emissions using published DEFRA carbon factors)</li></ul><h3>About the selection process for easyJet carbon offset programmes</h3><ul><li>easyJet has undertaken a&nbsp;rigorous process in&nbsp;selecting its carbon offset programmes.We have specified only programmes which meet either the Gold Standard or&nbsp;Verified Carbon Standard (VCS) certifications which are globally recognised and respected for their standards of&nbsp;offsetting.</li><li>These certification schemes audit the offset projects to&nbsp;ensure that the carbon reductions claimed by&nbsp;individual programmes would not have happened without that project, or&nbsp;that by&nbsp;reducing carbon emissions in&nbsp;one place they do&nbsp;not inadvertently increase them elsewhere.</li></ul><h3>Gold Standard and/or VCS certified projects adhere to&nbsp;the following criteria:</h3><ul><li>Additionality: refers to&nbsp;emission reductions that would not have occurred in&nbsp;the absence of&nbsp;the payments derived from the sale of&nbsp;carbon credits. Mitigation interventions or&nbsp;activities are additional where it&nbsp;can be&nbsp;demonstrated that reductions in&nbsp;emissions would not have happened in&nbsp;the absence of&nbsp;the activity.</li><li>Permanence: refers to&nbsp;emission reductions being &lsquo;permanent&rsquo; and representing a&nbsp;long-term mitigation benefit. Measures are in&nbsp;place to&nbsp;limit the risk of&nbsp;reversal of&nbsp;CO2 emission reductions to&nbsp;ensure their permanence, e.g.&nbsp;by&nbsp;forests being cut.</li><li>No&nbsp;leakage: the mitigation activity does not to&nbsp;lead to&nbsp;the increase of&nbsp;emissions outside the boundaries of&nbsp;the activity.</li><li>Measurability: GHG emissions by&nbsp;sources and removals by&nbsp;sinks are quantifiable using recognised conservative methods against a&nbsp;credible baseline.</li><li>Independent auditing: mitigation activities and their emission reductions are validated and verified by&nbsp;independent third-party auditing bodies. Activities and emission reductions are assessed against the applied methodologies (e.g. under the VCS or&nbsp;the Gold Standard).</li><li>No&nbsp;double counting: to&nbsp;ensure the environmental integrity of&nbsp;mitigation activities, emission reductions or&nbsp;units cannot be&nbsp;claimed or&nbsp;accounted more than one time.</li><li>No&nbsp;negative impact on&nbsp;local populations: mitigation activities being implemented do&nbsp;not lead to&nbsp;negative impact or&nbsp;harm to&nbsp;local communities.</li></ul><p>In&nbsp;many cases projects also contribute to&nbsp;the United Nations Sustainable Development Goals, including no&nbsp;poverty, good health and wellbeing, gender equality, clean water and sanitation, climate action, life on&nbsp;land.</p><p>We&nbsp;have partnered with Climate Focus, a&nbsp;pioneering international advisory company which has been supporting governments, organisations and companies on&nbsp;climate change policy and projects for 15&nbsp;years. Climate Focus has acted as&nbsp;our advisor on&nbsp;selecting projects and partners and has helped to&nbsp;develop our offset project portfolio. They are also advising&nbsp;us on&nbsp;our ongoing offset management process. Climate Focus has its headquarters in&nbsp;Amsterdam, the Netherlands and additional offices in&nbsp;Rotterdam, Berlin, Washington DC&nbsp;and Bogot&aacute;.</p><h3>About our carbon offset partners:</h3><p><b>EcoAct:</b> For over 15&nbsp;years, EcoAct has been a&nbsp;leading carbon offset project developer and retailer, and provider of&nbsp;carbon, energy and sustainability consultancy services to&nbsp;large complex private companies, public sector organisations and governments. EcoAct has over 500 global clients, including 24&nbsp;current FTSE100 clients and employs a&nbsp;team of&nbsp;more than 130 experts in&nbsp;France, UK, USA, Spain, Turkey and Kenya.</p><p><b>First Climate:</b> First Climate was founded in&nbsp;1999 to&nbsp;serve as&nbsp;a&nbsp;project developer for global carbon reduction projects. Over the years, First Climate evolved into a&nbsp;leading carbon offset provider, a&nbsp;carbon asset management company and a&nbsp;provider of&nbsp;green energy consulting&amp; procurement services. Today First Climate helps clients across Europe, Asia-Pacific and the Americas to&nbsp;develop and procure carbon reduction projects. First Climate employs 44&nbsp;experts in&nbsp;its offices in&nbsp;Germany, Austria, USA, India, Mexico and the&nbsp;UK.</p><h3>Examples of&nbsp;offsetting projects include;</h3><p><b>Forest conservation&nbsp;&mdash; South America and Africa</b><br /> Forests in&nbsp;South America and Africa are of&nbsp;invaluable importance, both as&nbsp;a&nbsp;habitat for flora and fauna, and as&nbsp;a&nbsp;carbon sink and a&nbsp;regulative for global CO2&nbsp;emissions. Poverty levels among communities in&nbsp;the region are high which has driven the exploitation of&nbsp;the forest for firewood and agricultural expansion. The consequences of&nbsp;this have been rapid deforestation and forest degradation. These projects help local users and government to&nbsp;manage the responsibility and benefits of&nbsp;the forest together to&nbsp;halt deforestation aiming to&nbsp;make standing trees valuable to&nbsp;local people by&nbsp;creating job opportunities and strengthening sustainable land-use practices which help protect the forest.</p><p><b>Renewable energy&nbsp;&mdash; Solar in&nbsp;India</b><br /> Fossil fuels constitute the primary source of&nbsp;energy in&nbsp;India and coal accounts for&nbsp;75% of&nbsp;the country&lsquo;s total energy consumption. The heavy reliance on&nbsp;fossil fuels results in&nbsp;the emission of&nbsp;carbon dioxide, methane and nitrogen into the atmosphere. This project helps to&nbsp;diversify the Indian energy mix, lessen the reliance on&nbsp;coal, and reduce the carbon intensity of&nbsp;the grid. The project is&nbsp;part of&nbsp;a&nbsp;large solar installation in&nbsp;Tamil Nadu and operates more than 820,000 solar panels. The project has an&nbsp;installed capacity of&nbsp;217&nbsp;MW, eliminating the need to&nbsp;produce power using fossil fuels for the project area and avoiding around 350&nbsp;kt of&nbsp;carbon dioxide equivalent annually.</p><p><b>Community based&nbsp;&mdash; DelAgua</b><br /> This latest project aims to&nbsp;tackle Rwanda&lsquo;s health and environmental problems by&nbsp;improving cooking technology and is&nbsp;currently the largest stove distribution project of&nbsp;its kind in&nbsp;the world. Currently, the majority of&nbsp;Rwandans rely on&nbsp;traditional wood fires for cooking, which are damaging to&nbsp;both health and the environment. Traditional fires are not only inefficient, they also produce toxic fumes and it&nbsp;is&nbsp;women and children in&nbsp;particular who suffer. The project distributes new, more efficient cookstoves to&nbsp;households which reduces wood consumption, saves time and money, cuts carbon emission and reduces deforestation. As&nbsp;the stoves produce less pollutants, cooking is&nbsp;much safer for families. DelAgua&rsquo;s project really improves everyday life for the people of&nbsp;Rwanda and helps to&nbsp;create a&nbsp;cleaner world for all.</p><h3>About our Carbon offset project management</h3><p>All carbon projects in&nbsp;our portfolio are verified by&nbsp;the international carbon standards such as&nbsp;Gold Standard, and VCS. Verification under such standards starts by&nbsp;validating the design of&nbsp;a&nbsp;project (forest protection initiative, solar farm, clean cooking programme etc) against their stringent criteria&nbsp;of, amongst others, additionality, permanence and baseline setting. Validation is&nbsp;carried out by&nbsp;an&nbsp;independent auditor.</p><p>Once the project is&nbsp;up&nbsp;and running, the emission reductions realised (renewable electricity produced, trees grown, deforestation slowed) are monitored by&nbsp;auditors on&nbsp;behalf of&nbsp;the standards, typically every year. This includes for instance reading electricity meters, comparing aerial pictures of&nbsp;forest areas and counting cook stoves; and consequently, calculating the tonnes of&nbsp;reduced emissions. These calculations are again checked by&nbsp;an&nbsp;independent auditor, after which the standard issues one carbon credit per tonne of&nbsp;CO2 emission reduced.</p>'
        $content.Editing.EndEdit() | Out-Null
        
        Write-Host "Added content: Page article"
    }
    
    if ($banner -ne $null) {
        $banner.Editing.BeginEdit()
        $banner["Image"] = "<image mediaid='{FBE7E939-66FB-47CC-9BEC-FB2508446535}' />";
        $banner.Editing.EndEdit() | Out-Null
        
        Write-Host "Added content: Banner"
    }
    
    # Add the data sources to existing renderings
    $sustainabilityPage = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    
    if ($banner -ne $null) {
    	Get-Rendering -Item $sustainabilityPage -UniqueId "{82D1AAD4-CC84-4B6A-A900-4EB107E86A5D}" | Set-Rendering -Item $sustainabilityPage -DataSource $banner.FullPath
    	Write-Host "Added data source: banner rendering"
    }
    
    if ($content -ne $null) {
    	Get-Rendering -Item $sustainabilityPage -UniqueId "{293684DA-4386-4892-B3C2-A84BE65779C3}" | Set-Rendering -Item $sustainabilityPage -DataSource $content.FullPath
    	Write-Host "Added data source: article rendering"
    }
    
    # Add a link to the page in the carousel card field
    $carouselCard = Get-Item -Path "$($sustainabilityPagePath)/Page Components/Our Work Carousel/Card 1" -ErrorAction SilentlyContinue
    
    if ($carouselCard -ne $null) {
        $carouselCard.Editing.BeginEdit()
        $carouselCard["Link"] = "<link text='More details' linktype='internal' id='$($page.ID)' />"
        $carouselCard.Editing.EndEdit() | Out-Null
        
        Write-Host "Added a page link to the carousel card"
    }
    
    # Add Page To Page Designs
    $pageDesigns = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Footer With Phone Number" -ErrorAction SilentlyContinue
    
    if($pageDesigns -ne $null){
        $pageDesigns.Editing.BeginEdit()
        $pageDesigns["PageTemplates"]="$($pageDesigns["PageTemplates"])|$($pageTemplateId)"
        $pageDesigns.Editing.EndEdit()
        
        Write-Host "New page was added to Full Header And Footer With Phone Number presentation design"
    }
