    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $templateId
        }
        
        return $item
    }
    
    function Create-Destinations-Component-Datasource($item, $data){
        if($data.PromoPage -ne $null){
            $promoPageItem = Get-Item -Path "$($data.PromoPage.Path)/$($data.PromoPage.OldName)" -ErrorAction SilentlyContinue
            if($promoPageItem -eq $null){
                $promoPageItem = Get-Item -Path "$($data.PromoPage.Path)/$($data.PromoPage.Name)" -ErrorAction SilentlyContinue
            }
            if($promoPageItem -ne $null){
                $promoPageItem.Editing.BeginEdit();
                $promoPageItem["__DisplayName"] = $data.PromoPage.OldName
                $promoPageItem.Name = $data.PromoPage.Name;
                $promoPageItem.Editing.EndEdit();
                $item.Editing.BeginEdit()> $null
                $item.Fields["DealPageLink"].Value = "<link text='$($data.PromoPage.ButtonText)' anchor='' linktype='internal' class='' title=''  querystring='' id='$($promoPageItem.ID)' />"
                $item.Editing.EndEdit() > $null
            }
        }
        
        $pageComponents =  $item.Children | Where-Object { $_.TemplateId -eq $pageComponentsTemplateId} | Select-Object -First 1
        $dealsDestinationsFolder = Get-Or-Create-Item -Path "$($pageComponents.Paths.fullpath)/Deals Destinations" -TemplateId $dealsDestinationsFolderTemplateId
        
        $dealsDestination = Get-Or-Create-Item -Path "$($pageComponents.Paths.fullpath)/Deals Destinations/$($data.Name)" -TemplateId $dealsDestinationsTemplateId
            
        Get-Rendering -Item $item | ForEach-Object {
            if($_.ItemId -eq $destinationsRenderingId) {
                Set-Rendering -Item $item -Instance $_ -Datasource $dealsDestination.Id
            }
        }
        
        $cardsIds = @()
        foreach($country in $data.Countries){
            $countryItem = Get-Item -Path $country.Path
            $dealsDestinationGroupCard = Get-Or-Create-Item -Path "$($pageComponents.Paths.fullpath)/Deals Destinations/$($data.Name)/$($country.Name)" -TemplateId $dealsDestinationsGroupCardTemplateId
            $cardsIds += $dealsDestinationGroupCard.ID
            
            $regionsIds = @()
            foreach($region in $country.Regions){
                $regionItem = Get-Item -Path $region.Path
                $dealsDestinationTitle = Get-Or-Create-Item -Path "$($pageComponents.Paths.fullpath)/Deals Destinations/$($data.Name)/$($country.Name)/$($region.Name)" -TemplateId $dealsDestinationTileTemplateId 
                $regionsIds += $dealsDestinationTitle.ID
                $dealsDestinationTitle.Editing.BeginEdit()
                $dealsDestinationTitle.Fields["Destination"].Value = $regionItem.ID
                $dealsDestinationTitle.Editing.EndEdit() > $null
            }
            
            $dealsDestinationGroupCard.Editing.BeginEdit()
            $dealsDestinationGroupCard.Fields["Country"].Value = $countryItem.ID
            $dealsDestinationGroupCard.Fields["Tiles"].Value = [string]::Join("|", $regionsIds)
            $dealsDestinationGroupCard.Editing.EndEdit() > $null
        }
        
        $dealsDestination.Editing.BeginEdit()
        $dealsDestination.Fields["Title"].Value = $data.Name
        $dealsDestination.Fields["Cards"].Value = [string]::Join("|", $cardsIds)
        $dealsDestination.Editing.EndEdit() > $null
    }
    
    function Update-Navigation-Item($item, $linkItemId, $childLinksIds){
        $item.Editing.BeginEdit()
        if ($linkItemId -ne $null){
            $item.Fields["Link"].Value = "<link text='$($item.Name)' anchor='' linktype='internal' class='' title=''  querystring='' id='$($linkItemId)' />"        
        }
        
        if($childLinksIds -ne $null){
            $item.Fields["ChildrenLinks"].Value = [string]::Join("|", $childLinksIds)
        }
        $item.Editing.EndEdit() > $null
    }
    
        $holidayTypesPages = @()
        foreach($holidayTypesPagePath in $paths){
            $holidayTypesPageItem = Get-Item -Path $holidayTypesPagePath -ErrorAction SilentlyContinue
            if ($holidayTypesPageItem -ne $null){
                $holidayTypesPages += $holidayTypesPageItem
            }
        }
        $holidayTypeGroupsNavigation = Get-Or-Create-Item -Path $holidayTypeGroupsNavigationPath -TemplateId $navigationLinksFolderTemplateId
        
        $holidayTypesNavigation = Get-Item -Path $holidayTypesNvavigationGroupPath -ErrorAction SilentlyContinue
        
        [Collections.Generic.List[string]]$navigationLinks = $holidayTypesNavigation.Fields["ChildrenLinks"].Value.Split("|") | Where-Object { ![string]::IsNullOrWhiteSpace($_) }
        foreach($holidayTypePage in $holidayTypesPages)
        {
            $data = $typesData[$holidayTypePage.Paths.FullPath]
            Create-Destinations-Component-Datasource -Item $holidayTypePage -Data $data
            $nvaigationLink = Get-Or-Create-Item -Path "$($holidayTypeGroupsNavigationPath)/$($holidayTypePage.Name)" -TemplateId $navigationLinkTemplateId
            Update-Navigation-Item -Item $nvaigationLink -LinkItemId $holidayTypePage.ID
            if(!$navigationLinks.Contains($nvaigationLink.ID)){
                if($data.IsInsert){
                    $navigationLinks.Insert($data.PostionInHeader, $nvaigationLink.ID)
                }
                else
                {
                    $navigationLinks[$data.PostionInHeader] = $nvaigationLink.ID
                }
            }
        }
        
        Update-Navigation-Item -Item $holidayTypesNavigation -ChildLinksIds $navigationLinks
        
        $holidaysNavigationLink = Get-Item -Path $holidaysNvavigationPath -ErrorAction SilentlyContinue
        $viewAllTypesNvaigationLink = Get-Or-Create-Item -Path "$($holidayTypeGroupsNavigationPath)/View All Holiday Types" -TemplateId $navigationLinkTemplateId
        
        Update-Navigation-Item -Item $viewAllTypesNvaigationLink -LinkItemId $holidayTypesHub.ID
        $childLinkIds = $holidaysNavigationLink.Fields["ChildrenLinks"].Value.Split("|") | Where-Object { ![string]::IsNullOrWhiteSpace($_) }
        if(!$childLinkIds.Contains($viewAllTypesNvaigationLink.ID))
        {
            $childLinkIds += $viewAllTypesNvaigationLink.ID
        }
        
        Update-Navigation-Item -Item $holidaysNavigationLink -ChildLinksIds $childLinkIds
