- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    
    $holidaysSeatAndBagsChildPath = "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags/Child"
    $tradePortalSeatAndBagsChildPath = "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags/Child"
        
    $holidaysSeatAndBagsChild = Get-Item -Path $holidaysSeatAndBagsChildPath
    $tradePortalSeatAndBagsChild = Get-Item -Path $tradePortalSeatAndBagsChildPath
        
    $translations = @{
        "en" = @{
            "TitleConstant" = "Child (aged {passengerAge})"
        }
        "fr-CH" = @{
             "TitleConstant" = "Enfant (vieillie {passengerAge})"
        }
        "fr-FR" = @{
            "TitleConstant" = "Enfant (vieillie {passengerAge})"
        }
        "de-CH" = @{
             "TitleConstant" = "Kind (im Alter von {passengerAge})"
        }
        "de-DE" = @{
             "TitleConstant" = "Kind (im Alter von {passengerAge})"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysSeatAndBagsChild -lang $lang -field "TitleConstant" -value $translations[$lang]["TitleConstant"]
        create-lang-version -item $tradePortalSeatAndBagsChild -lang $lang -field "TitleConstant" -value $translations[$lang]["TitleConstant"]
    }
