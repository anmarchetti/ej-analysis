- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendBookingSettingsPath = 'master:/sitecore/content/EasyJet/Holidays/Settings/Amend Booking Settings'
    
    $deCHSettings = Get-Item -Path $amendBookingSettingsPath -Language 'de-CH'
    if($deCHSettings -eq $null){
        Get-Item -Path $amendBookingSettingsPath | Add-ItemLanguage -TargetLanguage 'de-CH' -IfExist Skip
        $deCHSettings = Get-Item -Path $amendBookingSettingsPath -Language 'de-CH'
    }
    
    $deCHSettings.Editing.BeginEdit()
    $deCHSettings["IsAmendFlightsEnabled"] = "0"
    $deCHSettings["IsDepartureAirportContentEnabled"] = "0"
    $deCHSettings["IsAmendTransfersEnabled"] = "0"
    $deCHSettings["IsAmendPriceEnabledOnViewBookingPage"] = "0"
    $deCHSettings["IsAmendPriceEnabledOnChangeTransferPage"] = "0"
    $deCHSettings["IsAmendSpecialRequestEnabled"] = "0"
    $deCHSettings["IsEligibleToAmendSSRForDC"] = "0"
    $deCHSettings["IsEligibleToAmendSSRForHBG"] = "0"
    $deCHSettings["IsAmendPassengerNameEnable"] = "0"
    $deCHSettings["IsAmendPassengerChangeCountEnabled"] = "0"
    $deCHSettings.Editing.EndEdit()
    
    $frCHSettings = Get-Item -Path $amendBookingSettingsPath -Language 'fr-CH'
    if($frCHSettings -eq $null){
        Get-Item -Path $amendBookingSettingsPath | Add-ItemLanguage -TargetLanguage 'fr-CH' -IfExist Skip
        $frCHSettings = Get-Item -Path $amendBookingSettingsPath -Language 'fr-CH'
    }
    
    $frCHSettings.Editing.BeginEdit()
    $frCHSettings["IsAmendFlightsEnabled"] = "0"
    $frCHSettings["IsDepartureAirportContentEnabled"] = "0"
    $frCHSettings["IsAmendTransfersEnabled"] = "0"
    $frCHSettings["IsAmendPriceEnabledOnViewBookingPage"] = "0"
    $frCHSettings["IsAmendPriceEnabledOnChangeTransferPage"] = "0"
    $frCHSettings["IsAmendSpecialRequestEnabled"] = "0"
    $frCHSettings["IsEligibleToAmendSSRForDC"] = "0"
    $frCHSettings["IsEligibleToAmendSSRForHBG"] = "0"
    $frCHSettings["IsAmendPassengerNameEnable"] = "0"
    $frCHSettings["IsAmendPassengerChangeCountEnabled"] = "0"
    $frCHSettings.Editing.EndEdit()
