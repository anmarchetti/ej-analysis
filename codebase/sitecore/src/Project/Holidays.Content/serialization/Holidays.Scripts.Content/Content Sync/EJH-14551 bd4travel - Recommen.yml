    #Create Recommender Data Source
    function Create-Recommender-Data($recommenderPath, $themeTypeCodePaths) {
        $recomData = Get-Or-Create-Item -Path $recommenderPath -Template "{439330F2-BA2B-4D2D-9198-188D525F5877}";
        if ($recomData -ne $null) {
            $recomData.Editing.BeginEdit()
            $recomData["Title"] = "HOLIDAYS WE THINK YOU’D MIGHT LIKE";
            $codes = @();
            for($i = 0; $i -lt $themeTypeCodePaths.length; $i++){
                $themeTypeCode = Get-Item -Path $themeTypeCodePaths[$i] -ErrorAction SilentlyContinue;
                $codes += $themeTypeCode.ID
            }
            $codesStr = $codes -join "|"
            if ($codesStr -ne $null) {
                $recomData["HolidayThemeTypes"] = $codesStr;
            }
            $recomData.Editing.EndEdit() | Out-Null
        }
        
        return $recomData;
    }
    
