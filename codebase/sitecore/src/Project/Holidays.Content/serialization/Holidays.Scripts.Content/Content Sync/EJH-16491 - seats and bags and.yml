  Hint: Script
  Value: |
    $seatsMapWrapper = '/body/component-wrapper-inner-{454bceff-430f-49dc-9088-9ff2d3dccb85}-0/seats-and-bags-{13726815-39D8-4371-9811-69337E3148D1}-0/seat-map-{D0911D00-9C70-4866-BD8B-FF1C7F1F7B9B}-0'
    $seatsAndBagsWrapper = '/body/component-wrapper-inner-{454bceff-430f-49dc-9088-9ff2d3dccb85}-0/seats-and-bags-{13726815-39D8-4371-9811-69337E3148D1}-0'
    $booking = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking"
    
    $seatsMapId = '{F7F45094-B88B-47D0-975F-3854B4AE9A41}'
    $seatsAndBagsId = '{7910DC7C-14B7-48F1-9256-C570F700F085}'
    
    function Update-Placeholder ($renderingId, $placeholder) {
        $rendering = Get-Rendering -Item $booking | Where-Object {$_.ItemId -eq $renderingId}
        if($rendering -ne $null){
            $rendering.Placeholder = $placeholder
            Set-Rendering -Item $booking -Instance $rendering
            Write-Host "Placeholder updated"
        }
    }
    
    Update-Placeholder -renderingId $seatsMapId -placeholder $seatsMapWrapper
    Update-Placeholder -renderingId $seatsAndBagsId -placeholder $seatsAndBagsWrapper
    
