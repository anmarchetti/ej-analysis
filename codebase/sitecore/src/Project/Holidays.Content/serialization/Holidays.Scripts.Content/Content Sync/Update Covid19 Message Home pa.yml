- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $path = "/sitecore/content/EasyJet/Holidays/Home/Page Components/Html Block/Coronavirus message - homepage"
    
    $datasourceHtml = @"
    <style>
        .page-alert__container {
        background: rgb(248, 248, 248);
        }
        .page-alert {
        max-width: 1230px;
        margin: 0 auto;
        box-shadow: none;
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .page-alert .error-message__container  .error-message__description {
        font-size: 13px;
        margin-top: 4px;
        }
        .page-alert a {
        font-family: "easyjet_rounded_book",Arial,Helvetica,sans-serif;
        font-weight: 600;
        }
        .page-alert.error-message--with-desc{
        background: rgb(248, 248, 248);
        padding: 0px 0px 6px 0;
        box-shadow: none;
        }
        @media (max-width: 575.98px){
        .page-alert.error-message--with-desc {
        padding: 5px 0 5px 0;
        }
        }
        .error-message__icon{
            margin-top: 4px;
        }
    </style>
    <div class="page-alert__container ">
    <div class="page-alert error-message error-message--blue error-message--with-desc">
    <em class="error-message__icon">
    <svg viewbox="1 1 22 22" width="24" height="24">
    <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 4a1 1 0 11-1 1 1 1 0 011-1zm1 7.26V17a1 1 0 11-2 0v-6.92a1 1 0 012 0z"></path>
    </svg>
    </em>
    <div class="error-message__container"><span class="error-message__description"><strong>Holiday with confidence:</strong>&nbsp;We&rsquo;re promising quarantine-free getaways and even more booking flexibility. Find out more on this and how we&rsquo;re keeping you safe on holiday&nbsp;<a href="https://www.easyjet.com/en/holidays/info/covid-19-response">here</a>.&nbsp;</span></div>
    </div>
    </div>
    "@
    
    
    $item = Get-Item -Path "$($path)" -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
    	$item.Editing.BeginEdit()
    	$item["html"] = $datasourceHtml
    	$item.Editing.EndEdit()
    }
    
    
    
