---
ID: "2e662b56-d1d7-4bcd-a54b-56b9a754adab"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/BOOK-503 change flight time options"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    # remove early morning and early evening
    @("/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters/Early Evening", "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters/Early Morning") | % {
        Remove-Item -Path $_ -Force
    }
    
    # create night and update others
    
    $updates = @(
            @{
                  Path         = "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters/Evening"
                  Fields       = @{
                      "Name" = @{
                          "en"    = "Evening (18:00-20:59)"
                          "fr-CH" = "Soirée (18:00-20:59)"
                          "fr-FR" = "Soirée (18:00-20:59)"
                          "de-CH" = "Abends (18:00-20:59)"
                          "de-DE" = "Abends (18:00-20:59)"
                      }
                      "StartTime" = @{
                          "en"    = "20210611T180000Z"
                      }
                      "EndTime" = @{
                          "en"    = "20210611T205900Z"
                      }
                      "AtcomCode" = @{
                          "en"    = "C"
                      }
                  }
              },
              @{
                  Path         = "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters/Night"
                  TemplatePath = "/sitecore/templates/Foundation/Destinations/Settings/Time Filter Option"
                  Fields       = @{
                      "Code" = @{
                          "en"    = "night"
                      }   
                      "Name" = @{
                          "en"    = "Night (21:00-05:59)"
                          "fr-CH" = "Nuit (21:00-05:59)"
                          "fr-FR" = "Nuit (21:00-05:59)"
                          "de-CH" = "Nacht (21:00-05:59)"
                          "de-DE" = "Nacht (21:00-05:59)"
                      }
                      "StartTime" = @{
                          "en"    = "20210611T210000Z"
                      }
                      "EndTime" = @{
                          "en"    = "20210611T055900Z"
                      }
                      "AtcomCode" = @{
                          "en"    = "D"
                      }
                  }
              }
    )
          
    ImportContent -itemsToCreate $updates
    
    # update filters with new options
    
    $optionIds = ""
    gci -path "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters" | % { $optionIds += $_.Id.ToString() + "|" } 
    $optionIds = $optionIds -replace ".$"
    
    $updates = @(
            @{
                  Path         = "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Flights Filters/Outbound Departure Time"
                  Fields       = @{
                      "Time" = @{
                          "en"    = $optionIds
                          "fr-CH" = $optionIds
                          "fr-FR" = $optionIds
                          "de-CH" = $optionIds
                          "de-DE" = $optionIds
                      }
                  }
              },
              @{
                  Path         = "/sitecore/content/EasyJet/Holidays/Data/Search Filters/Flights Filters/Inbound Departure Time"
                  Fields       = @{
                      "Time" = @{
                          "en"    = $optionIds
                          "fr-CH" = $optionIds
                          "fr-FR" = $optionIds
                          "de-CH" = $optionIds
                          "de-DE" = $optionIds
                      }
                  }
              }
    )
    
    ImportContent -itemsToCreate $updates
