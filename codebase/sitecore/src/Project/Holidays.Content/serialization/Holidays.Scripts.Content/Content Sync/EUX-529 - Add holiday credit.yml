---
ID: "f78cae29-8e7e-4353-ba5c-577686a320cb"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-529 - Add holiday credit"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $holidayCreditItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Holiday Credit/Page Components/Holiday Credit" -ErrorAction SilentlyContinue;
    if ($holidayCreditItem -ne $null) {
    	Write-Host "already exisit";
        return;
    }
    
    $holidayCreditTemplate = Get-Item -Path "/sitecore/templates/Feature/PageContent/Holiday Credit"
    $marketCreditTemplate = Get-Item -Path "/sitecore/templates/Feature/PageContent/Market Credit"
    $switzerlandMarketItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/Switzerland"
    $ukMarketItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom"
    
    $holidayPageComponentsItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Holiday Credit/Page Components" -ErrorAction SilentlyContinue;
    if ($holidayPageComponentsItem  -ne $null) {
        $holidayCreditItem = New-Item -Path $holidayPageComponentsItem.Paths.Path -Name "Holiday Credit" -ItemType $holidayCreditTemplate.ID
        $marketCreditUKItem = New-Item -Path $holidayCreditItem.Paths.Path -Name "UK" -ItemType $marketCreditTemplate.ID
        $marketCreditSwitzerlandItem = New-Item -Path $holidayCreditItem.Paths.Path -Name "Switzerland" -ItemType $marketCreditTemplate.ID
    
        $holidayCreditItem.Editing.BeginEdit();
    	$holidayCreditItem["MarketCredits"] = $marketCreditUKItem.ID.ToString() + "|" + $marketCreditSwitzerlandItem.ID.ToString();
    	$holidayCreditItem.Editing.EndEdit() | Out-Null;
    
        if ($ukMarketItem -ne $null) {
              $marketCreditUKItem.Editing.BeginEdit();
    	      $marketCreditUKItem["Market"] = $ukMarketItem.ID.ToString();
    	      $marketCreditUKItem.Editing.EndEdit() | Out-Null;
        }
    
        if ($switzerlandMarketItem -ne $null) {
              $marketCreditSwitzerlandItem.Editing.BeginEdit();
    	      $marketCreditSwitzerlandItem["Market"] = $switzerlandMarketItem.ID.ToString();
    	      $marketCreditSwitzerlandItem.Editing.EndEdit() | Out-Null;
        }
        
        $holidayCreditPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Holiday Credit"
        $newDatasourceId = $holidayCreditItem.ID.ToString()
        
        $holidayCreditRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/PageContent/Holiday Credit"
        
        $deviceItem = Get-LayoutDevice "Default"
        
        $renderingInstance = Get-Rendering -Item $holidayCreditPageItem -Rendering $holidayCreditRenderingItem -Device $deviceItem
        
        if ($renderingInstance)
        {
            $renderingInstance.Datasource = $newDatasourceId
            Set-Rendering -Item $holidayCreditPageItem -Instance $renderingInstance
        }
            
    	Write-Host $holidayCreditItem.Paths.Path " successfully created";
    }
