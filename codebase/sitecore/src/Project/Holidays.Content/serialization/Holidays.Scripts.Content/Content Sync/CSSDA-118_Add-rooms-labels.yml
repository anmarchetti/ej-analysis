  Hint: Script
  Value: |
    $amendDatesSummaryComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Amend Dates Summary Page";
    $amendDatesSummaryComponentItem =  Get-Item -Path $amendDatesSummaryComponentPath -ErrorAction SilentlyContinue;
    
    #Update Amend DatesSummary title
    if ($amendDatesSummaryComponentItem -ne $null) {
        $amendDatesSummaryComponentItem.Editing.BeginEdit();
    
        $amendDatesSummaryComponentItem["RoomSingleLabel"]="{rooms} room";
        $amendDatesSummaryComponentItem["RoomPluralLabel"]="{rooms} rooms";
        
        $amendDatesSummaryComponentItem.Editing.EndEdit() | Out-Null;
        Write-Host $amendDatesSummaryComponentItem.Name "Updated"
    }
