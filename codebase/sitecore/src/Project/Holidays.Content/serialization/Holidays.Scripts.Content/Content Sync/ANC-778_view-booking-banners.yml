    $tradeViewBookingPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking/Page Components/View Booking"
    $holidayViewBookingPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/View Booking"
    
    function setFields ($itemPath, $language, $contentDisabledHeader, $contentDisabledDescription, $contentDisabledCTA, $contentInternalHeader, $contentInternalDescription   ) {
        
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
        
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item['LuggageDisabledHeader'] = $contentDisabledHeader
            $item['LuggageDisabledDescription'] = $contentDisabledDescription
            $item['LuggageDisabledCTA'] = $contentDisabledCTA
            $item['LuggageInternalHeader'] = $contentInternalHeader
            $item['LuggageInternalDescription'] = $contentInternalDescription
    
        $item.Editing.EndEdit() | Out-Null
        $item
      }
    } 
    
    
