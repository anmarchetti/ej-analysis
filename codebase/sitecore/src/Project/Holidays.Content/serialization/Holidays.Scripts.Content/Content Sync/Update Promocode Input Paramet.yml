Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Promocode Input Parameters
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking"
    
    $item = Get-Item -Path $itemPath;
    $rendering = Get-Item -Path  "/sitecore/layout/Renderings/Feature/Destinations/Promocode Input";
    
    $promocodeRendering = Get-Rendering -Item $item -Rendering $rendering ;
    
    if ($promocodeRendering) {
        Set-Rendering -Item $item  -Instance $promocodeRendering -Parameter @{ 
                "IsOpenedByDefault" = "1" 
            }
        
        Write-Host "Item" $item.Name "successfully created"
    }
    
