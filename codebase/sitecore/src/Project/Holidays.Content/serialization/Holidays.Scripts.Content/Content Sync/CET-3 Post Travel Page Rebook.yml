- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $fieldValuePairs) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($fieldValuePairs -ne $null) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            foreach ($pair in $fieldValuePairs.GetEnumerator()) {
                $targetLangItem[$pair.Key] = $pair.Value
            }
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $bookingHotelSummary = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Hotel Summary"
    
    $bookingHotelSummaryDE = @{
        "ButtonRebookLabel" = "Umbuchen"
    }
    
    $bookingHotelSummaryFR = @{
        "ButtonRebookLabel" = "Réserver à nouveau"
    }
    
    @('de-CH', 'de-DE') | % {
        Create-Lang-Version -Item $bookingHotelSummary -Lang $_ -FieldValuePairs $bookingHotelSummaryDE
         Write-Host "Added 'de-CH' and 'de-DE' rebook cta to view booking"
    }
    @('fr-CH', 'fr-FR') | % {
        Create-Lang-Version -Item $bookingHotelSummary -Lang $_ -FieldValuePairs $bookingHotelSummaryFR
         Write-Host "Added 'fr-CH' and 'fr-FR' rebook cta to view booking"
    }
    
