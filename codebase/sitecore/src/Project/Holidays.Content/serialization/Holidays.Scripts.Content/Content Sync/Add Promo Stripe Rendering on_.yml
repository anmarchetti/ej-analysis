Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Add Promo Stripe Rendering on Search Results
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    function Get-Rendering-Index ($item, $renderingItemId) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemID -eq $renderingItemId) {
    			return $i
    		}
    		$i++
    	}
    }
    
    $pageItem = Get-Item -Path "master:///sitecore/content/EasyJet/Holidays/Home/MixedResultList" -ErrorAction SilentlyContinue
    
    if($pageItem -ne $null) {
        $searchResultsRenderingId = "{76C32F3D-E1E3-4213-BD40-207B954EFF42}"
        $searchResultsRendering = Get-Rendering -Item $pageItem | Where-Object {$_.ItemId -eq $searchResultsRenderingId}
        $searchResultsRenderingIndex = Get-Rendering-Index -Item $pageItem -RenderingItemId $searchResultsRenderingId
        
        $promoBannerRenderingId = "{F57F9C56-DB96-41CB-83CD-AEFF06F47A11}"
        $promoBannerPlaceholder = $searchResultsRendering.Placeholder + '/promo-stripe-' + $searchResultsRendering.UniqueId + '-0'
        $promoBannerRenderingIndex = $searchResultsRenderingIndex + 1
        $promoBannerRendering = Get-Item -Path "master:" -ID $promoBannerRenderingId | New-Rendering
    
        # Insert Promo Banner Rendering after Search Results
        Add-Rendering -Item $pageItem -Instance $promoBannerRendering  -Placeholder $promoBannerPlaceholder -Index $promoBannerRenderingIndex
        Write-Host "Promo Banner Rendering is added"
    }
