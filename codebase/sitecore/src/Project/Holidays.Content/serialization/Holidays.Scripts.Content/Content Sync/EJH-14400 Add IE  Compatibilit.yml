---
ID: "02da3002-1d4d-476a-8c50-c871a3f9daaa"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14400 Add IE  Compatibility Banner to Headers"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    $htmlBlockTemplateId = "{C4A47ADF-2552-40E2-99F6-CA660419C835}"
    $bannerDatasourcePath = "/sitecore/content/EasyJet/Holidays/Data/HTML Blocks/IE Compatibility Banner"
    $bannerDatasource = Get-Or-Create-Item -Path $bannerDatasourcePath -templateId $htmlBlockTemplateId;
    $datasourceHtml = @"
    <style>
    .ie-compatibility-banner {
        background-color: #f5f7f8;
    }
    
    .ie-compatibility-banner__container {
        display: flex;
        align-items: center;
        padding: 47px 15px 40px;
    }
    
    .ie-compatibility-banner__icon {
        flex-shrink: 0;
        width: 82px;
        height: 82px;
    }
    
    .ie-compatibility-banner__content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-left: 20px;
    }
    
    .ie-compatibility-banner__title {
        margin: 0;
        font-family: "easyjet_rounded_demi", Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 600;
        line-height: 30px;
    }
    
    .ie-compatibility-banner__description {
        margin: 8px 0 0;
        font-family: "easyjet_rounded_book", Arial, Helvetica, sans-serif;
        font-size: 16px;
        line-height: 24px;
    }
    
    .ie-compatibility-banner__btn-container {
        margin-left: 20px;
    }
    
    a.ie-compatibility-banner__btn {
        display: inline-block;
        padding: 12px 52px;
        font-family: "easyjet_rounded_book", Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 20px;
        color: #fff;
        text-align: center;
        white-space: nowrap;
        background: #f60;
        border: 0;
        border-radius: 2px;
        cursor: pointer;
    }
    @media (max-width: 575.98px) {
        .ie-compatibility-banner__icon {
            width: 40px;
            height: 40px;
        }
    
        .ie-compatibility-banner__container {
            flex-direction: column;
            padding: 25px 10px 20px;
        }
    
        .ie-compatibility-banner__content {
            flex-direction: column;
            margin-top: 8px;
            margin-left: 0;
        }
    
        .ie-compatibility-banner__title {
            font-size: 16px;
            line-height: 26px;
        }
    
        .ie-compatibility-banner__description {
            width: inherit;
            font-size: 14px;
            line-height: 18px;
        }
    
        .ie-compatibility-banner__btn-container {
            margin-left: 0;
        }
    
        a.ie-compatibility-banner__btn {
            margin-top: 12px;
        }
    
        .ie-compatibility-banner__text {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: inherit;
            text-align: center;
        }
    }
    </style>
    <div class="ie-compatibility-banner">
        <div class="ie-compatibility-banner__container wrapper-container wrapper-container--px">
            <span
                class="ie-compatibility-banner__icon icon--bg-image"
                style="background-image: url('/holidays/cms/media/-/jssmedia/project/holidays/default/icons/exclamation-mark.ashx;');"
            ></span>
            <div class="ie-compatibility-banner__content">
                <div class="ie-compatibility-banner__text">
                    <h2 class="ie-compatibility-banner__title">Your browser is not supported</h2>
                    <p class="ie-compatibility-banner__description">
                        To use our site, we recommend using the latest versions of Chrome, Firefox, Safari or Edge
                    </p>
                </div>
                <span class="ie-compatibility-banner__btn-container">
                    <a
                        rel="noopener noreferrer"
                        href="/en/holidays/help"
                        target="_blank"
                        class="ie-compatibility-banner__btn"
                    >
                        Get Help
                    </a>
                </span>
            </div>
        </div>
    </div>
    "@;
    
    if ($bannerDatasource -ne $null) {
    	$bannerDatasource.Editing.BeginEdit()
    	$bannerDatasource["Html"] = $datasourceHtml
    	$bannerDatasource.Editing.EndEdit() | Out-Null
    }
    
    #Add banner to headers
    function Add-Login ($header) {
    	if ($header -ne $null) {
    		$placeholder = '/header'
    		$bannerRenderingPath = "/sitecore/layout/Renderings/Feature/PageContent/IE Compatibility Banner"
    		$bannerItem = Get-Item -Database "master" -Path $bannerRenderingPath | New-Rendering -PlaceHolder $placeholder
    		Add-Rendering -Item $header -PlaceHolder $placeholder -Instance $bannerItem -DataSource $bannerDatasourcePath
    	}
    }
    
    $fullHeader = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Header" -ErrorAction SilentlyContinue
    $slimHeader = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Header" -ErrorAction SilentlyContinue
    
    Add-Login -Header $fullHeader;
    Add-Login -Header $slimHeader; 
