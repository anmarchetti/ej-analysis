ID: "4108cc98-8bd7-41e3-9b23-7d329a33312e"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-11750 Special Request Amendment On View Booking"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $viewBookingPage = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -ErrorAction SilentlyContinue
    $specialRequests = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Special Requests" -ErrorAction SilentlyContinue
    
    
    if ($specialRequests -ne $null -and $viewBookingPage -ne $null) {
    	# Update Special Requests Amendment Fields
    	$specialRequests.Editing.BeginEdit()
    	$specialRequests["AddRequestTitle"] = "Make your holiday special by making a few requests"
    	$specialRequests["AddRequestDescription"] = "We noticed you haven’t made any special requests for your holiday. Although we can't guarantee anything, we can add special requests to your booking, free of charge. Click on the requests to add them to you booking."
    	$specialRequests["AmendmentPopupTitle"] = "Add/Edit Your Special Requests"
    	$specialRequests["AmendmentPopupDescription"] = "Although we can't guarantee anything, we can add special requests to your booking, free of charge. Click on the requests to add them to you booking. We want to make your holiday perfect, if there's anything else we can do to make your holiday special, you can <a href='https://www.easyjet.com/en/holidays/info/contact-us' target='_blank'>contact us</a> after you've booked."
    	$specialRequests.Editing.EndEdit() | Out-Null
    	Write-Host "Special Requests Amendment Fields updated"
    
    
    	# Add Special Requests Rendering to View Booking Page
    	$placeholder = "/body/special-requests-{5500ac44-5df4-4473-8e8c-ea635a187882}-0";
    	$renderingID = "{2A35FBE1-E039-4D16-B301-37FD96B0C10F}"
    	$rendering = Get-Rendering -Item $viewBookingPage -PlaceHolder $placeholder
    
    	if ($rendering -eq $null) {
    		$renderingInstance = Get-Item -Path "master:" -Id $renderingID | New-Rendering -PlaceHolder $placeholder
    		Add-Rendering -Item $viewBookingPage -PlaceHolder $placeholder -Instance $renderingInstance -DataSource $specialRequests.ID -Index 8
    		Write-Host "Special Requests Rendering added"
    	}
    }
    
    
    
