- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Titles/Password Info"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "When you make a booking, we'll create an account for you. You can use this password and email address to log in to easyJet and easyJet holidays to manage your booking online. Your password must be a single word between 6 and 20 characters long and cannot include the special characters # & + or space."
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Titles/Enter Your Email Address"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "Enter your email address"
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Labels/Create Password"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "Create a password"
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    
