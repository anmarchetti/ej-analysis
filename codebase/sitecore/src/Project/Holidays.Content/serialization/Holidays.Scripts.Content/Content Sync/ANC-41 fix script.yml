        $bannerTrade['Subtitle'] = "We can’t get the bags information for the flights on this holiday package, but don’t worry, any bags you have previously booked will still be valid. In the mean time, you can check on easyJet.com or the easyJet app to see your allowance."
        $bannerTrade['Link'] = "<link text='Go to easyJet.com' linktype='external' url='https://www.easyjet.com/en' anchor='' target='_blank' rel='' />"
        $bannerTrade.Editing.EndEdit() | Out-Null
    }
        $translations = @{
            "fr-CH" = @{
                "Title" = "Vous souhaitez ajouter des sacs ?"
                "Subtitle" = "Nous ne pouvons pas obtenir les informations sur les sacs pour les vols de ce forfait vacances, mais ne vous inquiétez pas, les sacs que vous avez déjà réservés seront toujours valables. En attendant, vous pouvez vérifier sur easyJet.com ou l'appli easyJet pour connaître votre allocation."
                "Link" = "<link text='Aller sur easyJet.com' linktype='external' url='https://www.easyjet.com/ch-fr' anchor='' target='_blank' rel='' />"
