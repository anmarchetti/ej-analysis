SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $components = @(
        @{
            Path = "master:/sitecore/content/EasyJet/Holidays/Data/Header Navigation Promotions/Header Navigations EN/Deals Promotion"
            DataPromotionValue = 'promotionDeals'
        },
        @{
            Path = "master:/sitecore/content/EasyJet/Holidays/Data/Header Navigation Promotions/Header Navigations EN/Holidays Promotion"
            DataPromotionValue = 'promotionHolidays'
        },
        @{
            Path = "master:/sitecore/content/EasyJet/Holidays/Data/Header Navigation Promotions/Header Navigations EN/Destinations Promotion"
            DataPromotionValue = 'promotionDestination'
        },
        @{
            Path = "master:/sitecore/content/EasyJet/Holidays/Data/Header Navigation Promotions/Header Navigations EN/Extras Promotion"
            DataPromotionValue = 'promotionExtras'
        },
        @{
            Path = "master:/sitecore/content/EasyJet/Holidays/Data/Header Navigation Promotions/Header Navigations EN/Travel Info Promotion"
            DataPromotionValue = 'promotionTravelInfo'
        }
    )
    $languages = @("en", "fr-FR", "fr-CH", "de-DE", "de-CH")
    foreach ($component in $components) {
        $baseItem = Get-Item -Path $component.Path -Language "en" -ErrorAction SilentlyContinue
        
        if ($baseItem -eq $null) {
            continue
        }
        
        foreach ($lang in $languages) {
            $item = Get-Item -Path $component.Path -Language $lang -ErrorAction SilentlyContinue
            
            if ($item -ne $null) {
                $currentValue = $item["DataPromotion"]
                
                if ([string]::IsNullOrWhiteSpace($currentValue) -or $currentValue -ne $component.DataPromotionValue) {
                    $item.Editing.BeginEdit()
                    $item["DataPromotion"] = $component.DataPromotionValue
                    $item.Editing.EndEdit() | Out-Null
                }
            }
        }
    }
