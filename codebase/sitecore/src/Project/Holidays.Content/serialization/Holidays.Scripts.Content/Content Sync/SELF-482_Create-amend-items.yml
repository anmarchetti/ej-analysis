  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    }
    
    $amendTypesItemWrapper = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Data/Amend Types" "{E6E913EF-36F2-4C5A-BA45-DA603B3C77DC}"
    $amendTypesItemFlight = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Flight" "{40821DBF-5A52-46EB-B6D1-2CCBBCE2C835}"
    $amendTypesItemPromocode = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Promocode" "{40821DBF-5A52-46EB-B6D1-2CCBBCE2C835}"
    $amendTypesItemSeats = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Seats" "{40821DBF-5A52-46EB-B6D1-2CCBBCE2C835}"
    
    $amendItemInfo = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info" "{D5D8F8FC-FA15-43ED-B338-E21B7478AAAA}"
    
    #Filling up "Amet Item Info" Data source
    $amendItemInfoDS = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info" -ErrorAction SilentlyContinue;
    if ($amendItemInfoDS -ne $null) {
    	$amendItemInfoDS.Editing.BeginEdit();
    	
    	$amendItemInfoDS["AmendTypes"] = "{F5BC0968-251A-43DB-AA9D-65A789F60325}|{7B902DB4-0302-4CD6-8086-B90785C711C4}|{FCF09597-A800-43D9-9359-15179183BBE1}";
    	$amendItemInfoDS["Title"] = "Your new selection";
    	$amendItemInfoDS["Subtitle"] = "Please check the details of your new selection carefully.";
    	$amendItemInfoDS["AmountText"] = "Amount";
    	$amendItemInfoDS["RefundText"] = "Refund amount";
    	$amendItemInfoDS["NewAmendment"] = "New";
    	$amendItemInfoDS["PrevAmendment"] = "Previous";
    	$amendItemInfoDS.Editing.EndEdit() | Out-Null;
    	
    	Write-Host $amendItemInfoDS.Name "updated";
    }
    
    # Fillup Amend Types
    $amendTypesItemFlight = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Flight" -ErrorAction SilentlyContinue;
    $amendTypesItemSeats = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Seats" -ErrorAction SilentlyContinue;
    
    
    if ($amendTypesItemSeats -ne $null) {
    	$amendTypesItemSeats.Editing.BeginEdit();
    	$amendTypesItemSeats["Name"] = "Seats";
    	$amendTypesItemSeats["Image"] = '<image mediaid="{CF70B0DC-4172-41A8-AD09-785081671900}" />';
    	$amendTypesItemSeats["Type"] = "{F68ACDC4-C4A3-48F8-9416-D3392B980FA4}";
    	$amendTypesItemSeats.Editing.EndEdit() | Out-Null;
    	Write-Host $amendTypesItemSeats.Name "updated";
    }
    if ($amendTypesItemFlight -ne $null) {
    	$amendTypesItemFlight.Editing.BeginEdit();
    	$amendTypesItemFlight["Name"] = "Flights";
    	$amendTypesItemFlight["Image"] = '<image mediaid="{A8677233-2EEC-4FCB-8E3C-E79DCF41F7B5}" />';
    	$amendTypesItemFlight["Type"] = "{37BBE22C-0819-4053-A1A8-66128F8D1C79}";
    	$amendTypesItemFlight.Editing.EndEdit() | Out-Null;
    	Write-Host $amendTypesItemFlight.Name "updated";
    } 
