- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $holdLuggagePath = "master:/sitecore/content/EasyJet/Holidays/Data/Hold Luggage"
    
    function updateLuggageText($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    updateLuggageText -ItemPath $holdLuggagePath -Language "fr-FR" -Key 'BagExtraDescription' -Translation "<p>Ajouter un article de {number}kg au bagage en soute pour seulement <strong>{price}</strong> par article, par vol</p><p>Tous les bagages en soute sont applicables aux vols aller et retour.</p>"
    updateLuggageText -ItemPath $holdLuggagePath -Language "fr-CH" -Key 'BagExtraDescription' -Translation "<p>Ajouter un article de {number}kg au bagage en soute pour seulement <strong>{price}</strong> par article, par vol</p><p>Tous les bagages en soute sont applicables aux vols aller et retour.</p>"
    
