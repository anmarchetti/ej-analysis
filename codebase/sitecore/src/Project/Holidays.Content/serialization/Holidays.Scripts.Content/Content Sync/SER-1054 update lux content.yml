  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel/Page Components/Contact Us Banner"
    $channelTemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Contact Us/Contact Us Popup Channel"
    
    $newChannelPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel/Page Components/Contact Us Banner/Contact Agent"
    
    function New-Content() {
    
        $updates = @(
            @{
                Path         = $newChannelPath
                TemplatePath = $channelTemplatePath
                Fields       = @{
                    "Title" = @{
                       "en" = "Contact us"
                        "fr-CH" = "Contactez-nous"
                        "de-CH" = "Kontaktieren Sie uns"
                        "fr-FR" = "Contactez-nous"
                        "de-DE" = "Kontaktieren Sie uns"
                    }
                    "Description" = @{
                       "en" = "If you've booked with a Travel Agent, please speak to them to discuss changing or amending your booking."
                        "fr-CH" = "Si vous avez réservé via une agence de voyage, veuillez la contacter pour discuter de toute modification de votre réservation."
                        "de-CH" = "Wenn Sie über ein Reisebüro gebucht haben, wenden Sie sich bitte an dieses, um Änderungen an Ihrer Buchung zu besprechen."
                        "fr-FR" = "Si vous avez réservé via une agence de voyage, veuillez la contacter pour discuter de toute modification de votre réservation."
                        "de-DE" = "Wenn Sie über ein Reisebüro gebucht haben, wenden Sie sich bitte an dieses, um Änderungen an Ihrer Buchung zu besprechen."
                    }
                }
            }
        )
    
        ImportContent -itemsToCreate $updates
    }
    
    function Set-Multilist() {
    
        $datasourceItem = Get-Item $datasourcePath
        $channelItem = Get-Item $newChannelPath
    
        $datasourceItem.Editing.BeginEdit()
        $datasourceItem["ContactChannelsAgency"] = $channelItem.ID
        $datasourceItem.Editing.EndEdit()
    }
    
    New-Content
    Set-Multilist
