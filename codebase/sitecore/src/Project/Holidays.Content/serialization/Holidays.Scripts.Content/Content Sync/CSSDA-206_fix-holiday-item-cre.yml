Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-206_fix-holiday-item-creation"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $manedHolidayItemSource = Get-Item -Path "/sitecore/system/Settings/Foundation/Destinations/Amend Details/Amend Types/Holiday" -ErrorAction SilentlyContinue;
    $holidayItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Holiday" -ErrorAction SilentlyContinue;
    
    if ($manedHolidayItemSource -ne $null) {
         $holidayItem.Editing.BeginEdit();
         $holidayItem["Type"] = $manedHolidayItemSource.ID;
         
         $holidayItem.Editing.EndEdit() | Out-Null;
         
         Write-Host $holidayItem.Name "Updated";
    }
