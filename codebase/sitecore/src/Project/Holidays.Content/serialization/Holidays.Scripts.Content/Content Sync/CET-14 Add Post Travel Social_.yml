  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function createSocialBannerDataSource()
    {
    	$templateId = "{292DFBF9-258F-48E5-B128-66F06F429009}"
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Social Banner"
    	
    	$item = Get-Item -Path $itemPath  -ErrorAction SilentlyContinue
    	
    	if ($item -eq $null){
    	   Write-Host "Creating Social Banner DataSource"
    	   
    	   New-Item -Path $itemPath -ItemType $templateId
    	   
    	} else{
    		Write-Host "Social Banner is already created"
    	}
    }
    
    function createSocialBannerDataSourceLanguageVersions() {
    	
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Social Banner"
    	$item  = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    	if ($item -eq $null) {
    		Write-Host "Missing Social Banner datasource in EN language."
    		return;
    	}
    	
    	@('en') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Find us on Social"
    		Create-Lang-Version -Item $item -Lang $_ -Field "Subtitle" -Value "Share your favourite holiday moments and tag us on social media."
    		Create-Lang-Version -Item $item -Lang $_ -Field "FacebookAriaLabel" -Value "Open Facebook link in new tab"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TwitterAriaLabel" -Value "Open Twitter link in new tab"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InstagramAriaLabel" -Value "Open Instagram link in new tab"
    		Create-Lang-Version -Item $item -Lang $_ -Field "YouTubeAriaLabel" -Value "Open YouTube link in new tab"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TiktokAriaLabel" -Value "Open TikTok link in new tab"
    	}
    
    	@('de-CH', 'de-DE') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Finden Sie uns auf Social"
    		Create-Lang-Version -Item $item -Lang $_ -Field "Subtitle" -Value "Teilen Sie Ihre schönsten Urlaubsmomente und markieren Sie uns in den sozialen Medien."
    		Create-Lang-Version -Item $item -Lang $_ -Field "FacebookAriaLabel" -Value "Facebook-Link in neuer Registerkarte öffnen"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TwitterAriaLabel" -Value "Twitter-Link in neuer Registerkarte öffnen"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InstagramAriaLabel" -Value "Instagram-Link in neuer Registerkarte öffnen"
    		Create-Lang-Version -Item $item -Lang $_ -Field "YouTubeAriaLabel" -Value "YouTube-Link in neuer Registerkarte öffnen"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TiktokAriaLabel" -Value "Tiktok-Link in neuer Registerkarte öffnen"
    	}
    
    	@('fr-CH', 'fr-FR') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Retrouvez-nous sur Social"
    		Create-Lang-Version -Item $item -Lang $_ -Field "Subtitle" -Value "Partagez vos moments de vacances préférés et taguez-nous sur les médias sociaux."
    		Create-Lang-Version -Item $item -Lang $_ -Field "FacebookAriaLabel" -Value "Ouvrir le lien Facebook dans un nouvel onglet"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TwitterAriaLabel" -Value "Ouvrir le lien Twitter dans un nouvel onglet"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InstagramAriaLabel" -Value "Ouvrir le lien Instagram dans un nouvel onglet"
    		Create-Lang-Version -Item $item -Lang $_ -Field "YouTubeAriaLabel" -Value "Ouvrir le lien YouTube dans un nouvel onglet"
    		Create-Lang-Version -Item $item -Lang $_ -Field "TiktokAriaLabel" -Value "Ouvrir le lien TikTok dans un nouvel onglet"
    	}
    	
    	Write-Host "Created language versions for Social banner datasource"
    }
    
    function createRenderingInPostTravelPage() {
    	$socialBannerRenderingId = "{1153FDBF-CE73-4BB6-A9D0-949435EA7F57}"
        $pagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/post-travel';
    	$datasourcePath = '/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Social Banner'
        $placeholder = "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-aside-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
    	
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$socialButtonRendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $socialBannerRenderingId }
    	
    	if ($socialButtonRendering -ne $null) {
    	    Write-Host "Social Button Rendering already exists"
    		return
    	}
    	
    	# Add Masonry Wrapper Item
    	$masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}" 
    	$masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    	$masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    	
    	Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder  -Parameter @{ "ItemOrderOnMobile" = "30" }
    	
    	# Get newly added rendering
    	$page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
    	$lastRendering = $renderings[-1]
    	
    	$socialButtonRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/Social Banner"
    	$socialButtonRendering = Get-Item -Database "master" -Path $socialButtonRenderingPath |  New-Rendering -Placeholder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0"
    	
    	Add-Rendering -Item $page -Instance $socialButtonRendering -PlaceHolder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0" -DataSource $datasourcePath
    	
    	Write-Host "Added Social Banner Rendering to Post Travel Page"
    }
    
    createSocialBannerDataSource
    createSocialBannerDataSourceLanguageVersions
    createRenderingInPostTravelPage
    
