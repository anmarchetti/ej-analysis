- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    
    
    $amendRBCItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board/Page Components/Amend Room And Board" -ErrorAction SilentlyContinue;
    $data = @(
        @{
            fieldName="PriceTooltipContent"; 
            values=@{
                en="Price subject to change & availability due to daily system updates.<br /><br />The price displayed here does not factor in any additional promotional codes. Any change in price as a result will be shown upon entering the payments page."; 
                fr="Prix sujets à modification et disponibilité en raison des mises à jour quotidiennes du système.<br /><br />Le prix affiché ici ne tient pas compte des codes promotionnels supplémentaires. Tout changement de prix qui en résulterait sera affiché lors de l'accès à la page de paiement."; 
                de="Preisänderungen und Verfügbarkeit vorbehalten, da das System täglich aktualisiert wird.<br /><br />Der hier angezeigte Preis berücksichtigt keine zusätzlichen Aktionscodes. Jede daraus resultierende Preisänderung wird beim Aufrufen der Zahlungsseite angezeigt."
            }
        }
    );
    
    update-item-with-lang -Data $data -Item $amendRBCItem;
