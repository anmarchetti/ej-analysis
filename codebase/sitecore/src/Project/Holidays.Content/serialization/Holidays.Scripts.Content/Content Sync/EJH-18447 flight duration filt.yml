SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $flightDurationFilterId = '{8912E011-B107-47A9-8660-018A022B7759}'
    $durationFilterId = '{0DC64E2F-0508-468C-9D2B-8C13CB6F4A62}'
    $durationDictionaryPath = '/sitecore/content/EasyJet/Holidays/Dictionary/Filter Types/Labels/Duration'
    $durationDictionaryTradePath = '/sitecore/content/EasyJet/TradePortal/Dictionary/Filter Types/Labels/Duration'
    
     function create-lang-version($item, $lang, $field, $value) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                
                if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                    Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
                }
                
                if ($null -ne $field) {
                    $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                    $targetLangItem.Editing.BeginEdit()
                    $targetLangItem[$field] = $value
                    $targetLangItem.Editing.EndEdit() | Out-Null
                }
            }
            
            # 1. update existing duration filter label
            $newDurationValues = @{
                "fr-CH" = @{
                    "Phrase" = "Durée des vacances"
                }
                "fr-FR" = @{
                    "Phrase" = "Durée des vacances"
                }
                "de-CH" = @{
                    "Phrase" = "Dauer der Ferien"
                }
                "de-DE" = @{
                    "Phrase" = "Dauer des Urlaubs"
                }
            }
        
        $durationDict = gi -Path $durationDictionaryPath -ErrorAction SilentlyContinue
        if ($null -ne $durationDict) {
            $durationDict.Editing.BeginEdit()
            $durationDict["Phrase"] = "Holiday duration"
            $durationDict.Editing.EndEdit() | Out-Null
        }
            
        foreach ($lang in $newDurationValues.Keys) {
            create-lang-version -item $durationDict -lang $lang -field "Phrase" -value $newDurationValues[$lang]["Phrase"]
            create-lang-version -item $durationDict -lang $lang -field "Phrase" -value $newDurationValues[$lang]["Phrase"]
        }
        
        $durationTradeDict = gi -Path $durationDictionaryTradePath -ErrorAction SilentlyContinue
        if ($null -ne $durationTradeDict) {
            $durationTradeDict.Editing.BeginEdit()
            $durationTradeDict["Phrase"] = "Holiday duration"
            $durationTradeDict.Editing.EndEdit() | Out-Null
        }
        
        # 2. add a new filter to the search page 
        
        function set-new-filter-to-page($page) {
            if ($page -eq $null) {
                return;
            }
            
            $currentFilters = $page["Filters Order"].Split("|")
            if (($currentFilters -ne $null) -and ($currentFilters -contains $flightDurationFilterId)) {
                "Filter already exists on " + $page.Name
                return;
            }
            
            "Adding Flight Duration filter to " + $page.Name
            
            if ($currentFilters -eq $null) {
                $currentFilters = @($flightDurationFilterId)
            }
            
            if ($currentFilters -contains $durationFilterId) {
                $insertPoint = $currentFilters.IndexOf($durationFilterId)
                $firstHalf = $currentFilters[0..$insertPoint]
                $secondHalf = $currentFilters[($insertPoint +1)..$currentFilters.Length]
                $newFilters = @($firstHalf) + @($flightDurationFilterId) + @($secondHalf)
                
                $page.Editing.BeginEdit()
                $page["Filters Order"] = [string]::Join("|", $newFilters)
                $page.Editing.EndEdit() | Out-Null
            } elseif ($currentFilters.Length -gt 0) {
                $insertPoint = 0
                $firstHalf = $currentFilters[0..$insertPoint]
                $secondHalf = $currentFilters[($insertPoint +1)..$currentFilters.Length]
                $newFilters = @($firstHalf) + @($flightDurationFilterId) + @($secondHalf)
                
                $page.Editing.BeginEdit()
                $page["Filters Order"] = [string]::Join("|", $newFilters).Trim("|")
                $page.Editing.EndEdit() | Out-Null
            }
            
        }
        
        $searchPage = gi -Path "/sitecore/content/EasyJet/Holidays/Home/MixedResultList" -ErrorAction SilentlyContinue
        $searchPageTrade = gi -Path "/sitecore/content/EasyJet/TradePortal/Home/MixedResultList" -ErrorAction SilentlyContinue
        
        set-new-filter-to-page -page $searchPage
        set-new-filter-to-page -page $searchPageTrade
        
        
        # 3. Update all promo pages and set the filter
    
    $promoPageTemplateId = "{C0CB2F05-AFD2-41CE-B53F-6F15A1033740}";
    	$promoPages = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Home/Root/UK" -Recurse | Where { $_.TemplateID -eq $promoPageTemplateId };
    
    	foreach ($promoPage in $promoPages) {
    		set-new-filter-to-page -page $promoPage
    	}
