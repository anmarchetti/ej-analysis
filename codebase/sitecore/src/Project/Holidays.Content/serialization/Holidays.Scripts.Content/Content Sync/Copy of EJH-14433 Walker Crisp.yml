  Value: |
    #ADD LINKS TO MOBILE MENU
    $linkTemplateId = "{BC011F0A-976C-4825-9E01-8BAA7C8E6CCA}";
    
    function update-item($item, $mainnav){
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            
            if ($mainnav -ne $null) {
                $item["MainNav"] = $mainnav;
            }
            $item.Editing.EndEdit() | Out-Null;
        
            Write-Host "Item" $item.Name "successfully updated";
        }
    }
    
    $holidaysPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Holidays"
    $holidays = Get-Item -path $holidaysPath -ErrorAction SilentlyContinue
    
    $flightsPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Flights"
    $flights = Get-Item -path $flightsPath -ErrorAction SilentlyContinue
    
    $destinationsPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Destinations"
    $destinations = Get-Item -path $destinationsPath -ErrorAction SilentlyContinue
    
    $dealsPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Deals"
    $deals = Get-Item -path $dealsPath -ErrorAction SilentlyContinue
    
    $travelInfoPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Travel info"
    $travelInfo = Get-Item -path $travelInfoPath -ErrorAction SilentlyContinue
    
    $protectionPromisePath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Main/Protection Promise"
    $protectionPromise = Get-Item -path $protectionPromisePath -ErrorAction SilentlyContinue
    
    $myBookingsPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Account/My bookings"
    $myBookings = Get-Item -path $myBookingsPath -ErrorAction SilentlyContinue
    
    $myBookingsNotLogedInPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Account/My Bookings Not Login"
    $myBookingsNotLogedIn = Get-Item -path $myBookingsNotLogedInPath -ErrorAction SilentlyContinue
    
    $redeemPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Redeem Voucher Logged In"
    $redeem = Get-Item -path $redeemPath -ErrorAction SilentlyContinue
    
    $redeemNotLogedInPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Redeem Voucher Not Logged In"
    $redeemNotLogedIn = Get-Item -path $redeemNotLogedInPath -ErrorAction SilentlyContinue
    
    $shortListPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Shortlist"
    $shortList = Get-Item -path $shortListPath -ErrorAction SilentlyContinue
    
    $fullHeaderPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Full Header"
    $fullHeader = Get-Item -path $fullHeaderPath -ErrorAction SilentlyContinue
    update-item -Item $fullHeader -MainNav "$($holidays.ID)|$($flights.ID)|$($destinations.ID)|$($deals.ID)|$($travelInfo.ID)|$($protectionPromise.ID)|$($myBookings.ID)|$($myBookingsNotLogedIn.ID)|$($redeem.ID)|$($redeemNotLogedIn.ID)|$($shortList.ID)"
    
    
