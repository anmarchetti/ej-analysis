Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-744 Update luggage settings with business rules"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
     function create-lang-version($item, $lang, $field, $value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    	
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $holdLuggageHolidaysSettings = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings" -Language "en" -ErrorAction SilentlyContinue
       
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "SportsEquipmentMaximalItemPerNonInfantPassenger" -Value "1"
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "SportsEquipmentMaximalItemPerNonInfantPassengerCategoryCodes" -Value "SEO,SEC"
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "HoldLuggageMaximalAdditionalBagsPerNonInfantPassengerCategoryCodes" -Value "BAGE"
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "HoldLuggageMaximalAdditionalBagsPerNonInfantPassenger" -Value "2"
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "SportsEquipmentMaximalLargeItemsPerNonInfantPassengerPerBookingCategoryCodes" -Value "SEO"
    Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "SportsEquipmentMaximalLargeItemsPerNonInfantPassengerPerBooking" -Value "6"
    
    $holdLuggageTradePortalSettings = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Settings/Luggage Settings" -Language "en" -ErrorAction SilentlyContinue
       
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "SportsEquipmentMaximalItemPerNonInfantPassenger" -Value "1"
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "SportsEquipmentMaximalItemPerNonInfantPassengerCategoryCodes" -Value "SEO,SEC"
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "HoldLuggageMaximalAdditionalBagsPerNonInfantPassengerCategoryCodes" -Value "BAGE"
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "HoldLuggageMaximalAdditionalBagsPerNonInfantPassenger" -Value "2"
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "SportsEquipmentMaximalLargeItemsPerNonInfantPassengerPerBookingCategoryCodes" -Value "SEO"
    Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "SportsEquipmentMaximalLargeItemsPerNonInfantPassengerPerBooking" -Value "6"
       	
    Write-Host "Script was executed"
    
