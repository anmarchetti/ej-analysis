  Hint: Script
  Value: |
    function UpdatePageTemplates($designItem){
        $newValue = $designItem["PageTemplates"]+ "|$($dynamicPromoPageLayoutId)"
    
        write-host $newValue
        
        $designItem.Editing.BeginEdit()
        $designItem["PageTemplates"] = $newValue
        $designItem.Editing.EndEdit()
    }
    
    $dynamicPromoPageLayoutId = '{5AFAD14A-72E0-4018-BD0D-C207584E24E0}'
    $defaultDesignUkItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design"
    $defaultDesignEuFr = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/EU - Default design" -Language "fr-FR"
    $defaultDesignEuFrCh = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/EU - Default design" -Language "fr-CH"
    $defaultDesignEuDe = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/EU - Default design" -Language "de-DE"
    $defaultDesignEuDeCH = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/EU - Default design" -Language "de-CH"
    
    UpdatePageTemplates($defaultDesignUkItem)
    UpdatePageTemplates($defaultDesignEuFr)
    UpdatePageTemplates($defaultDesignEuFrCh)
    UpdatePageTemplates($defaultDesignEuDe)
    UpdatePageTemplates($defaultDesignEuDeCH)
    
    $seasonsFolderTemplateId = '{E773D4CC-61C0-42BE-BDA2-39678833F7E0}'
    $seasonsFolder = New-Item -Path "/sitecore/content/EasyJet/Holidays/Home/DynamicPromoPages/Seasons - test" -ItemType $seasonsFolderTemplateId
