- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    $loginPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Login" -ErrorAction SilentlyContinue
    
    # change /viewmybooking -> viewmybooking=1
    # old value <link text='Find a booking' anchor='' linktype='internal' class='' title=''  querystring='/viewmybooking' id='{39D2516D-E32A-4B54-B5B4-7FFB40F67EAA}' />
    $linkEN = "<link text='Find a booking' anchor='' linktype='internal' class='' title='' querystring='viewmybooking=1' id='$($loginPage.ID)' />"
    
    # old value <link id="{39D2516D-E32A-4B54-B5B4-7FFB40F67EAA}" querystring="/viewmybooking" target="" text="Trouver une réservation" anchor="" url="" title="" class="" linktype="internal" />
    $linkFR = "<link id='$($loginPage.ID)' querystring='viewmybooking=1' target='' text='Trouver une réservation' anchor='' url='' title='' class='' linktype='internal'' />"
    
    # old value <link id="{39D2516D-E32A-4B54-B5B4-7FFB40F67EAA}" querystring="/viewmybooking" target="" text="Eine Buchung suchen" anchor="" url="" title="" class="" linktype="internal" />
    $linkDE = "<link id='$($loginPage.ID)' querystring='viewmybooking=1' target='' text='Eine Buchung suchen' anchor='' url='' title='' class='' linktype='internal' />"
    
    $viewBooking = Get-Item -path "master:/content/EasyJet/Holidays/Data/Navigations/Account/View Booking" -ErrorAction SilentlyContinue
    
    if ($viewBooking -ne $null) {
        Update-Lang-Version -Item $viewBooking -Lang "en" -Field "Link" -Value $linkEN;
        
        @('de-CH', 'de-DE') | % {
    		Update-Lang-Version -Item $viewBooking -Lang $_ -Field "Link" -Value $linkDE
    	}
    	
    	@('fr-CH', 'fr-FR') | % {
    		Update-Lang-Version -Item $viewBooking -Lang $_ -Field "Link" -Value $linkFR
    	}
    	
    	Write-Host "Updated login viewmybooking query param"
    }
    
