- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host  "Start script: TRAD-88 Print Quote Details"
        
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
        
        $exportHolidayDetails = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Export Holiday Details"
        
        $translations = @{
            "en" = @{
                "IncludedBagsLabel" = '{count} x small under seat bags';
                "OverheadBagAddedLabel" = '{count} x large overhead cabin bags with speedy boarding';
                "IncludedWithInfantLabel" = '{count} x small under seat bags, {infantCount} x baby change bags';
                "IncludedIcon" = '<image mediaid="{CB598726-D37F-4F61-8B1C-B7A9DEF9DEE9}" />';
                "OverheadAddedIcon" = '<image mediaid="{D04439D4-A1E7-409F-B074-CBA5D1B14D5E}" />';
            }
        }
        
        create-lang-version -item $exportHolidayDetails -lang "en" -field "IncludedBagsLabel" -value $translations["en"]["IncludedBagsLabel"]
    
        create-lang-version -item $exportHolidayDetails -lang "en" -field "OverheadBagAddedLabel" -value $translations["en"]["OverheadBagAddedLabel"]
    
        create-lang-version -item $exportHolidayDetails -lang "en" -field "IncludedWithInfantLabel" -value $translations["en"]["IncludedWithInfantLabel"]
    
        create-lang-version -item $exportHolidayDetails -lang "en" -field "IncludedIcon" -value $translations["en"]["IncludedIcon"]
    
        create-lang-version -item $exportHolidayDetails -lang "en" -field "OverheadAddedIcon" -value $translations["en"]["OverheadAddedIcon"]
    
