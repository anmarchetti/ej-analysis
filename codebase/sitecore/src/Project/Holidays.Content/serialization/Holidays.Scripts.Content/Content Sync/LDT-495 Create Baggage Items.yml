Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/LDT-495 Create Baggage Items in Ancillaries"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $luggageCategoryTemplate = '{928655D3-BFC1-4E24-99A5-096BE1B24D09}'
    $luggageItemTemplate = '{41775FBB-D551-4813-B3D7-1BDC7C6DB534}'
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
            Write-Host "Item created:" $path
        } else {
            Write-Host "Item already exists:" $path
        }
        return $item
    }
    
    function Create-Baggage-Structure($rootPath) {
        $luggagePath = $rootPath + '/Data/Ancillaries/Luggage'
        
        $luggageFolder = Get-Item -Path $luggagePath -ErrorAction SilentlyContinue
        if($luggageFolder -eq $null){
            Write-Host "Warning: Luggage folder not found at" $luggagePath
            return
        }
        
        $baggagePath = $luggagePath + '/Baggage'
        $baggageItem = Get-Or-Create-Item -Path $baggagePath -Template $luggageCategoryTemplate
        
        if($baggageItem -ne $null){
            $baggageItem.Editing.BeginEdit()
            $baggageItem["Code"] = "BAG"
            $baggageItem["Type"] = "Bag"
            $baggageItem["Name"] = "Baggage"
            $baggageItem.Editing.EndEdit() | Out-Null
            
            $bagPath = $baggagePath + '/Bag'
            $bagItem = Get-Or-Create-Item -Path $bagPath -Template $luggageItemTemplate
            
            if($bagItem -ne $null){
                $bagItem.Editing.BeginEdit()
                $bagItem["Code"] = "BAG"
                $bagItem["Name"] = "Baggage"
                $bagItem["IsLuggageItemEnabled"] = "1"
                $bagItem.Editing.EndEdit() | Out-Null
            }
        }
        
        Write-Host $rootPath "- Baggage structure processed"
    }
    
    ### EXECUTION
    
    $holidaysPath = '/sitecore/content/EasyJet/Holidays'
    $tradePortalPath = '/sitecore/content/EasyJet/TradePortal'
    
    Create-Baggage-Structure -RootPath $holidaysPath
    Create-Baggage-Structure -RootPath $tradePortalPath
    
    Write-Host "Script completed successfully"
