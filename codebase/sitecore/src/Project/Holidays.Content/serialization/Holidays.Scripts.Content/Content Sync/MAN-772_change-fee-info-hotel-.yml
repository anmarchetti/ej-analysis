      ## GET OR CREATE ITEM
      function Get-Or-Create-Item($path, $templateID){
         $item = Get-Item -Path $path -ErrorAction SilentlyContinue
         if($item -eq $null){
             $item = New-Item -Path $path -ItemType $templateID;
         }
         return $item
      }
      ###
      
      ## UPDATE FILEDS WITH LANGS
      function update-item-with-lang($data, $item) {
         function create-lang-version($item, $lang, $field, $value) {
             $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
      
             if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                 Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
             }
      
             if ($null -ne $field) {
                 $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                 $targetLangItem.Editing.BeginEdit()
                 $targetLangItem[$field] = $value;
                 $targetLangItem.Editing.EndEdit() | Out-Null
             }
      };
      
         if ($item -ne $null) {
             $data | ForEach-Object {
             $fieldName = $_.fieldName;
             $values = $_.values;
      
             if ($values -ne $null) {
      
                 if ($values.en -ne $null) {
                     $item.Editing.BeginEdit();
                     $item[$fieldName] = $values.en;
                     $item.Editing.EndEdit() | Out-Null
                 }
                  if ($values.fr -ne $null) {
                      @('fr-CH', 'fr-FR') | % {
                         Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                     }
                 }
                  if ($values.de -ne $null) {
                      @('de-CH', 'de-DE') | % {
                         Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                     }
                 }
      
                 Write-Host $fieldName "Updated"
             }
         }
         }
      };
      ##
      
      ## GET OR CREATE ITEM AND POPULATE IT
      function Get-Or-Create-Item-And-Populate($itemPath, $templatePath, $data) {
         $template = Get-Item -Path $templatePath -ErrorAction SilentlyContinue;
         $item = Get-Or-Create-Item -Path $itemPath -TemplateID $template.ID;
      
         if ($item -ne $null) {
             Write-Host $item.Name "Has been created/find";
      
             update-item-with-lang -Data $data -Item $item;
         }
      
         return $item;
      }
      ##
      
      ## UPDATE PAGE RENDERING
      function Add-Or-Update-Page-Rendering ($pagePath, $renderingPath, $renderingPlaceholder, $dataSourcePath, $parameters = @{}) {
      $renderingItem = Get-Item -Path $renderingPath;
      $dataSourceItem = Get-Item -Path $dataSourcePath;
      $page = Get-Item $pagePath;
      
      $pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
      
      if ($pageRenderingInstance -eq $null) {
      	$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
      
      	Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath -Parameter $parameters
      
      	Write-Host $renderingItem.Name "- Rendering instance added";
      }
      else {
      	Write-Host $renderingItem.Name "- Already exists";
      }
         }
      ##
      
      ## GET RENDERING INSTANCE
      function Get-Rendering-Instance($itemPath, $renderingPath, $dataSourcePath) {
         $pageItem = Get-Item -Path $itemPath;
         $renderingItem = Get-Item -Path $renderingPath;
         $dataSourceItem = Get-Item -Path $dataSourcePath;
         $rendering = Get-Rendering -Item $pageItem -Rendering $renderingItem -DataSource $dataSourcePath;
      
         if ($rendering -ne $null) {
             return $rendering;
         }
      
      
         return Get-Rendering -Item $pageItem -Rendering $renderingItem -DataSource $dataSourceItem.ID;
      }
      ##
      
      ## BUILD RENDERING PLACEHOLDER
      function Build-Rendering-Placeholder($itemPath, $renderingPath, $dataSourcePath, $prefix) {
         $parent = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
         $renderingInstance = Get-Rendering-Instance -ItemPath $itemPath -RenderingPath $renderingPath -DataSourcePath $dataSourcePath;
      
         return $prefix + $renderingInstance.uniqueId + "-0";
      }
      ##
      
      ## All above
      function Create-Or-Update-Item-And-Populate-It-And-Update-Page-Rendering ($itemPath, $renderingPath, $templatePath, $pagePath, $data, $renderingPlaceholder) {
      
         $item = Get-Or-Create-Item-And-Populate -ItemPath $itemPath -TemplatePath $templatePath -Data $data;
      
         Add-Or-Update-Page-Rendering -PagePath $pagePath -RenderingPath $renderingPath -RenderingPlaceholder $renderingPlaceholder -DataSourcePath $itemPath -Parameters $parameters;
      }
      ##
      
      $hotelsPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel";
      $amendHotelDataSourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel/Page Components/Amend Hotel";
      
      $changeFeeItemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel/Page Components/Change Fee Info";
      $changeFeeTemplatePath = "/sitecore/templates/Feature/Destinations/Amend/Change Fee Info";
      $changeFeeRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Change Fee Info";
      
      $changeFeeData = @(
         @{
             fieldName = "Title";
             values = @{
                 en = "Change fees are not included.";
                 fr = "Les frais de modification ne sont pas inclus.";
                 de = "Änderungsgebühren sind nicht enthalten.";
             };
         },
         @{
             fieldName = "Description";
             values = @{
                 en = "Prices exclude any change fees or adjustments to promotional codes. <br /><span>Based on your selection, a {price}pp change fee might be applied.</span><span> Rest assured, if the new price is higher than the original, the change fee will not apply to your new hotel!</span>";
                 fr = "Die Preise verstehen sich zuzüglich etwaiger Änderungsgebühren oder Anpassungen von Aktionscodes. <br /><span>En fonction de votre sélection, des frais de changement de {price}par personne peuvent être appliqués.</span><span> Rassurez-vous, si le nouveau prix est plus élevé que l'original, les frais de changement ne s'appliqueront pas à votre nouvel hôtel!</span>";;
                 de = "Les prix ne comprennent pas les frais de modification ou d'ajustement des codes promotionnels. <br /><span>Je nach Auswahl kann eine Umbuchungsgebühr von {price}pp erhoben werden.</span><span> Wenn der neue Preis höher ist als der ursprüngliche, entfällt die Änderungsgebühr für Ihr neues Hotel!</span>";
             };
         },
         @{
             fieldName = "Icon";
             values = @{
                 en = '<image mediaid="{EA82CDAB-9D20-4D63-83F0-DA42CFDF9DD9}" />';
             };
         }  
      );
      
      $changeFeeRenderingPlaceholder = Build-Rendering-Placeholder -ItemPath $hotelsPagePath -RenderingPath "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Hotel" -DataSourcePath $amendHotelDataSourcePath -Prefix "/body/change-fee-info-";
      
      Create-Or-Update-Item-And-Populate-It-And-Update-Page-Rendering -ItemPath $changeFeeItemPath  -RenderingPath $changeFeeRenderingPath -TemplatePath $changeFeeTemplatePath -PagePath $hotelsPagePath -Data $changeFeeData -RenderingPlaceholder $changeFeeRenderingPlaceholder;




