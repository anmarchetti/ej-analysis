  Hint: Script
  Value: |
    $settingsFolderPath = "/sitecore/content/EasyJet/Holidays/Settings"
    
    $templateId = "{84147A55-6D78-48CE-A5F6-71E242A1F055}"
    $itemName = "Promo Page Setting"
    
    $item = Get-Item -Path "$($settingsFolderPath)/$($itemName)" -ErrorAction SilentlyContinue
    
    if ($item -eq $null) {
    	$item = New-Item -Path $settingsFolderPath -Name $itemName -ItemType $templateId
    
    	$item.Editing.BeginEdit()
    	$item["EnablePromoBannerTooltip"] = "0"
    	$item.Editing.EndEdit() | Out-Null;
    }
    
    Write-Host $item.Name "creation finished"; 
