SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $destinationsPath = "/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $regionTemplateId = "{2F42EC14-7E56-467A-B300-AB9723C74546}"
    $resortTemplateId = "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}"
    
    $questionsAndAnswersFolderTemplateId = "{48403D80-0E80-447F-84CC-D2C218D0F2A3}"
    
    $destinationsItem = Get-Item -Path $destinationsPath -ErrorAction SilentlyContinue
    
    function Get-Q-And-A-Item($item){
        $pageComponents = Get-Item -Path "$($item.Paths.FullPath)/Page Components" -ErrorAction SilentlyContinue
        if($pageComponents -eq $null){
            return $null
        }
        $questionsAndAnswersItem = $pageComponents.Children | Where-Object { $_.TemplateId -eq $questionsAndAnswersFolderTemplateId }
        return $questionsAndAnswersItem
    }
    
    function Update-QA($item, $datasource){
        Get-Rendering -Item $item |
        Foreach-Object {
            if ($_.ItemId -eq "{2D04B19E-63E4-42FB-9581-0D7370107D7E}"){
                $_.DataSource = $datasource.Id
                Set-Rendering -Item $item -Instance $_
            }
        }
    }
    
    if($destinationsItem -ne $null){
        foreach($country in $destinationsItem.Children){
            foreach($region in $country.Children | Where-Object { $_.TemplateId -eq $regionTemplateId}){
                $qa = Get-Q-And-A-Item -Item $region
                if($qa -ne $null){
                    Update-QA -Item $region -Datasource $qa
                }
                foreach($resort in $region.Children | Where-Object { $_.TemplateId -eq $resortTemplateId}){
                    $qa = Get-Q-And-A-Item -Item $resort
                    if($qa -ne $null){
                        Update-QA -Item $resort -Datasource $qa
                    }
                }
            }
        }
    }
