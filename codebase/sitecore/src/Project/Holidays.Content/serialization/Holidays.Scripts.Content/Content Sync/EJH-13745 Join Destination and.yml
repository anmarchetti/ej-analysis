Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13745 Join Destination and Hotel Map Settings Into One"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $mapSettingTemplateId = '{22A3D3E6-2D94-4746-9134-B90F0EF332B9}';
    $mapSettingPath = "/sitecore/content/EasyJet/Holidays/Settings/Map Visibility Settings"
    
    # remove destination map visibility setting
    Get-Item -Path 'master:/content/EasyJet/Holidays/Settings/Destination Map Visibility Settings' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/templates/Project/Holidays/Site Settings/Destination Map Visibility Settings' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    
    
    $item = Get-Item -Path $mapSettingPath -ErrorAction SilentlyContinue;
    
    if ($item -ne $null) {
    	# add checkbox for destination map visibility
    	$item.Editing.BeginEdit()
    	$item["IsDestinationMapHiddenOnDesktop"] = "1";
    	$item.Editing.EndEdit() | Out-Null
    
    	Write-Host $item.Name "successfully updated"
    } 
