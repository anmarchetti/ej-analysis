Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-1134_Removing-rendering-AmendItemInfo-from-AmendPayment-item"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    $amendPaymentItem = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment" -ErrorAction SilentlyContinue;
    $amendItemInfoRendering = Get-Item "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Item Info" -ErrorAction SilentlyContinue;
    $amendItemInfoRenderingDefinition = Get-Rendering -Item $amendPaymentItem -DataSource "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info" -Rendering $amendItemInfoRendering;
    
    if ($amendItemInfoRendering -ne $null) {
        Remove-Rendering -Item $amendPaymentItem -Rendering $amendItemInfoRendering;
        
        Write-Host $amendItemInfoRendering.Name "was removed from" $amendPaymentItem.Name;
    }
