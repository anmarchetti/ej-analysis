    function Update-HeroBanner {
    	param($item)
    
        $itemName = $item.name;
        $itemInfo =  $bannersInfo | Where-Object { $_.Name -eq $itemName } | Select -First 1;
    
    	if ($item -ne $null -and $itemInfo -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Image"] = $itemInfo.Image;
    		$item["Title"] = $itemInfo.Title;
    		$item["Subtitle"] = $itemInfo.Subtitle;
    		$item["CreditText"] = $itemInfo.CreditText;
    		$item["CreditLink"] = $itemInfo.CreditLink;
    		$item.Editing.EndEdit() | Out-Null
    	}
    }
    
    $homeItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" #Home Page
    $pageComponentItem = Get-Item -Path "master:" -Id "{F396666F-E2F1-4904-9391-3BF98BEA3A35}" #ID Home Page component
    
    $heroCarousel = Get-ChildItem -Item $pageComponentItem | Where-Object { $_.Name -eq "Hero Carousel" } | Select -First 1
    foreach($banner in $heroCarousel.Children) {
         Write-Host $banner.name
         Update-HeroBanner -item $banner
     }
          
