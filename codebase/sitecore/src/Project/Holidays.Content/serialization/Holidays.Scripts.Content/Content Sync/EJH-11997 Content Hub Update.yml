- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $contentHubPath = "/sitecore/content/EasyJet/Holidays/Home/Media Center/Content Hub"
    $contentHubPage = Get-Item -path $contentHubPath -ErrorAction SilentlyContinue
    
    $itemId = '{47B9CB90-2399-4D45-BA7D-0038495FEB0E}'
    $mediaCenterFiltersPlaceHolder = '/body/component-wrapper-inner-{47B9CB90-2399-4D45-BA7D-0038495FEB0E}-0'
    
    if ($contentHubPage -ne $null){
        # Remove Component Wrapper For Filters
        $wrapperRendering = Get-Rendering -Item $contentHubPage -UniqueId $itemId
        if ($wrapperRendering -ne $null){
            Remove-Rendering -Item $contentHubPage -Instance $wrapperRendering
        }
    
        $mediaCenterFiltersRendering = Get-Rendering -Item $contentHubPage -PlaceHolder $mediaCenterFiltersPlaceHolder
        if ($mediaCenterFiltersRendering -ne $null){
            Set-Rendering -Item $contentHubPage -Instance $mediaCenterFiltersRendering -Placeholder "body"
        }
    }
    
        function rename-item($path,$newName)
        {
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -ne $null){
                $item.Editing.BeginEdit()
                $item.Name = $newName
                $item["Name"] = $newName
                $item["PageTitle"] = $newName;
                $result = $item.Editing.EndEdit()
                return $item.Paths.FullPath
            }    
            return ""
        }
        
    rename-item -Path $contentHubPath -NewName "Press Releases"
