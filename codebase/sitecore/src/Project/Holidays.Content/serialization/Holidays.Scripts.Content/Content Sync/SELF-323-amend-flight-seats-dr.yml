  Hint: Script
  Value: |
    $item = Get-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Flight/Page Components/Change Flights" -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["PopupCancelCTA"] = "Back to flights";
        $item["PopupTitle"] = "Information on your previous seat selection";
        $item["PopupText"] = "When a flight is changed, any previously purchased seat selection is not transferred to the new flight. If you would like to add seats to your new flights this can be purchased on the 'View Booking' page. New seats selection is subject to availability and cannot be guaranteed.";
        $item["SignpostText"] = "When a flight is changed, any previously purchased seat selection is not transferred to the new flight. If you would like to add seats to your new flights this can be purchased on the 'View Booking' page. New seats selection is subject to availability and cannot be guaranteed.";
        $item["SignpostTitle"] = "Information on your previous seat selection";
        
        Write-Host "Item" "Finished";
        $item.Editing.EndEdit() | Out-Null
    }
    
    
