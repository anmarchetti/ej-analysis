- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $bookingPagePath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking';
    $bookingPagePathTrade = "master:/sitecore/content/EasyJet/TradePortal/Home/Booking"
    $bookingPage = Get-Item -Path $bookingPagePath
    $bookingPageTrade = Get-Item -Path $bookingPagePathTrade
    
    $cabinBagsRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage/Cabin Bags"
    $cabinBagsRendering = Get-Rendering -Item $bookingPage -PlaceHolder "*body*" -Rendering $cabinBagsRenderingItem
    $cabinBagsRenderingTrade = Get-Rendering -Item $bookingPageTrade -PlaceHolder "*body*" -Rendering $cabinBagsRenderingItem
    
    $holdLuggageRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage/Hold Luggage"
    $holdLuggageRendering = Get-Rendering -Item $bookingPage -PlaceHolder "*body*" -Rendering $holdLuggageRenderingItem
    $holdLuggageRenderingTrade = Get-Rendering -Item $bookingPageTrade -PlaceHolder "*body*" -Rendering $holdLuggageRenderingItem
    
    $param = @{"Color"='#55A446'}
    
    if($cabinBagsRendering -ne $null){
        Set-RenderingParameter -Instance $cabinBagsRendering -Parameter $param
        Set-Rendering -Item $bookingPage -Instance $cabinBagsRendering -DataSource $cabinBagsRendering.ID
        Write-Host $bookingPage.Name  "Cabin Bags Rendering successfully updated"
    }
    
    if($cabinBagsRenderingTrade -ne $null) {
        Set-RenderingParameter -Instance $cabinBagsRenderingTrade -Parameter $param
        Set-Rendering -Item $bookingPageTrade -Instance $cabinBagsRenderingTrade -DataSource $cabinBagsRenderingTrade.ID
        Write-Host $bookingPage.Name  "Cabin Bags Rendering Trade successfully updated"
    }
    
    if($holdLuggageRendering -ne $null){
        Set-RenderingParameter -Instance $holdLuggageRendering -Parameter $param
        Set-Rendering -Item $bookingPage -Instance $holdLuggageRendering -DataSource $holdLuggageRendering.ID
        Write-Host $bookingPage.Name  "Hold Luggage Rendering successfully updated"
    }
    
    if($holdLuggageRenderingTrade -ne $null){
        Set-RenderingParameter -Instance $holdLuggageRenderingTrade -Parameter $param
        Set-Rendering -Item $bookingPageTrade -Instance $holdLuggageRenderingTrade -DataSource $holdLuggageRenderingTrade.ID 
        Write-Host $bookingPage.Name  "Hold Luggage Rendering Trade successfully updated"
    }
    
    function create-lang-version ($itemPath,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $itemPath -Language $lang
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Path $itemPath -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    		$targetLangItem = Get-Item -Path $itemPath -Language $lang
    	}
    	$targetLangItem = Get-Item -Path $itemPath -Language $lang
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $itemPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
