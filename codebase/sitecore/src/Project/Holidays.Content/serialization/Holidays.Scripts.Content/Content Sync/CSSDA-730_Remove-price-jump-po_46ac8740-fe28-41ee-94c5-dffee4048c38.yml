  Hint: Script
  Value: |
    $amendRoomAndBoardItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board" -ErrorAction SilentlyContinue;
    $priceJumpPopupRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Popups/Price Jump Popup" -ErrorAction SilentlyContinue;
    
    if ($amendRoomAndBoardItem -ne $null) {
        Remove-Rendering -Item $amendRoomAndBoardItem -Rendering $priceJumpPopupRendering -PlaceHolder "/body/price-jump-popup-{55b669af-39a9-44ba-99e6-e00e81339bfd}-0";
        
        Write-Host "Price jump popup rendering has been removed from" $amendRoomAndBoardItem.Name;
    }
