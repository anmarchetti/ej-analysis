                }
            }
        )
    ImportContent -itemsToCreate $updates
    
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking" -ErrorAction SilentlyContinue
    $wrapperRenderingId = "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"
    $sorterRenderingId = "{DC475304-7A11-4CAE-951F-CCF52920CA67}"
    
    $renderings = Get-Rendering -Item $page -FinalLayout
    
    $wrapperRenderings = $renderings | Where-Object { $_.ItemId -eq $wrapperRenderingId }
    $wrapperUniqueId = $wrapperRenderings[1].UniqueId
    
    $sorterRenderings = $renderings | Where-Object { $_.ItemId -eq $sorterRenderingId }
    $sorterUniqueId = $sorterRenderings[0].UniqueId
    
    $placeholder = "/body/component-wrapper-inner-$($wrapperUniqueId)-0/sorter-wrapper-inner-$($sorterUniqueId)-0"
    
    # Add Fast Track component
    $renderingPath = "/sitecore/layout/Renderings/Feature/Ancillaries/Fast Track And Speedy Boarding"
    $rendering = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholder 
    Add-Rendering -Item $page -Instance $rendering -PlaceHolder $placeholder -Index 16 -Datasource $datasourcePath
    
