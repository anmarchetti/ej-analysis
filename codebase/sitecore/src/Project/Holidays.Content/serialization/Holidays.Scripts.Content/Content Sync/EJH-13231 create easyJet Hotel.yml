  Value: |
    $folderName = "easyJet Hotel Report Export"
    $folderPath = "/sitecore/media library/Files/$($folderName)"
    $templateId = "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
    
    $schedulePath = "/sitecore/system/Tasks/Schedules/Reports/Run Clean Up Reports Data"
    $scheduleTemplateId = "{70244923-FA84-477C-8CBD-62F39642C42B}"
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
            Write-Host "Item $($item.Paths.FullPath) successfully created"
        }
        
        return $item
    }
    
    function Update-Schedule-Item($item){
        if($item -ne $null){
            $item.Editing.BeginEdit()
            $item.Fields["Items"].Value = "/sitecore/system/Modules/PowerShell/Script Library/Helpers/Clean Up Reports Data"
            $item.Fields["Command"].Value = "{F5F55071-697B-4769-A992-2A755FC379E5}"
            $item.Editing.EndEdit()
        }
    }
    
    Get-Or-Create-Item -Path $folderPath -Template $templateId
    
    $scheduleItem = Get-Or-Create-Item -Path $schedulePath -Template $scheduleTemplateId
    Update-Schedule-Item -Item $scheduleItem
