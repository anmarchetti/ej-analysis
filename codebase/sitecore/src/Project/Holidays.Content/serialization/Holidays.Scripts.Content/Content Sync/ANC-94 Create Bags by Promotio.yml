- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-item($path, $itemName, $itemType, $codeValue){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                if ($null -ne $codeValue) {
                    $createdItem.Editing.BeginEdit()
                    $createdItem["Code"] = $codeValue;
                    $createdItem.Editing.EndEdit() | Out-Null
                }
                
                Write-Host "$itemName item is created"
                
                return $createdItem
            }
        } else {
            return $itemToCreateExist
        }
        
        return $null
    }
    
    $markets = "fr-CH", "fr-FR", "de-CH", "de-DE"
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function create-cities-settings($website){
        $settingsPath = "/sitecore/content/EasyJet/$website/Settings"
        $citiesSettingsPath = "$settingsPath/Bags by Promotion Upsell Settings"
        $citiesSettingsItem = create-item -Path $settingsPath -ItemName "Bags by Promotion Upsell Settings" -ItemType "{31AA5C25-0B66-4B01-B96D-5BBCE885E9F4}"
    
        if ($citiesSettingsItem -ne $null) {
            $zeroOption = create-item -Path $citiesSettingsPath -ItemName 'Cities 0 kg only' -ItemType "{D7459708-6459-4000-AF33-0C00C831967A}" -CodeValue 'zero'
            $allOption = create-item -Path $citiesSettingsPath -ItemName 'All packages' -ItemType "{D7459708-6459-4000-AF33-0C00C831967A}" -CodeValue 'all'
            $noneOption = create-item -Path $citiesSettingsPath -ItemName 'None' -ItemType "{D7459708-6459-4000-AF33-0C00C831967A}" -CodeValue 'none'
            
            if ($website -eq 'Holidays') {
                foreach ($lang in $markets) {
                    create-lang-version -item $citiesSettingsItem -lang $lang
                    create-lang-version -item $zeroOption -lang $lang -field "Code" -value 'zero'
                    create-lang-version -item $allOption -lang $lang -field "Code" -value 'all'
                    create-lang-version -item $noneOption -lang $lang -field "Code" -value 'none'
                } 
            }
        }
        
        Write-Host "Bags by Promotion Upsell Settings created on " $website
    }
    
    create-cities-settings -website "Holidays"
    create-cities-settings -website "TradePortal"
    
