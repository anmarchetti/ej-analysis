Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14844 Update Create Account Link"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $settingsItem = Get-Item -Path "master:/content/EasyJet/Holidays/Settings/Create Account Link Settings" -ErrorAction SilentlyContinue
    $createAccountPage = Get-Item -Path "master:/content/EasyJet/Holidays/Home/Create Account" -ErrorAction SilentlyContinue
    
    
    if ($settingsItem -ne $null -and $createAccountPage -ne $null) {
    	$settingsItem.Editing.BeginEdit()
    	$settingsItem["CreateAccountLink"] = "<link text='Create account' linktype='internal' id='$($createAccountPage.ID)' />"
    	$settingsItem.Editing.EndEdit() | Out-Null
    	Write-Host "Link successfully updated";
    } 
