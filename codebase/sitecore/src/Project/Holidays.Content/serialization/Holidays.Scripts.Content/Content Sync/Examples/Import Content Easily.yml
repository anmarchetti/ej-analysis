- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # This is just an Example for ContentSync
    # To update the dictionary, you just have to put your items here:
    # Path: sitecore/templates/Branches/Project/Holidays/Website/$name/Dictionary Domain
    
    Import-Function "Import Content"
    
    $itemsToCreate = @(
        @{
            Id           = "{BEEFAB6A-B35F-471E-AF48-6C82DAF5B913}" # Id is optional
            Path         = "/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Buttons/More Info"
            TemplatePath = "/sitecore/templates/System/Dictionary/Dictionary entry"
            Fields       = @{
                "Key"    = @{
                    "en" = "Globals.Buttons.MoreInfo" # providing "en" as key is optional / see second example in the bottom
                }
                "Phrase" = @{
                    "en"    = "More Info"
                    "fr-CH" = "Plus d'informations"
                    "it-IT" = "Maggiori informazioni"
                    "de-CH" = "Weitere Informationen"
                    "fr-FR" = "Plus d'informations"
                    "nl-NL" = "Meer informatie"
                    "nl-BE" = "Meer informatie"
                    "de-DE" = "Weitere Informationen"
                    "es-ES" = "Más información"
                }
            }
        },
        @{
            Id           = "{9E58A176-9D47-49FA-BC06-8D6A84C419CA}"
            Path         = "/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Buttons/Book for"
            TemplatePath = "/sitecore/templates/System/Dictionary/Dictionary entry"
            Fields       = @{
                "Key"    = "Globals.Buttons.BookFor" #here "en" is used implicitly
                "Phrase" = @{
                    "en"    = "Book for {price}"
                    "fr-CH" = "Réservez pour {price}"
                    "it-IT" = "Prenota a {price}"
                    "de-CH" = "Buchen Sie für {price}"
                    "fr-FR" = "Réservez pour {price}"
                    "nl-NL" = "Boek voor {price}"
                    "nl-BE" = "Boek voor {price}"
                    "de-DE" = "Buchen Sie für {price}"
                    "es-ES" = "Reserva por {price}"
                }
            }
        }
    )
    
    ImportContent -itemsToCreate $itemsToCreate
