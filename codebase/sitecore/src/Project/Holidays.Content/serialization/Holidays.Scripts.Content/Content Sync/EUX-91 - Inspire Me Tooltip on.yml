SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $item = Get-Item -path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod/Labels/Click Search Anywhere"
    
    @('en') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value 'Take <a href=\"/holiday-inspiration\">our quiz</a> to find your perfect gateway!'
    }
    
    @('de-CH','de-DE') | % {
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value 'Machen Sie <a href=\"/holiday-inspiration\">unser Quiz</a> und finden Sie Ihren perfekten Zugang zu finden!'
    }
    
    @('fr-CH','fr-FR') | % {
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value 'Répondez à <a href=\"/holiday-inspiration\">notre questionnaire</a> pour trouver votre passerelle idéale!'
    }
    
