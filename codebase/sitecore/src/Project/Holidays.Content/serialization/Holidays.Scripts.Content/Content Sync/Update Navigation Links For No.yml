Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Navigation Links For Not Logged In
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $linkTemplateId = "{BC011F0A-976C-4825-9E01-8BAA7C8E6CCA}";
    $imageLinkTemplateId = "{18693804-D215-4F1C-9663-E1F8935C0BAA}";
    
    function update-item($link, $children, $showon, $name){
        $item.Editing.BeginEdit()
        if ($link -ne $null) {
            $item["Link"] = $link;
        }
        if ($children -ne $null) {
            $item["ChildrenLinks"] = $children;
        }
        if ($showon -ne $null) {
            $item["ShowOn"] = $showon;
        }
        if ($name -ne $null) {
            $item["Name"] = $name;
        }
        $item.Editing.EndEdit() | Out-Null;
        
        Write-Host "Item" $item.Name "successfully updated";
    }
    
    function create-or-update-item($item, $path, $templateId, $link, $children, $showon, $name){
        if ($item -eq $null) {
        # Create Item
            $item = New-Item -Path $path -ItemType $templateId;
            Write-Host "Item" $item.Name "successfully created";
            # Update Item
            update-item -Link $link -Children $children -Showon $showon -Name $name
        } else {
            Write-Host "Item" $path "already exists";
            # Update Item
            update-item -Link $link -Children $children -Name $name -Showon $showon
        }
    }
    
    # Pages
    $loginPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Login" -ErrorAction SilentlyContinue
    $holidayCreditPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Booking/Holiday Credit" -ErrorAction SilentlyContinue
    $myBookingsPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Booking/My_Bookings" -ErrorAction SilentlyContinue
    
    # Links
    $itemPathViewMyBookings = "master:/content/EasyJet/Holidays/Data/Navigations/Account/View My Bookings"
    $viewMyBookings = Get-Item -path $itemPathViewMyBookings -ErrorAction SilentlyContinue
    
    $itemPathViewBooking = "master:/content/EasyJet/Holidays/Data/Navigations/Account/View Booking"
    $viewBooking = Get-Item -path $itemPathViewBooking -ErrorAction SilentlyContinue
    create-or-update-item -Item $viewBooking -Path $itemPathViewBooking -TemplateId $linkTemplateId -Showon ''
    
    $itemPathMyBookings = "master:/content/EasyJet/Holidays/Data/Navigations/Account/My bookings"
    $myBookings = Get-Item -path $itemPathMyBookings -ErrorAction SilentlyContinue
    
    $itemPathCheckIn = "master:/content/EasyJet/Holidays/Data/Navigations/Button/Check in"
    $checkIn = Get-Item -path $itemPathCheckIn -ErrorAction SilentlyContinue
    
    $itemPathlogout = "master:/content/EasyJet/Holidays/Data/Navigations/Button/Logout"
    $logout = Get-Item -path $itemPathlogout -ErrorAction SilentlyContinue
    
    $itemPathMyAccount = "master:/content/EasyJet/Holidays/Data/Navigations/Account/My account"
    $myAccount= Get-Item -path $itemPathMyAccount -ErrorAction SilentlyContinue
    create-or-update-item -Item $myAccount -Path $itemPathMyAccount -TemplateId $linkTemplateId -Showon ''
    
    $itemPathAvailableCredit = "master:/content/EasyJet/Holidays/Data/Navigations/Account/Holiday Credit"
    $availableCredit= Get-Item -path $itemPathAvailableCredit -ErrorAction SilentlyContinue
    create-or-update-item -Item $availableCredit -Path $itemPathAvailableCredit -TemplateId $linkTemplateId -Link "<link text='Available credit:' anchor='' linktype='internal' class='' title=''  querystring='' id='$($holidayCreditPage.ID)' />" -Children '' -Name ''
    
    $itemPathLogin = "master:/content/EasyJet/Holidays/Data/Navigations/Button/Login"
    $login = Get-Item -path $itemPathLogin -ErrorAction SilentlyContinue
    create-or-update-item -Item $login -Path $itemPathLogin -TemplateId $linkTemplateId -Link "<link text='Log in' anchor='' linktype='internal' class='' title=''  querystring='redirectUrl=/booking/my_bookings' id='$($loginPage.ID)' />"
    
    $itemPathMyBookingsNotLogin = "master:/content/EasyJet/Holidays/Data/Navigations/Account/My Bookings Not Login"
    $myBookingsNotLogin = Get-Item -path $itemPathMyBookingsNotLogin -ErrorAction SilentlyContinue
    create-or-update-item -Item $myBookingsNotLogin -Path $itemPathMyBookingsNotLogin -TemplateId $linkTemplateId -Link "<link text='My bookings' anchor='' linktype='internal' class='' title=''  querystring='' id='$($myBookingsPage.ID)' />" -Children "$($viewBooking.ID)|$($myAccount.ID)|$($checkIn.ID)" -Showon 'Show On Loged Out'
    
    $itemPathProfileNoLoggedIn = "master:/content/EasyJet/Holidays/Data/Navigations/Button/Profile Not Logged In"
    $profileNoLoggedIn = Get-Item -path $itemPathProfileNoLoggedIn -ErrorAction SilentlyContinue
    create-or-update-item -Item $profileNoLoggedIn -Path $itemPathProfileNoLoggedIn -TemplateId $imageLinkTemplateId -Children "$($viewBooking.ID)|$($myAccount.ID)|$($checkIn.ID)|$($login.ID)" -Showon 'Show On Loged Out'
    
    $itemPathProfileLoggedIn = "master:/content/EasyJet/Holidays/Data/Navigations/Button/Profile Logged In"
    $profileLoggedIn = Get-Item -path $itemPathProfileLoggedIn -ErrorAction SilentlyContinue
    create-or-update-item -Item $profileLoggedIn -Path $itemPathProfileLoggedIn -TemplateId $imageLinkTemplateId -Children "$($viewMyBookings.ID)|$($availableCredit.ID)|$($viewBooking.ID)|$($myAccount.ID)|$($checkIn.ID)|$($logout.ID)"
    
