- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    function Get-Rendering-Index ($item, $renderingItemId) {
        $i = 0
        Get-Rendering -Item $item | ForEach-Object {
            if ($_.ItemID -eq $renderingItemId) {
                return $i
            }
            $i++
        }
    }
    
    function Get-All-Renderings-From-Item($actPage){
         $result = @()
         $allRenderings = Get-Rendering -Item $actPage
         foreach($actRendering in $allRenderings){
             if($actRendering.ItemId -eq "{7910DC7C-14B7-48F1-9256-C570F700F085}"){
                 $result += $actRendering
             }
         }
         return $result
    }
    
    
    function Add-Rendering-And-Remove-Duplicates($page, $placeholderPath){
        $renderings = Get-All-Renderings-From-Item $page
        
        if($renderings.Count -gt 1){
            Write-Host "multiple renderings found - rendering variable is array"
            Write-Host "Updated one existing seat and bag rendering for $($page.Name) page and removed all other"
            Set-Rendering -Item $page -Instance $renderings[0] -DataSource $dataSourcePath -Placeholder $placeholderPath
            for ($i=1; $i -lt $renderings.Count; $i++){
                Remove-Rendering -Item $page -Instance $renderings[$i]
            }
        }else{
            if($renderings.Count -eq 1)
            {
                Set-Rendering -Item $page -Instance $renderings -DataSource $dataSourcePath -Placeholder $placeholderPath
                Write-Host "Updated existing seat and bag rendering for $($page.Name) page"
            }else{
                $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholderPath
                Add-Rendering -Item $page -Instance $renderingItem -DataSource $dataSourcePath -Placeholder $placeholderPath
                Write-Host "Created new seat and bag rendering for $($page.Name) page"
            }
        }
    }
    
    # rendering - general
    $renderingItemId = "{7910DC7C-14B7-48F1-9256-C570F700F085}"
    $renderingPath = "/sitecore/layout/Renderings/Feature/SeatMap/Seats And Bags"
    $renderingTemplateId = "{7910DC7C-14B7-48F1-9256-C570F700F085}"
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags"
    $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholderPath
    
    
    # booking page - seats and bags rendering
    $placeholderPathBooking = "/body/component-wrapper-inner-{87238c24-9199-4538-97a4-55db1ce624cf}-0/seats-and-bags-{13726815-39D8-4371-9811-69337E3148D1}-0"
    $bookingItem = Get-item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking"
    Add-Rendering-And-Remove-Duplicates $bookingItem $placeholderPathBooking
    ## update seat map rendering
    $renderingDefinitionSeatAndBags = Get-All-Renderings-From-Item $bookingItem
    $renderingDefinitionSeatMapIndex = Get-Rendering-Index $bookingItem "{F7F45094-B88B-47D0-975F-3854B4AE9A41}"
    $renderingDefinitionSeatMap = Get-Rendering -Item $bookingItem -Index $renderingDefinitionSeatMapIndex
    Set-Rendering -Item $bookingItem -Instance $renderingDefinitionSeatMap -Placeholder "/body/component-wrapper-inner-{87238c24-9199-4538-97a4-55db1ce624cf}-0/seats-and-bags-{13726815-39D8-4371-9811-69337E3148D1}-0/seat-map-$($renderingDefinitionSeatAndBags.UniqueId)-0"
    Write-Host "Updated seat map rendering placeholder"
    
    # my_booking page - seats and bags rendering
    $myBookingItem = Get-item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $placeholderPathMyBooking = "/body/seats-and-bags-{5500AC44-5DF4-4473-8E8C-EA635A187882}-0"
    Add-Rendering-And-Remove-Duplicates $myBookingItem $placeholderPathMyBooking
    
    # Confirmation page - seats and bags rendering
    $myBookingItem = Get-item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation"
    $placeholderPathMyBooking = "/body/seats-and-bags-{5d228e7e-0347-4e8e-ac47-d911eba730d7}-0"
    Add-Rendering-And-Remove-Duplicates $myBookingItem $placeholderPathMyBooking
    
    # remove seats and bags rendering under booking page components
    $pageComponentsSeatAndBagPath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Seat And Bags"
    $pageComponentsSeatAndBag = Get-Item -Path $pageComponentsSeatAndBagPath -ErrorAction SilentlyContinue
    if($pageComponentsSeatAndBag -ne $null){
        Get-Item -Path $pageComponentsSeatAndBagPath | Remove-Item -ErrorAction SilentlyContinue -Force
        Write-Host "deleted $($pageComponentsSeatAndBagPath)"
    }else{
       Write-Host "already removed: $($pageComponentsSeatAndBagPath)"
    }
    
