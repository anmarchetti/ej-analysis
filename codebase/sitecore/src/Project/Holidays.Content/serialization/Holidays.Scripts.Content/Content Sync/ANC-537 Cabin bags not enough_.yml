- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    $template = '{63D3079B-9A85-4872-AC5E-34D19D8D972E}'
    $path = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags/Cabin Bags Almost Full Banner'
    $banner = Get-Or-Create-Item -Path $path -Template $template
    if($banner -ne $null) {
        $banner.Editing.BeginEdit()
        $banner['Title'] = 'Large cabin bag capacity is almost full'
        $banner['Subtitle'] = 'There is not enough space on one or more flights for all passengers in your booking to add a large cabin bag.'
        $banner.Editing.EndEdit() | Out-Null
    }
    
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags/Cabin Bags Almost Full Banner'
    $bannerTrade = Get-Or-Create-Item -Path $tradePath -Template $template
    if($bannerTrade -ne $null) {
        $bannerTrade.Editing.BeginEdit()
        $bannerTrade['Title'] = 'Large cabin bag capacity is almost full'
        $bannerTrade['Subtitle'] = 'There is not enough space on one or more flights for all passengers in your booking to add a large cabin bag.'
        $bannerTrade.Editing.EndEdit() | Out-Null
    }
    
    $translations = @{
            "fr-CH" = @{
                "Title" = "La capacité de la grande valise cabine est presque pleine"
                "Subtitle" = "Il n'y a pas assez de place sur un ou plusieurs vols pour que tous les passagers de votre réservation puissent ajouter un grand bagage de cabine."
            }
            "fr-FR" = @{
                "Title" = "La capacité de la grande valise cabine est presque pleine"
                "Subtitle" = "Il n'y a pas assez de place sur un ou plusieurs vols pour que tous les passagers de votre réservation puissent ajouter un grand bagage de cabine."
            }
            "de-CH" = @{
                "Title" = "Der große Handgepäckraum ist fast voll"
                "Subtitle" = "Auf einem oder mehreren Flügen gibt es nicht genügend Platz für alle Passagiere Ihrer Buchung, um ein großes Handgepäckstück mitzunehmen."
            }
            "de-DE" = @{
                "Title" = "Der große Handgepäckraum ist fast voll"
                "Subtitle" = "Auf einem oder mehreren Flügen gibt es nicht genügend Platz für alle Passagiere Ihrer Buchung, um ein großes Handgepäckstück mitzunehmen."
            }
        }
        
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $banner -lang $lang -field "Title" -value $translations[$lang]["Title"]
        create-lang-version -item $banner -lang $lang -field "Subtitle" -value $translations[$lang]["Subtitle"]
    }
    
    $bagsItem =  Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags' -ErrorAction SilentlyContinue
    if($bagsItem -ne $null) {
        $bagsItem.Editing.BeginEdit()
        $bagsItem['CabinBagsAlmostFullBanner'] = $banner.ID
        $bagsItem['AddMaxCabinBagsButton'] = 'Add maximum cabin bags'
        $bagsItem['NoMoreLCBCapacityLabel'] = 'There is no more capacity for large cabin bags on these flights'
        $bagsItem.Editing.EndEdit() | Out-Null
    }
    
    $translationsBags = @{
            "fr-CH" = @{
                "AddMaxCabinBagsButton" = "Ajouter un maximum de bagages de cabine"
                "NoMoreLCBCapacityLabel" = "Il n'y a plus de capacité pour les grands bagages de cabine sur ces vols."
            }
            "fr-FR" = @{
                "AddMaxCabinBagsButton" = "Ajouter un maximum de bagages de cabine"
                "NoMoreLCBCapacityLabel" = "Il n'y a plus de capacité pour les grands bagages de cabine sur ces vols."
            }
            "de-CH" = @{
                "AddMaxCabinBagsButton" = "Maximal zulässiges Handgepäck hinzufügen"
                "NoMoreLCBCapacityLabel" = "Auf diesen Flügen gibt es keine Kapazität mehr für große Handgepäckstücke"
            }
            "de-DE" = @{
                "AddMaxCabinBagsButton" = "Maximal zulässiges Handgepäck hinzufügen"
                "NoMoreLCBCapacityLabel" = "Auf diesen Flügen gibt es keine Kapazität mehr für große Handgepäckstücke"
            }
        }
        
    foreach ($lang in $translationsBags.Keys) {
        create-lang-version -item $bagsItem -lang $lang -field "AddMaxCabinBagsButton" -value $translationsBags[$lang]["AddMaxCabinBagsButton"]
        create-lang-version -item $bagsItem -lang $lang -field "NoMoreLCBCapacityLabel" -value $translationsBags[$lang]["NoMoreLCBCapacityLabel"]
    } 
    
    $tradeBagsItem =  Get-Item -Path '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags' -ErrorAction SilentlyContinue
    if($tradeBagsItem -ne $null) {
        $tradeBagsItem.Editing.BeginEdit()
        $tradeBagsItem['CabinBagsAlmostFullBanner'] = $bannerTrade.ID
        $tradeBagsItem['AddMaxCabinBagsButton'] = 'Add maximum cabin bags'
        $tradeBagsItem['NoMoreLCBCapacityLabel'] = 'There is no more capacity for large cabin bags on these flights'
        $tradeBagsItem.Editing.EndEdit() | Out-Null
    }
    
