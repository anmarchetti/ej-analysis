Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-215 Update No Dates Availability Popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    
    $noDatePopup = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/No Dates Popup" -ErrorAction SilentlyContinue
    
    if ($noDatePopup -ne $null) {
        
        $contactFormItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us"
        
        @('fr-CH', 'fr-FR') | % {
               Create-Lang-Version -Item $noDatePopup -Lang $_ -Field "CTALink" -Value $("<link linktype='internal' id='$($contactFormItem.Id)' text='Contactez nous' />")
        }
        
        @('de-CH', 'de-DE') | % {
               Create-Lang-Version -Item $noDatePopup -Lang $_ -Field "CTALink" -Value $("<link linktype='internal' id='$($contactFormItem.Id)' text='Kontakt' />")
        }
    }
    
    Write-Host "Script was executed"
