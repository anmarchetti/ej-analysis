    $amenIPassengersItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Change Passengers Details" -ErrorAction SilentlyContinue;
    if ($amenIPassengersItem -ne $null) {
        $amenIPassengersItem.editing.BeginEdit();
        
        $amenIPassengersItem["CharacterLimitRestriction"] = "<p>Unfortunately you are unable to make a change to both the first name and surname by more than {charactersCount} characters in total.</p><p>However you can still make this change via our call center.</p><p>Please call {number} in order to make this change.</p>";
        
        $amenIPassengersItem.editing.EndEdit();
        Write-Host $amenIPassengersItem.Name "updated";
    }
    
