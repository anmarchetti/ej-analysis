Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SER-324 - View booking login banners"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    $myBookingPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    
    
    $notLoggedInBannerContentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Not Logged In Banner"
    
    $feedbackRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/Feedback Banner"
    $hotelSummaryRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/HotelSummary"
    $genericRecomHotelsRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Generic Recommended Hotels"
    
    
    function Remove-Old-Content() {
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Log In For More Info" -Permanently
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/LogIn To Make Changes" -Permanently
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/LogIn With Different Email" -Permanently
        
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Call To Action Blocks/Booking Check In" -Permanently
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Call To Action Blocks/Booking My Travel Documents" -Permanently
        Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Call To Action Blocks" -Permanently
    }
    
    function New-Content() {
        $updates = @(
        @{
            Path         = $notLoggedInBannerContentPath
            TemplatePath = "/sitecore/templates/Feature/PageContent/Call To Action Folder/Call To Action Blocks Folder"
        },
        @{
            Path         = $notLoggedInBannerContentPath + "/Logged With Different Email" 
            TemplatePath = "/sitecore/templates/Feature/PageContent/Call To Action Folder/Call To Action Block With Key"
            Fields      = @{
                "Title" = @{
                    "en"    = "Looking to make changes?"
                    "fr-CH" = "Vous souhaitez effectuer des modifications?"
                    "fr-FR" = "Vous souhaitez effectuer des modifications?"
                    "de-CH" = "Möchtest du Änderungen vornehmen?"
                    "de-DE" = "Möchtest du Änderungen vornehmen?"
                }
                "Description" = @{
                    "en"    = "Please make sure that you're logged in with the email address you used to make the booking."
                    "fr-CH" = "Veillez à vous connecter avec l’adresse e-mail que vous avez utilisée pour effectuer la réservation."
                    "fr-FR" = "Veillez à vous connecter avec l’adresse e-mail que vous avez utilisée pour effectuer la réservation."
                    "de-CH" = "Bitte vergewissere dich, dass du mit der E-Mail-Adresse eingeloggt bist, die du für die Buchung verwendet hast."
                    "de-DE" = "Bitte vergewissere dich, dass du mit der E-Mail-Adresse eingeloggt bist, die du für die Buchung verwendet hast."
                }
                "Icon" = @{
                    "en"    = "<image mediaid=""{2710E02E-944D-49ED-BA31-EA40163039EB}"" />"
                }
                
                "ButtonLabel" = @{
                    "en"    = "Log in with a different email"
                    "fr-CH" = "Se connecter avec un autre e-mail"
                    "fr-FR" = "Se connecter avec un autre e-mail"
                    "de-CH" = "Mit einer anderen E-Mail-Adresse anmelden"
                    "de-DE" = "Mit einer anderen E-Mail-Adresse anmelden"
                }
                "Key" = @{
                    "en"    = "LogWithDiffEmail"
                }
            }
        },
        @{
            Path         = $notLoggedInBannerContentPath + "/Not Logged In"
            TemplatePath = "/sitecore/templates/Feature/PageContent/Call To Action Folder/Call To Action Block With Key"
            Fields      = @{
                "Title" = @{
                    "en"    = "Lead customer? Log in to manage your holiday"
                    "fr-CH" = "Client principal? Connectez-vous pour gérer votre séjour"
                    "fr-FR" = "Client principal? Connectez-vous pour gérer votre séjour"
                    "de-CH" = "Hauptkunde? Logge dich ein, um deine Buchung zu verwalten"
                    "de-DE" = "Hauptkunde? Logge dich ein, um deine Buchung zu verwalten"
                }
                "Description" = @{
                    "en"    = "Log in using the email address you booked with to see more details. You’ll be able to download your travel documents and manage your booking from here."
                    "fr-CH" = "Connectez-vous en utilisant l’adresse e-mail avec laquelle vous avez effectué votre réservation pour obtenir plus de détails. Vous pourrez télécharger vos documents de voyage et gérer votre réservation à partir d’ici."
                    "fr-FR" = "Connectez-vous en utilisant l’adresse e-mail avec laquelle vous avez effectué votre réservation pour obtenir plus de détails. Vous pourrez télécharger vos documents de voyage et gérer votre réservation à partir d’ici."
                    "de-CH" = "Melde dich mit der E-Mail-Adresse an, die du bei der Buchung verwendet hast, um weitere Details zu sehen. Von hier aus kannst du deine Reisedokumente herunterladen und deine Buchung verwalten."
                    "de-DE" = "Melde dich mit der E-Mail-Adresse an, die du bei der Buchung verwendet hast, um weitere Details zu sehen. Von hier aus kannst du deine Reisedokumente herunterladen und deine Buchung verwalten."
                }
                "Icon" = @{
                    "en"    = "<image mediaid=""{CE053FE2-D517-417C-92CE-0127D59082DA}"" />"
                }
                
                "ButtonLabel" = @{
                    "en"    = "Log In"
                    "fr-CH" = "Connexion"
                    "fr-FR" = "Connexion"
                    "de-CH" = "Anmelden"
                    "de-DE" = "Anmelden"
                }
                "Key" = @{
                    "en"    = "NotLoggedIn"
                }
            }
        }
    )
        ImportContent -itemsToCreate $updates
        
        Add-ItemLanguage -Path $notLoggedInBannerContentPath -TargetLanguage 'fr-CH' -IfExist Skip -DoNotCopyFields;
        Add-ItemLanguage -Path $notLoggedInBannerContentPath -TargetLanguage 'fr-FR' -IfExist Skip -DoNotCopyFields;
        Add-ItemLanguage -Path $notLoggedInBannerContentPath -TargetLanguage 'de-CH' -IfExist Skip -DoNotCopyFields;
        Add-ItemLanguage -Path $notLoggedInBannerContentPath -TargetLanguage 'de-DE' -IfExist Skip -DoNotCopyFields;
    }
    
    
    function Update-Rendering() {
        $page = Get-Item -Path $myBookingPagePath
        $rendering = Get-Rendering -Item $page -UniqueId "{975B303F-78ED-4FB3-9BCC-5BAD0AFCB53C}"
       
       if ($rendering -ne $null) {
           Set-Rendering -Item $page -Instance $rendering -Datasource $notLoggedInBannerContentPath
           Write-Host "Not Logged In Banner data source updated on View Booking page";
       }
    }
    
    Remove-Old-Content
    New-Content
    Update-Rendering
