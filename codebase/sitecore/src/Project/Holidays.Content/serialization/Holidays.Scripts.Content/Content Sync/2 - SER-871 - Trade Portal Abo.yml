- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancelled Booking/Page Components/Cancellation Breakdown"
                TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Cancellation Breakdown Folder/Cancellation Breakdown"
                Fields      = @{
                    "Title" = @{
                        "en" = "About your cancellation"
                    }
                    "Subtext" = @{
                        "en" = "The holiday you booked on {date} has been cancelled, we’ve sent you an email to confirm."
                    }
                    "BottomText" = @{
                        "en" = "Have a problem with your cancellation or refund? <a href=""~/link.aspx?_id=2B6CE68AD26248B8B69A9280687170ED&amp;_z=z"">Get in touch</a> with our support team."
                    }
                    "__Sortorder" = @{
                        "en" = "500"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancelled Booking/Page Components/Cancellation Breakdown/Date"
                TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Cancellation Breakdown Folder/Cancellation Breakdown Item"
                Fields      = @{
                    "UniqueId" = @{
                        "en" = "date"
                    }
                    "Title" = @{
                        "en" = "Holiday cancelled"
                    }
                    "__Sortorder" = @{
                        "en" = "100"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancelled Booking/Page Components/Cancellation Breakdown/Email"
                TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Cancellation Breakdown Folder/Cancellation Breakdown Item"
                Fields      = @{
                    "UniqueId" = @{
                        "en" = "email"
                    }
                    "Title" = @{
                        "en" = "Confirmation email"
                    }
                    "__Sortorder" = @{
                        "en" = "200"
                    }
                }
            }
        )
        
    ImportContent -itemsToCreate $updates
    
    $page= Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancelled Booking"
    
    $renderingBookingContextProvider  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Booking/BookingContextProvider"
    
    $pageRenderingBookingContextProvider = Get-Rendering -Item $page -Rendering $renderingBookingContextProvider
    $uniqueID_BookingContextProvider = $pageRenderingBookingContextProvider.UniqueId
    
    
    $renderingMasonryWrapper  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper"
    $pageRenderingMasonryWrapper = Get-Rendering -Item $page -Rendering $renderingMasonryWrapper
    $uniqueID_MasonryWrapper = $pageRenderingMasonryWrapper.UniqueId
    
    
    $renderingMasonryWrapperItem  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    $instanceComponentWrapperItem = New-Rendering -Item $renderingMasonryWrapperItem
    Add-Rendering -Item $page -Instance $instanceComponentWrapperItem -PlaceHolder "/body/booking-context-$($uniqueID_BookingContextProvider)-0/masonry-section-$($uniqueID_MasonryWrapper)-0"
    $pageRenderingMasonryWrapperItem = Get-Rendering -Item $page -Rendering $renderingMasonryWrapperItem
    $uniqueID_MasonryWrapperItem = $pageRenderingMasonryWrapperItem[1].UniqueId
    
    
    $renderingBreakdown  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Booking/Cancellation Breakdown"
    $instanceBreakdown = New-Rendering -Item $renderingBreakdown
    Add-Rendering -Item $page -Instance $instanceBreakdown -PlaceHolder "/body/booking-context-$($uniqueID_BookingContextProvider)-0/masonry-section-$($uniqueID_MasonryWrapper)-0/masonry-item-$($uniqueID_MasonryWrapperItem)-0" -DataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancelled Booking/Page Components/Cancellation Breakdown"
