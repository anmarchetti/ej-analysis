SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $upperWrapper = '/body/component-wrapper-inner-{454bceff-430f-49dc-9088-9ff2d3dccb85}-0'
    $lowerWrapper = '/body/component-wrapper-inner-{a9e1b04c-7882-47ed-80ce-eb001faabbf6}-0'
    $bagsWrapper = '/body/component-wrapper-inner-{454bceff-430f-49dc-9088-9ff2d3dccb85}-0/bags-{13726815-39D8-4371-9811-69337E3148D1}-0'
    $booking = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking"
    
    $luggageRenderingId = '{A9AB43A5-41EA-40AD-AC79-0343E6AD5111}'
    $bagsRenderingId = '{9FD91E19-714F-4313-9E52-FF77B4E9F030}'
    $boardsRenderingId = '{5F21DED9-4FB3-4407-8F58-F779D18B142F}'
    $roomTypesRenderingId = '{A07E8AAB-47FD-436E-9BA7-39086751D37B}'
    $lateCheckoutRenderingId = '{B97059BD-C924-4211-951E-FF95765CB9C8}'
    $specialRequestRenderingId = '{2A35FBE1-E039-4D16-B301-37FD96B0C10F}'
    
    function Update-Placeholder ($renderingId, $placeholder) {
        $rendering = Get-Rendering -Item $booking | Where-Object {$_.ItemId -eq $renderingId}
        if($rendering -ne $null){
            $rendering.Placeholder = $placeholder
            Set-Rendering -Item $booking -Instance $rendering
            Write-Host "Placeholder updated"
        }
    }
    
    function Get-Rendering-Index ($item, $renderingItemId) {
        $i = 0
        Get-Rendering -Item $item | ForEach-Object {
            if ($_.ItemID -eq $renderingItemId) {
                return $i
            }
            $i++
        }
    }
    
    Update-Placeholder -renderingId $luggageRenderingId -placeholder $upperWrapper
    Update-Placeholder -renderingId $bagsRenderingId -placeholder $bagsWrapper
    Update-Placeholder -renderingId $boardsRenderingId -placeholder $lowerWrapper
    Update-Placeholder -renderingId $roomTypesRenderingId -placeholder $lowerWrapper
    Update-Placeholder -renderingId $lateCheckoutRenderingId -placeholder $lowerWrapper
    Update-Placeholder -renderingId $specialRequestRenderingId -placeholder $lowerWrapper
    
    $roomTypesIndex = Get-Rendering-Index -item $booking -renderingItemId $roomTypesRenderingId
    $insertIndex = $roomTypesIndex + 1
    $lateRendering = Get-Rendering -Item $booking | Where-Object {$_.ItemId -eq $lateCheckoutRenderingId}
    Set-Rendering -Item $booking -Instance $lateRendering -Index $insertIndex
    
