SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $holidaysPath = "/sitecore/content/EasyJet/Holidays/Settings";
    $tradePortalPath = "/sitecore/content/EasyJet/TradePortal/Settings"
    $itemName = "List of Results Settings";
    $itemTemplateId = "{86D6B29F-A4CF-4511-BB13-F521274E6944}";
    
    function createSettings($path, $name, $templateId) {
        $item = Get-Item -path "$($path)/$($name)" -ErrorAction SilentlyContinue
    
        if ($item -eq $null) {
            $item = New-Item -Path $path -ItemType $templateId -Name $name
            Write-Host "Item" $item.Name "successfully created"
        }
        else
        {
           Write-Host ($path)/($name) " already exists"
        }
    }
    
    createSettings -path $holidaysPath -name $itemName -templateId $itemTemplateId
    createSettings -path $tradePortalPath -name $itemName -templateId $itemTemplateId
    
