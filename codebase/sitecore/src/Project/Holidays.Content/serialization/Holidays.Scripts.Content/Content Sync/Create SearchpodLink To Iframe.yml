SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    # Page
    $pagePath = "/sitecore/content/EasyJet/Holidays/Home/IFrame Search Pod"
    $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    
    if ($page) {
        Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/IFrame Search Pod/Page Components" -templateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}";
        $searchpodLink = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/IFrame Search Pod/Page Components/Searchpod Link" -templateId "{E7D2A87F-14F2-450E-96BA-B976235956D2}" ;
        $searchpodLinkPlaceHolder= 'body'
        $searchpodLinkRenderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Searchpod Link"
        $searchpodLinkItem = Get-Item -Database "master" -Path $searchpodLinkRenderingPath | New-Rendering -Placeholder $searchpodLinkPlaceHolder
        Add-Rendering -Item $page -PlaceHolder $searchpodLinkPlaceHolder -Instance $searchpodLinkItem  -DataSource "/sitecore/content/EasyJet/Holidays/Home/IFrame Search Pod/Page Components/Searchpod Link"
        
    }
    
