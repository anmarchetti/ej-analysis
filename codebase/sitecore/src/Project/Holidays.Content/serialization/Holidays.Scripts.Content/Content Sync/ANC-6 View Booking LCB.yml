SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Define paths and rendering IDs
    $renderingIdCabinBags = "{EDCABB4F-676C-4418-BBEE-4E0009F946E5}"
    $cabinBagsDSHolidaysPath = "/sitecore/content/EasyJet/Holidays/Data/Cabin Bags"
    $cabinBagsDSTradePath = "/sitecore/content/EasyJet/TradePortal/Data/Cabin Bags"
    
    # New page paths
    $pageHoliday = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $pageTrade = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking"
    
    # Function to add rendering to a page
    function Add-RenderingToPage($page, $renderingIdToAdd, $dataSourcePath, $placeholder){
        $dataSource = Get-Item -Path $dataSourcePath
        $newRendering = Get-Item -Database "master" -Path $renderingIdToAdd | New-Rendering
        Add-Rendering -Item $page -Instance $newRendering -PlaceHolder $placeholder -DataSource $dataSource.ID
    }
    
    $renderingPlaceholderHoliday = "/body/seats-and-bags-{5500AC44-5DF4-4473-8E8C-EA635A187882}-0"
    
    $renderingWrapperTrade = Get-Rendering -Item $pageTrade | Where-Object {$_.ItemId -eq '{9DD5E883-9307-49FB-82F8-D8D778A828E0}'}
    $renderingPlaceholderTrade = "/body/seats-and-bags-$($renderingWrapperTrade.UniqueId)-0"
    
    # Add rendering to the specified pages
    Add-RenderingToPage -page $pageHoliday -renderingIdToAdd $renderingIdCabinBags -dataSourcePath $cabinBagsDSHolidaysPath -placeholder $renderingPlaceholderHoliday
    Add-RenderingToPage -page $pageTrade -renderingIdToAdd $renderingIdCabinBags -dataSourcePath $cabinBagsDSTradePath -placeholder $renderingPlaceholderTrade
    
    Write-Host "Cabin Bags rendering was successfully added to both My Booking and View Booking confirmation pages."
    
