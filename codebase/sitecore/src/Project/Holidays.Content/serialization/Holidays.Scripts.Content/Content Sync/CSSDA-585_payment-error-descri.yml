DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $amendPaymentItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment" -ErrorAction SilentlyContinue;
        
    if ($amendPaymentItem -ne $null) {
        $enText = "We've been unable to make this change to your {transport}.<br />If you have been charged, this will be refunded";
        $frText = "Nous n'avons pas pu apporter cette modification à votre {transport}.<br />Si des frais vous ont été facturés, ils vous seront remboursés.";
        $deText = "Wir konnten diese Änderung an Ihrem {transport} nicht vornehmen.<br />Wenn Ihnen eine Gebühr in Rechnung gestellt wurde, wird diese erstattet";
        
        $amendPaymentItem.Editing.BeginEdit();
        $amendPaymentItem["PaymentErrorDescription"] = $enText;
        
        # Creating languages versions
    	@('fr-CH', 'fr-FR') | % {
           Create-Lang-Version -Item $amendPaymentItem -Lang $_ -Field "PaymentErrorDescription" -Value $frText;
        }
        @('de-CH', 'de-DE') | % {
           Create-Lang-Version -Item $amendPaymentItem -Lang $_ -Field "PaymentErrorDescription" -Value $deText;
        }
             
        $amendPaymentItem.Editing.EndEdit() | Out-Null;
             
        Write-Host $amendPaymentItem.Name "Updated";
    }
