- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    # Remove existing Product Unavailable Popup from amend payment page 
    $amendPaymentPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment"
    $amendPaymentPage = Get-Or-Create-Item -Path $amendPaymentPagePath
    $amendPaymentRenderingInstance = Get-Rendering -Item $amendPaymentPage -PlaceHolder "body" -DataSource "{8B09703F-E23F-4A3B-A818-F59AEA6741D0}";
    if ($amendPaymentRenderingInstance -ne $null) {
    	Remove-Rendering -Path $amendPaymentPagePath -Instance $amendPaymentRenderingInstance;
    	Write-Host "Amend payment page Product Unavailable Popup rendering removed";
    }
    
    
    
