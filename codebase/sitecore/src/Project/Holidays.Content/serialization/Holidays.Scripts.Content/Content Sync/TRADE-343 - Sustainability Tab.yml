    # Renderings
    $page = Get-Item -Path $sustainabilityPagePath -ErrorAction SilentlyContinue
    
    $heroBannerIndex = Get-Rendering-Index -Item $page -RenderingItemId "{DEBE445D-27F2-44DA-8FD4-F4FD95BDBFF1}" | Select -First 1
    
    # Add Tab Links Rendering
    if($heroBannerIndex -ne -1){
        $tabsIndex = $heroBannerIndex + 1
        $tabsRendering = Get-Item -Path "master:/sitecore/layout/Renderings/Feature/PageContent/Tabs" | New-Rendering -Placeholder "body"
    
        Add-Rendering -Item $page -PlaceHolder "body" -Instance $tabsRendering -DataSource $tabs.FullPath -Index $tabsIndex -FinalLayout -Language "en"
        Get-Rendering -Item $page -Index $tabsIndex -FinalLayout -Language "en" | Set-RenderingParameter -Parameter @{ IsSticky = "1" } | Set-Rendering -Item $page -FinalLayout -Language "en"
    
        Write-Host "Added a rendering for the Tab Links"
    }
    
    # Remove wrong parameter for items with body placeholders 
    Get-Rendering -Item $page -Placeholder "body" | Remove-RenderingParameter -Name "SliceDirection" | Set-Rendering -Item $page
    Get-Rendering -Item $page -Placeholder "body" -FinalLayout -Language "en" | Remove-RenderingParameter -Name "SliceDirection" | Set-Rendering -Item $page -FinalLayout -Language "en"
    
    $wrapperRenderingId = "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"
    $slicedBannerRenderingId = "{9D9AB0BA-3BC2-4D03-B3C5-E861794EC9BD}"
    
    $pageWrappersIndexes = Get-Rendering-Index -Item $page -RenderingItemId $wrapperRenderingId
    $slicedBannersIndexes = Get-Rendering-Index -Item $page -RenderingItemId $slicedBannerRenderingId
    
    # Add anchor rendering parameters
    Get-Rendering -Item $page -Index $pageWrappersIndexes[0] -FinalLayout -Language "en" | Set-RenderingParameter -Parameter @{
        Anchor = "our-mission"
    } | Set-Rendering -Item $page -FinalLayout -Language "en"
    
    Get-Rendering -Item $page -Index $pageWrappersIndexes[1] -FinalLayout -Language "en" | Set-RenderingParameter -Parameter @{
        Anchor = "our-approach"
    } | Set-Rendering -Item $page -FinalLayout -Language "en"
    
    Get-Rendering -Item $page -Index $slicedBannersIndexes[0] -FinalLayout -Language "en" | Set-RenderingParameter -Parameter @{
        Anchor = "our-work"
        SliceDirection = "right"
    } | Set-Rendering -Item $page -FinalLayout -Language "en"
    
