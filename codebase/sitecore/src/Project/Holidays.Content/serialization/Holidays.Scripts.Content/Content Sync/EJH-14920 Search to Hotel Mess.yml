  Hint: Script
  Value: |
    $item = Get-Item -Path "master:/content/EasyJet/Holidays/Settings/Search Pod Settings" -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
    	$item.Editing.BeginEdit()
    	$item["IsSearchToHotelMessageEnabled"] = "1"
    	$item["SearchToHotelMessageTitle"] = "Want to change your search to {hotelName}?"
    	$item["SearchToHotelMessageText"] = "Click here to search this hotel"
    	$item["SearchToHotelMessageIcon"] = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
    	$item.Editing.EndEdit() | Out-Null;
    
    	Write-Host $item.Name "updated";
    } 
