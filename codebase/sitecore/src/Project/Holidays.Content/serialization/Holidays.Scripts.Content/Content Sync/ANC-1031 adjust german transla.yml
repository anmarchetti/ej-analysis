  Hint: Script
  Value: |
    $translationPath = 'master:/sitecore/content/EasyJet/Holidays/Data/Compare Price Modules/Price Graph and Calendar Module'
    
    function updateTranslation($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    updateTranslation -itemPath $translationPath -language 'de-DE' -key 'ReservationNotificationDescription' -translation "Die unten aufgeführten alternativen Flugpreise beinhalten kein großes Handgepäck, kein aufgegebenes Gepäck und keine Sitzplätze, die Sie für einen Wert von {price} reserviert haben. Wenn Sie Ihre Flüge ändern, müssen Sie diese zusätzlichen Extras erneut auswählen."
    updateTranslation -itemPath $translationPath -language 'de-CH' -key 'ReservationNotificationDescription' -translation "Die unten aufgeführten alternativen Flugpreise beinhalten kein großes Handgepäck, kein aufgegebenes Gepäck und keine Sitzplätze, die Sie für einen Wert von {price} reserviert haben. Wenn Sie Ihre Flüge ändern, müssen Sie diese zusätzlichen Extras erneut auswählen."
