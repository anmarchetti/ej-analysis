    function set-coordinates($path, $latitude, $longtitude){
        $item =  Get-Item -Path $path
        
        $item.Editing.BeginEdit()
        $item["Longitude"] = $longtitude
        $item["Latitude"] = $latitude
        $item.Editing.EndEdit()
    }
    
