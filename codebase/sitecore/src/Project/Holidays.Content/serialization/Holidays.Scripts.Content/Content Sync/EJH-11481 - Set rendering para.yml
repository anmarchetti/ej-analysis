Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-11481 - Set rendering parameter for Slim Header"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $rendering = Get-Item -Path "master:/templates/Foundation/Presentation/Rendering Parameters/Page Header Rendering Parameters"
    
    $item = Get-Item -Path "master:/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Header" 
    
    $renderingInstance = Get-Rendering -Item $item -Rendering $rendering 
    
    if ($renderingInstance) { 
        Set-Rendering -Item $item -Instance $renderingInstance -Parameter @{ 
            "IsHeaderSlim" = "1" 
        } 
        Write-Host "Updated $($item.Paths.FullPath)" 
    }
