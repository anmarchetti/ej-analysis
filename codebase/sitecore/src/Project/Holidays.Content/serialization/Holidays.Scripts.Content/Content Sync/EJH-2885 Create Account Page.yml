Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-2885 Create Account Page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Update-Rendering-DataSource ($item,$renderingId,$newDataSource) {
    	$rendering = Get-Rendering -Item $item | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    
    $pageTemplateId = "{FA1A1EED-7B68-49AC-8C04-0357DC71A450}"
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design" -pageTemplateId $pageTemplateId
    
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" -ItemName "Create Account" -TemplateId $pageTemplateId
    
    $page.Editing.BeginEdit();
    $page["Name"] = "Member Registration"
    $page["Subtitle"] = "Just to let you know"
    $page["PageDescription"] = "In the rare event that we will need to notify you of changes to your booking, we will contact you via your registered email address or mobile telephone number. From time to time we may use these details to contact you to help us improve our service through customer research and, if you’ve indicted below, to send you digital updates about special offers."
    $page.Editing.EndEdit() | Out-Null
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create Create Account Component
    $createAccountComponent = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Create Account" -TemplateId "{AF32CA20-1619-422F-9BF7-2D98757383F9}"
    $createAccountComponent.Editing.BeginEdit();
    $createAccountComponent["LoginDetailsTitle"] = "Your log in details"
    $createAccountComponent["LoginDetailsDescription"] = "Please enter the chosen email address and password you’ ll use to log in"
    $createAccountComponent["AccountDetailsTitle"] = "Your account details"
    $createAccountComponent["AccountDetailsDescription"] = "Tell us more about you"
    $createAccountComponent["AirportsTitle"] = "Your chosen airports"
    $createAccountComponent["AirportsDescription"] = "Tell us where you’ d like to fly from?"
    $createAccountComponent["OffersTitle"] = "easyjet offers & updates"
    $createAccountComponent["OffersDescription"] = "how do you want us to communicate with you"
    $createAccountComponent.Editing.EndEdit() | Out-Null
    
    
    # Update Rendering
    $createAccountComponentRenderingId = "{DE1D20DE-6D26-40FB-AB31-987E88953AD7}"
    Update-Rendering-DataSource -Item $page -RenderingId $createAccountComponentRenderingId -NewDataSource $createAccountComponent.ID
    
    # Guest Details Settings
    $guestDetailsSettings = Get-Item "/sitecore/content/EasyJet/Holidays/Settings/Guest Details" -ErrorAction SilentlyContinue
    if ($guestDetailsSettings -ne $null) {
    	$guestDetailsSettings.Editing.BeginEdit();
    	$guestDetailsSettings["PasswordValidationRules"] = @"
    <ul>
        <li>A single word between 10-20 characters</li>
        <li>You can use letters, numbers &amp; special characters (except # &amp; + = or space)</li>
        <li>You must use at least 1 number, 1 lowercase letter &amp; 1 uppercase letter</li>
        <li>It cannot start with a 0</li>
    </ul>
    "@
    	$guestDetailsSettings.Editing.EndEdit() | Out-Null
    	Write-Host "Guest Details Settings updated"
    }
    
    
