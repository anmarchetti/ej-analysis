Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-695 - Copy EUX Holidays settings items to Tradeportal"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $globalMaintenanceModeOriginPath = '/sitecore/content/EasyJet/Holidays/Settings/Global - Maintenance Mode'
    $ukMaintenanceModeOriginPath = '/sitecore/content/EasyJet/Holidays/Settings/Global - Maintenance Mode/UK - Maintenance Mode'
    $globalMaintenanceModeDestinationPath = '/sitecore/content/EasyJet/TradePortal/Settings/Global - Maintenance Mode'
    $ukMaintenanceModeDestinationPath = '/sitecore/content/EasyJet/TradePortal/Settings/Global - Maintenance Mode/UK - Maintenance Mode'
    
    $currenciesFolderOrigin = '/sitecore/content/EasyJet/Holidays/Data/Currencies'
    $gbpOrigin = '/sitecore/content/EasyJet/Holidays/Data/Currencies/GBP'
    $currenciesFolderDestination = '/sitecore/content/EasyJet/TradePortal/Data/Currencies'
    $gbpDestination = '/sitecore/content/EasyJet/TradePortal/Data/Currencies/GBP'
    
    $marketSettingsOriginPath = '/sitecore/content/EasyJet/Holidays/Settings/Market Settings'
    $ukMarketSettingsOriginPath = '/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom'
    $marketSettingsDestinationPath = '/sitecore/content/EasyJet/TradePortal/Settings/Market Settings'
    $ukMarketSettingsDestinationPath = '/sitecore/content/EasyJet/TradePortal/Settings/Market Settings/United Kingdom'
    
    Copy-Item -Path $globalMaintenanceModeOriginPath -Destination $globalMaintenanceModeDestinationPath -PassThru
    Copy-Item -Path $ukMaintenanceModeOriginPath -Destination $ukMaintenanceModeDestinationPath -PassThru
    
    Copy-Item -Path $marketSettingsOriginPath -Destination $marketSettingsDestinationPath -PassThru
    Copy-Item -Path $ukMarketSettingsOriginPath -Destination $ukMarketSettingsDestinationPath -PassThru
    
    Copy-Item -Path $currenciesFolderOrigin -Destination $currenciesFolderDestination -PassThru
    Copy-Item -Path $gbpOrigin -Destination $gbpDestination -PassThru
    
    
    $tradeGBPPath = "master:" + $gbpDestination
    $tradePortalGBP = Get-Item -Path $tradeGBPPath
    $gbpIDToSet = $tradePortalGBP.ID
    
    $retrievalPath = 'master:'+$ukMarketSettingsDestinationPath
    
    $tradePortalUkMarket = Get-Item -Path $retrievalPath
    $tradePortalUkMarket.Editing.BeginEdit()
    $tradePortalUkMarket["Currency"] = $gbpIDToSet
    $tradePortalUkMarket.Editing.EndEdit()
