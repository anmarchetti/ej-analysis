- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $linkPath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/Page Components/Partnership Component"
    $item = Get-Item -path $linkPath
    
    if ($item -ne $null) {
        $myBookingListGeneric = 'utm_source=My-Booking-List&utm_campaign=generic&utm_medium=web'
        
        $item.Editing.BeginEdit()
        [Sitecore.Data.Fields.LinkField]$field = $item.Fields["Link"]
        
        if($field.Url.indexOf('?') -gt -1) {
            $field.Url = $field.Url + '&' + $myBookingListGeneric
        } else {
            $field.Url = $field.Url + '?' + $myBookingListGeneric
        }
        
        $item.Editing.EndEdit()
    }
