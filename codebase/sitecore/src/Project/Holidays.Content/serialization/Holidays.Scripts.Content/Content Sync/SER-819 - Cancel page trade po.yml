Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SER-819 - Cancel page trade portal"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    $defaultDesign = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Presentation/Page Designs/Slim Design"
    $pageTemplatesField = $defaultDesign.Fields['PageTemplates'].Value
    $newValue = $pageTemplatesField + "|{0706E087-BAD7-4378-9AD8-FB036F8C9C6B}"
    
    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Presentation/Page Designs/Slim Design"
                TemplatePath = "/sitecore/templates/Foundation/Presentation/Page Design"
                Fields      = @{
                    "PageTemplates" = @{
                        "en" = $newValue
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking"
                TemplatePath = "/sitecore/templates/Project/Trade Portal/Pages/Cancel Booking Page"
                Fields      = @{
                    "Name" = @{
                        "en" = "Cancel Booking"
                    }
                    "PageTitle" = @{
                        "en" = "Cancel Booking"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components"
                TemplatePath = "/sitecore/templates/Project/Trade Portal/Page Components"
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking Header"
                TemplatePath = "/sitecore/templates/Feature/Booking/Cancel Booking/Cancel Booking Header"
                Fields      = @{
                    "Title" = @{
                        "en" = "Cancel holiday"
                    }
                    "Subtitle" = @{
                        "en" = "We're sorry to hear {passengerName} {surname} has changed their mind but you can cancel the holiday in three simple steps below."
                    }
                    "__Sortorder" = @{
                        "en" = "100"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking"
                TemplatePath = "/sitecore/templates/Feature/Booking/Cancel Booking/Cancel Booking"
                Fields      = @{
                    "StepOneTitle" = @{
                        "en" = "REVIEW HOLIDAY"
                    }
                    "StepTwoTitle" = @{
                        "en" = "REVIEW REFUND"
                    }
                    "StepThreeTitle" = @{
                        "en" = "CANCEL HOLIDAY"
                    }
                    "ImportantInfoTitle" = @{
                        "en" = "Important information"
                    }
                    "ImportantInfo" = @{
                        "en" = "When you click ‘Confirm’, we’ll cancel the holiday straight away. We’ll process the cancellation for the amount shown, and you and your customer will receive confirmation by email. Once you’ve made this change, you won’t be able to reverse it."
                    }
                    "ConfirmationCheckboxDescription" = @{
                        "en" = "Tick this box to confirm you agree to proceed with cancelling this booking, including agreeing to our <a href=""~/link.aspx?_id=D6E61E9474FC46CCACF00B90AB6F41CA&amp;_z=z"" target=""_blank"">terms and conditions</a>&nbsp;for any refund issued."
                    }
                    "ConfirmButtonLabel" = @{
                        "en" = "Cancel holiday"
                    }
                    "FailedToLoadPopupButtonLabel" = @{
                        "en" = "Back to view booking"
                    }
                    "FailedToLoadPopupDescription" = @{
                        "en" = "Sorry, but an error has occurred, and we can’t continue with your holiday cancellation right now. Please try again later."
                    }
                    "FailedToLoadPopupTitle" = @{
                        "en" = "Error loading cancellation options"
                    }
                    "TotalCost" = @{
                        "en" = "Total paid"
                    }
                    "AmountPaidExcludeDeposit" = @{
                        "en" = "Holiday balance"
                    }
                    "PriceBreakdownTitle" = @{
                        "en" = "Refund Breakdown"
                    }
                    "PriceBreakdownTitleStepOne" = @{
                        "en" = "Price Breakdown"
                    }
                    "Deposit" = @{
                        "en" = "Deposit ({price})"
                    }
                    "PaidLabel" = @{
                        "en" = "Total paid"
                    }
                    "CancellationChargeLabel" = @{
                        "en" = "Cancellation Charge"
                    }
                    "ChangeFeeLabel" = @{
                        "en" = "Change Fee(s)"
                    }
                    "CancellationChargeTotalLabel" = @{
                        "en" = "Total fees"
                    }
                    "ErrorPopupTitle" = @{
                        "en" = "Cancellation failed"
                    }
                    "RefundAmount" = @{
                        "en" = "Refund Amount"
                    }
                    "ErrorPopupDescription" = @{
                        "en" = @'
    <p>Sorry, but an error has occurred, and we have been unable to process your holiday cancellation. Please try again.</p>
    <p>Please call the call centre for additional support</p>
    <a href="tel:+44 20 8163 8121">+44 20 8163 8121</a>
    '@
                    }
                    "ErrorPopupButtonLabel" = @{
                        "en" = "Back to view booking"
                    }
                    "SportEquipmentsLabel" = @{
                        "en" = "Sports equipment"
                    }
                    "PramName" = @{
                        "en" = "Pram or Pushchair"
                    }
                    "LuggageInfoTitle" = @{
                        "en" = "Your luggage"
                    }
                    "__Sortorder" = @{
                        "en" = "200"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Explanation Popup Folder"
                TemplatePath = "/sitecore/templates/Feature/Booking/Cancel Booking/Explanation Popup Folder"
                Fields       = @{
                    "__Sortorder" = @{
                        "en" = "300"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Explanation Popup Folder/Original Payment"
                TemplatePath = "/sitecore/templates/Feature/Booking/Cancel Booking/Explanation Popup"
                Fields      = @{
                    "IsLinkVisible" = @{
                        "en" = "1"
                    }
                    "LinkText" = @{
                        "en" = "Why is the refund this way?"
                    }
                    "TitlePopup" = @{
                        "en" = "Why is the refund this way?"
                    }
                    "TextPopup" = @{
                        "en" = @'
    <p>We&rsquo;re sorry this holiday isn&rsquo;t right for your customer. When booking we took a {depositPricePP} deposit to secure their holiday, which is non-refundable.</p>
    <p>We&rsquo;ll refund any amount your customer paid above their deposit to your agency&rsquo;s original payment method.</p>
    <p>You can make this change yourself as long there are more than 28 days before departure. </p>
    <p>For more information about deposits, refunds, cancellation charges, please see our <strong><a href="~/link.aspx?_id=D6E61E9474FC46CCACF00B90AB6F41CA&amp;_z=z" target="_blank">booking conditions</a></strong>. Terms and conditions apply.</p>
    '@
                    }
                    "PopupUniqueId" = @{
                        "en" = "TradeBookingRefund"
                    }
                }
            }
            @{
                Path         = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking/Original Payment"
                TemplatePath = "/sitecore/templates/Feature/Booking/Cancel Booking/Refund Option"
                Fields      = @{
                    "RefundUniqueId" = @{
                        "en" = "OriginalPayment"
                    }
                    "OptionTitle" = @{
                        "en" = "Original payment method"
                    }
                    "CashLabel" = @{
                        "en" = "Refunded to original payment method"
                    }
                    "TotalLabel" = @{
                        "en" = "Total"
                    }
                }
            }
        )
        
    ImportContent -itemsToCreate $updates
    
    $item = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking/Original Payment" -ErrorAction SilentlyContinue
    $popupID = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Explanation Popup Folder/Original Payment" -ErrorAction SilentlyContinue
    
    $item.Editing.BeginEdit()
    $item['Popups'] = $popupID.ID
    $item.Editing.EndEdit() | Out-Null
    
    $page= Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking"
        
    $renderingHeader  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Booking/Cancel Booking/Cancel Booking Header"
    $instanceHeader = New-Rendering -Item $renderingHeader
    Add-Rendering -Item $page -Instance $instanceHeader -PlaceHolder "/body" -DataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking Header"
    
    
    $renderingBody  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Booking/Cancel Booking/Cancel Booking"
    $instanceBody = New-Rendering -Item $renderingBody
    Add-Rendering -Item $page -Instance $instanceBody -PlaceHolder "/body" -DataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Cancel Booking/Page Components/Cancel Booking"
    
