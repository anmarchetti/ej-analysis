  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    $mobileBasketDataItem = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Mobile Basket" -Template "{09629AF1-47CB-4F21-B8D8-2EDE8608FEE7}"
    Add-ItemLanguage -Item $mobileBasketDataItem -TargetLanguage "fr-CH" -IfExist Skip -DoNotCopyFields
    Add-ItemLanguage -Item $mobileBasketDataItem -TargetLanguage "fr-FR" -IfExist Skip -DoNotCopyFields
    Add-ItemLanguage -Item $mobileBasketDataItem -TargetLanguage "de-DE" -IfExist Skip -DoNotCopyFields
    Add-ItemLanguage -Item $mobileBasketDataItem -TargetLanguage "de-CH" -IfExist Skip -DoNotCopyFields
