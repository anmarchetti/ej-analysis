Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Guest Details AB Testing
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $pageComponentsPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components"
    $guestDetailsPath = "$($pageComponentsPath)/Guest Details Info"
    $guestDetailsSignInPath = "$($pageComponentsPath)/Guest Details With Sigin In Prompt"
    
    $testID = '100'
    
    $guestDetails = Get-Item -Path $guestDetailsPath -ErrorAction SilentlyContinue
    $guestDetailsSignIn = Get-Item -Path $guestDetailsSignInPath -ErrorAction SilentlyContinue
    
    
    # Copy current guest details
    if($guestDetails -ne $null -and $guestDetailsSignIn -eq $null){
        Copy-Item -Path $guestDetails.FullPath -Destination $guestDetailsSignInPath
        $guestDetailsSignIn =  Get-Item -Path $guestDetailsSignInPath
        
        # set A/B testing fields  for "Guest Details Info"
        $guestDetails.Editing.BeginEdit()
        $guestDetails["TestId"] = $testID
        $guestDetails["TestVariant"] = 'A'
        $guestDetails.Editing.EndEdit()
        
        # set 'Has Sign In Prompt' and A/B testing fields for "Guest Details With Sign In Prompt"
        $guestDetailsSignIn.Editing.BeginEdit()
        $guestDetailsSignIn["TestId"] = $testID
        $guestDetailsSignIn["TestVariant"] = 'B'
        $guestDetailsSignIn["HasSignInPrompt"] = 1
        $guestDetailsSignIn.Editing.EndEdit()
    
        Write-Host "Guest Details AB testing created"
    }
