  Hint: Script
  Value: |
    function Update-Values($paths){
        $result = '';
        foreach($path in $paths){
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -ne $null){
                $item.Editing.BeginEdit();
                $item["IsVisibleOnSeatMapPlan"] = "1";
    	        $item.Editing.EndEdit()
            }
        }
        
        return $result;
    }
    
    function Update-Name-Value($path, $new){
        
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -ne $null){
                $item.Editing.BeginEdit();
                $item["Name"] = $new;
    	        $item.Editing.EndEdit()
            }
    }
    
    $holidaysBenefits = '/sitecore/content/EasyJet/Holidays/Data/Benefits/B0001 - One small cabin bag',
    '/sitecore/content/EasyJet/Holidays/Data/Benefits/B0002 - One large cabin bag',
    '/sitecore/content/EasyJet/Holidays/Data/Benefits/B0003 - One large cabin bag'
    
    Update-Values -Paths $holidaysBenefits
    
    $tradeBenefits = '/sitecore/content/EasyJet/TradePortal/Data/Benefits/B0001 - One small cabin bag',
    '/sitecore/content/EasyJet/TradePortal/Data/Benefits/B0002 - One large cabin bag',
    '/sitecore/content/EasyJet/TradePortal/Data/Benefits/B0003 - One large cabin bag'
    
    Update-Values -Paths $tradeBenefits
    
    Update-Name-Value -Path '/sitecore/content/EasyJet/Holidays/Data/Benefits/B0002 - One large cabin bag' -New 'Large overhead cabin bag'
    Update-Name-Value -Path '/sitecore/content/EasyJet/Holidays/Data/Benefits/B0003 - One large cabin bag' -New 'Large overhead cabin bag'
    
