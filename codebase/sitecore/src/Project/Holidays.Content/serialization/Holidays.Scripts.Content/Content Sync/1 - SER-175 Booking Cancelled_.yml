    function Get-Or-Create-Item($path, $itemName, $templateId, $itemId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    }
    
    function Set-Page-Design($designPath, $pageTemplateId) {
        $designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
        if ($designItem -ne $null) {
             [Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
            
            if(!$pageTemplates.Contains($pageTemplateId)) {
                $designItem.Editing.BeginEdit();
                $pageTemplates.add($pageTemplateId);
                $designItem.Editing.EndEdit() | Out-Null
                Write-Host "Page Templates of" $designItem.Name "are updated"
            }
        }
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function Create-Breadcrumbs($path, $breadcrumbs, $index){
        $folder = Get-Or-Create-Item -path $path -templateId '{342C2741-9124-4499-8DAC-056FBBD364B0}'
        
        $name = $breadcrumbs['en']["Text"];
        $breadcrumb = Get-Or-Create-Item -path "$path/$name" -templateId '{D21FBF7C-4FD3-40EC-8D39-CAD55D3AC14D}'
       
        foreach ($lang in $breadcrumbs.Keys) {
            create-lang-version -item $folder -lang $lang 
            create-lang-version -item $breadcrumb  -lang $lang -field "Text" -value $breadcrumbs[$lang]["Text"]    
            create-lang-version -item $breadcrumb  -lang $lang -field "Link" -value $breadcrumbs[$lang]["Link"]    
        }
        
        $breadcrumb.Editing.BeginEdit()
            $breadcrumb['__SortOrder'] = $index
            $breadcrumb.Editing.EndEdit() | Out-Null
        
        return $breadcrumb;
    }
    
