    #add lang versions
    function create-lang-version2($item, $lang, $fieldValuePairs) {
        $target = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($target -eq $null -or $target.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        $setting = Get-Item "/sitecore/content/EasyJet/Holidays/Settings/Booking Settings" -Language $lang
        $pageID = $page.ID
        if ($setting -ne $null) {
            $setting.Editing.BeginEdit()
            $setting['CancelledBookingLink'] = "<link text='' anchor='' linktype='internal' class='' title=''  querystring='' id='" + $pageID + "' />"
            $setting.Editing.EndEdit() | Out-Null
         }
        
        
        if ($fieldValuePairs -ne $null) {
            $target = Get-Item -Path $item.Paths.FullPath -Language $lang
            $target.Editing.BeginEdit()
            foreach ($pair in $fieldValuePairs.GetEnumerator()) {
                $target['Name'] = $pair.Value['Name']
                 $target['PageTitle'] = $pair.Value['PageTitle']
            }
            $target.Editing.EndEdit() | Out-Null
        }
    }
         
