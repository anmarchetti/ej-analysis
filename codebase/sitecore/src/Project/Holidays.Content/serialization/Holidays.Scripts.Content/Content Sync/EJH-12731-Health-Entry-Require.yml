  Hint: Script
  Value: |
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		New-Item -Parent $parent -Name $itemName -ItemType $templateId
    	}
    
    	return $item
    }
    
    $dataItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/"
    
    #create Health Entry Requirements folder
    Get-Or-Create-Item -parent $dataItem -itemName "Health Entry Requirements" -templateId "{A6B07161-D9E0-40D1-9BEF-92C7C1954538}" # Template ID of Health Entry Requirements Folder
    
    #Move FCDO Advice Module under Data folder
