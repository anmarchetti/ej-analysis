Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13511 Change Flights CTA"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Rendering-Index ($item,$id) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemId -eq $id) {
    			return $i
    		}
    		$i++
    	}
    }
    
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    
    $componentsPath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components"
    $pageComponents = Get-Item -Path $componentsPath -ErrorAction SilentlyContinue
    
    $CTABlockPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Cant Make Changes"
    $CTABlockTemplateId = "{4274027C-AF42-47ED-BAF0-5E8DBC6A8EB8}"
    
    $CTABlock = Get-Item -Database "master" -Path $CTABlockPath -ErrorAction SilentlyContinue
    
    if ($CTABlock -eq $null) {
    	$CTABlock = New-Item -Path $CTABlockPath -ItemType $CTABlockTemplateId
    	Write-Host "Item" $CTABlock.Name "successfully created"
    }
    
    $CTABlock.Editing.BeginEdit()
    $CTABlock["Title"] = "72 hours before your holiday starts"
    $CTABlock["Description"] = "Within 72 hours before the holiday, you're not able to make any changes. Please relax and get ready for your holiday."
    $CTABlock["Icon"] = '<image mediaid="{7EDABD3F-53AC-411A-B2FB-BA49ACC8445C}" />';
    $CTABlock.Editing.EndEdit() | Out-Null
    
    $renderingId = "{59660D4A-AEA2-4C41-A118-FF3C1382742A}"
    $renderingPlaceholder = "/body/cant-make-changes-{5500ac44-5df4-4473-8e8c-ea635a187882}-0";
    $rendering = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder | Where-Object { $_.ItemId -eq $renderingId }
    
    $loginPopupRenderingId = "{68FFCF4F-8A07-4553-8687-DB9501C09694}"
    $loginPopupIndex = Get-Rendering-Index -Item $page -Id $loginPopupRenderingId
    
    if ($rendering -eq $null) {
    	$renderingItem = Get-Item -Path "master:" -Id $renderingId | New-Rendering -PlaceHolder $renderingPlaceholder
    	Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $CTABlockPath -Instance $renderingItem -Index $loginPopupIndex
    	Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder | Set-RenderingParameter -Parameter @{ Theme = "One Row" } | Set-Rendering -Item $page
    
    	Write-Host "Cant Make Changes CTA Rendering was created"
    } 
