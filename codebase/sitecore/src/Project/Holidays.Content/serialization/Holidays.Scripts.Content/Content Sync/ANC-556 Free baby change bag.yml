- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPathHolidays = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags'
    $itemPathTrade = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags'
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            $targetLangItem = Get-Item -Path $item -Language $lang -ErrorAction SilentlyContinue;
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    create-lang-version -Item $itemPathTrade -Field 'SmallBagDropdownWithInfantLabel' -Value 'Small under seat bag and baby change bags' -Lang 'en'
    create-lang-version -Item $itemPathTrade -Field 'IncludedWithInfantLabel' -Value '{count} x small under seat bags, {infantCount} x baby change bags' -Lang 'en'
    
    
    create-lang-version -Item $itemPathHolidays -Field 'SmallBagDropdownWithInfantLabel' -Value 'Small under seat bag and baby change bags' -Lang 'en'
    create-lang-version -Item $itemPathHolidays -Field 'SmallBagDropdownWithInfantLabel' -Value 'Kleine Tasche unter dem Sitz und Wickeltasche für das Baby' -Lang 'de-DE'
    create-lang-version -Item $itemPathHolidays -Field 'SmallBagDropdownWithInfantLabel' -Value 'Petit sac sous le siège et sac à langer' -Lang 'fr-FR'
    create-lang-version -Item $itemPathHolidays -Field 'SmallBagDropdownWithInfantLabel' -Value 'Kleine Tasche unter dem Sitz und Wickeltasche für das Baby' -Lang 'de-CH'
    create-lang-version -Item $itemPathHolidays -Field 'SmallBagDropdownWithInfantLabel' -Value 'Petit sac sous le siège et sac à langer' -Lang 'fr-CH'
    
    create-lang-version -Item $itemPathHolidays -Field 'IncludedWithInfantLabel' -Value '{count} x small under seat bags, {infantCount} x baby change bags' -Lang 'en'
    create-lang-version -Item $itemPathHolidays -Field 'IncludedWithInfantLabel' -Value '{count} x kleine Taschen unter dem Sitz, {infantCount} x Wickeltaschen für Baby' -Lang 'de-DE'
    create-lang-version -Item $itemPathHolidays -Field 'IncludedWithInfantLabel' -Value '{count} x petits sacs sous le siège, {infantCount} x sacs de change pour bébé' -Lang 'fr-FR'
    create-lang-version -Item $itemPathHolidays -Field 'IncludedWithInfantLabel' -Value '{count} x kleine Taschen unter dem Sitz, {infantCount} x Wickeltaschen für Baby' -Lang 'de-CH'
    create-lang-version -Item $itemPathHolidays -Field 'IncludedWithInfantLabel' -Value '{count} x petits sacs sous le siège, {infantCount} x sacs de change pour bébé' -Lang 'fr-CH'
    
    
    
