DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Amend Flights/No Available Flights Popup/Labels/Title"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "We're sorry, there's no other available flights to {destination}."
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
