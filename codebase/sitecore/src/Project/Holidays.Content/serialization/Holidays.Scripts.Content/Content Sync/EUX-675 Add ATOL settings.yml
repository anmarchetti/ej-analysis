  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    
    function Set-ATOL-Settings ($path) {
    	$atolSettings = Get-Or-Create-Item -path $path -templateId "{B9828195-189E-4042-9ACA-4AE5EB5507AF}"
    
    	$atolSettings.Editing.BeginEdit();
    	$atolSettings["IsATOLProtectionEnabled"] = "1";
    	$atolSettings.Editing.EndEdit();
    }
    
    Set-ATOL-Settings -Path "master:/sitecore/content/EasyJet/Holidays/Settings/ATOL Settings"
