  Hint: Script
  Value: |
     ## UPDATE FILEDS WITH LANGS
            function update-item-with-lang($data, $item) {
                function create-lang-version($item, $lang, $field, $value) {
                    $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                    
                    if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                        Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
                    }
                    
                    if ($null -ne $field) {
                        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                        $targetLangItem.Editing.BeginEdit()
                        $targetLangItem[$field] = $value;
                        $targetLangItem.Editing.EndEdit() | Out-Null
                    }
            };
            
                if ($item -ne $null) {
                    $data | ForEach-Object {
                    $fieldName = $_.fieldName;
                    $values = $_.values;
                
                    if ($values -ne $null) {
                      
                        if ($values.en -ne $null) {
                            $item.Editing.BeginEdit();
                            $item[$fieldName] = $values.en;
                            $item.Editing.EndEdit() | Out-Null
                        }
                         if ($values.fr -ne $null) {
                             @('fr-CH', 'fr-FR') | % {
                                Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                            }
                        }
                         if ($values.de -ne $null) {
                             @('de-CH', 'de-DE') | % {
                                Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                            }
                        }
                        
                        Write-Host $fieldName "Updated"
                    }
                }
                }
            };
            ##
            
            $PDDataSource = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Attention Passengers Count Change Message"; 
            
            $data = @(
                @{
                    fieldName = "Description";
                    values = @{
                        en = "On this page, you can make one free of charge change of up to three characters to the full names of anyone on your booking (excluding the lead passenger). If you need to change more than {amount} characters, or want to add or remove anyone from your booking, please <a href=`"~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z`">get in touch</a>&nbsp;with our team.";
                        fr = "Sur cette page, vous pouvez modifier gratuitement (jusqu’à trois caractères) les noms et prénoms de toutes les personnes voyageant dans le cadre de votre réservation (à l’exception du passager principal). Si vous devez modifier plus de {amount} caractères, ou si vous souhaitez ajouter ou supprimer quelqu’un sur votre réservation, veuillez  <a href=`"~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z`">contacter</a>&nbsp;notre équipe.";
                        de = "Auf dieser Seite kannst du eine kostenlose Änderung von bis zu drei Zeichen an den vollständigen Namen aller Personen deiner Buchung vornehmen (mit Ausnahme des Hauptpassagiers). Wenn du mehr als {amount} Zeichen ändern oder eine Person zu deiner Buchung hinzufügen oder entfernen möchtest, setze dich bitte <a href=`"~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z`">mit unserem</a>&nbsp;Team in Verbindung.";
                    }
                }    
            );
            
            update-item-with-lang -Item $PDDataSource -Data $data;
            
            
            
