- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    $form = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us" "{D6E273D0-4C78-4ABD-B412-5C98E7C9DB94}"
    $promoBlocksRenderingItemId = "{FF441699-4D65-45C1-B565-E87714B5A278}"
    $promoParameters = [ordered]@{
    "Theme" = "Text Variant - Alternative"
    }
    
    
    foreach($itemRendering in Get-Rendering -Item $form -FinalLayout) {
        Write-Host "Rendering UniqueId: $($itemRendering.UniqueId)"
        if($itemRendering.ItemId -eq $promoBlocksRenderingItemId){
            $itemRendering | Set-RenderingParameter -Parameter $promoParameters | Set-Rendering -Item $form
        }
        Get-RenderingParameter -Rendering $itemRendering | Format-Table -Auto
    }
    
