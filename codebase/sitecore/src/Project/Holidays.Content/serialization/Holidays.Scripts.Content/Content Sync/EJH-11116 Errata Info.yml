  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Create-Errata-Settings () {
    	$item = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Settings" -ItemName "Errata Settings" -TemplateId "{2D32ACD4-2227-4124-8289-15FCE40D1082}"
    
    	$item.Editing.BeginEdit()
    	$item["ErrataTitle"] = "Just to let you know"
    	$item["ErrataIcon"] = '<image mediaid="{078BD377-3213-49FB-A0D8-D9E1B5A9E9E0}" />'
    	$item["IsErrataEnabled"] = "1"
    	$item.Editing.EndEdit() | Out-Null
    }
    
    function Update-Guest-Details () {
    	# Remove outdated Guest Details Data Source, that used in AB test
    	$outdatedGuestDetails = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components/Guest Details Info" -ErrorAction SilentlyContinue
    	if ($outdatedGuestDetails -ne $null) {
    		$outdatedGuestDetails | Remove-Item
    		Write-Host $outdatedGuestDetails.Name "successfully removed";
    	}
    
    	# Set Guest Details ErrataMessage field
    	$guestDetails = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components/Guest Details With Sigin In Prompt" -ErrorAction SilentlyContinue
    	if ($guestDetails -ne $null) {
    		$guestDetails.Editing.BeginEdit()
    		$guestDetails["ErrataMessage"] = '<a href="#errata-popup" class="link-popup">Errata message</a>'
    		$guestDetails.Editing.EndEdit() | Out-Null
    		Write-Host $guestDetails.Name "successfully updated";
    	}
    }
    
    Create-Errata-Settings
    Update-Guest-Details 
