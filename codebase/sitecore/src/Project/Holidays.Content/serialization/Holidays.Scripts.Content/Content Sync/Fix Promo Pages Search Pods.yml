SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Set-AB-Test-Fields($item, $testId, $testVariant) {
        $item.Editing.BeginEdit();
        $item["TestId"] = $testId
        $item["TestVariant"] = $testVariant
        $item.Editing.EndEdit() | Out-Null
    }
    
    $dataPath = "master:/sitecore/content/EasyJet/Holidays/Data"
    $searchPodFolderTemplateId = "{CA9B20EB-F054-41A0-873A-F63776B9FE68}"
    $currentSearchPodTemplateId = "{05D15AAB-CFF6-4FF9-B048-F9E48DA7153E}"
    $newSearchPodTemplateId = "{E24DE0D7-390F-424F-B937-761CE71C5E21}"
    $searchPodTestId = '101'
    
    $searchPodFolder = Get-ChildItem -Path $dataPath | Where-Object { $_.TemplateID -eq  $searchPodFolderTemplateId} | Select -First 1
    
    # Recreate Search Pods with ForceId
    if($searchPodFolder -ne $null) {
        $searchPodFolder | Remove-Item -Recurse
       
        $searchPodFolder = New-Item -Path $dataPath -Name "Promo Page Search Pods" -ItemType $searchPodFolderTemplateId -ForceId "{553A2F91-8F78-468E-8576-4CADA6590A9B}"
        $currentSearchPod = New-Item -Path  $searchPodFolder.FullPath -Name "Simple Search Pod" -ItemType $currentSearchPodTemplateId -ForceId "{22DE405B-29A5-40A1-8C7E-8C1249793F59}"
        $newSearchPod = New-Item -Path  $searchPodFolder.FullPath -Name "Search Pod With Hero Image" -ItemType $newSearchPodTemplateId -ForceId "{5925E2C8-02C1-4998-A9CE-5437074519C9}"
        
        Set-AB-Test-Fields -item $currentSearchPod -TestId $searchPodTestId -TestVariant 'A'
        Set-AB-Test-Fields -item $newSearchPod -TestId $searchPodTestId -TestVariant 'B'
        
        Write-Host "Search Pods recreated"
    }
