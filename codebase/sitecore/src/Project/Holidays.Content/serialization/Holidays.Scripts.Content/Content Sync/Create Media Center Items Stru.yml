Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Media Center Items Structure
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $null
    }
    
    $mediaCenterPageItemPath = "/sitecore/content/EasyJet/Holidays/Home"
    
    $mediaCenterPageItem = create-item -Path $mediaCenterPageItemPath -ItemName "Media Center" -ItemType "{A5A1C3C6-76BD-448E-9709-4CD6957A4813}" # item to add data
    
    $contentHubPageItemPath = "/sitecore/content/EasyJet/Holidays/Home/Media Center"
    
    create-item -Path $contentHubPageItemPath -ItemName "Content Hub" -ItemType "{99755ECC-B50F-419C-9F80-95E013672D94}"
    
    $articlePageItemPath = "/sitecore/content/EasyJet/Holidays/Home/Media Center/Content Hub"
    
    $articlePageItem = create-item -Path $articlePageItemPath -ItemName "Electric Aircraft" -ItemType "{A3A83479-5CEC-440E-9B30-A7AD70121343}" # item to add data
    
    $topicFolderItemPath = "/sitecore/content/EasyJet/Holidays/Data"
    
    create-item -Path $topicFolderItemPath -ItemName "Topics" -ItemType "{96B44174-B3B5-4D27-9DD3-7D5EB28307DF}"
    
    $topicItemPath = "/sitecore/content/EasyJet/Holidays/Data/Topics"
    
    $topicItem = create-item -Path $topicItemPath -ItemName "Environment" -ItemType "{BA13D0EE-2A1A-493B-A047-9D149D5D43B9}" # item to add data
    
    
    if($mediaCenterPageItem -ne $null){
        $mediaCenterPageItem.Editing.BeginEdit()
        $mediaCenterPageItem.Fields["Title"].Value = "Media Centre"
        $mediaCenterPageItem.Fields["Description"].Value = "Welcome to the easyjet holiday's media centre."
        $mediaCenterPageItem.Editing.EndEdit()
    }
    
    if($articlePageItem -ne $null){
        $articlePageItem.Editing.BeginEdit()
        $articlePageItem.Fields["Title"].Value = "Electric Aircraft"
        $articlePageItem.Fields["TopContent"].Value = "Electric Aircraft"
        $articlePageItem.Fields["BottomContent"].Value = "Electric Aircraft"
        $articlePageItem.Editing.EndEdit()
    }
    
    if($topicItem -ne $null){
        $topicItem.Editing.BeginEdit()
        $topicItem.Fields["Name"].Value = "Environment"
        $topicItem.Editing.EndEdit()
    }
    
    Write-Host "Script work have completed"
