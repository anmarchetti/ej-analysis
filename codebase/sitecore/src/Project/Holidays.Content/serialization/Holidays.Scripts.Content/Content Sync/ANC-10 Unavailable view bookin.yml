- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    # holidays
    $template = '{63D3079B-9A85-4872-AC5E-34D19D8D972E}'
    $path = '/sitecore/content/EasyJet/Holidays/Data/Cabin Bags/Unavailable Post Book Content'
    $banner = Get-Or-Create-Item -Path $path -Template $template
    if($banner -ne $null) {
        $banner.Editing.BeginEdit()
        $banner['Title'] = 'Adding cabin bags is currently unavailable on easyJet Holidays'
        $banner['Subtitle'] = 'We''re sorry, the ability to add large cabin bags is currently unavailable on this website. You may be able to add more cabin bags on the airline website, at easyjet.com.'
        $banner['Link'] = "<link text='Go to easyJet.com' linktype='external' url='https://www.easyjet.com/en' anchor='' target='_blank' rel='' />"
        $banner.Editing.EndEdit() | Out-Null
    }
    
    # trade
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Data/Cabin Bags/Unavailable Post Book Content'
    $bannerTrade = Get-Or-Create-Item -Path $tradePath -Template $template
    if($bannerTrade -ne $null) {
        $bannerTrade.Editing.BeginEdit()
        $bannerTrade['Title'] = 'Adding cabin bags is currently unavailable on easyJet Holidays'
        $bannerTrade['Subtitle'] = 'We''re sorry, the ability to add large cabin bags is currently unavailable on this website. You may be able to add more cabin bags on the airline website, at easyjet.com.'
        $bannerTrade['Link'] = "<link text='Go to easyJet.com' linktype='external' url='https://www.easyjet.com/en' anchor='' target='_blank' rel='' />"
        $bannerTrade.Editing.EndEdit() | Out-Null
    }
    
    $translations = @{
        "fr-CH" = @{
            "Title" = "Ajout de bagages en cabine actuellement indisponible sur easyJet Holidays"
            "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter de grands bagages en cabine est actuellement indisponible sur ce site web. Vous pourriez être en mesure d'ajouter plus de bagages en cabine sur le site web de la compagnie aérienne, sur easyjet.com."
            "Link" = "<link text='Aller sur easyJet.com' linktype='external' url='https://www.easyjet.com/ch-fr' anchor='' target='_blank' rel='' />"
        }
        "fr-FR" = @{
            "Title" = "Ajout de bagages en cabine actuellement indisponible sur easyJet Holidays"
            "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter de grands bagages en cabine est actuellement indisponible sur ce site web. Vous pourriez être en mesure d'ajouter plus de bagages en cabine sur le site web de la compagnie aérienne, sur easyjet.com."
            "Link" = "<link text='Aller sur easyJet.com' linktype='external' url='https://www.easyjet.com/fr' anchor='' target='_blank' rel='' />"
        }
        "de-CH" = @{
            "Title" = "Hinzufügen von Handgepäck ist derzeit bei easyJet Holidays nicht verfügbar"
            "Subtitle" = "Es tut uns leid, die Möglichkeit, große Handgepäckstücke hinzuzufügen, ist derzeit auf dieser Webseite nicht verfügbar. Es könnte möglich sein, auf der Fluggesellschaftswebseite weitere Handgepäckstücke hinzuzufügen, unter easyjet.com."
            "Link" = "<link text='Zu easyJet.com gehen' linktype='external' url='https://www.easyjet.com/ch-de' anchor='' target='_blank' rel='' />"
        }
        "de-DE" = @{
            "Title" = "Hinzufügen von Handgepäck ist derzeit bei easyJet Holidays nicht verfügbar"
            "Subtitle" = "Es tut uns leid, die Möglichkeit, große Handgepäckstücke hinzuzufügen, ist derzeit auf dieser Webseite nicht verfügbar. Es könnte möglich sein, auf der Fluggesellschaftswebseite weitere Handgepäckstücke hinzuzufügen, unter easyjet.com."
            "Link" = "<link text='Zu easyJet.com gehen' linktype='external' url='https://www.easyjet.com/de' anchor='' target='_blank' rel='' />"
        }
    }
        
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $banner -lang $lang -field "Title" -value $translations[$lang]["Title"]
        create-lang-version -item $banner -lang $lang -field "Subtitle" -value $translations[$lang]["Subtitle"]
        create-lang-version -item $banner -lang $lang -field "Link" -value $translations[$lang]["Link"]
    }
    
    $bagsItem =  Get-Item -Path '/sitecore/content/EasyJet/Holidays/Data/Cabin Bags' -ErrorAction SilentlyContinue
    if($bagsItem -ne $null) {
        $bagsItem.Editing.BeginEdit()
        $bagsItem['UnavailablePostBookContent'] = $banner.ID
        $bagsItem.Editing.EndEdit() | Out-Null
    }
    
    $tradeBagsItem =  Get-Item -Path '/sitecore/content/EasyJet/TradePortal/Data/Cabin Bags' -ErrorAction SilentlyContinue
    if($tradeBagsItem -ne $null) {
        $tradeBagsItem.Editing.BeginEdit()
        $tradeBagsItem['UnavailablePostBookContent'] = $bannerTrade.ID
        $tradeBagsItem.Editing.EndEdit() | Out-Null
    }
    
    
