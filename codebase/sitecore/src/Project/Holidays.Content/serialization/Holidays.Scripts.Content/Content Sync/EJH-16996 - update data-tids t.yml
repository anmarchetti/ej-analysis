DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Data/Modal Dialogs/Call center - Speak to our team"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["ModalDescription"] = "<a href='tel:0330 551 5165'><span data-tid='call-center-phone'>0330 551 5165</span></a><p data-tid='call-center-phone-description'>Our team are available <strong>Monday &ndash; Friday 10am - 8pm &amp; Saturday - Sunday 9am &ndash; 6pm</strong> . Cost of a local call. Calls from mobile or other networks may vary.</p>"
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    Write-Host "Finished"
