ID: "20572951-8a1e-49e8-8940-add31a8b3e89"
Parent: "00692b8a-ccb1-4aff-9ef3-afcc57611ec6"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Recurrence/Content Script Archivator
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Output "Starting Execute Content Script Archivator"
    
    $sourcePath = "/sitecore/system/Modules/PowerShell/Script Library/Content Sync"
    $targetPath = "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/Archive"
    $scriptTemplateId = "{DD22F1B3-BD87-4DB2-9E7D-F7A496888D43}"
    $placeholderScriptId = "{BB1456AA-8112-4398-82D2-2AAA458351EC}"
    $targetItem = Get-Item -Path "master:$targetPath"
    
    Write-Output "Get list of non-recurrence scripts"
    $scripts = Get-ChildItem -Path "master:$sourcePath" | Where-Object { $_.TemplateId -eq $scriptTemplateId }
    Write-Output "Total number of scripts $($scripts.length)"
    
    Write-Output "Get list of already executed scripts"
    $executedScriptsItem = Get-Item -Path "master:/sitecore/system/Modules/Update Scripts"
    $executedScripts = $executedScriptsItem.Fields["Executed Scripts"].Value
    $executedScriptsIds = $executedScripts.Split("|")
    
    $scripts | ForEach-Object {
        $scriptId = $_.ID.ToString()
        if($scriptId -ne $placeholderScriptId){
            $scriptName = $_.Name
            $uniqueScriptName = [Sitecore.Data.Items.ItemUtil]::GetUniqueName($targetItem, $scriptName)
            $scriptPath = $_.Paths.ContentPath
            
            # Check if script was already executed
            if($executedScriptsIds.Contains($scriptId)){
                
                # Check if script name is unique in archive folder
                if($scriptName -ne $uniqueScriptName){
                    Write-Output "Rename script '$scriptName' to '$uniqueScriptName'"
                    $_.Editing.BeginEdit()
                    $_.Name = $uniqueScriptName
                    $_.Editing.EndEdit() | Out-Null
                    
                    $scriptPath = $_.Paths.ContentPath
                    $scriptName = $_.Name
                }
                
                Move-Item -Path $scriptPath -Destination "master:$targetPath" -ErrorAction Continue
                Write-Output "$scriptName moved to archive"
    
            } else {
                Write-Output "Script $scriptName was not archived because it was not executed yet"
            }
        }
    }
