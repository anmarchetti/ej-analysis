Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Password Validation Message
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Dictionary-Item($itemPath, $newPhrase) {
        $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = $newPhrase
            $item.Editing.EndEdit()
            
            Write-Host "Item" $item.DisplayName "successfully updated"
        }
    }
    
    $infoPath = "/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Titles/Password Info"
    $infoPhrase = "Once you've booked, we'll create an account for you. You'll be able to use this email address and password to log in to easyJet and easyJet holidays. We do this so you can view and manage your booking online. Your password must be a single word between 6 and 20 characters in length and must not include the special characters # & + space or start with 0."
    
    $errorPath = "/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Error Messages/Invalid Password"
    $errorPhrase = "Your password must be a single word between 6 - 20 using characters and numbers. It must not include special characters like # & + space or start with 0."
    
    
    Update-Dictionary-Item -itemPath $infoPath -newPhrase $infoPhrase
    Update-Dictionary-Item -itemPath $errorPath -newPhrase $errorPhrase
    
    
    
