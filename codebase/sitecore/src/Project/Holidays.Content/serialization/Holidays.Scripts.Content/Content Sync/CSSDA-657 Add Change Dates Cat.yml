- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path, $template) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $amendDatesPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates"
    $amendDatesSummaryPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary"
    $amendDatesSeatsAndBagsPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Seats And Bags"
    
    $amendDatesPages = $amendDatesPagePath, $amendDatesSummaryPagePath, $amendDatesSeatsAndBagsPagePath
    
    foreach ($amendDatesPage in $amendDatesPages) {
        $amendDatesPage = Get-Or-Create-Item -Path $amendDatesPage
        if ($amendDatesPage -ne $null) {
            $amendDatesPage.Editing.BeginEdit();
            $amendDatesPage.Fields["PageCategory"].Value = "Post-Booking"
            $amendDatesPage.Editing.EndEdit() | Out-Null;
            Write-Host "Finished editing " $amendDatesPage.Paths.FullPath
        }
    }
    
