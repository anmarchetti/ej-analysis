    function Create-Help-Links ($placeholder) {
    	$helpLinks = Get-Or-Create-Item -Path $pageComponents.FullPath -Name "Bottom Help Links" -TemplateId "{D8BCEFBC-7EB0-49EE-8136-466C8C691D67}"
    	$linksIds = @();
    
    	foreach ($link in $helpLinksList) {
    		$linkItem = Get-Or-Create-Item -Path $helpLinks.FullPath -Name $link.Name -TemplateId "{71FE9E37-1343-4E71-8741-3B26E072F9D3}"
    		$linksIds += $linkItem.ID
    		$pageId = Get-Item-ID -Path $link.PagePath
    
    		$linkItem.Editing.BeginEdit()
    		$linkItem["Link"] = "<link text='$($link.Title)' linktype='internal' id='$($pageId)' />";
    		$linkItem["Title"] = $link.Title;
    		$linkItem["Description"] = $link.Description;
    		$linkItem["Icon"] = $link.Icon
    		$linkItem.Editing.EndEdit() | Out-Null
    	}
    
    	$helpLinks.Editing.BeginEdit()
    	$helpLinks["Title"] = "Can't find what you're looking for?";
    	$helpLinks.Fields["Links"].Value = ($linksIds -join "|")
    	$helpLinks.Editing.EndEdit() | Out-Null
    
    	$helpLinksRenderingId = "{9133F3CA-553F-42F5-8529-54734B53A378}"
    	$helpLinksRendering = Get-Item -Database "master" -Path $helpLinksRenderingId | New-Rendering
    	Add-Rendering -Item $page -Instance $helpLinksRendering -PlaceHolder $placeholder -DataSource $helpLinks.ID
    	Write-Host "Help Links rendering successfully created";
    }
    
    function Create-Wider-Search ($placeholder) {
    	$widerSearch = Get-Or-Create-Item -Path $pageComponents.FullPath -Name "Wider Search" -TemplateId "{1A47E913-BAEA-4663-A39B-E6DC99FA2A58}"
    
    	$widerSearch.Editing.BeginEdit()
    	$widerSearch["Title"] = "Need help finding the perfect holiday?"
    	$widerSearch["Subtitle"] = "Since we’re here, let’s explore some holidays and see what we can do to put one trip together for you."
    	$widerSearch["CTA"] = "Find my holiday"
    	$widerSearch.Editing.EndEdit() | Out-Null
    
    	$widerSearchRenderingId = "{830336F7-DE90-46B5-A074-93851C8B0B56}"
    	$widerSearchRendering = Get-Item -Database "master" -Path $widerSearchRenderingId | New-Rendering
    	Add-Rendering -Item $page -Instance $widerSearchRendering -PlaceHolder $placeholder -DataSource $widerSearch.ID
    	Write-Host "Wider Search rendering successfully created";
    }
    
    function Create-Recommended-Hotels-With-Fallback ($placeholder) {
    	$recommendedDataSource = Get-Or-Create-Item -Path $pageComponents.FullPath -Name "Recommended Hotels Carousel" -TemplateId "{439330F2-BA2B-4D2D-9198-188D525F5877}"
    
    	$recommendedDataSource.Editing.BeginEdit()
    	$recommendedDataSource["Title"] = "But we can find your perfect holiday!"
    	$recommendedDataSource.Editing.EndEdit() | Out-Null
    
    	$recommendedRenderingId = "{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}"
    	$recommendedRendering = Get-Item -Database "master" -Path $recommendedRenderingId | New-Rendering
    	$params = @{ "FallbackImage"='<image mediaid="{B8BDEFA6-5D0E-4F27-B6C3-53BDD9A3A32C}" />'}
    	Add-Rendering -Item $page -Instance $recommendedRendering -PlaceHolder $placeholder -DataSource $recommendedDataSource.ID -Parameter $params
    	$recommendedRenderingItem = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $recommendedRenderingId} | Select -First 1
    	
    	# Create Wider Search and place it to recommended fallback 
    	Create-Wider-Search -PlaceHolder "$($placeholder)/recommended-hotels-fallback-$($recommendedRenderingItem.UniqueId)-0"
    }
    
    
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/404 Page"
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -Name "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Remove Need Help Block
    $needHelpRendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq "{A38F8E39-55D0-4E54-91D5-95F8D7F19E01}" } | Select -First 1
    if ($needHelpRendering -ne $null) {
    	Remove-Rendering -Item $page -Instance $needHelpRendering
    	Write-Host "Rendering Need Help Block removed"
    }
    
    $wrapperChildrenPlaceholder = "/body/component-wrapper-inner-{ea8b6578-8a9c-4477-b74a-c3a91c343770}-0"
    Create-Recommended-Hotels-With-Fallback -PlaceHolder $wrapperChildrenPlaceholder
    Create-Help-Links -PlaceHolder $wrapperChildrenPlaceholder 
