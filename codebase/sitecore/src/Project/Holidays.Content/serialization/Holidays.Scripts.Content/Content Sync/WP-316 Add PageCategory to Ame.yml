- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path, $template) {
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $template
            }
            return $item
        }
        
        $amendPaymentSitePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment"
        $amendDatesPage = Get-Or-Create-Item -Path $amendPaymentSitePath
        
        if ($amendDatesPage -ne $null) {
                $amendDatesPage.Editing.BeginEdit();
                $amendDatesPage.Fields["PageCategory"].Value = "Post-Booking"
                $amendDatesPage.Editing.EndEdit() | Out-Null;
                Write-Host "Finished editing " $amendDatesPage.Paths.FullPath
        }
