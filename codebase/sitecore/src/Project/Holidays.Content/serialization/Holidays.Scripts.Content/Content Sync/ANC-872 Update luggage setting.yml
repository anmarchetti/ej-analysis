SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
     function create-lang-version($item, $lang, $field, $value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    	
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $holdLuggageSettingsPath = "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings"
    $holdLuggageSettings = Get-Item -Path $holdLuggageSettingsPath  -Language "en" -ErrorAction SilentlyContinue
       
    if ($holdLuggageSettings -ne $null) {
    	@('fr-CH', 'fr-FR', 'de-DE', 'de-CH') | % {
    		Create-Lang-Version -Item $holdLuggageSettings -Lang $_ -Field "DefaultFreeBagsPerNonInfantPassenger" -Value "LUG=1"
    	}
    }
        	
    Write-Host "Script was executed"
    
