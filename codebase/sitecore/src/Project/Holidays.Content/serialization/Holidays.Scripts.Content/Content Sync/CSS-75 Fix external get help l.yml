- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId,$forceId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId -ForceId $forceId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    function Get-Or-Create-Lang-Version ($path,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $path -Language $lang -ErrorAction SilentlyContinue
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Get-Item -Path $path | Add-ItemLanguage -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	$targetLangItem = Get-Item -Path $path -Language $lang
    
    	if ($field -ne $null) {
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    
    	return $targetLangItem;
    }
    
    
    $changeRestrictionsPath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Amend Restrictions/Restrictions Support'
    $timeWarningPath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Amend Restrictions/Time Warning'
    
    Get-Or-Create-Lang-Version -Path $changeRestrictionsPath -Lang 'en' -Field 'Link' -Value '<link text="Get help" linktype="external" url="/help?helpCategory=changes&amp;helpQuestion=amend" anchor="" target="_blank" />'
    
    Get-Or-Create-Lang-Version -Path $timeWarningPath -Lang 'en' -Field 'Link' -Value '<link text="Get Help" linktype="external" url="/help" anchor="" target="_blank" rel="" />'
    
     @( 'fr-CH','fr-FR') | % {
        	Get-Or-Create-Lang-Version -Path $changeRestrictionsPath -Lang $_ -Field 'Link' -Value '<link text="Obtenir de l`aide" linktype="external" url="/help?helpCategory=changes&amp;helpQuestion=amend" anchor="" target="_blank" />'
        	Get-Or-Create-Lang-Version -Path $timeWarningPath -Lang $_ -Field 'Link' -Value '<link text="Obtenir de l`aide" linktype="external" url="/help" anchor="" target="_blank" rel="" />'
        }
        @( 'de-CH','de-DE') | % {
        	Get-Or-Create-Lang-Version -Path $changeRestrictionsPath -Lang $_ -Field 'Link' -Value '<link text="Hilfe holen" linktype="external" url="/help?helpCategory=changes&amp;helpQuestion=amend" anchor="" target="_blank" />'
        	Get-Or-Create-Lang-Version -Path $timeWarningPath -Lang $_ -Field 'Link' -Value '<link text="Hilfe holen" linktype="external" url="/help" anchor="" target="_blank" rel="" />'
        }
    
    
    
    
