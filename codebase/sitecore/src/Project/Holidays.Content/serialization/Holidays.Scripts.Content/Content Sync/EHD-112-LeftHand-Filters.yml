  Hint: Script
  Value: |
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $deviceObj = Get-LayoutDevice -Default
    
    function Display-Item-Renderings($itemPath, $deviceObj)
    {
        $resultObj = @()
        Get-Rendering -Path $itemPath -Device $deviceObj -FinalLayout  | ForEach {
            $renderingItem = Get-Item -Path  master: -ID $_.ItemID
        
            $Obj = @{
                RenderingName =  $renderingItem.Name
                RenderingID =  $renderingItem.ID
                Placeholder = $_.Placeholder
                PageItem = $_.OwnerItemID
                Datasource = $_.Datasource
            }
        
            $resultObj += New-Object psobject -Property $Obj
        }
        
        $resultObj | Format-Table RenderingName, RenderingID, Placeholder, Datasource
    }
    
    function Create-Page-Backup($itemPath)
    {
        # Create Package & Set Properties
        $package = new-package "MixedResultList Page Backup";
        $package.Sources.Clear();
    
        Write-Host "Creating MixedResultList Page Backup..."
    
        # Add Test Pages
        $source = Get-Item $itemPath | New-ItemSource -Name "MixedResultList"
        $package.Sources.Add($source);
    
        # Save package
        Export-Package -Project $package -Path "$($package.Name).zip" -Zip
    }
    
    Create-Page-Backup($itemPath)
    
    Write-Host ******************* Renderings List Before Update ********************
    Display-Item-Renderings -itemPath $itemPath -deviceObj $deviceObj;
    
    Write-Host ******************* Update Renderings ********************
    
    $myArray = New-Object System.Collections.ArrayList
    
