  Value: |
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatAndBags = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}";
    if ($seatAndBags -ne $null){
        $seatAndBags.Editing.BeginEdit();
        $seatAndBags["ReadMore"] = "Show all passengers on this booking";
        $seatAndBags["ReadLess"] = "Collapse";
        $seatAndBags.Editing.EndEdit();
        
        Write-Host "updated Holidays - Seat And Bag - ReadMore ReadLess fields";
    }
    
    $seatAndBagsTrade = Get-Or-Create-Item -path "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}";
    if ($seatAndBagsTrade -ne $null){
        $seatAndBagsTrade.Editing.BeginEdit();
        $seatAndBagsTrade["ReadMore"] = "Show all passengers on this booking";
        $seatAndBagsTrade["ReadLess"] = "Collapse";
        $seatAndBagsTrade.Editing.EndEdit();
        
        Write-Host "updated Trade Portal - Seat And Bag - ReadMore ReadLess fields";
    }
    
