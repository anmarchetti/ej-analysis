  Hint: Script
  Value: |
    function Remove-FallbackParam($path){
        $item = Get-Item -Path "master:$($path)" 
      
    
        Get-Rendering -Item $item | 
            Remove-RenderingParameter -Name "FallbackImage" | 
            Set-Rendering -Item $item   
    
        Get-Rendering -Item $item -FinalLayout | 
            Remove-RenderingParameter -Name "FallbackImage" | 
            Set-Rendering -Item $item -FinalLayout
        Write-Host "Remove fallback rendering param: "  $item.Paths.FullPath
    }
    
    #Single pages
