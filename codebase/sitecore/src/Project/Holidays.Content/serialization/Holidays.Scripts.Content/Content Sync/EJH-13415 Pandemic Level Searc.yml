  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Get-Pandemic-States () {
    	$states = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Data/Pandemic Levels States" -ErrorAction SilentlyContinue
    	if ($states -ne $null) {
    		return ($states | Select-Object -ExpandProperty "ID") -join "|"
    	}
    	return ''
    }
    
    
    function Create-Search-Component () {
    	$item = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Travel information/Page Components" -ItemName "Pandemic Level Search" -TemplateId "{E337D91A-EC53-4341-A8CD-A2F67C22E908}"
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Title"] = "Check your destination level"
    		$item["Description"] = "Check what level your destination is in using our traffic light search. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus at risus consectetur, malesuada elit nec."
    		$item["PandemicStates"] = Get-Pandemic-States
    		$item["Image"] = '<image mediaid="{CCE298DB-6F79-49E2-A966-8638296AAD02}" />'
    		$item.Editing.EndEdit() | Out-Null
    	}
    
    }
    
    Create-Search-Component
    
