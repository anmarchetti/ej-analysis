  Hint: Script
  Value: |
    function Update-Dictionary ($path,$phrase) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Phrase"] = $phrase
    		$item.Editing.EndEdit() | Out-Null
    
    		Write-Host $item['Phrase'] "updated"
    	}
    }
    
    Update-Dictionary -Path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Filter Types/Labels/Outbound Departure Time" -Phrase "Outbound Departure Time"
