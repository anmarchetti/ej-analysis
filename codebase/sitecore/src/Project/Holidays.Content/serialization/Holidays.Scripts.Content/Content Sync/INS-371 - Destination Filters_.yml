Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-371 - Destination Filters - Resort Translations"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $regions = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Filter Types/Labels/Regions"
    
    @('en') | % {
    	Create-Lang-Version -Item $regions -Lang $_ -Field "Phrase" -Value "Resort"
    }
    
    @('de-DE') | % {
    	Create-Lang-Version -Item $regions -Lang $_ -Field "Phrase" -Value "Urlaubsort"
    }
    
    @('de-CH') | % {
    	Create-Lang-Version -Item $regions -Lang $_ -Field "Phrase" -Value "Ferienort"
    }
    
    @('fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $regions -Lang $_ -Field "Phrase" -Value "Destination"
    }
    
    $destination = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Filter Types/Labels/Destinations"
    
    @('fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $destination -Lang $_ -Field "Phrase" -Value "Pays"
    }
    
    $destination = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Filter Types/Labels/Destinations"
    
    @('fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $destination -Lang $_ -Field "Phrase" -Value "Pays"
    }
