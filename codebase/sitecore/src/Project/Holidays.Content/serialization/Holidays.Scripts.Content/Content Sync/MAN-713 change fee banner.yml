- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Add-Or-Update-Page-Rendering ($page, $renderingPath, $renderingPlaceholder, $dataSourcePath, $parameters = @{}) {
        $renderingItem = Get-Item -Path $renderingPath;
        $pageRenderingInstance = Get-Rendering -Item $page -Rendering $renderingItem -Placeholder $renderingPlaceholder -DataSource $dataSourcePath;
     
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = New-Rendering -Item $renderingItem -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath -Parameter $parameters;
     
    		Write-Host $renderingItem.Name "- Rendering instance added";
    	}
    	else {
    		Write-Host $renderingItem.Name "- Already exists";
    	}
    }
     
     
    $rbcItemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board";
    $rbcItem = Get-Item -Path $rbcItemPath;
    $feeBannerRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Change Fee Info";
     
    $amendRBCRenderingDataSource = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board/Page Components/Amend Room And Board";
    $amendRBCRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Room And Board/Amend Room And Board Page";
    $amendRBCRenderingInstance = Get-Rendering -Item $rbcItem -Rendering $amendRBCRenderingItem -PlaceHolder "/body";
     
    $amendBoardTypesRenderingPlaceholder = "/body/board-types-"+ $amendRBCRenderingInstance.UniqueId +"-0";
    $amendBoardTypesRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Board Types";
    $amendBoardTypesRenderingInstance = Get-Rendering -Item $rbcItem -Rendering $amendBoardTypesRenderingItem -PlaceHolder $amendBoardTypesRenderingPlaceholder;
     
    $feeBannerPlaceholder = "/body/board-types-" + $amendRBCRenderingInstance.UniqueId + "-0/change-fee-info-" + $amendBoardTypesRenderingInstance.UniqueId + "-0";
    $feeBannerDataSource = "/sitecore/content/EasyJet/Holidays/Data/Change Fee Info";
    $feeBannerRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Change Fee Info";
    $feeBannerRenderingInstance = Get-Rendering -Item $rbcItem -Rendering $feeBannerRenderingItem -PlaceHolder $renderingPlaceholder;
     
    Add-Or-Update-Page-Rendering -Page $rbcItem -RenderingPath "/sitecore/layout/Renderings/Feature/Destinations/Amend/Change Fee Info" -RenderingPlaceholder $feeBannerPlaceholder -DataSourcePath $feeBannerDataSource;
