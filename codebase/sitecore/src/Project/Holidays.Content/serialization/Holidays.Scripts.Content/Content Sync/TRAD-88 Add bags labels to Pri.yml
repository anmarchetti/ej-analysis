- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host "Start script: TRAD-88 Add bags labels to Print Quote Details"
    
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $exportHolidayDetails = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Export Holiday Details"
    
    $translations = @{
    	"en" = @{
    		"LuggageInfoTitle" = 'Bags and Luggage';
    		"PramName" = 'Pram or Pushchair';
    		"SportEquipmentsLabel" = 'Sports equipment';
    	}
    }
    
    create-lang-version -Item $exportHolidayDetails -lang "en" -field "LuggageInfoTitle" -Value $translations["en"]["LuggageInfoTitle"]
    
    create-lang-version -Item $exportHolidayDetails -lang "en" -field "PramName" -Value $translations["en"]["PramName"]
    
    create-lang-version -Item $exportHolidayDetails -lang "en" -field "SportEquipmentsLabel" -Value $translations["en"]["SportEquipmentsLabel"]
    
    Write-Host "Completed"
