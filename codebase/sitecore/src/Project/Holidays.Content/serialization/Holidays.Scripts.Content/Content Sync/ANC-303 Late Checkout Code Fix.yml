- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Prices-Breakdown-Update($website){
        $dataSourcePath = "/sitecore/content/EasyJet/$website/Settings/Price Breakdown Settings"
        $dataSourceItem = Get-Item -Path $dataSourcePath
        
        if($dataSourceItem -ne $null) {
            $dataSourceItem.Editing.BeginEdit()
            $dataSourceItem["LateCheckoutPriceCode"] = "Late Checkout Room"
            $dataSourceItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Price Breakdown Settings Datasource updated"
        } else {
            Write-Host "Failed to get data source item at path: $dataSourcePath"
        }
        
        Write-Host "Price Breakdown Settings updated on" $website
    }
    
    Prices-Breakdown-Update -website "Holidays"
    Prices-Breakdown-Update -website "TradePortal"
