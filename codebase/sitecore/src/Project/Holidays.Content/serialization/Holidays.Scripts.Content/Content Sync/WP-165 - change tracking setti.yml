  Hint: Script
  Value: |
        $itemPath = "master:/sitecore/content/EasyJet/Holidays/Settings/Change Tracking"
        $itemTemplateId = '{E54A4995-50EA-4710-84EC-7AD957515F9F}'
        $observedIds = '{28E5E169-8F72-4F90-A277-280A8302B607}|{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}|{2F42EC14-7E56-467A-B300-AB9723C74546}|{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}|{13ECBEA2-A890-4D6E-A4FF-4AD65D455124}|{7E1CEEB8-9A59-4584-91E8-6014A5B0FF56}|{0AE072FB-5BCF-4E09-95B5-239CBE370B2B}|{85911381-FCEA-453C-89A7-D8B86532EBE0}'
        
        $item = Get-Item -path $itemPath  -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            # create item
            $changeTracking= New-Item -Path $itemPath -ItemType $itemTemplateId 
            Write-Host "Item" $changeTracking.Name "successfully created"
        
            $changeTracking.Editing.BeginEdit()
            
            $changeTracking.Fields["Templates"].Value = $observedIds
        
            Write-Host $changeTracking.Name "Updated"
            $changeTracking.Editing.EndEdit() | Out-Null
        }
