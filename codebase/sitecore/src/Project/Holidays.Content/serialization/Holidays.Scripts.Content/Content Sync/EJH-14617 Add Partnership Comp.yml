Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14617 Add Partnership Component to Homepage"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    	}
    	return $item
    }
    
    function Get-Last-Rendering-Index ($item,$renderingItemId) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemID -eq $renderingItemId) {
    			return $i
    		}
    		$i++
    	}
    }
    
    #Create Partnership Component datasource
    $partnershipComponentItemPath = '/sitecore/content/EasyJet/Holidays/Home/Page Components/Partnership Component'
    $partnershipComponentItem = Get-Or-Create-Item -Path $partnershipComponentItemPath -ItemName "Partnership Component" -TemplateId "{ED5D6BA0-91B1-41ED-AD54-A26A7785E166}"
    
    if ($partnershipComponentItem -ne $null) {
    	$partnershipComponentItem.Editing.BeginEdit();
    	$partnershipComponentItem["Subtitle"] = 'Destination of the week';
    	$partnershipComponentItem["Title"] = 'Discover Spain';
    	$partnershipComponentItem["Description"] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus consectetur a magna nec molestie. Maecenas sem ante, semper porta eros vitae, eleifend vehicula massa.";
    	$partnershipComponentItem["Logo"] = '<image mediaid="{C8573CCD-32C9-462C-A3DD-20043610EF9B}" />';
    	$partnershipComponentItem["Image"] = '<image mediaid="{B244047E-A056-42B8-9C5D-F19A2EB3EEAA}" />';
    	$partnershipComponentItem["Link"] = '<link text="Find out more" anchor="" linktype="internal" class="" title=""  querystring="" id="{23EBD29C-9B85-4B98-95EB-7E10D2753957}" />';
    	$partnershipComponentItem["LivePriceNamedSearches"] = "{AD2B9C4C-3C33-4981-B582-D4E1BBC4C7DD}";
    	$partnershipComponentItem["LinkedDestination"] = "{C275BCB4-5DB0-427A-8BB2-2D0157DB5D49}";
    	$partnershipComponentItem.Editing.EndEdit() | Out-Null;
    }
    
    $homePage = Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home';
    $partnershipComponentRenderingId = "{EF923FE5-72B8-41AE-9D17-BD2B8B99A377}";
    $placeholder = "/body/component-wrapper-inner-{109A532F-3629-42D2-ABC2-9A450478CEC0}-0"
    
    $rendering = Get-Rendering -Item $homePage -PlaceHolder $placeholder | Where-Object { $_.ItemID -eq $partnershipComponentRenderingId }
    
    if ($rendering -eq $null) {
    	$renderingItem = Get-Item -Path "master:" -Id $partnershipComponentRenderingId | New-Rendering -PlaceHolder $placeholder
    	Add-Rendering -Item $homePage -PlaceHolder $placeholder -DataSource $partnershipComponentItemPath -Instance $renderingItem
    	Write-Host "Partnership Component Rendering was added to Homepage"
    }
    
