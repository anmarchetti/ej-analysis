Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-1440 Change Dates Summary No Seats Popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath,$parameters = @{}) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Parameter $parameters -DataSource $dataSourcePath;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    # Page
    $changeDatesSummaryPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary"
    $changeDatesPage = Get-Or-Create-Item -Path $changeDatesSummaryPagePath
    
    $changeDatesRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Dates/Amend Dates Summary"
    
    $renderedChangeDates = Get-Rendering -Item $changeDatesPage -Render $changeDatesRendering;
    
    $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $renderigPlaceholder = "/body/attention-popup-" + $renderedChangeDates.UniqueId + "-0";
    
    
    #Create New Popup Component
    $seatsUnavailablePopupItem = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Seats Unavailable Popup" -Template "{C8C39B93-2202-4B2D-937F-8F644B0D3183}"
    
    if ($seatsUnavailablePopupItem -ne $null) {
    	$seatsUnavailablePopupItem.Editing.BeginEdit();
    
    	$seatsUnavailablePopupItem["Title"] = "SEATS ARE UNAVAILABLE AT THIS TIME";
    	$seatsUnavailablePopupItem["Description"] = "<p>We're sorry, seat selection is currently unavailable. You can select your seats at a later date.</p>";
    	$seatsUnavailablePopupItem["CTA"] = "Back to summary";
    
    	@( 'fr-CH','fr-FR') | % {
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "Title" -Value "LES SIÈGES NE SONT PAS DISPONIBLES POUR LE MOMENT"
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "Description" -Value "<p>Nous sommes désolés, la sélection de sièges n'est pas disponible pour le moment. Vous pourrez sélectionner vos sièges ultérieurement.</p>"
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "CTA" -Value "Retour au résumé"
    	}
    	@( 'de-CH','de-DE') | % {
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "Title" -Value "ZURZEIT SIND KEINE PLÄTZE VERFÜGBAR"
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "Description" -Value "<p>Es tut uns leid, die Sitzplatzauswahl ist derzeit nicht verfügbar. Sie können Ihre Plätze zu einem späteren Zeitpunkt auswählen.</p>"
    		Create-Lang-Version -Item $seatsUnavailablePopupItem -Lang $_ -Field "CTA" -Value "Zurück zur Zusammenfassung"
    	}
    
    	Write-Host $seatsUnavailablePopupItem.Name "Updated";
    	$seatsUnavailablePopupItem.Editing.EndEdit() | Out-Null;
    }
    
    # Add rendering for new attention popup
    if ($seatsUnavailablePopupItem -ne $null) {
    	Add-Or-Update-Page-Rendering -page $changeDatesPage -renderingPath $renderingPath -renderingPlaceholder $renderigPlaceholder -dataSourcePath $seatsUnavailablePopupItem.ID
    	Write-Host "New Seats Unavailable Popup added to change dates summary page"
    }
    
    
