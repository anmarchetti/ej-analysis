        Import-Function "Import Content"
    
                
                $holidayCreditTemplatePath = "/sitecore/templates/Feature/PageContent/Holiday Credit"
                $viewBookingTemplatePath = "/sitecore/templates/Feature/Destinations/View Bookings"
                
                $holidayCreditDatasourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Holiday Credit/Page Components/Holiday Credit"
                $viewBookingDatasourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/Page Components/View Bookings"
        
                function New-Content() { 
                        $updates = @(
                              @{
                                Path         = $holidayCreditDatasourcePath
                                TemplatePath = $holidayCreditTemplatePath
                                Fields      = @{
                                     "MultipleCreditsInfo" = @{
                                        "en" = "Check the tabs to see all currencies that you have credit in."
                                        "fr-CH" = "Vous avez des avoirs dans plusieurs devises. Veuillez consulter chaque onglet pour en savoir plus."
                                        "de-CH" = "Du hast Guthaben in anderen Währungen. Mehr dazu erfährst du auf den jeweiligen Tabs."
                                        "fr-FR" = "Vous avez des avoirs dans plusieurs devises. Veuillez consulter chaque onglet pour en savoir plus."
                                        "de-DE" = "Du hast Guthaben in anderen Währungen. Mehr dazu erfährst du auf den jeweiligen Tabs."
                                     }
                                }
                             },
                               @{
                                Path         = $viewBookingDatasourcePath
                                TemplatePath = $viewBookingTemplatePath
                                Fields      = @{
                                     "MultipleCreditsInfo" = @{
                                        "en" = "You have credit in another currency. Check your credit page for more info."
                                        "fr-CH" = "Vous avez un avoir dans une autre devise. Consultez la page relative aux avoirs pour en savoir plus."
