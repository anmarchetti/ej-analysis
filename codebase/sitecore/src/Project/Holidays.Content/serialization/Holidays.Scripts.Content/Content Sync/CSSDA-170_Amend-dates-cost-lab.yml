  Hint: Script
  Value: |
    $amendSummaryDatesItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Amend Dates Summary Page" -ErrorAction SilentlyContinue;
    
    if ($amendSummaryDatesItem -ne $null) {
    	$amendSummaryDatesItem.Editing.BeginEdit();
    	
    	$amendSummaryDatesItem["NewCostLabel"] = "New holiday cost";
    	$amendSummaryDatesItem["PreviousCostLabel"] = "Previous holiday cost";
    	$amendSummaryDatesItem["CostTooltipContent"] = "Price subject to change & availability due to daily system updates.<br /><br />The price displayed here will factor in any valid promotional codes.";
    	$amendSummaryDatesItem["ShowCostTooltip"] = "";
    	
    	$amendSummaryDatesItem.Editing.EndEdit() | Out-Null;
    	Write-Host $amendSummaryDatesItem.Name "Updated";
    }
