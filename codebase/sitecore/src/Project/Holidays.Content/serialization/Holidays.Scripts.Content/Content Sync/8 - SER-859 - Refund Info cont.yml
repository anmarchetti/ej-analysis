    Import-Function "Import Content"
    
    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos/Less X hours after booking"
                TemplatePath = "/sitecore/templates/Feature/Destinations/Refund Info"
                Fields      = @{
                    "Title" = @{
                        "en" = "Looking to cancel your holiday?"
                        "fr-CH" = "Vous voulez annuler vos vacances?"
                        "de-CH" = "Möchtest du deine Ferien stornieren?"
                        "fr-FR" = "Vous souhaitez annuler votre séjour?"
                        "de-DE" = "Du möchtest deinen Urlaub stornieren?"
                    }
                    "Description" = @{
                        "en" = @'
    <p>If you wish to cancel your holiday, please check back here {hours} hours after you made your booking.</p>
    <p>Not sure if this holiday is still right for you? Don't worry - we're got you covered! As part of our <a href="~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z">ultimate flexibility</a>, you&rsquo;re able to cancel your holiday with ease online for easyJet holidays credit so you can book a getaway that's right for you.&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Terms and conditions apply</a>.</p>                    
    '@
                        "fr-CH" = @'
    <p>Si vous souhaitez annuler votre séjour, veuillez vérifier ici {hours} heures après avoir effectué votre réservation.</p>
    <p>Vous ne savez plus si ces vacances vous conviennent? Pas d’inquiétude. Nous avons pensé à tout! Compte tenu de notre <a href="~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z">flexibilité absolue</a>, vous avez la possibilité d’annuler facilement vos vacances en ligne en échange d’un crédit easyJet holidays afin que vous puissiez réserver une escapade adaptée à vos envies.&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Les conditions générales s’appliquent</a>.</p>
    '@
                        "de-CH" = @'
    <p>Wenn Sie Ihren Urlaub stornieren möchten, melden Sie sich bitte {hours} Stunden nach Ihrer Buchung hier zurück.</p>
    <p>Bist du nicht sicher, ob diese Ferien immer noch das Richtige für dich sind? Mach dir keine Sorgen – wir kümmern uns um dich! Im Rahmen unserer <a href="~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z">ultimativen Flexibilität</a> kannst du deine Ferien ganz einfach online stornieren und erhältst das entsprechende Guthaben auf easyJet holidays, damit du eine Reise buchen kannst, die für dich passt. <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Es gelten die allgemeinen Geschäftsbedingungen</a>.</p>
    '@
                        "fr-FR" = @'
    <p>Si vous souhaitez annuler votre séjour, veuillez vérifier ici {hours} heures après avoir effectué votre réservation.</p>
    <p>Vous n’êtes pas certain(e) que ce séjour vous convienne encore ? Pas d’inquiétude, nous sommes là pour vous ! Dans le cadre de notre <a href="~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z">flexibilité inégalée</a>, vous pouvez annuler vos vacances en ligne en toute simplicité et obtenir un crédit easyJet holidays, afin de pouvoir réserver un séjour qui vous convienne.&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Les conditions générales s’appliquent</a>.</p>
    '@
                        "de-DE" = @'
    <p>Wenn Sie Ihren Urlaub stornieren möchten, melden Sie sich bitte {hours} Stunden nach Ihrer Buchung hier zurück.</p>
    <p>Du bist dir nicht sicher, ob diese Reise noch das Richtige für dich ist? Keine Sorge – wir sind für dich da! Im Rahmen unserer <a href="~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z">ultimativen Flexibilität</a> kannst du deinen Urlaub ganz einfach online stornieren und erhältst dafür ein Guthaben von easyJet holidays, damit du einen anderen Urlaub buchen kannst, der zu dir passt.&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Es gelten die Allgemeinen Geschäftsbedingungen</a>.</p>
    '@
                    }
                    "CancelButtonText" = @{
                        "en" = 'Cancel my holiday'
                        "fr-CH" = 'Annuler mes vacances'
                        "de-CH" = 'Meine Ferien stornieren'
                        "fr-FR" = 'Annuler mon séjour'
                        "de-DE" = 'Meinen Urlaub stornieren'
                    }
                    "RefundType" = @{
                        "en" = '{6BB7A632-8CD4-49C3-ADCF-AB1449E8E1CA}'
    
                    }
                    "PopupTitle" = @{
                        "en" = "You Will Lose The Expired Staff Credit"
                        "fr-CH" = "Vous perdrez le crédit personnel expiré"
                        "de-CH" = "Du verlierst die abgelaufene Personalgutschrift"
                        "fr-FR" = "Vous allez perdre l’avoir réservé au personnel expiré"
                        "de-DE" = "Du verlierst das Expired Staff Guthaben."
                    }
                    "PopupDescription" = @{
                        "en" = "Are you sure you want to cancel your booking? As some or all of your staff credit has expired this will not be refunded. Once cancelled your booking cannot be reinstated."
                        "fr-CH" = "Vous êtes sûr de vouloir annuler votre réservation? Une partie ou l’intégralité de votre crédit personnel a expiré et ne sera pas remboursé. Une fois annulée, votre réservation ne peut être restaurée."
                        "de-CH" = "Bist du sicher, dass du deine Buchung stornieren willst? Deine Personalgutschrift ist ganz oder teilweise abgelaufen und wird nicht zurückerstattet. Wenn die Buchung storniert ist, kann dies nicht mehr rückgängig gemacht werden. "
                        "fr-FR" = "Êtes-vous sûr de vouloir annuler votre réservation ? Une partie ou la totalité de votre avoir réservé au personnel a expiré et ne sera pas remboursé. Une fois annulée, votre réservation ne peut pas être rétablie."
                        "de-DE" = "Möchtest du wirklich deine Buchung stornieren? Ganz oder teilweise verfallenes Personalguthaben wird nicht zurückerstattet. Eine stornierte Buchung kann nicht rückgängig gemacht werden."
                    }
                }
            }
