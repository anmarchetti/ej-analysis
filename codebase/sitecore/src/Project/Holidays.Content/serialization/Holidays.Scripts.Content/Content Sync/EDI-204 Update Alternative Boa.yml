- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Create new Datasource in Data folders
    $placeholder = "/body"
    
    $datasourceName = "Alternative Boards Popup"
    $datasourceTemplateId = "{FEEBD005-3DDA-4A48-A216-DAB9041ED7AF}"
    $datasourcePath ="/sitecore/content/EasyJet/Holidays/Data"
    $datasourcePathTrade ="/sitecore/content/EasyJet/TradePortal/Data"
                  
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $datasource = Get-Or-Create-Item -Path "$($datasourcePath)/$($datasourceName)" -Template $datasourceTemplateId;
    $datasourceTrade = Get-Or-Create-Item -Path "$($datasourcePathTrade)/$($datasourceName)" -Template $datasourceTemplateId;
    
    # Remove existing Datasource from Page Components folder
    $searchResultsItemPath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $searchResultsItemPathTrade = "/sitecore/content/EasyJet/TradePortal/Home/MixedResultList"
    Get-Item -Path "$($searchResultsItemPath)/Page Components/$($datasourceName)" -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    Get-Item -Path "$($searchResultsItemPathTrade)/Page Components/$($datasourceName)" -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    
    # Update Datasource on Search results pages
    $searchResultsPageItem = Get-Item -Path $searchResultsItemPath -ErrorAction SilentlyContinue
    $searchResultsPageItemTrade = Get-Item -Path $searchResultsItemPathTrade -ErrorAction SilentlyContinue
    
    $searchResultsRenderingId = "{5A3F1735-4675-4157-80E8-9ABB84EEFF79}"
    $renderingInstance = Get-Rendering -Item $searchResultsPageItem -PlaceHolder "/body" | Where-Object {$_.ItemId -eq $searchResultsRenderingId}
    $renderingInstanceTrade = Get-Rendering -Item $searchResultsPageItemTrade -PlaceHolder "/body" | Where-Object {$_.ItemId -eq $searchResultsRenderingId}
    
    Set-Rendering -Item $searchResultsPageItem -Instance $renderingInstance -DataSource "$($datasourcePath)/$($datasourceName)"
    Set-Rendering -Item $searchResultsPageItemTrade -Instance $renderingInstanceTrade -DataSource "$($datasourcePathTrade)/$($datasourceName)"
    Write-Host  "Rendering datasources were updated"
    
    Add-ItemVersion -Item $datasource -Language "en" -TargetLanguage "de-CH" -IfExist Skip
    Add-ItemVersion -Item $datasource -Language "en" -TargetLanguage "fr-CH" -IfExist Skip
    Add-ItemVersion -Item $datasourceTrade -Language "en" -TargetLanguage "de-CH" -IfExist Skip
    Add-ItemVersion -Item $datasourceTrade -Language "en" -TargetLanguage "fr-CH" -IfExist Skip
