    function remove-content-item($itemId, $itemPath) {
        $item = Get-Item -Path $itemPath -Id $itemId -ErrorAction SilentlyContinue
    
        if ($item -ne $null) {
            Remove-Item -Path $item.FullPath -Recurse -Force
            Write-Host "Item" $item.Name "successfully deleted";
        }
    }
    
    function get-or-create-item($path, $itemName, $templateId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    function create-package-icons($iconsFolder){
        ForEach($iconGroup in $bagPackageIcons){
            $iconGroupItem = get-or-create-item -Path "$($iconsFolder.FullPath)" -ItemName "$($iconGroup.Group)" -TemplateId $iconsGroupTemplateId
            ForEach($icon in $iconGroup.Icons){
                $iconItem = get-or-create-item -Path "$($iconGroupItem.FullPath)" -ItemName "$($icon.Name)" -TemplateId $bagIconTemplateId
                $iconItem.Editing.BeginEdit()
                $iconItem.Fields["Name"].Value = $icon.Name
                $iconItem.Fields["BagType"].Value = $icon.BagType
                $iconItem.Fields["Type"].Value = $icon.Type
                $iconItem.Fields["Icon"].Value = "<image mediaid='$($icon.Icon)'/>"
                $iconItem.Editing.EndEdit()
            }
        }
         ForEach($iconGroup in $packageIcons){
            $iconGroupItem = get-or-create-item -Path "$($iconsFolder.FullPath)" -ItemName "$($iconGroup.Group)" -TemplateId $iconsGroupTemplateId
            ForEach($icon in $iconGroup.Icons){
                $iconItem = get-or-create-item -Path "$($iconGroupItem.FullPath)" -ItemName "$($icon.Name)" -TemplateId $iconTemplateId
                $iconItem.Editing.BeginEdit()
                $iconItem.Fields["Name"].Value = $icon.Name
                $iconItem.Fields["Type"].Value = $icon.Type
                $iconItem.Fields["Icon"].Value = "<image mediaid='$($icon.Icon)'/>"
                $iconItem.Editing.EndEdit()
            }
        }
    }
    
    function set-package-icons-to-themes(){
        $themes = Get-Item -Path "master:" -Query "$($hotelThemesPath)//*[@@templatename='Hotel Theme']"
        
        $iconsFolderPath = "$($hotelThemesPath)/Package Icons/Bags"
        $icons = @()
        $bagsIcons = Get-Item -Path "master:" -Query "$($iconsFolderPath)//*[@@templatename='Package Theme Bag Icon']"
        $themeIcons = Get-Item -Path "master:" -Query "$($iconsFolderPath)//*[@@templatename='Package Theme Icon']"
        $icons += $bagsIcons
        $icons += $themeIcons
        $newPackageIcons = ($icons | select -ExpandProperty Id) -join "|"
    
        ForEach($theme in $themes){
                $currentPackageIcons = $theme.Fields["PackageIcons"].Value -split "\|"
                $currentPackageIcons = $currentPackageIcons | Where-Object { $_ -ne $oldBagId }
                $hotelPackageIcons = ($currentPackageIcons + $newPackageIcons) -join "|"
                
                $theme.Editing.BeginEdit()
                $theme.Fields["PackageIcons"].Value = $hotelPackageIcons
                $theme.Editing.EndEdit()
        }
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
