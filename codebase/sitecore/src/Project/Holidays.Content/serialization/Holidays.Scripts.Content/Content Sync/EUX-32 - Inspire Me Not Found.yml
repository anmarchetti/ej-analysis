SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId,$itemId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Set-Goal ($goalPath,$tagItemPath) {
    	$item = Get-Item -Path $tagItemPath
    	$item.Editing.BeginEdit()
    	$item["Goal"] = (Get-Item -Path $goalPath).ID
    	$item.Editing.EndEdit() | Out-Null
    	Write-Host "Updated" $tagItemPath
    }
    
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $tab = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components" -ItemName "Not Found Tab" -TemplateId "{CA7986F3-FFB2-49E5-B7A4-DA2E2FBAFA7F}"
    
    
    @('en') | % {
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Title" -Value "No Perfect Match Found, </br> But We've Got Ideas!"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Subtitle" -Value "<p>Hey there!</p> <p>While we didn't find your perfect match this time, we've got plenty of inspiring suggestions based on your preferences. Get ready to explore new horizons and embark on unforgettable adventures!</p>"
    }
    
    @('de-CH','de-DE') | % {
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Title" -Value "Keine perfekte Übereinstimmung gefunden, </br> aber wir haben Ideen!"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Subtitle" -Value "<p>Hallo! </p> <p>Auch wenn wir dieses Mal nicht den perfekten Partner für dich gefunden haben, so haben wir doch eine Menge inspirierender Vorschläge, die auf deinen Vorlieben basieren. Mach dich bereit, neue Horizonte zu entdecken und unvergessliche Abenteuer zu erleben!</p>"
    }
    @('fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Title" -Value "Pas de correspondance parfaite trouvée, </br>mais nous avons des idées!"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "Subtitle" -Value "<p>Bonjour à toutes et à tous!</p> <p>Bien que nous n'ayons pas trouvé votre partenaire idéal cette fois-ci, nous avons de nombreuses suggestions inspirantes basées sur vos préférences. Préparez-vous à explorer de nouveaux horizons et à vivre des aventures inoubliables! </p>"
    }
    
    # Add Not Found Datasource
    Set-Goal -goalPath "master:/sitecore/system/Marketing Control Panel/Goals/easyJet Holidays/Inspire Me/Beach" -tagItemPath "master:/sitecore/content/EasyJet/Holidays/Data/Tags/Holiday Type/Beach Holiday"
    Set-Goal -goalPath "master:/sitecore/system/Marketing Control Panel/Goals/easyJet Holidays/Inspire Me/City" -tagItemPath "master:/sitecore/content/EasyJet/Holidays/Data/Tags/Holiday Type/City Break"
    Set-Goal -goalPath "master:/sitecore/system/Marketing Control Panel/Goals/easyJet Holidays/Inspire Me/Lake" -tagItemPath "master:/sitecore/content/EasyJet/Holidays/Data/Tags/Holiday Type/Lakes"
    
    # Update Rendering
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration"
    $finalRenderingItem = Get-Item -Path "master:" -Id "{35A52048-189B-4426-B54E-CDCD31DC43C6}"
    $finalRendering = Get-Rendering -Item $page -PlaceHolder "*body*" -Rendering $finalRenderingItem
    if ($finalRendering -ne $null) {
    	Set-Rendering -Item $page -Instance $finalRendering -DataSource $final.ID
    	Write-Host $page.Name "Final Tabs Rendering successfully updated"
    }
