SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $holidaysSeatAndBagsPath = "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags"
    $tradePortalSeatAndBagsPath = "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags"
        
    $holidaysSeatAndBags = Get-Item -Path $holidaysSeatAndBagsPath
    $tradePortalSeatAndBags = Get-Item -Path $tradePortalSeatAndBagsPath
        
    $translations = @{
        "en" = @{
            "BookingOutOfSync" = "We can’t get the seat information for the flights on this holiday package, but don’t worry, any seats you have previously booked will still be valid."
            "BookingOutOfSyncTitle" = "Seats are unavailable at this time"
        }
        "fr-CH" = @{
            "BookingOutOfSync" = "Nous ne pouvons pas obtenir les informations de siège pour les vols de ce forfait vacances, mais ne vous inquiétez pas, tous les sièges que vous avez réservés précédemment resteront valides."
            "BookingOutOfSyncTitle" = "Les sièges ne sont pas disponibles pour le moment"
        }
        "fr-FR" = @{
            "BookingOutOfSync" = "Nous ne pouvons pas obtenir les informations de siège pour les vols de ce forfait vacances, mais ne vous inquiétez pas, tous les sièges que vous avez réservés précédemment resteront valides."
            "BookingOutOfSyncTitle" = "Les sièges ne sont pas disponibles pour le moment"
        }
        "de-CH" = @{
            "BookingOutOfSync" = "Wir können die Sitzplatzinformationen für die Flüge dieses Urlaubspakets nicht abrufen, aber keine Sorge, alle zuvor gebuchten Sitze bleiben gültig."
            "BookingOutOfSyncTitle" = "Sitze sind derzeit nicht verfügbar"
        }
        "de-DE" = @{
            "BookingOutOfSync" = "Wir können die Sitzplatzinformationen für die Flüge dieses Urlaubspakets nicht abrufen, aber keine Sorge, alle zuvor gebuchten Sitze bleiben gültig."
            "BookingOutOfSyncTitle" = "Sitze sind derzeit nicht verfügbar"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "BookingOutOfSync" -value $translations[$lang]["BookingOutOfSync"]
        create-lang-version -item $tradePortalSeatAndBags -lang $lang -field "BookingOutOfSync" -value $translations[$lang]["BookingOutOfSync"]
        
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "BookingOutOfSyncTitle" -value $translations[$lang]["BookingOutOfSyncTitle"]
        create-lang-version -item $tradePortalSeatAndBags -lang $lang -field "BookingOutOfSyncTitle" -value $translations[$lang]["BookingOutOfSyncTitle"]
    }
    
