    $notificationSettingsPath = "master:/sitecore/content/EasyJet/Holidays/Settings/Notifications Settings";
    
    $notificationsSettingsItem = Get-Item -Path $notificationSettingsPath;
    
    if($notificationsSettingsItem -ne $null){
        $notificationsSettingsItem.Editing.BeginEdit();
        $notificationsSettingsItem["IsAskToSubscribePopupEnabled"] = "1";
        $notificationsSettingsItem.Editing.EndEdit();
    }
