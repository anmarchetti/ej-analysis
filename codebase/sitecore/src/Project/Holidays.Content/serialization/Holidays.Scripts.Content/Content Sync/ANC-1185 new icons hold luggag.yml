    function create-lang-version($itemPath, $field, $value) {
    
            $targetLangItem = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    }
    
