  Value: |
    
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	  if ($item -eq $null) {
    		  $item = New-Item -Path $path -ItemType $templateId
    		  Write-Host "Item" $item.Name "successfully created"
    	  }
    	return $item
      }
       
      $ItemPath = '/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components/Search Results Map'
      $Item = Get-Or-Create-Item -Path $ItemPath -ItemName "Search Results Map" -TemplateId "{2488CF45-91CF-4728-9D4A-DD0501E41958}"
       
      if ($Item -ne $null) {
    	$Item.Editing.BeginEdit();
    	$Item["DesktopButton"] = 'View map';
    	$Item["MobileButton"] = 'Map view';
    	$Item.Editing.EndEdit() | Out-Null;
      }
    
