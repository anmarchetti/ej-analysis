    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components/Guest Details With Sigin In Prompt"
    
    # Update title
    if($item -ne $null){
        $item.Editing.BeginEdit()
        $item["PasswordErrorMessage"] = "
    <span>Your password must be:</span>
    <ul>
        <li>A single word between 8-20 characters</li>
        <li>You can use letters, numbers & special characters (except # & + or space)</li>
        <li>You must use at least 1 number and 1 letter </li>
        <li>It cannot start with a 0</li>
    </ul>" ;
        $item["PasswordTooltip"] = "<ul>
          <li>A single word between 8-20 characters</li>
        <li>You can use letters, numbers & special characters (except # & + or space)</li>
        <li>You must use at least 1 number and 1 letter </li>
        <li>It cannot start with a 0</li>
    </ul>";
        $item.Editing.EndEdit() | Out-Null;
        Write-Host "Item" $item.Name "successfully updated";
    }
    
    $item = Get-Item -Path '/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Titles/Password Info';
    
    if($item -ne $null){
        $item.Editing.BeginEdit()
        $item["Phrase"] = "Once you've booked, we'll create an account for you. You'll be able to use this email address and password to log in to easyJet and easyJet holidays. We do this so you can view and manage your booking online.";
        $item.Editing.EndEdit() | Out-Null;
        Write-Host "Item" $item.Name "successfully updated";
    }
    
