  Hint: Script
  Value: |
    function Edit-Data-Source ($dataSourcePath, $bagsPath){
        # Get data source
        $dataSource = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
        
        $holdBagsPath = $bagsPath + 'Hold Baggage';
        $bags = Get-ChildItem -Path $holdBagsPath;
        $holdLuggageItems = ($bags | select -ExpandProperty Id) -join "|"
        
        
        # update data source
        if ($dataSource -ne $null) {
            $dataSource.Editing.BeginEdit()
    	    $dataSource["DefaultBags"] = $holdLuggageItems;
            $dataSource.Editing.EndEdit() | Out-Null
            Write-Host $dataSource.Name "is updated";
        }
    
    }
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    #Setup defaults bag
    
    # Holidays
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Data/Extra Luggage Lists' -bagsPath '/sitecore/content/EasyJet/Holidays/Data/Luggage/' 
    
    # Trade
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Data/Extra Luggage Lists' -bagsPath '/sitecore/content/EasyJet/TradePortal/Data/Luggage/'
    
    #Set up new subtitles
