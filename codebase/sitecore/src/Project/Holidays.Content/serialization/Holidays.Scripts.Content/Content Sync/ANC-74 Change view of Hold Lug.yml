    # Holidays
    $dataPath = '/sitecore/content/EasyJet/Holidays/Data/Hold Luggage'
    $data = Get-Or-Create-Item -Path $dataPath -Template '{D0D47EC4-D20D-45B7-8486-58DD5311557A}'
    if($data -ne $null) {
        $data.Editing.BeginEdit()
        $data['HoldLuggageAndSportsSubtitle'] = 'Each passenger has a {number}kg bag included, but can add up to 2 more pieces of luggage, or one piece of sports equipment per passenger.'
        $data['HoldLuggageSubtitle'] = 'Each passenger has a {number}kg bag included, but can add up to 2 more pieces of luggage equipment per passenger.'
        $data['SportsSubtitle'] = "Each passenger has a {number}kg bag included, but can add one piece of sports equipment per passenger."
