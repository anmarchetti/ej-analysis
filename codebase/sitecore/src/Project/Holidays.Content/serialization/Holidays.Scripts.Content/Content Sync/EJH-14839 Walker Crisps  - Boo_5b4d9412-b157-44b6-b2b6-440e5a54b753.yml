  Value: |
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking"
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    $promocodeData = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Promocode Input" -templateId "{BAB6B707-4D06-4932-A852-5131328360DB}" 
    if ($promocodeData -ne $null) {
        $promocodeData.Editing.BeginEdit()
        $promocodeData["TitleGreatNewsBanner"] = "GREAT NEWS!";
    $promocodeData["TextGreatNewsBanner"] = 'Your new credit has been added to the account {email}. If you want to use your credit, select the <b>"Pay with credit"</b> option on the payment page.';
    $promocodeData["IconGreatNewsBanner"] = '<image mediaid="{09D6307F-1905-4B59-A2FB-0FD0B8DBC3F5}" />';
        
        $promocodeData.Editing.EndEdit() | Out-Null
    }
    
     Get-Rendering -Item $page | ForEach-Object {
            if($_.ItemId -eq "{B1C38035-64C4-435A-98BC-33616AD2E83E}") {
                Set-Rendering -Item $page -Instance $_ -Datasource $promocodeData.Id
            }
        }
    
