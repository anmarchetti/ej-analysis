  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    # create question folder and items
    $seatMap = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Data/SeatsMap" "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
    
    $seatMap.Editing.BeginEdit()
    
    $seatMap["PreviousLabel"] = "Excludes previous selection"
    $seatMap["PreviousToolTipText"] = "If you already have a seat booked for this passenger, you will be discounted the price of the seat."
    
    $seatMap["DowngradingTitle"] = "DOWNGRADING YOUR SEATS"
    $seatMap["DowngradingText"] = "<p>One or more seats you've selected may have less benefits than your previous selected seats.</p><p>If you downgrade from Extra Legroom or Upfront seats, you will lose your extra legroom and/or large cabin bag.</p><p>There are no refunds for downgrading your seat.</p>"
    $seatMap["DowngradingCancelButton"] = "Cancel"
    $seatMap["DowngradingContinueButton"] = "Continue with downgrade"
    
    $seatMap.Editing.EndEdit()
    
    
    
