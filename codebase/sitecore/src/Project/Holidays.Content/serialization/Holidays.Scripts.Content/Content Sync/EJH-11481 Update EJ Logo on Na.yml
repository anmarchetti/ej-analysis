  Hint: Script
  Value: |
    ############# SLIM HEADER
    
    #Create New Logo on Slim Header
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Slim Header"
    $datasourceTemplateId = "{FD0CEA6B-FE05-4106-A496-E8F1C75F9445}"
    
    $datasource = Get-Item -Database "master" -path $datasourcePath -ErrorAction SilentlyContinue
    
    if ($datasource -ne $null) {
           
        $datasource.Editing.BeginEdit()
        $datasource["Logo"] = "<image mediaid=`"{8B8A8CF1-B6C2-41A9-8A60-BA97544EC768}`" />"
        $datasource.Editing.EndEdit() | Out-Null
    
    }
    
    Write-Host "Finished Logo on Slim Header"
    
    ############# FULL HEADER
    
    #Create New Logo on Full Header
    $datasourcePathFull = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Full Header"
    $datasourceTemplateIdFull = "{FD0CEA6B-FE05-4106-A496-E8F1C75F9445}"
    
    $datasourceFull = Get-Item -Database "master" -path $datasourcePathFull -ErrorAction SilentlyContinue
    
    if ($datasourceFull -ne $null) {
        
        $datasourceFull.Editing.BeginEdit()
        $datasourceFull["Logo"] = "<image mediaid=`"{8B8A8CF1-B6C2-41A9-8A60-BA97544EC768}`" />"
        $datasourceFull.Editing.EndEdit() | Out-Null
    }
    
    Write-Host "Finished Logo on Full Header"
