SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $null
    }
    
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $currenciesPath = "/sitecore/content/EasyJet/Holidays/Data/Currencies"
    
    $currenciesItem = create-item -Path "/sitecore/content/EasyJet/Holidays/Data" -ItemName "Currencies" -ItemType "{5AA6F50D-C2C1-4506-BEAF-FBCE0720D20F}"
    
    if ($currenciesItem -ne $null) {
    
    $gbp = create-item -Path $currenciesPath -ItemName "GBP" -ItemType "{D3D0218E-D91A-4165-B844-CA406E254004}"
    $chf = create-item -Path $currenciesPath -ItemName "CHF" -ItemType "{D3D0218E-D91A-4165-B844-CA406E254004}"
    
    
    # shared fields so set values only once
    Create-Lang-Version -Item $gbp -Lang "en" -Field "Code" -Value "GBP" 
    Create-Lang-Version -Item $chf -Lang "en" -Field "Code" -Value "CHF"
    
    Create-Lang-Version -Item $gbp -Lang "fr-CH"
    Create-Lang-Version -Item $gbp -Lang "de-CH"
    Create-Lang-Version -Item $chf -Lang "fr-CH"
    Create-Lang-Version -Item $chf -Lang "de-CH"
    }
    
    
    # update markets with currencies
    $swiss = gi -path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/Switzerland" -ErrorAction SilentlyContinue
    if ($null -eq $swiss) {
        "No Swiss market settings found"
    } else {
         $swiss.Editing.BeginEdit()
         $swiss['Currency'] = $chf.Id;
         $swiss.Editing.EndEdit() | Out-Null
    }
    
    $uk = gi -path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom" -ErrorAction SilentlyContinue
    if ($null -eq $uk) {
        "No UK market settings found"
    } else {
         $uk.Editing.BeginEdit()
         $uk['Currency'] = $gbp.Id;
         $uk.Editing.EndEdit() | Out-Null
    }
    
    
