  Hint: Script
  Value: |
     $namesSearchesFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Live Price/Names Searches"
        $periodByDestinationTemplateId = "{056AC05C-E1D1-4FD4-BC4C-CEC966FA75E2}"
        
        function rename-item($path,$newName)
        {
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -ne $null){
                $item.Editing.BeginEdit()
                $item.Name = $newName
                $result = $item.Editing.EndEdit()
                return $item.Paths.FullPath
            }    
            return ""
        }
        
        function Create-Item($path,$name, $templateId){
            $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -Name $name -ItemType $templateId
            }
            return $item;
        }
        
        
        function Add-Period-Item($path, $name, $runStart, $runEnd, $searchStart, $searchEnd){
            $nsItem = Create-Item -Path $path -Name $name -TemplateId $periodByDestinationTemplateId
            
            $nsItem.Editing.BeginEdit()
            $nsItem["DateOfRunStartDate"] = $runStart
            $nsItem["DateOfRunEndDate"] = $runEnd
            $nsItem["SearchDateRangeStartDate"] = $searchStart
            $nsItem["SearchDateRangeEndDate"] = $searchEnd
            $nsItem.Editing.EndEdit()
            
        }
        
        $namesSearchesFolderPath = rename-item -Path $namesSearchesFolderPath -NewName "Named Searches"
        $namedSearchesItemPathes = @("$($namesSearchesFolderPath)/City", "$($namesSearchesFolderPath)/Beach", "$($namesSearchesFolderPath)/Family")
        
        for($i = 0; $i -lt $namedSearchesItemPathes.Length; $i++)
        {
            Add-Period-Item -Path $namedSearchesItemPathes[$i] -Name "All Jan 20" -runStart "20200101T000000Z" -runEnd "20200330T000000Z" -searchStart "20200501T000000Z" -searchEnd "20200715T000000Z"
            Add-Period-Item -Path $namedSearchesItemPathes[$i] -Name "All Apr 20" -runStart "20200401T000000Z" -runEnd "20200730T000000Z" -searchStart "20200601T000000Z" -searchEnd "20200831T000000Z"
            Add-Period-Item -Path $namedSearchesItemPathes[$i] -Name "All August 20" -runStart "20200801T000000Z" -runEnd "20200831T000000Z" -searchStart "20200801T000000Z" -searchEnd "20200930T000000Z"
            Add-Period-Item -Path $namedSearchesItemPathes[$i] -Name "All September 20" -runStart "20200901T000000Z" -runEnd "20201231T000000Z" -searchStart "20210601T000000Z" -searchEnd "20210831T000000Z"
        }
    
