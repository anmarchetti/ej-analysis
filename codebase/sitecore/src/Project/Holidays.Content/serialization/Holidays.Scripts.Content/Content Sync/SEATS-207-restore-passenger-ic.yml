  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/SeatsMap" -template "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
    if ($seatMap -ne $null){
        $seatMap.Editing.BeginEdit()
        $seatMap["SeatIconPassengerTypeAdult"] = "<image mediaid='{06F8D2AE-DE03-423D-AF5C-D9FBB2CA2555}' />"
        $seatMap["SeatIconPassengerTypeAdultWithInfant"] = "<image mediaid='{DBC393C1-3FBB-4C74-B29F-2B53695ADA06}' />"
        $seatMap["SeatIconPassengerTypeChild"] = "<image mediaid='{284C41F9-AF81-49AF-A3CE-D22B64C454B7}' />"
        $seatMap.Editing.EndEdit()
    
        Write-Host "updated seatMap - Seat Icon Passengers Type values"
    }
    
    $passengerBox = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/SeatsMap" -template "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
