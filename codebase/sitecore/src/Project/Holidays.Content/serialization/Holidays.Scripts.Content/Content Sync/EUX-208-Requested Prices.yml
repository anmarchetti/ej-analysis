SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/ 
    
    $requestedSearchesDataFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Requested Searches"
    $requestedSearchesDataFolderItem = Get-Item -path $requestedSearchesDataFolderPath -ErrorAction SilentlyContinue
    
    $ukMarketSettingsItemPath = "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom"
    $ukMarketSettingsItem = Get-Item -path $ukMarketSettingsItemPath -ErrorAction SilentlyContinue
    
    if ($requestedSearchesDataFolderItem -ne $null -and $ukMarketSettingsItem -ne $null) {
        
        $requestedSearchItems = Get-ChildItem -Path $requestedSearchesDataFolderItem.ProviderPath | Where-Object { $_.TemplateName -eq "Requested Search" }
        
        $requestedSearchesUkItemPath = $requestedSearchesDataFolderItem.ProviderPath + "/Requested Searches UK"
        $newRequestedSearchUkItem = New-Item -Path $requestedSearchesUkItemPath -ItemType "/sitecore/templates/Foundation/Destinations/Requested Searches/Requested Searches Market Folder"
        
        if ($newRequestedSearchUkItem -ne $null) {
            $newRequestedSearchUkItem.Editing.BeginEdit()
            $newRequestedSearchUkItem["Market"] =  $ukMarketSettingsItem.ID.ToString()
            $newRequestedSearchUkItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Item" $newRequestedSearchUkItem.Name "successfully updated"
            
            foreach ($requestedSearchItem in $requestedSearchItems) {
                Move-Item -Path $requestedSearchItem.ProviderPath -Destination $newRequestedSearchUkItem.ProviderPath
                Write-Host "Item" $requestedSearchItem.Name "successfully moved"
            }
        }
    }
