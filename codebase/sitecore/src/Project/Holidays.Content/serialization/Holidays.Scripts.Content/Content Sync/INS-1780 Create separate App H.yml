Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1780 Create separate App Header"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $partialDesignsPath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs"
    $headersDataPath = "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers"
    
    $renderingItem = Get-Item -Path "/sitecore/layout/Renderings/Project/Holidays/App Header"
    
    function Add-PageHeaderRendering($item, $renderingItem, $datasource) {
    
        $renderingDefinition = Get-Rendering -Item $item -Rendering $renderingItem
        
        if ($renderingDefinition) {
            Write-Host "App Header rendering already exists in Shared layout, skipping" -ForegroundColor Yellow
            return
        }
    
        $renderingDefinition = New-Object Sitecore.Layouts.RenderingDefinition
        $renderingDefinition.ItemID = $renderingItem.ID
    
        $renderingDefinition.Placeholder = "header"
        $renderingDefinition.Datasource = $datasource
    
        Add-Rendering -Item $item -Instance $renderingDefinition -Placeholder "header"
    }
    
    function Add-AppHeaderRendering($itemName) {
        $item = Get-Item -Path "$partialDesignsPath/$itemName" -ErrorAction SilentlyContinue
        $headerDataSource = Get-Item -Path "$headersDataPath/$itemName" -ErrorAction SilentlyContinue
    
        if ($item -eq $null -or $headerDataSource -eq $null) {
            Write-Host "Missing items for $itemName"
            return
        }
            
        Add-PageHeaderRendering `
            -item $item `
            -renderingItem $renderingItem `
            -datasource "$headersDataPath/$itemName"
                
        Write-Host "Added App Header rendering to Shared layout" -ForegroundColor Green
    }
    
    $fullHeader = "Full Header"
    $fullHeaderWithMarketSelector = "Full Header With Market Selector"
    $slimHeader = "Slim Header"
    Add-AppHeaderRendering -itemName $fullHeader
    Add-AppHeaderRendering -itemName $fullHeaderWithMarketSelector
    Add-AppHeaderRendering -itemName $slimHeader
