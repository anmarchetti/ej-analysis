Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Balearic Canary Andalucia Codes
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $pathToAndalucia = "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Andalucia";
    $pathToBalearic = "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Balearic Islands";
    $pathToCanary = "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Canary Islands";
    
    $itemAndalucia = Get-Item -Path $pathToAndalucia
    $itemBalearic = Get-Item -Path $pathToBalearic
    $itemCanary = Get-Item -Path $pathToCanary
    
    if ($itemAndalucia -ne $null) {
        $itemAndalucia.Editing.BeginEdit()
        $itemAndalucia.Fields["Code"].Value = "VAND"
        $itemAndalucia.Editing.EndEdit()
    }
    
    if ($itemBalearic -ne $null) {
        $itemBalearic.Editing.BeginEdit()
        $itemBalearic.Fields["Code"].Value = "BIV"
        $itemBalearic.Editing.EndEdit()
    }
    
    if ($itemCanary -ne $null) {
        $itemCanary.Editing.BeginEdit()
        $itemCanary.Fields["Code"].Value = "CIV"
        $itemCanary.Editing.EndEdit()
    }
    
    Write-Host "Script is completed"
    
    
    
