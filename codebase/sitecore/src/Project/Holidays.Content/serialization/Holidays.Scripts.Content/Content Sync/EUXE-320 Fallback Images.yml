Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUXE-320 Fallback Images"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function UpdateFallbackImage($path, $lang, $value){
        $setting = gi -Path "master:$($path)" -Lang $lang -ErrorAction SilentlyContinue
        if($setting -ne $null){
            $setting.Editing.BeginEdit()
            $setting["HotelFallbackImage"] = $value
            $setting.Editing.EndEdit() | Out-Null
            Write-Host "Fallback Image in $($path) in $($lang) has been updated"
        }
    }
    
    $path = "/sitecore/content/EasyJet/Holidays/Settings/Image Carousel Settings"
    
    Add-ItemVersion -Path $path -Language "en" -TargetLanguage "fr-FR", "fr-CH", "de-CH", "de-DE" -IfExist Skip 
    
    $settingEN = gi -Path "master:$($path)" -Lang "en" -ErrorAction SilentlyContinue
    if($settingEN -ne $null){
        $settingEN.Editing.BeginEdit()
        $settingEN["HotelFallbackImage"] = '<image mediaid="{C7AABEF6-EBC7-4489-B6D1-8786E1A8A194}" />'
        $settingEN["HotelThumbnailFallbackImage"] = '<image mediaid="{4EF8DD1F-60BD-4DDE-BB82-408F79DFFDF5}" />'
        $settingEN.Editing.EndEdit() | Out-Null
    }
    
    # FR, CH-FR lang
    UpdateFallbackImage -path $path -lang "fr-FR" -value '<image mediaid="{7F720035-93D9-49CB-B094-D535375DCCC4}" />'
    UpdateFallbackImage -path $path -lang "fr-CH" -value '<image mediaid="{7F720035-93D9-49CB-B094-D535375DCCC4}" />'
    
    # DE, CH-DE
    UpdateFallbackImage -path $path -lang "de-CH" -value '<image mediaid="{C59216C9-30D2-4D51-A077-8406CF82BC84}" />'
    UpdateFallbackImage -path $path -lang "de-DE" -value '<image mediaid="{C59216C9-30D2-4D51-A077-8406CF82BC84}" />'
    
    Write-Host "Image fallback images are updated"
    
    
    
    
