  Hint: Script
  Value: |
    $folderPath = "/sitecore/content/EasyJet/Holidays/Data"
    
    function update-item-name($path,$oldName,$newName){
        $item = Get-Item -Path "$($path)/$($oldName)" -ErrorAction SilentlyContinue
        if($item -ne $null){
            $item.Editing.BeginEdit()
            $item.Name = $newName
            $item.Editing.EndEdit()
        }
    }
    
    update-item-name -Path $folderPath -OldName "Cancel And Refund" -NewName "Bulk Amendment Tool"
