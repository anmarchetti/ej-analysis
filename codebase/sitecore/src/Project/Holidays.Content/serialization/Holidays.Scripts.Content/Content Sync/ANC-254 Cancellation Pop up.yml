- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Change-Content($path, $lang, $field, $value){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
        
    $translations = @{
        "en" = @{
            "CancellationPopUpTitle" = "Cancel seat selection?";
            "CancellationPopUpDescription" = "Would you like to cancel your seat selection?"
            "CancellationPopUpBackButton" = "Cancel my seats selection"
            "CancellationPopUpContinueButton" = "Cancel"
        }
        "fr-CH" = @{
            "CancellationPopUpTitle" = "Annuler la sélection des sièges?";
            "CancellationPopUpDescription" = "Souhaitez-vous annuler votre sélection de sièges?"
            "CancellationPopUpBackButton" = "Annuler ma sélection de sièges"
            "CancellationPopUpContinueButton" = "Annuler"
        }
        "fr-FR" = @{
            "CancellationPopUpTitle" = "Annuler la sélection de place?";
            "CancellationPopUpDescription" = "Voulez-vous annuler votre sélection de place?"
            "CancellationPopUpBackButton" = "Annuler ma sélection de place"
            "CancellationPopUpContinueButton" = "Annuler"
        }
        "de-CH" = @{
            "CancellationPopUpTitle" = "Sitzplatzauswahl abbrechen?";
            "CancellationPopUpDescription" = "Möchten Sie Ihre Sitzplatzauswahl abbrechen?"
            "CancellationPopUpBackButton" = "Meine Sitzplatzauswahl abbrechen"
            "CancellationPopUpContinueButton" = "Abbrechen"
        }
        "de-DE" = @{
            "CancellationPopUpTitle" = "Sitzplatzauswahl abbrechen?";
            "CancellationPopUpDescription" = "Möchten Sie Ihre Sitzplatzauswahl abbrechen?"
            "CancellationPopUpBackButton" = "Meine Sitzplatzauswahl abbrechen"
            "CancellationPopUpContinueButton" = "Abbrechen"
        }
    }
    
            
    # Holidays
            
    $dataPath = '/sitecore/content/EasyJet/Holidays/Data/SeatsMap';
    
    foreach ($lang in $translations.Keys) {
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpTitle" -value $translations[$lang]["CancellationPopUpTitle"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpDescription" -value $translations[$lang]["CancellationPopUpDescription"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpBackButton" -value $translations[$lang]["CancellationPopUpBackButton"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpContinueButton" -value $translations[$lang]["CancellationPopUpContinueButton"]
    }
            
    # Trade
            
    $dataPath = '/sitecore/content/EasyJet/TradePortal/Data/Seats Map Trade'
                
    foreach ($lang in $translations.Keys) {
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpTitle" -value $translations[$lang]["CancellationPopUpTitle"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpDescription" -value $translations[$lang]["CancellationPopUpDescription"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpBackButton" -value $translations[$lang]["CancellationPopUpBackButton"]
        Change-Content -path $dataPath -lang $lang -field "CancellationPopUpContinueButton" -value $translations[$lang]["CancellationPopUpContinueButton"]
    }
    
