  Hint: Script
  Value: |
    $itemHolidaysSingularPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Basket/Labels/Hold Bag Singular"
    $itemHolidaysPluralPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Basket/Labels/Hold Bags Plural"
    $itemTradeSingularPath = "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Basket/Labels/Hold Bag Singular"
    $itemTradePluralPath = "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Basket/Labels/Hold Bags Plural"
    
    function updateBasket ($itemPath,$translation, $language) { 
        
            $item = Get-Item -Path $itemPath -Language $language;
            if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = $translation
            $item.Editing.EndEdit() | Out-Null
            }
            
    }
    
    
    
    updateBasket -ItemPath $itemHolidaysSingularPath -Translation ' x Hold item' -Language 'en'
    updateBasket -ItemPath $itemHolidaysSingularPath -Translation " x Maintenir l'article" -Language 'fr-CH'
    updateBasket -ItemPath $itemHolidaysSingularPath -Translation " x Maintenir l'article"  -Language 'fr-FR'
    updateBasket -ItemPath $itemHolidaysSingularPath -Translation ' x Gegenstand halten' -Language 'de-CH'
    updateBasket -ItemPath $itemHolidaysSingularPath -Translation ' x Gegenstand halten' -Language 'de-DE'
    updateBasket -ItemPath $itemHolidaysPluralPath -Translation ' x Hold items' -Language 'en'
    updateBasket -ItemPath $itemHolidaysPluralPath -Translation ' x Maintenir les articles' -Language 'fr-CH'
    updateBasket -ItemPath $itemHolidaysPluralPath -Translation ' x Maintenir les articles' -Language 'fr-FR'
    updateBasket -ItemPath $itemHolidaysPluralPath -Translation ' x Gegenstände halten' -Language 'de-CH'
    updateBasket -ItemPath $itemHolidaysPluralPath -Translation ' x Gegenstände halten' -Language 'de-DE'
    
    updateBasket -ItemPath $itemTradeSingularPath -Translation ' x Hold item' -Language 'en'
    updateBasket -ItemPath $itemTradeSingularPath -Translation " x Maintenir l'article" -Language 'fr-CH'
    updateBasket -ItemPath $itemTradeSingularPath -Translation " x Maintenir l'article" -Language 'fr-FR'
    updateBasket -ItemPath $itemTradeSingularPath -Translation ' x Gegenstand halten' -Language 'de-CH'
    updateBasket -ItemPath $itemTradeSingularPath -Translation ' x Gegenstand halten' -Language 'de-DE'
    updateBasket -ItemPath $itemTradePluralPath -Translation ' x Hold items' -Language 'en'
    updateBasket -ItemPath $itemTradePluralPath -Translation ' x Maintenir les articles' -Language 'fr-CH'
    updateBasket -ItemPath $itemTradePluralPath -Translation ' x Maintenir les articles' -Language 'fr-FR'
    updateBasket -ItemPath $itemTradePluralPath -Translation ' x Gegenstände halten' -Language 'de-CH'
    updateBasket -ItemPath $itemTradePluralPath -Translation ' x Gegenstände halten' -Language 'de-DE'
    
    
    
    
    
