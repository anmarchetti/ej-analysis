    $path = "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Contact Us Questions Folder"
    
    function Add-LangVersion($item,$lang) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Append
        }
    }
    function Update-CaseType($itemName, $lang, $title, $state) {
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if ($item -ne $null) {
            Add-LangVersion -Item $item -Lang $lang
            $langItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $langItem.Editing.BeginEdit()
            $langItem["Title"] = $title;
            $langItem["State"] = $state;
            $langItem.Editing.EndEdit() | Out-Null
        }
    }
    function Update-FormQuestionList($lang, $list) {
        $form = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form" -Language $lang
        if ($form -ne $null) {
            $form.Editing.BeginEdit()
            $form["QuestionList"] = $list
            $form.Editing.EndEdit() | Out-Null
        }
    }
    
