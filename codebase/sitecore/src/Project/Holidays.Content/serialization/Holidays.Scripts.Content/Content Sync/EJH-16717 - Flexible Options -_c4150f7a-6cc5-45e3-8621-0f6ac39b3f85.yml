Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-16717 - Flexible Options - Trade"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $dataFolderPath = "master:/sitecore/content/EasyJet/TradePortal/Data";
    $folderPath = "master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options";
    $folderTemplateId = '{CDEF20AE-AD55-4500-BDAC-6158DC94EEF4}';
    
    $folder = Get-Item -Path $folderPath -ErrorAction SilentlyContinue
    if ($folder -eq $null) {
        $folder = New-Item -Path $dataFolderPath -ItemType $folderTemplateId -Name "Flexibility Options"
        Write-Host "Item" $folder.Name "successfully created"
    } else {
        Write-Host "Folder Flexibility Options already exists"
    }
    
    $items = @(
        [pscustomobject]@{path="master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/Exact Date";days=0;label="Exact dates"},
        [pscustomobject]@{path="master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/1 Day";days=1;label="+/- 1 day"},
        [pscustomobject]@{path="master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/2 Day";days=2;label="+/- 2 day"},
        [pscustomobject]@{path="master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/3 Day";days=3;label="+/- 3 day"}
    )
    $itemTemplateId = "{F90CAA56-CE07-4361-AEFC-5B644B55DF2C}"
    
    $items | ForEach-Object {
        $item = Get-Item -path $_.path -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            
            # create item
            $item = New-Item -Path $_.path -ItemType $itemTemplateId
            Write-Host "Item" $item.Name "successfully created"
            
            $item.Editing.BeginEdit()
            $item["Days"] = $_.days
            $item["Label"] = $_.label
            $item.Editing.EndEdit() | Out-Null
            
            Write-Host "Item" $item.Name "successfully updated"
        }
    }
    
    $searchOptions = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Settings/Search Pod Settings"
    if ($searchOptions -ne $null) {
        $option1 = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/Exact Date"
        $option2 = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/1 Day"
        $option3 = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/2 Day"
        $option4 = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Flexibility Options/3 Day"
    
        $searchOptions.Editing.BeginEdit()
        $searchOptions["FlexibilityOptions"] = "$($option1.ID)|$($option2.ID)|$($option3.ID)|$($option4.ID)"
        $searchOptions.Editing.EndEdit()
        
        Write-Host "FlexibilityOptions Updated"
    }
