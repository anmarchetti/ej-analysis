Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Login Dictionary
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function updateDictionary($key, $phrase) {
        $item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$key']" -ErrorAction SilentlyContinue
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = $phrase
            $item.Editing.EndEdit() | Out-Null
        
            Write-Host "Item" $item.Name "successfully updated"
        }
    }
    
    $NotificationOutsideTheBookingFlow = "Login.Descriptions.NotificationOutsideTheBookingFlow";
    $NotificationInsideTheBookingFlow = "Login.Descriptions.NotificationInsideTheBookingFlow";
    $IHaveUpdatedPassword = "Login.Buttons.IHaveUpdatedPassword";
    
    updateDictionary -Key $NotificationOutsideTheBookingFlow -Phrase "Once you've updated your password click the link below and try again."
    updateDictionary -Key $NotificationInsideTheBookingFlow -Phrase "Once you've updated your password click the link below and try again."
    updateDictionary -Key $IHaveUpdatedPassword -Phrase "Log in >"
    
