  Hint: Script
  Value: |
    $defaultItemPath = "/sitecore/content/EasyJet/Holidays/Settings/Pandemic Levels/Default"
    
    function Set-Default($path)
    {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -ne $null)
        {
            $item.Editing.BeginEdit()
            $item.Fields["IsDefault"].Value = "1"
            $item.Editing.EndEdit()
        }
    }
    
    Set-Default -Path $defaultItemPath
