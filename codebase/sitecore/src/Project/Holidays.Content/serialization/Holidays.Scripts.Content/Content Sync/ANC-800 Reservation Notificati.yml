- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($itemPath, $lang, $field, $value) {
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
      $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -ne $null) {
        	$targetLangItem.Editing.BeginEdit();
        	$targetLangItem[$field] = $value;
        	$targetLangItem.Editing.EndEdit() | Out-Null;
        	Write-Host $targetLangItem.Name "is updated";
        }
    }
    
     # Paths
    $holidaysAltFlightPath = "/sitecore/content/EasyJet/Holidays/Home/Hotel Details/Page Components/Alternative Flights"
    $tradePortalAltFlightPath = "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details/Page Components/Alternative Flights"
        
    $holidaysPriceGraphPath = "/sitecore/content/EasyJet/Holidays/Data/Compare Price Modules/Price Graph and Calendar Module"
    $tradePortalPriceGraphPath = "/sitecore/content/EasyJet/TradePortal/Data/Compare Price Modules/Price Graph and Calendar Module"
        
    $translations = @{
        "en" = @{
            "ReservationNotificationTitle" = "Prices shown without seats or additional bags";
            "ReservationNotificationDescription" = "The alternative flight prices shown below do not include large cabin bags, hold luggage or seats you have reserved at a value of {price}. If you change your flights, you will have to pick these additional extras again.";
        }
        "fr-CH" = @{
            "ReservationNotificationTitle" = "Prix affichés sans sièges ni bagages supplémentaires";
            "ReservationNotificationDescription" = "Les prix alternatifs des vols indiqués ci-dessous n'incluent pas les grands sacs de cabine, les bagages en soute ou les sièges que vous avez réservés pour une valeur de {price}. Si vous modifiez vos vols, vous devrez sélectionner à nouveau ces extras.";
        }
        "fr-FR" = @{
            "ReservationNotificationTitle" = "Prix affichés sans sièges ni bagages supplémentaires";
            "ReservationNotificationDescription" = "Les prix alternatifs des vols affichés ci-dessous n'incluent pas les grands bagages de cabine, les bagages enregistrés ou les sièges que vous avez réservés pour une valeur de {price}. Si vous changez vos vols, vous devrez choisir à nouveau ces options supplémentaires.";
        }
        "de-CH" = @{
            "ReservationNotificationTitle" = "Preise ohne Sitze oder zusätzliches Gepäck angezeigt";
            "ReservationNotificationDescription" = "Die unten angezeigten alternativen Flugpreise beinhalten keine großen Kabinentaschen, aufgegebenes Gepäck oder reservierte Sitze im Wert von {price}. Wenn Sie Ihre Flüge ändern, müssen Sie diese zusätzlichen Extras erneut auswählen.";
        }
        "de-DE" = @{
            "ReservationNotificationTitle" = "Preise ohne Sitze oder zusätzliches Gepäck angezeigt";
            "ReservationNotificationDescription" = "Die unten angezeigten alternativen Flugpreise schließen keine großen Kabinentaschen, aufgegebenes Gepäck oder bereits reservierte Sitze im Wert von {price} ein. Wenn Sie Ihre Flüge ändern, müssen Sie diese Zusatzleistungen erneut wählen.";
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysAltFlightPath -lang $lang -field "ReservationNotificationTitle" -value $translations[$lang]["ReservationNotificationTitle"]
        create-lang-version -item $holidaysAltFlightPath -lang $lang -field "ReservationNotificationDescription" -value $translations[$lang]["ReservationNotificationDescription"]
                    
        create-lang-version -item $tradePortalAltFlightPath -lang $lang -field "ReservationNotificationTitle" -value $translations[$lang]["ReservationNotificationTitle"]
        create-lang-version -item $tradePortalAltFlightPath -lang $lang -field "ReservationNotificationDescription" -value $translations[$lang]["ReservationNotificationDescription"]
            
        create-lang-version -item $holidaysPriceGraphPath -lang $lang -field "ReservationNotificationTitle" -value $translations[$lang]["ReservationNotificationTitle"]
        create-lang-version -item $holidaysPriceGraphPath -lang $lang -field "ReservationNotificationDescription" -value $translations[$lang]["ReservationNotificationDescription"]
            
        create-lang-version -item $tradePortalPriceGraphPath -lang $lang -field "ReservationNotificationTitle" -value $translations[$lang]["ReservationNotificationTitle"]
        create-lang-version -item $tradePortalPriceGraphPath -lang $lang -field "ReservationNotificationDescription" -value $translations[$lang]["ReservationNotificationDescription"]
    }
       
