  Hint: Script
  Value: |
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    $abtaHolidaysItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Why book with us/Page Components/Partnerships And Certificates/ABTA" -ErrorAction SilentlyContinue;
    $atolHolidaysItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Why book with us/Page Components/Partnerships And Certificates/ATOL" -ErrorAction SilentlyContinue;
    
    $abtaTradeItem = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Root/Info/Why book with us/Page Components/Partnerships And Certificates/ABTA" -ErrorAction SilentlyContinue;
    $atolTradeItem = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Root/Info/Why book with us/Page Components/Partnerships And Certificates/ATOL" -ErrorAction SilentlyContinue;
    
    
    
    $abtaData = @(
        @{
            fieldName = "Description";
            values = @{
                en = '<p><span style="background-color: #ffffff; color: #000000;">We work closely with ABTA on hotel standards, safety, and advice for travellers. Find further advice on</span>&nbsp;their&nbsp;<a rel="noopener noreferrer" href="https://www.abta.com/tips-and-advice" target="_blank">website</a>.</p>'
            }
        },
        @{
            fieldName = "TextableIcon";
            values = @{
                en = '<image mediaid="{7F1F0E56-BC6A-4017-9989-0F66DBF7CA13}" alt="Abta" height="60" width="113" />'
            } 
        }
    );
    @($abtaHolidaysItem, $abtaTradeItem) | ForEach {
        if ($_ -ne $null) {
            update-item-with-lang -Item $_ -data $abtaData;
        }
    }
    
    
    $atolData = @(
        @{
            fieldName = "Description";
            values = @{
                en = '<p><span style="background-color: #ffffff; color: #000000;">All our holidays are 100% ATOL protected. You are financially protected under the <a rel="noopener noreferrer" href="https://www.easyjet.com/en/policy/atol?utm_source=easyjetholidays_en&amp;utm_medium=holidays&amp;utm_campaign=holidays_footer" target="_blank">ATOL scheme</a>, giving you total peace of mind when you book with us.</span></p>'
            }
        },
        @{
            fieldName = "TextableIcon";
            values = @{
                en = '<image mediaid="{12E0F940-4AD2-43F0-8735-E1F1E6FABEDB}" alt="Atol" height="60" width="60" />'
            } 
        }
    );
    
    
    @($atolHolidaysItem, $atolTradeItem) | ForEach {
        if ($_ -ne $null) {
            update-item-with-lang -Item $_ -data $atolData;
        }
    }
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
