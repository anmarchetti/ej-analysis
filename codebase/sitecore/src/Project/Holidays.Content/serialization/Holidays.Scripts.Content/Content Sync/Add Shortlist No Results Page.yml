SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $itemName, $templateId, $itemId){
        $item = Get-Item -Path "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    function Update-Rendering-DataSource($item, $renderingId, $newDataSource){
        $renderingItem = Get-Rendering -Item $item | Where-Object {$_.ItemId -eq $renderingId}
    
        if($renderingItem -ne $null){
            Set-Rendering -Item $item -Instance $renderingItem -DataSource $newDataSource
            Write-Host $item.Name  "Rendering successfully updated"
        }
    }
    
    function Set-Page-Design($designPath, $pageTemplateId) {
        $designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
        if ($designItem -ne $null) {
             [Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
            
            if(!$pageTemplates.Contains($pageTemplateId)) {
                $designItem.Editing.BeginEdit();
                $pageTemplates.add($pageTemplateId);
                $designItem.Editing.EndEdit() | Out-Null
                Write-Host "Page Templates of" $designItem.Name "are updated"
            }
        }
    }
    
    $pageTemplateId = "{06D260AD-62BE-444B-87E6-1FA76493C541}"
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" -ItemName "Shortlists No Results" -TemplateId $pageTemplateId
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design" -pageTemplateId $pageTemplateId
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create Shortlists No Results component
    $shortlists = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Shortlists No Results" -TemplateId "{25B9CD09-4FD6-436A-8408-B63CCA0011DA}"
    $shortlists.Editing.BeginEdit()
    $shortlists["Title"] = "There’s nothing shortlisted yet"
    $shortlists["Description"] = "Why not have a look at our different holiday packages, from family holidays to undiscovered breaks, discover where easyJet holidays can take you."
    $shortlists["Icon"] = '<image mediaid="{849429CC-E45C-45BB-AD11-380AE61C7814}" />'
    $shortlists.Editing.EndEdit() | Out-Null
    
    # Update Shortlists No Results Rendering
    Update-Rendering-DataSource -Item $page -RenderingId "{C7623179-82F5-467D-9179-FDD44181CBA5}" -NewDataSource $shortlists.ID
    
    # Promo Blocks
    # Create common Promo Blocks Folder in Data/
    $promoBlocksTemplateId = "{EB30259D-FF9A-46CB-8E0C-4616B148F3A8}"
    $dataPromoBlocks = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data" -ItemName "Promo Blocks" -TemplateId $promoBlocksTemplateId
    
    $homePromoBlocks =  Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Page Components/First Row Promo Blocks" -ErrorAction SilentlyContinue
    if($homePromoBlocks -ne $null) {
        
        # Move Home Page Promo Blocks to Data/ 
        Move-Item -Path $homePromoBlocks.ItemPath -Destination "$($dataPromoBlocks.ItemPath)/Holiday Offers"
        
        # Update Promo Block Rendering on Shortlist
        Update-Rendering-DataSource -Item $page -RenderingId "{FF441699-4D65-45C1-B565-E87714B5A278}" -NewDataSource $homePromoBlocks.ID
    }
    
    
    
