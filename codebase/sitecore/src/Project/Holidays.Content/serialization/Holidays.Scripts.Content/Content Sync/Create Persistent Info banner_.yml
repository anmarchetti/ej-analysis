- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $tilesPath = "/sitecore/content/EasyJet/Holidays/Data/Information Tiles/Global Information Tiles";
    $infoBannerItemId = "{43379DA2-1D47-412C-B527-3889F16BF4B3}"
    $infoBannerItem = Get-Item -Path $tilesPath -Id $infoBannerItemId -ErrorAction SilentlyContinue
    
    if ($infoBannerItem -eq $null){
        $infoBannerItem = New-Item -Path $tilesPath -Name "Persistent Info Banner" -ItemType "{424BD58C-E281-4DAD-8F46-7FE4DE602C0F}" -ForceId $infoBannerItemId
    
        $infoBannerItem.Editing.BeginEdit()
        $infoBannerItem["Title"] = "We’re working on making a better experience for you. We should be back anytime soon…"
        $infoBannerItem["Description"] = "Please bear with us. We apologise for any inconveniences caused and thank you for your patience."
        $infoBannerItem["Icon"] = "<image mediaid='{90267470-172A-4102-B274-CCD136CD9651}' />"
        $infoBannerItem.Editing.EndEdit()
    
        Write-Host "Persistent info banner was created"
    }
