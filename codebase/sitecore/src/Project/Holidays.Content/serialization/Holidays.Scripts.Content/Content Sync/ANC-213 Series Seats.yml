  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $holidaysSeatAndBagsPath = "/sitecore/content/EasyJet/Holidays/Data/Ancillaries/Seat And Bags"
    $tradePortalSeatAndBagsPath = "/sitecore/content/EasyJet/TradePortal/Data/Ancillaries/Seat And Bags"
        
    $holidaysSeatAndBags = Get-Item -Path $holidaysSeatAndBagsPath
    $tradePortalSeatAndBags = Get-Item -Path $tradePortalSeatAndBagsPath
        
    $translations = @{
        "en" = @{
            "SeriesSeatFlights" = "Looking to select your seats and add bags? It’s too early to do this for your flight right now. So please continue with your holiday booking and then come back 30 days before your departure date to choose your seats and add cabin bags or hold luggage."
            "SeriesSeatFlightsTitle" = "Seats and bags availability"
            "SeriesSeatFlightsPageTitle" = "Your Seats & Bags"
        }
        "fr-CH" = @{
            "SeriesSeatFlights" = "Vous souhaitez sélectionner vos sièges et ajouter des bagages ? Il est trop tôt pour le faire pour votre vol pour le moment. Veuillez donc continuer votre réservation de vacances, puis revenir 30 jours avant votre date de départ pour choisir vos sièges et ajouter des bagages à main ou des bagages en soute."
            "SeriesSeatFlightsTitle" = "Disponibilité des sièges et des bagages"
            "SeriesSeatFlightsPageTitle" = "Vos sièges et bagages"
        }
        "fr-FR" = @{
            "SeriesSeatFlights" = "Vous souhaitez sélectionner vos sièges et ajouter des bagages ? Il est trop tôt pour le faire pour votre vol pour le moment. Veuillez donc continuer votre réservation de vacances, puis revenir 30 jours avant votre date de départ pour choisir vos sièges et ajouter des bagages à main ou des bagages en soute."
            "SeriesSeatFlightsTitle" = "Disponibilité des sièges et des bagages"
            "SeriesSeatFlightsPageTitle" = "Vos sièges et bagages"
        }
        "de-CH" = @{
            "SeriesSeatFlights" = "Möchten Sie Ihre Sitze auswählen und Gepäck hinzufügen? Es ist zu früh, dies für Ihren Flug zu tun. Bitte fahren Sie mit Ihrer Urlaubsbuchung fort und kommen Sie dann 30 Tage vor Ihrem Abflugdatum zurück, um Ihre Sitze auszuwählen und Handgepäck oder aufgegebenes Gepäck hinzuzufügen."
            "SeriesSeatFlightsTitle" = "Verfügbarkeit von Sitzen und Gepäck"
            "SeriesSeatFlightsPageTitle" = "Ihre Sitze & Gepäck"
        }
        "de-DE" = @{
            "SeriesSeatFlights" = "Möchten Sie Ihre Sitze auswählen und Gepäck hinzufügen? Es ist zu früh, dies für Ihren Flug zu tun. Bitte fahren Sie mit Ihrer Urlaubsbuchung fort und kommen Sie dann 30 Tage vor Ihrem Abflugdatum zurück, um Ihre Sitze auszuwählen und Handgepäck oder aufgegebenes Gepäck hinzuzufügen."
            "SeriesSeatFlightsTitle" = "Verfügbarkeit von Sitzen und Gepäck"
            "SeriesSeatFlightsPageTitle" = "Ihre Sitze & Gepäck"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "SeriesSeatFlights" -value $translations[$lang]["SeriesSeatFlights"]
        create-lang-version -item $tradePortalSeatAndBags -lang $lang -field "SeriesSeatFlights" -value $translations[$lang]["SeriesSeatFlights"]
        
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "SeriesSeatFlightsTitle" -value $translations[$lang]["SeriesSeatFlightsTitle"]
        create-lang-version -item $tradePortalSeatAndBags -lang $lang -field "SeriesSeatFlightsTitle" -value $translations[$lang]["SeriesSeatFlightsTitle"]
        
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "SeriesSeatFlightsPageTitle" -value $translations[$lang]["SeriesSeatFlightsPageTitle"]
        create-lang-version -item $tradePortalSeatAndBags -lang $lang -field "SeriesSeatFlightsPageTitle" -value $translations[$lang]["SeriesSeatFlightsPageTitle"]
    }
    
    $holidaysHoldLuggagePath = "/sitecore/content/EasyJet/Holidays/Data/Ancillaries/Hold Luggage"
    $tradePortalHoldLuggagePath = "/sitecore/content/EasyJet/TradePortal/Data/Ancillaries/Hold Luggage"
    
    $holidaysHoldLuggage = Get-Item -Path $holidaysHoldLuggagePath
    $tradePortalHoldLuggage = Get-Item -Path $tradePortalHoldLuggagePath
        
    $translations = @{
        "en" = @{
            "NoAddHeading" = "Your hold luggage allowance"
        }
        "fr-CH" = @{
            "NoAddHeading" = "Votre franchise de bagages enregistrés"
        }
        "fr-FR" = @{
            "NoAddHeading" = "Votre franchise de bagages enregistrés"
        }
        "de-CH" = @{
            "NoAddHeading" = "Ihr Freigepäck für aufgegebenes Gepäck"
        }
        "de-DE" = @{
            "NoAddHeading" = "Ihr Freigepäck für aufgegebenes Gepäck"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysHoldLuggage -lang $lang -field "NoAddHeading" -value $translations[$lang]["NoAddHeading"]
        create-lang-version -item $tradePortalHoldLuggage -lang $lang -field "NoAddHeading" -value $translations[$lang]["NoAddHeading"]
    }
    
