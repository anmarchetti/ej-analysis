SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $changeFlightsItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Flight/Page Components/Change Flights" -ErrorAction SilentlyContinue;
    
    if ($changeFlightsItem -ne $null) {
        $changeFlightsItem.Editing.BeginEdit()
        
    	$changeFlightsItem['UpgradePromoText'] = '<span>Promo code will be upgraded if you select this flight. <a href="https://www.easyjet.com/en/holidays/help?helpCategory=changes" target="_blank">What does this mean?</a></span>'
    	$changeFlightsItem['DowngradePromoText'] = '<span>Promo code will be downgraded if you select this flight. <a href="https://www.easyjet.com/en/holidays/help?helpCategory=changes" target="_blank">What does this mean?</a></span>'
    	$changeFlightsItem['NotValidPromoText'] = '<span>Promo code will no longer be applicable if you select this flight. <a href=" https://www.easyjet.com/en/holidays/help?helpCategory=changes" target="_blank">What does this mean?</a></span>'
    	
    	$changeFlightsItem.Editing.EndEdit() | Out-Null
    	Write-Host $changeFlightsItem.Name "Updated";
    }
