Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/PC-236 add new sorter wrapper"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    ### Add sorter wrapper to the booking page
    # 1) Resolve the item
    $ItemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking"
    $item = Get-Item -Path "master:$ItemPath"
    
    if (-not $item) {
    throw "No item found. Either run in context or specify –ItemPath."
    }
    
    $RenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Personalization/Sorter Wrapper"
    $renderingDef = Get-Item -Path "master:$RenderingPath"
    if (-not $renderingDef) {
        throw "Rendering definition not found at path: $RenderingPath"
    }
    
    $rid = $renderingDef.ID
    # Create Rendering Instance and add it to item
    $componentWrapperItem = Get-Item -Path "master:" -ID $rid | New-Rendering
    Add-Rendering -Item $item -Instance $componentWrapperItem -Placeholder "/body/component-wrapper-inner-{87238C24-9199-4538-97A4-55DB1CE624CF}-0" -Index 6 -FinalLayout
    $wrapperRendering = Get-Rendering -Item $item -Index 6 -FinalLayout
    Write-Host "✅ Added rendering '$($renderingDef.Name)' (ID: $rid) into '$Placeholder' on $($item.Paths.FullPath)."
    
    ### Move renderings to sorter wrapper
    
    # 2) Define old/new placeholder prefixes
    $oldPrefix = "/body/component-wrapper-inner-{87238C24-9199-4538-97A4-55DB1CE624CF}-0"
    $newPrefix = $oldPrefix + "/sorter-wrapper-inner-$($wrapperRendering.UniqueId)-0"
    
    # 4) Enumerate renderings on this item
    $renderings = Get-Rendering -Item $item -FinalLayout
    
    # 5) Loop and replace placeholder prefixes
    foreach ($r in $renderings) {
    if ($r.Placeholder -like "$oldPrefix*") {
            if($r.UniqueId -eq $wrapperRendering.UniqueId){
                continue
            }
            $newPlaceholder = $r.Placeholder -replace [regex]::Escape($oldPrefix), $newPrefix
    
            # 6) Apply the change back to the item
            Set-Rendering -Item $item -Instance $r -PlaceHolder $newPlaceholder -FinalLayout
    
            Write-Host "Updated rendering [$($r.RenderingID)] placeholder → $newPlaceholder"
        }
    }
    
