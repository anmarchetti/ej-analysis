- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-item-with-lang ($data,$item) {
    	function create-lang-version ($item,$lang,$field,$value) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
    		if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    			Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    		}
    
    		if ($null -ne $field) {
    			$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    			$targetLangItem.Editing.BeginEdit()
    			$targetLangItem[$field] = $value;
    			$targetLangItem.Editing.EndEdit() | Out-Null
    		}
    	};
    
    	if ($item -ne $null) {
    		$data | ForEach-Object {
    			$fieldName = $_.fieldName;
    			$values = $_.Values;
    
    			$stdoutMessage = $fieldName + " Updated";
    
    			if ($values -ne $null) {
    				if ($values.en -ne $null) {
    					$item.Editing.BeginEdit();
    					$item[$fieldName] = $values.en;
    					$item.Editing.EndEdit() | Out-Null
    				}
    				if ($values.fr -ne $null) {
    					@( 'fr-CH','fr-FR') | % {
    						Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
    					}
    				}
    				if ($values.de -ne $null) {
    					@( 'de-CH','de-DE') | % {
    						Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
    					}
    				}
    
    				Write-Host $fieldName "Updated"
    			}
    		}
    	}
    };
    ##
    
    $cashAndCreditRefundItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Refund Infos/Credit And Cash Refund" -ErrorAction SilentlyContinue;
    $onlyCreditRefundItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Refund Infos/Only Credit Refund" -ErrorAction SilentlyContinue;
    
    $data = @(
    	@{
    		fieldName = 'CancellationUnavailableDescription';
    		Values = @{
    			en = "<p>If you wish to cancel your holiday, please check back here {hours} hours after you made your booking.</p>";
    			fr = "<p>Si vous souhaitez annuler votre séjour, veuillez vérifier ici {hours} heures après avoir effectué votre réservation.</p>";
    			de = "<p>Wenn Sie Ihren Urlaub stornieren möchten, melden Sie sich bitte {hours} Stunden nach Ihrer Buchung hier zurück.</p>";
    		}
    	}
    );
    
    update-item-with-lang -Item $cashAndCreditRefundItem -Data $data;
    update-item-with-lang -Item $onlyCreditRefundItem -Data $data;
    
