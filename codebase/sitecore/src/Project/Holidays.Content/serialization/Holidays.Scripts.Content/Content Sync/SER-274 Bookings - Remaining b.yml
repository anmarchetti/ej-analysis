    function Update-Rendering($itemPath) {
        $pageItem = Get-Item -Path $itemPath
                
        Get-Rendering -Item $pageItem  | 
        Where-Object -FilterScript {$_.ItemID -eq '{8DAB7C3D-3DFC-4974-B3B7-082964A3738F}'} | 
        Set-Rendering -Item $pageItem -DataSource $contentData.ID
    }
            
    Update-Rendering -ItemPath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking'
    
    #remove banner from unnecessary pages
    function Remove-Banner($pagePath){
        $page = Get-Item -Path $pagePath
        $allRenderings = Get-Rendering -Item $page
        
        foreach($rendering in $allRenderings){
             if($rendering.ItemId -eq '{8DAB7C3D-3DFC-4974-B3B7-082964A3738F}'){
                 Remove-Rendering -Item $page -Instance $rendering
                 Write-Host "ItemId: " $rendering.ItemId "successfully removed";
             }
         }
    }
            
    Remove-Banner -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel'
