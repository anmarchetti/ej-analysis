  Value: |
    $settingsFolderPath = "/sitecore/content/EasyJet/Holidays/Settings"
    
    $maintenanceModeTemplateId = "{3B1C3399-8610-40EE-A397-F2A639EFF262}"
    $maintenanceModeItemName = "Maintenance Mode"
    
    function Create-Item($path,$name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
        return $item;
    }
    
    Create-Item -Path $settingsFolderPath -Name $maintenanceModeItemName -TemplateId $maintenanceModeTemplateId
