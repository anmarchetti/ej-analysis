SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $aircraftTypes = @(
        @{
            'Key'   = "319"
            'Name' = "Airbus A319"
        },
        @{
            'Key'   = "320B"
            'Name' = "Airbus A320 (Spaceflex) + Airbus A320N"
        },
        @{
            'Key'   = "321N"
            'Name' = "Airbus A321NX"
        },
        @{
            'Key'   = "M180"
            'Name' = "Airbus A320 (Original easyJet Style)"
        }
    )
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $aircraftTypesFolder = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Aircraft Types" -template "{B882DC82-78AE-4EAC-814E-6E45BD0DA5CE}"
    
    foreach($aircraftType in $aircraftTypes){
        $name = "$($aircraftType.Key)"
        Write-Host $name
        $validName = [Sitecore.Data.Items.ItemUtil]::ProposeValidItemName($name)
        $path = "$($aircraftTypesFolder.Paths.FullPath)/$($validName)"
        $item = Get-Or-Create-Item -path $path -template "{73DB73A4-8614-4586-8A20-9F79BB7B039F}"
        $item.Editing.BeginEdit()
    	$item["Code"] = $aircraftType.Key
    	$item["Name"] = $aircraftType.Name
    	$item.Editing.EndEdit()
    }
    
