- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath, $index) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath -Index $index;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    # Creating Loss message item
    $lossMessageItem = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Loss Seats Message" -template "{4E3890D9-808D-4390-BE32-749397BE8A74}";
    
    if ($lossMessageItem -ne $null) {
        $lossMessageItem.Editing.BeginEdit();
    	
    	$lossMessageItem["Title"]="Please read carefully";
    	$lossMessageItem["Description"]="When you change your dates, any previously purchased seat selection is not transferred to the new flights. New seats can be purchased back on the View booking page. New seat selection is subject to availability and cannot be guaranteed.";
    	$lossMessageItem["Icon"]='<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" />';
    	
    	Write-Host $lossMessageItem.Name "Updated";
        $lossMessageItem.Editing.EndEdit() | Out-Null;
    }
    
    # Updating page item rendering list
    $amendSummaryPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    
    if ($amendSummaryPageItem -ne $null) {
        $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Attention Message";
        $renderingPlaceholder = "/body/attention-message-{CEBD339C-592C-46E2-9961-AFE0BD9F74D9}-0";
        $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Loss Seats Message";
        
        Add-Or-Update-Page-Rendering -page $amendSummaryPageItem -renderingPath $renderingPath -renderingPlaceholder $renderingPlaceholder -dataSourcePath $dataSourcePath -index 1;
        
        Write-Host $amendSummaryPageItem.Name "Updated";
    }
    
    
