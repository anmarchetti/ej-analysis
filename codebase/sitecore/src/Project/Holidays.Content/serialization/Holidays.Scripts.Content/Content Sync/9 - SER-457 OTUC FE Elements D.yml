    $translations2 = @{
                    "en" = @{
                        'PopupUniqueId' = 'Refund'
                        "IsLinkVisible"= '1'
                        "LinkText"= 'Why am I being refunded this way?'
                        "TitlePopup"= 'Why am I being refunded this way?'
                        "TextPopup"= "<p>If you&rsquo;re 28 days or more from your departure date and want to cancel, unlike with most other holiday companies, you&rsquo;ll be pleased to know you won&rsquo;t lose your deposit (which would usually be non-refundable). As part of our <a href='~/link.aspx?_id=4A8303A3E9BA40CEBEA344C66F6DDA65&amp;_z=z'' target='_blank'>ultimate flexibility</a>, your deposit will be returned to you as credit to your online easyJet holidays account. If you've paid more than the deposit amount of {depositPricePP}, the difference will be refunded to your original payment method for this booking.</p><p>If you&rsquo;re within 28 days, the closer to your planned departure date you cancel your holiday will determine the cancellation charges that will apply, as per our <a href='~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z' target='_blank'>booking conditions</a>:</p><ul><li>27-21 days from departure &ndash; either 50% of your booking value returned to you as easyJet holidays credit, or 25% as a refund to your original method of payment for your booking.</li><li>20-14 days from departure &ndash; 25% of your booking value returned to you as easyJet holidays credit.</li><li>13-0 days from departure &ndash; full cancellation charges apply.</li></ul>"
                    }
