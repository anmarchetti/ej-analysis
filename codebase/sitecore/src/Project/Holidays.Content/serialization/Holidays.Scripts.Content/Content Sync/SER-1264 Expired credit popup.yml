      Hint: Script
      Value: |
          Import-Function "Import Content"
          
          
          $bannerFolderPath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Expired Credit Banner"
          $bannerFolder = Get-Item -Path $bannerFolderPath -ErrorAction SilentlyContinue
          if ($bannerFolder -eq $null) {
              $bannerFolder = New-Item -Path "/sitecore/content/EasyJet/Holidays/Data/View Booking Data" -Name "Expired Credit Banner" -ItemType "/sitecore/templates/Feature/Destinations/Expired Credit Banner Folder"
          }
          
          
          $updates1 = @(
              @{
          		Path = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos"
          		TemplatePath = "/sitecore/templates/Feature/Destinations/Refund Info Folder"
          		Fields = @{
          			"ExpiryPopupCancelCTA" = @{
          				"en" = "Back to view booking"
          				"fr-CH" = "Revenir à la réservation"
          				"de-CH" = "Zurück zur Buchungsansicht"
          				"fr-FR" = "Revenir à la réservation"
