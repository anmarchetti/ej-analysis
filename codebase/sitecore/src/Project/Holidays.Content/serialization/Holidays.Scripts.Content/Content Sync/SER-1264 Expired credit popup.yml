          		    	"Title" = @{
          				"en" = "You’ll lose expired credit"
          				"fr-CH" = "Vous perdrez votre avoir ayant expiré"
          				"de-CH" = "Abgelaufenes Guthaben verfällt"
          				"fr-FR" = "Vous perdrez votre avoir ayant expiré"
          				"de-DE" = "Abgelaufenes Guthaben verfällt"
          			}
          			"Subheading" = @{
          			    "en" = "Are you sure you want to cancel your booking?"
          				"fr-CH" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-CH" = "Willst du deine Buchung wirklich stornieren?"
          				"fr-FR" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-DE" = "Willst du deine Buchung wirklich stornieren?"
          			}
          			"Text" = @{
          			   	"en" = "You’ll only have 30 days or less to use some of the credit on this booking once re-issued"
          				"fr-CH" = "Vous ne disposerez que d’un mois, voire moins, pour utiliser l’avoir disponible pour cette réservation si vous annulez, puisqu’il expire dans 30 jours ou moins. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-CH" = "Wenn du jetzt stornierst, hast du maximal einen Monat Zeit, dein erstattetes Guthaben einzulösen, da es in spätestens 30 Tagen verfällt. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          				"fr-FR" = "Vous ne disposerez que d’un mois, voire moins, pour utiliser l’avoir disponible pour cette réservation si vous annulez, puisqu’il expire dans 30 jours ou moins. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-DE" = "Wenn du jetzt stornierst, hast du maximal einen Monat Zeit, dein erstattetes Guthaben einzulösen, da es in spätestens 30 Tagen verfällt. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          			}
          			"CreditExpiryState" = @{
          			    "en" = "ExpiringOnly"
          				"fr-CH" = "ExpiringOnly"
          				"de-CH" = "ExpiringOnly"
          				"fr-FR" = "ExpiringOnly"
          				"de-DE" = "ExpiringOnly"
          			}
          		}
          	}
          
          	@{
          		Path = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Expired Credit Banner/Expired Or Expiring"
          		TemplatePath = "/sitecore/templates/Feature/Destinations/Expired Credit Banner"
          		Fields = @{
          			"Title" = @{
          				"en" = "You’ll lose your expired credit and you’ll have 30 days or less to use some of the re-issued credit"
          				"fr-CH" = "Vous perdrez votre avoir qui a expiré et vous disposerez de 30 jours ou moins pour utiliser une partie de l'avoir remboursé"
          				"de-CH" = "Abgelaufenes Guthaben verfällt und du hast höchstens 30 Tage Zeit, um einen Teil des zurückerstatteten Guthabens zu nutzen"
          				"fr-FR" = "Vous perdrez votre avoir qui a expiré et vous disposerez de 30 jours ou moins pour utiliser une partie de l'avoir remboursé"
          				"de-DE" = "Abgelaufenes Guthaben verfällt und du hast höchstens 30 Tage Zeit, um einen Teil des zurückerstatteten Guthabens zu nutzen"
          			}
          			"Subheading" = @{
          			    "en" = "Are you sure you want to cancel your booking?"
          				"fr-CH" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-CH" = "Willst du deine Buchung wirklich stornieren?"
          				"fr-FR" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-DE" = "Willst du deine Buchung wirklich stornieren?"
          			}
          			"Text" = @{
          			    "en" = "Your credit has either expired and won’t be re-issued. Or you’ll have a month or less to use the available credit on this booking if you cancel, as it expires in 30 days or less. Once cancelled, your booking can't be reinstated."
          				"fr-CH" = "Soit votre avoir a expiré et ne sera pas remboursé, soit vous disposerez d'un mois ou moins pour utiliser l'avoir disponible sur cette réservation si vous l'annulez, car il expire dans 30 jours ou moins. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-CH" = "Dein Guthaben ist entweder abgelaufen und wird nicht erneuert  oder du hast nach der Stornierung höchstens einen Monat Zeit, zurückerstattetes Guthaben einzulösen, da es in ca. 30 Tagen verfällt. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          				"fr-FR" = "Soit votre avoir a expiré et ne sera pas remboursé, soit vous disposerez d'un mois ou moins pour utiliser l'avoir disponible sur cette réservation si vous l'annulez, car il expire dans 30 jours ou moins. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-DE" = "Dein Guthaben ist entweder abgelaufen und wird nicht erneuert  oder du hast nach der Stornierung höchstens einen Monat Zeit, zurückerstattetes Guthaben einzulösen, da es in ca. 30 Tagen verfällt. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          			}
          			"CreditExpiryState" = @{
          			    "en" = "Both"
          				"fr-CH" = "Both"
          				"de-CH" = "Both"
          				"fr-FR" = "Both"
          				"de-DE" = "Both"
          			}
          		}
          	}
          
          )
          
          ImportContent -itemsToCreate $updates1
          
          
          $bannerItems = Get-ChildItem -Path $bannerFolderPath
          $bannerItemIds = ($bannerItems | ForEach-Object { $_.ID }) -join "|"
          
          $refundInfoPaths = @(
              "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos",
              "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos F and H"
          )
          
          foreach ($path in $refundInfoPaths) {
              $item = Get-Item -Path $path
              $item.Editing.BeginEdit()
              $item["ExpiryPopupItems"] = $bannerItemIds
              $item.Editing.EndEdit()
          }

