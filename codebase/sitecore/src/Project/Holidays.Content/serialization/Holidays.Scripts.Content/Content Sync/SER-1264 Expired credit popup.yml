          				"fr-FR" = "Continuer vers l’annulation"
          				"de-DE" = "Weiter zur Stornierung"
          			}
          		}
              }
          
              @{
          		Path = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos F and H"
          		TemplatePath = "/sitecore/templates/Feature/Destinations/Refund Info Folder"
          		Fields = @{
          			"ExpiryPopupCancelCTA" = @{
          				"en" = "Back to view booking"
          				"fr-CH" = "Revenir à la réservation"
          				"de-CH" = "Zurück zur Buchungsansicht"
          				"fr-FR" = "Revenir à la réservation"
          				"de-DE" = "Zurück zur Buchungsansicht"
          			}
          			"ExpiryPopupCTA" = @{
          				"en" = "Continue to cancel"
          				"fr-CH" = "Continuer vers l’annulation"
          				"de-CH" = "Weiter zur Stornierung"
          				"fr-FR" = "Continuer vers l’annulation"
          				"de-DE" = "Weiter zur Stornierung"
          			}
          		}
              }
          
          @{
          		Path = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Expired Credit Banner/Expired"
          		TemplatePath = "/sitecore/templates/Feature/Destinations/Expired Credit Banner"
          		Fields = @{
          			"Title" = @{
          				"en" = "You’ll lose expired credit"
          				"fr-CH" = "Vous perdrez votre avoir ayant expiré"
          				"de-CH" = "Abgelaufenes Guthaben verfällt"
          				"fr-FR" = "Vous perdrez votre avoir ayant expiré"
          				"de-DE" = "Abgelaufenes Guthaben verfällt"
          			}
          			"Subheading" = @{
          			    "en" = "Are you sure you want to cancel your booking?"
          				"fr-CH" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-CH" = "Willst du deine Buchung wirklich stornieren?"
          				"fr-FR" = "Souhaitez-vous vraiment annuler votre réservation?"
          				"de-DE" = "Willst du deine Buchung wirklich stornieren?"
          			}
          			"Text" = @{
          			    "en" = "As some, or all, of your credit has expired this won’t be refunded. Once cancelled, your booking can't be reinstated."
          				"fr-CH" = "Comme une partie ou la totalité de votre avoir a expiré, celui-ci ne sera pas remboursé. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-CH" = "Da ein Teil oder das gesamte Guthaben abgelaufen ist, wird es nicht zurückerstattet. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          				"fr-FR" = "Comme une partie ou la totalité de votre avoir a expiré, celui-ci ne sera pas remboursé. Une fois annulée, votre réservation ne peut pas être restaurée."
          				"de-DE" = "Da ein Teil oder das gesamte Guthaben abgelaufen ist, wird es nicht zurückerstattet. Nach der Stornierung kann die Buchung nicht wiederhergestellt werden."
          			}
          			"CreditExpiryState" = @{
          			    "en" = "ExpiredOnly"
          				"fr-CH" = "ExpiredOnly"
          				"de-CH" = "ExpiredOnly"
          				"fr-FR" = "ExpiredOnly"
          				"de-DE" = "ExpiredOnly"
          			}
          		}
          	}
          
          
          @{
          		Path = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Expired Credit Banner/Expiring"
