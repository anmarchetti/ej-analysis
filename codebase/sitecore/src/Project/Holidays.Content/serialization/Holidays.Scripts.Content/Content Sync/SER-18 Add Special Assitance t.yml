  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function createDataSource()
    {
    	$templateId = "{58059922-30EC-48BF-AB50-7D02E036B09E}"
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Special Assistance"
    	
    	$item = Get-Item -Path $itemPath  -ErrorAction SilentlyContinue
    	
    	if ($item -eq $null){
    	   Write-Host "Creating Special Assistance DataSource"
    	   
    	   New-Item -Path $itemPath -ItemType $templateId
    	   
    	} else{
    		Write-Host "Special Assistance is already created"
    	}
    }
    
    function createDataSourceLanguageVersions() {
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Special Assistance"
    	$item  = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    	if ($item -eq $null) {
    		Write-Host "Missing Special Assistance datasource in EN language."
    		return;
    	}
    	
    	@('en') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoCTA" -Value "Get in contact"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoTitle" -Value "Request special assistance"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoDescription" -Value "If you’ve booked a holiday, need special assistance, or you need to make changes to your holiday and have already requested assistance, please contact us."
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoIcon" -Value '<image mediaid="{DB685B7B-2B05-4E62-8EE0-8B8BB7CC8112}" />'
    		
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceDescription" -Value "To make sure your holiday includes everything you need, you can call us on:"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceExtra" -Value "<p>Mon &ndash; Sun 8am - 8pm. Cost of a local call. Calls from mobile or other networks may vary.</p>"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistancePhone" -Value "0330 551 5160"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceTitle" -Value "Request special assistance"
    	}
    
    	@('de-CH', 'de-DE') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoCTA" -Value "Kontakt aufnehmen"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoTitle" -Value "Besondere Unterstützung anfordern"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoDescription" -Value "Wenn du einen Urlaub gebucht hast und besondere Unterstützung benötigst oder Änderungen an deinem Urlaub vornehmen musst und bereits um Unterstützung gebeten hast, nimm bitte Kontakt mit uns auf."
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoIcon" -Value '<image mediaid="{DB685B7B-2B05-4E62-8EE0-8B8BB7CC8112}" />'
    		
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceDescription" -Value "Um sicherzustellen, dass Ihr Urlaub alles enthält, was Sie brauchen, können Sie uns anrufen:"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceExtra" -Value "<p>Mo &ndash; So 8am - 8pm. Kosten für ein Ortsgespräch. Anrufe aus dem Mobilfunknetz oder anderen Netzen können abweichen.</p>"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistancePhone" -Value "0330 551 5160"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceTitle" -Value "Besondere Unterstützung anfordern"
    	}
    
    	@('fr-CH', 'fr-FR') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoCTA" -Value "Nous contacter"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoTitle" -Value "Demander une assistance spéciale"
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoDescription" -Value "Si vous avez réservé un séjour, que vous souhaitez une assistance spéciale ou modifier votre réservation et que vous avez déjà demandé une assistance, veuillez nous contacter."
    		Create-Lang-Version -Item $item -Lang $_ -Field "InfoIcon" -Value '<image mediaid="{DB685B7B-2B05-4E62-8EE0-8B8BB7CC8112}" />'
    		
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceDescription" -Value "Pour vous assurer que vos vacances comprennent tout ce dont vous avez besoin, vous pouvez nous appeler au numéro suivant :"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceExtra" -Value "<p>Lun &ndash ; Dim 8h - 20h. Coût d'un appel local. Les appels à partir d'un téléphone portable ou d'un autre réseau peuvent varier.</p>"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistancePhone" -Value "0330 551 5160"
    		Create-Lang-Version -Item $item -Lang $_ -Field "AddAssistanceTitle" -Value "Demander une assistance spéciale"
    	}
    	
    	Write-Host "Created language versions for Special Assistance datasource"
    }
    
    function createRenderingInPreTravelPage() {
    	$specialAssistanceRenderingId = "{0A32EA7D-D537-4845-A5B2-8D2FF7513D91}"
        $pagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel';
    	$datasourcePath = '/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Special Assistance'
        $placeholder = "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
    	
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$specialAssistanceRendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $specialAssistanceRenderingId }
    	
    	if ($specialAssistanceRendering -ne $null) {
    	    Write-Host "Special Assistance Rendering already exists"
    		return
    	}
    	
    	# Add Masonry Wrapper Item
    	$masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}"
    	$masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    	$masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    	
    	Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder -Parameter @{ "ItemOrderOnMobile" = "35" } -Index 16
    	
    	# Get newly added rendering
    	$page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
    	$lastRendering = $renderings[-2]
    	
    	$specialAssistanceRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/Special Assistance"
    	$specialAssistanceRendering = Get-Item -Database "master" -Path $specialAssistanceRenderingPath |  New-Rendering -Placeholder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0"
    	
    	Add-Rendering -Item $page -Instance $specialAssistanceRendering -PlaceHolder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0" -DataSource $datasourcePath -Index 17
    	
    	Write-Host "Added Special Assistance Rendering to Pre Travel Page"
    }
    
    function createRenderingInInDestinationPage() {
    	$specialAssistanceRenderingId = "{0A32EA7D-D537-4845-A5B2-8D2FF7513D91}"
        $pagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/in-destination';
    	$datasourcePath = '/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Special Assistance'
        $placeholder = "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
    	
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$specialAssistanceRendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $specialAssistanceRenderingId }
    	
    	if ($specialAssistanceRendering -ne $null) {
    	    Write-Host "Special Assistance Rendering already exists"
    		return
    	}
    	
    	# Add Masonry Wrapper Item
    	$masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}"
    	$masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    	$masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    	
    	Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder -Parameter @{ "ItemOrderOnMobile" = "35" } -Index 16
    	
    	# Get newly added rendering
    	$page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
    	$lastRendering = $renderings[-2]
    	
    	$specialAssistanceRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/Special Assistance"
    	$specialAssistanceRendering = Get-Item -Database "master" -Path $specialAssistanceRenderingPath |  New-Rendering -Placeholder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0"
    	
    	Add-Rendering -Item $page -Instance $specialAssistanceRendering -PlaceHolder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0" -DataSource $datasourcePath -Index 17
    	
    	Write-Host "Added Special Assistance Rendering to In Destination Page"
    }
    
    createDataSource
    createDataSourceLanguageVersions
    createRenderingInPreTravelPage
    createRenderingInInDestinationPage
