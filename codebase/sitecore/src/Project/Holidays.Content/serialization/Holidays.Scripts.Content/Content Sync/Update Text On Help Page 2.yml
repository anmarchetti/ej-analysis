  Value: |
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    # Add top Text Block
    $textBlocks = Get-Or-Create-Item -path "master:/content/EasyJet/Holidays/Home/Help/Page Components/Text Blocks" -templateId "{AB8D608B-3B9D-4ECB-9BA3-8C61306D7A41}"
    $topBlock = Get-Or-Create-Item -path "master:/content/EasyJet/Holidays/Home/Help/Page Components/Text Blocks/Top Block" -templateId "{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}" 
    
    if ($topBlock -ne $null) {
        $topBlock.Editing.BeginEdit()
        $topBlock["Description"] = '<style>.text-block__description p{margin: 0px;}@media(max-width: 768px){.text-block__description{text-align: center;}}</style><div class="text-block__description"><p>With easyJet you can create your ideal holiday including handpicked hotels for everything from city breaks to ski and beach holidays.</p>
    <p>For help with specific questions click on the orange heading links below.</p>
    </div>'
        $topBlock.Editing.EndEdit() | Out-Null
    }
      
