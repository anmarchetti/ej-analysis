    function get-or-create-item ($name,$path,$templateId) {
    	$item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue;
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $name -ItemType $templateId;
    		return $item;
    	}
    
    	return $item;
    }
    
    function get-facility-type-item-id ($path){
        $item = Get-Item -Path "master:/sitecore/content$($path)" -ErrorAction SilentlyContinue;
        return $item.ID
    }
    
    function set-matrix-values ($path, $name, $facilities, $value, $mustHave){
        $item = get-or-create-item -path $path -name $name -templateId $matrixFiterValueTemplateId
        $item.Editing.BeginEdit()
        $item["MustHave"] = $mustHave
        $item["Value"] = $value
        $item["Facilities"] = $facilities
        $item.Editing.EndEdit()
    }
    
    function create-matrix-facility-filter($path, $name, $templateId){
        $item = get-or-create-item -path $path -name $name -templateId $matrixFacilityFilterTemplateId
        $item.Editing.BeginEdit()
        $item["Name"] = $name
        $item.Editing.EndEdit()
        
        return $item
    }
    
    $outdoorPoolId = get-facility-type-item-id -path "/EasyJet/Holidays/Data/Facility Types/Entertainment/Outdoor freshwater pool"
