    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/Contact us - Section Title"
                TemplatePath = "/sitecore/templates/Feature/PageContent/Text Block"
                Fields      = @{
                    "Title" = @{
                        "en" = "STILL STUCK?"
                        "fr-CH" = "ENCORE COINCÉ ?"
                        "de-CH" = "IMMER NOCH STECKEN GEBLIEBEN?"
                        "fr-FR" = "TOUJOURS BLOQUÉ ?"
                        "de-DE" = "IMMER NOCH FESTGEFAHREN?"
                    }
                    "Description" = @{
                        "en" = @'
    <p style="font-size: 14px;">We understand waiting can feel stressful, but thanks for giving us some time. Our team is currently working on alternative arrangements and will reach out as soon as we have more information using the contact details provided when you booked your holiday. </p>
    <p style="font-size: 14px;">In the meantime, feel free to visit our <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Help Centre</span></strong></a>&nbsp;for assistance, or our <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Contact Us</span></strong></a>&nbsp;page if you still need extra help.</p>
    '@
                        "fr-CH" = @'
    <p style="font-size: 14px;">Nous comprenons que l'attente peut être stressante, mais nous vous remercions de nous accorder un peu de temps. Notre équipe travaille actuellement à la mise en place de solutions alternatives et vous contactera dès que nous aurons plus d'informations, en utilisant les coordonnées fournies lors de la réservation de vos vacances. </p>
    <p style="font-size: 14px;">En attendant, n'hésitez pas à consulter notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp; pour obtenir de l'aide, ou notre page <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Contactez-nous</span></strong></a>&nbsp;si vous avez encore besoin d'aide.</p>
    '@
                        "de-CH" = @'
    <p style="font-size: 14px;">Wir verstehen, dass das Warten stressig sein kann, aber danke, dass du uns etwas Zeit gibst. Unser Team arbeitet gerade an alternativen Lösungen und wird sich mit dir in Verbindung setzen, sobald wir mehr Infos haben. Wir nutzen dafür die Kontaktdaten, die du bei der Buchung deines Urlaubs angegeben hast. </p>
    <p style="font-size: 14px;">In der Zwischenzeit können Sie gerne unser <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Hilfe-Center</span></strong></a>&nbsp; oder unsere Seite <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Kontakt</span></strong></a>, wenn Sie weitere Hilfe benötigen. </p>
    '@
                        "fr-FR" = @'
    <p style="font-size: 14px;">Nous comprenons que l'attente peut être stressante, mais nous vous remercions de nous accorder un peu de temps. Notre équipe travaille actuellement à la mise en place de solutions alternatives et vous contactera dès que nous aurons plus d'informations, en utilisant les coordonnées fournies lors de la réservation de vos vacances. </p>
    <p style="font-size: 14px;">En attendant, n'hésitez pas à consulter notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp; pour obtenir de l'aide, ou notre page <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Contactez-nous</span></strong></a>&nbsp;si vous avez encore besoin d'aide.</p>
    '@
                        "de-DE" = @'
    <p style="font-size: 14px;">Wir verstehen, dass das Warten stressig sein kann, aber danke, dass du uns etwas Zeit gibst. Unser Team arbeitet gerade an alternativen Lösungen und wird sich mit dir in Verbindung setzen, sobald wir mehr Infos haben. Wir nutzen dafür die Kontaktdaten, die du bei der Buchung deines Urlaubs angegeben hast. </p>
    <p style="font-size: 14px;">In der Zwischenzeit können Sie gerne unser <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Hilfe-Center</span></strong></a>&nbsp; oder unsere Seite <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Kontakt</span></strong></a>, wenn Sie weitere Hilfe benötigen. </p>
    '@
