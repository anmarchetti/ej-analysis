SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource) {
    	$rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    
    # 1. Create Amend Transfer page
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Transfer"
    $pageTemplateId = "{D8427EBB-A1C9-42C1-B155-BAD302620B9E}"
    $page = Get-Or-Create-Item -Path $pagePath -templateId $pageTemplateId
    
    if ($page -ne $null) {
    	$page.Editing.BeginEdit()
    	$page["Name"] = "Change your transfer"
    	$page["Subtitle"] = "Fancy a change?"
    	$page["Image"] = "<image mediaid='{39D6C941-74F1-4B30-810D-75BBD4C29D4C}' />"
    	$page.Editing.EndEdit() | Out-Null
    }
    
    # 2. Add Page To PageDesigns
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host "Page Templates of" $designItem.Name "are updated"
    		}
    	}
    }
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Slim Design" -pageTemplateId $pageTemplateId
    
    #3. Create PageComponents folder
    $pageComponentsPath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Transfer/Page Components"
    $pageComponentsTemplateId = "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    $pageComponents = Get-Or-Create-Item -Path $pageComponentsPath -templateId $pageComponentsTemplateId
    
    
    #4. Amend Transfers Component
    $amendTransfersContent = Get-Or-Create-Item -Path "master:/content/EasyJet/Holidays/Home/Booking/Change Transfer/Page Components/Amend transfers" -templateId "{283FB8E6-8DA2-469B-8878-B63EF1BBF9E9}"
    
    if ($amendTransfersContent -ne $null) {
    	$amendTransfersContent.Editing.BeginEdit()
    	$amendTransfersContent["IsPromotionalBannerEnabled"] = "1"
    	$amendTransfersContent["PromotionalBannerText"] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
    	$amendTransfersContent.Editing.EndEdit() | Out-Null
    }
    
    Update-Rendering-DataSource -Item $page -PlaceHolder "body" -RenderingId "{464B3987-9AF6-4EF8-B61C-372519F68C81}" -NewDataSource $amendTransfersContent.ID 
    
    
    
