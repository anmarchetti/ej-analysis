  Hint: Script
  Value: |
    function Set-Translation-Value($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            $item = Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
            Write-Host "Created" $language "version for" $item.Name "item"
        } else {
            Write-Host $language "version for Item" $item.Name "already exist"
        }
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
            Write-Host "Field" $key "for" $item.Name "item updated with value" $translation
        }
    }
    
    function Update-PriceBreakdown-Content() {
        $path = '/sitecore/content/EasyJet/Holidays/Home/Booking/Cancel Booking/Page Components/Cancel Booking'
        ### en
        Set-Translation-Value -ItemPath $path -Language 'en' -Key 'PriceBreakdownTitle' -Translation "Refund Breakdown"
        Set-Translation-Value -ItemPath $path -Language 'en' -Key 'PriceBreakdownTitleStepOne' -Translation "Price Breakdown"
        
        ### fr-FR
        Set-Translation-Value -ItemPath $path -Language 'fr-FR' -Key 'PriceBreakdownTitle' -Translation "Détails du remboursement"
        Set-Translation-Value -ItemPath $path -Language 'fr-FR' -Key 'PriceBreakdownTitleStepOne' -Translation "Détail du prix"
    
        ### de-DE
        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'PriceBreakdownTitle' -Translation "Erstattungsübersicht"
        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'PriceBreakdownTitleStepOne' -Translation "Preisaufstellung"
    
        ### fr-CH
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'PriceBreakdownTitle' -Translation "Détails du remboursement"
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'PriceBreakdownTitleStepOne' -Translation "Détail du prix"
    
        ### de-CH
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'PriceBreakdownTitle' -Translation "Erstattungsübersicht"
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'PriceBreakdownTitleStepOne' -Translation "Preisaufstellung"
    }
    
    
    Update-PriceBreakdown-Content;
    
