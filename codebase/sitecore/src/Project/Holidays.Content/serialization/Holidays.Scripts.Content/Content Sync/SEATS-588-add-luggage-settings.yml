- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-luggage-settings($itemPath) {
    	$luggageSettings = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    	$templateId = "{A817DC9E-5CF5-462D-A902-D2B16756AC4A}"
    	
    	if ($luggageSettings -eq $null){
    	   Write-Host "Creating Luggage settings"
    	   $luggageSettings = New-Item -Path $itemPath -ItemType $templateId
    	   $luggageSettings.Editing.BeginEdit()
    	   $luggageSettings.Fields["IsHoldLuggageEnabled"].Value = "1"
    	   $luggageSettings.Fields["IsSportsEquipmentEnabled"].Value = "1"
    	   $luggageSettings.Editing.EndEdit() | Out-Null
    	} else{
    		Write-Host "Luggage settings already created"
    	}
    }
    
    function create-lang-version($item, $lang) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    }
    
    create-luggage-settings -ItemPath "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings"
    create-luggage-settings -ItemPath "/sitecore/content/EasyJet/TradePortal/Settings/Luggage Settings"
    
     @('fr-CH', 'fr-FR', 'de-DE', 'de-CH') | % {
    	$luggageSettings = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings" -ErrorAction SilentlyContinue
    	create-lang-version -Item $luggageSettings -Lang $_
    }
    
    Write-Host "Script is completed"
