  Hint: Script
  Value: |
     function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            if ($field -eq "ReadMoreLink") {
                $linkXml = "<link text=`"$value`" linktype='internal' class='' title='' target='' querystring='helpCategory=luggage' id='{01FA2D69-2BB3-4BA9-B98D-15DA2DF1D8AC}' />"
                $targetLangItem[$field] = $linkXml
            } else {
                  $targetLangItem[$field] = $value
            }
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function create-dictionary-item($path, $value, $itemName, $key) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            $templateId = "{6D1CD897-1936-4A3A-A511-289A94C2A7B1}" # Template ID for Dictionary Entry
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId
            $item.Editing.BeginEdit()
            $item["Key"] = $key
            $item["Phrase"] = $value
            $item.Editing.EndEdit() | Out-Null
            Write-Host "Base dictionary item created: $path/$itemName"
        } else {
            $item.Editing.BeginEdit()
            $item["Key"] = $key
            $item["Phrase"] = $value
            $item.Editing.EndEdit() | Out-Null
            Write-Host "Base dictionary item changed: $path/$itemName"
        }
    }
    
    $holidaysBookingViewBookingPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/View Booking"
    $tradePortalBookingViewBookingPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking/Page Components/View Booking"
    
    $holidaysBookingViewBooking = Get-Item -Path $holidaysBookingViewBookingPath
    $tradePortalBookingViewBooking = Get-Item -Path $tradePortalBookingViewBookingPath
    
    $translations = @{
        "en" = @{
            "SportsEquipmentTitle" = "Sports equipment";
            "ReadMoreLink" = "Read more about bags"
        }
        "fr-CH" = @{
            "SportsEquipmentTitle" = "Équipement sportif";
            "ReadMoreLink" = "En savoir plus sur les bagages"
        }
        "fr-FR" = @{
            "SportsEquipmentTitle" = "Équipement sportif";
            "ReadMoreLink" = "En savoir plus sur les bagages"
        }
        "de-CH" = @{
            "SportsEquipmentTitle" = "Sportausrüstung";
            "ReadMoreLink" = "Mehr über Gepäck erfahren"
        }
        "de-DE" = @{
            "SportsEquipmentTitle" = "Sportausrüstung";
            "ReadMoreLink" = "Mehr über Gepäck erfahren"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysBookingViewBooking -lang $lang -field "SportsEquipmentTitle" -value $translations[$lang]["SportsEquipmentTitle"]
        create-lang-version -item $tradePortalBookingViewBooking -lang $lang -field "SportsEquipmentTitle" -value $translations[$lang]["SportsEquipmentTitle"]
        
        create-lang-version -item $holidaysBookingViewBooking -lang $lang -field "ReadMoreLink" -value $translations[$lang]["ReadMoreLink"]
        create-lang-version -item $tradePortalBookingViewBooking -lang $lang -field "ReadMoreLink" -value $translations[$lang]["ReadMoreLink"]
    }
    
    $path = "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels"
    $itemName = "Bags"
    $key = "Luggage.Labels.Bags"
    $value = "Your Bags";
      
    create-dictionary-item -path $path -value $value -itemName $itemName -key $key
    
    $path = "/sitecore/content/EasyJet/TradePortal/Dictionary/Luggage/Labels"
    
    create-dictionary-item -path $path -value $value -itemName $itemName -key $key
