    );
    
    function Set-Holiday-Types ($path,$themeTypeCodePaths) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit();
    		$codes = @();
    		for ($i = 0; $i -lt $themeTypeCodePaths.length; $i++) {
    			$themeTypeCode = Get-Item -Path $themeTypeCodePaths[$i] -ErrorAction SilentlyContinue;
    			$codes += $themeTypeCode.ID
    		}
    		$codesStr = $codes -join "|"
    		if ($codesStr -ne $null) {
    			$item["HolidayThemeTypes"] = $codesStr;
    		}
    		$item.Editing.EndEdit() | Out-Null
    	}
    }
    
    Set-Holiday-Types -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/Family Holidays" -ThemeTypeCodePaths $familyCodes
    Set-Holiday-Types -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/Adults Holidays" -ThemeTypeCodePaths $adultsCodes
    Set-Holiday-Types -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/Beach Holidays" -ThemeTypeCodePaths $beachCodes
    Set-Holiday-Types -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/Lakes Holidays" -ThemeTypeCodePaths $lakesCodes
    Set-Holiday-Types -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/Luxury Holidays" -ThemeTypeCodePaths $luxuryCodes 
