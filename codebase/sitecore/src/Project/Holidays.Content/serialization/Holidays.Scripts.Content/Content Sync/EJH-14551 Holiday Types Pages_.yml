    	"/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Beach/Undiscovered"
    );
    $lakesCodes = @(
    	"/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Lakes/Boutique",
    	"/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Lakes/Luxury",
    	"/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Lakes/Handpicked",
