SharedFields:
    - ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
      Hint: Script
      Value: |
          # Find `Media Center Design` and add ArticlePage TEMPLATE ID to `PageTemplates`
          $articlePageTemplateId = "{A3A83479-5CEC-440E-9B30-A7AD70121343}"
          $mcDesignPath = "master:/content/EasyJet/Holidays/Presentation/Page Designs/Media Center Design"
          $mcDesign = Get-Item -Path $mcDesignPath
          if($mcDesign -ne $null) {
              $mcDesign.Editing.BeginEdit()
              $mcDesign["PageTemplates"] += "|$articlePageTemplateId"
              $mcDesign.Editing.EndEdit() | Out-Null
              Write-Host "Article Page Template added to MC Design PageTemplates"
          }
