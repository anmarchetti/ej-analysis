                fr = "Transfert";
                de = "Übertragung";
            };
        },
         @{
            fieldName = "TransfersFlowIcon";
            values = @{
                en = '<image mediaid="{40485169-2D8F-4B91-83B2-350DF87BBFF9}" />';
            };
        },
        @{
            fieldName = "FlightsFlowTitle";
            values = @{
                en = "Flights";
                fr = "Vols";
                de = "Flüge";
            };
        },
         @{
            fieldName = "FlightsFlowIcon";
            values = @{
                en = '<image mediaid="{CCB14584-E846-40B5-9C7F-DA5E87966B5C}" />';
            };
        },
        @{
            fieldName = "DatesFlowTitle";
            values = @{
                en = "Your Holiday";
                fr = "Vos vacances";
                de = "Ihr Urlaub";
            };
        },
        @{
            fieldName = "DatesFlowIcon";
            values = @{
                en = '<image mediaid="{C305577F-9476-4781-8953-7F739CEB01EC}" />';
            };
        },
        @{
            fieldName = "RoomAndBoardFlowTitle";
            values = @{
                en = "Room & Board";
                fr = "Chambre et pension";
                de = "Unterkunft und Verpflegung";
            };
        },
        @{
            fieldName = "RoomAndBoardFlowIcon";
            values = @{
                en = '<image mediaid="{A1213E57-01B9-4780-8280-8E90C85850FC}" />';
            };
        },
        @{
            fieldName = "TotalLabel";
            values = @{
                en = "Total";
                fr = "Total";
                de = "Insgesamt";
            };
        },
        @{
            fieldName = "CreditDescription";
            values = @{
                en = "<p>Choosing this option means you'll receive {amount} to spend within <strong>12 months</strong> on another easyJet Holiday.</p><p>This will be immediately refunded to your easyJet account.</p>";
                fr = "<p>En choisissant cette option, vous recevrez {amount} à dépenser dans les <strong>12 mois</strong> sur un autre séjour easyJet.</p><p>Ce montant sera immédiatement remboursé sur votre compte easyJet.</p>";
                de = "<p>Wenn Sie diese Option wählen, erhalten Sie {amount}, den Sie innerhalb von <strong>12 Monaten</strong> für einen anderen easyJet-Urlaub ausgeben können.</p><p>Dieser Betrag wird sofort auf Ihr easyJet-Konto zurückerstattet.</p>";
            };
        },
         @{
            fieldName = "RefundDescription";
            values = @{
                en = "Choosing to refund to original payment method means we'll refund you the total amount of {transport} of {amount}";
                fr = "En choisissant de rembourser le mode de paiement initial, nous vous rembourserons le montant total du {transport} de {amount}";
                de = "Wenn Sie sich für die Rückerstattung an die ursprüngliche Zahlungsmethode entscheiden, erstatten wir Ihnen den Gesamtbetrag für {transport} von {amount}";
            };
        }
    );
    
    
    update-item-with-lang -Item $manedPaymentItem -Data $manedPaymentData;
    
