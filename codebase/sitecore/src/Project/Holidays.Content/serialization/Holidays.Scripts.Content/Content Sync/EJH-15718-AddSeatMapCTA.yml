    $seatMap["BtnBookSeats"] = "Book seats"
    $seatMap["BtnReturnSeats"] = "Book return seats"
    $seatMap["BtnOutboundSeats"] = "Book outbound seats";
    $seatMap["BtnChangeSeats"] = "Change your seats";
