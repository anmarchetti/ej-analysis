    function updateIcon($holidayPath, $tradePortalPath, $language, $icon) {
        $holidayItem = Get-Item -Path $holidayPath -Language $language -ErrorAction SilentlyContinue;
        if($holidayItem -ne $null) {
            $holidayItem.Editing.BeginEdit()
            $holidayItem["Icon"] = $icon
            $holidayItem.Editing.EndEdit() | Out-Null
        }
        
        $tradePortalItem = Get-Item -Path $tradePortalPath -Language $language -ErrorAction SilentlyContinue;
        if($tradePortalItem -ne $null) {
            $tradePortalItem.Editing.BeginEdit()
            $tradePortalItem["Icon"] = $icon
            $tradePortalItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $datasourcePath15kg = "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Bags/15kg bags"
    $datasourcePathTradePortal15kg = "/sitecore/content/EasyJet/TradePortal/Data/Hotel Themes/Package Icons/Bags/15kg bags"
    $iconBag = "<image mediaid='{7D88D7D6-A9CC-4B74-A6C9-461EE1E15247}'/>"
    
    updateIcon -HolidayPath $datasourcePath15kg -TradePortalPath $datasourcePathTradePortal15kg -Language "en" -Icon $iconBag
    updateIcon -HolidayPath $datasourcePath15kg -TradePortalPath $datasourcePathTradePortal15kg -Language "fr-FR" -Icon $iconBag
    updateIcon -HolidayPath $datasourcePath15kg -TradePortalPath $datasourcePathTradePortal15kg -Language "fr-CH" -Icon $iconBag
    updateIcon -HolidayPath $datasourcePath15kg -TradePortalPath $datasourcePathTradePortal15kg -Language "de-DE" -Icon $iconBag
    updateIcon -HolidayPath $datasourcePath15kg -TradePortalPath $datasourcePathTradePortal15kg -Language "de-CH" -Icon $iconBag
    
