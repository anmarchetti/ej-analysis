Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Virtual Regions Balearic Canary Islands
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $virtualRegionTemplateId = "{9F623626-ED06-4E71-B4F3-4B75967B3DC8}"
    $virtualRegionsRegionsMapping = @{"Balearic Islands Virtual" = @("/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Ibiza", 
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Menorca", 
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Majorca");
    "Canary Islands Virtual" = @("/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Tenerife",
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Lanzarote",
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Gran Canaria",
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Fuerteventura"
        )}
    
    
    $pathToParent = "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain"
    
    $virtualSuffix = " Virtual"
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
        # Create virtual country items and set resorts to supplied items
        foreach($vc in $virtualRegionsRegionsMapping.GetEnumerator()){
            $pathToItem = Join-Path $pathToParent $vc.Name
    
            $item = Get-Item -Path $pathToItem
    
            if ($item -eq $null){
                $item = New-Item -Path $pathToItem -ItemType $virtualRegionTemplateId
            }
    
            $regionIds = @()
            foreach($regionPath in $vc.Value){
                $regionItem = Get-Item -Path $regionPath
    
                if ($regionItem -ne $null){
                    $regionIds += $regionItem.ID
                }
            }
    
            $item.Editing.BeginEdit()
            $item.Fields["Name"].Value = $vc.Name.TrimEnd($virtualSuffix)
            $item.Fields["Regions"].Value = [system.String]::Join("|", $regionIds)
            $item.Editing.EndEdit()
        }
    }
    
    Write-Host "Script is completed"
    
    
    
