  Value: |
    function Get-Or-Create-Item ($path, $templateId) {
      $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
      if ($item -eq $null) {
          $item = New-Item -Path $path -ItemType $templateId
          Write-Host "Item" $item.Name "successfully created";
      }
      return $item
    }
        
    function Change-Content ($path, $templateId){
      $seatMapData =  Get-Or-Create-Item -path $path -templateId $templateId
      if ($seatMapData -ne $null) {
          $seatMapData.Editing.BeginEdit()
          $seatMapData["SeatsMapPassengerBoxChildAge"] =  '(aged {number})';
          $seatMapData.Editing.EndEdit() | Out-Null
      }
    }
        
    # Holidays
        
    $dataPath = '/sitecore/content/EasyJet/Holidays/Data/SeatsMap';
            
    Change-Content -path $dataPath -templateId "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
        
    # Trade
        
    $dataPath = '/sitecore/content/EasyJet/TradePortal/Data/Seats Map Trade'
            
    Change-Content -path $dataPath -templateId "{777B44A8-C3C5-4BAF-AD3D-A8343A46E3DA}"
