SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Destinations/Greece"
    
    $itemRenderings = Get-Rendering -Item $item
    
    function get-renderings-by-wrapper($wrapperId, $renderings)
    {
        $results = New-Object Collections.Generic.List[object]
        $wrapper = $renderings | Where-Object { $_.UniqueId -eq $wrapperId }
        $results.Add($wrapper)
        $placeholder = "/body/component-wrapper-inner-$($wrapperId)-0"
        $renderingsWithPlaceholder = $renderings | Where-Object { $_.Placeholder -eq $placeholder }
        foreach($rendering in $renderingsWithPlaceholder)
        {
            $results.Add($rendering)
        }
    
        return $results
    }
    
    function replace-renderings-to-and($renderings)
    {
        $lastIndex = $itemRenderings.Count 
        for($i = 0; $i -lt $renderings.Count; $i++)
        {
            $rendering = $renderings[$renderings.Count - ($i + 1)]
            $lastIndex--
            Set-Rendering -Item $item -Instance $rendering -Index $lastIndex
        }
    }
    
    $reusltRenderings = get-renderings-by-wrapper -WrapperId "{4183DDAC-5169-4702-8FA1-C24DDCC2FC8F}" -Renderings $itemRenderings
    replace-renderings-to-and -Renderings $reusltRenderings
    
