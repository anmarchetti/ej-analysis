- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $popupPath = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage Popup';
        
        function updateLuggageText($itemPath, $language, $key, $translation) {
            $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
            Write-Host $itemPath
            if($item -ne $null) {
                $item.Editing.BeginEdit()
                $item[$key] = $translation
                Write-Host $item
                $item.Editing.EndEdit() | Out-Null
            }
           
        }
      
    updateLuggageText -ItemPath $popupPath -Language "en" -Key 'DefaultBagsTitle' -Translation "Your existing hold luggage"  
    updateLuggageText -ItemPath $popupPath -Language "fr-FR" -Key 'DefaultBagsTitle' -Translation "Vos bagages de soute existants"
    updateLuggageText -ItemPath $popupPath -Language "fr-CH" -Key 'DefaultBagsTitle' -Translation "Vos bagages de soute existants"
    updateLuggageText -ItemPath $popupPath -Language "de-DE" -Key 'DefaultBagsTitle' -Translation "Ihr vorhandenes aufgegebenes Gepäck"
    updateLuggageText -ItemPath $popupPath -Language "de-CH" -Key 'DefaultBagsTitle' -Translation "Bestätigen Sie das aufgegebene Gepäck"
    
    updateLuggageText -ItemPath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Popup' -Language "en" -Key 'DefaultBagsTitle' -Translation "Your existing hold luggage"  
    
    updateLuggageText -ItemPath $popupPath -Language "en" -Key 'DefaultBagsCounterPlural' -Translation "{number} Items - Outbound and return"  
    updateLuggageText -ItemPath $popupPath -Language "fr-FR" -Key 'DefaultBagsCounterPlural' -Translation "{number} postes - aller et retour"
    updateLuggageText -ItemPath $popupPath -Language "fr-CH" -Key 'DefaultBagsCounterPlural' -Translation "{number} postes - aller et retour"
    updateLuggageText -ItemPath $popupPath -Language "de-DE" -Key 'DefaultBagsCounterPlural' -Translation "{number} Posten - Ausreise und Rückreise"
    updateLuggageText -ItemPath $popupPath -Language "de-CH" -Key 'DefaultBagsCounterPlural' -Translation "{number} Posten - Ausreise und Rückreise"
    
    updateLuggageText -ItemPath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Popup' -Language "en" -Key 'DefaultBagsCounterPlural' -Translation "{number} Items - Outbound and return"
    
    updateLuggageText -ItemPath $popupPath -Language "en" -Key 'DefaultBagsCounterSingle' -Translation "{number} Item - Outbound and return"  
    updateLuggageText -ItemPath $popupPath -Language "fr-FR" -Key 'DefaultBagsCounterSingle' -Translation "{number} poste - aller et retour"
    updateLuggageText -ItemPath $popupPath -Language "fr-CH" -Key 'DefaultBagsCounterSingle' -Translation "{number} poste - aller et retour"
