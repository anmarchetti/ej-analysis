Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-11910 Booking Confirmation - Updated Design"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Set-Datasource ($page, $renderingId,$data,$actionName) {
        $rendering = Get-Rendering -Item $page  | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
        if ($rendering -ne $null) {
            Set-Rendering -Item $page -Instance $rendering -Datasource $data
            Write-Host $actionName;
        }
    }
    
    #Remove old renderings
    $bookingConfirmationPage  = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation" -ErrorAction SilentlyContinue
    $oldRenderings = Get-Rendering -Item $bookingConfirmationPage  | Where-Object {$_.Placeholder -Match "component-wrapper-inner-{37442969-03a2-4e44-8536-6622ccd06456}"}
    ForEach ($item in $oldRenderings) {
    	Remove-Rendering -Item $bookingConfirmationPage -Instance $item
    }
    $oldRenderings = Get-Rendering -Item $bookingConfirmationPage  | Where-Object {$_.Placeholder -eq "/body"}
    ForEach ($item in $oldRenderings) {
    	Remove-Rendering -Item $bookingConfirmationPage -Instance $item
    }
    $oldRenderings = Get-Rendering -Item $bookingConfirmationPage  | Where-Object {$_.ItemId -eq "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"}
    Remove-Rendering -Item $bookingConfirmationPage -Instance $oldRenderings[0]
    
    
    #Sepup datasource for ViewBooking rendering
    $rendering = Get-Rendering -Item $bookingConfirmationPage  | Where-Object { $_.ItemId -eq "{B932CD1B-05BD-4F1D-947F-1E6F48C4F649}" } | Select -First 1
    if ($rendering -ne $null) {
        Set-Rendering -Item $bookingConfirmationPage -Instance $rendering -Parameter @{ "FallbackImage" = "<image mediaid='{B8BDEFA6-5D0E-4F27-B6C3-53BDD9A3A32C}' />" } -Datasource "/sitecore/content/EasyJet/Holidays/Data/Luggage Configuration"
        Write-Host "View booking is updated";
    }
    
    Set-Datasource -Page $bookingConfirmationPage -RenderingId "{05F2C26C-4E1D-4CAD-A817-A1B5CBBEF628}" -Data "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Card Payments" -ActionName "CardPayments is updated"
    Set-Datasource -Page $bookingConfirmationPage -RenderingId "{2A35FBE1-E039-4D16-B301-37FD96B0C10F}" -Data "/sitecore/content/EasyJet/Holidays/Data/Special Requests" -ActionName "SpecialRequest is updated"
    Set-Datasource -Page $bookingConfirmationPage -RenderingId "{7973D16E-B6AF-4E9B-AF02-6072DD7ECB82}" -Data "/sitecore/content/EasyJet/Holidays/Data/ATOL Protection" -ActionName "AtolProtecton is updated"
    Set-Datasource -Page $bookingConfirmationPage -RenderingId "{752847FB-9A5B-47E4-A1F3-42843C1A7C83}" -Data "/sitecore/content/EasyJet/Holidays/Data/Health Entry Requirements" -ActionName "HealthEntryRequirements is updated"
    
    
    #Sepup datasource for PandemicLevelRequirement rendering
    $pandemivReq = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Pandemic Level Requirement" -ErrorAction SilentlyContinue
    if ($pandemivReq -eq $null) {
    $pandemivReqForClone = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_booking/Page Components/Pandemic Level Requirement" -ErrorAction SilentlyContinue
    $pageComponents = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components" -ErrorAction SilentlyContinue
    $pandemivReq  = New-ItemClone -Item $pandemivReqForClone -Destination $pageComponents -Recurse
    Write-Host "Create PandemicLevelRequirement datasource";
    }
    $rendering = Get-Rendering -Item $bookingConfirmationPage | Where-Object { $_.ItemId -eq "{EB77E008-E0AF-431E-B2A9-055890889410}" } | Select -First 1
    Set-Rendering -Item $bookingConfirmationPage -Instance $rendering -Datasource "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Pandemic Level Requirement"
    Write-Host "PandemicLevelRequirement is updated";
    
    #Sepup datasource for HelpLinks rendering
    $helpLinks = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Bottom Help Links" -ErrorAction SilentlyContinue
    if ($helpLinks -eq $null) {
    $helpLinksForClone = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_booking/Page Components/Bottom Help Links" -ErrorAction SilentlyContinue
    $pageComponents = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components" -ErrorAction SilentlyContinue
    $helpLinks  = New-ItemClone -Item $helpLinksForClone -Destination $pageComponents -Recurse
    Write-Host "Create HelpLinks datasource";
    }
    $rendering = Get-Rendering -Item $bookingConfirmationPage | Where-Object { $_.ItemId -eq "{9133F3CA-553F-42F5-8529-54734B53A378}" } | Select -First 1
    Set-Rendering -Item $bookingConfirmationPage -Instance $rendering -Datasource "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Bottom Help Links"
    Write-Host "Bottom Help Links is updated";
