    $genericpassportinformationeu_description_421f6b74830a4144bce0df5f01d26b1a_dede_v1 = @"
    Vergewissere dich, dass dein Reisepass noch lange genug gültig ist. Dein Reisepass muss oftmals für einen Mindestzeitraum über deine Reise hinaus gültig sein – in der Regel mindestens drei oder sechs Monate – und darf unter Umständen auch nicht älter als 10 Jahre sein. Weitere Informationen findest du auf der <a href="https://www.eda.admin.ch/eda/de/home/vertretungen-und-reisehinweise/laenderunabhaengigereiseinformationen/visum-einreise.html ">EDA-Website</a>.
    "@
    $genericfcdo_description_75c6ca2683394ebc8dce1088264de2e8_en_v1 = @"
    <p>It&rsquo;s your responsibility to ensure that you meet entry requirements for your holiday,&nbsp;which may change between booking and travel. Make sure you keep checking the FCDO page for your destination to find out the steps you need to follow - you'll also be able to sign up for email alerts should anything change.</p>
    "@
