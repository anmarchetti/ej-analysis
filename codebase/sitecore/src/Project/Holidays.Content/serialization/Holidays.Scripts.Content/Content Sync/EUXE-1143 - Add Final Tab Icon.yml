    function Get-Or-Create-Item ($path,$itemName,$templateId,$itemId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    $final = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components" -ItemName "Final Tab" -TemplateId "{599B8314-689A-4767-B722-7BE4C9DFE73D}"
    $final.Editing.BeginEdit()
    $final['HeaderIconLoader'] ='<image mediaid="{B800E4D7-A0AF-4DAB-8D44-F98D2AD0B0D4}" />'
    $final.Editing.EndEdit() | Out-Null
    
    
    
    
