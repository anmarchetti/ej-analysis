  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId,$itemId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    
    function Get-Images-Ids {
    	$items = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components/Entry Quiz Tab" -ErrorAction SilentlyContinue
    	if ($items -eq $null) {
    		return ""
    	}
    
    	$separated = $items.Children | % { $_.ID }
    	return $separated -join '|'
    }
    
    
    function Create-Image ($name,$imageSrc) {
    	$image = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components/Entry Quiz Tab" -ItemName $name -TemplateId "{7E3ECDBA-C8C9-4E1C-8107-CDE554C0FD6D}"
    	$image.Editing.BeginEdit()
    	$image["Image"] = $imageSrc
    	$image.Editing.EndEdit() | Out-Null
    }
    
    #Images
    Create-Image -Name "Luggage" -imageSrc '<image mediaid="{C49EDC4D-DE55-4039-A640-F5FBE544B81B}" />'
    Create-Image -Name "Date" -imageSrc '<image mediaid="{D8077F6F-8D8E-40F5-AA5E-CA6C89CC50E1}" />'
    Create-Image -Name "Ticket" -imageSrc '<image mediaid="{F5A32E45-9B1E-404A-A5A1-DC561485D78F}" />'
    Create-Image -Name "Hotel" -imageSrc '<image mediaid="{EC7C8AAE-B0B5-4B58-A29B-C12BF956D9C5}" />'
    
    $tab = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components/Entry Quiz Tab" -ErrorAction SilentlyContinue
    $tab.Editing.BeginEdit()
    $tab["BackgroundImage"] = Get-Images-Ids
    $tab.Editing.EndEdit() | Out-Null
    
