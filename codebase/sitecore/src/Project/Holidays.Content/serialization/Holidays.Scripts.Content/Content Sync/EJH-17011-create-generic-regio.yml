  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $ctaFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Cta Folder"
    $ctaFolderId = "{B0B9CD9F-FF4E-48EA-87A6-0808083BC226}"
    
    $genericButton = Get-Or-Create-Item -path $ctaFolderPath -template $ctaFolderId
    
    $genericRegionsButtonPath = "/sitecore/content/EasyJet/Holidays/Data/Cta Folder/Regions Cta"
    $templateId = "{CF50929C-515F-456A-8482-889DA27A029B}"
    
    $genericButton = Get-Or-Create-Item -path $genericRegionsButtonPath -template $templateId
    $genericButton.Editing.BeginEdit()
    $genericButton["Link"]='<link text="See all regions of {region}" linktype="anchor" url="regions" anchor="regions" title="" class="" />'
    $genericButton.Editing.EndEdit()
    
    $mapComponent = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Maps/Maps Info" -ErrorAction SilentlyContinue
    $mapComponent.Editing.BeginEdit()
    $mapComponent["CTA"] = $genericButton.ID
    $mapComponent.Editing.EndEdit()
    
