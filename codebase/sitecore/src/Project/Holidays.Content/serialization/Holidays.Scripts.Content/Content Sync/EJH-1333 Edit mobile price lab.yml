Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-1333 Edit mobile price label value"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Edit-Phrase($item, $value){
        if ($item -ne $null -AND $value -ne $null) {
                $item.Editing.BeginEdit()
                $item["Phrase"] = $value
                $item.Editing.EndEdit() | Out-Null
            
            Write-Host "Item" $withoutPPLabelItem.Name $withoutPPLabelItem.Phrase "successfully updated"
        } 
        # else {
        #     Write-Host "Item or value is null"
        # }
    }
    
    $withoutPPLabelKey = "HolidayCard.Labels.TotalPriceFromWithoutPPSectionMobile"
    $withPPLabelKey = "HolidayCard.Labels.TotalPriceFromWithPPSectionMobile"
    $newValue = "From"
    
    $withoutPPLabelItem = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$withoutPPLabelKey']"
    $withPPLabelItem = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$withPPLabelKey']"
    
    Edit-Phrase -Item $withoutPPLabelItem -Value $newValue
    Edit-Phrase -Item $withPPLabelItem -Value $newValue
