            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Data/Assisted Travel Common Data/Special Assistance"
                TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Special Assistance"
                Fields      = @{
                    "SpecialAssistanceTitle" = @{
                        "en" = "Request assistance"
                        "fr-CH" = "Demande d’assistance"
                        "de-CH" = "Unterstützung anfordern"
                        "fr-FR" = "Demande d’assistance"
                        "de-DE" = "Unterstützung anfordern"
                    }
                    "SpecialAssistanceDescription" = @{
                        "en" = @'
    <p style="margin-top:0">If you need help with your flight, transfer, or hotel please request assistance as soon as possible after booking.<strong> You can do this online (up to {days} days before departure).</strong></p>
    <p>While we'll do our best to help, availability may be limited and cannot always be guaranteed. For last minute transfer and hotel requests, contact us at least 72 hours before travel (48 hours for airport ir airline assistance).&nbsp;</p>
    <p style="margin-bottom:0">If you've already submitted a request and need to update it, or if you've made changes to your booking, please contact us.</p>               
    '@
                        "fr-CH" = @'
    <p style="margin-top:0">Si vous avez besoin d’assistance pour vos vols, vos transferts ou votre hôtel, veuillez faire une demande d’assistance dès que possible après avoir réservé votre séjour. <strong>Vous pouvez le faire en ligne (jusqu'à {days} jours avant votre départ).</strong></p>
    <p>Bien que nous ferons de notre mieux pour vous aider, la disponibilité peut être limitée et ne peut pas être toujours garantie. Pour des demandes de dernière minute concernant les transferts ou l’hôtel, veuillez nous contacter au moins 72 heures avant votre départ (48 heures pour un besoin d’assistance à l’aéroport ou pendant le vol).</p>
    <p style="margin-bottom:0">Si vous avez déjà envoyé une demande et que vous devez la modifier, ou si vous avez apporté des modifications à votre réservation, veuillez nous contacter.</p>
    '@
                        "de-CH" = @'
    <p style="margin-top:0">Wenn du zusätzliche Unterstützung für deinen Flug, Transfer oder dein Hotel benötigst, fordere dies sobald als möglich nach der Buchung an. <strong>Du kannst das bis zu {days} Tage vor Abflug online machen.</strong></p>
    <p>Wir tun unser Bestes, um zu helfen, aber die Verfügbarkeit kann begrenzt sein und ist nicht immer garantiert. Für kurzfristige Transfer- und Hotelanfragen kontaktiere uns mindestens 72 Stunden vor Reisebeginn. Für Hilfe am Flughafen oder von der Fluggesellschaft kontaktiere uns mindestens 48 Stunden vorher.</p>
    <p style="margin-bottom:0">Wenn du schon eine Anfrage gestellt hast und sie aktualisieren musst, oder wenn du deine Buchung geändert hast, kontaktiere uns bitte.</p>               
    '@
                        "fr-FR" = @'
    <p style="margin-top:0">Si vous avez besoin d’assistance pour vos vols, vos transferts ou votre hôtel, veuillez faire une demande d’assistance dès que possible après avoir réservé votre séjour. <strong>Vous pouvez le faire en ligne (jusqu'à {days} jours avant votre départ).</strong></p>
    <p>Bien que nous ferons de notre mieux pour vous aider, la disponibilité peut être limitée et ne peut pas être toujours garantie. Pour des demandes de dernière minute concernant les transferts ou l’hôtel, veuillez nous contacter au moins 72 heures avant votre départ (48 heures pour un besoin d’assistance à l’aéroport ou pendant le vol).</p>
    <p style="margin-bottom:0">Si vous avez déjà envoyé une demande et que vous devez la modifier, ou si vous avez apporté des modifications à votre réservation, veuillez nous contacter.</p>
    '@
                        "de-DE" = @'
    <p style="margin-top:0">Wenn du zusätzliche Unterstützung für deinen Flug, Transfer oder dein Hotel benötigst, fordere dies sobald als möglich nach der Buchung an. <strong>Du kannst das online bis zu {days} Tage vor Abflug machen.</strong></p>
    <p>Wir tun unser Bestes, um zu helfen, aber die Verfügbarkeit ist begrenzt und kann nicht immer garantiert werden. Für kurzfristige Transfer- und Hotelanfragen setze dich bitte mindestens 72 Stunden vor Abreise mit uns in Verbindung (mindestens 48 Stunden bei Unterstützung am Flughafen oder durch die Fluggesellschaft).</p>
    <p style="margin-bottom:0">Wenn du bereits eine Anfrage gestellt hast und diese ändern möchtest, oder wenn sich deine Buchung geändert hat, wende dich bitte an uns.</p>               
    '@
                    }
