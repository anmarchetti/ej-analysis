    Import-Function "Import Content"
    
    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Data/Assisted Travel Common Data"
                TemplatePath = "/sitecore/templates/Common/Folder"
            }
            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Data/Assisted Travel Common Data/Contact Us For Assisted Travel Popup"
                TemplatePath = "/sitecore/templates/Feature/Booking/Popup"
                ID = "{350E086D-1BC8-49A2-9C46-72C25A541626}"
                Fields      = @{
                    "Title" = @{
                        "en" = "Request assistance"
                        "fr-CH" = "Demande d’assistance"
                        "de-CH" = "Unterstützung anfordern"
                        "fr-FR" = "Demande d’assistance"
                        "de-DE" = "Unterstützung anfordern"
                    }
                    "Description" = @{
                        "en" = @'
    <p style="margin-top:0;">To make sure your holiday includes everything you need, you can call us on:</p>
    <p><strong><a href="tel:+443309126593" style="text-decoration: underline;">+44 330 912 6593</a></strong></p>
    <p>(select option 2 and then option 4)</p>
    <p>Monday to Sunday, from 8am to 8pm. Cost of a local call. Calls from mobile or other networks may vary.</p>
    <p style="margin-bottom:0;">If you use British Sign Language (BSL), you can now get in touch with us through <strong><a rel="noopener noreferrer" href="https://www.convo.io/" target="_blank" style="text-decoration: underline;">Convo</a></strong>.</p>             
    '@
                        "fr-CH" = @'
    <p style="margin-top:0;">Pour vous assurer que votre séjour inclut tout ce dont vous avez besoin, vous pouvez nous appeler au</p>
    <p><strong><a href="tel:+33481499425" style="text-decoration: underline;">+33 4 81 49 94 25</a></strong> ou au <strong><a href="tel:+41223240012" style="text-decoration: underline;">+41 22 324 00 12</a></strong></p>
    <p>(sélectionnez l’option 2 puis 4)</p>
    <p style="margin-bottom:0;">tous les jours de 9 h 00 à 18 h 00. Prix d'un appel local. Le tarif des appels passés depuis un mobile ou d’autres réseaux peut varier.</p>
    '@
                        "de-CH" = @'
    <p style="margin-top:0;">Um sicherzustellen, dass deine Ferien alles beinhaltet, was du benötigst, kannst du uns unter folgender Nummer anrufen:</p>
    <p><strong><a href="tel:+41223240012" style="text-decoration: underline;">+41 22 324 00 12</a></strong> oder <strong><a href="tel:+493022027698" style="text-decoration: underline;">+49 302 202 7698</a></strong></p>
    <p>(wähle zuerst Option 2 und dann Option 4)</p>
    <p style="margin-bottom:0;">Montag bis Sonntag, von 9 Uhr bis 18 Uhr. Kosten eines Ortsgesprächs. Anrufe von Mobiltelefonen oder anderen Netzwerken können abweichen.</p>
    '@
                        "fr-FR" = @'
    <p style="margin-top:0;">Pour vous assurer que votre séjour inclut tout ce dont vous avez besoin, vous pouvez nous appeler au</p>
    <p><strong><a href="tel:+33481499425" style="text-decoration: underline;">+33 4 81 49 94 25</a></strong> ou au <strong><a href="tel:+41223240012" style="text-decoration: underline;">+41 22 324 00 12</a></strong></p>
    <p>(sélectionnez l’option 2 puis 4)</p>
    <p style="margin-bottom:0;">tous les jours de 9 h 00 à 18 h 00. Prix d'un appel local. Le tarif des appels passés depuis un mobile ou d’autres réseaux peut varier.</p>
    '@
                        "de-DE" = @'
    <p style="margin-top:0;">Um sicherzustellen, dass dein Urlaub alles beinhaltet, was du brauchst, ruf uns an unter:</p>
    <p><strong><a href="tel:+493022027698" style="text-decoration: underline;">+49 (0)302 202 7698</a></strong> oder <strong><a href="tel:+41223240012" style="text-decoration: underline;">+41 (0)223 24 00 12</a></strong></p>
    <p>(Option 2 und dann Option 4 wählen)</p>
    <p style="margin-bottom:0;">Täglich von 9 bis 18 Uhr. Zum Ortstarif. Anrufe von Mobiltelefonen oder anderen Netzwerken können abweichen.</p>
    '@
                    }
