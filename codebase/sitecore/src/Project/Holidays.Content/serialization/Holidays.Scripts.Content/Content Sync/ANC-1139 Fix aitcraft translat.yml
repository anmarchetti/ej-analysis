SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
        $dataFolderPathHolidays = "master:/sitecore/content/EasyJet/Holidays/Data/Aircraft Types"
        $dataFolderPathTrade = "master:/sitecore/content/EasyJet/TradePortal/Data/Aircraft Types"
        $templateId = '{B882DC82-78AE-4EAC-814E-6E45BD0DA5CE}'
        $aircraftTypes = @(
            @{
                'Key'   = "319"
                'Name' = "Airbus A319"
            },
            @{
                'Key'   = "320B"
                'Name' = "Airbus A320"
            },
            @{
                'Key'   = "321N"
                'Name' = "Airbus A321 NEO"
            },
            @{
                'Key'   = "M180"
                'Name' = "Airbus A320"
            }
        )
        
        function Get-Or-Create-Item ($path, $template) { 
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
            if($item -eq $null) {
                $item = New-Item -Path $path -ItemType $template
            }
            return $item
        }
        
        $aircraftTypesFolderHolidays = Get-Or-Create-Item -path $dataFolderPathHolidays -template $templateId
        $aircraftTypesFolderTrade = Get-Or-Create-Item -path $dataFolderPathTrade -template $templateId
        
        foreach($aircraftType in $aircraftTypes) { 
            $name = "$($aircraftType.Key)"
            $validName = [Sitecore.Data.Items.ItemUtil]::ProposeValidItemName($name)
            $pathHolidays = "$($aircraftTypesFolderHolidays.Paths.FullPath)/$($validName)"
            $pathTrade = "$($aircraftTypesFolderTrade.Paths.FullPath)/$($validName)"
            $itemHolidays = Get-Or-Create-Item -path $pathHolidays -template "{73DB73A4-8614-4586-8A20-9F79BB7B039F}"
            $itemHolidays.Editing.BeginEdit()
        	    $itemHolidays["Code"] = $aircraftType.Key
        	    $itemHolidays["SeatMapLabel"] = $aircraftType.Name
        	$itemHolidays.Editing.EndEdit() | Out-Null
        	$itemTrade =  Get-Or-Create-Item -path $pathTrade -template "{73DB73A4-8614-4586-8A20-9F79BB7B039F}"
        	$itemTrade.Editing.BeginEdit()
        	    $itemTrade["Code"] = $aircraftType.Key
        	    $itemTrade["SeatMapLabel"] = $aircraftType.Name
        	$itemTrade.Editing.EndEdit() | Out-Null
        }
        
      
        
      
