              fr = "ÉTAPE 2: CHOISISSEZ VOTRE MODE DE PAIEMENT";
              de = "SCHRITT 2: WÄHLEN SIE, WIE SIE BEZAHLEN MÖCHTEN";
          };
      },
      @{
