              de = "SCHRITT 2: WÄHLEN SIE, WIE SIE DIE ERSTATTUNG ERHALTEN MÖCHTEN";
          };
      },
      @{
          fieldName = "StepThreeTitle";
          values = @{
              en = "STEP 3: CONFIRM AND PAY";
              fr = "ÉTAPE 3: CONFIRMER ET PAYER";
              de = "SCHRITT 3: BESTÄTIGEN UND BEZAHLEN";
