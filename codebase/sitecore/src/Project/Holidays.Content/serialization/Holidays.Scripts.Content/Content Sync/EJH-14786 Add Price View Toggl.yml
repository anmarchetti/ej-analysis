Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14786 Add Price View Toggle Settings"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Settings";
    $itemName = "Offers Price View Toggle Settings";
    $itemTemplateId = '{23F56BA9-5DB8-4676-8368-B68507F415DB}';
    
    $item = Get-Item -path "$($itemPath)/$($itemName)" -ErrorAction SilentlyContinue
    if ($item -eq $null) {
        #create item
        $item = New-Item -Path $itemPath -ItemType $itemTemplateId -Name $itemName
        Write-Host "Item" $item.Name "successfully created"
        
        $item.Editing.BeginEdit()
        $item["IsPriceViewToggleEnabled"] = "1";
        $item["ToggleTotalPriceDesktopLabel"] = "Total price";
        $item["ToggleTotalPriceMobileLabel"] = "Total £";
        $item["OffersTotalPriceLabelTemplate"] = "From £{price} total";
        $item["TogglePricePPDesktopLabel"] = "Per person price";
        $item["TogglePricePPMobileLabel"] = "Pp price £";
        $item["OffersPricePPLabelTemplate"] = "From £{price} pp";
        $item.Editing.EndEdit() | Out-Null
    }
