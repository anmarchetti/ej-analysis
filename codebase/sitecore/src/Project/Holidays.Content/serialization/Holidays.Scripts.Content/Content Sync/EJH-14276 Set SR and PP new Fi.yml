SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-All-Promo-Pages () {
    	$promoPageTemplateId = "{C0CB2F05-AFD2-41CE-B53F-6F15A1033740}";
    	$promoPages = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Home/Root" -Recurse | Where { $_.TemplateID -eq $promoPageTemplateId };
    
    	foreach ($promoPage in $promoPages) {
    		Update-Page-Filters-Order -Page $promoPage;
    	}
    }
    
    function Update-Page-Filters-Order ($page) {
    	$flightTimesOptionId = "{CDD097AB-E689-4A2F-BC58-3063AFE15C81}";
    
    	if (!$page.Fields["Filters Order"].Value.Split("|").Contains($flightTimesOptionId)) {
    		$page.Editing.BeginEdit();
    		$page.Fields["Filters Order"].Value += "|$($flightTimesOptionId)";
    		$page.Editing.EndEdit() | Out-Null;
    	}
    }
    
    $mixedResultListPage = Get-Item -Path "master://sitecore/content/EasyJet/Holidays/Home/MixedResultList" -ErrorAction SilentlyContinue;
    
    Update-Page-Filters-Order -Page $mixedResultListPage
    Update-All-Promo-Pages 
