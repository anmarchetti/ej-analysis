  Hint: Script
  Value: |
    $genericRecommendedHotels = "{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}"
    
    function Update-Rendering($item){
        $duplicatedInstances = @()
        $renderingsInstances = @()
        
        Get-Rendering -Item $item |
        Foreach-Object { 
            if($_.itemId -eq $genericRecommendedHotels) {
                $duplicatedInstances += $_
            }
        }
    
        if($duplicatedInstances.Count -gt 1) {
            for($i = 0; $i -lt($duplicatedInstances.Count); $i++) {
                if([string]::IsNullOrEmpty($duplicatedInstances[$i].DataSource)){
                    $renderingsInstances += $duplicatedInstances[$i]
                }
            }
        }
    
        for($i = 0; $i -lt ($renderingsInstances.Count); $i++){
            if($renderingsInstances[$i] -ne $null) {
                Remove-Rendering -Item $item -Instance $renderingsInstances[$i]
            }
        }
    }
    
    function Update-Holidays-Type-Pages(){
        $pages = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Holiday Types"
        foreach($page in $pages.Children){
            Update-Rendering -Item $page
        }
    }
    
    Update-Holidays-Type-Pages
