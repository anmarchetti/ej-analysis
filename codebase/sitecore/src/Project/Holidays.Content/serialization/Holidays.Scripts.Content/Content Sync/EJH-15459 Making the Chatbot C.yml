  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function create-chatbot-rendering($pagePath, $title, $isSales){
        $page = Get-Item $pagePath -ErrorAction SilentlyContinue
        if($page -ne $null){
            $datasourcePath = $pagePath + '/Page Components';
            $datasource = Get-Or-Create-Item -Path $datasourcePath -ItemName 'Chatbot' -TemplateId '{2627CD79-F07E-4872-8EC8-46CCB201D5FF}';
            if($datasource -ne $null){
                    $datasource.Editing.BeginEdit();
        	        $datasource["Title"] = $title;
                    $datasource.Editing.EndEdit() | Out-Null
           }
           $rendering = Get-Item -Path "master:/" -ID '{3055C92A-633D-4ABF-A6DD-6BC801487ECE}' | New-Rendering -Placeholder 'body' -DataSource $datasource;
           Add-Rendering -Item $page -PlaceHolder 'body' -Instance $rendering
           $rendering = Get-Rendering -Item $page -PlaceHolder 'body' | Where-Object { $_.ItemId -eq '{3055C92A-633D-4ABF-A6DD-6BC801487ECE}' } | Select -First 1; 
           Set-RenderingParameter -Instance $rendering -Parameter @{"IsSalesChatbot"= $isSales; }
           Set-Rendering -Item $page -Instance $rendering
        }
        return $null
    }
    
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Help' -Title 'WELCOME_HELPCENTRE' -IsSales "0"
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us' -Title 'WELCOME_CONTACTUS' -IsSales "0"
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking' -Title 'WELCOME_VIEWBOOKING' -IsSales "0"
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Root/Info/Travel information' -Title 'WELCOME_TRAVELINFO' -IsSales "0"
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Root/Info/Protection-promise' -Title 'WELCOME_PROTECTIONPROMISE' -IsSales "0"
    create-chatbot-rendering -PagePath '/sitecore/content/EasyJet/Holidays/Home/Hotel Details' -Title 'WELCOME_SALES' -IsSales '1';
    
    
    
    
