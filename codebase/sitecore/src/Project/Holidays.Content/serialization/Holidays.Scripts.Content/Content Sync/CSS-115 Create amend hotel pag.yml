  Value: |
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue;
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath,$parameters = @{}) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath -ErrorAction SilentlyContinue;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath
    		Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath | Set-RenderingParameter -Parameter $parameters | Set-Rendering -Item $page;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    function Create-Page ($pageData,$pageDataSource,$pageRendering) {
    	function Create-Page-Templates () {
    		$pageTemplate = Get-Or-Create-Item -Path $pageData.templatePath -Template "{AB86861A-6030-46C5-B394-E8F99E8B87DB}";
    	}
    
    	# Create the Page
    	$page = Get-Or-Create-Item -Path $pageData.path -Template $pageData.template;
    
    	#Update the Page's details
    	if ($page -ne $null) {
    		$page.Editing.BeginEdit();
    
    		$page["Name"] = $pageData.Name.en;
    		$page["TrackingPageTitle"] = $pageData.PageTitle.en;
    		$page["PageTitle"] = $pageData.PageTitle.en;
    		$page["Description"] = $pageData.Description.en;
    
    		@( 'fr-CH','fr-FR') | % {
    			Create-Lang-Version -Item $page -Lang $_ -Field "Name" -Value $pageData.Name.fr;
    			Create-Lang-Version -Item $page -Lang $_ -Field "PageTitle" -Value $pageData.PageTitle.fr;
    			Create-Lang-Version -Item $page -Lang $_ -Field "Description" -Value $pageData.Description.fr;
    		}
    		@( 'de-CH','de-DE') | % {
    			Create-Lang-Version -Item $page -Lang $_ -Field "Name" -Value $pageData.Name.de;
    			Create-Lang-Version -Item $page -Lang $_ -Field "PageTitle" -Value $pageData.PageTitle.de;
    			Create-Lang-Version -Item $page -Lang $_ -Field "Description" -Value $pageData.Description.de;
    		}
    
    		$page.Editing.EndEdit() | Out-Null;
    
    		Write-Host $pageData.Name "Was updated";
    	}
    
    	#Create Page Components Folder
    	Get-Or-Create-Item -Path ($pageData.path + "/Page Components") -Template "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}";
    
    	#Create data source page item
    	$pageDataSourcePageItem = Get-Or-Create-Item -Path $pageDataSource.path -Template $pageDataSource.template;
    	
    	# Instantiate language versions for page data source item
    	@( 'fr-CH','fr-FR','de-CH','de-DE') | % {
    		Create-Lang-Version -Item $pageDataSourcePageItem -Lang $_;
    	}
    
    	#Add layout render page to page
    	$pageRenderingItem = Get-Item -Path $pageRendering.path -ErrorAction SilentlyContinue;
    
    	if ($pageRenderingItem -ne $null) {
    		Add-Or-Update-Page-Rendering -page $page -renderingPath $pageRendering.path -renderingPlaceholder "/body" -dataSourcePath $pageDataSource.path;
    		Write-Host $pageName "Render was updated";
    	}
    
    	return $page;
    }
    
    $pageData = @{};
    $pageData["path"] = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel";
    $pageData["template"] = "{89DBC097-8513-4EC6-B91E-DC47AA817362}";
    $pageData["Name"] = @{ en = "Change your hotel"; fr = "Changer d'hôtel"; de = "Ändern Sie Ihr Hotel" };
    $pageData["PageTitle"] = @{ en = "Change hotel"; fr = "Changer d'hôtel"; de = "Hotel wechseln" };
    $pageData["Description"] = @{ en = "Change your hotel"; fr = "Changer d'hôtel"; de = "Ändern Sie Ihr Hotel" };
    
    $pageDataSource = @{};
    $pageDataSource["path"] = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel/Page Components/Amend Hotel";
    $pageDataSource["template"] = "{BA29B79B-846C-4AAA-B6FF-4DC4AA87543B}";
    
    $pageRendering = @{};
    $pageRendering["path"] = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Hotel";
    
    $amendHotelPage = Create-Page -pageData $pageData -pageDataSource $pageDataSource -pageRendering $pageRendering;
    
    # Add Page To PageDesigns
    $pageTemplateId = "{89DBC097-8513-4EC6-B91E-DC47AA817362}";
    $designPath = "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Slim Footer";
    Set-Page-Design -designPath $designPath -pageTemplateId $pageTemplateId;
    
    # Add mobile basket rendering
    $mobileBasketPopupPath = "/sitecore/content/EasyJet/Holidays/Data/Mobile Basket"
    $renderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Mobile Basket";
    
    $hotelPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel"
    $hotelPageRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Hotel"
    
    $hotelPage = Get-Or-Create-Item -Path $hotelPagePath
    $hotelRenderingItem = Get-Item -Path $hotelPageRenderingPath -ErrorAction SilentlyContinue;
    $renderedPage = Get-Rendering -Item $hotelPage -Render $hotelRenderingItem
    $mobileBasketRenderingPlaceholder = "/body/mobile-basket-" + $renderedPage.UniqueId + "-0"
    
    Add-Or-Update-Page-Rendering -page $hotelPage -renderingPath $renderingPath -renderingPlaceholder $mobileBasketRenderingPlaceholder -dataSourcePath $mobileBasketPopupPath
    Write-Host "Mobile Basket rendering added to page"
    
    # Add attention message rendering
    $errataMessagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel/Page Components/Errata Message"
    
    $errataMessage = Get-Or-Create-Item -Path $errataMessagePath -Template "{4E3890D9-808D-4390-BE32-749397BE8A74}";
    
    if ($errataMessage -ne $null) {
    	$errataMessage.Editing.BeginEdit();
    
    	$enTitle = "Please read carefully";
    	$frTitle = "Lisez attentivement s'il vous plaît";
    	$deTitle = "Bitte aufmerksam lesen";
    
    	$errataMessage["Title"] = $enTitle;
    	$errataMessage["Type"] = "errata";
    	$errataMessage["Description"] = "";
    	$errataMessage["Icon"] = '<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" alt="Exclamation point" />';
    
    	@( 'fr-CH','fr-FR') | % {
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Title" -Value $frTitle;
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Description" -Value "";
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Icon" -Value '<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" alt="Point d`exclamation" />';
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Type" -Value "errata";
    	}
    	@( 'de-CH','de-DE') | % {
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Title" -Value $deTitle;
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Description" -Value "";
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Icon" -Value '<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" alt="Ausrufezeichen" />';
    		Create-Lang-Version -Item $errataMessage -Lang $_ -Field "Type" -Value "errata";
    	}
    
    	Write-Host $errataMessage.Name "Updated";
    	$errataMessage.Editing.EndEdit() | Out-Null;
    }
    
    # Updating page item rendering list
    $amendHotelPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel" -ErrorAction SilentlyContinue;
    
    if ($amendHotelPageItem -ne $null) {
    	$attentionMessageRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Attention Message";
    	$renderingPlaceholder = "/body/attention-message-" + $renderedPage.UniqueId + "-0"
    
    	Add-Or-Update-Page-Rendering -page $amendHotelPageItem -renderingPath $attentionMessageRenderingPath -renderingPlaceholder $renderingPlaceholder -dataSourcePath $errataMessagePath -Index 1;
    
    	Write-Host $amendHotelPageItem.Name "Updated";
    }
    
    
