  Value: |
    $settingsPath = "master:/sitecore/content/EasyJet/Holidays/Settings/Version Names Settings"
    $settingsParentPath = "master:/sitecore/content/EasyJet/Holidays/Settings"
    $settingsTemplateId = "{B9D6D5A7-9779-444A-9420-C71A3A880F91}"
    $settingsItemId = "{6827DE89-049E-4DDC-92F2-DA61953F279A}"
    $defaultName = "Default"
    $defaultTemplateId = "{B9712FFF-DEC9-4387-93AA-D66484FDBEAA}"
    $defaultItemId = "{0212FC79-8846-464F-8B63-9BC59B8C3799}"
    $rulesValue = "{0212FC79-8846-464F-8B63-9BC59B8C3799}"
    $fieldValue = "{9857F526-390F-48DF-B6D1-1A97CC328E8F}"
    
    $settingsItem = Get-Item -Path $settingsPath -ErrorAction SilentlyContinue
    if ($null -eq $settingsItem) {
      $settingsItem = New-Item -Path $settingsParentPath -Name "Version Names Settings" -ItemType $settingsTemplateId -ForceId $settingsItemId
    }
    
    $settingsItem.Editing.BeginEdit()
    try {
      $settingsItem["Rules"] = $rulesValue
    }
    finally {
      $settingsItem.Editing.EndEdit()
    }
    
    $defaultItemPath = "$settingsPath/$defaultName"
    $defaultItem = Get-Item -Path $defaultItemPath -ErrorAction SilentlyContinue
    if ($null -eq $defaultItem) {
      $defaultItem = New-Item -Path $settingsPath -Name $defaultName -ItemType $defaultTemplateId -ForceId $defaultItemId
    }
    
    $defaultItem.Editing.BeginEdit()
    try {
      $defaultItem["Field"] = $fieldValue
    }
    finally {
      $defaultItem.Editing.EndEdit()
    }
