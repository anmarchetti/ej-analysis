SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Media ($path, $mediaId) {
        $item = Get-Item -Path $path
        $item.Editing.BeginEdit()
        $item.Icon = "<image mediaid=""$($mediaId)""/>"
        $item.Editing.EndEdit()
    }
    
    $bagsItemPath = '/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Bags/Bags'
    $flightItemPath = '/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Flights/Flight'
    $hotelItemPath = '/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Hotels/Hotel'
    $privateTransferItemPath = '/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Transfers/Private Transfer'
    $sharedTransferItemPath = '/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons/Transfers/Shared Transfer'
    
    $bagsMediaId = '{911220DC-9344-488A-9732-195D9DEDEEE5}'
    $flightMediaId = '{6119D4EE-F9DE-40EE-A8D5-13A18BFBF832}'
    $hotelMediaId = '{84DA9ED9-4A66-4D2C-BE29-8C8AB8879129}'
    $privateTransferMediaId = '{2DF08FB5-B622-4305-ABDD-E4529F9E808F}'
    $sharedTransferMediaId = '{B24DCD75-92BF-4BFE-8EB9-5AD07CCA8455}'
    
    $pathes = $bagsItemPath, $flightItemPath, $hotelItemPath, $privateTransferItemPath, $sharedTransferItemPath
    $mediaIds = $bagsMediaId, $flightMediaId, $hotelMediaId, $privateTransferMediaId, $sharedTransferMediaId
    
    for($i=0; $i -lt $pathes.Length; $i++) { 
        Update-Media -path $pathes[$i] -mediaId $mediaIds[$i]
    }
    
