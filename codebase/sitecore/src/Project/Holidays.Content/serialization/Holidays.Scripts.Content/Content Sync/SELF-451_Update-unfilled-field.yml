  Hint: Script
  Value: |
    $amendPaymentItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment" -ErrorAction SilentlyContinue;
    
    if ($amendPaymentItem -ne $null) {
    	$amendPaymentItem.Editing.BeginEdit();
    	$amendPaymentItem["CreditDescription"] = "<p>Choosing this option means you'll receive {amount} to spend within <strong>12 months</strong> on another easyJet Holiday.</p><p>This will be immediately be returned to your easyJet account.</p>";
    	$amendPaymentItem["PreviousBalanceLabel"] = "Previous Balance"
    	$amendPaymentItem["CurrentBalanceLabel"] = "Current balance"
    	
    	$amendPaymentItem.Editing.EndEdit() | Out-Null;
    	Write-Host $amendPaymentItem.Name "updated";
    }
