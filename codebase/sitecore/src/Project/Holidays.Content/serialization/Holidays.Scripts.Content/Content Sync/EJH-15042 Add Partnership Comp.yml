---
ID: "8d740ffa-ddcc-4785-93aa-767131f49e3f"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15042 Add Partnership Component to My Bookings page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    	}
    	return $item
    }
    
    #Create Partnership Component datasource
    $myBookingsPageUrl = '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings';
    $partnershipComponentItemPath = $myBookingsPageUrl + '/Page Components/Partnership Component';
    $partnershipComponentItem = Get-Or-Create-Item -Path $partnershipComponentItemPath -ItemName "Partnership Component" -TemplateId "{ED5D6BA0-91B1-41ED-AD54-A26A7785E166}"
    
    if ($partnershipComponentItem -ne $null) {
    	$partnershipComponentItem.Editing.BeginEdit();
    	$partnershipComponentItem["Subtitle"] = 'Destination of the week';
    	$partnershipComponentItem["Title"] = 'Excursion header example';
    	$partnershipComponentItem["Description"] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi pharetra faucibus euismod. Duis sed faucibus libero, vitae fermentum nisl. Sed bibendum viverra risus quis elementum.";
    	$partnershipComponentItem["Logo"] = '<image mediaid="{1B9ABE6E-0223-4AE4-81E0-E99307AF9147}" />';
    	$partnershipComponentItem["Image"] = '<image mediaid="{FACF2375-A258-44E2-BE31-D54B90C09997}" />';
    	$partnershipComponentItem["Link"] = '<link text="View All" linktype="external" url="https://whitelabel-frontend.prod.musement.com/" anchor="" class="" target="" />';
    	$partnershipComponentItem.Editing.EndEdit() | Out-Null;
    }
    
    # Add Component Wrapper Rendering
    $componentWrapperPlaceholder = "body";
    $componentWrapperRenderingId = "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"
    $wrapperItem = Get-Item -Path "master:" -Id $componentWrapperRenderingId | New-Rendering -Placeholder $componentWrapperPlaceholder
    $myBookingsPage = Get-Item -Path $myBookingsPageUrl;
    Add-Rendering -Item $myBookingsPage -PlaceHolder $componentWrapperPlaceholder -Instance $wrapperItem
    
    Get-Rendering -Item $myBookingsPage -PlaceHolder $componentWrapperPlaceholder | Set-RenderingParameter -Parameter @{ "IsGreyBackground" = 0; "IsTriangleStart" = 0; "IsTriangleEnd" = 0 } | 
    Set-Rendering -Item $myBookingsPage
    $wrapperRendering = Get-Rendering -Item $myBookingsPage -PlaceHolder $componentWrapperPlaceholder | Where-Object { $_.ItemID -eq $componentWrapperRenderingId };
    
    #Add Rendering
    $placeholder= "/body/component-wrapper-inner-"+ $wrapperRendering.UniqueId +"-0"
    $partnershipComponentRenderingId = "{EF923FE5-72B8-41AE-9D17-BD2B8B99A377}";
    $rendering = Get-Rendering -Item $myBookingsPage -PlaceHolder $placeholder | Where-Object { $_.ItemID -eq $partnershipComponentRenderingId }
    
    if ($rendering -eq $null) {
    	$renderingItem = Get-Item -Path "master:" -Id $partnershipComponentRenderingId | New-Rendering -PlaceHolder $placeholder
    	Add-Rendering -Item $myBookingsPage -PlaceHolder $placeholder -DataSource $partnershipComponentItemPath -Instance $renderingItem 
    	
    	Get-Rendering -Item $myBookingsPage -PlaceHolder $placeholder | Set-RenderingParameter -Parameter @{Theme = "Without Live Price"} | 
        Set-Rendering -Item $myBookingsPage
    	Write-Host "Partnership Component Rendering was added to My Bookings Page"
    }
    
