SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host  "START SCRIPT: EHD-197 Feefo widget"
    
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    $ItemPath = '/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components/Feefo Widget'
    $Item = Get-Or-Create-Item -Path $ItemPath -ItemName "Feefo Widget" -TemplateId "{E187C174-03FB-493E-87CB-4BBAF9C2CBBB}"
    
    if ($Item -ne $null) {
        $Item.Editing.BeginEdit();
        $Item["Image"] = '<image mediaid="{5226361E-9B53-459E-A19B-80302F7C3CE2}" />';
        $Item["Url"] = '<link linktype="external" url="https://www.feefo.com/en-GB/reviews/easyjet-holidays-limited?displayFeedbackType=SERVICE&amp;timeFrame=YEAR" anchor="" target="_blank" rel="" />';
        $Item.Editing.EndEdit() | Out-Null;
    	
    	Write-Host "Feefoo widget datasource successfully updated"
    }
    
    $pagePath = Get-Item -Path "master://sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components/Feefo Widget" 
    $placeholderPath = 'body'
    $renderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Feefo Widget"
    
    $renderingId = "{1BA26842-96D0-4FF4-B517-FD68C72072F1}"
    $existsRendering = Get-Rendering -Item $pagePath -PlaceHolder $placeholderPath -FinalLayout | Where-Object {$_.ItemId -eq $renderingId}
    $rendering = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholderPath
    
    Write-Host $existsRendering.Datasource
    
    if($existsRendering -eq $null){
        Add-Rendering -Item $pagePath -Instance $rendering -DataSource $dataSourcePath -Placeholder $placeholderPath -Index 0 -FinalLayout
        Write-Host "Added rendering: Feefo Widget"
    } else {
        if(([string]::IsNullOrEmpty($existsRendering.DataSource))) {
        	Write-Host "Rendering is in place but datasource is NULL. Setting Feefo Widget datasource"
        	$existsRendering.DataSource = $dataSourcePath
        	Set-Rendering -Item $pagePath -Instance $existsRendering -FinalLayout
        	Write-Host "Datasource is set " $existsRendering.DataSource
        } else {
        	Write-Host "Skip adding rendering: Feefo Widget already exists"
        }
    }
    
    Write-Host  "END SCRIPT: EHD-197 Feefo widget"
