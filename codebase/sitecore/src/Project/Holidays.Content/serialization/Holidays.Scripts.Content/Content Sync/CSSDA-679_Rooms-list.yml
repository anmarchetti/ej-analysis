SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    
    
    $amendRBCItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board/Page Components/Amend Room And Board" -ErrorAction SilentlyContinue;
    $data = @(
        @{
            fieldName="AltRoomsTitle"; 
            values=@{
                en="Other Rooms Available"; 
                fr="Autres pièces disponibles"; 
                de="Andere Räume verfügbar"
            }
        },
        @{
            fieldName="AltRoomsExpandLabel"; 
            values=@{
                en="See more room options"; 
                fr="Voir d'autres options de chambres"; 
                de="Weitere Zimmeroptionen anzeigen"
            }
        },
        @{
            fieldName="AltRoomsCollapseLabel"; 
            values=@{
                en="Hide room options"; 
                fr="Cacher les options de la chambre"; 
                de="Option Raum ausblenden"
            }
        },
         @{
            fieldName="OriginalRoomTitle"; 
            values=@{
                en="Your Room"; 
                fr="Votre chambre"; 
                de="Ihr Zimmer"
            }
        }
    );
    
    if ($amendRBCItem -ne $null) {
        $amendRBCItem.Editing.BeginEdit();
        $amendRBCItem["CountRoomsToShow"] = 3;
        $amendRBCItem.Editing.EndEdit() | Out-Null
    }
    
    update-item-with-lang -Data $data -Item $amendRBCItem;
