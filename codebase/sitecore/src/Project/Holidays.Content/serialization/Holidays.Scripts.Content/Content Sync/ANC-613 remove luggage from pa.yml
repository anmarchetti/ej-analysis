    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Payment/Page Components/Luggage' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Pay Balance/Page Components/Luggage' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/TradePortal/Home/Booking/Confirm/Page Components/Luggage' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    
    function Delete-Rendering($pagePath){
        $page = Get-Item -Path $pagePath
        $allRenderings = Get-Rendering -Item $page
        
        foreach($rendering in $allRenderings){
             if($rendering.ItemId -eq "{9FD91E19-714F-4313-9E52-FF77B4E9F030}"){
                 Remove-Rendering -Item $page -Instance $rendering
                 Write-Host "ItemId: " $rendering.ItemId "successfully removed";
             }
         }
    }
    
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Pay Balance'
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Payment'
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Confirm'
         
