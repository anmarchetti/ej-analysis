- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $data = 
    @(
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Buttons/Show More";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Alternative Zimmer ansehen" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Afficher les autres chambres disponibles " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Buttons/Show Less";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Alternative Zimmer ausblenden" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Masquer les autres chambres disponibles " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Board Types/Labels/Included In Holiday";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "In deinem Urlaub inbegriffen:" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Inclus dans votre séjour : " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Changing From";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Ändern ab" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Changement de " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Title";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Änderungen bestätigen" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Confirmer vos modifications " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Update To";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Update zum Paket" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Ajouter au forfait " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Labels/Included In Room";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "In Ihrem Zimmer inbegriffen:" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Inclus dans votre chambre : " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Labels/Edit Room";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Ihr Zimmer bearbeiten" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Modifier votre pièce " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Buttons/Confirm changes";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Bestätigen Sie Änderungen" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Confirmer les modifications " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Changing From";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Ändern ab" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Changement de " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Title";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Änderungen bestätigen" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Confirmer vos modifications " } )
    	},
    	@{
    		path = "/sitecore/content/EasyJet/Holidays/Dictionary/Booking Alterations/Labels/Update To";
    		fields = @( @{ name = "Phrase"; lang = "de-CH"; value = "Update zum Paket" }, @{ name = "Phrase"; lang = "fr-CH"; value = " Ajouter au forfait " } )
    	}
    )
    
    Write-Host 'BEGIN: EDI-153 create sitecore script for translation'
    
    foreach ($dataItem in $data) {
    		
    		Write-Host 'Try to add translations for ' $dataItem.path
    		
    		$itemExists = Get-Item -Path $dataItem.path -ErrorAction SilentlyContinue
    		if($itemExists -eq $null){
    		    Write-Host 'Failed: Cannot find item  ' $dataItem.path
    		    continue
    		}
    		
    		foreach ($field in $dataItem.fields) {
    		    # Added Language Versions if not exist
                Add-ItemVersion -Path $dataItem.path -Language "en" -TargetLanguage $field.lang -IfExist Skip 
               
                # Get specific item language version
                $item = Get-Item -path $dataItem.path -Language $field.lang
                
                # Update translation
                $item.Editing.BeginEdit()
    		    $item[$field.name] = $field.value
    		    $item.Editing.EndEdit() | Out-Null
    		}
    	
    	    Write-Host 'Translations added successfully: ' $dataItem.path
    	}
    
    # Add Item Versions if not exist, Standard values are populated with translations for fr and de so just need to create language versions
    Add-ItemVersion -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details/Page Components/Room Types" -Language "en" -TargetLanguage "de-CH" -IfExist Skip
    Add-ItemVersion -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details/Page Components/Room Types" -Language "en" -TargetLanguage "fr-CH" -IfExist Skip
    
    Write-Host 'END: EDI-153 create sitecore script for translation'
