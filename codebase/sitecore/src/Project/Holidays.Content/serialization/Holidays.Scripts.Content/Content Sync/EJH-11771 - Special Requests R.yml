SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Page
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking"
    $page = Get-Item -path $pagePath -ErrorAction SilentlyContinue
    
    # Update Rendering
    $infoWithActionRenderingId = "{B6822154-3A54-4748-B20D-26A354F714B1}"
    $infoWithActionDatasource = "/sitecore/content/EasyJet/Holidays/Data/Info With Actions Blocks/Special Assistance"
    $renderigPlaceholder = "/body/component-wrapper-inner-{87238c24-9199-4538-97a4-55db1ce624cf}-0";
    $renderingInstance = Get-Rendering -Item $page -PlaceHolder $renderigPlaceholder | Where-Object {$_.ItemId -eq $infoWithActionRenderingId -and $_.Datasource -eq $infoWithActionDatasource}
    
    if($renderingInstance -ne $null){
        $renderingInstance.ItemID = '{2A35FBE1-E039-4D16-B301-37FD96B0C10F}'
        Set-Rendering -Item $page -Instance $renderingInstance -DataSource '/sitecore/content/EasyJet/Holidays/Data/Special Requests'
        Write-Host  "Rendering was updated"
    }
