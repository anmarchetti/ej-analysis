- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $restrictmentItemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Amend Restrictions/External Agency Restrictment"
    
    $restrictmentItem = Get-Or-Create-Item -path $restrictmentItemPath -template "{A712513A-3D87-4D0E-A4F7-34042B3BAD96}"
    
    if ($restrictmentItem -ne $null) {
    	$restrictmentItem.Editing.BeginEdit()
    	
    	$restrictmentItem["Name"] = "External Agency Restrictment";
    	$restrictmentItem["Title"] = "Looking to make a change?";
    	$restrictmentItem["Description"] = "<p>If you want to make a change to this booking please contact your travel agent.</p>";
    	$restrictmentItem["Icon"] = '<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" />';
    	$restrictmentItem["IsExternal"] = "1";
    		
    	$restrictmentItem.Editing.EndEdit() | Out-Null
    
    	Write-Host "Item" $restrictmentItem.Name "successfully updated"
    }
