  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
        
    $componentPath = "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form"
    $templateId = "{1AD42BE9-63BC-4AF2-BC37-2EEE3E75CEFF}"
            
    $item = Get-Or-Create-Item -path $componentPath -template $templateId
    $item.Editing.BeginEdit()
    $item["SuccessTitleWithCaseNumber"] = "Thank you for your enquiry"
    $item["SuccessTextWithCaseNumber"] = "Thanks for getting in touch, this is your reference number {caseNumber} showing that we’ve received your query and we’ll be in touch via email to share next steps."
    $item["SuccessTitle"] = "You successfully submit the form"
    $item["SuccessText"] = "We will contact you soon about your request."
    
    $item.Editing.EndEdit()
