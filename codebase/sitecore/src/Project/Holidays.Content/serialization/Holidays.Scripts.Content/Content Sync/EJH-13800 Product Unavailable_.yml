- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource,$last) {
        if ($last -eq $null) {
            $rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
        } else {
            $rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -Last 1
        }
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    $popupTemplateId = "{C8C39B93-2202-4B2D-937F-8F644B0D3183}"
    $popupRenderingId = "{25CE2509-12AE-46CC-888B-B13CC0251D8E}"
    
    $data = Get-Or-Create-Item -Path '/sitecore/content/EasyJet/Holidays/Data' -ItemName "Product Unavailable Popup" -TemplateId $popupTemplateId
    $data.Editing.BeginEdit();
    $data["Icon"] = '<image mediaid="{34E230AC-F437-4138-A876-78443A00096F}" />'
    $data["Title"] = "{title} in no longer available"
    $data["Description"] = "<p>We’re unable to offer this {title} to this holiday. </p>"
    $data["CTA"] = "Back to {title}"
    $data.Editing.EndEdit() | Out-Null
    
    $paymentPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment" -ErrorAction SilentlyContinue
    $flightsPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Flight" -ErrorAction SilentlyContinue
    
    if ($paymentPage -ne $null) {
        Update-Rendering-DataSource -Item $paymentPage -RenderingId $popupRenderingId -PlaceHolder "body" -NewDataSource $data.ID
    }
    
    if ($flightsPage -ne $null) {
        Update-Rendering-DataSource -Item $flightsPage -RenderingId $popupRenderingId -PlaceHolder "body" -NewDataSource $data.ID
    }
