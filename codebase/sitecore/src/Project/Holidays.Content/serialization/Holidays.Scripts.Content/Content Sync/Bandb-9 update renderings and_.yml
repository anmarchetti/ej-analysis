SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function get-or-create-item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue;
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $templateId;
    		return $item;
    	}
    
    	return $item;
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $textBlockTemplateId = '{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}'
    $textBlockGenericQnATextPath = "/sitecore/content/EasyJet/Holidays/Data/Text Blocks/Generic QnA"
    
    $QnATextBlockData = @{
        en = "Your questions answered.";
        fr = "Nos réponses à vos questions sur des vacances.";
        de = "Habe Fragen? Hier sind die Antworten."
    }
    
    $QnAtextBlock = get-or-create-item -path $textBlockGenericQnATextPath -templateId $textBlockTemplateId
    $QnAtextBlock.Editing.BeginEdit()
    $QnAtextBlock["Title"] = $QnATextBlockData.en;
    $QnAtextBlock.Editing.EndEdit()
    
    @('fr-CH', 'fr-FR') | % {
        create-lang-version -Item $QnAtextBlock -Lang $_ -Field "Title" -Value $QnATextBlockData.fr;
    }
                
    @('de-CH', 'de-DE') | % {
        create-lang-version -Item $QnAtextBlock -Lang $_ -Field "Title" -Value $QnATextBlockData.de;
    }
    
    $QnAtextBlockCreated = get-item -path $textBlockGenericQnATextPath
    
    $renderingsPlaceholder = "/body/component-wrapper-inner-{69D4005F-3C42-4751-8A14-9AFBEF6E0913}-0"
    $textBlockRendringId = '{43546A28-D231-4287-96D2-25DEF529F1A5}'
    $qnaRendringId = '{F439DE66-8B5C-4235-BE17-8675B58AA50A}'
    $qnaSchemaRenderingId = '{2D04B19E-63E4-42FB-9581-0D7370107D7E}'
    
    function SetupDatasourcesForCountries {
        param($item)
        $renderings = Get-Rendering -Item $item
        $qnaRenderings = $renderings | Where-Object { $_.placeholder -eq $renderingsPlaceholder }
        $textBlockRendering = $qnaRenderings | Where-Object { $_.ItemId -eq $textBlockRendringId }
        
        $textBlockRendering.datasource = $QnAtextBlockCreated.ID
        Set-Rendering -Item $item -Instance $textBlockRendering
    
        $qnaDatasource = Get-item -path "$($item.FullPath)/Page Components/Question and Answer" -ErrorAction SilentlyContinue
        if($qnaDatasource -ne $null){
            $qnaRendering = $qnaRenderings | Where-Object { $_.ItemId -eq $qnaRendringId }
    
            $qnaRendering.datasource = $qnaDatasource.ID
            Set-Rendering -Item $item -Instance $qnaRendering
        
            $qnaScemaRendering = $qnaRenderings | Where-Object { $_.ItemId -eq $qnaSchemaRenderingId }
        
            $qnaScemaRendering.datasource = $qnaDatasource.ID
            Set-Rendering -Item $item -Instance $qnaScemaRendering
        }
    }
    
    function UpdateRendring {
      param($item)
            $newValue = $item["__Renderings"]
            
            if($newValue.Contains('<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"><p:d /></r>')){
                $newValue = $newValue.Replace('<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"><p:d /></r>','<r uid="{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}"></r>')
            }
            
            if($newValue.Contains('<r uid="{69D4005F-3C42-4751-8A14-9AFBEF6E0913}"><p:d /></r>')){
                $newValue = $newValue.Replace('<r uid="{69D4005F-3C42-4751-8A14-9AFBEF6E0913}"><p:d /></r>','<r uid="{69D4005F-3C42-4751-8A14-9AFBEF6E0913}"></r>')
            }
            
            if($newValue.Contains('<r uid="{9DD17CD9-001A-4A5F-9193-5BBF87F76CA7}"><p:d /></r>')){
                $newValue = $newValue.Replace('<r uid="{9DD17CD9-001A-4A5F-9193-5BBF87F76CA7}"><p:d /></r>','<r uid="{9DD17CD9-001A-4A5F-9193-5BBF87F76CA7}"></r>')
            }
            
            $item.Editing.BeginEdit()
            $item["__Renderings"] = $newValue
            $item.Editing.EndEdit()
            Write-Host "Changed rendering"
    }
    
    # Loop through all items
    
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" }
    
    foreach ($countryItem in $countryItems) {
        UpdateRendring -item $countryItem
        SetupDatasourcesForCountries -item $countryItem
    }
    
