    function Add-Rendering-To-View($item, $renderingId, $newRenderingId, $datasource, $sign,  $viewBookingRendId){
        $bagsRend;
        $viewBookingRendId = Get-Rendering -Item $item |
            Foreach-Object { 
                if($_.ItemId -eq $viewBookingRendId){
                    return $_.UniqueId
                }
            }
            
        
            $index = 0
            Get-Rendering -Item $item |
            Foreach-Object { 
                $index++
                if($_.ItemId -eq $renderingId)
                {
                        $bagsRend = $_;
                        $incrementIndex = $index
                        if ($sign -ne 0){
                            $incrementIndex = $index + $sign
                        }
                        
                        $placeholder= '/body/extra-luggage-' + $viewBookingRendId + '-0';
                       
                    
                        Add-New-Rendering -Item $item -Placeholder $placeholder -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex -Parameters $parameters
                        
                        $newRendering = Get-Rendering -Item $item |
            Foreach-Object { 
                if($_.ItemId -eq $newRenderingId){
                   
                   $bagsRend.Placeholder = $_.Placeholder + '/bags-' + $_.UniqueId + '-0';
                   Set-Rendering -Item $item -Instance $bagsRend
                }
            }
                }
            }
            
            
            
    }
    
