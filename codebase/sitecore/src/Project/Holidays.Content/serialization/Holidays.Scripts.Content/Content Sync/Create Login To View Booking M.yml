SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Add login popup to header
    function Add-Login($page){
        if ($page -ne $null) {
            $renderings = Get-Rendering -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking';
    
            $renderings| ForEach-Object {
                if ($_.ItemID -eq '{B932CD1B-05BD-4F1D-947F-1E6F48C4F649}') {
                    $viewBookingRendering = $_;
            	}
            }
            
            $loginPlaceHolder=  $viewBookingRendering.Placeholder + '/login-popup-'+ $viewBookingRendering.UniqueId +'-0'
            $loginRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Login To View Booking Popup"
            $loginItem = Get-Item -Database "master" -Path $loginRenderingPath | New-Rendering -Placeholder $loginPlaceHolder
            Add-Rendering -Item $page -PlaceHolder $loginPlaceHolder -Instance $loginItem  -Index '9'
        }
    }
    
    $bookingPage= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -ErrorAction SilentlyContinue
    
    Add-Login -page $bookingPage;
    
    #Create datasource
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    $loginMaintenance = Get-Or-Create-Item -path "master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Login Maintenance Mode Popup" -templateId "{5C4A2D07-6BE0-409B-97A9-0829970283B1}";
    
    if ($loginMaintenance -ne $null) {
        $loginMaintenance.Editing.BeginEdit()
        $loginMaintenance["Icon"] = '<image mediaid="{90267470-172A-4102-B274-CCD136CD9651}" />';
        $loginMaintenance["Title"] = "Unfortunately, you can't log in to view booking page. Please, bear with us.";
        $loginMaintenance["Description"] = "We&rsquo;re working on making a better experience for you.<br /> We apologise for any inconveniences caused and thank you for your patience.";
        $loginMaintenance.Editing.EndEdit() | Out-Null
    }
