    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function create-lang-version-navigation-tab($item, $lang, $name, $id, $icon) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
            
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        $targetLangItem.Editing.BeginEdit()
        $targetLangItem["Name"] = $name
        $targetLangItem.Editing.EndEdit() | Out-Null
    }
    
    function create-navigation-tabs($data){
        $path = "$($basketDataSourcePath)/$($data.en)"
        $navigationTab = Get-Or-Create-Item -path $path -template $navigationTabTemplateID
        
        $navigationTab.Editing.BeginEdit()
        $navigationTab["Name"] = $data.en
        $navigationTab["Id"] = $data.id
        $navigationTab["Icon"] = $data.icon
        $navigationTab.Editing.EndEdit()
        
        @('fr-CH', 'fr-FR') | % {
            create-lang-version-navigation-tab -Item $navigationTab -Lang $_ -Name  $data.fr;
        }
                        
        @('de-CH', 'de-DE') | % {
            create-lang-version-navigation-tab -Item $navigationTab -Lang $_ -Name  $data.de;
        }
        
        return $navigationTab
    }
    
    function create-navigation-tabs-trade($data){
        $path = "$($basketDataTradeSourcePath)/$($data.en)"
        $navigationTab = Get-Or-Create-Item -path $path -template $navigationTabTemplateID
        
        $navigationTab.Editing.BeginEdit()
        $navigationTab["Name"] = $data.en
        $navigationTab["Id"] = $data.id
        $navigationTab["Icon"] = $data.icon
        $navigationTab.Editing.EndEdit()
        
        return $navigationTab
    }
    
