  Value: |
    $renderingId = "{0DD91E53-B1E2-4A2E-9A9E-81F0A75BAA29}"
    $itemPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking"
    $placeholder = "/body/component-wrapper-inner-{a9e1b04c-7882-47ed-80ce-eb001faabbf6}-0/export-holiday-details-{aed68ef4-0cf1-4301-8420-895ca0520b38}-0"
    
    $datasourcename = "Export Holiday Details"
    $datasourceitemtemplateid = "{2DDDE769-99A2-487B-A02D-53CCB5D9B962}"
    $datasourcepath ="/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components"
    
    $seatsRenderingId = "{7910DC7C-14B7-48F1-9256-C570F700F085}"
    $datasourceseatspath = "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags"
    
    function create-datasource-item($name, $path, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
            
                if($item -ne $null){
                    $item.Editing.BeginEdit()
                    $item.Fields["Adults"].Value = '1'
                    $item.Fields["Children"].Value = '1'
                    $item.Fields["Infants"].Value = '1'
                    
                    $item.Fields["Title"].Value = "You're about to download a summary of the holiday as a PDF file"
                    $item.Fields["Description"].Value = "Please have a look at a preview of the PDF"
                    $item.Fields["DownloadButton"].Value = "Download PDF"
                    $item.Fields["LogoImage"].Value = "<image mediaid='{01548208-7DD9-42DA-A595-49CB9F683C93}' />"
                    $item.Fields["ExportPromoLabel"].Value = "Download the quote in a PDF"
                    $item.Fields["Logos"].Value = "<image mediaid='{D04475F6-6D23-4A71-A9AD-3EADCD759BA4}' />"
                    $item.Fields["ExportPromoTooltip"].Value = "You're able to download a summary of the holiday as a PDF file."
                    $item.Fields["ReturnLabel"].Value = "Back to extras"
                    $item.Fields["LogoCheckboxLabel"].Value = "Place easyJet holidays logo"
                    $item.Fields["DownloadLabel"].Value = "Download"
                    
                    $item.Editing.EndEdit()
    
                    Write-Host "Export Holiday Details Datasource is created"
                }
    
            return $item
        }
        
        return $item
    }
    
    function add-rendering-with-datasource-to-item($renderingId, $item, $datasource, $placeholderName){
        $existsRendering = Get-Rendering -Item $item -PlaceHolder $placeholderName  | Where-Object {$_.ItemId -eq $renderingId}
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering  -Placeholder $placeholderName
        if($existsRendering -eq $null){
            Add-Rendering -Item $item -PlaceHolder $placeholderName -DataSource $datasource.FullPath -Instance $renderingItem
            $addedRendering = Get-Rendering -Item $item -PlaceHolder $placeholderName  | Where-Object {$_.ItemId -eq $renderingId}
        
            return $addedRendering
        }
    }
    
    # Holidays
    $datasourceitem = create-datasource-item -Name $datasourcename -Path $datasourcepath -TemplateId $datasourceitemtemplateid
    $datasourceseatsitem = Get-Item -Path $datasourceseatspath -ErrorAction SilentlyContinue
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    if($item -ne $null){
        $newRendering = add-rendering-with-datasource-to-item -RenderingId $renderingId -Item $item -Datasource $datasourceitem -PlaceholderName $placeholder
        if($newRendering -ne $null) {
            $newRenderingUid = $newRendering.UniqueId
            $placeholderseats = "/body/component-wrapper-inner-{a9e1b04c-7882-47ed-80ce-eb001faabbf6}-0/export-holiday-details-{aed68ef4-0cf1-4301-8420-895ca0520b38}-0/seats-and-bags-$($newRenderingUid)-0"
            add-rendering-with-datasource-to-item -RenderingId $seatsRenderingId -Item $item -Datasource $datasourceseatsitem -PlaceholderName $placeholderseats
        }
    }
