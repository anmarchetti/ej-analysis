      $item = Get-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Change Passengers Details"
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phone"] = "0333 039 4658"
            $item["RestrictionsPopupTitle"] = "Sorry we can't make this change"
            $item["CharacterLimitRestriction"] = '<p>Unfortunately you are unable to make a change to both the first name and surname by more than 3 characters in total.</p>
            <p>However you can still make this change via our call center.</p>
            <p>Please call {number} in order to make this change.</p>'
            $item["ChangeLimitRestriction"] = '<p>Unfortunately you can make another change to this passenger as you have reached your maximum number of changes.</p>
            <p>However you can still make the changes via our call center.</p>
            <p>Please call {number} in order to make this change.</p>'
            $item["LeadPassengerRestriction"] = '<p>Unfortunately you are unable to make a change to the lead passenger.</p>
            <p>If your details are incorrect for the lead passenger then please speak to a member of our call center who will able to support with what to do next.</p>
            <p>Please call {number} in order to discuss further.</p>'
            $item.Editing.EndEdit() | Out-Null
        }
