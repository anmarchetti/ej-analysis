  Hint: Script
  Value: |
    $itemPath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Redirect To Airline For Bag Purchase'
    
    function updateLuggageText($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    updateLuggageText -Item $itemPath -language 'de-DE' -key 'Title' -translation 'Möchten Sie mehr Taschen mit in den Urlaub nehmen?'
    updateLuggageText -Item $itemPath -language 'de-DE' -key 'Link' -translation '<link text="Gepäck hinzufügen" linktype="external" url="https://www.easyjet.com/de?accntmdl=1" anchor="" target="" rel="" />'
    updateLuggageText -Item $itemPath -language 'de-DE' -key 'Description' -translation "Wenn Sie ein großes Handgepäckstück oder zusätzliches aufgegebenes Gepäck zu Ihrem Urlaubspaket hinzufügen möchten, können Sie dies bei Ihrer Buchung über <br /><br /> Nur damit Sie es wissen: Alle Extras, die Sie über easyJet.com hinzufügen, werden nicht auf easyJet-Reisen berücksichtigt."
    updateLuggageText -Item $itemPath -language 'fr-FR' -key 'Title' -translation 'Vous voulez emporter moins de sacs en vacances ?'
    updateLuggageText -Item $itemPath -language 'fr-FR' -key 'Link' -translation '<link text="Ajouter des bagages" linktype="external" url="https://www.easyjet.com/fr?accntmdl=1" anchor="" target="" rel="" />'
    updateLuggageText -Item $itemPath -language 'fr-FR' -key 'Description' -translation "Si vous souhaitez ajouter un grand bagage en cabine ou un bagage en soute supplémentaire à votre forfait vacances &ndash ; vous pouvez l'ajouter à votre réservation via easyJet.com une fois que vous avez votre numéro de référence de vol. <br /><br /> Pour votre information, les suppléments que vous ajoutez via easyJet.com ne seront pas répercutés sur les vacances easyJet. "
