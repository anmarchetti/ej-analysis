  Hint: Script
  Value: |
    $path = "/sitecore/content/EasyJet/Holidays/Settings/Credit Booking Settings"
    
    function update-setting($lang) {
        
     $item = gi -path $path -Language $lang -ErrorAction SilentlyContinue
     
     if ($null -ne $item) {
         $item.Editing.BeginEdit()
         $item["EnableRedeemVoucher"] = $null
         $item.Editing.EndEdit()
     }
     
    }
    
    update-setting -lang "fr-CH"
    update-setting -lang "de-CH"
