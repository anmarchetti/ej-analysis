    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    
    function Add-Or-Update-Page-Rendering($page, $renderingPath, $renderingPlaceholder, $dataSourcePath, $params) {
            $renderingItem = Get-Item -Database "master" -Path $renderingPath;
            $pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
            
            if ($pageRenderingInstance -eq $null) {
                $renderingInstance = $renderingItem | New-Rendering -Placeholder $renderingPlaceholder;
                Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Datasource $dataSourcePath -Parameter $params;
                Write-Host $renderingItem "Rendering instance added";
            } 
            else {
                Write-Host $pageRenderingInstance "Already exists";
            }
    }
    
     function Get-Or-Create-Item($path, $template){
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
            return $item
    }
    
    # Creating and populating RBC popup
    $rbcUnavailablePopup = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Room And Board Unavailable Popup" -Template "{C8C39B93-2202-4B2D-937F-8F644B0D3183}";
    
    if ($rbcUnavailablePopup -ne $null) {
        $popupData = @(
            @{
                fieldName="Title"; 
                values=@{
                    en="WE'RE SORRY, THERE ARE NO ALTERNATIVE ROOM & BOARD OPTIONS AVAILABLE FOR YOUR SELECTED HOTEL"; 
                    fr="NOUS SOMMES DÉSOLÉS, IL N'Y A PAS D'AUTRES OPTIONS DE CHAMBRE ET DE PENSION DISPONIBLES POUR L'HÔTEL CHOISI"; 
                    de="ES TUT UNS LEID, ES SIND KEINE ALTERNATIVEN OPTIONEN FÜR IHR GEWÄHLTES HOTEL VERFÜGBAR"
                }
            },
            @{
                fieldName="Description"; 
                values=@{
                    en="There are no alternative room & board options online for your selected hotel. <br />If you need to talk to us about changing your holiday package please contact us."; 
                    fr="Il n'y a pas d'autres options de chambre et de pension en ligne pour l'hôtel sélectionné. <br />Si vous souhaitez nous parler d'une modification de votre forfait de vacances, veuillez nous contacter."; 
                    de="Für das von Ihnen gewählte Hotel gibt es online keine alternativen Optionen für Unterkunft und Verpflegung. <br />Wenn Sie mit uns über eine Änderung Ihres Urlaubspakets sprechen möchten, kontaktieren Sie uns bitte."
                }
            },
            @{
                fieldName="CTA"; 
                values=@{
                    en="Contact us"; 
                    fr="Contactez nous"; 
                    de="Kontakt"
                }
            }
            @{
                fieldName="CTALink"; 
                values=@{
                    en='<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{EAEF2E00-F36A-4FF8-A1B1-C54B0096E415}" />'; 
                    fr='<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{EAEF2E00-F36A-4FF8-A1B1-C54B0096E415}" />'; 
                    de='<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{EAEF2E00-F36A-4FF8-A1B1-C54B0096E415}" />'; 
                }
            }
        );
        
        
        update-item-with-lang -Data $popupData -Item $rbcUnavailablePopup;
    }
    
    # Updateing my_booking page rendering
    $myBookingPage = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking";
    $attentionPopupRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $renderingPlaceholder = "/body/attention-popup-{5500AC44-5DF4-4473-8E8C-EA635A187882}-0";
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Room And Board Unavailable Popup";
    $params = @{ popupType = "NoRoomAndBoardAvailable"}
    
    Add-Or-Update-Page-Rendering -page $myBookingPage -renderingPath $attentionPopupRenderingPath  -renderingPlaceholder $renderingPlaceholder -dataSourcePath $dataSourcePath -params $params;
    Write-Host $myBookingPage.Name "Render was updated";
    
    
    
    
