  Hint: Script
  Value: |
    $amendPaymentItem = Get-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment" -ErrorAction SilentlyContinue;
    
    if ($amendPaymentItem -ne $null) {
        $amendPaymentItem.Editing.BeginEdit();
        
        $amendPaymentItem["PaymentAtcomErrorCTA"] = "Back to View Booking";
        $amendPaymentItem["PaymentErrorTitle"] = "CHANGE FAILED";
        $amendPaymentItem["PaymentErrorIcon"] = '<image mediaid="{A484212A-377A-4DC9-8754-BABFE7701E3D}" />';
        $amendPaymentItem["PaymentErrorDescription"] = "We've been unable to make this change to your flight.<br />If you have been charged, this will be refunded";
        $amendPaymentItem["PaymentErrorSubText"] = "Please call the call centre for additional support";
        $amendPaymentItem["PaymentErrorCTA"] = "Close";
        
        Write-Host $amendPaymentItem.Name "Updated"
        $amendPaymentItem.Editing.EndEdit() | Out-Null;
    }
