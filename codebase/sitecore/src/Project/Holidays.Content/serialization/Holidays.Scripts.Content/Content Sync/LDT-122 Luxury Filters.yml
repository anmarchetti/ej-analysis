DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    # Holidays Create Filter Option
    $itemsToCreate = @(
        @{
            Path        = "/sitecore/content/EasyJet/Holidays/Data/Promotion Collections/Luxury"
            TemplatePath = "Foundation/Destinations/Promotion Collections/Promotion Collection Item"
            Id          = [GUID]"{80937CD1-C13F-4A63-8674-867750FDEB1A}"
            Fields      = @{
                "ShowNewLabel" = @{
                    "en" = "1"
                }
                "Title" = @{
                    "en" = "Luxury collection"
                }
            }
        }
    )
    ImportContent -itemsToCreate $itemsToCreate
    
    # Trade create filter option
    $itemsToCreate = @(
            @{
                Path        = "/sitecore/content/EasyJet/TradePortal/Data/Promotion Collections/Luxury"
                TemplatePath = "Foundation/Destinations/Promotion Collections/Promotion Collection Item"
                Id          = [GUID]"{78380B08-5F48-425C-9D87-CF1B69064516}"
                Fields      = @{
                    "ShowNewLabel" = @{
                        "en" = "1"
                    }
                    "Title" = @{
                        "en" = "Luxury collection"
                    }
                }
            }
        )
    ImportContent -itemsToCreate $itemsToCreate
    
    # Add filter to the search results page for holidays and tradeportal and reorder hotel type to top
    $filterId = "{DE3CFE4D-364A-4393-8885-538F4F27FA2E}"
    $hotelTypeFilterId = "{1B59F944-1A5A-424B-BE50-C3B9A35FC7FE}"
    
    function Update-Page-Filters-Order ($page) {
    
    	if (!$page.Fields["Filters Order"].Value.Split("|").Contains($filterId)) {
    	    $currentFilters = $page.Fields["Filters Order"].Value;
    	    $currentFilters = $currentFilters.Replace("|$($hotelTypeFilterId)","")
    	    
    		$page.Editing.BeginEdit();
    		$page.Fields["Filters Order"].Value = "$($filterId)|$($hotelTypeFilterId)|$($currentFilters)";
    		$page.Editing.EndEdit() | Out-Null;
    	}
    }
    
    $mixedResultListPage = Get-Item -Path "master://sitecore/content/EasyJet/Holidays/Home/MixedResultList" -ErrorAction SilentlyContinue;
    $mixedResultListPageTrade = Get-Item -Path "master://sitecore/content/EasyJet/TradePortal/Home/MixedResultList" -ErrorAction SilentlyContinue;
    
    Update-Page-Filters-Order -Page $mixedResultListPage 
    Update-Page-Filters-Order -Page $mixedResultListPageTrade
    
    # Unpublish existing old luxury option filter for UK only
    $oldLuxury = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Facility Matrix Configuration/Luxury Holidays" -Language "en"
    $oldLuxury.Editing.BeginEdit();
    $oldLuxury.Fields["__Hide version"].Value = "1";
    $oldLuxury.Fields["__Display name"].Value = "Luxury - DEPRECATED IN UK MARKET"
    $oldLuxury.Editing.EndEdit() | Out-Null;
    
