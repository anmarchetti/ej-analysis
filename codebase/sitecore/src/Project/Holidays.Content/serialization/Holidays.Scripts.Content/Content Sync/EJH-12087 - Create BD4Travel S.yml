DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/BD4 Travel"
    $templateId = "{8D12F7C3-D5D1-4A12-8C81-EC3C3A1C46AF}"
    
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -eq $null){
        Write-Host "Creating item"
        
        $item = New-Item -Path $itemPath -ItemType $templateId
        
        $item.Editing.BeginEdit()
        $item.Fields["IsRecommendedActive"].Value = "1"
        $item.Fields["MinimumHotelsAvailable"].Value = 3
        $item.Fields["NumberOfRequestedHotelsBD4"].Value = 18
        $item.Fields["NumberOfRequestedHotelsAtcom"].Value = 9
        $item.Fields["IsSortActive"].Value = "1"
        $item.Editing.EndEdit()
    } else{
        Write-Host "Item already created"
    }
    
    Write-Host "Script is completed"
    
