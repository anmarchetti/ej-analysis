- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function createRecommendationHotelCarouselDataSource()
    {
    	$templateId = "{439330F2-BA2B-4D2D-9198-188D525F5877}"
    	$itemPath = "/Sitecore/content/EasyJet/Holidays/Data/Recommended Hotels Carousel Folder/Post Travel Page Recommended Hotels Carousel"
    	
    	$item = Get-Item -Path $itemPath  -ErrorAction SilentlyContinue
    	
    	if ($item -eq $null){
    	   Write-Host "Creating Post Travel Recommendation Hotel Carousel DataSource"
    	   
    	   New-Item -Path $itemPath -ItemType $templateId
    	} else {
    		Write-Host "Recommendation Post Travel Hotel CarouselDataSource already created"
    	}
    }
    
    function createRecommendationHotelCarouselDataSourceLanguageVersions() {
    	
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Data/Recommended Hotels Carousel Folder/Post Travel Page Recommended Hotels Carousel"
    	$item  = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    	if ($item -eq $null) {
    		Write-Host "Missing Post Travel Recommendation Hotel Carousel DataSource in EN language."
    		return;
    	}
    	
    	@('en') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Holidays we think you'll like"
    		Create-Lang-Version -Item $item -Lang $_ -Field "HoldBagText" -Value "x {number}kg hold bag included"
    		Create-Lang-Version -Item $item -Lang $_ -Field "DefaultBagText" -Value "x small under seat bag included"
    		Create-Lang-Version -Item $item -Lang $_ -Field "BD4PlacementId" -Value "ejh-reco-post-travel"
    	}
    
    	@('de-CH', 'de-DE') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Feiertage, die Ihnen gefallen werden"
    		Create-Lang-Version -Item $item -Lang $_ -Field "HoldBagText" -Value "x {number}kg inklusive Aufbewahrungsbeutel"
    		Create-Lang-Version -Item $item -Lang $_ -Field "DefaultBagText" -Value "x kleine Tasche unter dem Sitz enthalten"
    		Create-Lang-Version -Item $item -Lang $_ -Field "BD4PlacementId" -Value "ejh-reco-post-travel"
    	}
    
    	@('fr-CH', 'fr-FR') | % {
    		Create-Lang-Version -Item $item -Lang $_ -Field "Title" -Value "Des vacances que nous pensons vous plaire"
    		Create-Lang-Version -Item $item -Lang $_ -Field "HoldBagText" -Value "x {number}kg sac de rétention inclus"
    		Create-Lang-Version -Item $item -Lang $_ -Field "DefaultBagText" -Value "x petit sac sous le siège inclus"
    		Create-Lang-Version -Item $item -Lang $_ -Field "BD4PlacementId" -Value "ejh-reco-post-travel"
    	}
    	
    	Write-Host "Created language version for Recommendation Post Travel Hotel CarouselDataSource"
    }
    
    function createRenderingInPostTravelPage() {
    	$genericHotellRecommnedationId = "{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}"
        $pagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/post-travel';
    	$datasourcePath = '/Sitecore/content/EasyJet/Holidays/Data/Recommended Hotels Carousel Folder/Post Travel Page Recommended Hotels Carousel'
        $placeholder = "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
    	
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$genericHotelRecommnedationRendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $genericHotellRecommnedationId }
    	
    	if ($genericHotelRecommnedationRendering -ne $null) {
    	    Write-Host "Generic Hotel Recommnedation Rendering already exists"
    		return
    	}
    	
    	# Add Masonry Wrapper Item
    	$masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}" 
    	$masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    	$masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    	
    	Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder  -Parameter @{ "ItemOrderOnMobile" = "40" }
    	
    	# Get newly added rendering
    	$page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
    	$lastRendering = $renderings[-1]
    	
    	$hotelRecommnedationRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Generic Recommended Hotels"
    	$hotelRecommnedationRendering = Get-Item -Database "master" -Path $hotelRecommnedationRenderingPath |  New-Rendering -Placeholder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0"
    	
    	$parameters = @{ 
    	    "IsLeftAligned" = "1" 
    	    "IsNarrowContainer"= "1" 
    	    "OpenLinksInNewTab"= "1" 
    	}
    	
    	Add-Rendering -Item $page -Instance $hotelRecommnedationRendering -PlaceHolder "$($placeholder)/masonry-item-$($lastRendering.UniqueId)-0" -DataSource $datasourcePath -Parameter $parameters
    	
    	Write-Host "Added Generic Hotel Recommnedation Rendering to Post Travel Page"
    }
    
    createRecommendationHotelCarouselDataSource
    createRecommendationHotelCarouselDataSourceLanguageVersions
    createRenderingInPostTravelPage
