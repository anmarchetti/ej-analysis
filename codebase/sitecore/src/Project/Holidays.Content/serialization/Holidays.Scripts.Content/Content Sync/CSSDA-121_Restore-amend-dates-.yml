SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendSettingsItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Amend Booking Settings";
    
    if ($amendSettingsItem -ne $null) {
    	$amendSettingsItem.Editing.BeginEdit();
    	
    	$amendSettingsItem["ChangeDatesThresholdHours"] = 672;
    	$amendSettingsItem["AmendChangeDateCount"] = 1;
    	
    	Write-Host $amendSettingsItem.Name "Updated";
        $amendSettingsItem.Editing.EndEdit() | Out-Null;
    }
