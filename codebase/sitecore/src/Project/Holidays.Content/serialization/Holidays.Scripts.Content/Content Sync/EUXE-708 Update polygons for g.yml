    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit()
        }
    }
    
    function update-airport-coordinates {
        param(
            [hashtable]$airports
        )
    
        foreach ($country in $airports.Keys) {
            foreach ($airport in $airports[$country].Keys) {
                $latitude = $airports[$country][$airport]["latitude"]
                $longitude = $airports[$country][$airport]["longitude"]
                
                $airportPath = $AirportsBasePath + $country + "/" + $airport
                $airportItem = Get-Item -Path $airportPath
                
                @('en') | % {
                    Create-Lang-Version -Item $airportItem -Lang $_ -Field "Latitude" -Value $latitude
                    Create-Lang-Version -Item $airportItem -Lang $_ -Field "Longitude" -Value $longitude
                }
                
                Write-Host "Item" $airport "successfully updated"
            }
        }
    }
    
