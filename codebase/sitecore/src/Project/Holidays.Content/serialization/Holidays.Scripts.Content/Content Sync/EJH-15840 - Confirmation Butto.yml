Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15840 - Confirmation Button - set benefits icons"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $benefits = @(
    	@{
    		'Icon' = '<image mediaid="{0CB9F279-EC44-4D6C-A1C8-E17E1D0B8CCD}" />'
    		'Path' = "/sitecore/content/EasyJet/Holidays/Data/Benefits/B0001 - One small cabin bag"
    		'Name' = "Small under seat bag"
    	},
    	@{
    		'Icon' = '<image mediaid="{17F764BB-A129-4E04-AA4F-9AB6E5A763C6}" />'
    		'Path' = "/sitecore/content/EasyJet/Holidays/Data/Benefits/B0002 - One large cabin bag"
    		'Name' = "Large overhead bag"
    	},
    	@{
    		'Icon' = '<image mediaid="{17F764BB-A129-4E04-AA4F-9AB6E5A763C6}" />'
    		'Path' = "/sitecore/content/EasyJet/Holidays/Data/Benefits/B0003 - One large cabin bag"
    		'Name' = "Large overhead bag"
    	}
    );
    
    foreach ($benefit in $benefits) {
    	$item = Get-Item -Path $benefit.Path -ErrorAction SilentlyContinue
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Icon"] = $benefit.Icon
    		$item["Name"] = $benefit.Name
    		$item.Editing.EndEdit()
    	}
    }
    
    $smallCabinBagPath = "/sitecore/content/EasyJet/Holidays/Data/Benefits/B0001 - One small cabin bag"
    $smallCabinBag = Get-Item -Path $smallCabinBagPath -ErrorAction SilentlyContinue
    $sbPath = "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags"
    $sbItem = Get-Item -Path $sbPath -ErrorAction SilentlyContinue
    
    if ($smallCabinBag -ne $null -and $sbItem -ne $null) {
    	$sbItem.Editing.BeginEdit()
    	$sbItem["FallbackBenefit"] = $smallCabinBag.ID
    	$sbItem.Editing.EndEdit()
    } 
