    function Create-Pandemic-Levels () {
    	$pandemicSettings = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Pandemic Levels" -ErrorAction SilentlyContinue
    
    	if ($pandemicSettings -ne $null) {
    		foreach ($level in $pandemicLevelsList) {
    			$levelItem = Get-Or-Create-Item -Path $pandemicSettings.FullPath -ItemName $level.Name -TemplateId "{022A24BB-9A3A-4271-8EC4-4C09E55E27CE}"
    			$levelItem.Editing.BeginEdit()
    			$levelItem["Name"] = $level.Name
    			$levelItem["Level"] = $level.Level
    			$levelItem["Icon"] = $level.Icon
    			$levelItem.__SortOrder = $level.SortOrder
    			$levelItem.Editing.EndEdit() | Out-Null
    		}
    	}
    }
    
    function Create-Pandemic-Levels-Banners () {
    	$bannersFolder = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data" -ItemName "Pandemic Levels Banners" -TemplateId "{B8B092EC-0EA5-4B08-8BEC-CD1DF7D6C32A}" -ForceId "{6DD4D64B-5988-41E5-836A-A238776F4D5C}"
    
    	foreach ($banner in $pandemicLevelsBannersList) {
    		$bannerItem = Get-Or-Create-Item -Path $bannersFolder.FullPath -ItemName $banner.Name -TemplateId "{9E12F886-E62F-4E86-8295-A2091E3D2F1E}"
    		$bannerItem.Editing.BeginEdit()
    		$bannerItem["Name"] = $banner.Name
    		$bannerItem["Title"] = $banner.Title
    		$bannerItem["Level"] = $banner.Level
    		$bannerItem.__SortOrder = $banner.SortOrder
    		$bannerItem.Editing.EndEdit() | Out-Null
    	}
    	
    	return $bannersFolder
    }
    
    function Set-Pandemic-Banner-Rendering ($dataSource){
        $pandemicLevelBannerRenderingId = "{1DED9C91-5753-4C0A-917B-B44AF0E57DB1}"
        
        # Add Rendering to Home Page
        $homePageItem = Get-Item -Path "master://sitecore/content/EasyJet/Holidays/Home"
        $homePageBannerRendering = Get-Rendering -Item $homePageItem | Where-Object { $_.ItemId -eq $pandemicLevelBannerRenderingId } | Select -First 1
        
        if($homePageBannerRendering -eq $null) {
            # Get index of SearchPod and insert banner before SearchPod
            $renderingIndex = Get-Rendering-Index -Item $homePageItem -renderingItemId "{216FE85C-936E-4135-894B-E7DE8BF8A4C2}"
            $homePageBannerRendering = Get-Item -Database "master" -Path $pandemicLevelBannerRenderingId | New-Rendering
            Add-Rendering -Item $homePageItem -Instance $homePageBannerRendering -Index $renderingIndex -DataSource $dataSource -Placeholder '/header'
        }
    }
    
    
    Create-Pandemic-Levels
    $bannersFolder = Create-Pandemic-Levels-Banners
    Set-Pandemic-Banner-Rendering -DataSource $bannersFolder.ID
    
    
    
    
    
    
    
