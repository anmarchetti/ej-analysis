    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatAndBags = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}"
    if ($seatAndBags -ne $null){
        $seatAndBags.Editing.BeginEdit()
        $seatAndBags["Title"] = "Your seats and bags"
        $seatAndBags["InfoLink"] = '<link text="More info About Luggage" linktype="external" url="https://www.easyjet.com/en/holidays/help?helpCategory=luggage" anchor="" target="" rel="" />'
