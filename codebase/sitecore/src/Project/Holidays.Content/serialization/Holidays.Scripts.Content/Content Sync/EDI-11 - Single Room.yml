- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Dictionary($itemPath, $value) {
        	$item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        
        	if ($item -ne $null) {
        		$item.Editing.BeginEdit()
        		$item["Phrase"] = $value
        		$item.Editing.EndEdit() | Out-Null
        
        		Write-Host "Dictionary" $item.DisplayName "successfully updated"
        	}
        }
        
    Update-Dictionary -ItemPath '/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Buttons/Show More' -Value "See alternative rooms"
    Update-Dictionary -ItemPath '/sitecore/content/EasyJet/Holidays/Dictionary/Room Types/Buttons/Show Less' -Value "Hide alternative rooms"
