Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15424 Add Price Limit setting for holidays site"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $settingsFolderPath = "/sitecore/content/EasyJet/Holidays/Settings"
    
    $priceLimitSettingsTemplateId = "{A9CD46EA-FBA6-40C9-A2BA-FC32886DE90B}"
    $priceLimitSettingsItemName = "Price Limit Settings"
    
    $item = Get-Item -Path "$($settingsFolderPath)/$($priceLimitSettingsItemName)" -ErrorAction SilentlyContinue
    
    if ($item -eq $null) {
    	$item = New-Item -Path $settingsFolderPath -Name $priceLimitSettingsItemName -ItemType $priceLimitSettingsTemplateId
    
    	$item.Editing.BeginEdit()
    	$item["MaxPrice"] = "5000"
    	$item["MinPrice"] = "100"
    	$item["IsPricePerPerson"] = "1"
    	$item.Editing.EndEdit() | Out-Null;
    }
    
    Write-Host $item.Name "Price Limit Settings creation finished"; 
