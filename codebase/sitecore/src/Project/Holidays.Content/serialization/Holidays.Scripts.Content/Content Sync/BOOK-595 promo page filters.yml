Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/BOOK-595 promo page filters"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $tradeRoot = "/sitecore/content/EasyJet/TradePortal/Home/Root"
    $holidaysRoot = "/sitecore/content/EasyJet/Holidays/Home/Root"
    $requestedSearchesRoot = "/sitecore/content/EasyJet/Holidays/Data/Requested Searches"
    $baseFiltersTemplateId = [Sitecore.Data.ID]::Parse("{C48F0878-9D0F-4C83-86CB-D655445406A0}");
    
    filter Where-InheritsTemplate {
        param(
            [Parameter(Mandatory = $true,ValueFromPipeline = $true)]
            [Sitecore.Data.Items.Item]$item
        )
        if ($item) {
            $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($item)
            if ($itemTemplate -ne $null -and $itemTemplate.DescendsFromOrEquals($baseFiltersTemplateId)) {
                $Item
            }
        }
    }
    
    # remap current setup for new fields
    function update-promo-pages($lang, $isTrade) {
        $root = $holidaysRoot
        $promos = @()
        if ($isTrade) {
            $root = $tradeRoot
        } else {
            $promos += gci -path $requestedSearchesRoot -language $lang -recurse | Where-InheritsTemplate
        }
        
        $promos += gci -path $root -language $lang -recurse | Where-InheritsTemplate
        
        $promos | % {
            $promo = $_
            
            $pageHolidayTypeTheme = $promo['PagePackageTheme']
            $preselectHolidayTypeTheme = $promo['PreSelectedPackageTheme']
            
            $isTheme = $false
            $isPreselected = $false
            $theme = $null
            
            if ($preselectHolidayTypeTheme) {
                $theme = gi -path "master:" -ID $preselectHolidayTypeTheme
                
                if ($theme.TemplateName -eq 'Hotel Theme') {
                    $isTheme = $true
                }
                $isPreselected = $true
            } elseif ($pageHolidayTypeTheme) {
                $theme = gi -path "master:" -ID $pageHolidayTypeTheme
                
                if ($theme.TemplateName -eq 'Hotel Theme') {
                    $isTheme = $true
                }
            }
            
            if ($theme -ne $null) {
                $promo.Editing.BeginEdit()
                if ($isTheme) {
                    $promo['HolidayThemes'] = $theme.ID
                    
                    if ($isPreselected) {
                        $promo['ShowSelectedHolidayThemesInFilters'] = 1
                    }
                } elseif ($theme.TemplateName -eq 'Type') {
                    $promo['HolidayTypes'] = $theme.ID
                    
                    if ($isPreselected) {
                        $promo['ShowSelectedHolidayTypesInFilters'] = 1
                    }
                }
                $promo.Editing.EndEdit() | Out-Null
                "Updated: " + $promo.Name + " in " + $lang
            }
        }
    }
    
    "Holidays: "
    @('en', 'fr-CH', 'fr-FR', 'de-CH', 'de-DE') | % {
        update-promo-pages -lang $_
    }
    
    "Trade: "
    update-promo-pages -lang "en" -isTrade true
