SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Special Request Settings" -ErrorAction SilentlyContinue;
    
    if ($item -ne $null) {
    	$item.Editing.BeginEdit();
    	$item["IsEligibleToAddSSRForDC"] = '1';
    	$item["IsEligibleToAddSSRForHBG"] = '';
    	$item["IsEligibleToAmendSSRForDC"] = '1';
    	$item["IsEligibleToAmendSSRForHBG"] = '';
    	$item.Editing.EndEdit() | Out-Null;
    
    	Write-Host "Settings updated";
    }
    
    
