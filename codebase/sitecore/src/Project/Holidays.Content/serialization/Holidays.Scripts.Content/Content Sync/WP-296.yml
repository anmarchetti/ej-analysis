- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $formItemPath = 'master:/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form'
    $easyJetDropdownOptionPath = 'master:/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Contact Us Questions Folder/easyJet'
    $languages = @('en', 'de-DE', 'de-CH', 'es-ES', 'fr-CH', 'fr-FR', 'it-IT', 'nl-NL')
    
    foreach ($language in $languages) {
        $formItem = Get-Item -path $formItemPath -Language $language -ErrorAction SilentlyContinue
        $dropDownOptionItem = Get-Item -path $easyJetDropdownOptionPath -Language $language -ErrorAction SilentlyContinue
        if (($formItem -ne $null) -and ($dropDownOptionItem -ne $null)) {
            $selectedQuestionsString = $formItem.Fields["QuestionList"].Value
            if($selectedQuestionsString -ne '') {
                $selectedQuestions = $selectedQuestionsString.Split('|')
                $new = $selectedQuestions | Where-Object { $_ –ne  $dropDownOptionItem.ID}
                $newSelectionString = [system.String]::Join("|", $new)
                
                if($newSelectionString -ne $selectedQuestionsString) {
                    $formItem.Editing.BeginEdit()
                    $formItem.Fields["QuestionList"].Value = $newSelectionString
                    Write-Host $formItem.Name "updated in language:" $language
                    $formItem.Editing.EndEdit() | Out-Null
                }
            }
        }
    }
