- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $translations = @{
    	"fr-CH" = @{
    		"Phrase" = "Modifier vos dates"
    	}
    	"fr-FR" = @{
    		"Phrase" = "Modifier vos dates"
    	}
    	"de-CH" = @{
    		"Phrase" = "Ändern Sie Ihre Daten"
    	}
    	"de-DE" = @{
    		"Phrase" = "Ändern Sie Ihre Daten"
    	}
    }
    
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Write-Host "Adding language version for item: $($item.Paths.FullPath) in language: $lang"
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	}
    
    	if ($null -ne $field -and $null -ne $targetLangItem) {
    		Write-Host "Editing item: $($item.Paths.FullPath) in language: $lang"
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Dictionary/Amend Dates/Labels/Edit Dates"
    $dataSourceItem = Get-Item -Path $dataSourcePath -ErrorAction SilentlyContinue;
    
    if ($dataSourceItem -ne $null) {
    	foreach ($lang in $translations.Keys) {
    		create-lang-version -Item $dataSourceItem -lang $lang -field "Phrase" -Value $translations[$lang]["Phrase"]
    
    		Write-Host "Translations added"
    	}
    }
    
    Write-Host "Button labels updated on Holidays"
    
