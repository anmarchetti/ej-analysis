- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $translationPath = 'master:/sitecore/content/EasyJet/Holidays/Data/Compare Price Modules/Price Graph and Calendar Module'
    
    function updateTranslation($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    updateTranslation -itemPath $translationPath -language 'fr-FR' -key 'ReservationNotificationDescription' -translation "Les prix des vols alternatifs indiqués ci-dessous ne comprennent pas les grands bagages en cabine, les bagages en soute ou les sièges que vous avez réservés pour une valeur de {price}. Si vous changez de vol, vous devrez à nouveau choisir ces suppléments."
    updateTranslation -itemPath $translationPath -language 'fr-CH' -key 'ReservationNotificationDescription' -translation "Les prix des vols alternatifs indiqués ci-dessous ne comprennent pas les grands bagages en cabine, les bagages en soute ou les sièges que vous avez réservés pour une valeur de {price}. Si vous changez de vol, vous devrez à nouveau choisir ces suppléments."
