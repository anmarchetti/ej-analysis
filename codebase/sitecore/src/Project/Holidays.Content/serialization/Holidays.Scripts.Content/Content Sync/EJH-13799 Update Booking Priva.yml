Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13799 Update Booking Privacy"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    $bookingPrivacyPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Booking Privacy"
    $bookingPrivacyTemplateId = "{7B8BAEF3-4583-4DCF-B8B1-28E35794D626}"
    $bookingPrivacy = Get-Or-Create-Item -Path $bookingPrivacyPath -TemplateId $bookingPrivacyTemplateId
    $bookingPrivacyRenderingId = "{cc4d8814-64a1-4ff5-a90a-85c8a91ab66a}"
    
    $bookingPrivacy.Editing.BeginEdit()
    $bookingPrivacy["Heading"] = 'Keeping you in control of your booking information';
    $bookingPrivacy["Title"] = 'Read only access';
    $bookingPrivacy["Description"] = "When you make a booking, you can access your holiday details in two ways. You can log in to your personal account with your email address and password, so you can view or amend your booking. Or, you and any other person registered on your booking can access a 'read only' view of your booking by entering your booking reference, departure date and last name of the lead passenger through our 'View my booking' option.<br/><br/>If you want to block 'read only' access so no one else on your booking can access it, simply turn OFF 'read only' access using the switch below. You can turn this ON again at any time if you change your mind. The setting you choose will only apply to this booking, unless you change the setting on your other booking(s).";
    $bookingPrivacy["CheckboxLabelLeft"] = 'ON';
    $bookingPrivacy["CheckboxLabelRight"] = 'OFF';
    $bookingPrivacy.Editing.EndEdit() | Out-Null
    	
    Write-Host "Script executed";
