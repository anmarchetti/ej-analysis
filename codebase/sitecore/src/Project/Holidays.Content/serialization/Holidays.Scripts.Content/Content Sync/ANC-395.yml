  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template, $name){
        $itemPath = "$path/$name"
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $itemPath -ItemType $template
        }
        
        return $item
    }
    
    function Setup-Seasons($project){
        $data = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/$project/Data/Ancillaries" -Template '{9A07E137-8BD4-4845-9175-14FA742954A3}' -Name "Sport Equipment Restricted Seasons"
        
        $seasonTemplate = '{414C4E8F-DEC0-4B03-A13E-40EB2858B610}'
        $path = "/sitecore/content/EasyJet/$project/Data/Ancillaries/Sport Equipment Restricted Seasons"
        $firstSeasonID = ''
        
        for (($i = 1); $i -lt 5; $i++)
            {
                $season = Get-Or-Create-Item -Path $path -Template $seasonTemplate -Name "Season $i"
                
                if(($season -ne $null) -and ($i -eq 1)) {
                    $season.Editing.BeginEdit()
                    $season['StartDate'] = '20240901T000000Z'
                    $season['EndDate'] = '20241130T000000Z'
                    $season.Editing.EndEdit() | Out-Null
                    
                    $firstSeasonID = $season.ID
                }
                
                Write-Host "Season $i created under Extra Luggage Lists on $project"
            }
        
        if($data -ne $null) {
            $data.Editing.BeginEdit()
            $data['RestrictionSeasonsList'] = $firstSeasonID
            $data.Editing.EndEdit() | Out-Null
            
            Write-Host "First season date set on $project"
        }
    }
    
    function Remove-Old-Configuration($project){
        $path = "/sitecore/content/EasyJet/$project/Data/Ancillaries/Extra Luggage Lists"
        Get-ChildItem -Path $path | Remove-Item -Permanently 
    }
    
    function Set-Value-To-Data($project){
        $data = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/$project/Data/Ancillaries" -Template '{9A07E137-8BD4-4845-9175-14FA742954A3}' -Name "Sport Equipment Restricted Seasons"
        
        $holdLug = Get-Item -Path "/sitecore/content/EasyJet/$project/Data/Ancillaries/Hold Luggage" -ErrorAction SilentlyContinue
        $list = Get-Item -Path "/sitecore/content/EasyJet/$project/Data/Ancillaries/Extra Luggage Lists" -ErrorAction SilentlyContinue
        
        if($holdLug -ne $null) {
            $holdLug.Editing.BeginEdit()
            $holdLug['SportEquipmentRestrictedSeasons'] = $data.ID
            $holdLug.Editing.EndEdit() | Out-Null
            
            Write-Host "First season date set on $project"
        }
        
        if($list -ne $null) {
            $list.Editing.BeginEdit()
            $list['SportEquipmentRestrictedSeasons'] = $data.ID
            $list.Editing.EndEdit() | Out-Null
            
            Write-Host "First season date set on $project"
        }
    }
    
    Setup-Seasons -Project 'Holidays'
    Setup-Seasons -Project 'TradePortal'
    
    Remove-Old-Configuration  -Project 'Holidays'
    Remove-Old-Configuration -Project 'TradePortal'
    
    Set-Value-To-Data -Project 'Holidays'
    Set-Value-To-Data -Project 'TradePortal'
    
