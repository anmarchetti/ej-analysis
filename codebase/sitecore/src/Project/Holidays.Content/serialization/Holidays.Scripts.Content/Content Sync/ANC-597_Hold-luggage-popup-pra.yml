  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
            $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
             if ($item -eq $null) {
                    $item = New-Item -Path $path -ItemType $templateId
                    Write-Host "Item" $item.Name "successfully created";
             }
             return $item
        }
        
        function Add-Datasource ($path){
            $holdLuggagePopupData =  Get-Or-Create-Item -path $path -templateId "{6EF73B24-21E2-4091-9CBD-BEBC57953B66}"
            if ($holdLuggagePopupData -ne $null) {
                $holdLuggagePopupData.Editing.BeginEdit()
                $holdLuggagePopupData["PramTitle"] =  'Pram or pushchair';
                $holdLuggagePopupData["PramDescription"] =  '{number} included with holiday package';
                $holdLuggagePopupData["PramIcon"] =  '<image mediaid="{B7DFB1A3-F9E4-48D0-868F-53AE33B3B347}" />';
                $holdLuggagePopupData.Editing.EndEdit() | Out-Null
            }
        }
        
        # Holidays
        
        $pagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking';
            
        Add-Datasource -path $pagePath
        
        # Trade
        
        $pagePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking'
            
        Add-Datasource -path $pagePath
