Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14276 Search Results Flights Departure Time Filter"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod Filters/Titles"
    
    $dictionaries = @(
    	@{
    		key = "FilterTypes.Labels.FlightTimes";
    		phrase = "Flight Times";
    	},
    	@{
    		key = "SearchPodFilters.Titles.InboundDepartureTimeSubtitle";
    		phrase = "Return";
    	},
    	@{
    		key = "SearchPodFilters.Titles.OutboundDepartureTimeSubtitle";
    		phrase = "Departure";
    	},
    	@{
    		key = "SearchPodFilters.Titles.DepartureTimeFilter";
    		phrase = "Select your preferred time slot";
    	}
    )
    
    foreach ($dictionary in $dictionaries) {
    	$item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$($dictionary.key)']"
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Phrase"] = $dictionary.phrase
    		$item.Editing.EndEdit() | Out-Null
    
    		Write-Host "Item" $item.Name "successfully updated"
    	}
    }
    
