  Hint: Script
  Value: |
    $item = Get-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment" -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["AmendTitleReminder"] = "Your updated holiday balance";
        $item["AmendRefundDescriptionReminder"] = "We will remove the refund amount from your holiday balance, Please confirm your changes.";
        $item["AmendRefundCreditsOnlyDescriptionReminder"] = "<p>Because you paid for your holiday with credit, we will refund your easyJet account immediately with {amount} to spend within <strong>12 months</strong> on another easyJet holiday.</p>";
        $item["AmendRefundCreditsOnlyTitleReminder"] = "Refund to holiday credit";
        $item["AmendZeroPriceDescriptionReminder"] = "<p>There is no additional charge to your holiday balance, which is due on {date}.</p>";
        
        Write-Host "Item" "Finished";
        $item.Editing.EndEdit() | Out-Null
    }
