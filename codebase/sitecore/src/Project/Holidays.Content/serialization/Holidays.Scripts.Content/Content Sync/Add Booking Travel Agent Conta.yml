Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Add Booking Travel Agent Contacts Rendering
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Data/Need Help Blocks/Travel Agent Contacts"
    $templateId = "{9656EE77-D3BB-4519-963E-BA216ABD7C24}"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    # Create 'Travel Agent Contacts'
    if ($item -eq $null) {
        $item = New-Item -Path $itemPath -ItemType $templateId
    
        $item.Editing.BeginEdit()
        $item["Title"] = "Need help with your booking?"
        $item["ContactNote"] = "Get in touch with your travel agent for more information."
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully created"
    }
    
    # Add Rendering to My Booking Page
    $myBookingPageItem = Get-Item -Path "master:/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $placeholder = "/body/component-wrapper-inner-{b256b26a-da9c-4195-b68a-bc4ed53685e3}-0/travel-agent-contacts-{5500ac44-5df4-4473-8e8c-ea635a187882}-0"
    $renderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Need Help Block"
    $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholder
    Add-Rendering -Item $myBookingPageItem -PlaceHolder $placeholder -Instance $renderingItem -Datasource $itemPath
    Write-Host  $myBookingPageItem.Name "Rrendering successfully added" 
    
    
    
    
        
