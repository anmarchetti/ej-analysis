Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13273 Swap Resort Info with Hotel Location on Hotel Details Page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Rendering-Index ($item,$renderingItemId) {
    	$i = 0
    	Get-Rendering -Item $item | ForEach-Object {
    		if ($_.ItemID -eq $renderingItemId) {
    			return $i
    		}
    		$i++
    	}
    }
    
    $hotelDetailsPath = "master:/sitecore/content/EasyJet/Holidays/Home/Hotel Details"
    $pageItem = Get-Item -Path $hotelDetailsPath
    
    $resortInfoRenderingId = "{ECB6DA05-21A2-490B-80CD-439A652F8EF3}"
    $resortInfoRenderingIndex = Get-Rendering-Index -Item $pageItem -RenderingItemId $resortInfoRenderingId
    $resortInfoRendering = Get-Rendering -Item $pageItem | Where-Object { $_.ItemID -eq $resortInfoRenderingId }
    
    if ($pageItem -ne $null) {
    
    	$hotelLocationRenderingId = "{40F87A5B-8104-4E37-9EF1-6710BDF90C36}"
    	$hotelLocationRenderingIndex = Get-Rendering-Index -Item $pageItem -RenderingItemId $hotelLocationRenderingId
    	$hotelLocationRendering = Get-Rendering -Item $pageItem | Where-Object { $_.ItemID -eq $hotelLocationRenderingId }
    
    	if ($resortInfoRendering -ne $null -and $hotelLocationRendering -ne $null) {
    		Set-Rendering -Item $pageItem -Instance $resortInfoRendering -Index $hotelLocationRenderingIndex -FinalLayout
    		Write-Host "Hotel Location Rendering swapped places with Resort Info Rendering"
    	}
    } 
