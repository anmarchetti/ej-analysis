    $airportsFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Airports"
    $airportTemplateId = "{9B7D85B4-E5CF-42E7-B533-B20FB55EC18D}"
    
    function Set-Airport-Coordinates($path){
        $item = Get-Item -Path $path
        if($item -ne $null){
            if($item.TemplateId -eq $airportTemplateId)
            {
                $coord = $coordinates[$item.Fields["Code"].value]
                if ($coord -ne $null)
                {
                    $item.Editing.BeginEdit()
                    $item.Fields["Longitude"].Value = $coord.Longitude;
                    $item.Fields["Latitude"].Value = $coord.Latitude;
                    $item.Editing.EndEdit()
                    $item.Name
                }
            }
            $items = Get-ChildItem -Path $path
            foreach($childItem in $items){
                Set-Airport-Coordinates -Path $childItem.FullPath
            }
        }
    }
    
    Set-Airport-Coordinates -Path $airportsFolderPath
