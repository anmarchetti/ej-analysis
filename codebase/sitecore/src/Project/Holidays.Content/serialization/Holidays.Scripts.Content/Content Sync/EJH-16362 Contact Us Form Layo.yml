    $testSpeakWithUs.Editing.BeginEdit()
    $testSpeakWithUs["Description"] = '<p><strong>Speak to the easyJet holidays team</strong></p><p>The easyJet holidays team can only help customers who''ve booked a complete package holiday with easyJet holidays (a booking with easyJet holidays that includes flight, hotel, luggage etc.). If you''ve just booked a flight with easyJet, please visit the flight only <a href="https://www.easyjet.com/en/help/contact">contact us page</a>.</p><p>If you need to speak to us about a complete package holiday with easyJet holidays (and not a flight only booking with easyJet), you can get in touch with our team on <a href="tel:03305515160">0330 551 5160</a> (or <a href="tel:+443305515160">+44330 551 5160</a> if you''re currently on holiday). Our team are available from Monday to Sunday, 8am - 8pm. Calls cost a standard rate. Calls from mobile or other networks may vary.</p>'
