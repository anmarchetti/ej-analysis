    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    function Get-Rendering-Index ($item, $renderingItemId) {
        $i = 0
        Get-Rendering -Item $item | ForEach-Object {
            if ($_.ItemID -eq $renderingItemId) {
                return $i
            }
            $i++
        }
    }
    
    function Get-All-Renderings-From-Item($actPage, $renderingId){
         $result = @()
         $allRenderings = Get-Rendering -Item $actPage
         foreach($actRendering in $allRenderings){
             if($actRendering.ItemId -eq $renderingId){
                 $result += $actRendering
             }
         }
         return $result
    }
    
    function Remove-Renderings-From-Item($actPage, $renderingId){
         $allRenderings = Get-Rendering -Item $actPage
         $index = Get-Rendering-Index $actPage $renderingId
         if($index -ne $null){
             Remove-Rendering -Item $actPage -Instance $allRenderings[$index]
         }
    }
    
    function Add-Rendering-And-Remove-Duplicates($page, $placeholderPath, $renderingPath, $renderingId, $dataSourcePath){
        $renderings = Get-All-Renderings-From-Item $page $renderingId
        
        if($renderings.Count -gt 1){
            Write-Host "multiple renderings found - rendering variable is array"
            Write-Host "Updated one existing rendering for $($page.Name) page and removed all other"
            Set-Rendering -Item $page -Instance $renderings[0] -DataSource $dataSourcePath -Placeholder $placeholderPath
            for ($i=1; $i -lt $renderings.Count; $i++){
                Remove-Rendering -Item $page -Instance $renderings[$i]
            }
        }else{
            if($renderings.Count -eq 1)
            {
                Set-Rendering -Item $page -Instance $renderings -DataSource $dataSourcePath -Placeholder $placeholderPath
                Write-Host "Updated existing rendering for $($page.Name) page"
            }else{
                $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholderPath
                Add-Rendering -Item $page -Instance $renderingItem -DataSource $dataSourcePath -Placeholder $placeholderPath
                Write-Host "Created new rendering for $($page.Name) page"
            }
        }
    }
    
