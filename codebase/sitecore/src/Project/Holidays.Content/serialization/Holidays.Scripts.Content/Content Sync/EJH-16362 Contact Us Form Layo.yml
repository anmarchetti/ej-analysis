    function Add-Promo-Block($itemName, $title, $description, $linkValue){
        $promoBlockItem = Get-Or-Create-Item "$promoBlocksDataSource/$itemName" $promoBlockTemplateId
        $promoBlockItem.Editing.BeginEdit()
        $promoBlockItem["Title"] = $title
        $promoBlockItem["Description"] = $description
        $promoBlockItem["Link"] = $linkValue
        $promoBlockItem.Editing.EndEdit()
    }
    
