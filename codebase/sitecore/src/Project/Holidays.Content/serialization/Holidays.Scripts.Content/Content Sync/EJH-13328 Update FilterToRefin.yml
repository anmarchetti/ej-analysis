  Hint: Script
  Value: |
    $branchSelectedFilters = Get-Item -Path "/sitecore/templates/Branches/Project/Holidays/Website/`$name/Dictionary Domain/Search Pod Filters/Labels/Filter To Refine Your Results" -ErrorAction SilentlyContinue
    $contentSelectedFilters = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod Filters/Labels/Filter To Refine Your Results" -ErrorAction SilentlyContinue
    
    function Get-Dictionary($items)
    {
        $dictionary = New-Object "System.Collections.Generic.Dictionary``2[System.String,Item]"
        foreach ($item in $items)
        {
            $dictionary.Add($item.Name, $item)
        }
        return $dictionary
    }
    
    function To-New-Key($sourceItems,$targetItems)
    {
        if($sourceItems -ne $null -AND $targetItems -ne $null)
        {
            $targetItems.GetEnumerator() | ForEach-Object{
                $newkey = $sourceItems[$_.key].Fields["Key"].value
                $_.value.Editing.BeginEdit()
                $_.value.Fields["Key"].value = $newkey
                $_.value.Editing.EndEdit() > $null
            }
        }
    }
    
    $sourceToolTipsItems = Get-Dictionary -Items @($branchSelectedFilters)
    $targetToolTipsItems = Get-Dictionary -Items @($contentSelectedFilters)
    
    To-New-Key -SourceItems $sourceToolTipsItems -TargetItems $targetToolTipsItems
