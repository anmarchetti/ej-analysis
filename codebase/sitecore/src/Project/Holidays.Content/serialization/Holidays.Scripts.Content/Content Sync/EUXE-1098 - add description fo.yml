  Hint: Script
  Value: |
    function Update-Tag ($path,$itemName,$desc) {
    	$tag = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($tag -ne $null)
    	{
    		$tag.Editing.BeginEdit()
    		$tag["Description"] = $desc
    		$tag.Editing.EndEdit() | Out-Null
    		Write-Host "Update tag" $tag.Name
    	}
    }
    
