SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $hotelDetailsPath = "/sitecore/content/EasyJet/Holidays/Home/Hotel Details"
    $tabContentPath = "/sitecore/content/EasyJet/Holidays/Home/Hotel Details/Page Components/Tab Links"
    $tabRenderingId = '{D43D1B92-A2CD-4F51-920B-4BDB7066B9CD}'
    
    $hotelDetailsItem = Get-Item -path $hotelDetailsPath
    
    $renderings = Get-Rendering -Item $hotelDetailsItem
    $renderingToDelete = $renderings | Where-Object { $_.ItemId -eq $tabRenderingId }
    if($renderingToDelete -ne $null){
        Remove-Rendering -Item $hotelDetailsItem -Instance $renderingToDelete
    }
    
    Get-Item -Path $tabContentPath | Remove-Item -Recurse
    
    #trade portal
    $hotelDetailsPathTrade = "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details"
    $tabContentPathTrade = "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details/Page Components/Tab Links"
    
    $hotelDetailsItemTrade = Get-Item -path $hotelDetailsPathTrade
    
    $renderingsTrade = Get-Rendering -Item $hotelDetailsItemTrade
    $renderingToDeleteTrade = $renderingsTrade | Where-Object { $_.ItemId -eq $tabRenderingId }
    if($renderingToDeleteTrade -ne $null){
        Remove-Rendering -Item $hotelDetailsItemTrade -Instance $renderingToDeleteTrade
    }
    
    Get-Item -Path $tabContentPathTrade | Remove-Item -Recurse
