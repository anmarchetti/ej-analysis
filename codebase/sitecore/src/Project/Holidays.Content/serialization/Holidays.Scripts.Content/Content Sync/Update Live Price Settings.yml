Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Live Price Settings
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "master:/content/EasyJet/Holidays/Settings/Live Price Settings"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["IsLivePriceEnabled"] = '1';
        
        $item.Editing.EndEdit() | Out-Null;
        
        Write-Host "Item" $item.Name "successfully updated";
    }
    
