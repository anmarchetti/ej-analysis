- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
        $page = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking"
        
        # Set datasource for Seats Map
        $dataSourcePath = "/sitecore/content/EasyJet/TradePortal/Data/SeatsMap"
        $rendering = $page | Get-Rendering -Placeholder "*seat-map*" -Device (Get-LayoutDevice "Default")
        
        if($rendering -ne $null)
        {
            Set-Rendering -Item $page -Instance $rendering -DataSource $dataSourcePath
        }
        
        # Set datasource for Seat And Bags
        $dataSourcePath = "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags"
        $rendering = $page | Get-Rendering -Placeholder "*seats-and-bags*" -Device (Get-LayoutDevice "Default") | Where-Object { $_.ItemId -eq "{7910DC7C-14B7-48F1-9256-C570F700F085}" } | Select -First 1
        
        if($rendering -ne $null)
        {
            Set-Rendering -Item $page -Instance $rendering -DataSource $dataSourcePath
        }
