SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $board = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Amendment Data/Room and board/Room and board popup"
    
    @( 'en') | % {
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsExpandLabel" -Value "See alternative rooms"
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsCollapseLabel" -Value "Hide alternative rooms"
    }
    
    @( 'de-CH','de-DE') | % {
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsExpandLabel" -Value "Siehe alternative Räume"
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsCollapseLabel" -Value "Alternative Räume ausblenden"
    }
    
    @( 'fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsExpandLabel" -Value "Voir les chambres alternatives"
    	Create-Lang-Version -Item $board -Lang $_ -Field "AltRoomsCollapseLabel" -Value "Cacher les chambres alternatives"
    }
    
    Write-Host $board.Name "fields were updated"; 
