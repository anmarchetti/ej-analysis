  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    $datasource = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Recommended Hotels Carousel" -templateId "{439330F2-BA2B-4D2D-9198-188D525F5877}"
    $datasource.Editing.BeginEdit()
    $datasource["Title"] = "Holidays we think you'll like"
    $datasource["BD4PlacementId"] = "ejh-reco-shortlist"
    $datasource.Editing.EndEdit()
    
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists"
    $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Generic Recommended Hotels"
    $rendering = Get-Item -Database "master" -Path $renderingPath | New-Rendering
    Add-Rendering -Item $startItem -Instance $rendering -PlaceHolder "body" -DataSource $datasource.FullPath
