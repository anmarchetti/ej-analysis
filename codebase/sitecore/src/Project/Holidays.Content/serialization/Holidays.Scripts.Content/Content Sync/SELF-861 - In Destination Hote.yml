Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SELF-861 - In Destination Hotel Summary Luggage"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Add-Items-To-List($list, $fieldName, $items){
        if($list -ne $null -And $items -ne $null) {
            $list.Editing.BeginEdit()
            $list[$fieldName] = $items
            $list.Editing.EndEdit()
            
            Write-Host "Items were added to list"
        }
    }
    
    $luggageTemplatesPath = "master:/sitecore/content/EasyJet/Holidays/Data/Luggage"
    
    # Hold Luggage Items:
    $baggage1 = Get-Item -Path "$($luggageTemplatesPath)/Extra Hold luggage/Hold Baggage 15kg" -ErrorAction SilentlyContinue
    $baggage2 = Get-Item -Path "$($luggageTemplatesPath)/Hold Baggage/Hold Baggage 23kg" -ErrorAction SilentlyContinue
    
    # Large Sport Equipment Items:
    $bicycle = Get-Item -Path "$($luggageTemplatesPath)/Large Sports Equipment/Bicycle" -ErrorAction SilentlyContinue
    $canoe = Get-Item -Path "$($luggageTemplatesPath)/Large Sports Equipment/CanoeKayak" -ErrorAction SilentlyContinue
    $glider = Get-Item -Path "$($luggageTemplatesPath)/Large Sports Equipment/Hand glider" -ErrorAction SilentlyContinue
    $windsurfer = Get-Item -Path "$($luggageTemplatesPath)/Large Sports Equipment/Windsurfer" -ErrorAction SilentlyContinue
    
    # Small Sport Equipment Items:
    $golf = Get-Item -Path "$($luggageTemplatesPath)/Small Sports Equipment/Golf Bag" -ErrorAction SilentlyContinue
    $equipment = Get-Item -Path "$($luggageTemplatesPath)/Small Sports Equipment/Other small sports equipment" -ErrorAction SilentlyContinue
    $skis = Get-Item -Path "$($luggageTemplatesPath)/Small Sports Equipment/Skis and boots" -ErrorAction SilentlyContinue
    $snowboard = Get-Item -Path "$($luggageTemplatesPath)/Small Sports Equipment/Snowboard" -ErrorAction SilentlyContinue
    
    # Hotel Summary data source
    $hotelSummary = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Hotel Summary" -ErrorAction SilentlyContinue
    
    Add-Items-To-List -List $hotelSummary -FieldName "HoldLuggageItems" -Items $("$($baggage1.ID)|$($baggage2.ID)")
    Add-Items-To-List -List $hotelSummary -FieldName "SportEquipmentItems" -Items $("$($bicycle.ID)|$($canoe.ID)|$($glider.ID)|$($windsurfer.ID)|$($golf.ID)|$($equipment.ID)|$($skis.ID)|$($snowboard.ID)")
    
