  Value: |
    $item = Get-Item -Path "master:///sitecore/content/EasyJet/Holidays/Settings/BD4 Travel" -ErrorAction SilentlyContinue
    $itemTemplate = Get-Item -Path "master:///sitecore/templates/Project/Holidays/Site Settings/BD4Travel Settings" -ErrorAction SilentlyContinue
    
