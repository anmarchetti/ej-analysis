        $item.Editing.BeginEdit();
        
        $item.Name = "SmartSeer"
        
    	$item.Editing.EndEdit() | Out-Null
    	Write-Host "Item renamed to:" $item.Name
    }
    
    if ($itemTemplate -ne $null) {
        $itemTemplate.Editing.BeginEdit();
        
        $itemTemplate.Name = "SmartSeer Settings"
        
    	$itemTemplate.Editing.EndEdit() | Out-Null
    	Write-Host "Item Template renamed to:" $itemTemplate.Name
    }
