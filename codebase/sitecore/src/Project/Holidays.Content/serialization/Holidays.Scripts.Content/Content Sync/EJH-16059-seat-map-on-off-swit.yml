  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    # fix content
    ## fix passenger typo in seat and bags
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags/Adult" -template "{3CC028F4-4555-4A87-83EE-15F5AF0C67EB}"
    $seatMap.Editing.BeginEdit()
    $seatMap["Title"] = "{passengerName}"
    $seatMap["TitleConstant"] = "Adult {passengerIndex}"
    $seatMap.Editing.EndEdit()
    
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags/Adult And Infant" -template "{3CC028F4-4555-4A87-83EE-15F5AF0C67EB}"
    $seatMap.Editing.BeginEdit()
    $seatMap["Title"] = "{passengerName} + infant"
    $seatMap["TitleConstant"] = "Adult {passengerIndex} + infant"
    $seatMap.Editing.EndEdit()
    
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags/Child" -template "{3CC028F4-4555-4A87-83EE-15F5AF0C67EB}"
    $seatMap.Editing.BeginEdit()
    $seatMap["Title"] = "{passengerName} (age {passengerAge})"
    $seatMap["TitleConstant"] = "Child (age {passengerAge})"
    $seatMap.Editing.EndEdit()
    
