  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $holidaysSeatAndBags = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}"
    if ($holidaysSeatAndBags -ne $null){
        $holidaysSeatAndBags.Editing.BeginEdit()
        $holidaysSeatAndBags["AmendSeatsNotAvailableMessage"] = "Adding or changing seats is not currently available"
        $holidaysSeatAndBags.Editing.EndEdit()
    }
    
    $tradePortalSeatAndBags = Get-Or-Create-Item -path "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}"
    if ($tradePortalSeatAndBags -ne $null){
        $tradePortalSeatAndBags.Editing.BeginEdit()
        $tradePortalSeatAndBags["AmendSeatsNotAvailableMessage"] = "Adding or changing seats is not currently available"
        $tradePortalSeatAndBags.Editing.EndEdit()
    }
