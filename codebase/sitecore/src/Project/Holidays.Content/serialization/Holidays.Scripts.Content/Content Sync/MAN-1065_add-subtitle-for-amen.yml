  Hint: Script
  Value: |
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    $data = @(
        @{
            fieldName = "Subtitle";
            values = @{
                en = "Good news, we can change your hotel! Please review the changes to your holiday below carefully and we will update your booking after you've confirmed and paid.";
                fr = "Bonne nouvelle, nous pouvons changer d'hôtel ! Veuillez lire attentivement les modifications apportées à votre séjour ci-dessous et nous mettrons à jour votre réservation après que vous l'aurez confirmée et payée.";
                de = "Gute Nachrichten, wir können Ihr Hotel ändern! Bitte überprüfen Sie die Änderungen an Ihrem Urlaub unten sorgfältig und wir werden Ihre Buchung aktualisieren, nachdem Sie bestätigt und bezahlt haben.";
            }
        }    
    );
    
    $amendHotelItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel/Page Components/Amend Hotel";
    
    update-item-with-lang -Data $data -Item $amendHotelItem;
