Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/BOOK-1147 copy hotel designs to trade"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $sourceFolder = "/sitecore/content/EasyJet/Holidays/Presentation/Hotel Design"
    $destination = "/sitecore/content/EasyJet/TradePortal/Presentation/Hotel Design"
    $NewTemplatePath = "/sitecore/templates/Foundation/Presentation/Hotel Design/Trade Hotel Design"
    
    $folder = gi -path $destination -ErrorAction SilentlyContinue
    if ($null -eq $folder) {
        New-Item -Path $destination -ItemType "/sitecore/templates/Foundation/Presentation/Hotel Design/Hotel Design Folder"
    }
    
    $designs = gci -path $sourceFolder -Language "en" | ? { $_.TemplateName -eq "Hotel Design" } | % {
        $item = $_
        $destinationPath = Join-Path -Path $destination -ChildPath $item.Name
        Write-Host "Copying '$($item.ItemPath)' to '$destinationPath'..."
        $copiedItem = Copy-Item -path $item.ItemPath -destination $destinationPath -PassThru
        
        if ($copiedItem) {
           Set-ItemTemplate -Item $copiedItem -Template $NewTemplatePath -FieldsToCopy @{"Hotels"="Hotels"}
        } else {
           Write-Warning "Failed to copy '$($item.ItemPath)'."
        }
    }
