- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host  "Feefo Widget Rendering START"
    
    # Page
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $page = Get-Item -path $pagePath -ErrorAction SilentlyContinue
    
    # Feefo Widget rendering
    $renderingId = "{1BA26842-96D0-4FF4-B517-FD68C72072F1}" #/sitecore/layout/Renderings/Feature/PageContent/Feefo Widget
    $renderigPlaceholder = "body";
    $rendering = Get-Rendering -Item $page -PlaceHolder $renderigPlaceholder -FinalLayout | Where-Object {$_.ItemId -eq $renderingId}
    
    if($rendering -ne $null){
        Write-Host  "Feefo Widget Rendering alsready exists on the page" $pagePath
    }
    
    if($rendering -eq $null){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $renderigPlaceholder
        Add-Rendering -Item $page -PlaceHolder $renderigPlaceholder -Instance $renderingItem -FinalLayout
        Write-Host  "Feefo Widget Rendering was added on the page" $pagePath
    }
    
    Write-Host  "Feefo Widget Rendering END"
    
