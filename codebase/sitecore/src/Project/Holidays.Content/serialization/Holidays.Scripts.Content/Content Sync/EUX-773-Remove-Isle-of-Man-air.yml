Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-773-Remove-Isle-of-Man-airport-from-the-list-of-airports"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom"
    $baseTemplateId = "{F9653205-D2BA-441F-A0EF-526068CA493B}";
    
    
    if($item -ne $null)
    {
        if ($item.TemplateId -eq "{F9653205-D2BA-441F-A0EF-526068CA493B}" )
        {
            Write-Host "Updating DepartureAirports List";
            $multilistField = [Sitecore.Data.Fields.MultilistField]$item.Fields["DepartureAirports"];
            $multilistItems = $multilistField.GetItems()
            
            foreach($multilistItem in $multilistItems){
               if($multilistItem.Fields["Code"].Value -eq "IOM"){
                   Write-Host "Found item to remove from the List: $($multilistItem.Paths.FullPath);$($multilistItem.Id.toString());$($multilistItem.Fields["Code"].Value);$($multilistItem.Fields["Name"].Value));"
                    
                    $delimitedField = [Sitecore.Data.Fields.DelimitedField]$item.Fields["DepartureAirports"];
                    Write-Host "Removing item: $($multilistItem.Id.toString())"
                    $item.Editing.BeginEdit();
                    $delimitedField.Remove($multilistItem.Id.toString());
                    $item.Editing.EndEdit();
                    Write-Host "DepartureAirports List have been updated";
    
               }
            }
    
        } 
    }
    
    
