- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Creating DataSource for Promotional Messages
    $dataFolderPath = "/sitecore/content/EasyJet/Holidays/Data"
    $promotionalMessagesFolderTemplateId = "{30530A09-815B-498C-A97A-E9BD3A397564}"
    $promotionalMessageTemplateId = "{B06686DB-9903-4DD4-856D-5D27285C6B67}"
    
    function Create-Item($path, $name, $templateId, $type, $color, $tooltip){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
        
        $item.Editing.BeginEdit()
        if ($type -ne $null) {
            $item["Type"] = $type;
        }
        if ($color -ne $null) {
            $item["Color"] = $color;
        }
        if ($tooltip -ne $null) {
            $item["Tooltip"] = $tooltip;
        }
        $item.Editing.EndEdit() | Out-Null
    
        return $item;
    }
    
    # CREATE DATA SOURCE
    $promotionalMessagesItem = Create-Item -Path $dataFolderPath -Name "Promotional Messages" -TemplateId $promotionalMessagesFolderTemplateId
    Write-Host "Path: $($promotionalMessagesItem.ItemPath)"
    
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Deposit" -TemplateId $promotionalMessageTemplateId -Type "Deposit" -Color "Green" -Tooltip "Discount calculated using reductions off our standard hotel contract rates plus any extra promotional discount we apply to this holiday"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Holiday With Confidence less than 28" -TemplateId $promotionalMessageTemplateId -Type "With Confidence Less Than 28" -Color "Grey"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Holiday With Confidence more than 28" -TemplateId $promotionalMessageTemplateId -Type "With Confidence More Than 28" -Color "Green"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Amber Policy Pill Less Than 28" -TemplateId $promotionalMessageTemplateId -Type "Amber Policy Pill Less Than 28" -Color "Grey"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Amber Policy Pill More Than 28" -TemplateId $promotionalMessageTemplateId -Type "Amber Policy Pill More Than 28" -Color "Green"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Red Policy Pill Less Than 28" -TemplateId $promotionalMessageTemplateId -Type "Red Policy Pill Less Than 28" -Color "Grey"
    Create-Item -Path $promotionalMessagesItem.ItemPath -Name "Red Policy Pill More Than 28" -TemplateId $promotionalMessageTemplateId -Type "Red Policy Pill More Than 28" -Color "Green"
    
