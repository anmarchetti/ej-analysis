- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host  "Start script: ANC-537 PP revert changes"
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $cabinBagsTradePortal = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags"
    $cabinBagsHolidays = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags"
    
    $translations = @{
        "en" = @{
            "CabinBagPriceLabel" = 'Include for <strong>{pricePP}</strong>'
        }
        "fr-CH" = @{
            "CabinBagPriceLabel" = 'Inclure pour <strong>{pricePP}</strong>'
        }
        "fr-FR" = @{
            "CabinBagPriceLabel" = 'Inclure pour <strong>{pricePP}</strong>'
        }
        "de-CH" = @{
            "CabinBagPriceLabel" = 'Inklusive für <strong>{pricePP}</strong>'
        }
        "de-DE" = @{
            "CabinBagPriceLabel" = 'Inklusive für <strong>{pricePP}</strong>'
        }
    }
    
    create-lang-version -item $cabinBagsTradePortal -lang "en" -field "CabinBagPriceLabel" -value $translations["en"]["CabinBagPriceLabel"]
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $cabinBagsHolidays -lang $lang -field "CabinBagPriceLabel" -value $translations[$lang]["CabinBagPriceLabel"]
    }
    
