- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    
    $page = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation"
    
    
    $renderingPath = "/sitecore/layout/Renderings/Feature/SeatMap/Seats And Bags"
    $placeholderPath = "/body/seats-and-bags-{5d228e7e-0347-4e8e-ac47-d911eba730d7}-0"
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Data/Seat And Bags"
    $rendering = $page | Get-Rendering -Placeholder "*seats*and*bags*" -Device (Get-LayoutDevice "Default")
    
    if($rendering -is [array]){
        Write-Host "multiple renderings found - rendering variable is array"
        Write-Host "Updated one existing seat and bag rendering for booking confirmation page and removed all other"
        Set-Rendering -Item $page -Instance $rendering[0] -DataSource $dataSourcePath -Placeholder $placeholderPath
        for ($i=1; $i -lt $rendering.Count; $i++){
            Remove-Rendering -Item $page -Instance $rendering[$i]
        }
        
    }else{
        if($rendering -ne $null)
        {
            Set-Rendering -Item $page -Instance $rendering -DataSource $dataSourcePath -Placeholder $placeholderPath
            Write-Host "Updated existing seat and bag rendering for booking confirmation page"
        }else{
            $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholderPath
            Add-Rendering -Item $page -Instance $renderingItem -DataSource $dataSourcePath -Placeholder $placeholderPath
            Write-Host "Created new seat and bag rendering for booking confirmation page"
        }
    }
    
