    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Write-Host "Adding language version for item: $($item.Paths.FullPath) in language: $lang"
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        }
        
        if ($null -ne $field -and $null -ne $targetLangItem) {
            Write-Host "Editing item: $($item.Paths.FullPath) in language: $lang"
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            if($item.Paths.FullPath -eq "/sitecore/content/EasyJet/Holidays/Settings/Price Breakdown Settings") {
                $targetLangItem["SeatsPriceEnabled"] = "1"
                $targetLangItem["HoldLuggagePriceEnabled"] = "1"
                $targetLangItem["LargeCabinBagsPriceEnabled"] = "1"
                $targetLangItem["LateCheckoutPriceEnabled"] = "1"
            }
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Prices-Breakdown-Update($website){
        $dataSourcePath = "/sitecore/content/EasyJet/$website/Settings/Price Breakdown Settings"
        $dataSourceItem = Get-Item -Path $dataSourcePath
        
        if($dataSourceItem -ne $null) {
            $dataSourceItem.Editing.BeginEdit()
            $dataSourceItem["ExtrasCode"] = "EXTR"
            $dataSourceItem["ExtrasText"] = "Extras"
            $dataSourceItem["SeatsPriceCode"] = "SEAT"
            $dataSourceItem["SeatsPriceText"] = "Seats"
            $dataSourceItem["SeatsPriceEnabled"] = "1"
            $dataSourceItem["HoldLuggagePriceCode"] = "ADDB"
            $dataSourceItem["HoldLuggagePriceText"] = "Hold Luggage"
            $dataSourceItem["HoldLuggagePriceEnabled"] = "1"
            $dataSourceItem["LargeCabinBagsPriceCode"] = "CABI"
            $dataSourceItem["LargeCabinBagsPriceText"] = "Cabin Bags"
            $dataSourceItem["LargeCabinBagsPriceEnabled"] = "1"
            $dataSourceItem["LateCheckoutPriceCode"] = "SPEQ"
            $dataSourceItem["LateCheckoutPriceText"] = "Late Checkout"
            $dataSourceItem["LateCheckoutPriceEnabled"] = "1"
            $dataSourceItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Price Breakdown Settings Datasource updated"
            
            # Create a new instance of the component
            $newItem = New-Item -Path "$dataSourcePath" -Name "SurCharge Price" -ItemType "/sitecore/templates/Foundation/Destinations/Settings/Price Breakdown Setting" -ErrorAction SilentlyContinue
            if ($newItem -ne $null) {
                $newItem.Editing.BeginEdit()
                $newItem["Code"] = "SurCharge Price"
                $newItem["AtcomCodes"] = "SurCharge Price"
                $newItem["Text"] = "Sport Equipment Transfer Charge"
                $newItem.Editing.EndEdit() | Out-Null
                
                # Add translations for the new component
                foreach ($lang in $translations.Keys) {
                    create-lang-version -item $newItem -lang $lang -field "Text" -value $translations[$lang]["Text"]
                }
                
                Write-Host "New component instance created and updated with translations"
            } else {
                Write-Host "Failed to create new component instance"
            }
        } else {
            Write-Host "Failed to get data source item at path: $dataSourcePath"
        }
        
        # Add translations on Holidays
        if($website -eq "Holidays" -and $dataSourceItem -ne $null){
            foreach ($lang in $translations.Keys) {
                create-lang-version -item $dataSourceItem -lang $lang -field "ExtrasText" -value $translations[$lang]["ExtrasText"]
                create-lang-version -item $dataSourceItem -lang $lang -field "SeatsPriceText" -value $translations[$lang]["SeatsPriceText"]
                create-lang-version -item $dataSourceItem -lang $lang -field "HoldLuggagePriceText" -value $translations[$lang]["HoldLuggagePriceText"]
                create-lang-version -item $dataSourceItem -lang $lang -field "LargeCabinBagsPriceText" -value $translations[$lang]["LargeCabinBagsPriceText"]
                create-lang-version -item $dataSourceItem -lang $lang -field "LateCheckoutPriceText" -value $translations[$lang]["LateCheckoutPriceText"]
                
                Write-Host "Translations added"
            }
        }
        
        Write-Host "Price Breakdown Settings updated on" $website
    }
    
    Prices-Breakdown-Update -website "Holidays"
    Prices-Breakdown-Update -website "TradePortal"
