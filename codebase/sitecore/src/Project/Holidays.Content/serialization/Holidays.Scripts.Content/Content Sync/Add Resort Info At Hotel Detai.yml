Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Add Resort Info At Hotel Details
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Add new rendering `Resort Info Block`
    $renderingPath = "master:/sitecore/layout/Renderings/Feature/Destinations/Resort Info Block"
    # to `Hotel Details` item
    $hotelDetailsItem = Get-Item -Path "master:/content/EasyJet/Holidays/Home/Hotel Details"
    # instead of `Travel Aware` rendering
    $travelAwareRenderingTemplateId = "{3FF99006-99D4-4CA3-ABDF-D363DAAC94B2}";
                   
    $hotelDetailsRenderings = Get-Rendering -Item $hotelDetailsItem
    $travelAwareRendering = $hotelDetailsRenderings | Where-Object {$_.ItemId -eq $travelAwareRenderingTemplateId}
    if($travelAwareRendering -ne $null) {
        $travelAwareRenderingIndex = [array]::IndexOf($hotelDetailsRenderings, $travelAwareRendering)
        if($travelAwareRenderingIndex -ne $null) {
            # Get placeholder wanted
            $placeholder = $travelAwareRendering.Placeholder
            
            # Remove unwanted rendering
            Remove-Rendering -Item $hotelDetailsItem -Instance $travelAwareRendering
            Write-Host "Travel Aware Block removed"
            
            # Add new rendering
            $resortInfoItem = Get-Item -Database "master" -Path $renderingPath -ErrorAction SilentlyContinue | New-Rendering -Placeholder $placeholder
            
            Add-Rendering -Item $hotelDetailsItem -PlaceHolder $placeholder -Instance $resortInfoItem -Index $travelAwareRenderingIndex
            Write-Host  "Resort Info Block added"
        }
    }
