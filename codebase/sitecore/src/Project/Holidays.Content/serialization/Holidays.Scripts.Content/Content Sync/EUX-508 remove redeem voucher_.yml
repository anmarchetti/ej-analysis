  Hint: Script
  Value: |
    function Remove-Voucher-From-Profile ($profilePath, $voucherPath, $lang) {
        $profile = gi -path $profilePath -ErrorAction SilentlyContinue -Language $lang
        $voucher = gi -path $voucherPath -ErrorAction SilentlyContinue
        
        if ($null -ne $profile -and $null -ne $voucher) {
            $voucherItemId = $voucher.ID.ToString()
            $links = $profile.ChildrenLinks
            $newLinks = $links.Replace(("|" + $voucherItemId), "")
            
            $profile.Editing.BeginEdit()
            $profile.ChildrenLinks = $newLinks
            $profile.Editing.EndEdit()
        }
    }
    
    Remove-Voucher-From-Profile -profilePath "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Profile Logged In" -voucherPath "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Redeem Voucher Logged In" -lang "fr-CH"
    Remove-Voucher-From-Profile -profilePath "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Profile Logged In" -voucherPath "/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Redeem Voucher Logged In" -lang "de-CH"
    
