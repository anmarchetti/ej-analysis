Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1308 Full Width Banner tracking"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Find-FullWidthBanner-Datasources {
    	$criteria = @(
    		@{ Filter = "Equals"; Field = "_template"; Value = "049F0CD3A3F44C049856CDECAD8DE6AC"; },
    		@{ Filter = "Equals"; Field = "_language"; Value = "en" }
    	)
    
    	$props = @{
    		Index = "sitecore_master_index"
    		Criteria = $criteria
    	}
    
    	$items = Find-Item @props
    	Write-Host "Number of banners retrived: " $items.Count -ForegroundColor Green
    
    	return $items
    }
    
    $bannerDatasources = Find-FullWidthBanner-Datasources
    
    foreach ($bannerDatasource in $bannerDatasources)
    {
    	$item = Get-Item -Path master: -Id $bannerDatasource.ItemID -Language "en"
    
    	$item.Editing.BeginEdit()
    	$item["TrackingTitle"] = $item['Title']
    	$item.Editing.EndEdit()
    } 
