Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-12223 Create Tracking Settings"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $settingsFolderPath = "/sitecore/content/EasyJet/Holidays/Settings"
    
    $trackingSettingsTemplateId = "{86F2AC20-FDB7-4279-847B-93D097F9AD2C}"
    $trackingSettingsItemName = "Tracking Settings"
    
    $item = Get-Item -Path "$($settingsFolderPath)/$($trackingSettingsItemName)" -ErrorAction SilentlyContinue
    
    if($item -eq $null){
        $item = New-Item -Path $settingsFolderPath -Name $trackingSettingsItemName -ItemType $trackingSettingsTemplateId
    
    	$item.Editing.BeginEdit()
    	$item["EnableUserSearchesTracking"] = "0"
    	$item.Editing.EndEdit() | Out-Null;
    }
    
    Write-Host $item.Name "Tracking settings finished";
