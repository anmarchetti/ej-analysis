  Value: |
     function create-lang-version($item, $lang, $field, $value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    	
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
      
    function create-dictionary-lang-version($path, $lang, $phrase) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	
    	if ($item -eq $null) {
    		return;
    	}
    	
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath  -Language $lang -ErrorAction SilentlyContinue
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -Language "en" -TargetLanguage $lang -IfExist Append
    	}
    
    	$targetLangItem = Get-Item -Path $path -Language $lang
    	$targetLangItem.Editing.BeginEdit()
    	$targetLangItem["Phrase"] = $phrase
    	$targetLangItem.Editing.EndEdit()
    }
    
    function disable-hold-luggage-settings() {
        
        $holdLuggageSettingsPath = "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings"
        $holdLuggageSettings = Get-Item -Path $holdLuggageSettingsPath  -Language "en"
        	
        @('fr-CH', 'fr-FR', 'de-DE', 'de-CH') | % {
           	Create-Lang-Version -Item $holdLuggageSettings -Lang $_ -Field "IsHoldLuggageEnabled" -Value "0"
           	Create-Lang-Version -Item $holdLuggageSettings -Lang $_ -Field "IsSportsEquipmentEnabled" -Value "0"
        }
    }
    
    function update-trade-portal() {
    	
    	$holdLuggageTradePortalPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal"
    	$holdLuggageTradePortal = Get-Item -Path $holdLuggageTradePortalPath -Language "en" -ErrorAction SilentlyContinue
    
    	Create-Lang-Version -Item $holdLuggageTradePortal -Lang "en" -Field "HoldLuggageAndSportsSubtitle" -Value "Each passenger has a 23kg bag included, but can add up to 3 more pieces of luggage, or one piece of sports equipment per passenger."
    	Create-Lang-Version -Item $holdLuggageTradePortal -Lang "en" -Field "HoldLuggageSubtitle" -Value "Each passenger has a 23kg bag included, but can add up to 3 more pieces of luggage equipment per passenger."
    	Create-Lang-Version -Item $holdLuggageTradePortal -Lang "en" -Field "SportsSubtitle" -Value "Each passenger has a 23kg bag included, but can add one piece of sports equipment per passenger."
    	Create-Lang-Version -Item $holdLuggageTradePortal -Lang "en" -Field "UnavailableMessageHeader" -Value "Adding hold luggage is currently unavailable"
    	Create-Lang-Version -Item $holdLuggageTradePortal -Lang "en" -Field "UnavailableMessageDescription" -Value "We're sorry, adding hold luggage is currently unavailable for this flight. You can still select your flight and add your bags at a later stage."
    }
    
    function update-holidays() {
    	
    	$holdLuggagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage"
    	$holdLuggage = Get-Item -Path $holdLuggagePath -Language "en" -ErrorAction SilentlyContinue
    
    	Create-Lang-Version -Item $holdLuggage -Lang "en" -Field "HoldLuggageAndSportsSubtitle" -Value "Each passenger has a 23kg bag included, but can add up to 3 more pieces of luggage, or one piece of sports equipment per passenger."
    	Create-Lang-Version -Item $holdLuggage -Lang "en" -Field "HoldLuggageSubtitle" -Value "Each passenger has a 23kg bag included, but can add up to 3 more pieces of luggage equipment per passenger."
    	Create-Lang-Version -Item $holdLuggage -Lang "en" -Field "SportsSubtitle" -Value "Each passenger has a 23kg bag included, but can add one piece of sports equipment per passenger."
    	Create-Lang-Version -Item $holdLuggage -Lang "en" -Field "UnavailableMessageHeader" -Value "Adding hold luggage is currently unavailable"
    	Create-Lang-Version -Item $holdLuggage -Lang "en" -Field "UnavailableMessageDescription" -Value "We're sorry, adding hold luggage is currently unavailable for this flight. You can still select your flight and add your bags at a later stage."
    
    	@('fr-CH', 'fr-FR') | % {
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "Title" -Value "VOS BAGAGES DE SOUTE"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "HoldLuggageAndSportsSubtitle" -Value "Chaque passager dispose d'un sac de 23 kg, mais peut ajouter jusqu'à 3 bagages supplémentaires ou un équipement sportif par passager."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "OutboundAndReturnTextMultiple" -Value "<strong>{count}</strong> Articles - aller et retour"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "UnavailableMessageHeader" -Value "L'ajout de bagages en soute est actuellement indisponible"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "UnavailableMessageDescription" -Value "Nous sommes désolés, l'ajout de bagages en soute n'est actuellement pas disponible pour ce vol. Vous pouvez toujours sélectionner votre vol et ajouter vos bagages ultérieurement."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "IncludedForFreeText" -Value "Inclus gratuitement"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "BagCountHeading" -Value "<strong>{count}</strong> x sacs de soute de 23 kg"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "BagCountDescription" -Value "Maximum 23 kg par sac, stocké dans la soute de l'avion. A l'aller et au retour."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "PramHeading" -Value "Pram"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "PramDescription" -Value "1 landau ou poussette par enfant. Aller et retour."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "OutboundAndReturnTextSingular" -Value "1 poste - aller et retour"	
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "InternalFlightHeader" -Value "Vous souhaitez ajouter des sacs?"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "InternalFlightDescription" -Value "Les bagages en soute pourront être achetés 30 jours avant le départ du vol. Veuillez revenir pour ajouter d'autres bagages de soute."	
    
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Buttons/Included" -Lang $_ -phrase "Inclus" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Buttons/Increase Weight" -Lang $_ -phrase "Augmentation du poids" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/Bag 23 Weight" -Lang $_ -phrase "Jusqu'à 23 kg" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/SmallUnderSeatBagSingle" -Lang $_ -phrase "Petit sac sous le siège" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/SmallUnderSeatBagsPlural" -Lang $_ -phrase "Petits sacs sous le siège" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/Luggage 23 Weight" -Lang $_ -phrase "Jusqu'à 23 kg" 
    			
    		Write-Host "Update French content"
    	}
    
    	@('de-DE', 'de-CH') | % {
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "Title" -Value "IHR AUFGEGEBENES GEPÄCK"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "HoldLuggageAndSportsSubtitle" -Value "Jeder Passagier hat ein Gepäckstück von 23 kg dabei, kann aber bis zu 3 weitere Gepäckstücke oder ein Sportgerät pro Passagier hinzufügen."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "OutboundAndReturnTextMultiple" -Value "<strong>{count}</strong> Sendungen - Ausreise und Rückreise"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "UnavailableMessageHeader" -Value "Das Hinzufügen von aufgegebenem Gepäck ist derzeit nicht möglich"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "UnavailableMessageDescription" -Value "Es tut uns leid, das Hinzufügen von aufgegebenem Gepäck ist für diesen Flug derzeit nicht möglich. Sie können Ihren Flug immer noch auswählen und Ihr Gepäck zu einem späteren Zeitpunkt hinzufügen."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "IncludedForFreeText" -Value "Kostenlos inbegriffen"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "BagCountHeading" -Value "<strong>{count}</strong> x 23 kg Gepäckstücke"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "BagCountDescription" -Value "Maximal 23 kg pro Tasche, Lagerung im Frachtraum des Flugzeugs. Hin- und Rückflug."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "PramHeading" -Value "Kinderwagen"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "PramDescription" -Value "1 Kinderwagen oder Buggy pro Kind. Hin- und Rückflug."
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "OutboundAndReturnTextSingular" -Value "1 Posten - Ausreise und Rückreise"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "InternalFlightHeader" -Value "Möchten Sie weitere Taschen hinzufügen?"
    		Create-Lang-Version -Item $holdLuggage -Lang $_ -Field "InternalFlightDescription" -Value "Aufgegebenes Gepäck kann 30 Tage vor dem Abflug erworben werden. Bitte schauen Sie wieder vorbei, um weiteres Gepäck hinzuzufügen."	
    
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Buttons/Included" -Lang $_ -phrase "Eingeschlossen" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Buttons/Increase Weight" -Lang $_ -phrase "Gewicht erhöhen" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/Bag 23 Weight" -Lang $_ -phrase "Bis zu 23 kg" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/SmallUnderSeatBagSingle" -Lang $_ -phrase "Kleine Tasche unter dem Sitz" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/SmallUnderSeatBagsPlural" -Lang $_ -phrase "Kleine Taschen unter dem Sitz" 
    		Create-Dictionary-Lang-Version -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Luggage/Labels/Luggage 23 Weight" -Lang $_ -phrase "Bis zu 23 kg" 
    		
    		Write-Host "Update German content"
    	}	
    }
    
    disable-hold-luggage-settings
    update-trade-portal
    update-holidays
    
    Write-Host "Script was executed"
