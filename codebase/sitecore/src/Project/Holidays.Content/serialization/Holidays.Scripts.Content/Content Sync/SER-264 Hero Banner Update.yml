            }    
                
            Add-Rendering-To -page $pageItem -renderingPath "/sitecore/layout/Renderings/Feature/Booking/BookingHeroBanner" -index $newIndex  -placeholder $bannerPlaceholder -datasource $contentData.ID
            
            if( $isTrade -ne $true){
