    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    function Get-Rendering-Index{
        param($item, $renderingId)
        $i = 0
        
        Get-Rendering -Item $item | ForEach-Object{
            if ($_.ItemID -eq $renderingId){
                return $i
            }
            $i++
        }
        
        return -1
    }
    function Get-Rendering-Uid{
        param($item, $renderingId)
        $i = 0
        
        Get-Rendering -Item $item | ForEach-Object{
            if ($_.ItemID -eq $renderingId){
                return $_.UniqueID;
            }
            $i++
        }
        
        return -1
    }
    function Add-Rendering-To($page, $renderingPath, $index, $placeholder,  $datasource){
        $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $placeholder
    	Add-Rendering -Item $page -PlaceHolder $placeholder -Instance $renderingItem -Index $index  -DataSource $datasource -Parameter @{ "ShowCountdown"="1" } 
    	Write-Host $item.Name "$renderingPath rendering is added"
    }
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    function Create-Breadcrumbs($path, $breadcrumbs){
        $folder = Get-Or-Create-Item -path $path -templateId '{342C2741-9124-4499-8DAC-056FBBD364B0}'
        $name = $breadcrumbs['en']["Text"];
        $breadcrumb = Get-Or-Create-Item -path "$path/$name" -templateId '{D21FBF7C-4FD3-40EC-8D39-CAD55D3AC14D}'
       
        foreach ($lang in $breadcrumbs.Keys) {
            create-lang-version -item $breadcrumb  -lang $lang -field "Text" -value $breadcrumbs[$lang]["Text"]    
            create-lang-version -item $breadcrumb  -lang $lang -field "Link" -value $breadcrumbs[$lang]["Link"]    
        }
    }
    
