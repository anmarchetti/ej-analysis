- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    $template = '{63D3079B-9A85-4872-AC5E-34D19D8D972E}'
    $path = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags/Internal Flight Banner'
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags/Internal Flight Banner'
    
    $banner = Get-Or-Create-Item -Path $path -Template $template
    
    if($banner -ne $null) {
        $banner.Editing.BeginEdit()
        $banner['Title'] = 'Looking to add more bags?'
        $banner['Subtitle'] = "Cabin bags will be available for purchase 30 days before the flight departs. Please check back then to upgrade your cabin bag allowance."
        $banner.Editing.EndEdit() | Out-Null
    }
    
    $bannerTrade = Get-Or-Create-Item -Path $tradePath -Template $template
    
    if($bannerTrade -ne $null) {
        $bannerTrade.Editing.BeginEdit()
        $bannerTrade['Title'] = 'Looking to add more bags?'
        $bannerTrade['Subtitle'] = "Cabin bags will be available for purchase 30 days before the flight departs. Please check back then to upgrade your cabin bag allowance."
        $bannerTrade.Editing.EndEdit() | Out-Null
    }
    
    $translations = @{
            "fr-CH" = @{
                "Title" = "L'ajout de bagages de cabine n'est pas disponible pour le moment."
                "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter des bagages de cabine de grande taille n'est pas disponible pour le moment pour ce vol. Vous pouvez toujours réserver vos vacances et ajouter des bagages de cabine à un stade ultérieur. Si vous souhaitez ajouter des bagages supplémentaires maintenant, veuillez le faire en ajoutant des bagages de soute."
            }
            "fr-FR" = @{
                "Title" = "L'ajout de bagages de cabine n'est pas disponible pour le moment."
                "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter des bagages de cabine de grande taille n'est pas disponible pour le moment pour ce vol. Vous pouvez toujours réserver vos vacances et ajouter des bagages de cabine à un stade ultérieur. Si vous souhaitez ajouter des bagages supplémentaires maintenant, veuillez le faire en ajoutant des bagages de soute."
            }
            "de-CH" = @{
                "Title" = "Das Hinzufügen von Handgepäck ist zur Zeit nicht möglich."
                "Subtitle" = "Es tut uns leid, die Möglichkeit, großes Handgepäck hinzuzufügen, ist für diese Flüge derzeit nicht verfügbar. Sie können Ihre Reise immer noch buchen und zu einem späteren Zeitpunkt großes Handgepäck hinzufügen. Wenn Sie jetzt mehr Gepäckstücke hinzufügen möchten, tun Sie dies bitte, indem Sie aufgegebenes Gepäck hinzufügen."
            }
            "de-DE" = @{
                "Title" = "Das Hinzufügen von Handgepäck ist zur Zeit nicht möglich."
                "Subtitle" = "Es tut uns leid, die Möglichkeit, großes Handgepäck hinzuzufügen, ist für diese Flüge derzeit nicht verfügbar. Sie können Ihre Reise immer noch buchen und zu einem späteren Zeitpunkt großes Handgepäck hinzufügen. Wenn Sie jetzt mehr Gepäckstücke hinzufügen möchten, tun Sie dies bitte, indem Sie aufgegebenes Gepäck hinzufügen."
            }
        }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $banner -lang $lang -field "Title" -value $translations[$lang]["Title"]
        create-lang-version -item $banner -lang $lang -field "Subtitle" -value $translations[$lang]["Subtitle"]
    }    
    
    $bagsItem =  Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags' -ErrorAction SilentlyContinue
    
    if($bagsItem -ne $null) {
        $bagsItem.Editing.BeginEdit()
        $bagsItem['InternalFlightBanner'] = $banner.ID
        $bagsItem['InternalFlightTitle'] = 'Your cabin bag allowance'
        $bagsItem['InternalFlightDescription'] = 'Each passenger is allowed to take a single small under seat bag on their flights'
        $bagsItem.Editing.EndEdit() | Out-Null
    }
    
    $translationsBags = @{
            "fr-CH" = @{
                "InternalFlightTitle" = "Votre franchise de bagages de cabine"
                "InternalFlightDescription" = "Chaque passager est autorisé à emporter un seul petit sac sous le siège sur ses vols."
            }
            "fr-FR" = @{
                "InternalFlightTitle" = "Votre franchise de bagages de cabine"
                "InternalFlightDescription" = "Chaque passager est autorisé à emporter un seul petit sac sous le siège sur ses vols."
            }
            "de-CH" = @{
                "InternalFlightTitle" = "Ihr Handgepäck"
                "InternalFlightDescription" = "Jeder Fluggast darf nur eine einzige kleine Tasche unter dem Sitz mit auf den Flug nehmen."
            }
            "de-DE" = @{
                "InternalFlightTitle" = "Ihr Handgepäck"
                "InternalFlightDescription" = "Jeder Fluggast darf nur eine einzige kleine Tasche unter dem Sitz mit auf den Flug nehmen."
            }
        }
        
    foreach ($lang in $translationsBags.Keys) {
        create-lang-version -item $bagsItem -lang $lang -field "InternalFlightTitle" -value $translationsBags[$lang]["InternalFlightTitle"]
        create-lang-version -item $bagsItem -lang $lang -field "InternalFlightDescription" -value $translationsBags[$lang]["InternalFlightDescription"]
    }   
    
    $tradeBagsItem =  Get-Item -Path '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags' -ErrorAction SilentlyContinue
    
    if($tradeBagsItem -ne $null) {
        $tradeBagsItem.Editing.BeginEdit()
        $tradeBagsItem['InternalFlightBanner'] = $bannerTrade.ID
        $tradeBagsItem['InternalFlightTitle'] = 'Your cabin bag allowance'
        $tradeBagsItem['InternalFlightDescription'] = 'Each passenger is allowed to take a single small under seat bag on their flights'
        $tradeBagsItem.Editing.EndEdit() | Out-Null
    }
    
