- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($itemPath, $lang, $field, $value) {
    
            $targetLangItem = Get-Item -Path $itemPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Path $itemPath -TargetLanguage $lang -IfExist Skip
                $targetLangItem = Get-Item -Path $itemPath -Language $lang -ErrorAction SilentlyContinue;
    
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $itemPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
        
    $bannerCTAPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags/Cabin Bags Unavailable CTA Banner"
    
    create-lang-version -itemPath $bannerCTAPath -lang 'de-DE' -field 'ButtonLabel' -value "Gepäck hinzufügen"
    create-lang-version -itemPath $bannerCTAPath -lang 'de-CH' -field 'ButtonLabel' -value "Gepäck hinzufügen"
    
