SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Create-Item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $null
    }
    
    $offerFiltersFolderType = "{63F1CFFE-8633-4ED6-BDAE-8770E17DD6F0}"
    $offerFilterItemType = "{AC7EC709-724A-4A66-BA98-5E3FCF5E83CB}"
    
    $offerFiltersFolderName = "Offer Filters"
    $freeForKidsFilterName = "Free For Kids Only"
    $dataFolderPath = "/sitecore/content/EasyJet/Holidays/Data"
    
    Create-Item -path $dataFolderPath -itemName $offerFiltersFolderName -itemType $offerFiltersFolderType
    $freeForKidsFilter = Create-Item -path ($dataFolderPath, $offerFiltersFolderName -join "/") -itemName $freeForKidsFilterName -itemType $offerFilterItemType
    
    if($freeForKidsFilter -ne $null) {
        $freeForKidsFilter.Editing.BeginEdit()
        $freeForKidsFilter.Fields["Name"].Value = 'Only "Free Kids Places"'
        $freeForKidsFilter.Fields["Code"].Value = "freeForKidsOnly"
        $freeForKidsFilter.Editing.EndEdit()
    }
    else {
        Write-Host $freeForKidsFilterName "already exists"
    }
    
    Write-Host "Offer Filters Folder successfully populated"
