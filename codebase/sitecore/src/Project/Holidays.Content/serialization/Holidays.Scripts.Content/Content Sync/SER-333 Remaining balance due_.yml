  Hint: Script
  Value: |
    @('en', 'fr-CH', 'fr-FR', 'de-CH', 'de-DE') | ForEach-Object {
        $set = Get-Item -Path '/sitecore/content/EasyJet/Holidays/Settings/Booking Settings' -Language $_ -ErrorAction SilentlyContinue
        if ($set) {
            $set.Editing.BeginEdit()
            $set['DaysBeforeDepartureToPay'] = '28'
            $set.Editing.EndEdit() | Out-Null
        }
    }
