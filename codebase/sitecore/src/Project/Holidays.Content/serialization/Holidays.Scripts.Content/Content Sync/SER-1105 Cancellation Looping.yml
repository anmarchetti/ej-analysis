  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Settings/Credit and Cash Refund Settings"
    $tradeDatasoursePath = "/sitecore/content/EasyJet/TradePortal/Settings/Credit and Cash Refund Settings"
    $settingTemplatePath = "/sitecore/templates/Foundation/Destinations/Settings/Cancel and Credit Rules/Cancel And Credit Settings Folder/Content/AllowedAmountOfFailures"
    
    
    function New-Content() {
    
        $updates = @(
            @{
                Path         = $datasourcePath
                TemplatePath = $settingTemplatePath
                Fields       = @{
                    "AllowedAmountOfFailures" = @{
                       "en" = 1
                        "fr-CH" = 1
                        "de-CH" = 1
                        "fr-FR" = 1
                        "de-DE" = 1
                    }
                }
            }
            @{
                Path         = $tradeDatasoursePath
                TemplatePath = $settingTemplatePath
                Fields       = @{
                    "AllowedAmountOfFailures" = @{
                       "en" = 1
                        "fr-CH" = 1
                        "de-CH" = 1
                        "fr-FR" = 1
                        "de-DE" = 1
                    }
                }
            }
        )
    
        ImportContent -itemsToCreate $updates
    }
    
    
    
    New-Content
