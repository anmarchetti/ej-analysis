Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14554 Move Hero Carousel Rendering Inside Wrapper"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Item-Index {
        param($pageItem, $renderingItem)
    
        $allRenderings = Get-Rendering -Item $pageItem
    
        $i = -1
        $allRenderings | ForEach-Object {
            $i++
    
            if($_.ItemID -eq $renderingItem.ItemID) {
                return $i
                Break
            }
        }
    }
    
    $homePageItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home"
    $heroCarouselRendering = Get-Rendering -Item $homePageItem -PlaceHolder "body"  | Where-Object {$_.ItemId -eq "{36F8D2A1-FFD4-4FA9-A8F3-1104F486AF04}" }
    
    if ($heroCarouselRendering -ne $null) {
        $renderingIndex = Get-Item-Index -pageItem $homePageItem -renderingItem $heroCarouselRendering
    
        $params = @{ IsFullWidth = "1"}
        $componentWrapperItem = Get-Item -Path "master:" -ID "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}" | New-Rendering -Placeholder "body"
        
        Add-Rendering -Item $homePageItem -PlaceHolder "body" -Instance $componentWrapperItem -index $renderingIndex -Parameter $params
    
        Write-Host "Added Component Wrapper"
    
        $componentWrapperRendering = Get-Rendering -Item $homePageItem -Index $renderingIndex
    
        Set-Rendering -Item $homePageItem -Instance $heroCarouselRendering -PlaceHolder "/body/component-wrapper-inner-$($componentWrapperRendering.UniqueId)-0"
    
        Write-Host "Updated Hero Carousel Placeholder"
    }
    
    Write-host "Finished"
