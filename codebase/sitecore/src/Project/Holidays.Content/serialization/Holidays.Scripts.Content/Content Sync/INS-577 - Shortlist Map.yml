- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId,$itemId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    
    
    $map = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components" -ItemName "Shortlist Map" -TemplateId "{4C4E7BFD-D456-4EC2-B8F4-4B653740C9EC}"
    
    #update datasource
    $item = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists"
    $rendetingItem = Get-Item -Path "master:/sitecore/layout/Renderings/Feature/Destinations/Shortlist/Shortlist Map"
    $rendering = Get-Rendering -Item $item -PlaceHolder "/body/maps-{494865ee-63ca-4966-b3c1-6bb78c01136f}-0" -Rendering $rendetingItem
    if ($rendering -ne $null) {
        Set-Rendering -Item $item -Instance $rendering -DataSource $map.ID
    	Write-Host $item.Name "Datasource for Map Rendering was successfully updated"
    }
