- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function get-or-create-item($path, $itemName, $templateId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    function create-package-icons($iconsFolder){
        ForEach($iconGroup in $bagPackageIcons){
            $iconGroupItem = get-or-create-item -Path "$($iconsFolder.FullPath)" -ItemName "$($iconGroup.Group)" -TemplateId $iconsGroupTemplateId
            ForEach($icon in $iconGroup.Icons){
                $iconItem = get-or-create-item -Path "$($iconGroupItem.FullPath)" -ItemName "$($icon.Name)" -TemplateId $bagIconTemplateId
                $iconItem.Editing.BeginEdit()
                $iconItem.Fields["Icon"].Value = "<image mediaid='$($icon.Icon)'/>"
                $iconItem.Editing.EndEdit()
            }
        }
    }
    
    # Holidays
    $hotelThemesPath = "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes"
    $iconsFolderTemplateId = "{470E3B91-3622-4511-AEA4-E39DFE863184}"
    $iconsGroupTemplateId = "{30ACD59D-7149-40DC-BEBD-118B93EFF8F5}"
    $bagIconTemplateId = "{B92C4992-039E-43FE-81A2-5DD7C28E8F2C}"
    $iconTemplateId = "{DA4503C0-8D8E-4BFB-AC90-EE9707CE5EF7}"
    
    $bagPackageIcons = @(
        @{
            Group  = "Bags"
            Icons = @(
                @{
                    Name = "23kg bags"
                    Icon = "{EDC5A337-1DCD-4D59-9751-E3E4A13ADFE9}"
                },
                @{
                    Name = "15kg bags"
                    Icon = "{EDC5A337-1DCD-4D59-9751-E3E4A13ADFE9}"
                }
            )
        }
    )
    
    $iconsFolder = get-or-create-item -Path $hotelThemesPath -ItemName "Package Icons" -TemplateId $iconsFolderTemplateId
    create-package-icons -IconsFolder $iconsFolder
    
    # Trade Portal
    $hotelThemesPath = "/sitecore/content/EasyJet/TradePortal/Data/Hotel Themes"
    
    $bagPackageIcons = @(
        @{
            Group  = "Bags"
            Icons = @(
                @{
                    Name = "23kg bags"
                    Icon = "{EDC5A337-1DCD-4D59-9751-E3E4A13ADFE9}"
                },
                @{
                    Name = "15kg bags"
                    Icon = "{EDC5A337-1DCD-4D59-9751-E3E4A13ADFE9}"
                }
            )
        }
    )
    
    $iconsFolder = get-or-create-item -Path $hotelThemesPath -ItemName "Package Icons" -TemplateId $iconsFolderTemplateId
    create-package-icons -IconsFolder $iconsFolder
