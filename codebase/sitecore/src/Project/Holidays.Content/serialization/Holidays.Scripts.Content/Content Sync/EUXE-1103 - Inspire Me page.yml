    function Get-Or-Create-Item($path, $itemName, $templateId, $itemId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    function Set-Page-Design($designPath, $pageTemplateId) {
        $designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
        if ($designItem -ne $null) {
             [Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
            
            if(!$pageTemplates.Contains($pageTemplateId)) {
                $designItem.Editing.BeginEdit();
                $pageTemplates.add($pageTemplateId);
                $designItem.Editing.EndEdit() | Out-Null
                Write-Host "Page Templates of" $designItem.Name "are updated"
            }
        }
    }
    
    function Create-Tag($path, $itemName, $code, $name, $icon){
        $tag = Get-Or-Create-Item -Path $path -ItemName $itemName -TemplateId "{D21E6A0C-4BD2-431A-8F11-583B0550E0FB}"
        $tag.Editing.BeginEdit()
        $tag["Code"] = $code
        $tag["Icon"] = $icon
        $tag["Name"] = $name
        $tag.Editing.EndEdit() | Out-Null
    }
    
    function Create-Weather-Tag($path, $itemName, $code, $name, $icon, $from, $to){
        $tag = Get-Or-Create-Item -Path $path -ItemName $itemName -TemplateId "{A54AD77C-6359-4B81-994C-732E45631657}"
        $tag.Editing.BeginEdit()
        $tag["Code"] = $code
        $tag["Icon"] = $icon
        $tag["Name"] = $name
        $tag["TemperatureMin"] = $from
        $tag["TemperatureMax"] = $to
        $tag.Editing.EndEdit() | Out-Null
    }
    
    function Get-Options-Ids($path){
        
        $items = Get-Item $path -ErrorAction SilentlyContinue
        if($items -eq $null){
            return ""
        }
        
        $separated = $items.Children | % { $_.ID }
        return $separated -join '|'
    }
    
