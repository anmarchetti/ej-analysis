  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    $amendRoomAndBoardPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board"
    
    $amendRoomAndBoardPage = Get-Or-Create-Item -Path $amendRoomAndBoardPagePath
    if ($amendRoomAndBoardPage -ne $null) {
    	$amendRoomAndBoardPage.Editing.BeginEdit();
    	$amendRoomAndBoardPage.Fields["PageCategory"].Value = "Post-Booking"
    	$amendRoomAndBoardPage.Editing.EndEdit() | Out-Null;
    	Write-Host "Finished editing " $amendRoomAndBoardPage.Paths.FullPath
    }
    
