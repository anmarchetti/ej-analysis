SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendDatesSummaryRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Dates/Amend Dates Summary" -ErrorAction SilentlyContinue;
    $attentionMessageRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Attention Message" -ErrorAction SilentlyContinue;
    $amendDatesSummaryPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    
    $renderingAmendSummaryDates = Get-Rendering -Item $amendDatesSummaryPageItem -Render $amendDatesSummaryRenderingItem;
    
    if ($renderingAmendSummaryDates -ne $null) {
        $lossSeatsMessageRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Attention Message";
        $lossSeatsMessageRenderingDataSource = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Loss Seats Message";
        
        $lossSeatsMessageRendering = Get-Rendering -Item $amendDatesSummaryPageItem -Render $attentionMessageRenderingItem -Index 0;
        $lossSeatsPlaceholder = "/body/attention-message-" + $renderingAmendSummaryDates.UniqueId + "-0";
    
        if ($lossSeatsMessageRendering -ne $null) {
            Set-Rendering -Item $amendDatesSummaryPageItem -Instance $lossSeatsMessageRendering -Placeholder $lossSeatsPlaceholder;
            
            Write-Host $lossSeatsMessageRendering 'Updated';
        }
    }
