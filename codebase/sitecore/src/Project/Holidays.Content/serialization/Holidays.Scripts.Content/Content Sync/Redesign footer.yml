    		Images = @( @{ ID = "{FD4CD0AA-8132-436F-822B-18BF38068A14}"; Name = "Travel aware"; Folder = $imagesPath; MediaId = "{D34C153A-DAE9-4E02-8D9F-57FC1F22FED2}" })
