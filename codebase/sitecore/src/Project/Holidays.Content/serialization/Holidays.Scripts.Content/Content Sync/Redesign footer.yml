    		Images = @( @{ ID = "{7D4FD676-498F-4124-A5D0-E5A34E69B807}"; Name = "Protection Promise Logo"; Folder = $imagesPath; MediaId = "{E0299269-1A51-4F11-8A3D-FC056497DC08}" })
    	}
