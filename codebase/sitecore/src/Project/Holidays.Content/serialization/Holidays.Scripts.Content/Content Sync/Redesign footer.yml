    			@{ ID = "{B1944258-9717-41F8-82E9-D6F90AE3A8F5}"; Name = "ATOL Logo"; Folder = "$($imagesPath)/ABTA and ATOS"; MediaId = "{3F7F989F-994E-436E-9003-96562CD6BEE8}" }
