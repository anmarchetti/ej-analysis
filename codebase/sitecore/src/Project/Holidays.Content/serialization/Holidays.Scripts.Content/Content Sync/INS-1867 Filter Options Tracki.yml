Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1867 Filter Options Tracking"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $paths = @(
        "master:/sitecore/content/EasyJet/Holidays/Data/Promotion Collections",
        "master:/sitecore/content/EasyJet/TradePortal/Data/Promotion Collections"
    )
    
    foreach ($path in $paths) {
        if (-not (Test-Path $path)) {
            Write-Host "Path not found: $path"
            continue
        }
    
        foreach ($child in Get-ChildItem -Path $path) {
            $title = $child["Title"]
    
            if ([string]::IsNullOrWhiteSpace($title)) {
                Write-Host "Skipped (empty Title): $($child.Paths.FullPath)"
                continue
            }
    
            if ($child["TrackingId"] -eq $title) {
                Write-Host "Already up to date: $($child.Paths.FullPath)"
                continue
            }
    
            $child.Editing.BeginEdit()
            try {
                $child["TrackingId"] = $title
                $child.Editing.EndEdit() | Out-Null
                Write-Host "Updated: $($child.Paths.FullPath) -> TrackingId = '$title'"
            }
            catch {
                $child.Editing.CancelEdit()
                Write-Host "Failed: $($child.Paths.FullPath) - $_"
            }
        }
    }
