- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Dictionary ($path,$phrase) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Phrase"] = $phrase
    		$item.Editing.EndEdit() | Out-Null
    
    		Write-Host $item['Phrase'] "updated"
    	}
    }
    
    Update-Dictionary -Path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Transfer/Labels/Seats Plural" -Phrase "{number} seats"
    Update-Dictionary -Path "master:/sitecore/content/EasyJet/Holidays/Dictionary/Transfer/Labels/Seat Singular" -Phrase "{number} seat"
