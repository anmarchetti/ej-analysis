Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15747 - Remove Price Changed from payment add messages for payment price change"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $page = Get-Item -Path master:/sitecore/content/EasyJet/Holidays/Home/Booking/Payment
    $rendering = Get-Item -Path 'master:/sitecore/layout/Renderings/Feature/Destinations/Price Changed'
    $canceledHeader = Get-Rendering -Item $page -Rendering $rendering
    if ($canceledHeader -ne $null){
        Remove-Rendering -Item $page -Rendering $rendering
        
        Write-Host "Price Changed Removed"
    }
    
    $payment = Get-Item -Path 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/Payment/Page Components/Payment'
    if ($payment -ne $null) {
        $payment.Editing.BeginEdit()
        $payment["EnablePriceJumpInfoBox"] = '1'
        $payment["PriceIncreasedMessage"] = 'The price of your holiday has increased by {amount}. The most up to date price of your holiday is {newprice}'
        $payment["PriceDecreasedMessage"] = 'The price of your holiday has decreased by {amount}. The most up to date price of your holiday is {newprice}'
        $payment.Editing.EndEdit() | Out-Null
    }
    
    
    Write-Host "Finished"
