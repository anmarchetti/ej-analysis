Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Examples/Upload Image
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/media library/Project/Holidays/Default/Map/cluster";
    $imageTemplateId = 'f1828a2c-7e5d-4bbd-98ca-320474871548';
    $clusterImageID = 'a69fdc4f-448e-4e00-b8a3-e5891bcc499d';
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue;
    
    if ($item -eq $null) {
        #create item
        $item = New-Item -Path $itemPath -ItemType $imageTemplateId -ForceId $clusterImageID;
        Write-Host "Image was created"; 
        
        # media options 
        $mco = New-Object Sitecore.Resources.Media.MediaCreatorOptions
        $mco.Database = [Sitecore.Configuration.Factory]::GetDatabase("master");
        $mco.Versioned = [Sitecore.Configuration.Settings+Media]::UploadAsVersionableByDefault;
        $mco.Destination = $itemPath;
        
        # upload image to sitecore
        $stream = [System.Convert]::FromBase64String("");
        $MemoryStream = [System.IO.MemoryStream]::new($stream)
        $mc = New-Object Sitecore.Resources.Media.MediaCreator
        $file = $mc.CreateFromStream($MemoryStream, "cluster.png", $mco);
        
        # update image fields
        $item.Editing.BeginEdit();
        $item["Alt"] = "cluster";
        $item.Editing.EndEdit() | Out-Null
        Write-Host "Image fields was updated"; 
        
        
    } else {
        Write-Host "Item exists";
    }
    
