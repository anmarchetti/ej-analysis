SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Special Request Settings"
    $templateId = "{6F58FE4B-8620-4381-95BD-9F66CEB9F591}"
    
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -eq $null){
        Write-Host "Creating item"
        
        $item = New-Item -Path $itemPath -ItemType $templateId
        
        $item.Editing.BeginEdit()
        $item.Fields["IsSpecialRequestActive"].Value = "1"
        $item.Fields["IsEligibleForDC"].Value = "1"
        $item.Fields["IsEligibleForHBG"].Value = "0"
        $item.Fields["ChangeSsrElligableInHours"].Value = 48
        $item.Editing.EndEdit()
    } else{
        Write-Host "Item already created"
    }
    
    Write-Host "Script is completed"
    
