- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemTradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags'
    
    function create-lang-version ($itemPath,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $itemPath -Language $lang
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Path $itemPath -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    			$targetLangItem = Get-Item -Path $itemPath -Language $lang
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $itemPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    create-lang-version -itemPath $itemTradePath -lang 'en' -field 'IncludedBagsLabel' -value '{count} x small under seat bags'
    create-lang-version -itemPath $itemTradePath -lang 'en' -field 'IncludedWithInfantLabel' -value '{count} x small under seat bags, {infantCount} x baby change bags'
    create-lang-version -itemPath $itemTradePath -lang 'en' -field 'OverheadBagAddedLabel' -value '{count} x large overhead cabin bags with speedy boarding'
    create-lang-version -itemPath $itemTradePath -lang 'en' -field 'IncludedIcon' -value '<image mediaid="{CB598726-D37F-4F61-8B1C-B7A9DEF9DEE9}" />'
    create-lang-version -itemPath $itemTradePath -lang 'en' -field 'OverheadAddedIcon' -value '<image mediaid="{D04439D4-A1E7-409F-B074-CBA5D1B14D5E}" />'
