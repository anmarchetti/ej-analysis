SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
        	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
        		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        	}
        
        	if ($null -ne $field) {
        		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        		$targetLangItem.Editing.BeginEdit()
        		$targetLangItem[$field] = $value
        		$targetLangItem.Editing.EndEdit() | Out-Null
        	}
        }
    
    
    $itemHol = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Compare Price Modules/Price Graph and Calendar Module"
    $itemTrade = gi -Path "/sitecore/content/EasyJet/TradePortal/Data/Compare Price Modules/Price Graph and Calendar Module"
    
    $itemHol.Editing.BeginEdit()
    $itemHol["RoomOrBoardChangesAreRequiredLabel"] = "Room and/or board changes are required"
    $itemHol["RoomOrBoardChangesAreRequiredTitle"] = "Room and/or board changes are required on the selected days"
    $itemHol["RoomOrBoardChangesAreRequiredDescription"] = "Select 'Review changes' to see a summary of changes to your package. Don't worry you won't apply anything"
    $itemHol["Variant"] = "Calendar First Variant"
    $itemHol.Editing.EndEdit() | Out-Null
    
    $itemTrade.Editing.BeginEdit()
    $itemTrade["RoomOrBoardChangesAreRequiredLabel"] = "Room and/or board changes are required"
    $itemTrade["RoomOrBoardChangesAreRequiredTitle"] = "Room and/or board changes are required on the selected days"
    $itemTrade["RoomOrBoardChangesAreRequiredDescription"] = "Select 'Review changes' to see a summary of changes to your package. Don't worry you won't apply anything"
    $itemTrade["Variant"] = "Calendar First Variant"
    $itemTrade.Editing.EndEdit() | Out-Null
    
    
    @('de-CH','de-DE') | % {
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredLabel" -Value "Zimmer- und/oder Verpflegungsänderungen sind erforderlich"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredTitle" -Value "Zimmer- und/oder Verpflegungsänderungen sind an den ausgewählten Tagen erforderlich"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredDescription" -Value 'Wählen Sie "Änderungen überprüfen", um eine Zusammenfassung der Änderungen an Ihrem Paket zu sehen. Keine Sorge, es wird nichts angewendet'
    }
        
    @('fr-CH','fr-FR') | % {
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredLabel" -Value "Des changements de chambre et/ou de pension sont nécessaires"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredTitle" -Value "Des changements de chambre et/ou de pension sont nécessaires les jours sélectionnés"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredDescription" -Value "Sélectionnez « Examiner les modifications » pour voir un résumé des modifications apportées à votre forfait. Ne vous inquiétez pas, rien ne sera appliqué"
    }
    
    
    
    $calendarDictionary = gi -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Compare Price Module/Calendar View"
    $graphDictionary = gi -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Compare Price Module/Graph View"
    
    $calendarDictionary.Editing.BeginEdit()
    $calendarDictionary["Phrase"] = "Calendar"
    $calendarDictionary.Editing.EndEdit() | Out-Null
    
    $graphDictionary.Editing.BeginEdit()
    $graphDictionary["Phrase"] = "Graph"
    $graphDictionary.Editing.EndEdit() | Out-Null
    
    $calendarDictionaryTrade = gi -Path "/sitecore/content/EasyJet/TradePortal/Dictionary/Compare Price Module/Calendar View"
    $graphDictionaryTrade = gi -Path "/sitecore/content/EasyJet/TradePortal/Dictionary/Compare Price Module/Graph View"
    
    $calendarDictionaryTrade.Editing.BeginEdit()
    $calendarDictionaryTrade["Phrase"] = "Calendar"
    $calendarDictionaryTrade.Editing.EndEdit() | Out-Null
    
    $graphDictionaryTrade.Editing.BeginEdit()
    $graphDictionaryTrade["Phrase"] = "Graph"
    $graphDictionaryTrade.Editing.EndEdit() | Out-Null
    
    @('de-CH','de-DE') | % {
        	Create-Lang-Version -Item $calendarDictionary -Lang $_ -Field "Phrase" -Value "Kalender"
        	Create-Lang-Version -Item $graphDictionary -Lang $_ -Field "Phrase" -Value "Diagramm"
    }
        
    @('fr-CH','fr-FR') | % {
        	Create-Lang-Version -Item $calendarDictionary -Lang $_ -Field "Phrase" -Value "Calendrier"
        	Create-Lang-Version -Item $graphDictionary -Lang $_ -Field "Phrase" -Value "Graphique"
    }
