  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Change-Category ($page,$category) {
    	if ($page -ne $null) {
    		$page.Editing.BeginEdit();
    		$page["PageCategory"] = $category.Name
    		$page.Editing.EndEdit() | Out-Null
    		Write-Host "Page Category" $category.Name "set"
    	}
    }
    
    $pageFlights = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Flight" -ErrorAction SilentlyContinue
    $pageTransfers = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Change Transfer" -ErrorAction SilentlyContinue
    $pageCategory = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Seo Settings/Page Categories" -ItemName "Post-Booking" -TemplateId "{93ED4EC6-CF2B-43F5-B12C-A163CB3698C1}"
    
    Change-Category -Page $pageFlights -Category $pageCategory
    Change-Category -Page $pageTransfers -Category $pageCategory 
