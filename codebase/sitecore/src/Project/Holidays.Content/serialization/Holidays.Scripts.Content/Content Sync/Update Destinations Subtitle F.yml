ID: "5be76717-bf20-443e-a94f-8d2801ac8621"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Destinations Subtitle For holidays or breaks
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $destinationsFolderPath = "/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $countryTemplateId = [id]::Parse("{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}");
    $regionTemplateId = [id]::Parse("{2F42EC14-7E56-467A-B300-AB9723C74546}");
    $resortTemplateId = [id]::Parse("{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}");
    $allowedTemplates = @(
    	"{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}";
    	"{2F42EC14-7E56-467A-B300-AB9723C74546}";
    	"{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}";
    )
    
    $props = @{
    	Index = "sitecore_master_index"
    	Where = ' Path.StartsWith(@3) And (TemplateId = @0 Or TemplateId = @1 Or TemplateId = @2)'
    	WhereValues = $countryTemplateId,$regionTemplateId,$resortTemplateId,$destinationsFolderPath
    }
    
    $items = Find-Item @props
    
    $keyWord = "City"
    $holidaysSubtitle = "Holidays"
    $breaksSubtitle = "Breaks"
    
    
    if ($items -ne $null) {
    	foreach ($item in $items) {
    		if ($allowedTemplates -contains $item.TemplateId) {
    			$upadingItem = $item.GetItem()
    
    			$upadingItem.Editing.BeginEdit()
    			if ($upadingItem.Name.EndsWith($keyWord)) {
    				$upadingItem["Subtitle"] = $breaksSubtitle
    			}
    			else {
    				$upadingItem["Subtitle"] = $holidaysSubtitle
    			}
    			$upadingItem.Editing.EndEdit() > $null
    		}
    	}
    }
    
