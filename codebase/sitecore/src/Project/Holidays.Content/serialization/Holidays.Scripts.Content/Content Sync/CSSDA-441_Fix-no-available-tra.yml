Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-441_Fix-no-available-transfer-popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendDatesSummaryPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    $amendDatesSummaryPageRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Dates/Amend Dates Summary" -ErrorAction SilentlyContinue;
    $unAvailablePopupRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend No Transfers Popup" -ErrorAction SilentlyContinue; 
    
    if ($unAvailablePopupRendering -ne $null) {
        $popupRenderingInstance = Get-Rendering -Item $amendDatesSummaryPage -Rendering $unAvailablePopupRendering;
        $amendDatesSummaryRenderingInstance = Get-Rendering -Item $amendDatesSummaryPage -Rendering $amendDatesSummaryPageRendering;
        
        if ($amendDatesSummaryRenderingInstance -ne $null -and $popupRenderingInstance -ne $null) {
            $popupRenderingInstance.Placeholder = "/body/no-transfers-popup-" + $amendDatesSummaryRenderingInstance.UniqueId + "-0";
            Set-Rendering -Item $amendDatesSummaryPage -Instance $popupRenderingInstance;
            
            Write-Host $amendDatesSummaryPage.Name "Updated";
        }
    }
