    function Create-Popup($project, $parent){
        $parentPath = "/sitecore/content/EasyJet/Holidays/Data/$parent"
        $popup = Create-SUP-Popup -Path $parentPath
        
        $renderingInstance = Get-Item -Path "master:" -Id "{B18C530B-4A39-49D3-81FB-25A0E64182BD}" | New-Rendering
        $homePage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home"
        $searchPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
        
        Add-Rendering -Item $homePage -Instance $renderingInstance -PlaceHolder 'body' -DataSource $popup.ID
        Add-Rendering -Item $searchPage -Instance $renderingInstance -PlaceHolder 'body' -DataSource $popup.ID
        Write-Host "Single use popup was added to page on " $homePage " and " $searchPage
        
        if($project -eq 'Holidays') {
            foreach ($lang in $translationsSE.Keys) {
                foreach ($fieldName in $fields) {
                    create-lang-version -item $popup -lang $lang -field $fieldName -value $translationsSE[$lang][$fieldName]
                }
                
                Write-Host "$popup Single Use Promo Code Data Translated on" $lang
            }        
        }
    }
    
    Create-Popup -Project 'Holidays' -Parent 'Single Use Promo Code Data'
    
    Write-Host "Script PC-608 Single Use Promocode Popup is completed"
    
