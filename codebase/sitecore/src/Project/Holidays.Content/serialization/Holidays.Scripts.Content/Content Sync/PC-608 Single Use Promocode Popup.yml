    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        
        return $item
    }
    
    # Single Use Promocode Popup DS creating
    function Create-SUP-Popup($path){
        $popupTemplateId = '{0F70AD1D-F74F-48E2-8F8A-5910A9F716EA}'
        $banner = Get-Or-Create-Item -Path $path -Template $popupTemplateId
        
        if($banner -ne $null) {
            $banner.Editing.BeginEdit()
            $banner['CampaignId'] = "test12"
            $banner['Description'] = "£100 off holidays over £1,000, travelling Jun-Aug 2027. Offer ends 16/05/2027. T&Cs apply."
            $banner['ButtonLabel'] = 'Copy code'
            $banner['MotivationLabel'] = 'Use your unique code below at checkout!'
            $banner['Title'] = '£100 off your summer getaway'
            $banner['MobileTitle'] = 'Welcome back!'
            $banner.Editing.EndEdit() | Out-Null
        }
        
        Write-Host "Single Use Promocode Popup DS created on" $path
        
        return $banner
    }
    
    # holidays popups translations
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
        
    $fields = @('CampaignId','Description','ButtonLabel','MotivationLabel', 'Title', 'MobileTitle')
    $translationsSE = @{
