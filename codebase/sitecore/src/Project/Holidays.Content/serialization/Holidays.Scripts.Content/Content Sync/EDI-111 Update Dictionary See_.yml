Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EDI-111 Update Dictionary See Other Boards"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $key = "BoardTypes.Labels.SeeBoardsOptions"
    $phrase = "See other options" 
    
    $item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/TradePortal/Dictionary//*[@Key='$key']"
    
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["Phrase"] = $phrase
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
