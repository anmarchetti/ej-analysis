    # Function to get or create an item
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
        }
        return $item
    }
    
    # Create or get Page Components folder
    $pageComponentsPath = "master:/content/EasyJet/Holidays/Home/Page Components"
    $pageComponentsFolder = Get-Or-Create-Item -path $pageComponentsPath -templateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create or get UK folder
    $ukFolderPath = "master:/content/EasyJet/Holidays/Home/Page Components/UK"
    $ukFolder = Get-Or-Create-Item -path $ukFolderPath -templateId "{577146F6-301B-4514-BF73-D6E73E337452}"
    
    # Create Upcoming Holiday Block item
    $upcomingHolidayBlockPath = "master:/content/EasyJet/Holidays/Home/Page Components/UK/Upcoming Holiday Block"
    $upcomingHolidayBlock = Get-Or-Create-Item -path $upcomingHolidayBlockPath -templateId "{FB0A7496-225D-48AC-8B5C-A44BD5841C08}"
    
    # Set field values
    if ($upcomingHolidayBlock -ne $null) {
        $upcomingHolidayBlock.Editing.BeginEdit()
        $upcomingHolidayBlock["HeaderText"] = "Get ready for your upcoming holiday"
        $upcomingHolidayBlock["CTAText"] = "Manage your holiday"
        $upcomingHolidayBlock.Editing.EndEdit() | Out-Null
    }
