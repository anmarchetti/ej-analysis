Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-9 add language selector"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId,$forceId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId -ForceId $forceId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    function Create-Lang-Version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        $targetLangItem.Editing.BeginEdit()
        $targetLangItem[$field] = $value;
        $targetLangItem.Editing.EndEdit() | Out-Null
    }
    
    function Get-Sorted-Ids($items,$firstCode) {
        $itemIds = @()
        $first = @( $items | Where-Object { $_.Code -eq $firstCode } | Select-Object -First 1 )
        $rest = $items | Where-Object { $_.Code -ne $firstCode }
        
        ($first + $rest) | % {
            $itemIds += $_.Id
        }
        
        return $itemIds -join "|"
    
    }
    
    $folderTemplateId = "{8F5F1F03-F1AE-4615-8DAF-FF20C120D7CB}"
    $optionTemplateId= "{58C20F76-C12B-4C86-8549-9E1A74E3E0C5}"
    
    $popupTitles = @(
        @{
            Lang = "fr-CH";
            Title = "Sélectionnez votre langue"
        },
        @{
            Lang = "de-CH";
            Title = "Wählen Sie Ihre Sprache"
        })
        
    $langOptions = @(
        @{
            Name = "English";
            Title = "English (EN)";
            Code = "en";
            Image = '<image mediaid="{6E5A4A20-5384-46DD-B928-747AE66993CC}" />'
        },
        @{
            Name = "French Swiss";
            Title = "Français Suisse (FR-CH)";
            Code = "ch-fr";
            Image = '<image mediaid="{CC012DD1-3A05-4D1E-8267-7593DD0F57C8}" />'
        },
        @{
            Name = "German Swiss";
            Title = "Deutsch Schweiz (DE-CH)"; 
            Code = "ch-de";
            Image = '<image mediaid="{CC012DD1-3A05-4D1E-8267-7593DD0F57C8}" />'
    })
    
    # Create Language Selector
    $selector = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Language Selector" -TemplateId $folderTemplateId
    
    $itemIds = @();
    
    foreach ($opt in $langOptions) {
        $optItem = Get-Or-Create-Item -Path "$($selector.Paths.FullPath)/$($opt.Name)" -TemplateId $optionTemplateId
        $optItem.Editing.BeginEdit()
        $optItem["Title"] = $opt.Title;
        $optItem["Code"] = $opt.Code;
        $optItem["Icon"] = $opt.Image;
        $optItem.Editing.EndEdit() | Out-Null
        
        Create-Lang-Version -Item $optItem -Lang "fr-CH" -Field "Title" -Value $opt.Title
        Create-Lang-Version -Item $optItem -Lang "de-CH" -Field "Title" -Value $opt.Title
        
        
        $itemIds += @{
            "Code" = $opt.Code;
            "Id" = $optItem.Id
        }
    }
    
    $selector.Editing.BeginEdit()
    $selector["PopUpTitle"] = "Select your language";
    $selector["Items"] = Get-Sorted-Ids -items $itemIds -firstCode "en";
    $selector.Editing.EndEdit() | Out-Null
    
    
    Create-Lang-Version -Item $selector -Lang "fr-CH" -Field "Items" -Value (Get-Sorted-Ids -items $itemIds -firstCode "ch-fr")
    Create-Lang-Version -Item $selector -Lang "de-CH" -Field "Items" -Value (Get-Sorted-Ids -items $itemIds -firstCode "ch-de")
    foreach($title in $popupTitles) {
        Create-Lang-Version -Item $selector -Lang $title.Lang -Field "PopUpTitle" -Value $title.Title
    }
    
    $header = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Full Header" -ErrorAction SilentlyContinue
    
    if ($header -ne $null) {
        
        #$header.Editing.BeginEdit()
        #$header["LanguageSelector"] = $selector.Id
        #$header.Editing.EndEdit() | Out-Null
        
        Create-Lang-Version -Item $header -Lang "fr-CH" -Field "LanguageSelector" -Value $selector.Id
        Create-Lang-Version -Item $header -Lang "de-CH" -Field "LanguageSelector" -Value $selector.Id
    }
   
