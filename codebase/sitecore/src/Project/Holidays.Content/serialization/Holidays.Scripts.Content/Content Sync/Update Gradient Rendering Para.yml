Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Update Gradient Rendering Parameter for Generic Pages Hero Banners
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $rootInfoPath = '/sitecore/content/EasyJet/Holidays/Home/Root/Info'
    $genericTemplateId = "{D6E273D0-4C78-4ABD-B412-5C98E7C9DB94}"
    $pageHeroBannerRenderingId = "{8697E1B1-A31B-4641-B6F9-0DBC289C5B59}"
    
    function Update-Banner-Parameter($page) {
        $rendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $pageHeroBannerRenderingId } | Select -First 1
        if($rendering -ne $null){
            Set-Rendering -Item $page -Instance $rendering -Parameter @{"ShowImageGradient"= "1";"TextOrder"=""} -FinalLayout
            Write-Host "Update rendering" $page.Name
        }
    }
    
    function Update-Generic-Pages($path) {
        $genericPages = Get-ChildItem -Path $path | Where { $_.TemplateID -eq  $genericTemplateId}
        
        foreach($page in $genericPages){
            # Update current page banner
            Update-Banner-Parameter -Page $page
          
            # Update children generic pages
            Update-Generic-Pages -Path $page.FullPath
        }
    }
    
    Update-Generic-Pages -Path $rootInfoPath
    
    
