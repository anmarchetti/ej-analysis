- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendPassengersComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Change Passengers Details";
    $amendPassengersComponentItem =  Get-Item -Path $amendPassengersComponentPath -ErrorAction SilentlyContinue;
    
    if ($amendPassengersComponentItem -ne $null) {
        $amendPassengersComponentItem.Editing.BeginEdit();
    
        $amendPassengersComponentItem["ErrorPopupTitle"]='Change failed';
        $amendPassengersComponentItem["ErrorPopupIcon"]='<image mediaid="{A484212A-377A-4DC9-8754-BABFE7701E3D}" />';
        $amendPassengersComponentItem["ErrorPopupSubtext"]="<p>We've been unable to make this change to your passengers.</p><p>Please try again or call the call centre for additional support. {number}</p>";
        
        $amendPassengersComponentItem.Editing.EndEdit() | Out-Null;
        Write-Host $amendPassengersComponentItem.Name "Updated"
    }
