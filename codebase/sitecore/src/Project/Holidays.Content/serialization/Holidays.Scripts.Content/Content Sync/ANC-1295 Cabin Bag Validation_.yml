    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function create-lang-version ($itemPath,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $itemPath -Language $lang
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Path $itemPath -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    			$targetLangItem = Get-Item -Path $itemPath -Language $lang
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $itemPath -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index, $parameters){
            $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
            if($parameters -ne $null)
            {
                Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -Parameter $parameters -DataSource $datasource -Index $index
            }
            else
            {
                Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
            }
    }
    
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $sign){
            $index = 0
            Get-Rendering -Item $item |
            Foreach-Object { 
                $index++
                if($_.ItemId -eq $renderingId)
                {
                    
                        $incrementIndex = $index
                        if ($sign -ne 0){
                            $incrementIndex = $index + $sign
                        }
                    
                        Add-New-Rendering -Item $item -Placeholder 'body' -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex -Parameters $parameters
                }
            }
    }
    
