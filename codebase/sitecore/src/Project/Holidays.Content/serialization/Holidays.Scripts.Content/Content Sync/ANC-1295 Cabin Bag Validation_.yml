    Add-Rendering-To -item $bookingPageTrade -renderingId '{8AE530B1-7702-48B7-A4B9-442E50845EFA}'  -newRenderingId '{373CCDB1-97B0-426D-B6BF-2A525AE3621E}' -datasource $dataTrade -sign -1
    
