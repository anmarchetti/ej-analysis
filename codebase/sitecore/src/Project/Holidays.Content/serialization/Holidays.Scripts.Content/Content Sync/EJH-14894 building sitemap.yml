  Hint: Script
  Value: |
    $countriesSitemapPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Countries"
    $regionsSitemapPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Regions"
    $resortsSitemapPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Resorts"
    $offersSitemapPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Offers"
    $helpfulLinksSitemapPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Helpful links"
    
    $countryTemplateId = "{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}"
    $regionTemplateId = "{2F42EC14-7E56-467A-B300-AB9723C74546}"
    $virtualRegionTemplateId = "{799ECB20-C605-4A6C-A32B-27222BDBB91E}"
    $resortTemplateId = "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}"
    
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null)
        {
            $item = New-Item -Path $path -ItemType $templateId
        }
        
        return $item
    }
    
    function Update-Sitemap($item, $template, $isGroupped, $title, $name, $sortorder){
        $item.Editing.BeginEdit()
        if ($title -ne $null){
           $item.Fields["Title"].Value = $title 
        }
        
        if ($name -ne $null){
           $item.Name = $name
        }
        
        $item.Fields["__sortorder"].Value = $sortorder
        $item.Fields["IsGroupedAlphabetically"].Value = $isGroupped
        $item.Fields["PageTemplates"].Value = $template
        $item.Editing.EndEdit()
    }
    
    $holidayTypesSitemapItem = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components/Sitemap Block/Holiday Types" -TemplateId "{AD06F4F5-2C32-48EE-AAF5-0EF4D64C37E9}"
    Update-Sitemap -Item $holidayTypesSitemapItem -Template "{C6C7FCEF-96CD-4D17-81C1-80CDA7873612}" -IsGroupped "0" -Title "Holiday types" -SortOrder "500"
    
    $countriesSitemapItem = Get-Item -Path $countriesSitemapPath
    Update-Sitemap -Item $countriesSitemapItem -Template $countryTemplateId -IsGroupped "1" -SortOrder "100"
    $regionsSitemapItem = Get-Item -Path $regionsSitemapPath
    Update-Sitemap -Item $regionsSitemapItem -Template "$($regionTemplateId)|$($virtualRegionTemplateId)" -IsGroupped "1" -SortOrder "200"
    $resortsSitemapItem = Get-Item -Path $resortsSitemapPath
    Update-Sitemap -Item $resortsSitemapItem -Template $resortTemplateId -IsGroupped "1" -SortOrder "300"
    
    $offersSitemapItem = Get-Item -Path $offersSitemapPath -ErrorAction SilentlyContinue
    if($offersSitemapItem -ne $null){
        Update-Sitemap -Item $offersSitemapItem -IsGroupped "0" -Title "Deals" -Name "Deals" -SortOrder "400"
    }
    
    $helpfulLinksSitemapItem = Get-Item -Path $helpfulLinksSitemapPath
    Update-Sitemap -Item $helpfulLinksSitemapItem -SortOrder "600"
