Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Remove outdated change booking items
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Remove Change Booking Settings
    Get-Item -Path 'master:/content/EasyJet/Holidays/Settings/Change Booking Settings' -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    
    # Remove Confirm Page for Change Booking
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/Check And Confirm' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -Permanently
    
    # Remove Check And Confirm Page from Page Design
    $designItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Slim Design" -ErrorAction SilentlyContinue
    $pageTemplateId = "{AD6B7F4F-48B0-4EC9-AE43-FFE895BEE377}"
    if ($designItem -ne $null) {
    	[Sitecore.Data.Fields.MultilistField]$field = $designItem.Fields["PageTemplates"]
    
    	if ($field.Contains($pageTemplateId)) {
    		$designItem.Editing.BeginEdit()
    		$field.remove($pageTemplateId)
    		$designItem.Editing.EndEdit() | Out-Null
    		Write-Host "Check And Confirm Page removed from Slim Design"
    	}
    }
    
    # Remove unused Disruption data sources
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Booking Disruption' -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Credit Booking Disruption' -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    Get-Item -Path 'master:/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Credit or Amend Booking' -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
    
    
