    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $itemToCreateExist
    }
    
    function create-lang-version($item, $lang, $field, $value, $param) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index){
    	$defaultLayout = Get-LayoutDevice "Default"
    	$renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
    	$renderingInstance = Get-Rendering -Item $item -PlaceHolder $placeholder -Device $defaultLayout -FinalLayout | Where-Object {$_.ItemId -eq $renderingId}
    	
    	if ($renderingInstance -eq $null)
    	{
    		Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index -FinalLayout
    
    		Write-Host "Successfully created rendering with datasource:" $datasource
    	}
    }
    
    function Update-ParntershipRendering($item, $placeholder, $renderingId){
    	$defaultLayout = Get-LayoutDevice "Default"
    	$renderingInstance = Get-Rendering -Item $item -Device $defaultLayout -FinalLayout | Where-Object {$_.ItemId -eq $renderingId}
    	
    	if ($renderingInstance -ne $null)
    	{
    	    $parameters = [ordered]@{"Theme"="Without%20Live%20Price&amp;IsLogoBackgroundTransparent&amp;ForceReloadChildren"}
    		Set-RenderingParameter -Instance $renderingInstance -Parameter $parameters
            Set-Rendering -Instance $renderingInstance -Item $item -FinalLayout
    		
    		Write-Host "Successfully updated rendering:" $renderingId
    	}
    }
    
    function create-banners($website) {
    		
    	# Create External Banners Folder
    	$dataPath = "/sitecore/content/EasyJet/" + $website + "/Data"
    	$externalExtrasBannersPath = $dataPath + "/External Extras Banners"
    
    	create-item -Path $dataPath -ItemName "External Extras Banners" -ItemType "{5879CF45-BEB4-48F9-9FEC-EC7AE107CF0F}"
    
    	#Create Default Banner
    	$defaultBannerPath =  $dataPath + "/External Extras Banners/Default Banner"
    
    	create-item -Path $externalExtrasBannersPath -ItemName "Default Banner" -ItemType "{DFA8D57E-A6EC-41C2-8F47-9C8231D88544}"
    
    	# Travel Insurence Banner
    
    	$toursAndExperiences = create-item -Path $defaultBannerPath -ItemName "Tours and experiences" -ItemType "{C5C2275C-B21B-440F-BE24-CD8BF783B3BE}"
    
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "Title" -Value "Tours and experiences"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "TitleSuperscript" -Value "FUN DAYS OUT"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "Description" -Value "Check out a wide range of tours, excursions and activities for your holiday."
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "PriceSuperscript" -Value "From"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "Price" -Value "tbd"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "Logo" -Value "<image mediaid='{921C2F6D-8ADA-4D16-888C-FA82FED900F6}' />"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "Image" -Value "<image mediaid='{DD06E99A-B6C9-4164-86E4-8259D277A634}' />"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "CTA" -Value "<link text='View excursions' linktype='external' url='https://experiences.easyjet.com/uk?utm_source=My-Booking-List&amp;utm_campaign=generic&amp;utm_medium=web&amp;aid=easyJet' anchor='' target='_blank' rel='' />"
    	Create-Lang-Version -Item $toursAndExperiences -Lang "en" -Field "__Sortorder" -Value 50
    
    
    	# Airport Parking Banner
    	$airportParking = create-item -Path $defaultBannerPath -ItemName "Airport parking" -ItemType "{C5C2275C-B21B-440F-BE24-CD8BF783B3BE}"
    
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "Title" -Value "Airport parking"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "TitleSuperscript" -Value "BOOK, SAVE & PARK"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "Description" -Value "Make sure you’ve got a spot to park at the airport."
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "PriceSuperscript" -Value "From"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "Price" -Value "tbd"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "Logo" -Value ""
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "Image" -Value "<image mediaid='{384E1D63-AF9F-4BF2-9958-1763199B5AFB}' />"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "CTA" -Value "<link text='Book airport parking' linktype='external' url='https://parking.easyjet.com/easyjetholidays-parking.html' anchor='' target='_blank' rel='' />"
    	Create-Lang-Version -Item $airportParking -Lang "en" -Field "__Sortorder" -Value 100
    
    	# Airport Lounge Banner
    	$airportLounge = create-item -Path $defaultBannerPath -ItemName "Airport lounge" -ItemType "{C5C2275C-B21B-440F-BE24-CD8BF783B3BE}"
    
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "Title" -Value "Airport lounge"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "TitleSuperscript" -Value "RELAX IN STYLE"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "Description" -Value "Relax and enjoy your pre-flight airport experience in comfort."
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "PriceSuperscript" -Value "Reserve from"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "Price" -Value "tbd"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "Logo" -Value ""
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "Image" -Value "<image mediaid='{F525A635-E3D4-44CF-88CA-89BD51069714}' />"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "CTA" -Value "<link text='Book an airport lounge' linktype='external' url='https://parking.easyjet.com/easyjetholidays-lounges.html' anchor='' target='_blank' rel='' />"
    	Create-Lang-Version -Item $airportLounge -Lang "en" -Field "__Sortorder" -Value 150
    
    	# Fast Track Security Banner
    	$fastTrack = create-item -Path $defaultBannerPath -ItemName "Fast track security" -ItemType "{C5C2275C-B21B-440F-BE24-CD8BF783B3BE}"
    
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "Title" -Value "Fast track security"
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "TitleSuperscript" -Value "SKIP THE QUEUES"
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "Description" -Value "Get through the airport quicker with fast track security passes."
