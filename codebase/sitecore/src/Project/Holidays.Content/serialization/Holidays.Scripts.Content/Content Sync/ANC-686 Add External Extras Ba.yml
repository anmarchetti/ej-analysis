    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "Logo" -Value "<image mediaid='{523DB63A-1EB9-4C00-9415-3890488B4E7A}' />"
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "Image" -Value "<image mediaid='{F9FDD4ED-E90D-4325-80B5-C0AE26ECB213}' />"
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "CTA" -Value "<link text='Book fast track' linktype='external' url='https://fasttrack.easyjet.com' anchor='' target='_blank' rel='' />"
    	Create-Lang-Version -Item $fastTrack -Lang "en" -Field "__Sortorder" -Value 200	
    }
    
    function setup-holidays-pages() {
    	
    	# External Extras Banner Rendering
    	$extrasBannerRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/PageContent/External Extras Banner" 
    	$extrasBannerRenderingId = "{84E4A703-662D-41CE-9A3E-86946DF9E04B}"
    	$partnershipComponentRenderingId = "{EF923FE5-72B8-41AE-9D17-BD2B8B99A377}"
    	$placeholder = "/body/component-wrapper-inner-{7C4EF512-A5D3-4AE5-A6AA-D8C893BF4819}-0"
    
    
    	# Add Default Banner to MyBookings
    	$myBookingsPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings"
    	$myBookingsPageEn = Get-Item -Path $myBookingsPagePath -Language "en"
    
    	$datasourceDefaultBanner = "/sitecore/content/EasyJet/Holidays/Data/External Extras Banners/Default Banner"
    	$partnershipComponentDatsource = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/Page Components/Partnership Component"
    
    	# Remove Partnership Component
    	$partnershipRendering = Get-Item -Path '/sitecore/layout/Renderings/Feature/PageContent/Partnership Component'
    	$partnershipComponent = Get-Rendering -Item $myBookingsPageEn -Rendering $partnershipRendering
    
    	if ($partnershipComponent -ne $null) {
    	    Write-Host "Start removing partnership component"
            Remove-Rendering -Item $myBookingsPageEn -Instance $partnershipComponent
            Write-Host "Partnership component was removed from My_Bookings"
        } else {
            Write-Host "Partnership component not found"
        }
    
    	# Add Partnership Component to existing markets
    	$myBookingsPageDeCh = Get-Item -Path $myBookingsPagePath -Language "de-CH"
    	$myBookingsPageFrCh = Get-Item -Path $myBookingsPagePath -Language "fr-CH"
    	$myBookingsPageFr = Get-Item -Path $myBookingsPagePath -Language "fr-FR"
    	$myBookingsPageDe = Get-Item -Path $myBookingsPagePath -Language "de-DE"
    	
    	Add-New-Rendering -Item $myBookingsPageDeCh -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId -Datasource $partnershipComponentDatsource -Index 0 
    	Update-ParntershipRendering -Item $myBookingsPageDeCh -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId
    	Write-Host "Partnership component was added to My_Bookings (de-CH)"
    	
    	Add-New-Rendering -Item $myBookingsPageFrCh -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId -Datasource $partnershipComponentDatsource -Index 0
    	Update-ParntershipRendering -Item $myBookingsPageFrCh -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId
    	Write-Host "Partnership component was added to My_Bookings (fr-CH)"
    	
    	Add-New-Rendering -Item $myBookingsPageFr -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId -Datasource $partnershipComponentDatsource -Index 0
    	Update-ParntershipRendering -Item $myBookingsPageFr -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId
    	Write-Host "Partnership component was added to My_Bookings (fr-FR)"
    	
    	Add-New-Rendering -Item $myBookingsPageDe -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId -Datasource $partnershipComponentDatsource -Index 0
    	Update-ParntershipRendering -Item $myBookingsPageDe -Placeholder $placeholder -RenderingId $partnershipComponentRenderingId
    	Write-Host "Partnership component was added to My_Bookings (de-DE)"
    	
    	# Add External Extras Component to EN 
    
    	Add-New-Rendering -Item $myBookingsPageEn -Placeholder $placeholder -RenderingId $extrasBannerRenderingId -Datasource $datasourceDefaultBanner -Index 0
    	
        Write-Host "External Banner Component was added to My_Bookings"
    
    	# Add Default Banner Banner to MyBooking
    	$myBookingPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    	Add-New-Rendering -Item $myBookingPage -Placeholder "/body/external-extras-banner-{5500ac44-5df4-4473-8e8c-ea635a187882}-0" -RenderingId $extrasBannerRenderingId -Datasource $datasourceDefaultBanner  -Index 8
        
        Write-Host "External Banner Component was added to My_Booking"
    
    	# Add Default Banner to Booking Confirmation
    	$bookingConfirmationPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation"
    	$datasourceTrippleBanner = "/sitecore/content/EasyJet/Holidays/Data/External Extras Banners/Default Banner"
    	
    	Add-New-Rendering -Item $bookingConfirmationPage -Placeholder "/body/external-extras-banner-{5d228e7e-0347-4e8e-ac47-d911eba730d7}-0" -RenderingId $extrasBannerRenderingId -Datasource $datasourceDefaultBanner  -Index 1
    	
    	Write-Host "External Banner Component was added to Confirmation Page"
    }
    
    create-banners -Website "Holidays"
    create-banners -Website "TradePortal"
    
    setup-holidays-pages
    
    Write-Host "Script was executed"
