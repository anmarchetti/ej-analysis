  Hint: Script
  Value: |
    $priceJumpPopupSetting = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Price Jump Popup Settings" -ErrorAction SilentlyContinue;
    $priceJumpPopupSettingTemplate = Get-Item -Path "/sitecore/templates/Project/Holidays/Site Settings/Price Jump Popup Settings" -ErrorAction SilentlyContinue;
    
    if ($priceJumpPopupSetting -ne $null) {
        Remove-Item $priceJumpPopupSetting;
        
        Write-Host "Deleted Setting";
    }
     
    if ($priceJumpPopupSettingTemplate -ne $null) {
        Remove-Item $priceJumpPopupSettingTemplate -Recurse;
        
          Write-Host "Deleted Setting template";
    }
    
