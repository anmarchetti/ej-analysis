- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host  "Start script: ANC-521 Cabin Bags on Payment and Confirm Page"
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem["IncludedIcon"] = '<image mediaid="{CB598726-D37F-4F61-8B1C-B7A9DEF9DEE9}" />'
            $targetLangItem["OverheadAddedIcon"] = '<image mediaid="{D04439D4-A1E7-409F-B074-CBA5D1B14D5E}" />'
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $cabinBagsHolidays = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags"
    $cabinBagsTradePortal = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags"
    
    $paymentHolidays = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Payment/Page Components/Payment"
    $paymentTradePortal = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Confirm/Page Components/Payment"
    
    $payBalanceHolidays = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Pay Balance/Page Components/Pay Balance"
    
    $translations = @{
        "en" = @{
            "IncludedBagsLabel" = '{count} x small under seat bags';
            "OverheadBagAddedLabel" = '{count} x large overhead cabin bags with speedy boarding';
            "IncludedWithInfantLabel" = '{count} x small under seat bags, {infantCount} x baby change bags';
        }
        "fr-CH" = @{
            "IncludedBagsLabel" = '{count} x petits sacs sous le siège';
            "OverheadBagAddedLabel" = '{count} x grands sacs de cabine à placer en compartiment supérieur avec embarquement prioritaire';
            "IncludedWithInfantLabel" = '{count} x petits sacs sous le siège, {infantCount} x sacs à langer pour bébé';
        }
        "fr-FR" = @{
            "IncludedBagsLabel" = '{count} x petits sacs sous le siège';
            "OverheadBagAddedLabel" = '{count} x grands sacs de cabine à placer en compartiment supérieur avec embarquement prioritaire';
            "IncludedWithInfantLabel" = '{count} x petits sacs sous le siège, {infantCount} x sacs à langer pour bébé';
        }
        "de-CH" = @{
            "IncludedBagsLabel" = '{count} x kleine Taschen unter dem Sitz';
            "OverheadBagAddedLabel" = '{count} x große Kabinentaschen für die Gepäckablage mit bevorzugtem Boarding';
            "IncludedWithInfantLabel" = '{count} x kleine Taschen unter dem Sitz, {infantCount} x Wickeltaschen für Babys';
        }
        "de-DE" = @{
            "IncludedBagsLabel" = '{count} x kleine Taschen unter dem Sitz';
            "OverheadBagAddedLabel" = '{count} x große Kabinentaschen für die Gepäckablage mit bevorzugtem Boarding';
            "IncludedWithInfantLabel" = '{count} x kleine Taschen unter dem Sitz, {infantCount} x Wickeltaschen für Babys';
        }
    }
    
        
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $cabinBagsHolidays -lang $lang -field "IncludedBagsLabel" -value $translations[$lang]["IncludedBagsLabel"]
        create-lang-version -item $paymentHolidays -lang $lang -field "IncludedBagsLabel" -value $translations[$lang]["IncludedBagsLabel"]
        create-lang-version -item $payBalanceHolidays -lang $lang -field "IncludedBagsLabel" -value $translations[$lang]["IncludedBagsLabel"]
        
        create-lang-version -item $cabinBagsHolidays -lang $lang -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
        create-lang-version -item $paymentHolidays -lang $lang -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
        create-lang-version -item $payBalanceHolidays -lang $lang -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
        
        create-lang-version -item $cabinBagsHolidays -lang $lang -field "IncludedWithInfantLabel" -value $translations[$lang]["IncludedWithInfantLabel"]
        create-lang-version -item $paymentHolidays -lang $lang -field "IncludedWithInfantLabel" -value $translations[$lang]["IncludedWithInfantLabel"]
        create-lang-version -item $payBalanceHolidays -lang $lang -field "IncludedWithInfantLabel" -value $translations[$lang]["IncludedWithInfantLabel"]
    }
    
    create-lang-version -item $cabinBagsTradePortal -lang "en" -field "IncludedBagsLabel" -value $translations[$lang]["IncludedBagsLabel"]
    create-lang-version -item $paymentTradePortal -lang "en" -field "IncludedBagsLabel" -value $translations[$lang]["IncludedBagsLabel"]
    create-lang-version -item $cabinBagsTradePortal -lang "en" -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
    create-lang-version -item $paymentTradePortal -lang "en" -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
    create-lang-version -item $cabinBagsTradePortal -lang "en" -field "IncludedWithInfantLabel" -value $translations[$lang]["IncludedWithInfantLabel"]
    create-lang-version -item $paymentTradePortal -lang "en" -field "IncludedWithInfantLabel" -value $translations[$lang]["IncludedWithInfantLabel"]
        
    
