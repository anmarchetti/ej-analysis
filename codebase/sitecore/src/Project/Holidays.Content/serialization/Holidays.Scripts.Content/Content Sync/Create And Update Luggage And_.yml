    function Get-Or-Create-Item($path, $name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
        
        return $item
    }
    
    function Update-Message-By-Date($item, $dateRange, $data){
        $item.Editing.BeginEdit()
        $item.Fields["StartDate"].Value = $dateRange.StartDate
        $item.Fields["EndDate"].Value = $dateRange.EndDate
        if ($data -ne $null){
            $item.Fields["AlertMessage"].Value = $data.AlretMessage
            $item.Fields["InformationMessage"].Value = $data.InformationMessage
        }
        $item.Editing.EndEdit() > $null
    }
    
    function Update-Baggage-Info($item, $data){
        $item.Editing.BeginEdit()
        $item.Fields["Name"].Value = $data.Name
        $item.Fields["Dimensions"].Value = $data.Dimensions
        $item.Fields["Icon"].Value = $data.Icon
        $item.Fields["Messages"].Value = $data.Messages
        $item.Editing.EndEdit() > $null
    }
    
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index, $parameters){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        if($parameters -ne $null)
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -Parameter $parameters -DataSource $datasource -Index $index
        }
        else
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
        }
    }
    
    function Remove-Renderings-By-RenderingId($item, $renderingId){
        Get-Rendering -Item $item |
        Foreach-Object {
            if($_.ItemId -eq $renderingId)
            {
                Remove-Rendering -Item $item -Instance $_
            }
        }
    }
    
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $parameters, $sign, $specificPlaceholder){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if($index -gt 0)
                {
                    $incrementIndex = $index
                    if ($sing -ne 0){
                        $incrementIndex = $index + $sign
                    }
                
                    if($specificPlaceholder -ne $null){
                        Add-New-Rendering -Item $item -Placeholder "$($_.Placeholder)/$($specificPlaceholder)-$($_.UniqueId)-0" -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex -Parameters $parameters
                    }
                    else{
                        Add-New-Rendering -Item $item -Placeholder $_.Placeholder -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex -Parameters $parameters
                    }
                }
                return
            }
        }
    }
    
    function Add-Rendering-After-With-Specific-Placeholder($item, $renderingId, $newRenderingId, $datasource, $parameters){
        Add-Rendering-To -Item $item -RenderingId $renderingId -NewRenderingId $newRenderingId -Datasource $datasource -Parameters $parameters -Sign 0 -SpecificPlaceholder "bags"
    }
    
    function Add-Rendering-To-Body-Placeholder($item, $renderingId, $newRenderingId, $datasource, $parameters){
        Add-New-Rendering -Item $item -Placeholder "/body" -RenderingId $newRenderingId -Datasource $datasource -Index 0 -Parameters $parameters
    }
    
    function Create-Luggage(){
        for($i = 0; $i -lt $pagesPaths.length; $i++){
            $luggageItem = Get-Or-Create-Item -Path "$($pagesPaths[$i])/Page Components" -Name $luggageFolderName -TemplateId $luggageFolderTemplateId
            $pageitem = Get-Item -Path $pagesPaths[$i]
            
            Add-Rendering-After-With-Specific-Placeholder -Item $pageitem -RenderingId $renderings[$i] -NewRenderingId $bagsComponentId -Datasource $luggageItem.Id -Parameters $parametersPerPage[$pagesPaths[$i]]
            $cabinBagsItem = Get-Or-Create-Item -Path $luggageItem.FullPath -Name $cabinBagsName -TemplateId $baggageFolderTemplateId
            $smallCabinbagsItem = Get-Or-Create-Item -Path $luggageItem.FullPath -Name $smallCabinBagsName -TemplateId $baggageFolderTemplateId
            
            $messageByDateForCabinBagsItem = Get-Or-Create-Item -Path $cabinBagsItem.FullPath -Name $messageByDateBefore10FebName -TemplateId $messageByDateFolderTemplateId
            $messageByDateForSamllCabinBagsItem = Get-Or-Create-Item -Path $smallCabinbagsItem.FullPath -Name $messageByDateOnOrAfter10FebName -TemplateId $messageByDateFolderTemplateId
            
            Update-Message-By-Date -Item $messageByDateForCabinBagsItem -DateRange $beforeDateRange -Data $luggage[$i].Before
            Update-Message-By-Date -Item $messageByDateForSamllCabinBagsItem -DateRange $afterDateRange -Data $luggage[$i].After
            
            $luggage[$i].Before.Messages = $messageByDateForCabinBagsItem.Id
            $luggage[$i].After.Messages = $messageByDateForSamllCabinBagsItem.Id
            
            Update-Baggage-Info -Item $cabinBagsItem -Data $luggage[$i].Before
            Update-Baggage-Info -Item $smallCabinbagsItem -Data $luggage[$i].After
        }
    }
    
    function Update-Policy-Item($item, $data, $dateRange){
        $item.Editing.BeginEdit()
        $item["Title"] = $data.Title
        $item["Description"] = $data.Description
        $item["Link"] = $data.Link
        $item["StartDate"] = $dateRange.StartDate
        $item["EndDate"] = $dateRange.EndDate
        $item.Editing.EndEdit()
    }
    
    function Create-Bags-Policy(){
        $policyBannerItem = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data" -Name $policyBannersFolderName -TemplateId $policyBannersFolder
        $bagsPolicyBannersItem = Get-Or-Create-Item -Path $policyBannerItem.Fullpath -Name $bagsPolicyBannersFolderName -TemplateId $policyBannersFolder
        $updatedBagsPolicyBannerItem = Get-Or-Create-Item -Path $bagsPolicyBannersItem.Fullpath -Name $updatedBagsPolicyBannerName -TemplateId $policyBanner
        Update-Policy-Item -Item $updatedBagsPolicyBannerItem -Data $cabinBagPolicyBannerData -DateRange $afterDateRange
        
        $viewBokingPageItem = Get-Item -Path $pagesPaths[3]
        $confirmatoinPageItem = Get-Item -Path $pagesPaths[4]
        
        Add-Rendering-To-Body-Placeholder -Item $viewBokingPageItem -RenderingId "{3695CE85-3DBD-490F-A31A-A26DB8E4772C}" -NewRenderingId $policyBannerId -Datasource $bagsPolicyBannersItem.Id
        Add-Rendering-To-Body-Placeholder -Item $confirmatoinPageItem -RenderingId "{3695CE85-3DBD-490F-A31A-A26DB8E4772C}" -NewRenderingId $policyBannerId -Datasource $bagsPolicyBannersItem.Id
    }
    
    function Remove-All-Renderigns(){
        for($i = 0; $i -lt $pagesPaths.length; $i++){
            $luggageItem = Get-Or-Create-Item -Path "$($pagesPaths[$i])/Page Components" -Name $luggageFolderName -TemplateId $luggageFolderTemplateId
            $pageitem = Get-Item -Path $pagesPaths[$i]
            Remove-Renderings-By-RenderingId -Item $pageitem -RenderingId $bagsComponentId
            Remove-Renderings-By-RenderingId -Item $pageitem -RenderingId $policyBannerId
        }
    }
    
    Remove-All-Renderigns
