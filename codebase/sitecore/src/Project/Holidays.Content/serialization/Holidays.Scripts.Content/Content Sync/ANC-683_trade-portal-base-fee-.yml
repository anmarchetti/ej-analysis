  Hint: Script
  Value: |
    function Fill-Content-For-Component($itemPath){
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
        
         Write-Host $item["PopupTitle"]
        
        if($item -ne $null){
           $item.Editing.BeginEdit()
        
           $item["PopupTitle"] = "Agent Information"
           $item["AccommodationLabel"] = "Accommodation"
           $item["CommissionLabel"] = "Commission"
           $item["BalanceLabel"] = "Balance"
           $item["VATOnCommissionLabel"] = "VAT on Commission"
           $item["DepositLabel"] = "Deposit"
           $item["TotalPriceLabel"] = "Total Price"
           $item["FeesAndTaxesLabel"] = "Fees and taxes information (Agent only)"
                
           $item.Editing.EndEdit() | Out-Null
        }
    }
        
    $agentInfoPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Summary Trade";
    Fill-Content-For-Component -itemPath $agentInfoPath;
    
