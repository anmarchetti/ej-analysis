  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    # Create and/or update "Full Header And Slim Footer" design
    $fullHeadPath = "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Slim Footer";
    $fullHeadTemplate = "{4B960AA8-24C3-4A4E-A27F-F4718D189EF6}";
    $fullHeadAndSlimFooterItem = Get-Or-Create-Item -path $fullHeadPath -template $fullHeadTemplate;
    if ($fullHeadAndSlimFooterItem -ne $null) {
        $fullHeadAndSlimFooterItem.editing.BeginEdit();
        
        $fullHeadAndSlimFooterItem['Name'] = "Full Header And Slim Footer";
        $fullHeadAndSlimFooterItem['PartialDesigns'] = "{B628B4D0-99B4-4E94-ABA6-F5596D6E4E57}|{8735A907-3443-4361-8EBA-020D02392368}";
        $fullHeadAndSlimFooterItem['PageTemplates'] = "{D8427EBB-A1C9-42C1-B155-BAD302620B9E}|{56A636F9-775C-4BA1-BABE-03EE4B65FED7}|{0F2BB3A3-BA6B-4CF3-9455-2FA30495C558}";
        
        $fullHeadAndSlimFooterItem.editing.EndEdit() | Out-Null;
        Write-Host $fullHeadAndSlimFooterItem.Name "updated";
    }
    
    # Update "Slim design" removing "Amend Flight/Transfers/Passengers" pages from it
    $slimDesignItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Slim Design" -ErrorAction SilentlyContinue;
    if ($slimDesignItem -ne $null) {
        $slimDesignItem.editing.BeginEdit();
        
        $slimDesignItem['PageTemplates'] = "{09BEF082-3309-4083-9F0B-71FB8D60D7F5}|{CBCF50A8-017C-4FBE-A642-55979E8B1877}|{4EDEE9C4-1042-453A-B567-958BE3D89DA5}|{89B3FA91-A1DC-4DCC-B581-51103E374969}|{4CF74561-4E5C-4AFF-8753-A8F15CB35870}|{370185FE-F7FB-4E3C-8C9F-12986570F74F}";
        
        $slimDesignItem.editing.EndEdit() | Out-Null;
        Write-Host $slimDesignItem.Name "updated";
    }
    
