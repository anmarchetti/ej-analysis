- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    $selector = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Language Selector"
    
    $headerDE = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Slim Header" -Lang "fr-CH" -ErrorAction SilentlyContinue
    if ($headerFR -ne $null) {
        
        $headerFR.Editing.BeginEdit()
        $headerFR["LanguageSelector"] = $selector.Id
        $headerFR.Editing.EndEdit() | Out-Null
    }
    
    $headerDE = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Slim Header" -Lang "de-CH" -ErrorAction SilentlyContinue
    if ($headerDE -ne $null) {
        
        $headerDE.Editing.BeginEdit()
        $headerDE["LanguageSelector"] = $selector.Id
        $headerDE.Editing.EndEdit() | Out-Null
    }
    
    $headerEN= gi -Path "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Slim Header" -Lang "en" -ErrorAction SilentlyContinue
    if ($headerEN -ne $null) {
        
        $headerEN.Editing.BeginEdit()
        #$headerEN["LanguageSelector"] = $selector.Id
        $headerEN.Editing.EndEdit() | Out-Null
    }
    
