Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/BANDB-1 - luggage info for iframe"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Data source
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Home/Iframe Promoting Holidays/Page Components/Luggage Information"
    $datasourceTemplateId = "{71C03EB4-8F44-4DEE-B3E2-8AC13A784815}"
    $iframePagePath = "/sitecore/content/EasyJet/Holidays/Home/Iframe Promoting Holidays"
    $renderingId = "{B2106DBF-626C-4A03-9794-295C3288BFC6}"
    
    $iframePageItem = Get-Item -Path "master:" -Query $iframePagePath
    $renderings = Get-Rendering -Item $iframePageItem | Where-Object { $_.ItemID -eq $renderingId }
    $datasource = Get-Item -Database "master" -path $datasourcePath -ErrorAction SilentlyContinue
    
    function updateLuggageText($itemPath, $language, $Bagtranslation, $Defaulttranslation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["HoldBagText"] = $Bagtranslation
            $item["DefaultText"] = $Defaulttranslation
            Write-Host $item $language "updated"
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    if ($datasource -eq $null) {
        # create item
        $datasource = New-Item -Path $datasourcePath -ItemType $datasourceTemplateId
        Add-ItemLanguage -Item $datasource -TargetLanguage "fr-FR"
        Add-ItemLanguage -Item $datasource -TargetLanguage "fr-CH"
        Add-ItemLanguage -Item $datasource -TargetLanguage "de-DE"
        Add-ItemLanguage -Item $datasource -TargetLanguage "de-CH"
        Write-Host "Item" $datasource.Name "successfully created"
        
        foreach($rendering in $renderings){
            $rendering.DataSource = $datasourcePath
            Set-Rendering -Item $iframePageItem -Instance $rendering
        }
    }
    
    updateLuggageText -ItemPath $datasourcePath -Language "en" -Bagtranslation "{number}kg hold bag" -Defaulttranslation "small under seat bag"
    updateLuggageText -ItemPath $datasourcePath -Language "fr-FR" -Bagtranslation "{number}kg sac de rétention" -Defaulttranslation "petit sac sous le siège"
    updateLuggageText -ItemPath $datasourcePath -Language "fr-CH" -Bagtranslation "{number}kg sac de rétention" -Defaulttranslation "petit sac sous le siège"
    updateLuggageText -ItemPath $datasourcePath -Language "de-DE" -Bagtranslation "{number}kg Laderaumbeutel" -Defaulttranslation "kleine Tasche unter dem Sitz"
    updateLuggageText -ItemPath $datasourcePath -Language "de-CH" -Bagtranslation "{number}kg Laderaumbeutel" -Defaulttranslation "kleine Tasche unter dem Sitz"
    
    Write-Host "Finished"
    
