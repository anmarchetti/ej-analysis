Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Shortlist Page
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $itemName, $templateId, $itemId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    function Set-Page-Design($designPath, $pageTemplateId) {
        $designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
        if ($designItem -ne $null) {
             [Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
            
            if(!$pageTemplates.Contains($pageTemplateId)) {
                $designItem.Editing.BeginEdit();
                $pageTemplates.add($pageTemplateId);
                $designItem.Editing.EndEdit() | Out-Null
                Write-Host "Page Templates of" $designItem.Name "are updated"
            }
        }
    }
    
    $pageTemplateId = "{5C4AE9E9-24C0-4052-8197-F27C6789AFED}"
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" -ItemName "Shortlists" -TemplateId $pageTemplateId
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design" -pageTemplateId $pageTemplateId
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create Shortlists component
    $shortlists = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Shortlists" -TemplateId "{EE4766C2-A1E5-41FD-A376-CC451619C6D1}"
    $shortlists.Editing.BeginEdit()
    $shortlists["Title"] = "Shortlist"
    $shortlists.Editing.EndEdit() | Out-Null
    
    # Update Rendering
    $shortlistsRenderingItem = Get-Item -Path "master:" -Id "{35AC69B5-ED99-4141-9653-47876BA4233F}"
    $shortlistsRendering = Get-Rendering -Item $page -PlaceHolder "body" -Rendering $shortlistsRenderingItem 
    if($shortlistsRendering -ne $null){
        $params = @{"FallbackImage"='<image mediaid="{B8BDEFA6-5D0E-4F27-B6C3-53BDD9A3A32C}" />'}
        Set-Rendering -Item $page -Instance $shortlistsRendering -DataSource $shortlists.ID  -Parameter $params
        Write-Host $page.Name  "Rendering successfully updated"
    }
    
