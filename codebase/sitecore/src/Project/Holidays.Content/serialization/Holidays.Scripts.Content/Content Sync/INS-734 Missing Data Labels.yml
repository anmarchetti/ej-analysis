Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-734 Missing Data Labels"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    
    $dates = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Comparison Table/Dates"
    $airport = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Comparison Table/Departure Airport"
    $board = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Comparison Table/Board Type"
    $room = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Comparison Table/Room Type"
    
    # Set languages value
    
    @('en') | % {
    	Create-Lang-Version -Item $dates -Lang $_ -Field "MissingDataLabel" -Value "No dates selected"
    	Create-Lang-Version -Item $airport -Lang $_ -Field "MissingDataLabel" -Value "No airport selected"
    	Create-Lang-Version -Item $board -Lang $_ -Field "MissingDataLabel" -Value "No board selected"
    	Create-Lang-Version -Item $room -Lang $_ -Field "MissingDataLabel" -Value "No room selected"
    }
    
    @('de-CH','de-DE') | % {
    	Create-Lang-Version -Item $dates -Lang $_ -Field "MissingDataLabel" -Value "Kein Datum gewählt"
    	Create-Lang-Version -Item $airport -Lang $_ -Field "MissingDataLabel" -Value "Kein Flughafen gewählt"
    	Create-Lang-Version -Item $board -Lang $_ -Field "MissingDataLabel" -Value "Keine Verpflegung gewählt"
    	Create-Lang-Version -Item $room -Lang $_ -Field "MissingDataLabel" -Value "Kein Zimmer gewählt"
    }
    
    @('fr-CH','fr-FR') | % {
      	Create-Lang-Version -Item $dates -Lang $_ -Field "MissingDataLabel" -Value "Aucunes dates sélectionnées"
    	Create-Lang-Version -Item $airport -Lang $_ -Field "MissingDataLabel" -Value "Aucun aéroport sélectionné"
        Create-Lang-Version -Item $board -Lang $_ -Field "MissingDataLabel" -Value "Aucun type de pension sélectionné"
    	Create-Lang-Version -Item $room -Lang $_ -Field "MissingDataLabel" -Value "Aucune chambre sélectionnée"
    }
