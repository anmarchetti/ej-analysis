Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/TRADE-340 - upd Our Mission Sustainability"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    function Get-Rendering-Index{
        param($item, $renderingUniqueId)
        $i = 0
        
        Get-Rendering -Item $item | ForEach-Object{
            if ($_.UniqueId -eq $renderingUniqueId) {
                return $i
            }
            $i++
        }
        
        return -1
    }
    
    function Create-Data-Source($path, $templateId){
        $item = Get-Or-Create-Item -Path $path -TemplateId $templateId
    
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
    
            $item["Title"] = "Our Mission";
            $item["Description"] = "We want to make a positive impact on the environment and local communities that make our holidays so special. To do this, we’re making responsible travel part of our everyday culture and enabling you – and our partners – to make better holiday choices.";
    
            $item.Editing.EndEdit() | Out-Null
            
            Write-Host "Created data sources: Our Mission text block"
        }
    
        return $item
    }
    
    function Replace-Rendering {
    	param([item]$item,$oldRendering,[string]$placeholder,[int]$index,[string]$datasource,[string]$renderingId)
    
    	#Remove old rendering
    	Remove-Rendering -Item $item -UniqueId $oldRendering.UniqueId
    
    	# Find the rendering item and convert to a rendering
    	$renderingItem = Get-Item -Path "master:" -Id $renderingId | New-Rendering -PlaceHolder $placeholder
    
    	# Add the rendering to the item
    	Add-Rendering -Item $item -PlaceHolder $placeholder -Instance $renderingItem -Index $index -DataSource $datasource
    }
    
    function Remove-Data-Source($path){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
    
        if($item -ne $null){
            $path = $item.FullPath
            Remove-Item -Path $path
        
            Write-Host "Removed data sources: " $path
        }
    }
    
    $sustainabilityPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Sustainability";
    $pageComponentsPath = "$($sustainabilityPagePath)/Page Components"
    
    # Renderings
    # Sustainability Page
    $page = Get-Item -Path $sustainabilityPagePath -ErrorAction SilentlyContinue
    
    # Insert Our Mission rendering after Eco-certified holidays section wrapper
    $ourMissionBannerUid = "{96ddc625-c749-483b-8235-950229fe2f88}"
    
    $insertWrapperIndex = Get-Rendering-Index -Item $page -RenderingUniqueId $ourMissionBannerUid | Select -First 1
    $insertIndex = $insertWrapperIndex + 1
    
    # Add Wrapper Rendering
    $wrapperItem = Get-Item -Path "master:/sitecore/layout/Renderings/Feature/Page Structure/Component Wrapper" | New-Rendering -Placeholder "body"
    Add-Rendering -Item $page -PlaceHolder "body" -Instance $wrapperItem -Index $insertIndex;
    $wrapperRendering = Get-Rendering -Item $page -Index $insertIndex;
    
    # Create Our Mission text block data source
    $textBlockDataSourcePath = "$($pageComponentsPath)/Text Blocks/Our Mission"
    $textBlockTemplateId = "{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}"
    $textDataSource = Create-Data-Source -Path $textBlockDataSourcePath -TemplateId $textBlockTemplateId
    
    # Replace the Our Mission full width banner rendering with text block rendering 
    if($wrapperRendering -ne $null){
        $oldDatasourceId = "{CFB54F8D-DC32-4844-A555-24CB030F8157}"
        $oldRenderingItem = Get-Item -Path "master:/sitecore/layout/Renderings/Feature/PageContent/Full Width Banner"
        $oldRendering = Get-Rendering -Item $page -PlaceHolder "body" -Rendering $oldRenderingItem -DataSource $oldDatasourceId
        $index = $insertIndex + 1
        
        $placeholder = "/body/component-wrapper-inner-$($wrapperRendering.UniqueId)-0"
        $textBlockRenderingId = "{43546A28-D231-4287-96D2-25DEF529F1A5}"
        
        Replace-Rendering -Item $page -OldRendering $oldRendering -PlaceHolder $placeholder -Index $index -DataSource $textDataSource.FullPath -RenderingId $textBlockRenderingId
        
        $params = @{TitlePosition="center"; TitleTag="h2"; ClassName="sustainability-text-block"}
        
        Get-Rendering -Item $page -PlaceHolder $placeholder | Set-RenderingParameter -Parameter $params | Set-Rendering -Item $page
        
        Write-Host $page.Name "renderings successfully updated"
    }
    
    # Remove outdated data sources
    Remove-Data-Source -Path "$($pageComponentsPath)/Text Blocks/Come With Us"
    Remove-Data-Source -Path "$($pageComponentsPath)/Information Banners/Our Mission"
    
    
