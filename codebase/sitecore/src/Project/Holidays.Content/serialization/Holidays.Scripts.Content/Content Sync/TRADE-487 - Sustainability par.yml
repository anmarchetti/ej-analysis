  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -Language "en" -ErrorAction SilentlyContinue
        
        if (-Not $item){
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    # Our partnerships and certifications carousel data sources add button texts
    $carousel = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Sustainability/Page Components/Partnerships Carousel" -TemplateId "{101A3D9C-063B-4DBD-8A28-39EF80F74754}"
    
    if($carousel -ne $null) {
        $carousel.Editing.BeginEdit()
        $carousel["ReadMore"] = "Read more"
        $carousel["ReadLess"] = "Read less"
        $carousel.Editing.EndEdit()
        
        Write-Host "Button text was added to partnerships carousel"
    }
    
