  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$defaultCountryCode,$defaultDialingCode) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	$targetLangItem.Editing.BeginEdit()
    	$targetLangItem["DefaultCountryCode"] = $defaultCountryCode
    	$targetLangItem["DefaultDialingCode"] = $defaultDialingCode
    	$targetLangItem["PasswordValidationRules"] ='<ul><li>A single word between 10-20 characters</li><li>You can use letters, numbers &amp; special characters (except # &amp; + = or space)</li>    <li>You must use at least 1 number, 1 lowercase letter &amp; 1 uppercase letter</li>   <li>It cannot start with a 0</li></ul>'
    	$targetLangItem.Editing.EndEdit()
    }
    
    function create-dictionary-lang-version ($item,$lang,$phrase) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    	$targetLangItem.Editing.BeginEdit()
    	$targetLangItem["Phrase"] = $phrase
    	$targetLangItem.Editing.EndEdit()
    }
    
    $guestDetails = Get-Item "master:/sitecore/content/EasyJet/Holidays/Settings/Guest Details"
    Create-Lang-Version -Item $guestDetails -Lang "en" -defaultCountryCode "GBR" -defaultDialingCode "44"
    Create-Lang-Version -Item $guestDetails -Lang "fr-CH" -defaultCountryCode "CHE" -defaultDialingCode "41"
    Create-Lang-Version -Item $guestDetails -Lang "de-CH" -defaultCountryCode "CHE" -defaultDialingCode "41" 
    
    $mrLabel = Get-Item "master:/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Labels/Titles/Mr"
    create-dictionary-lang-version -Item $mrLabel -Lang "fr-CH" -phrase "M." 
    create-dictionary-lang-version -Item $mrLabel -Lang "de-CH" -phrase "Herr" 
    
    $msLabel = Get-Item "master:/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Labels/Titles/Ms"
    create-dictionary-lang-version -Item $msLabel -Lang "fr-CH" -phrase "Mlle" 
    create-dictionary-lang-version -Item $msLabel -Lang "de-CH" -phrase "Frau" 
    
    $mrsLabel = Get-Item "master:/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Labels/Titles/Mrs"
    create-dictionary-lang-version -Item $mrsLabel -Lang "fr-CH" -phrase "Mme" 
