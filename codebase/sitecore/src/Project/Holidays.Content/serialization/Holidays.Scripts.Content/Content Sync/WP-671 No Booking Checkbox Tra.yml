- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Daten für mehrere Sitecore-Items
    $data = @{
        Items = @(
            @{
                Path = "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form";
                Fields = @{
                    NoBookingYetLabel = @(
                        @{ Language = "en"; Text = "I haven't booked yet" },
                        @{ Language = "de-DE"; Text = "Ich habe noch nicht gebucht" },
                        @{ Language = "de-CH"; Text = "Ich habe noch nicht gebucht" },
                        @{ Language = "fr-CH"; Text = "Je n'ai pas encore réservé" },
                        @{ Language = "fr-Fr"; Text = "Je n'ai pas encore réservé" }
                    )
                }
            },
            @{
                Path = "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form";
                Fields = @{
                    NoBookingYetLabel = @(
                        @{ Language = "en"; Text = "I haven't booked yet" },
                        @{ Language = "de-DE"; Text = "Ich habe noch nicht gebucht" },
                        @{ Language = "de-CH"; Text = "Ich habe noch nicht gebucht" },
                        @{ Language = "fr-CH"; Text = "Je n'ai pas encore réservé" },
                        @{ Language = "fr-Fr"; Text = "Je n'ai pas encore réservé" }
                    )
                }
            }
            # Weitere Items können hier hinzugefügt werden
        )
    }
    
    # Iteration über jedes Item
    foreach ($itemData in $data.Items) {
        $formPath = $itemData.Path
        Write-Host "--------------------------"
        Write-Host "Updating item: '$formPath'"
        Write-Host "--------------------------"
        $item = Get-Item -Path $formPath -ErrorAction SilentlyContinue
    
        # Überprüfung, ob das Item existiert
        if ($item -eq $null) {
            Write-Host "Item not found at path: $formPath"
            continue
        }
    
        # Verwende GetEnumerator und ForEach-Object zur Iteration über die Felder
        $itemData.Fields.GetEnumerator() | ForEach-Object {
            $fieldName = $_.Key
            $_.Value | ForEach-Object {
                $languageItem = Get-Item -Path $formPath -Language $_.Language -ErrorAction SilentlyContinue
                if ($languageItem -eq $null) {
                    # Erstellt eine neue Sprachversion, falls nicht vorhanden
                    $languageItem = New-Item -Path $formPath -Language $_.Language
                }
    
                # Bearbeite das Item in der entsprechenden Sprache
                $languageItem.Editing.BeginEdit()
                $languageItem[$fieldName] = $_.Text
                $languageItem.Editing.EndEdit() | Out-Null
    
                Write-Host "Updated field '$fieldName' for language '$($_.Language)' with text: $($_.Text)"
            }
        }
    }
    Write-Host "Update process for all items completed."
    
