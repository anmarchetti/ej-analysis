Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SEATS-636 Update placeholder for rendering Seat Map"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    <#
     Set placeholder value for the item "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking" for rendering Seat Map.
    #>
    
    $viewBookingPage = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking" -ErrorAction SilentlyContinue
    $placeholderValue = "/body/seats-and-bags-{a0c9d3d6-ce99-4d98-b482-df23906098ac}-0/seat-map-{49db3c5d-c6b7-4613-a0e1-855ae9e7303a}-0"
    $renderingId = "{028B6619-F820-4D8D-891B-66839B228406}"
    
    $defaultLayout = Get-LayoutDevice "Default"
    
    if ($viewBookingPage -eq $null)
    {
    	Write-Host "Item not found: /sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking"
    	return;
    }
    
    $seatMapTradeRendering = Get-Rendering -Item $viewBookingPage -UniqueId $renderingId -Device $defaultLayout -FinalLayout 
    
    if($seatMapTradeRendering -eq $null)
    {
        Write-Host "Rendering Seat Map not found"
    	return;
    }
    
    Set-Rendering -Item $viewBookingPage -Instance $seatMapTradeRendering -PlaceHolder $placeholderValue
    
    Write-host "ANC-636: Update placeHolder for Seat Map rendering"
    Write-host "Script is Complete"
