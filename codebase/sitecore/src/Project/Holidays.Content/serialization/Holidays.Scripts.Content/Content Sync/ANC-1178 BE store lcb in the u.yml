- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
          $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
          
          if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
          }
          
          if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
          }
        }
        
        $holdLuggageHolidaysSettings = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings" -Language "en" -ErrorAction SilentlyContinue
           
        Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "LargeCabinBagMaxPerPassenger" -Value "1"
        Create-Lang-Version -Item $holdLuggageHolidaysSettings -Lang "en" -Field "LargeCabinBagCode" -Value "SCB1"
        
        $holdLuggageTradePortalSettings = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Settings/Luggage Settings" -Language "en" -ErrorAction SilentlyContinue
           
        Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "LargeCabinBagMaxPerPassenger" -Value "1"
        Create-Lang-Version -Item $holdLuggageTradePortalSettings -Lang "en" -Field "LargeCabinBagCode" -Value "SCB1"
            
        Write-Host "Script was executed"
