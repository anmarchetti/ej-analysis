Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-440-Check TransparentFolder Checkbox"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/ 
    
    $holidaysRootItemPath = "/sitecore/content/EasyJet/Holidays/Home/Root"
    $tradePortalRootItemPath = "/sitecore/content/EasyJet/TradePortal/Home/Root"
    
    $holidayRootItem = Get-Item -path $holidaysRootItemPath -ErrorAction SilentlyContinue
    $tradePortalRootItem = Get-Item -path $tradePortalRootItemPath -ErrorAction SilentlyContinue
    if ($holidayRootItem -ne $null) {
        
        $holidayRootItem.Editing.BeginEdit()
        $holidayRootItem["TransparentItem"] = "1"
        $holidayRootItem.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $holidayRootItem.Name "successfully updated"
    }
    
    if ($tradePortalRootItem -ne $null) {
        
        $tradePortalRootItem.Editing.BeginEdit()
        $tradePortalRootItem["TransparentItem"] = "1"
        $tradePortalRootItem.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $tradePortalRootItem.Name "successfully updated"
    }
