  Hint: Script
  Value: |
    $mixedResultsPath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $item = Get-Item -Path $mixedResultsPath -ErrorAction SilentlyContinue
    
    if($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["TrackingGoal"] = "{DA0FE302-6AED-49A2-9C7A-622D3E6C98F3}"
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
