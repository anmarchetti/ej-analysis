  Hint: Script
  Value: |
    # This is just an Example for ContentSync
    #After SourceRendering is targeting to a new rendering, we need to adjust all renderings to target the new one
    $myRenderings = 
    @(
        @{ 
    
            PagePath       = "/sitecore/content/EasyJet/Holidays/Home/Booking"
            TargetPlaceholder="component-wrapper-left"#New Placeholder
            SourcePlaceholder="component-wrapper-inner"#Old Placeholder
            SourceRenderingId="{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"#Old Rendering
            SourceRenderingIndex=1#optional How many rendering with SourceRenderingId we want to skip
            TargetRenderingId="{1B6F8CC5-F07C-40E8-AAE4-2E70409FB3B6}"#New Rendering
            UpdateFinalLayoutAsWell = 1#optional How many rendering with TargetRenderingId we want to skip
        }
    )
    MoveRenderingChildPlaceholders -renderingInfo $myRenderings
