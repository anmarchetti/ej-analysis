    $holidayshomebookingguestdetailspagecomponentsfphguestdetailsinfo_Id = "{DB27E9C8-4098-41EF-9CB4-04BE348A316B}"
    $fphguestdetailsinfo_guestinformationdescription_db27e9c8409841ef9cb404be348a316b_en_v4 = @"
    Please note that for security reasons, first name and surname for everyone on the booking must match their passport. Changing names after the booking might incur amendment charges. The contact details you provide must be for the lead customer travelling on the booking.
    "@
    $fphguestdetailsinfo_offerssectiondescription1_db27e9c8409841ef9cb404be348a316b_en_v4 = @"
    I want to be first to know about exclusive offers, competitions or the latest updates, and to be inspired by our fabulous holidays and flights destinations and I&rsquo;m happy for easyJet to share my data within its group of companies so we can make our communications with you more personal and relevant.
    "@
    $fphguestdetailsinfo_importantinformation_db27e9c8409841ef9cb404be348a316b_en_v4 = @"
    <p>It&rsquo;s best to take out sufficient travel insurance for you and everyone you&rsquo;re travelling with as soon as you book your trip, in case you need to cancel it as well as covering you while you&rsquo;re away.</p>
    It's your responsibility to ensure that your passport is valid and that you meet the entry requirements for your <a href="https://www.gov.uk/foreign-travel-advice">booking destination</a>.  You can find out more on our <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/travel-information?ecp=FPH" target="_blank">travel&nbsp;information page</a>, including links to check the UK government <a href="https://www.gov.uk/foreign-travel-advice">FCDO travel advice</a> for wherever you're going on trip,&nbsp;and we've also created a <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/holiday-checklist" target="_blank">Flight + Hotel checklist</a>&nbsp;which contains important information and steps to remember.
    Your passport needs to be in good condition and signed, and often valid for a minimum period beyond your trip, usually at least three or six months. It may also be required to be less than 10 years old so you might need to renew it earlier than planned.
    <p style="margin-bottom: 0cm;">You can find information about&nbsp;<a href="https://www.easyjet.com/en/holidays/help?helpCategory=hotel&amp;helpQuestion=hoteltaxes">tourist taxes</a>&nbsp;and&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/flight-plus-hotel/help?helpCategory=visa" target="_blank">visa requirements</a>&nbsp;which apply to your destination in our&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/flight-plus-hotel/help" target="_blank">help centre</a>. </p>
    <p>Please&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/flight-plus-hotel/help/contact-form" target="_blank">contact us</a>&nbsp;to let us know before booking if anyone travelling requires any additional assistance (e.g. difficulty walking).</p>
    <p>If you're travelling as part of a group, please make a single booking. This will mean that if any changes need to be made to your trip, everyone travelling with you is looked after the same way</p>
    "@
    $fphguestdetailsinfo_offerssectiondescription2_db27e9c8409841ef9cb404be348a316b_en_v4 = @"
    Remember you can manage your preferences through your account at any time. View our <a rel="noopener noreferrer" class="text-link" href="https://www.easyjet.com/en/holidays/info/privacy-policy" target="_blank"><strong>privacy policy</strong></a>.
    "@
    $fphguestdetailsinfo_pofferssectiondescription1_db27e9c8409841ef9cb404be348a316b_en_v4 = @"
    Would you also like to receive digital updates about our&nbsp;<a class="text-link" href="https://www.easyjet.com/en/policy/privacy-promise#three" title="Follow link">partners&rsquo; travel related products</a><span>&nbsp;to help you get the most from your trip?</span>
    "@
