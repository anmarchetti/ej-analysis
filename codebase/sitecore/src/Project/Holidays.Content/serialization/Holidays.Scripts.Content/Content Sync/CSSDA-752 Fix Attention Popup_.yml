- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath,$parameters = @{}) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath
    		Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath | Set-RenderingParameter -Parameter $parameters | Set-Rendering -Item $page;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    # Page
    $viewBookingPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $viewBookingPage = Get-Or-Create-Item -Path $viewBookingPagePath
    
    $viewBookingRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/View Booking"
    $viewBookingRendering = Get-Item -Path $viewBookingRenderingPath;
    
    $renderedViewBooking = Get-Rendering -Item $viewBookingPage -Render $viewBookingRendering;
    
    $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $renderigPlaceholder = "/body/attention-popup-" + $renderedViewBooking.UniqueId + "-0";
    
    $existingInventoryErrorPopupPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Inventory Error Popup";
    
    # Get the popup rendering instances on the page
    $renderingInstances = Get-Rendering -Item $viewBookingPage -PlaceHolder $renderigPlaceholder;
    
    $inventoryErrorPopupWithParamsExists = $false
    
    # Check if we already have the correct rendering
    foreach ($renderingInstance in $renderingInstances) {
    	$popupTypeParameter = Get-RenderingParameter -Instance $renderingInstance -Name "popupType";
    	if ($popupTypeParameter.popupType -eq "InventoryError") {
    		Write-Host "Inventory error popup with popupType Parameter already exists"
    		$inventoryErrorPopupWithParamsExists = $true;
    		break;
    	}
    }
    
    if ($inventoryErrorPopupWithParamsExists -eq $false) {
    	if (Get-Rendering -Item $viewBookingPage -PlaceHolder $renderigPlaceholder) {
    		# Add params to new inventory error popup and add it to viewBookingPage rendering
    		Add-Or-Update-Page-Rendering -page $viewBookingPage -renderingPath $renderingPath -renderingPlaceholder $renderigPlaceholder -dataSourcePath $existingInventoryErrorPopupPath -Parameters @{ "popupType" = "InventoryError" }
    		Write-Host "New Inventory Error Popup rendering added or updated with params"
    	}
    } else {
    	Write-Host "Skipping adding inventory error popup since it already exists"
    }
    
    # Iterate through popup rendering instances and remove any without a popupType parameter
    foreach ($renderingInstance in $renderingInstances) {
    	$popupTypeParameter = Get-RenderingParameter -Instance $renderingInstance -Name "popupType";
    	if ($popupTypeParameter -eq $null) {
    		Write-Host "Removing existing popup rendering without a popupType Parameter"
    		Remove-Rendering -Path $viewBookingPagePath -Instance $renderingInstance;
    	}
    }
    
