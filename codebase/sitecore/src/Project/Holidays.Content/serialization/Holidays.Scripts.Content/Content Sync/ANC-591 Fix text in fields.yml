  Hint: Script
  Value: |
    function Create-Component-For-Site($holdLuggageComponentPath, $pagePath){
        # Data source
       $item = Get-Item -Path $holdLuggageComponentPath -ErrorAction SilentlyContinue
        
        if($item -ne $null) {
           $item.Editing.BeginEdit()
            $item["DescriptionNote"] = "* Prices are averaged across both flights in your holiday to get the price you will pay. Prices may vary if you add bags at a later stage."
            $item.Editing.EndEdit() | Out-Null
        }
    
    }
    
    $pagePath = "master:/sitecore/content/EasyJet/TradePortal/Home/Booking"
    $holdLuggageComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage Popup";
    Create-Component-For-Site -holdLuggageComponentPath $holdLuggageComponentPath -pagePath $pagePath
    
