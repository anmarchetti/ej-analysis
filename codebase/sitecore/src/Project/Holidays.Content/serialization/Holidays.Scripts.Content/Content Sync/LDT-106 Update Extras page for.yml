    #insert rendering
    Import-Function "Import Renderings"
    
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking" -ErrorAction SilentlyContinue
    $horizontalWrapperId = "{1B6F8CC5-F07C-40E8-AAE4-2E70409FB3B6}"
    $wrapperRenderingId = "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}"
    $sorterRenderingId = "{DC475304-7A11-4CAE-951F-CCF52920CA67}"
    
    $renderings = Get-Rendering -Item $page -FinalLayout
    
    $horizontalWrapperRenderings = $renderings | Where-Object { $_.ItemId -eq $horizontalWrapperId }
    $horizontalWrapperUniqueId = $horizontalWrapperRenderings[0].UniqueId
    
    $wrapperRenderings = $renderings | Where-Object { $_.ItemId -eq $wrapperRenderingId }
    $wrapperUniqueId = $wrapperRenderings[1].UniqueId
    
    $sorterRenderings = $renderings | Where-Object { $_.ItemId -eq $sorterRenderingId }
    $sorterUniqueId = $sorterRenderings[0].UniqueId
    
    $placeholder = "/body/component-wrapper-left-$($horizontalWrapperUniqueId)-0/component-wrapper-inner-$($wrapperUniqueId)-0/sorter-wrapper-inner-$($sorterUniqueId)-0"
    
    $pageTrade = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking" -ErrorAction SilentlyContinue
    $renderingsTrade = Get-Rendering -Item $pageTrade -FinalLayout
    
    $horizontalWrapperRenderingsTrade = $renderingsTrade | Where-Object { $_.ItemId -eq $horizontalWrapperId }
    $horizontalWrapperUniqueIdTrade = $horizontalWrapperRenderingsTrade[0].UniqueId
    
    $wrapperRenderingsTrade = $renderingsTrade | Where-Object { $_.ItemId -eq $wrapperRenderingId }
    $wrapperUniqueIdTrade = $wrapperRenderingsTrade[1].UniqueId
    
    $placeholderTrade = "/body/component-wrapper-left-$($horizontalWrapperUniqueIdTrade)-0/component-wrapper-inner-$($wrapperUniqueIdTrade)-0"
    
    $myRenderings = @(
