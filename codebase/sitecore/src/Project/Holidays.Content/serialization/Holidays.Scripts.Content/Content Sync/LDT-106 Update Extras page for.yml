            Title          = "Luggage For Luxury Series Flight"
            PagePath       = "/sitecore/content/EasyJet/Holidays/Home/Booking"
            RenderingPath  = "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage For Luxury Series Flight"
            Placeholder    = $placeholder
            PlaceBeforeRenderingPath = "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage/Cabin Bags"
            DataSourcePath = $datasourcePath
            UpdateFinalLayoutAsWell = "1"
        },
    @{ 
            Title          = "Luggage For Luxury Series Flight"
            PagePath       = "/sitecore/content/EasyJet/TradePortal/Home/Booking"
            RenderingPath  = "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage For Luxury Series Flight"
            Placeholder    = $placeholderTrade
            PlaceBeforeRenderingPath = "/sitecore/layout/Renderings/Feature/Ancillaries/Luggage/Cabin Bags"
            DataSourcePath = $datasourcePathTrade
            UpdateFinalLayoutAsWell = "1"
        }
    )
    
    ImportRenderings -renderingsToAttach $myRenderings
