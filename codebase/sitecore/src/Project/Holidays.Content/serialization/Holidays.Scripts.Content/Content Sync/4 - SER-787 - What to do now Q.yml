                    "en" = "holidayshortened"
                }
                "__Sortorder" = @{
                    "en" = "500"
                }
            }
        },
        @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q6"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My holiday can’t go ahead due to widespread disruption"
                    "fr-CH" = "Mes vacances ne peuvent pas avoir lieu en raison de perturbations généralisées."
                    "de-CH" = "Mein Urlaub kann aufgrund weitreichender Störungen nicht stattfinden."
                    "fr-FR" = "Mes vacances ne peuvent pas avoir lieu en raison de perturbations généralisées."
                    "de-DE" = "Mein Urlaub kann aufgrund weitreichender Störungen nicht stattfinden."
                }
                "Answer"= @{
                    "en" = @'
    If travel disruption or another situation beyond our control means we can&rsquo;t fulfil your holiday, we&rsquo;ll cancel it and you can either have a full refund, choose to receive account credit (subject to our Credit on Account Terms and Conditions), or accept a replacement holiday from us of:
    <ul>
        <li>at least equivalent standard and price, if we&rsquo;re able to offer you one or; </li>
        <li>a lower quality holiday, if we&rsquo;re able to offer you one and then we&rsquo;ll refund you any difference in price between your original holiday purchased and the new one.&nbsp;My Holiday is cancelled</li>
    </ul>
    '@
                    "fr-CH" = @'
    Si des perturbations dans les transports ou toute autre situation indépendante de notre volonté nous empêchent de vous fournir vos vacances, nous les annulerons et vous pourrez soit obtenir un remboursement complet, soit choisir de recevoir un crédit sur votre compte (sous réserve de nos conditions générales relatives aux crédits sur compte), soit accepter des vacances de remplacement de notre part :
    <ul>
        <li>un séjour de qualité et de prix au moins équivalents, si nous sommes en mesure de vous en proposer un ; </li>
        <li>un séjour de qualité inférieure, si nous sommes en mesure de vous en proposer un, auquel cas nous vous rembourserons la différence de prix entre votre séjour initial et le nouveau séjour.&nbsp;Mon séjour est annulé</li>
    </ul>
    '@
                    "de-CH" = @'
    Wenn wir aufgrund von Reiseunterbrechungen oder anderen Umständen, die außerhalb unserer Kontrolle liegen, Ihren Urlaub nicht durchführen können, stornieren wir ihn und Sie haben die Wahl zwischen einer vollständigen Rückerstattung, einer Gutschrift auf Ihr Konto (gemäß unseren Bedingungen für Gutschriften auf Konten) oder einem Ersatzurlaub von uns in Form von:
    <ul>
        <li>mindestens gleichwertigem Standard und Preis, sofern wir Ihnen einen solchen anbieten können, oder; </li>
        <li>einer Reise von geringerer Qualität, sofern wir Ihnen eine solche anbieten können, wobei wir Ihnen die Preisdifferenz zwischen Ihrer ursprünglich gebuchten Reise und der neuen Reise erstatten.&nbsp;Meine Reise wurde storniert</li>
    </ul>
    '@
                    "fr-FR" = @'
    Si des perturbations dans les transports ou toute autre situation indépendante de notre volonté nous empêchent de vous fournir vos vacances, nous les annulerons et vous pourrez soit obtenir un remboursement complet, soit choisir de recevoir un crédit sur votre compte (sous réserve de nos conditions générales relatives aux crédits sur compte), soit accepter des vacances de remplacement de notre part :
    <ul>
        <li>un séjour de qualité et de prix au moins équivalents, si nous sommes en mesure de vous en proposer un ; </li>
        <li>un séjour de qualité inférieure, si nous sommes en mesure de vous en proposer un, auquel cas nous vous rembourserons la différence de prix entre votre séjour initial et le nouveau séjour.&nbsp;Mon séjour est annulé</li>
    </ul>
    '@
                    "de-DE" = @'
    Wenn wir aufgrund von Reiseunterbrechungen oder anderen Umständen, die außerhalb unserer Kontrolle liegen, Ihren Urlaub nicht durchführen können, stornieren wir ihn und Sie haben die Wahl zwischen einer vollständigen Rückerstattung, einer Gutschrift auf Ihr Konto (gemäß unseren Bedingungen für Gutschriften auf Konten) oder einem Ersatzurlaub von uns in Form von:
    <ul>
        <li>mindestens gleichwertigem Standard und Preis, sofern wir Ihnen einen solchen anbieten können, oder; </li>
        <li>einer Reise von geringerer Qualität, sofern wir Ihnen eine solche anbieten können, wobei wir Ihnen die Preisdifferenz zwischen Ihrer ursprünglich gebuchten Reise und der neuen Reise erstatten.&nbsp;Meine Reise wurde storniert</li>
    </ul>
    '@
                }
                "NavigationParameter" = @{
                    "en" = "holidaycancelled"
                }
                "__Sortorder" = @{
                    "en" = "600"
                }
            }
        }
        
    )
    ImportContent -itemsToCreate $updates
    
    $page = Get-Item -Path $disruptionPagePath
    $componentWrapperRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $componentWrapperRenderingId}
    $neededWrapper = $componentWrapperRendering[1]
    
    $textBlockRendering = Get-Item -Path $textBlockRenderingPath
    $textBlockInstance = New-Rendering -Item $textBlockRendering 
    
    $qaRendering = Get-Item -Path $qaRenderingPath
    $qaInstance = New-Rendering -Item $qaRendering 
     
     
    $placeholderToClear = "/body/component-wrapper-inner-$($neededWrapper.UniqueId)-0"
     
    $renderings = Get-Rendering -Item $page
    $toRemove = $renderings | Where-Object { $_.Placeholder -eq $placeholderToClear }
     
    if ($toRemove.Count -gt 0) {
        foreach ($r in $toRemove) {
            Write-Host "Remove rendering $($r.ItemId) from $($r.Placeholder)"
            Remove-Rendering -Item $page -Instance $r
        }
        Write-Host "Removed $($toRemove.Count) renderings from $placeholderToClear."
    } else {
        Write-Host "No renderings"
    }
    
    $componentWrapper = Get-Item -Path "/sitecore/layout/Renderings/Feature/Page Structure/Component Wrapper"
    $renderingComponentWrapper = Get-Rendering -Item $page -Rendering $componentWrapper
        
    Set-Rendering -Item $page -Instance $renderingComponentWrapper[1] -PlaceHolder "/body" -Parameter @{ "PaddingBottom" = "Padding Bottom 64px"; "PaddingTop" = "Padding Top 64px"; "PaddingBottomMobile" = "Padding Bottom Mobile 32px"; "PaddingTopMobile" = "Padding Top Mobile 32px"; "Anchor" = "what-to-do-now-section" }
    Add-Rendering -Item $page -Instance $textBlockInstance -Placeholder $placeholderToClear -DataSource "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Section Title" -Index 6 -Parameter @{ "TitleTag" = "h2"; "TitleFontStyle" = "rounded demi"; "TitleFontSize" = "Mobile - 20px Desktop - 32px"; "TitleWeight" = 400; "PaddingSize" = "0px" }
    Add-Rendering -Item $page -Instance $qaInstance -Placeholder $placeholderToClear -DataSource $qaFolderDatasourcePath -Index 7 -Parameter @{ "ZeroMargin" = "1" }
            
            
    Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/During disruption - Questions" -Permanently -Recurse |
    ForEach-Object {   
       $_ | Remove-Item -Recurse -Permanently
    } 
