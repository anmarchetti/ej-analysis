        },
        @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q5"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My holiday was shortened"
                    "fr-CH" = "Mes vacances ont été écourtées"
                    "de-CH" = "Mein Urlaub wurde verkürzt"
                    "fr-FR" = "Mes vacances ont été écourtées"
                    "de-DE" = "Mein Urlaub wurde verkürzt"
                }
                "Answer"= @{
                    "en" = @'
    <p>Having to end your holiday and bring you home early is a last resort, and we recognise how disappointing this can be. If a situation occurs where this becomes necessary, we&rsquo;ll contact you and provide details of your new transfer times (if applicable) and flight times, which may not be for a few days depending on our flight schedule. </p>
    <p>At times of significant travel disruption, we may invite you to make your own return travel arrangements, and possibly to find and book your own overnight hotel. You&rsquo;ll be reimbursed for all&nbsp;<a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">reasonable expenses</span></strong></a> you incur.</p>
    <p>Please know that we&rsquo;ll get you home, even if it cannot happen immediately. In extreme cases, such as a natural disaster, local authorities may take control over a situation and if so, you should follow their instructions. We&rsquo;ll try and keep in touch with you, and you should check your emails and phone regularly. You&rsquo;ll get updates by email and text message to the contact details provided when you booked your holiday.  </p>
    '@
                    "fr-CH" = @'
    <p>Mettre fin à vos vacances et vous ramener chez vous plus tôt que prévu est une solution de dernier recours, et nous comprenons à quel point cela peut être décevant. Si une situation rend cela nécessaire, nous vous contacterons et vous communiquerons les nouveaux horaires de transfert (le cas échéant) et de vol, qui peuvent être décalés de quelques jours en fonction de notre programme de vols. </p>
    <p>En cas de perturbation importante des transports, nous pouvons vous inviter à organiser vous-même votre voyage de retour et, éventuellement, à trouver et réserver vous-même votre hébergement pour la nuit. Vous serez remboursé de toutes les <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">dépenses raisonnables</span></strong></a> que vous aurez engagées.
    <p>Sachez que nous vous ramènerons chez vous, même si cela ne peut se faire immédiatement. Dans des cas extrêmes, tels qu'une catastrophe naturelle, les autorités locales peuvent prendre le contrôle de la situation et, le cas échéant, vous devrez suivre leurs instructions. Nous essaierons de rester en contact avec vous et vous devrez vérifier régulièrement vos e-mails et votre téléphone. Vous recevrez des informations par e-mail et par SMS aux coordonnées fournies lors de la réservation de vos vacances.  </p>
    '@
                    "de-CH" = @'
    <p>Die vorzeitige Beendigung Ihres Urlaubs und Ihre vorzeitige Rückreise sind eine letzte Möglichkeit, und wir sind uns bewusst, wie enttäuschend dies sein kann. Sollte eine Situation eintreten, in der dies notwendig wird, werden wir Sie kontaktieren und Ihnen die neuen Transferzeiten (falls zutreffend) und Flugzeiten mitteilen, die je nach unserem Flugplan möglicherweise erst in einigen Tagen stattfinden. </p>
    <p>Bei erheblichen Reiseunterbrechungen bitten wir Sie möglicherweise, Ihre Rückreise selbst zu organisieren und gegebenenfalls eine Übernachtungsmöglichkeit in einem Hotel zu suchen und zu buchen. Alle Ihnen entstandenen <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">angemessenen Kosten</span></strong></a> werden Ihnen erstattet.
    <p>Bitte beachten Sie, dass wir Sie nach Hause bringen werden, auch wenn dies nicht sofort möglich ist. In Extremfällen, wie z. B. bei Naturkatastrophen, können die lokalen Behörden die Kontrolle über eine Situation übernehmen. In diesem Fall sollten Sie deren Anweisungen befolgen. Wir werden versuchen, mit Ihnen in Kontakt zu bleiben, und Sie sollten regelmäßig Ihre E-Mails und Ihr Telefon überprüfen. Sie erhalten aktuelle Informationen per E-Mail und SMS an die Kontaktdaten, die Sie bei der Buchung Ihres Urlaubs angegeben haben.  </p>
    '@
                    "fr-FR" = @'
    <p>Mettre fin à vos vacances et vous ramener chez vous plus tôt que prévu est une solution de dernier recours, et nous comprenons à quel point cela peut être décevant. Si une situation rend cela nécessaire, nous vous contacterons et vous communiquerons les nouveaux horaires de transfert (le cas échéant) et de vol, qui peuvent être décalés de quelques jours en fonction de notre programme de vols. </p>
    <p>En cas de perturbation importante des transports, nous pouvons vous inviter à organiser vous-même votre voyage de retour et, éventuellement, à trouver et réserver vous-même votre hébergement pour la nuit. Vous serez remboursé de toutes les <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">dépenses raisonnables</span></strong></a> que vous aurez engagées.
    <p>Sachez que nous vous ramènerons chez vous, même si cela ne peut se faire immédiatement. Dans des cas extrêmes, tels qu'une catastrophe naturelle, les autorités locales peuvent prendre le contrôle de la situation et, le cas échéant, vous devrez suivre leurs instructions. Nous essaierons de rester en contact avec vous et vous devrez vérifier régulièrement vos e-mails et votre téléphone. Vous recevrez des informations par e-mail et par SMS aux coordonnées fournies lors de la réservation de vos vacances.  </p>
    '@
                    "de-DE" = @'
    <p>Die vorzeitige Beendigung Ihres Urlaubs und Ihre vorzeitige Rückreise sind eine letzte Möglichkeit, und wir sind uns bewusst, wie enttäuschend dies sein kann. Sollte eine Situation eintreten, in der dies notwendig wird, werden wir Sie kontaktieren und Ihnen die neuen Transferzeiten (falls zutreffend) und Flugzeiten mitteilen, die je nach unserem Flugplan möglicherweise erst in einigen Tagen stattfinden. </p>
    <p>Bei erheblichen Reiseunterbrechungen bitten wir Sie möglicherweise, Ihre Rückreise selbst zu organisieren und gegebenenfalls eine Übernachtungsmöglichkeit in einem Hotel zu suchen und zu buchen. Alle Ihnen entstandenen <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">angemessenen Kosten</span></strong></a> werden Ihnen erstattet.
    <p>Bitte beachten Sie, dass wir Sie nach Hause bringen werden, auch wenn dies nicht sofort möglich ist. In Extremfällen, wie z. B. bei Naturkatastrophen, können die lokalen Behörden die Kontrolle über eine Situation übernehmen. In diesem Fall sollten Sie deren Anweisungen befolgen. Wir werden versuchen, mit Ihnen in Kontakt zu bleiben, und Sie sollten regelmäßig Ihre E-Mails und Ihr Telefon überprüfen. Sie erhalten aktuelle Informationen per E-Mail und SMS an die Kontaktdaten, die Sie bei der Buchung Ihres Urlaubs angegeben haben.  </p>
    '@
