        @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q1"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My flight status and updates"
                    "fr-CH" = "Statut et mises à jour de mon vol"
                    "de-CH" = "Mein Flugstatus und aktuelle Informationen"
                    "fr-FR" = "Statut et mises à jour de mon vol"
                    "de-DE" = "Mein Flugstatus und aktuelle Informationen"
                }
                "Answer"= @{
                   "en" = @'
    <p>If your flight is disrupted or delayed, we&rsquo;ll always do our best to get in touch
    and share updates. You can also check the easyJet <a href="https://www.easyjet.com/en/flight-tracker"><strong><span style="text-decoration: underline;">Flight Tracker</span></strong></a> on our website
    or app for the most up-to-date flight information. </p>
    <p>
    As we look after your entire holiday, we may need to adjust different parts of
    your trip &mdash; starting with your flight, then your hotel, and finally your transfers
    (if included). You might receive several updates as we work through each stage
    with our trusted partners. That&rsquo;s completely normal and helps us keep you
    informed as quickly as possible. Keep checking your emails for updates and
    look out for texts from us to the contact details provided when you booked your
    holiday. </p>
    <p>
    If the disruption is widespread or caused by external factors such as weather,
    air traffic control, or industrial action, you can also visit our latest <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;">travel information</span></strong></a>&nbsp;page for broader travel updates and advice.  </p>
    '@
                    "fr-CH" = @'
    <p>Si votre vol est perturbé ou retardé, nous ferons toujours de notre mieux pour vous contacter
    et vous tenir informé. Vous pouvez également consulter le <a href="https://www.easyjet.com/ch-fr/flight-tracker"><strong><span style="text-decoration: underline;">suivi des vols</span></strong></a> easyJet sur notre site Web
    ou notre application pour obtenir les informations les plus récentes sur les vols. </p>
    <p>
    Comme nous nous occupons de l'ensemble de vos vacances, nous pouvons être amenés à modifier différents aspects de
    votre voyage, à commencer par votre vol, puis votre hôtel et enfin vos transferts
    (si inclus). Vous recevrez peut-être plusieurs mises à jour au fur et à mesure que nous traitons chaque étape
    avec nos partenaires de confiance. Cela est tout à fait normal et nous permet de vous tenir
    informé(e) le plus rapidement possible. Consultez régulièrement vos e-mails pour connaître les dernières informations et
    surveillez les SMS que nous vous envoyons aux coordonnées fournies lors de la réservation de vos
    vacances. </p>
    <p>
    Si la perturbation est généralisée ou causée par des facteurs externes tels que les conditions météorologiques, le
    contrôle du trafic aérien ou une action syndicale, vous pouvez également consulter notre dernière page <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;" >informations de voyage</span></strong></a>&nbsp;pour obtenir des mises à jour et des conseils plus généraux sur les voyages.  </p>
    '@
                    "de-CH" = @'
    <p>Wenn Ihr Flug gestört oder verspätet ist, werden wir stets unser Bestes tun, um Sie zu kontaktieren
    und Sie über den aktuellen Stand zu informieren. Sie können auch den easyJet <a href="https://www.easyjet.com/ch-de/flight-tracker"><strong><span style="text-decoration: underline;">Flight Tracker</span></strong></a> auf unserer Website
    oder in unserer App aufrufen, um die aktuellsten Fluginformationen zu erhalten. </p>
    <p>
    Da wir Ihren gesamten Urlaub organisieren, müssen wir möglicherweise verschiedene Teile Ihrer Reise anpassen
    – angefangen bei Ihrem Flug über Ihr Hotel bis hin zu Ihren Transfers
    (falls enthalten). Möglicherweise erhalten Sie mehrere Updates, während wir jede Phase
    mit unseren vertrauenswürdigen Partnern durcharbeiten. Das ist völlig normal und hilft uns, Sie
    so schnell wie möglich auf dem Laufenden zu halten. Überprüfen Sie regelmäßig Ihre E-Mails auf Aktualisierungen und
    achten Sie auf SMS von uns an die Kontaktdaten, die Sie bei der Buchung Ihres
    Urlaubs angegeben haben. </p>
    <p>
    Wenn die Störung weitreichend ist oder durch externe Faktoren wie Wetter,
    Flugsicherung oder Arbeitskampfmaßnahmen verursacht wird, können Sie auch unsere aktuelle Seite <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;" >Reiseinformationen</span></strong></a>&nbsp;Seite besuchen, um umfassendere Reiseinformationen und Ratschläge zu erhalten.  </p>
    '@
                    "fr-FR" = @'
    <p>Si votre vol est perturbé ou retardé, nous ferons toujours de notre mieux pour vous contacter
    et vous tenir informé. Vous pouvez également consulter le <a href="https://www.easyjet.com/fr/flight-tracker"><strong><span style="text-decoration: underline;">suivi des vols</span></strong></a> easyJet sur notre site Web
    ou notre application pour obtenir les informations les plus récentes sur les vols. </p>
    <p>
