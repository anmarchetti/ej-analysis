                }
                "NavigationParameter" = @{
                    "en" = "flightcancelled"
                }
                "__Sortorder" = @{
                    "en" = "300"
                }
            }
        },
         @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q4"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My flight isn't leaving as planned and I need somewhere to stay before returning home"
                    "fr-CH" = "Mon vol ne part pas comme prévu et j’ai besoin d’un hébergement avant de rentrer chez moi"
                    "de-CH" = "Mein Flug startet nicht wie geplant, und ich benötige eine Unterkunft, bevor ich nach Hause zurückkehre"
                    "fr-FR" = "Mon vol ne part pas comme prévu et j’ai besoin d’un hébergement avant de rentrer chez moi"
                    "de-DE" = "Mein Flug startet nicht wie geplant, und ich benötige eine Unterkunft, bevor ich nach Hause zurückkehre"
                }
                "Answer"= @{
                     "en" = @'
    <p>We understand how frustrating this can be if you find yourself needing to stay longer than planned, we&rsquo;ll do our best to secure somewhere for you to stay. While we aim to keep you at your current hotel, there may be instances where you need to move to a different one. </p>
    <p>In extreme cases, such as a natural disaster, local authorities may take control, and it&rsquo;s essential to follow their instructions. We&rsquo;ll try to keep in touch with you on the contact details provided when you made your booking, so please check your emails and phone regularly.&nbsp;</p>
    <p>If you need somewhere to stay overnight, we&rsquo;ll provide you with the necessary details or let you know if you&rsquo;re able to find and book your own and claim back <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">reasonable expenses</span></strong></a>.</p>
    <p>Our UK-based 24/7 On Holiday Support team is dedicated to assisting&nbsp;customers in times like these. Because there are other components to your holiday package, such as transfers or hotels, easyJet holidays customers can't use the easyJet airline self-service app to book somewhere to stay overnight.  </p>
    <br />
    '@
                    "fr-CH" = @'
    <p>Nous comprenons à quel point cela peut être frustrant si vous devez rester plus longtemps que prévu, nous ferons de notre mieux pour vous trouver un autre hébergement. Bien que nous nous efforcions de vous garder dans votre hôtel actuel, il peut arriver que vous deviez en changer. </p>
    <p>Dans des cas extrêmes, tels qu'une catastrophe naturelle, les autorités locales peuvent prendre le contrôle et il est essentiel de suivre leurs instructions. Nous essaierons de rester en contact avec vous via les coordonnées fournies lors de votre réservation. Veuillez donc vérifier régulièrement vos e-mails et votre téléphone.&nbsp;</p>
    <p>Si vous avez besoin d'un endroit où passer la nuit, nous vous fournirons les informations nécessaires ou vous indiquerons si vous pouvez trouver et réserver vous-même un hébergement et demander le remboursement de vos <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">frais raisonnables</span></strong></a>.</p>
    <p>Notre équipe d'assistance 24h/24 et 7j/7 basée au Royaume-Uni se consacre à aider les clients dans des situations comme celle-ci. Étant donné que votre forfait vacances comprend d'autres éléments, tels que les transferts ou les hôtels, les clients d'easyJet holidays ne peuvent pas utiliser l'application en libre-service de la compagnie aérienne easyJet pour réserver un hébergement pour la nuit.  </p>
    <br />
    '@
                    "de-CH" = @'
    <p>Wir verstehen, wie frustrierend es sein kann, wenn Sie länger als geplant bleiben müssen, und werden unser Bestes tun, um Ihnen eine Unterkunft zu sichern. Wir bemühen uns, Sie in Ihrem derzeitigen Hotel unterzubringen, aber es kann vorkommen, dass Sie in ein anderes Hotel umziehen müssen. </p>
    <p>In Extremfällen, wie z. B. bei Naturkatastrophen, können die lokalen Behörden die Kontrolle übernehmen, und es ist wichtig, deren Anweisungen zu befolgen. Wir werden versuchen, mit Ihnen über die bei der Buchung angegebenen Kontaktdaten in Verbindung zu bleiben. Bitte überprüfen Sie daher regelmäßig Ihre E-Mails und Ihr Telefon.&nbsp;</p>
    <p>Wenn Sie eine Übernachtungsmöglichkeit benötigen, stellen wir Ihnen die erforderlichen Informationen zur Verfügung oder teilen Ihnen mit, ob Sie selbst eine Unterkunft suchen und buchen können und die Kosten dafür zurückfordern können <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">angemessene Kosten</span></strong></a> zurückfordern können.
    <p>Unser rund um die Uhr erreichbares Support-Team in Großbritannien ist bestrebt, Kunden in Zeiten wie diesen zu unterstützen. Da Ihr Urlaubspaket noch weitere Komponenten wie Transfers oder Hotels umfasst, können Kunden von easyJet holidays die Self-Service-App der Fluggesellschaft easyJet nicht nutzen, um eine Übernachtungsmöglichkeit zu buchen.  </p>
    <br />
