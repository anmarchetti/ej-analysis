        @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q2"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My flight is delayed"
                    "fr-CH" = "Mon vol est retardé"
                    "de-CH" = "Mein Flug ist verspätet"
                    "fr-FR" = "Mon vol est retardé"
                    "de-DE" = "Mein Flug ist verspätet"
                }
                "Answer"= @{
                   "en" = @'
    <p>If your flight is delayed or re-scheduled, you&rsquo;ll be contacted by the easyJet holidays team. You may also receive a message from us sent by the airline team  to the details provided when you booked your holiday.</p>
    <p>Just so you know what to expect, our average speed in making these  arrangements is within 60 minutes so please bear with us while our team look  at the next best alternative for you.</p>
    '@
                    "fr-CH" = @'
    <p>Si votre vol est retardé ou reprogrammé, l'équipe easyJet holidays vous contactera. Vous pouvez également recevoir un message de notre part envoyé par l'équipe de la compagnie aérienne  aux coordonnées fournies lors de la réservation de votre séjour. </p>
    <p>Pour que vous sachiez à quoi vous attendre, sachez que nous effectuons généralement ces  modifications dans un délai de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche  la meilleure alternative pour vous. </p>
    '@
                    "de-CH" = @'
    <p>Wenn Ihr Flug verspätet ist oder umgebucht wird, werden Sie vom easyJet Holidays-Team kontaktiert. Möglicherweise erhalten Sie auch eine Nachricht von uns, die vom Team der Fluggesellschaft an die bei der Buchung Ihres Urlaubs angegebenen Kontaktdaten gesendet wird. </p>
    <p>Damit Sie wissen, was Sie erwartet: Im Durchschnitt benötigen wir für diese  Arrangements weniger als 60 Minuten. Wir bitten Sie daher um etwas Geduld, während unser Team  die für Sie beste Alternative sucht. </p>
    '@
                    "fr-FR" = @'
    <p>Si votre vol est retardé ou reprogrammé, l'équipe easyJet holidays vous contactera. Vous pouvez également recevoir un message de notre part envoyé par l'équipe de la compagnie aérienne  aux coordonnées fournies lors de la réservation de votre séjour. </p>
    <p>Pour que vous sachiez à quoi vous attendre, sachez que nous effectuons généralement ces  modifications dans un délai de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche  la meilleure alternative pour vous. </p>
    '@
                    "de-DE" = @'
    <p>Wenn Ihr Flug verspätet ist oder umgebucht wird, werden Sie vom easyJet Holidays-Team kontaktiert. Möglicherweise erhalten Sie auch eine Nachricht von uns, die vom Team der Fluggesellschaft an die bei der Buchung Ihres Urlaubs angegebenen Kontaktdaten gesendet wird. </p>
    <p>Damit Sie wissen, was Sie erwartet: Im Durchschnitt benötigen wir für diese  Arrangements weniger als 60 Minuten. Wir bitten Sie daher um etwas Geduld, während unser Team  die für Sie beste Alternative sucht. </p>
