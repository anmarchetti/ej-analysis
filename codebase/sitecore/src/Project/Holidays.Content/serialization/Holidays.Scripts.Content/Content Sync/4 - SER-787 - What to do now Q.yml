         @{
            Path         = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to do now - Questions/Q3"
            TemplatePath = $qaItemTemplatePath
            Fields      = @{
                "Question" = @{
                    "en" = "My flight is cancelled"
                    "fr-CH" = "Mon vol est annulé"
                    "de-CH" = "Mein Flug wurde annulliert"
                    "fr-FR" = "Mon vol est annulé"
                    "de-DE" = "Mein Flug wurde annulliert"
                }
                "Answer"= @{
                    "en" = @'
    <p><strong>My outbound flight is cancelled</strong>
    </p>
    <p>If your outbound flight is cancelled before you go, we&rsquo;re sorry and we&rsquo;ll do our
    very best to move you on to a suitable alternative flight. If we can&rsquo;t find one,
    then unfortunately we&rsquo;ll cancel your holiday and press the button on a refund
    straight away.
    </p>
    <p><strong>My return flight is cancelled</strong>
    </p>
    <p>If your return flight is cancelled while you're on holiday, please try not to worry.
    We&rsquo;ll do everything possible to help with alternative arrangements whilst you&rsquo;re
    in resort to get you home. And we have a dedicated team that&rsquo;ll proactively
    reach out to you using the contact details provided when you booked your
    holiday. For information on your rights, check our <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z"><strong><span style="text-decoration: underline;">booking conditions</span></strong></a>&nbsp;page or
    visit our <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Help Centre</span></strong></a>&nbsp;to find out more.</p>
    <p>Just so you know what to expect, our average speed in making these
    arrangements is within 60 minutes so please bear with us while our team look
    at the next best alternative for you.</p>
    '@
                    "fr-CH" = @'
    <p><strong>Mon vol aller est annulé</strong>
    </p>
    <p>Si votre vol aller est annulé avant votre départ, nous vous prions de nous en excuser et ferons tout notre
    possible pour vous trouver un autre vol adapté. Si nous ne parvenons pas à en trouver un,
    nous annulerons malheureusement votre séjour et procéderons immédiatement à votre remboursement.
    </p>
    <p><strong>Mon vol retour est annulé</strong>
    </p>
    <p>Si votre vol retour est annulé pendant vos vacances, ne vous inquiétez pas.
    Nous ferons tout notre possible pour vous aider à trouver une solution de remplacement pendant votre
    séjour afin que vous puissiez rentrer chez vous. Nous disposons d'une équipe dédiée qui vous contactera de manière proactive
    à l'aide des coordonnées fournies lors de la réservation de votre
    séjour. Pour plus d'informations sur vos droits, consultez notre page <a href="~/link.aspx?_id=912E490A633C4ECA8942727A28DF20DD&amp;_z=z"><strong><span style="text-decoration: underline;">conditions de réservation</span></strong></a>&nbsp;ou
    visitez notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp;pour en savoir plus.</p>
    <p>Pour que vous sachiez à quoi vous attendre, notre délai moyen pour effectuer ces
    modifications est de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche
    la meilleure alternative pour vous.</p>
    '@
                    "de-CH" = @'
    <p><strong>Mein Hinflug wurde gestrichen</strong>
    </p>
    <p>Wenn Ihr Hinflug vor Ihrer Abreise gestrichen wird, entschuldigen wir uns dafür und werden unser
    Bestes tun, um Ihnen einen geeigneten Alternativflug zu vermitteln. Wenn wir keinen finden können,
    müssen wir Ihren Urlaub leider stornieren und Ihnen umgehend eine Rückerstattung gewähren.
    </p>
    <p><strong>Mein Rückflug wurde gestrichen</strong>
    </p>
    <p>Sollte Ihr Rückflug während Ihres Urlaubs gestrichen werden, machen Sie sich bitte keine Sorgen.
    Wir werden alles in unserer Macht Stehende tun, um Ihnen während Ihres Aufenthalts
    im Urlaubsort bei der Organisation einer alternativen Rückreise zu helfen. Wir haben ein engagiertes Team, das sich proaktiv
    mit Ihnen in Verbindung setzen wird, indem es die Kontaktdaten verwendet, die Sie bei der Buchung Ihres
    Urlaubs angegeben haben. Informationen zu Ihren Rechten finden Sie auf unserer Seite <a href="~/link.aspx?_id=912E490A633C4ECA8942727A28DF20DD&amp;_z=z"><strong><span style="text-decoration: underline;">Buchungsbedingungen</span></strong></a>&nbsp;Seite oder
    besuchen Sie unser <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Hilfe-Center</span></strong></a>&nbsp;, um mehr zu erfahren.</p>
    <p>Damit Sie wissen, was Sie erwartet: Im Durchschnitt benötigen wir für diese
    Arrangements weniger als 60 Minuten. Wir bitten Sie daher um etwas Geduld, während unser Team
    die nächstbeste Alternative für Sie sucht.</p>
    '@
                    "fr-FR" = @'
    <p><strong>Mon vol aller est annulé</strong>
    </p>
    <p>Si votre vol aller est annulé avant votre départ, nous vous prions de nous en excuser et ferons tout notre
    possible pour vous trouver un autre vol adapté. Si nous ne parvenons pas à en trouver un,
    nous annulerons malheureusement votre séjour et procéderons immédiatement à votre remboursement.
    </p>
    <p><strong>Mon vol retour est annulé</strong>
    </p>
    <p>Si votre vol retour est annulé pendant vos vacances, ne vous inquiétez pas.
