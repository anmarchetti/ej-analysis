    séjour. Pour plus d'informations sur vos droits, consultez notre page <a href="~/link.aspx?_id=912E490A633C4ECA8942727A28DF20DD&amp;_z=z"><strong><span style="text-decoration: underline;">conditions de réservation</span></strong></a>&nbsp;ou
    visitez notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp;pour en savoir plus.</p>
    <p>Pour que vous sachiez à quoi vous attendre, notre délai moyen pour effectuer ces
    modifications est de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche
    la meilleure alternative pour vous.</p>
    '@
                    "de-DE" = @'
    <p><strong>Mein Hinflug wurde gestrichen</strong>
    </p>
    <p>Wenn Ihr Hinflug vor Ihrer Abreise gestrichen wird, entschuldigen wir uns dafür und werden unser
    Bestes tun, um Ihnen einen geeigneten Alternativflug zu vermitteln. Wenn wir keinen finden können,
