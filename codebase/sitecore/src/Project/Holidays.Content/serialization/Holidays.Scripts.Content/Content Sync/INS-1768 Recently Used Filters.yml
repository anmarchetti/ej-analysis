    # Update Morning Time Filter to use the code without space at the end
    $morningTimeFilter = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Search Filters/Time Filters/Morning" -ErrorAction SilentlyContinue
    if ($null -ne $morningTimeFilter) {
        $morningTimeFilter.Editing.BeginEdit()
        $morningTimeFilter["Code"] = "morning"
        $morningTimeFilter.Editing.EndEdit() | Out-Null
    }
    
    # Update Search Result Pages with the new filter
    $itemPaths = @(
        "master:/sitecore/content/EasyJet/Holidays/Home/MixedResultList",
        "master:/sitecore/content/EasyJet/TradePortal/Home/MixedResultList"
    )
    $fieldName = "Filters Order"
    $valueToPrepend = "{5288C8EA-6CD1-4870-BD48-0AFFAB9DB9FE}"
    $languages = @("de-CH", "de-DE", "en", "fr-CH", "fr-FR")
    
    foreach ($itemPath in $itemPaths) {
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        if (-not $item) {
            Write-Warning "Item not found: $itemPath"
            continue
        }
    
        foreach ($language in $languages) {
            $languageItem = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue
            if (-not $languageItem -or $languageItem.Versions.Count -eq 0) {
                Write-Host "No versions for $itemPath [$language]. Skipping."
                continue
            }
    
            $versions = $languageItem.Versions.GetVersionNumbers()
            foreach ($version in $versions) {
                $versionItem = Get-Item -Path $itemPath -Language $language -Version $version -ErrorAction SilentlyContinue
                if (-not $versionItem) { continue }
    
                $currentValue = [string]$versionItem[$fieldName]
                $parts = @()
                if (-not [string]::IsNullOrWhiteSpace($currentValue)) {
                    $parts = $currentValue -split "\|"
                }
    
                if ($parts -contains $valueToPrepend) {
                    Write-Host "Already present [$language v$version]: $($versionItem.Paths.FullPath)"
                    continue
                }
    
                $newValue = if ([string]::IsNullOrWhiteSpace($currentValue)) {
                    $valueToPrepend
                } else {
                    "$valueToPrepend|$currentValue"
                }
    
                $versionItem.Editing.BeginEdit()
                $versionItem[$fieldName] = $newValue
                $versionItem.Editing.EndEdit() | Out-Null
                Write-Host "Updated [$language v$version]: $($versionItem.Paths.FullPath)"
            }
        }
    }
