        @{ Id = "{B800DDDD-66F1-443F-B291-90BAFCF8954B}"; FrName = "Note TripAdvisor 2+"; DeName = "TripAdvisor-Bewertung 2+" },
        @{ Id = "{6C25422D-B955-4FBC-A998-54629A23C9EB}"; FrName = "Note TripAdvisor 3+"; DeName = "TripAdvisor-Bewertung 3+" },
        @{ Id = "{680BEDBF-D9EF-4C20-87F1-10446A09D3EB}"; FrName = "Note TripAdvisor 4+"; DeName = "TripAdvisor-Bewertung 4+" },
