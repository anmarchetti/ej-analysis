    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    $sortOrderOptions = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Sort Order Options" -templateId "{516E566B-7121-42C2-A3C1-7A18F965AA76}"
    
    $dataSortOrder = "/sitecore/content/EasyJet/Holidays/Data/Sort Order Options"
    Move-Item -Path "/sitecore/system/Settings/Foundation/Destinations/Filters/Flights Filters Sort Order Settings" -Destination $dataSortOrder;
    Move-Item -Path "/sitecore/system/Settings/Foundation/Destinations/Filters/Search Filters Sort Order Settings" -Destination $dataSortOrder;
    Move-Item -Path "/sitecore/system/Settings/Foundation/Destinations/Filters/Time Filters" -Destination "/sitecore/content/EasyJet/Holidays/Data/Search Filters";
    Move-Item -Path "/sitecore/system/Settings/Project/Holidays/Sort Ordering/Sort Order Settings" -Destination $dataSortOrder;
