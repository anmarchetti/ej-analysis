  Hint: Script
  Value: |
     function Get-Or-Create-Item ($path,$template) {
        	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
        	if ($item -eq $null) {
        		$item = New-Item -Path $path -ItemType $template
        	}
        	return $item
        }
    
    function create-lang-version ($item,$lang) {
        	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
        		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        	}
        }
    
    $holidaysWeatherDataPath = "/sitecore/content/EasyJet/Holidays/Data/Weather Data Carousel"
    $tradeWearherDataPath = "/sitecore/content/EasyJet/TradePortal/Data/Weather Data Carousel"
    
    $dsTemplateId = "{f767a94f-b34e-4762-9426-08c1a3a81405}"
    
    $holidaysDatasource = Get-Or-Create-Item -path $holidaysWeatherDataPath -template $dsTemplateId
    
    if ($null -ne $holidaysDatasource) {
        create-lang-version -item $holidaysDatasource -lang 'fr-CH'
        create-lang-version -item $holidaysDatasource -lang 'de-CH'
        create-lang-version -item $holidaysDatasource -lang 'fr-FR'
        create-lang-version -item $holidaysDatasource -lang 'de-DE'
    }
    
    $tradeDatasource = Get-Or-Create-Item -path $tradeWearherDataPath -template $dsTemplateId
    
