Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1789 SEO - Remove IE Compatibility Banner"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $bannerRenderingId = "{12BC8416-2B13-4F6B-A302-25FEBCDB61B6}"
    $bannerDatasourcePath = "/sitecore/content/EasyJet/Holidays/Data/HTML Blocks/IE Compatibility Banner"
    $itemPaths = @(
        "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Header",
        "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Header With Market Selector",
        "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Header"
    )
    
    foreach ($itemPath in $itemPaths) {
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        if ($null -eq $item) {
            Write-Warning "Item not found: $itemPath"
            continue
        }
    
        $renderings = Get-Rendering -Item $item | Where-Object { $_.ItemId -eq $bannerRenderingId }
        if ($null -eq $renderings -or $renderings.Count -eq 0) {
            Write-Host "Rendering not found in shared layout: $($item.Paths.FullPath)"
            continue
        }
    
        foreach ($rendering in $renderings) {
            Remove-Rendering -Item $item -Instance $rendering -ErrorAction SilentlyContinue
        }
    
        Write-Host "Removed $($renderings.Count) rendering(s) from shared layout: $($item.Paths.FullPath)"
    }
    
    $bannerDatasourceItem = Get-Item -Path $bannerDatasourcePath -ErrorAction SilentlyContinue
    if ($null -eq $bannerDatasourceItem) {
        Write-Host "Datasource item not found: $bannerDatasourcePath"
    } else {
        Remove-Item -Path $bannerDatasourcePath -Force -ErrorAction SilentlyContinue
        Write-Host "Removed datasource item: $bannerDatasourcePath"
    }
