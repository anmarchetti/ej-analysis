- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendSettingsItem = Get-Item -path "/sitecore/content/EasyJet/Holidays/Settings/Amend Booking Settings" -ErrorAction SilentlyContinue
    
    if ($amendSettingsItem -ne $null) {
        $amendSettingsItem.Editing.BeginEdit()
        $amendSettingsItem["IsChangeDatesEnable"] = "1";
        $amendSettingsItem.Editing.EndEdit() | Out-Null;
        
          Write-Host $amendSettingsItem.Name "Updated";
    }
