    function Create-Error-Popup($project, $parent){
        $template = '{75964261-DCE6-4C41-8518-95450240EA45}'
        $parentPath = "/sitecore/content/EasyJet/$project/Home/Booking/Page Components/$parent"
        $bannerSERemoveTransfer = Create-SE-Remove-Popup -Path "$parentPath/Transfer Not Accommodating SE"
        
        # set popups to transfer DS
        $transferItem =  Get-Item -Path $parentPath -ErrorAction SilentlyContinue
        
        if($transferItem -ne $null) {
            $transferItem.Editing.BeginEdit()
            $transferItem['TransferNotAccommodatingSEPopup'] = $bannerSERemoveTransfer.ID
            $transferItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Transfer not accomodating SE from URL popup set on $project"
        }
        
        if($project -eq 'Holidays') {
            foreach ($lang in $translationsSE.Keys) {
                foreach ($fieldName in $fields) {
                    create-lang-version -item $bannerSERemoveTransfer -lang $lang -field $fieldName -value $translationsSE[$lang][$fieldName]
                }
                
                Write-Host "$bannerSERemoveTransfer Transfer Not Accommodating SE Translated on" $lang
            }        
        }
    }
    
    Create-Error-Popup -Project 'Holidays' -Parent 'Transfer Section'
    Create-Error-Popup -Project 'TradePortal' -Parent 'Transfer Section Trade'
    
    Write-Host "Script ANC-352 URL Error for Transfer not accommodating Sport Equipment is completed"
    
