  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        
        return $item
    }
    
    # Transfer Not Accommodating SE Popup DS creating
    function Create-SE-Remove-Popup($path){
        $popupTemplateId = '{4683D757-E5BC-46C3-B734-B5735C11A675}'
        $banner = Get-Or-Create-Item -Path $path -Template $popupTemplateId
        
        if($banner -ne $null) {
            $banner.Editing.BeginEdit()
            $banner['Title'] = "Your transfer doesn't accommodate sports equipment"
            $banner['Description'] = "<p>The transfer provider on your holiday package is not able to accommodate sports equipment, so we recommend changing to a private transfer. Alternatively, you could remove your sports equipment.</p>"
            $banner['ConfirmButtonLabel'] = 'Keep my sports equipment'
            $banner['CancelButtonLabel'] = 'Remove my sports equipment'
            $banner.Editing.EndEdit() | Out-Null
        }
        
        Write-Host "SE Remove Transfer Popup DS created on" $path
        
        return $banner
    }
    
    # holidays popups translations
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
        
    $fields = @('Title','Description','ConfirmButtonLabel','CancelButtonLabel')
    $translationsSE = @{
            "fr-CH" = @{
                "Title" = "Votre transfert n'est pas adapté à l'équipement sportif"
                "Description" = "<p>Le prestataire de transfert de votre forfait de vacances n'est pas en mesure de prendre en charge les équipements sportifs, nous vous recommandons donc de changer pour un transfert privé. Vous pouvez également retirer votre équipement sportif.</p>"
                "ConfirmButtonLabel" = "Garder mon équipement sportif"
                "CancelButtonLabel" = "Retirer mon équipement sportif"
            }
            "fr-FR" = @{
                "Title" = "Votre transfert n'est pas adapté à l'équipement sportif"
                "Description" = "<p>Le prestataire de transfert de votre forfait de vacances n'est pas en mesure de prendre en charge les équipements sportifs, nous vous recommandons donc de changer pour un transfert privé. Vous pouvez également retirer votre équipement sportif.</p>"
                "ConfirmButtonLabel" = "Garder mon équipement sportif"
                "CancelButtonLabel" = "Retirer mon équipement sportif"
            }
            "de-CH" = @{
                "Title" = "Ihr Transfer bietet keinen Platz für Sportgeräte"
                "Description" = "<p>Der Transferanbieter Ihres Urlaubspakets ist nicht in der Lage, Sportgeräte aufzunehmen, daher empfehlen wir Ihnen, auf einen privaten Transfer umzusteigen. Alternativ können Sie Ihre Sportausrüstung auch entfernen.</p>"
                "ConfirmButtonLabel" = "Meine Sportausrüstung aufbewahren"
