            Path         = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Contact Us Button"
            TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Contact Us/Contact Us Banner"
            Fields      = @{
                "ContactChannels" = @{
                    "en" = $ids
                    "fr-CH" = $ids
                    "de-CH" = $ids
                    "fr-FR" = $ids
                    "de-DE" = $ids
                }
                "ContactChannelsLuxury" = @{
                    "en" = $ids
                    "fr-CH" = $ids
                    "de-CH" = $ids
                    "fr-FR" = $ids
                    "de-DE" = $ids
                }
            }
        }
    )
    
    ImportContent -itemsToCreate $updates
    
    $page= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
        
    $renderingBooking  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/View Booking"
    $pageRenderingBooking = Get-Rendering -Item $page -Rendering $renderingBooking
    $uniqueID_Booking = $pageRenderingBooking.UniqueId
    
    $renderingRefund  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Refund Info"
    $pageRenderingRefund = Get-Rendering -Item $page -Rendering $renderingRefund
    $uniqueID_Refund = $pageRenderingRefund.UniqueId
    
    
    $rendering  = Get-Item -Path "/sitecore/layout/Renderings/Feature/Booking/Contact Us Banner"
    $instance = New-Rendering -Item $rendering
    Add-Rendering -Item $page -Instance $instance -PlaceHolder "/body/credit-booking-disruption-$($uniqueID_Booking)-0/contact-us-$($uniqueID_Refund)-0" -DataSource "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Contact Us Button" -Parameter @{ "ShowButtonOnly" = "1" } 
    
