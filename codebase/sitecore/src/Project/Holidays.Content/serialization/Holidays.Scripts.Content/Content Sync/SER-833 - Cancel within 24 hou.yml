            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Contact Us Button/Call us"
                TemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Contact Us/Contact Us Popup Channel"
                Fields      = @{
                    "Title" = @{
                        "en" = "Call us"
                        "fr-CH" = "Appelez-nous"
                        "de-CH" = "Rufen Sie uns an"
                        "fr-FR" = "Appelez-nous"
                        "de-DE" = "Rufen Sie uns an"
                    }
                    "Description" = @{
                        "en" = @'
    If you'd like to change this holiday within 24 hours of booking, you can get in touch with our team on
    <p><a href="tel:+443309126593"><strong><span style="text-decoration: underline;">0330 912 6593</span></strong></a></p>
    <p>Our team are available from Monday to Sunday, 8am - 8pm. Calls cost a standard rate. Calls from mobile or other networks may vary.</p>
    <p>Please have your easyJet holidays booking reference ready, which is made up of just numbers.</p>
    '@
                        "fr-CH" = @'
    Si vous souhaitez modifier cette réservation dans les 24 heures suivant votre réservation, vous pouvez contacter notre équipe au
    <p><a href="tel:+41223240012"><strong><span style="text-decoration: underline;">+41 22 324 00 12</span></strong></a></p>
    <p>Notre équipe est disponible du lundi au dimanche, de 8 h à 20 h. Les appels sont facturés au tarif standard. Les appels depuis un mobile ou d'autres réseaux peuvent varier.
    <p>Veuillez vous munir de votre référence de réservation easyJet holidays, qui se compose uniquement de chiffres.
    '@
                        "de-CH" = @'
    Wenn Sie diesen Urlaub innerhalb von 24 Stunden nach der Buchung ändern möchten, können Sie sich unter folgender Nummer an unser Team wenden:
    <p><a href="tel:+41223240012"><strong><span style="text-decoration: underline;">+41 22 324 00 12</span></strong></a></p>
    <p>Unser Team ist von Montag bis Sonntag von 8 bis 20 Uhr erreichbar. Anrufe werden zum Standardtarif berechnet. Anrufe aus Mobilfunknetzen oder anderen Netzen können abweichen. </p>
    <p>Bitte halten Sie Ihre easyJet-Urlaubsbuchungsnummer bereit, die nur aus Zahlen besteht. </p>
    '@
                        "fr-FR" = @'
    Si vous souhaitez modifier cette réservation dans les 24 heures suivant votre réservation, vous pouvez contacter notre équipe au
    <p><a href="tel:+33481499425"><strong><span style="text-decoration: underline;">+33 4 81 49 94 25</span></strong></a></p>
    <p>Notre équipe est disponible du lundi au dimanche, de 8 h à 20 h. Les appels sont facturés au tarif standard. Les appels depuis un mobile ou d'autres réseaux peuvent varier.
    <p>Veuillez vous munir de votre référence de réservation easyJet holidays, qui se compose uniquement de chiffres.
    '@
                        "de-DE" = @'
