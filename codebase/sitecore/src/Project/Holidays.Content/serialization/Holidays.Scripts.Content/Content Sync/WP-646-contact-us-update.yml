- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
        $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Help/Contact Form/Page Components/Form"
        @('de-CH', 'de-DE') | % {
            Create-Lang-Version -Item $item -Lang $_ -Field "NoBookingYetLabel" -Value "Ich habe noch nicht gebucht"
        }
        @('fr-CH', 'fr-FR') | % {
            Create-Lang-Version -Item $item -Lang $_ -Field "NoBookingYetLabel" -Value "Je n'ai pas encore réservé"
        }
     
        Create-Lang-Version -Item $item -Lang "en" -Field "NoBookingYetLabel" -Value "I haven't booked yet"
