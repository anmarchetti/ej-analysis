  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Create-Settings () {
    	$item = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Settings" -ItemName "Pax Mix Settings" -TemplateId "{788582FD-8470-4D63-B42F-D7B03848D5DD}"
    
    	$item.Editing.BeginEdit()
    	$item["IsPaxMixPopupEnabled"] = "1"
    	$item["PaxMixPopupTitle"] = "Tell us more about who's traveling"
    	$item["PaxMixPopupSubtitle"] = "To make sure we can show you the most relevant holidays, we need a few more details."
    	$item["PaxMixAdultsIcon"] = '<image mediaid="{BED40AA7-DDAE-413C-9632-E88A4E124BA9}" />'
    	$item["PaxMixChildrenIcon"] = '<image mediaid="{C4438D39-6DF3-4330-8173-7B3928E49B8A}" />'
    	$item["PaxMixInfantsIcon"] = '<image mediaid="{92D20CA4-59D5-4FA7-BF0F-824EA9398488}" />'
    	$item.Editing.EndEdit() | Out-Null
    	
    	Write-Host "Pax Mix Pop Up Settings created";
    }
    
    
    Create-Settings
