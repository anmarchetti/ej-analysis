    function updateSeatMap($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    $seatmapPathHolidays = '/sitecore/content/EasyJet/Holidays/Data/Ancillaries/SeatsMap'
    $seatmapPathTrade = '/sitecore/content/EasyJet/TradePortal/Data/Ancillaries/Seats Map Trade'
    
    updateSeatMap -itemPath $seatmapPathTrade  -key 'SitTogetherTitle' -translation 'Sit together?' -language 'en'
    updateSeatMap -itemPath $seatmapPathTrade  -key 'SitTogetherDescription' -translation "Want to sit with your travel companions?<br> We'll find the cheapest seats for you." -language 'en'
    
    
    updateSeatMap -itemPath $seatmapPathHolidays -key 'SitTogetherTitle' -translation 'Sit together?' -language 'en'
    updateSeatMap -itemPath $seatmapPathHolidays -key 'SitTogetherTitle' -translation "S'asseoir ensemble?" -language 'fr-FR'
    updateSeatMap -itemPath $seatmapPathHolidays -key 'SitTogetherTitle' -translation "S'asseoir ensemble?"-language 'fr-CH'
    updateSeatMap -itemPath $seatmapPathHolidays -key 'SitTogetherTitle' -translation 'Zusammensitzen?' -language 'de-DE'
    updateSeatMap -itemPath $seatmapPathHolidays -key 'SitTogetherTitle' -translation 'Zusammensitzen?' -language 'de-CH'
    
    updateSeatMap -itemPath $seatmapPathHolidays  -key 'SitTogetherDescription' -translation "Want to sit with your travel companions?<br> We'll find the cheapest seats for you." -language 'en'
    updateSeatMap -itemPath $seatmapPathHolidays  -key 'SitTogetherDescription' -translation "Vous voulez vous asseoir avec vos compagnons de voyage?<br> Nous vous trouverons les places les moins chères." -language 'fr-FR'
    updateSeatMap -itemPath $seatmapPathHolidays  -key 'SitTogetherDescription' -translation "Vous voulez vous asseoir avec vos compagnons de voyage?<br> Nous vous trouverons les places les moins chères." -language 'fr-CH'
    updateSeatMap -itemPath $seatmapPathHolidays  -key 'SitTogetherDescription' -translation "Möchten Sie mit Ihren Reisebegleitern zusammensitzen?<br> Wir finden die günstigsten Plätze für Sie." -language 'de-CH'
