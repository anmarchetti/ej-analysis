  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/
    
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Globals/Buttons/Go Back"
    $key = "Globals.Buttons.GoBack"
    $phrase = "Go Back" # "Search again"
    
    # Other than searching items by path, you can search items by query
    $item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$key']"
    
    # $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "Search again"
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
