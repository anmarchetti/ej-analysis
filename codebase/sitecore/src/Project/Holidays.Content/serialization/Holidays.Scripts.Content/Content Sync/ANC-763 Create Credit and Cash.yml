        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
    
        if($item -eq $null){
            $newSettingItem = New-Item -Path $path -ItemType $templateId
            $newSettingItem.Editing.BeginEdit()
            $newSettingItem.Fields["CurrentRulesApplyForHolidaysBookedFrom"].Value = "20991101T000000Z"
            $newSettingItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Created Credit and Cash Refund Settings"
        }
    }
    
