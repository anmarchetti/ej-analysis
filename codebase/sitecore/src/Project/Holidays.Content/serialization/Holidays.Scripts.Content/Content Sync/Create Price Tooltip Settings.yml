DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Price Tooltip Settings";
    $itemTemplateId = '{C7A6EC63-FF09-457B-B103-31E497E0B4F8}';
    $itemFolderTemplateId = '{82EB0D88-F676-46C1-903F-0E5D0E728432}';
    
    function GetOrCreateItem {
        param ($path,$templateId)
        
        $item = Get-Item -path $path -ErrorAction SilentlyContinue; 
        if ($item -eq $null) {
            #create item
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    function CreateItemTooltip {
        param (
            $path,
            $templateId,
            $content,
            $maxGuests,
            $minGuests,
            $noOffer
        )
        
        $item = GetOrCreateItem -Path $path -TemplateId $templateId
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            if($maxGuests -ne $null) {$item.Fields["MaxNumberOfGuests"].Value = $maxGuests}
            if($minGuests -ne $null) {$item.Fields["MinNumberOfGuests"].Value = $minGuests}
            if($noOffer -ne $null) {$item.Fields["NoOffer"].Value = $noOffer}
            if($content -ne $null) {$item.Fields["Content"].Value = $content}
            $item.Editing.EndEdit()
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    GetOrCreateItem -Path $itemPath -TemplateId $itemFolderTemplateId;
    CreateItemTooltip -Path ($itemPath + '/More Then Two Guests') -TemplateId $itemTemplateId -Content "Price subject to change & availability due to daily system updates. Any change to price is shown on Extras page. Price per person = total cost divided by number of adults & children, inc free child places, excl infants." -MinGuests 2
    CreateItemTooltip -Path ($itemPath + '/No Offer') -TemplateId $itemTemplateId -Content "Price subject to change & availability due to daily system updates. Any change to price is shown on Extras page. Price per person = total cost divided by number of adults & children, inc free child places, excl infants" -NoOffer "1"
    CreateItemTooltip -Path ($itemPath + '/One Guest') -TemplateId $itemTemplateId -Content "Price subject to change & availability due to daily system updates. Any change to price is shown on Extras page." -MaxGuests 1
    
