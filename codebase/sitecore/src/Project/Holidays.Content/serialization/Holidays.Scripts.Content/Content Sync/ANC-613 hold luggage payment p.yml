- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Edit-Data-Source ($dataSourcePath){
        # Get data source
        $dataSource = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
        
        # update data source
        if ($dataSource -ne $null) {
            $dataSource.Editing.BeginEdit()
            $dataSource["LuggageInfoTitle"] = "Bags and Luggage";
            $dataSource["SportsEquipmentsLabel"] = "Sports equipment";
            $dataSource["IncludedLuggageName"] = "Hold Baggage 23kg";
    	    $dataSource["PramName"] = "Pram or Pushchair";
            $dataSource.Editing.EndEdit() | Out-Null
            Write-Host $dataSource.Name "is updated";
        }
    
    }
    
    # Holidays
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Payment/Page Components/Payment'
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Pay Balance/Page Components/Pay Balance'
    
    # Trade
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Confirm/Page Components/Confirm Booking Details'
    
