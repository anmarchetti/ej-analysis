DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function UpdateRendring {
      param($item, $datasource)
        $weatherDataRenderingItem = Get-Item -Path "master:" -Id "{48F21C15-5DD1-419D-9BF3-A07C2EAA0843}"
        $weatherDataRendering = Get-Rendering -Item $item -PlaceHolder "/body/component-wrapper-inner-{FB4DBCED-CAB0-4FB7-88D5-5E1C4FDC7097}-0" -Rendering $weatherDataRenderingItem
        if ($weatherDataRendering -ne $null) {
    	    Set-Rendering -Item $item -Instance $weatherDataRendering -DataSource $datasource.ID
    	    Write-Host $item.Name "Datasource for Weather Data rendering was successfully updated"
        }
    }
    
    $regionCityTemplatePath = '/sitecore/templates/Project/Holidays/Pages/Destinations/Region - City'
    $regionCityTemplate = Get-Item -Path "master:$($regionCityTemplatePath)"
    
    # Loop through all items
    
    $startItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    $countryItems = Get-ChildItem -Path $startItem.ProviderPath | Where-Object { $_.TemplateName -eq "Country" }
    $datasource = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Weather Data Carousel"
    
    foreach ($countryItem in $countryItems) {
        $regions = Get-ChildItem -Path $countryItem.ProviderPath | Where-Object { $_.TemplateName -eq "Region" -or $_.TemplateName -eq "Region - City" }
        foreach ($region in $regions) {
            UpdateRendring -item $region -datasource $datasource
        }
    }
    
