    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null){
            $item = New-Item -Path $path -ItemType $templateId
        }
        
        return $item
    }
    
    function Update-Facility-Headers(){
        $index = 1
        $facilityHeadersFolderItem = Get-Or-Create-Item -Path $facilityHeadersFolderPath -TemplateId $facilityHeadersFolderTempalteId
        $facilityTypesItems = Get-ChildItem -Path $facilityTypesFolderPath -Recurse | Where-Object { $_.TemplateId -eq $facilityTypeTemplateId} 
        foreach($facilityHeader in $facilityHeaders){
            $facilityHeaderItem = Get-Or-Create-Item -Path "$($facilityHeadersFolderItem.Paths.FullPath)/$($facilityHeader.ItemName)" -TemplateId $facilityHeaderTempalteId
            $facilityTypes = @()
            foreach($facilityType in $facilityHeader.FacilityTypes){
                $facilityTypes += $facilityTypesItems | Where-Object { $_.Fields["Name"].Value -eq $facilityType.Name -And   $_.Fields["Code"].Value -eq $facilityType.Code } | Select-Object -First 1
            }
            
            $facilityHeaderItem.Editing.BeginEdit()
            $facilityHeaderItem.Fields["Name"].Value = $facilityHeader.HeaderName
            $facilityHeaderItem.Fields["__Sortorder"].Value = $index
            $index++
            if($facilityTypes.Count -gt 0){
                $facilityHeaderItem.Fields["Facilities"].Value = [string]::Join("|", ($facilityTypes | Select-Object -ExpandProperty Id))
            }
    
            $facilityHeaderItem.Editing.EndEdit() > $null
        }
    }
    Update-Facility-Headers
