Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUXE-496 Add translations for airport names"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $GermanyAirport = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Airports/Germany"
    $FranceAirport = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Airports/France"
    $SwitzerlandAirport = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Airports/Switzerland"
    
    @('de-CH', 'de-DE') | % {
        Create-Lang-Version -Item $GermanyAirport -Lang $_ -Field "Name" -Value "Deutschland"
        Create-Lang-Version -Item $FranceAirport -Lang $_ -Field "Name" -Value "Frankreich"
        Create-Lang-Version -Item $SwitzerlandAirport -Lang $_ -Field "Name" -Value "Schweiz"
    }
    @('fr-CH', 'fr-FR') | % {
        Create-Lang-Version -Item $GermanyAirport -Lang $_ -Field "Name" -Value "Allemagne"
        Create-Lang-Version -Item $FranceAirport -Lang $_ -Field "Name" -Value "France"
        Create-Lang-Version -Item $SwitzerlandAirport -Lang $_ -Field "Name" -Value "Suisse"
    }
    @('en') | % {
        Create-Lang-Version -Item $GermanyAirport -Lang $_ -Field "Name" -Value "Germany"
        Create-Lang-Version -Item $FranceAirport -Lang $_ -Field "Name" -Value "France"
        Create-Lang-Version -Item $SwitzerlandAirport -Lang $_ -Field "Name" -Value "Switzerland"
    }
