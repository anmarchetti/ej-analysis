  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatAndBags = Get-Or-Create-Item -path "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags" -template "{27E19C52-90FB-44E3-BF71-9FAAC3FD7B0B}";
    if ($seatAndBags -ne $null){
        $seatAndBags.Editing.BeginEdit();
        $seatAndBags["ErrorDepartureMessage"] = "<p><strong>Seats are unavailable at this time</strong></p><p>We can't book your seats right now, you can select your seats for your flights on <a href='https://www.easyjet.com/en/'>easyJet.com</a> or via our app after you've booked, or when you check in for your flight 30 days before departure.&nbsp;</p>";
        $seatAndBags["SeriesSeatFlights"] = "<p><strong>Looking to pick your seats?</strong></p><p>If you'd like to select your seats for your flights, you're able to do this when you check in for your flight 30 days before departure.</p>";
        $seatAndBags["BookingOutOfSync"] = "<p><strong>Looking to pick your seats?</strong></p><p>To view, add or change your selected seats for your flight, please go to<a href='https://www.easyjet.com/en?chkin=2'> easyjet.com</a>.</p>";
        $seatAndBags.Editing.EndEdit();
        
        Write-Host $seatAndBags.Name "is updated";
    }
