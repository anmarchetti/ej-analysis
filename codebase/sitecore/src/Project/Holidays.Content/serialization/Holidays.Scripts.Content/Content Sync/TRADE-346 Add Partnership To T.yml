- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $datasourcename = "Partnership Component"
    $datasourcepath ="/sitecore/content/EasyJet/TradePortal/Home/Log in/Page Components"
    $datasourceitemtemplateid = "{ED5D6BA0-91B1-41ED-AD54-A26A7785E166}"
    
    $itemPath = "/sitecore/content/EasyJet/TradePortal/Home/Log in"
    $renderingId = "{EF923FE5-72B8-41AE-9D17-BD2B8B99A377}"
    $placeholder = "/body/partnership-{12270ccf-6981-4be7-97c9-4964fa57f996}-0"
    
    function create-datasource-item($name, $path, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
                if($item -ne $null){
                    Write-Host "Partnership Component Datasource is created"
                }
            return $item
        }    
        return $item
    }
    
    function add-rendering-with-datasource-to-item($renderingId, $item, $datasource, $placeholderName){
        $existsRendering = Get-Rendering -Item $item -PlaceHolder $placeholderName  | Where-Object {$_.ItemId -eq $renderingId}
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering  -Placeholder $placeholderName
        if($existsRendering -eq $null){
            Add-Rendering -Item $item -PlaceHolder $placeholderName  -DataSource $datasource.FullPath -Instance $renderingItem
        }
    }
    
    # Create datasource
    $datasourceitem = create-datasource-item -Name $datasourcename -Path $datasourcepath -TemplateId $datasourceitemtemplateid
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    if($item -ne $null){
        add-rendering-with-datasource-to-item -RenderingId $renderingId -Item $item -Datasource $datasourceitem -PlaceholderName $placeholder
    }
    
    # Change Login Footer presentation
    # remove Page Footer Slim and add Page Footer
    $loginFooterPath = "/sitecore/content/EasyJet/TradePortal/Presentation/Partial Designs/Login Footer"
    $loginFooterItem = Get-Item -Path $loginFooterPath -ErrorAction SilentlyContinue
    $oldRenderingId = "{BF2F2B3C-FF58-481F-AF91-2467A32EBF89}"
    $oldRenderingItem = Get-Item -Path "master:" -Id $oldRenderingId -ErrorAction SilentlyContinue
    $newRenderingId = "{1BE9E86B-46EE-4D90-AA80-9873341F1324}"
    
    if($loginFooterItem -ne $null) {
        Remove-Rendering -Item $loginFooterItem -Rendering $oldRenderingItem -ErrorAction SilentlyContinue
    
        $existingRendering = Get-Rendering -Item $loginFooterItem -Placeholder '/footer' | Where-Object {$_.ItemId -eq $newRenderingId}
        if($existingRendering -eq $null) {
            $newRenderingItem= Get-Item -Database "master" -Path $newRenderingId | New-Rendering
            Add-Rendering -Item $loginFooterItem -Instance $newRenderingItem -PlaceHolder '/footer'
            Get-Rendering -Item $loginFooterItem -PlaceHolder '/footer' | Set-RenderingParameter -Parameter @{IsTriangleStart = "0"}  | Set-Rendering -Item $loginFooterItem 
        }
        Write-Host "Login Page Footer Updated"
    }
