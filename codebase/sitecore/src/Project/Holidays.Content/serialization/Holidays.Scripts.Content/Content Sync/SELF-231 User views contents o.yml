Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SELF-231 User views contents of special requests pop-up"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $specialRequests = Get-Item -Path "master:///sitecore/content/EasyJet/Holidays/Data/Special Requests" -ErrorAction SilentlyContinue
    
    if ($specialRequests -ne $null) {
    	$specialRequests.Editing.BeginEdit();
    	$specialRequests["AddRequestsCTA"] = "Add requests"
    	$specialRequests["AddRequestTitle"] = "SPECIAL REQUESTS"
    	$specialRequests["AddRequestDescription"] = "Are you going on holiday for a special occasion and would like to let the hotel know, or simply have a  preferences on things like bed type, then make your requests with the hotel now."
        $specialRequests["AmendRequestIcon"] = "<image mediaid='{C0D4A8E6-BA76-4D93-BF0A-7D850F10D974}' />"
    	$specialRequests.Editing.EndEdit() | Out-Null
    
    	Write-Host "Special requests are updated"
    }
    
