  Hint: Script
  Value: |
        $dataFolderPath = "/sitecore/content/EasyJet/Holidays/Data"
        $livePriceFolderTempalteId = "{DF7E8EBD-7A96-4E39-956C-32B3A0B81D10}"
        $namesSearchesFolderTempalteId = "{E0C28696-E187-46B6-801C-A71313F6A316}"
        $periodsFolderTempalteId = "{D33B46F8-CEC5-4482-AF8A-7F6CCBBE5764}"
        
        
        function Create-Item($path,$name, $templateId){
            $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -Name $name -ItemType $templateId
            }
            return $item;
        }
        
        $livePriceItem = Create-Item -Path $dataFolderPath -Name "Live Price" -TemplateId $livePriceFolderTempalteId
        Write-Host "Path: $($livePriceItem.ItemPath)"
        
        Create-Item -Path $livePriceItem.ItemPath -Name "Names Searches" -TemplateId $namesSearchesFolderTempalteId
        Create-Item -Path $livePriceItem.ItemPath -Name "Periods" -TemplateId $periodsFolderTempalteId
        
        
    
