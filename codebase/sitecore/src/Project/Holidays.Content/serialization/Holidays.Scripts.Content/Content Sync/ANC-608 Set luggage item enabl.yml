Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-608 Set luggage item enable flag and disable sports equipment"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-item($path, $field, $value, $lang) {
    	if ($lang -eq $null) { $lang = "en" }
    	
    	$item = Get-Item -Path $path -Language $lang -ErrorAction SilentlyContinue
    	
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item[$field] = $value;
    		$item.Editing.EndEdit() | Out-Null
            Write-Host $("Item updated: $($item.Paths.FullPath)")
        } else {
            Write-Host $("Item not found: $($item.Paths.FullPath)")
        }
    }
      
    function disable-sports-equipment() {
    	update-item -Path "/sitecore/content/EasyJet/Holidays/Settings/Luggage Settings" -Field "IsSportsEquipmentEnabled" -Value "0"
    	update-item -Path "/sitecore/content/EasyJet/TradePortal/Settings/Luggage Settings" -Field "IsSportsEquipmentEnabled" -Value "0"
    }
    
    function enable-hold-luggage() {
        update-item -Path "/sitecore/content/EasyJet/Holidays/Data/Luggage/Hold Baggage/Hold Baggage 15kg" -Field "IsLuggageItemEnabled" -Value "1"
        update-item -Path "/sitecore/content/EasyJet/TradePortal/Data/Luggage/Hold Baggage/Hold Baggage 15kg" -Field "IsLuggageItemEnabled" -Value "1"
    }
    
    disable-sports-equipment
    enable-hold-luggage
    
    Write-Host "Script was executed"
    
