Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/CSSDA-215 Create No Dates Availability Popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath, $parameters = @{}) {
    	$renderingItem = Get-Item -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath
    		Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder | Set-RenderingParameter -Parameter $parameters | Set-Rendering -Item $page
    		Write-Host "Rendering instance added";
    	}
    	else {
    		Write-Host "Already exists";
    	}
    }
    
    function create-lang-version($item,$lang,$field,$value) {
            $targetLangItem = Get-Item -Path "master:" -ID $item.ID -Language $lang -ErrorAction SilentlyContinue
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path "master:" -ID $item.ID -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    # Page
    $viewBookingPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $viewBookingPage = Get-Or-Create-Item -path $viewBookingPagePath
    
    $viewBookingRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/View Booking"
    $viewBookingRendering = Get-Item -Path $viewBookingRenderingPath;
    
    $renderedViewBooking = Get-Rendering -Item $viewBookingPage -Render $viewBookingRendering;
    
    $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $renderigPlaceholder = "/body/attention-popup-" + $renderedViewBooking.UniqueId + "-0";
    
    # First grab original inventory error popup so we can remove it later
    $inventoryErrorInstance = Get-Rendering -Item $viewBookingPage -PlaceHolder $renderigPlaceholder;
    
    $existingInventoryErrorPopupPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Inventory Error Popup";
    
    
    #Create New Popup Component
    $amendDatesAvailabilityPopupPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/No Dates Popup";
    $amendDatesAvailabilityPopupItem = Get-Or-Create-Item -Path $amendDatesAvailabilityPopupPath -Template "{C8C39B93-2202-4B2D-937F-8F644B0D3183}"
    
    if ($amendDatesAvailabilityPopupItem -ne $null) {
    	$amendDatesAvailabilityPopupItem.Editing.BeginEdit();
    
    	$amendDatesAvailabilityPopupItem["Title"] = "WE'RE SORRY, THERE'S NO DATES AVAILABLE FOR YOUR SELECTED HOTEL";
    	$amendDatesAvailabilityPopupItem["Description"] = "<p>There's no available dates online for your selected hotel.</p><p>If you need to talk to us about changing your holiday package please contact us.</p>";
    	$amendDatesAvailabilityPopupItem["CTA"] = "Contact us";
    	$contactFormItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us"
    
        $amendDatesAvailabilityPopupItem["CTALink"] = '<link linktype="internal" id="' + $contactFormItem.Id + '" text="Contact us" />'
    	
        @('fr-CH', 'fr-FR') | % {
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "Title" -Value "NOUS SOMMES DÉSOLÉS, IL N'Y A PAS DE DATES DISPONIBLES POUR L'HÔTEL CHOISI"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "Description" -Value "<p>Il n'y a pas de dates disponibles en ligne pour l'hôtel sélectionné.</p><p>Si vous souhaitez nous parler de la modification de votre forfait de vacances, veuillez nous contacter.</p>"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "CTA" -Value "Contactez nous"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "CTALink" -Value '<link linktype="internal" id="' + $contactFormItem.Id + '" text="Contactez nous" />'
        }
        @('de-CH', 'de-DE') | % {
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "Title" -Value "ES TUT UNS LEID, ES SIND KEINE TERMINE FÜR DAS VON IHNEN GEWÄHLTE HOTEL VERFÜGBAR"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "Description" -Value "<p>Für das von Ihnen gewählte Hotel gibt es online keine verfügbaren Termine.</p><p>Wenn Sie mit uns über eine Änderung Ihres Urlaubspakets sprechen möchten, kontaktieren Sie uns bitte.</p>"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "CTA" -Value "Kontakt"
               Create-Lang-Version -Item $amendDatesAvailabilityPopupItem -Lang $_ -Field "CTALink" -Value '<link linktype="internal" id="' + $contactFormItem.Id + '" text="Kontakt" />'
        }
        
        Write-Host $amendDatesAvailabilityPopupItem.Name "Updated";
    	$amendDatesAvailabilityPopupItem.Editing.EndEdit() | Out-Null;
    }
    
    if (Get-Rendering -Item $viewBookingPage -PlaceHolder $renderigPlaceholder) {
    
        # Add params to new inventory error popup and add it to viewBookingPage rendering
        Add-Or-Update-Page-Rendering -page $viewBookingPage -renderingPath $renderingPath -renderingPlaceholder $renderigPlaceholder -dataSourcePath $existingInventoryErrorPopupPath -parameters @{ "popupType" = "InventoryError" }
        Write-Host "New Inventory Error Popup rendering added to viewBookingPage with params"
        
        # Add rendering with parameters for new attention popup
        if ($amendDatesAvailabilityPopupItem -ne $null) {
        	Add-Or-Update-Page-Rendering -page $viewBookingPage -renderingPath $renderingPath -renderingPlaceholder "/body/attention-popup-{5500AC44-5DF4-4473-8E8C-EA635A187882}-0" -dataSourcePath $amendDatesAvailabilityPopupItem.ID -parameters @{ "popupType" = "NoDatesError" }
        	Write-Host "New No Dates Popup added to viewBookingPage with params"
        }
    }
    
    # Now remove old inventory Error popup instance
    if ($inventoryErrorInstance -ne $null) {
        Write-Host "Removing old inventoryErrorInstance"
        Remove-Rendering -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -Instance $inventoryErrorInstance
    }
    
