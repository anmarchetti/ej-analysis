- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/
    $itemTemplateId = "{D5A11063-EC21-443C-9CED-340F1869FFAE}"
    $itemName = "My Bookings Settings"
    
    $parentPaths = @(
        "master:/content/EasyJet/Holidays/Settings",
        "master:/content/EasyJet/TradePortal/Settings"
    )
    
    foreach ($parentPath in $parentPaths) {
    
        $itemPath = "$parentPath/$itemName"
    
        $parent = Get-Item -Path $parentPath -ErrorAction SilentlyContinue
        if ($parent -eq $null) {
            Write-Host "Parent path not found:" $parentPath -ForegroundColor Red
            continue
        }
    
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        if ($item -eq $null) {
    
            # create item
            $item = New-Item -Path $itemPath -ItemType $itemTemplateId
    
            Write-Host "Item" $item.Name "successfully created under" $parentPath -ForegroundColor Green
        }
        else {
            Write-Host "Item" $itemName "already exists under" $parentPath -ForegroundColor Yellow
        }
    }
