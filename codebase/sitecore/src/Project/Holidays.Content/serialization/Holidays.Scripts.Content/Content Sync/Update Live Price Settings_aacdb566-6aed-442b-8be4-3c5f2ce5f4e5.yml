  Hint: Script
  Value: |
    $itemPath = "master:/content/EasyJet/Holidays/Settings/Live Price Settings"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
       
        
        $item.Editing.BeginEdit()
        $item["FeaturedHotelsLivePrice"] = '1';
    $item["MosaicComponentLivePrice"] = '1';
    $item["DestinationHeroBannerLivePrice"] = '1';
    $item["MasonryCarouselLivePrice"] = '1';
    $item["DestinationLikeLivePrice"] = '1';
    $item["HotelDetailsBrowseStateLivePrice"] = '1';
        
        $item.Editing.EndEdit() | Out-Null;
        
        Write-Host "Item" $item.Name "successfully updated";
    } 
