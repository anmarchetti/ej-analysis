  Value: |
    $linkItem = Get-Item -path "master:/sitecore/content/EasyJet/Holidays/Data/Navigations/Account/Holiday Credit" -ErrorAction SilentlyContinue;
    $holidayCreditPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Booking/Holiday Credit" -ErrorAction SilentlyContinue
    
    if($linkItem -ne $null -and $holidayCreditPage -ne $null) {
      $linkItem.Editing.BeginEdit()
      $linkItem["Link"] = "<link text='Available credit' linktype='internal' id='$($holidayCreditPage.ID)' />"
      $linkItem.Editing.EndEdit() | Out-Null;
    }
