Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/Manual/INS-546 Full With Banner - Update Versions Based On File"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Version($isSlim, $isGeneric, $textAlign){
        if($isSlim){
            return [ordered]@{"Version"="SlimWithShard"}
        }
        
        if($isGeneric){
            return [ordered]@{
                "Version" = "GenericContentWithoutShard"
                "CTATheme" = "URL" 
                "TitleFontStyle" = "generation headline"
            }
        }
        
        if($textAlign -eq "right"){
             return [ordered]@{"Version"="NonSlimWithoutShard"}
        }
        
        if($textAlign -eq "left"){
            return [ordered]@{"Version"="NonSlimWithShard"}
        }
        
        return [ordered]@{"Version"="NonSlimWithoutShard"}
    }
    
    
    # Define the path to the CSV file in the Sitecore Media Library
    $csvMediaItemPath = "/sitecore/media library/report-2024-11-28_105717"
    
    # Load the CSV file from the Media Library
    Write-Host "Fetching CSV file from Media Library..."
    $fileItem =  Get-Item -Path "master:$csvMediaItemPath" -ErrorAction Stop
    
    if ($fileItem -ne $null) {
        $mediaItem = [Sitecore.Data.Items.MediaItem]$fileItem
        # Get the media stream
        $media = [Sitecore.Resources.Media.MediaManager]::GetMedia($mediaItem)
        if ($media -ne $null) {
            $mediaStream = $media.GetStream().Stream
            if ($mediaStream -ne $null) {
                # Read the CSV content directly from the media stream
                Write-Host "Parsing CSV file directly from Media Library..."
                $reader = New-Object System.IO.StreamReader($mediaStream)
                $csvContent = $reader.ReadToEnd()
                $reader.Close()
                $mediaStream.Close()
    
                # Convert CSV content to an array of objects
                $csvData = $csvContent | ConvertFrom-Csv
                if ($csvData.Count -eq 0) {
                    throw "No data found in the CSV file."
                }
            } else {
                throw "Media stream is null for the file at $csvMediaItemPath"
            }
        } else {
            throw "Unable to get media from the file at $csvMediaItemPath"
        }
    } else {
        throw "CSV file not found at $csvMediaItemPath"
    }
    
    # Process each row in the CSV file
    foreach ($row in $csvData) {
        $itemPath = $row.Page
        $isSlim = $row.IsSlimVersion
        $isGenric = $row.IsGenericContentVersion
        $uniqueId = $row.UniqueId
        $textAlign = $row.TextAlignment
        $isBold = $row.TitleStyle
    
        Write-Host "Processing item at path $itemPath with rendering $uniqueId"
        
        # Get the Sitecore item
        $item = Get-Item -Path "master:$itemPath" -ErrorAction SilentlyContinue
        if ($item -eq $null) {
            Write-Warning "Item not found $itemPath"
            continue
        }
        
     
    
        # Get the renderings of the item
        $renderings = $item | Get-Rendering -UniqueId $uniqueId
        if ($renderings.Count -eq 0) {
            Write-Warning "Rendering not found $uniqueId for item $itemPath"
            continue
        }
    
        $parameters = Get-Version -isSlim $isSlim -isGeneric $isGenric -textAlign $textAlign
        
        
        if($isBold -eq "bold"){
            $param = [ordered]@{"TitleFontStyle" = "generation headline"}
            $renderings | Set-RenderingParameter -Parameter $param | Set-Rendering -Item $item 
        }
    
        # Update the rendering parameters
        #Remove Rendering Parameter
        $renderings | Remove-RenderingParameter -Name "IsGenericContentVersion"|  Remove-RenderingParameter -Name "IsSlimVersion" |  Remove-RenderingParameter -Name "TitleStyle" | Set-RenderingParameter -Parameter $parameters | Set-Rendering -Item $item 
        $output = $renderings | Get-RenderingParameter
        $version = $output["Version"]
        $ctaTheme = $output["CTATheme"]
        $font = $output["TitleFontStyle"]
        Write-Host "Version was updated to $version $ctaTheme $font"
    }
    
    
    Write-Host "Script execution complete."
    
