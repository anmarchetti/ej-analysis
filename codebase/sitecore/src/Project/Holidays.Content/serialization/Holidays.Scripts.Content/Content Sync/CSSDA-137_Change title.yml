  Hint: Script
  Value: |
    $amendDatesSummaryComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Amend Dates Summary Page";
    $amendDatesSummaryComponentItem =  Get-Item -Path $amendDatesSummaryComponentPath;
    
    #Update Amend DatesSummary title
    if ($amendDatesSummaryComponentItem -ne $null) {
        $amendDatesSummaryComponentItem.Editing.BeginEdit();
    
        $amendDatesSummaryComponentItem["Title"]="Review and confirm";
        $amendDatesSummaryComponentItem["Subtitle"]="Good news, we can re-schedule your holiday! Please review the changes to your holiday below carefully and we will update your booking after you've confirmed. If we haven't been able to exactly match your original holiday room, board and transfer options, we've provided the next best match based on price for you to review and confirm.";
        $amendDatesSummaryComponentItem["IsAttentionMessageEnabled"]="";
        
        $amendDatesSummaryComponentItem.Editing.EndEdit() | Out-Null;
    }
