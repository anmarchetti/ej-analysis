DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $linkTemplateId = "{BC011F0A-976C-4825-9E01-8BAA7C8E6CCA}";
    
    function update-item($rename, $link, $image, $children, $name, $showon, $onecolumn){
        $item.Editing.BeginEdit()
        
        if ($rename -ne $null) {
            $item.Name = $rename;
        }
        
        if ($image -ne $null) {
            $item["Image"] = $image;
        }
        
        if ($link -ne $null) {
            $item["Link"] = $link;
        }
        
        if ($children -ne $null) {
            $item["ChildrenLinks"] = $children;
        }
        if ($showon -ne $null) {
            $item["ShowOn"] = $showon;
        }
        
        if ($name -ne $null) {
            $item["Name"] = $name;
        }
        
        if ($onecolumn -ne $null) {
            $item["OneColumn"] = $onecolumn;
        }
        
        $item.Editing.EndEdit() | Out-Null;
    
        Write-Host "Item" $item.Name "successfully updated";
    }
    
    function create-or-update-item($item, $path, $templateId, $rename, $link, $image, $children, $name, $showon, $onecolumn){
        if ($item -eq $null) {
            # Create Item
            $item = New-Item -Path $path -ItemType $templateId;
            Write-Host "Item" $item.Name "successfully created";
            # Update Item
            update-item -Rename $rename -Image $image -Link $link -Children $children -Name $name -Showon $showon -Onecolumn $onecolumn
        } else {
            Write-Host "Item" $path "already exists";
            # Update Item
            update-item -Rename $rename -Image $image -Link $link -Children $children -Name $name -Showon $showon -Onecolumn $onecolumn
        }
    }
    
    
    
    $viewAllDestinationsPath = "master:/content/EasyJet/Holidays/Data/Navigations/Destinations Groups/View All Destinations"
    $viewAllDestinations = Get-Item -path $viewAllDestinationsPath -ErrorAction SilentlyContinue
    create-or-update-item -Item $viewAllDestinations -Path $viewAllDestinationsPath -TemplateId $linkTemplateId -Link '<link text="View all destinations" linktype="external" url="/en/holidays/destinations" anchor="" target="" rel="" />'
    
    $generalPath = "master:/content/EasyJet/Holidays/Data/Navigations/Destinations Groups/General"
    $general = Get-Item -path $generalPath -ErrorAction SilentlyContinue
    $viewAllDestinationsItem = Get-Item -path $viewAllDestinationsPath -ErrorAction SilentlyContinue
    create-or-update-item -Item $general -Path $generalPath -TemplateId $linkTemplateId -Link '' -Children "$($viewAllDestinationsItem.ID)" -Onecolumn '1'
    
    $destinationsPath = "master:/content/EasyJet/Holidays/Data/Navigations/Main/Destinations"
    $destinations = Get-Item -path $destinationsPath -ErrorAction SilentlyContinue
    $generalItem = Get-Item -path $generalPath -ErrorAction SilentlyContinue
    create-or-update-item -Item $destinations -Path $destinationsPath -TemplateId $linkTemplateId -Link '<link text="Destinations" linktype="anchor" url="/destinations" anchor="#" title="" class="" />' -Children "$($destinations.ChildrenLinks)|$($generalItem.ID)" 
