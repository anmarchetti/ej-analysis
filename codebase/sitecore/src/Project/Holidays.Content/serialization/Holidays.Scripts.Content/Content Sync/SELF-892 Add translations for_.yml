        "Title" = "Aktualisiert (Dynamisches Datum und Uhrzeit)"
        "CTAButtonLabel" = "Ich verstehe"
        "Content" = '<p>Wir halten uns an <a rel="noopener noreferrer" href="https://www.gov.uk/foreign-travel-advice/israel" target="_blank">die neuesten Reisehinweise für Israel</a> und haben dementsprechend alle neuen und bestehenden Reisen dorthin bis zu einem späteren Zeitpunkt im Jahr vorerst pausiert. Wir werden unsere Aktivitäten angesichts der Situation weiterhin sorgfältig überprüfen.</p><p>Für Kunden mit bestehenden Buchungen überprüfen wir diese fortlaufend. Wenn wir Ihren Urlaub stornieren müssen, werden wir Sie direkt kontaktieren. Wenn Sie Ihre Buchung ändern, ein anderes Reiseziel wählen oder Ihren Urlaub stornieren möchten, um eine Gutschrift von easyJet holidays zu erhalten, können Sie dies im Rahmen unserer <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/why-book-with-us" target="_blank">Ultimate Flexibility</a> tun. In <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/help?helpCategory=changes&amp;helpQuestion=amend" target="_blank">unserem Hilfe-Center</a> erfahren Sie, wie das geht.</p><p>Wir empfehlen Ihnen auch, sich über die Reisehinweise des britischen Außenministeriums (Foreign, Commonwealth and Development Office) auf dem Laufenden zu halten, um offizielle Hinweise für Reisen nach Israel oder in nahe gelegene Länder zu erhalten <a rel="noopener noreferrer" href="https://www.gov.uk/foreign-travel-advice" target="_blank">https://www.gov.uk/foreign-travel-advice</a>.</p>'
