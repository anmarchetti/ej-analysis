    function Create-Partnerships () {
        # Create Folder
    	$partnershipsFolder = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Partnerships And Certificates" -TemplateId "{BC02C1DA-F6D3-4528-8CF8-247F73661AD9}"
    	$partnerItemTemplateId = "{5B5DE304-8F4D-4EFA-9AD6-2C4E7CD04821}"
    	$partnerItemRenderingId = "{F4FF6B9C-CA30-4123-A52E-3868FEAEF9F1}"
    
    	$travelFoundation = Get-Or-Create-Item -Path $partnershipsFolder.FullPath -ItemName "Travel Foundation" -TemplateId $partnerItemTemplateId
    	$travelFoundation.Editing.BeginEdit();
    	$travelFoundation["Description"] = "The Travel Foundation brings together different players in the travel industry to develop the practical solutions needed to maximise the benefits and minimise the negative impacts of tourism in everyone&rsquo;s holiday destinations. Which is why we&rsquo;re partnering with the Travel Foundation to shape our approach from the ground up."
        $travelFoundation["Icon"] = '<image mediaid="{78150FEE-3E9B-4252-9D71-C6F22C5606E4}" />'
    	$travelFoundation.Editing.EndEdit() | Out-Null
    	
    	$abta = Get-Or-Create-Item -Path $partnershipsFolder.FullPath -ItemName "ABTA" -TemplateId $partnerItemTemplateId
    	$abta.Editing.BeginEdit();
    	$abta["Description"] = "ABTA offers advice and guidance to the travel industry on high service standards, health and safety, and promoting responsible tourism &ndash; making them the perfect partner to help us on our journey towards a Travelife accreditation &ndash; an internationally&nbsp; recognised sustainability certification."
        $abta["Icon"] = '<image mediaid="{19EA4E30-BCA5-4EF6-9F51-B307CFD0DA41}" />'
    	$abta.Editing.EndEdit() | Out-Null
        
        $partnershipsFolder.Editing.BeginEdit();
        $partnershipsFolder["Title"] = "Our Partnerships and Certifications"
        $partnershipsFolder["Items"] = "$($travelFoundation.ID)|$($abta.ID)";
        $partnershipsFolder.Editing.EndEdit() | Out-Null
    
    
    	Update-Rendering-DataSource -Item $page -RenderingId $partnerItemRenderingId -PlaceHolder "/body/component-wrapper-inner-{7f17a79a-6a60-4c2d-81a3-dc51e0810503}-0" -NewDataSource $partnershipsFolder.ID
    }
    
    function Create-Policies () {
        $policies = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Our Policies" -TemplateId "{64F26678-8902-4AA0-BE58-939A70A6858D}"
        $policies.Editing.BeginEdit();
        $policies['Title'] = "Our Policies"
        $policies['Description'] = "<p>Read more about our policies here.</p><p>The great thing about all this is that we’re in it together. And if you’re reading this, then you’re as passionate about holidays that don’t cost the earth as we are. So go on, tell us what sustainability means to you. We’re all ears.</p>"
        $policies['Link'] = '<link text="Learn more" anchor="" linktype="internal" class="" title="" target="" querystring="" id="{0518D8C6-B7CA-4C73-86C2-A29D971EBEAB}" />'
        $policies.Editing.EndEdit() | Out-Null
    
        Update-Rendering-DataSource -Item $page -RenderingId "{1824D23D-F253-4974-AB84-1632328453E7}" -PlaceHolder "/body/component-wrapper-inner-{7f17a79a-6a60-4c2d-81a3-dc51e0810503}-0" -NewDataSource $policies.ID
    }
    
    Create-Hero-Banner
