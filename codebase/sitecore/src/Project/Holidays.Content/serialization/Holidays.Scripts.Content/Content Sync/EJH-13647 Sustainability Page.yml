        $leadFromInsideOut["MoreText"] = "More details"
        $leadFromInsideOut["Image"] = '<image mediaid="{5B1774C4-7E6F-4105-B443-1C667C452D28}" />'
        $leadFromInsideOut["HoverTitle"] = "Lead from the inside out"
        $leadFromInsideOut["HoverDescription"] = "By embedding sustainability into everything we do and pioneering meaningful change in our industry. This also means building sustainability into the very fabric of our business culture and all our decisions. Because if we can get that right then we can really influence our industry to move forward."
