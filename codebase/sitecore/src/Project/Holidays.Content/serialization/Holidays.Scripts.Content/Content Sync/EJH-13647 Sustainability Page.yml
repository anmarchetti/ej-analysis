    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource,$last) {
        if ($last -eq $null) {
            $rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
        } else {
            $rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -Last 1
        }
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    
    $pageTemplateId = "{CA44C600-239E-40CF-8E8A-B4F417C935D9}"
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Footer With Phone Number" -pageTemplateId $pageTemplateId
    
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" -ItemName "Sustainability" -TemplateId $pageTemplateId
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    function Create-Hero-Banner () {
        $heroBannerTemplateId = "{2EB9DAA0-43A7-4A89-8DD2-BBF92C29285D}"
        $heroBannerRenderingId = "{DEBE445D-27F2-44DA-8FD4-F4FD95BDBFF1}"
        
        $heroBanner = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Hero Banner" -TemplateId $heroBannerTemplateId
        $heroBanner.Editing.BeginEdit();
    	$heroBanner["Image"] = '<image mediaid="{64B55804-F985-490C-BC4A-FCA7804B5368}" />'
    	$heroBanner["Title"] = "Holidays that don’t cost the earth"
        $heroBanner["Subtitle"] = "Nothing beats the excitement of touching down somewhere special. And if you’re on the hunt to find out how we’re building genuinely sustainable easyJet holidays that give a lot more than they take, then you’ve landed in the right place. So step this way for our vision, mission, and overall approach to sustainability..."
        $heroBanner["Variant"] = "Opaque White Stripe"
        $heroBanner["PromoLogo"] = '<image mediaid="{99FF9F17-D18C-4A6A-9CB2-E2B5D4A2DCBE}" />'
    	$heroBanner.Editing.EndEdit() | Out-Null
    
        Update-Rendering-DataSource -Item $page -RenderingId $heroBannerRenderingId -PlaceHolder "body" -NewDataSource $heroBanner.ID
    }
    
    function Create-Text-Blocks () {
    	# Create Text Blocks Folder
    	$textBlocksFolder = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Text Blocks" -TemplateId "{AB8D608B-3B9D-4ECB-9BA3-8C61306D7A41}"
    	$textBlockTemplateId = "{BD18AA14-C33D-4E76-B5F4-59CBB936BE31}"
    	$textBlockRenderingId = "{43546A28-D231-4287-96D2-25DEF529F1A5}"
    
    	# Create "Come With Us" Text Block
    	$comeWithUsTextBlock = Get-Or-Create-Item -Path $textBlocksFolder.FullPath -ItemName "Come With Us" -TemplateId $textBlockTemplateId
    	$comeWithUsTextBlock.Editing.BeginEdit();
    	$comeWithUsTextBlock["Title"] = "COME WITH US"
    	$comeWithUsTextBlock["Description"] = "We’re on a mission to become the most trusted holiday provider in the UK. For us that means being honest and open about our economic, social, and environmental impacts. Because we’re on a sustainability journey. And we want you to join us. We’ve even made a little video about it which will tell you just how and why we’re leading the travel industry by example and working towards a world where sustainable travel is accessible to everyone – without passing the cost on to you, or costing the earth. Want to know more? Then take a peep."
    	$comeWithUsTextBlock.Editing.EndEdit() | Out-Null
    	
        # Set "Come With Us" DataSource
    	Update-Rendering-DataSource -Item $page -RenderingId $textBlockRenderingId -PlaceHolder "/body/component-wrapper-inner-{09e200d1-ab7d-4e2c-aebc-8f97d4565e1c}-0" -NewDataSource $comeWithUsTextBlock.ID
    
    
    	# Create "Our Vision" Text Block
    	$ourVisionTextBlock = Get-Or-Create-Item -Path $textBlocksFolder.FullPath -ItemName "Our Vision" -TemplateId $textBlockTemplateId
    	$ourVisionTextBlock.Editing.BeginEdit();
    	$ourVisionTextBlock["Title"] = "Our vision is a world where travel makes a positive impact on the environment and local communities"
    	$ourVisionTextBlock.Editing.EndEdit() | Out-Null
    
    	# Set "Our Vision" DataSource
    	Update-Rendering-DataSource -Item $page -RenderingId $textBlockRenderingId -PlaceHolder "/body/component-wrapper-inner-{09e200d1-ab7d-4e2c-aebc-8f97d4565e1c}-0" -NewDataSource $ourVisionTextBlock.ID -Last True
    }
    
    function Create-Information-Banners () {
        # Create Folder
    	$bannersFolder = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Information Banners" -TemplateId "{ED924453-895C-4D34-8487-79D82FF505F9}"
    	$bannerTemplateId = "{049F0CD3-A3F4-4C04-9856-CDECAD8DE6AC}"
    	$bannerRenderingId = "{9548AF18-BCAB-4DAE-A754-B3A99C14A429}"
    
    	# Create "Our Mission" banner
    	$ourMissionBanner = Get-Or-Create-Item -Path $bannersFolder.FullPath -ItemName "Our Mission" -TemplateId $bannerTemplateId
    	$ourMissionBanner.Editing.BeginEdit();
    	$ourMissionBanner["Title"] = "Our Mission"
    	$ourMissionBanner["Description"] = "When it comes to sustainability we want to raise the bar, positively shake things up and lead the industry. To make sustainability part of our everyday culture, enabling us, our partners, and our customers to reduce their footprint, and make a positive impact on the people and places that make our destinations so special."
        $ourMissionBanner["Image"] = '<image mediaid="{9EEFFC73-A852-4582-908F-14DC8A5BBD67}" />'
    	$ourMissionBanner.Editing.EndEdit() | Out-Null
    	
        # Set "Our Mission" DataSource
    	Update-Rendering-DataSource -Item $page -RenderingId $bannerRenderingId -PlaceHolder "body" -NewDataSource $ourMissionBanner.ID
    
        # Create "Carbon Offsetting" banner
    	$carbonOffsettingBanner = Get-Or-Create-Item -Path $bannersFolder.FullPath -ItemName "Carbon Offsetting" -TemplateId $bannerTemplateId
    	$carbonOffsettingBanner.Editing.BeginEdit();
    	$carbonOffsettingBanner["Title"] = "CARBON OFFSETTING"
    	$carbonOffsettingBanner["Description"] = "<p>We’re proud to be the first major tour operator to offset the carbon emissions from our package holidays. That’s all the fuel used for flights and your in-destination transfers, as well as the energy used for hotel stays – all without passing the cost onto you. Better still, we’ve backdated this move to offset all our holidays since we launched back in November 2019.</p><p>easyJet got the ball rolling in November 2019, becoming the first major airline to offset the carbon emissions from the fuel used on all its flights. Since then it’s also minimised its impact by flying a modern fleet of fuel efficient aircraft leading, by the year 2000, to a cut in carbon emissions per passenger, per kilometre by a third. </p><p>But because we know carbon offsetting is only an interim answer, easyJet is hard at work pioneering the all-electric, hybrid and hydrogen propulsion systems we all need to achieve zero-emission flying in the future. </p><p>But because we know carbon offsetting is only an interim answer, easyJet is hard at work pioneering the all-electric, hybrid and hydrogen propulsion systems we all need to achieve zero-emission flying in the future. </p><p />We’re also working hard with our partners to expand the scope of our carbon offsetting to include even more elements of your holiday – from door to door – and, of course, we’ll keep you posted.<p />"
        $carbonOffsettingBanner["Image"] = '<image mediaid="{EF03DAFE-79C6-430D-BFD5-E5064147BB97}" />'
    	$carbonOffsettingBanner.Editing.EndEdit() | Out-Null
    	
        # Set "Our Mission" DataSource
    	Update-Rendering-DataSource -Item $page -RenderingId $bannerRenderingId -PlaceHolder "body" -NewDataSource $carbonOffsettingBanner.ID -Last True
    }
    
