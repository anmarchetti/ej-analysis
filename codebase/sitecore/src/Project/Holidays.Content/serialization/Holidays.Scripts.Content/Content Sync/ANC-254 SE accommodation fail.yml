  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        
        return $item
    }
    
    $popupTemplateId = '{4683D757-E5BC-46C3-B734-B5735C11A675}'
    
    # SE Remove Transfer Popup DS creating
    function Create-SE-Remove-Popup($path){
        $banner = Get-Or-Create-Item -Path $path -Template $popupTemplateId
        
        if($banner -ne $null) {
            $banner.Editing.BeginEdit()
            $banner['Title'] = 'Adding sports equipment will remove your transfer'
            $banner['Description'] = "<p>We’re sorry, but our shared transfer provider can’t accommodate sports equipment at this time.</p><p>You may add sports equipment, but we will remove your transfer on this booking.</p>"
            $banner['ConfirmButtonLabel'] = 'Add, but remove transfer'
            $banner['CancelButtonLabel'] = 'Cancel'
            $banner.Editing.EndEdit() | Out-Null
        }
        
        Write-Host "SE Remove Transfer Popup DS created on" $path
        
        return $banner
    }
    
    $bannerSERemoveTransfer = Create-SE-Remove-Popup -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Transfer Section/SE Remove Transfer Popup'
    $bannerTradeSERemoveTransfer = Create-SE-Remove-Popup -Path '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Transfer Section Trade/SE Remove Transfer Popup'
    
    # Transfer Remove SE Popup DS creating
    function Create-Transfer-Remove-Popup($path){
        $banner = Get-Or-Create-Item -Path $path -Template $popupTemplateId
        
        if($banner -ne $null) {
            $banner.Editing.BeginEdit()
            $banner['Title'] = 'Changing your transfer will remove your sports equipment'
            $banner['Description'] = "<p>We’re sorry, but our shared transfer provider can’t accommodate sports equipment at this time.</p><p>If you select this transfer, we will remove your sports equipment.</p>"
            $banner['ConfirmButtonLabel'] = 'Change transfer anyway'
            $banner['CancelButtonLabel'] = 'Cancel'
            $banner.Editing.EndEdit() | Out-Null
        }
        
        Write-Host "Transfer Remove SE Popup DS created on" $path
        
        return $banner
    }
    
    $bannerTransferRemoveSE = Create-Transfer-Remove-Popup -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Transfer Section/Transfer Remove SE Popup'
    $bannerTradeTransferRemoveSE = Create-Transfer-Remove-Popup -Path '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Transfer Section Trade/Transfer Remove SE Popup'
    
    # set popups to transfer DS
    $transferItem =  Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Transfer Section' -ErrorAction SilentlyContinue
    if($transferItem -ne $null) {
        $transferItem.Editing.BeginEdit()
        $transferItem['SERemoveTransferPopup'] = $bannerSERemoveTransfer.ID
        $transferItem['TransferRemoveSEPopup'] = $bannerTransferRemoveSE.ID
        $transferItem.Editing.EndEdit() | Out-Null
        
        Write-Host "SE accommodation fail popups set on Holidays"
    }
    
    $transferItemTrade =  Get-Item -Path '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Transfer Section Trade' -ErrorAction SilentlyContinue
    if($transferItemTrade -ne $null) {
        $transferItemTrade.Editing.BeginEdit()
        $transferItemTrade['SERemoveTransferPopup'] = $bannerTradeSERemoveTransfer.ID
        $transferItemTrade['TransferRemoveSEPopup'] = $bannerTradeTransferRemoveSE.ID
        $transferItemTrade.Editing.EndEdit() | Out-Null
        
        Write-Host "SE accommodation fail popups set on Trade"
    }
    
    # add notice period for SE accommodation to settings
    function Update-Settings($project) {
        $itemPath = "master:/sitecore/content/EasyJet/$project/Settings";
        $itemName = "Luggage Settings";
        $item = Get-Item -path "$($itemPath)/$($itemName)" -ErrorAction SilentlyContinue
        
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["SEAccommodationNoticePeriod"] = "7";
            $item.Editing.EndEdit() | Out-Null
            
            Write-Host "Notice period for SE accommodation added to" $project "settings"
        }
    }
    
    Update-Settings -project "Holidays"
    Update-Settings -project "TradePortal"
    
    # holidays popups translations
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
        
