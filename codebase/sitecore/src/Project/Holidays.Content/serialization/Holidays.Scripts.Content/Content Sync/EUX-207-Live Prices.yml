Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-207-Live Prices"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/ 
    
    $livePriceDataFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Live Price"
    $livePriceDataFolderItem = Get-Item -path $livePriceDataFolderPath -ErrorAction SilentlyContinue
    
    $ukMarketSettingsItemPath = "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom"
    $ukMarketSettingsItem = Get-Item -path $ukMarketSettingsItemPath -ErrorAction SilentlyContinue
    
    if ($livePriceDataFolderItem -ne $null -and $ukMarketSettingsItem -ne $null) {
        
        $namedSearchesItemPath = "/sitecore/content/EasyJet/Holidays/Data/Live Price/Named Searches"
        $namedSearchesItem = Get-Item -path $namedSearchesItemPath -ErrorAction SilentlyContinue
        
        if ($namedSearchesItem -ne $null) {
            $namedSearchesItem.Editing.BeginEdit()
            $namedSearchesItem["Market"] =  $ukMarketSettingsItem.ID.ToString()
            $namedSearchesItem.Name = $namedSearchesItem.Name + " UK"
            $namedSearchesItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Item" $namedSearchesItem.Name "successfully updated"
        }
    }
