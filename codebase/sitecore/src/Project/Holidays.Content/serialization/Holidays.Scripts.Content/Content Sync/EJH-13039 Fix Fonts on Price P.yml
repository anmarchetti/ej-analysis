Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13039 Fix Fonts on Price Pages"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $textBlockRenderingId = '{43546A28-D231-4287-96D2-25DEF529F1A5}'
    
    function UpdateTextBlockFontSize ($page,$textRendering) {
    	if ($textRendering -ne $null) {
    		$textRendering.Parameters = "TitleFontSize=24"
    		Set-Rendering -Item $page -Instance $textRendering
    		Write-Host $page.Name "text block updated"
    	}
    }
    
    
    $pricePromisePage = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Price Promise" -ErrorAction SilentlyContinue
    if ($pricePromisePage -ne $null) {
        $textRendering = Get-Rendering -Item $pricePromisePage | Where-Object { $_.Placeholder -eq "/body/component-wrapper-inner-{a9f78e02-468e-4abc-92c1-010f009f634c}-0" -and $_.ItemId -eq $textBlockRenderingId } | Select -First 1
    	UpdateTextBlockFontSize -Page $pricePromisePage -TextRendering $textRendering
    }
    
    
    $priceGuaranteePage = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Root/Info/Price guarantee terms" -ErrorAction SilentlyContinue
    if ($priceGuaranteePage -ne $null) {
        $textRendering = Get-Rendering -Item $priceGuaranteePage | Where-Object { $_.Placeholder -eq "/body/component-wrapper-inner-{DF799241-1784-400B-8EFF-1E35CDE67606}-0" -and $_.ItemId -eq $textBlockRenderingId } | Select -Last 1
    	UpdateTextBlockFontSize -Page $priceGuaranteePage -TextRendering $textRendering
    } 
