Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Add Destination Guide Fields to Hotel Themes
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $hotelThemesPath = "master:/content/EasyJet/Holidays/Data/Hotel Themes"
    
    function update-destination-fields($item, $title, $url){
        if($item -ne $null){
            $item.Editing.BeginEdit()
            $item["DestinationGuideTitle"] = $title
            $item["DestinationGuideUrl"] = $url
            $item.Editing.EndEdit() | Out-Null;
            Write-Host $item.Name "is updated"
        }
    }
    
    function update-theme($themeName, $title, $url){
        $theme =  Get-Item -Path "$($hotelThemesPath)/$($themeName)" -ErrorAction SilentlyContinue
    
        if($theme -ne $null){
            update-destination-fields -Item $theme -Title $title -Url $url
            $types = $theme.GetChildren()
    
            ForEach($type in $types){
              update-destination-fields -Item $type -Title $type['Name'] -Url $type['Name']
            }
        }
    }
    
    update-theme -ThemeName 'Beach' -Title 'Beach Holiday' -Url 'Beach Holiday'
    update-theme -ThemeName 'City' -Title 'City Breaks' -Url 'City Breaks'
