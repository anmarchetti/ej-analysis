    $heroCarouselRendering = Get-First-Rendering -item $homeItem -renderingId $heroCarouselRenderingId;
    $newSearchPodPlaceholder = $heroCarouselRendering.placeholder + '/floating-searchpod-' + $heroCarouselRendering.uniqueID + '-0';
    $searchPodRenderingId = '{216FE85C-936E-4135-894B-E7DE8BF8A4C2}';
    $searchPodRendering = Get-First-Rendering -item $homeItem -renderingId $searchPodRenderingId;
    $searchPodRendering.placeholder = $newSearchPodPlaceholder;
    Set-Rendering -Item $homeItem -Instance $searchPodRendering;
    
    $countdownBanner.Editing.BeginEdit()
    $countdownBanner["Brightness"] = 'Dark';
    $countdownBanner["CTAType"] = 'Orange Button With White Text';
    $countdownBanner["TextColor"] = 'White';
    
