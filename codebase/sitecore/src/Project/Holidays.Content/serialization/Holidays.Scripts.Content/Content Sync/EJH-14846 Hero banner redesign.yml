    function Update-Rendering-Datasource ($datasource,$item,$renderingId) {
    	Get-Rendering -Item $item |
    	ForEach-Object {
    		if ($_.itemId -eq $renderingId) {
    			$_.DataSource = $datasource.Id;
    			Set-Rendering -Item $item -Instance $_;
    		}
    	}
    }
    
    function Get-First-Rendering($item,$renderingId) {
        Get-Rendering -Item $item | Where-Object { $_.itemId -eq $renderingId } | Select -First 1;
    }
    
    function Update-HeroBanner {
    	param([item]$item,$variant,$brightness,$CTAType,$CTA,$textColor,$subtitle,$title,$icon,$image,$mobileOnlyImage,$topText,$textBeforeNumber,$numberValue,$textAfterNumber)
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Brightness"] = $brightness;
    		$item["CTAType"] = $CTAType;
    		$item["CTA"] = $CTA;
    		$item["TextColor"] = $textColor;
    
    		$item["Variant"] = $variant;
    
    		$item["Title"] = $title;
    		$item["Subtitle"] = $subtitle;
    		$item["Icon"] = $icon;
    
    		$item["Image"] = $image;
    		$item["MobileOnlyImage"] = $mobileOnlyImage;
    
    		$item["TopText"] = $topText;
    		$item["TextBeforeNumber"] = $textBeforeNumber;
    
    		$item["NumberValue"] = $numberValue;
    		$item["TextAfterNumber"] = $textAfterNumber;
    		$item["CreditText"] = "T&C's apply";
    		$item["CreditLink"] = '<link text="Minimum spend &amp; T&amp;Cs apply" linktype="anchor" url="offer-conditions" anchor="offer-conditions" title="" class="" />';
    		$item.Editing.EndEdit() | Out-Null
    	}
    }
    
    function Get-Or-Create-Item {
    	param($parent,$itemName,$templateId)
    
    	$item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
    
    	if ($item.Count -eq 0) {
    		New-Item -Parent $parent -Name $itemName -ItemType $templateId
    	}
    
    	return $item
    }
    
    $homeItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home" #Home Page
    $pageComponentItem = Get-Item -Path "master:" -Id "{F396666F-E2F1-4904-9391-3BF98BEA3A35}" #ID Home Page component
    
    $heroCarousel = Get-Or-Create-Item -Parent $pageComponentItem -itemName "New Hero Carousel" -templateId "{BD304A2B-7D9A-4465-9EFC-3753BADEA8AE}" # Template ID of HeroCarousel
    $countdownBanner = Get-Or-Create-Item -Parent $heroCarousel -itemName "With Searchpod" -templateId "{6C23B3A3-1C5E-4968-8720-0240A7F03599}" # Template ID of CountdownBanner
    $heroBanner1 = Get-Or-Create-Item -Parent $heroCarousel -itemName "Standard" -templateId "{2EB9DAA0-43A7-4A89-8DD2-BBF92C29285D}" # Template ID of HeroBanner
