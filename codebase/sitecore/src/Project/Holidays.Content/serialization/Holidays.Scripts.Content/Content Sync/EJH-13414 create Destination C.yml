    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    function Create-Or-Update-Promo-Block($blockName, $title, $description, $image, $sortOrder) {
        $path = $promoBlocksFolderPath +'/'+ $blockName
        $item = Get-Or-Create-Item -path $path -templateId $promoBlockTemplateId
        
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Title"] = $title
            $item["Description"] = $description
            if($image -ne $null){
                $item["Image"] = '<image mediaid="' + $image +'" />';
            }
            $item["__Sortorder"] = $sortOrder
            $item.Editing.EndEdit() | Out-Null;
            
            Write-Host "Item" $item.Name "successfully updated";
        } else {
             Write-Host "Smth went wrong";
        }
    
    }
    
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Root/Info/Travel information"
    $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
            
    $promoBlocksFolderPath = $pagePath + "/Page Components/Traffic Lights Descriptions"
