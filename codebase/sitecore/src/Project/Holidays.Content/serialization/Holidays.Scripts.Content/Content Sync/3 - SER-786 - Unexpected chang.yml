            }
        )
        
    ImportContent -itemsToCreate $updates
    
    $page= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption"
    $componentWrapper = Get-Item -Path "/sitecore/layout/Renderings/Feature/Page Structure/Component Wrapper"
    $renderingComponentWrapper = Get-Rendering -Item $page -Rendering $componentWrapper
    
    Set-Rendering -Item $page -Instance $renderingComponentWrapper[0] -PlaceHolder "/body" -Parameter @{ "PaddingBottom" = "Padding Bottom 64px"; "PaddingTop" = "Padding Top 32px"; "PaddingBottomMobile" = "Padding Bottom Mobile 32px"; "PaddingTopMobile" = "Padding Top Mobile 32px" }
    Set-Rendering -Item $page -Instance $renderingComponentWrapper[1] -PlaceHolder "/body" -Parameter @{ "PaddingBottom" = "Padding Bottom 64px"; "PaddingTop" = "Padding Top 64px"; "PaddingBottomMobile" = "Padding Bottom Mobile 32px"; "PaddingTopMobile" = "Padding Top Mobile 32px"; "Anchor" = "what-to-do-now-section" }
    
    $promoBlocks = Get-Item -Path "/sitecore/layout/Renderings/Feature/PageContent/Promo Blocks"
    $renderingpromoBlocks = Get-Rendering -Item $page -Rendering $promoBlocks
    Set-Rendering -Item $page -Instance $renderingpromoBlocks -PlaceHolder "/body/component-wrapper-inner-$($renderingComponentWrapper[0].UniqueId)-0" -DataSource "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to expect tiles" -Parameter @{ "Theme" = "Link Tile With Border Variant" }
    
    $textBlock = Get-Item -Path "/sitecore/layout/Renderings/Feature/PageContent/Text Block"
    $renderingTextBlock = New-Rendering -Item $textBlock
    Add-Rendering -Item $page -PlaceHolder "/body/component-wrapper-inner-$($renderingComponentWrapper[0].UniqueId)-0" -Instance $renderingTextBlock -DataSource "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to expect - Section Title" -Parameter @{ "TitleTag" = "h2"; "TitleFontStyle" = "rounded demi"; "TitleFontSize" = "Mobile - 20px Desktop - 32px"; "TitleWeight" = 400; "PaddingSize" = "0px" } -Index 3
    
