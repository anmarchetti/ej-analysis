                TemplatePath = "/sitecore/templates/Feature/PageContent/Text Block"
                Fields      = @{
                    "Title" = @{
                        "en" = "WHAT TO EXPECT IN TIMES OF DISRUPTION"
                        "fr-CH" = "À QUOI VOUS ATTENDRE EN CAS DE PERTURBATION"
                        "de-CH" = "WAS SIE BEI REISESTÖRUNGEN ERWARTEN KÖNNEN"
                        "fr-FR" = "À QUOI VOUS ATTENDRE EN CAS DE PERTURBATION"
                        "de-DE" = "WAS SIE BEI STÖRUNGEN ERWARTEN KÖNNEN"
                    }
                    "__Sortorder" = @{
                        "en" = "200"
