  Hint: Script
  Value: |
    Import-Function "Import Content"
    
    Move-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/Promo blocks 2" -Destination "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Disruption/Page Components/What to expect tiles"
