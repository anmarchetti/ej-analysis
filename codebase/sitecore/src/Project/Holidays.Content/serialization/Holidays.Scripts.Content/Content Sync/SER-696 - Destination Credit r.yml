SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    Import-Function "Import Renderings"
    
    Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Refund Infos" | 
        Move-Item -Destination "/sitecore/content/EasyJet/Holidays/Data/View Booking Data"
        
    $updates = @(
            @{
                Path         = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos/Credit Refund By Destination rules"
                TemplatePath = "/sitecore/templates/Feature/Destinations/Refund Info"
                Fields      = @{
                    "Title" = @{
                        "en" = "Looking to cancel your holiday?"
                        "fr-CH" = "Vous voulez annuler vos vacances?"
                        "de-CH" = "Möchtest du deine Ferien stornieren?"
                        "fr-FR" = "Vous souhaitez annuler votre séjour?"
                        "de-DE" = "Du möchtest deinen Urlaub stornieren?"
                    }
                    "CancellationUnavailableDescription" = @{
                        "en" = "<p>If you wish to cancel your holiday, please check back here {hours} hours after you made your booking.</p>"
                        "fr-CH" = "<p>Si vous souhaitez annuler votre séjour, veuillez vérifier ici {hours} heures après avoir effectué votre réservation.</p>"
                        "de-CH" = "<p>Wenn Sie Ihren Ferien stornieren möchten, melden Sie sich bitte {hours} Stunden nach Ihrer Buchung hier zurück.</p>"
                        "fr-FR" = "<p>Si vous souhaitez annuler votre séjour, veuillez vérifier ici {hours} heures après avoir effectué votre réservation.</p>"
                        "de-DE" = "<p>Wenn Sie Ihren Urlaub stornieren möchten, melden Sie sich bitte {hours} Stunden nach Ihrer Buchung hier zurück.</p>"
                    }
                    "Description" = @{
                        "en" = "Due to the uncertainty around your holiday plans, we're offering a refund in easyJet holidays credit, so that you can book another holiday that’s right for you."
                        "fr-CH" = "En raison de l’incertitude entourant vos projets de vacances, nous vous proposons un remboursement sous forme de crédit easyJet holidays, afin que vous puissiez réserver un autre séjour qui vous convient."
                        "de-CH" = "Aufgrund der Unsicherheit bezüglich Ihrer Ferieplän bieten wir Ihnen eine Rückerstattung in Form eines easyJet holidays-Guthabens an, damit Sie einen anderen, passenden Ferien buchen können."
                        "fr-FR" = "En raison de l’incertitude entourant vos projets de vacances, nous vous proposons un remboursement sous forme de crédit easyJet holidays, afin que vous puissiez réserver un autre séjour qui vous convient."
                        "de-DE" = "Aufgrund der Unsicherheit bezüglich Ihrer Urlaubspläne bieten wir Ihnen eine Rückerstattung in Form eines easyJet holidays-Guthabens an, damit Sie einen anderen, passenden Urlaub buchen können."
                    }
                    "ButtonText" = @{
                        "en" = "Cancel my holiday"
                        "fr-CH" = "Annuler mes vacances"
                        "de-CH" = "Meine Ferien stornieren"
                        "fr-FR" = "Annuler mes vacances"
                        "de-DE" = "Meinen Urlaub stornieren"
                    }
                    "RefundType" = @{
                        "en" = "{6B34C2AB-E228-40CB-94DA-6D6A65452AEC}"
                    }
                    "PopupTitle" = @{
                        "en" = "You Will Lose The Expired Staff Credit"
                        "fr-CH" = "Vous perdrez le crédit personnel expiré"
                        "de-CH" = "Du verlierst die abgelaufene Personalgutschrift"
                        "fr-FR" = "Vous allez perdre l’avoir réservé au personnel expiré"
                        "de-DE" = "Du wirst das abgelaufene Personalguthaben verlieren"
                    }
                    "PopupDescription" = @{
                        "en" = "Are you sure you want to cancel your booking? As some or all of your staff credit has expired this will not be refunded. Once cancelled your booking cannot be reinstated."
                        "fr-CH" = "Vous êtes sûr de vouloir annuler votre réservation? Une partie ou l’intégralité de votre crédit personnel a expiré et ne sera pas remboursé. Une fois annulée, votre réservation ne peut être restaurée."
                        "de-CH" = "Bist du sicher, dass du deine Buchung stornieren willst? Deine Personalgutschrift ist ganz oder teilweise abgelaufen und wird nicht zurückerstattet. Wenn die Buchung storniert ist, kann dies nicht mehr rückgängig gemacht werden."
                        "fr-FR" = "Êtes-vous sûr de vouloir annuler votre réservation ? Une partie ou la totalité de votre avoir réservé au personnel a expiré et ne sera pas remboursé. Une fois annulée, votre réservation ne peut pas être rétablie."
                        "de-DE" = "Möchtest du wirklich deine Buchung stornieren? Ganz oder teilweise verfallenes Personalguthaben wird nicht zurückerstattet. Eine stornierte Buchung kann nicht rückgängig gemacht werden."
                    }
                }
            }
        )
    ImportContent -itemsToCreate $updates
    $bookingContextRenderingId = "{C30624AB-A71F-492A-ADFF-73A1952FF024}"
    $wrapperRenderingId = "{6615BDBE-E40B-4166-972A-5754B34A1F0E}"
    $wrapperItemRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}"
    $refundInfoRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Refund Info"
    
    #In Destination
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/in-destination" -ErrorAction SilentlyContinue
    
    $renderings = Get-Rendering -Item $page
    $bookingContextRenderings = $renderings | Where-Object { $_.ItemId -eq $bookingContextRenderingId }
    $wrapperRenderings = $renderings | Where-Object { $_.ItemId -eq $wrapperRenderingId }
    
    $bookingContextUniqueId = $bookingContextRenderings[0].UniqueId
    $wrapperUniqueId = $wrapperRenderings[0].UniqueId
    
    $placeholder = "/body/booking-context-$($bookingContextUniqueId)-0/masonry-section-$($wrapperUniqueId)-0"
    
    # Add Masonry Wrapper Item
    $masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    $masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder -Parameter @{ "ItemOrderOnMobile" = "37" } -Index 20
    
    $renderings = Get-Rendering -Item $page
    $placeholder = "/body/booking-context-$($bookingContextUniqueId)-0/masonry-section-$($wrapperUniqueId)-0/masonry-item-$($renderings[20].UniqueId)-0"
    
    # Add component
    $refundInfoRendering = Get-Item -Database "master" -Path $refundInfoRenderingPath | New-Rendering -Placeholder $placeholder 
    Add-Rendering -Item $page -Instance $refundInfoRendering -PlaceHolder $placeholder -Index 21 -Datasource "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos"
    
    
    
    #Pre-Travel
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel" -ErrorAction SilentlyContinue
    
    $renderings = Get-Rendering -Item $page
    $bookingContextRenderings = $renderings | Where-Object { $_.ItemId -eq $bookingContextRenderingId }
    $wrapperRenderings = $renderings | Where-Object { $_.ItemId -eq $wrapperRenderingId }
    
    $bookingContextUniqueId = $bookingContextRenderings[0].UniqueId
    $wrapperUniqueId = $wrapperRenderings[0].UniqueId
    
    $placeholder = "/body/booking-context-$($bookingContextUniqueId)-0/masonry-section-$($wrapperUniqueId)-0"
    
    # Add Masonry Wrapper Item
    $masonryRenderingPath = "/sitecore/layout/Renderings/Feature/Page Structure/Masonry/Masonry Wrapper Item"
    $masonryRendering = Get-Item -Database "master" -Path $masonryRenderingPath | New-Rendering -Placeholder $placeholder 
    Add-Rendering -Item $page -Instance $masonryRendering -PlaceHolder $placeholder -Parameter @{ "ItemOrderOnMobile" = "37" } -Index 20
    
    $renderings = Get-Rendering -Item $page
    $placeholder = "/body/booking-context-$($bookingContextUniqueId)-0/masonry-section-$($wrapperUniqueId)-0/masonry-item-$($renderings[20].UniqueId)-0"
    
    # Add component
    $refundInfoRendering = Get-Item -Database "master" -Path $refundInfoRenderingPath | New-Rendering -Placeholder $placeholder 
    Add-Rendering -Item $page -Instance $refundInfoRendering -PlaceHolder $placeholder -Index 21 -Datasource "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos"
    
    
    #View Booking
    $disruptionBannerRendering = Get-Item -Path $refundInfoRenderingPath
    $rendering = Get-Rendering -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -Rendering $disruptionBannerRendering
    
    if ($rendering -ne $null) {
        Set-Rendering -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -Instance $rendering -Datasource "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Refund Infos"
    }
