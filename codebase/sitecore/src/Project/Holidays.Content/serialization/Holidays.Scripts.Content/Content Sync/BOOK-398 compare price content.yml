Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/BOOK-398 compare price content"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
        	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
        		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        	}
        
        	if ($null -ne $field) {
        		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        		$targetLangItem.Editing.BeginEdit()
        		$targetLangItem[$field] = $value
        		$targetLangItem.Editing.EndEdit() | Out-Null
        	}
        }
    
    
    $itemHol = gi -Path "/sitecore/content/EasyJet/Holidays/Data/Compare Price Modules/Price Graph and Calendar Module"
    $itemTrade = gi -Path "/sitecore/content/EasyJet/TradePortal/Data/Compare Price Modules/Price Graph and Calendar Module"
    
    $itemHol.Editing.BeginEdit()
    $itemHol["RoomOrBoardChangesAreRequiredLabel"] = "Room and/or board changes are required"
    $itemHol["RoomOrBoardChangesAreRequiredTitle"] = "Room and/or board changes are required on the selected days"
    $itemHol["RoomOrBoardChangesAreRequiredDescription"] = "Select 'Review changes' to see a summary of changes to your package."
    $itemHol.Editing.EndEdit() | Out-Null
    
    $itemTrade.Editing.BeginEdit()
    $itemTrade["RoomOrBoardChangesAreRequiredLabel"] = "Room and/or board changes are required"
    $itemTrade["RoomOrBoardChangesAreRequiredTitle"] = "Room and/or board changes are required on the selected days"
    $itemTrade["RoomOrBoardChangesAreRequiredDescription"] = "Select 'Review changes' to see a summary of changes to your package."
    $itemTrade.Editing.EndEdit() | Out-Null
    
    
    @('de-CH','de-DE') | % {
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredLabel" -Value "Zimmer- und/oder Verpflegungsänderungen sind erforderlich"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredTitle" -Value "Zimmer- und/oder Verpflegungsänderungen sind an den ausgewählten Tagen erforderlich"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredDescription" -Value "Wählen Sie „Änderungen überprüfen“, um eine Zusammenfassung der Änderungen an Ihrem Paket zu sehen."
    }
        
    @('fr-CH','fr-FR') | % {
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredLabel" -Value "Des changements de chambre et/ou de pension sont nécessaires"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredTitle" -Value "Des changements de chambre et/ou de pension sont nécessaires les jours sélectionnés"
        	Create-Lang-Version -Item $itemHol -Lang $_ -Field "RoomOrBoardChangesAreRequiredDescription" -Value "Sélectionnez « Examiner les modifications » pour voir un résumé des modifications apportées à votre forfait."
    }
    
    # clean-up
    Remove-Item -Path "/sitecore/templates/Branches/Project/Holidays/Website/`$name/Dictionary Domain/PriceGraph/Labels/Choose Date" -Force
    Remove-Item -Path "/sitecore/templates/Branches/Project/Trade Portal/Website/`$name/Dictionary/PriceGraph/Labels/Choose Date" -Force
