  Value: |
    #update Settings
    
    $settingsFolderPath = "master:/sitecore/content/EasyJet/Holidays/Settings/"
    $settingsPath = $settingsFolderPath + "Pax Mix Settings"
    $settingsItem = Get-Item -Path $settingsPath -ErrorAction SilentlyContinue
    
    if ($settingsItem -ne $null) {
        $settingsItem.Editing.BeginEdit()
        $settingsItem["PaxMixAdultsIcon"] = "<image mediaid='{5650594F-1067-482D-BC5B-C8F0113FBAC0}' />"
        $settingsItem.Editing.EndEdit()
        Write-Host $settingsItem.Name "Settings updated"
    }
    
    
