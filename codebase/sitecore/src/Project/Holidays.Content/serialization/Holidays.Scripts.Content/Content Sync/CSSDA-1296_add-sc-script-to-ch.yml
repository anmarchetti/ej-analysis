DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendPaymentItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment" -ErrorAction SilentlyContinue;
    $seatsAndBagsRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/SeatMap/Seats And Bags" -ErrorAction SilentlyContinue;
    
    $seatsAndBagsRenderingInstance = Get-Rendering -Item $amendPaymentItem -Rendering $seatsAndBagsRendering;
    
    if ($seatsAndBagsRenderingInstance -ne $null) {
        Set-Rendering -Item $amendPaymentItem -Instance $seatsAndBagsRenderingInstance -PlaceHolder "/body/seats-and-bags-{8490eeb0-f576-488c-810f-59cbf716c135}-0";
        
        Write-Host $seatsAndBagsRenderingInstance.Name "Updated";
    }
