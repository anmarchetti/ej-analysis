---
ID: "ac03d530-8647-4f4e-9c37-c91db691cc37"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Add Login Call To Action in View Booking
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Page
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $page = Get-Item -path $pagePath -ErrorAction SilentlyContinue
    $componentsPath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components"
    $pageComponents = Get-Item -path $componentsPath -ErrorAction SilentlyContinue
    
    # Data source
    $blockPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Log In For More Info"
    $blockTemplateId = "{4274027C-AF42-47ED-BAF0-5E8DBC6A8EB8}"
    $block = Get-Item -Database "master" -path $blockPath -ErrorAction SilentlyContinue
    if ($block -eq $null) {
        # create item
        $block = New-Item -Path $blockPath -ItemType $blockTemplateId
        Write-Host "Item" $block.Name "successfully created"
    }
    
    $block.Editing.BeginEdit()
    $block["Title"] = "Looking for more information about your holiday?"
    $block["Description"] = "<p>Log in using your email address and password to find out more about holiday credit and to download your travel documents.</p>"
    
    $loginPage = Get-Item -path "master:/content/EasyJet/Holidays/Home/Login" -ErrorAction SilentlyContinue
    if($loginPage -ne $null) {
        $block["Link"] = "<link text='Log In' linktype='internal' id='$($loginPage.ID)' querystring='redirectUrl=/booking/my_bookings' />"
    }
    
    $block.Editing.EndEdit() | Out-Null
    
    
    
    $renderingId = "{59660D4A-AEA2-4C41-A118-FF3C1382742A}"
    $renderigPlaceholder = "/body/component-wrapper-inner-{b256b26a-da9c-4195-b68a-bc4ed53685e3}-0/login-{5500ac44-5df4-4473-8e8c-ea635a187882}-0";
    $rendering = Get-Rendering -Item $page -PlaceHolder $renderigPlaceholder | Where-Object {$_.ItemId -eq $renderingId}
    
    if($rendering -eq $null){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $renderigPlaceholder
        Add-Rendering -Item $page -PlaceHolder $renderigPlaceholder -DataSource $blockPath -Instance $renderingItem -index 4 -parameter @{Theme = "Separate Rows"}
        Write-Host  "Credit Booking Disruption Rendering was created"
    }
