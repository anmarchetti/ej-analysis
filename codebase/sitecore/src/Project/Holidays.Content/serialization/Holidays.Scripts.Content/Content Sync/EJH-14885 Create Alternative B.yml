- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $settingsFolderPath = "/sitecore/content/EasyJet/Holidays/Settings"
    
    $boardsSettingsTemplateId = "{C2E4F86B-D6DA-4D72-9F9C-910CAFFC8CFE}"
    $boardsSettingsItemName = "Alternative Boards Settings"
    
    $item = Get-Item -Path "$($settingsFolderPath)/$($boardsSettingsItemName)" -ErrorAction SilentlyContinue
    
    if ($item -eq $null) {
    	$item = New-Item -Path $settingsFolderPath -Name $boardsSettingsItemName -ItemType $boardsSettingsTemplateId
    
    	$item.Editing.BeginEdit()
    	$item["EnableAlternativeBoardsSearchResults"] = "1"
    	$item["EnableAlternativeBoardsPromoPages"] = "1"
    	$item["AlternativeBoardsExcludedPromoPages"] = "{96F37CEB-6A05-4735-BE89-C237BB8C538F}|{69CF3379-5399-464F-B8CB-3026C6B8F516}|{279A7AB8-05D7-4D1E-BF76-F97370BD58CB}"
    	$item.Editing.EndEdit() | Out-Null;
    }
    
    Write-Host $item.Name "Alternative Boards settings creation finished"; 
