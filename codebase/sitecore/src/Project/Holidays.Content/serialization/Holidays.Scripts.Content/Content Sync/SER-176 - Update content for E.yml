- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $amendPaymentContentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment"
    
    function Set-Translation-Value($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            $item = Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
            Write-Host "Created" $language "version for" $item.Name "item"
        } else {
            Write-Host $language "version for Item" $item.Name "already exist"
        }
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
            Write-Host "Field" $key "for" $item.Name "item updated with value" $translation
        }
    }
    
    function Update-Popup-Content() {
        ### en
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'en' -Key 'PaymentErrorDescription' -Translation @'
    <p>We've been unable to make this change to your {transport}.<br />If you have been charged, this will be refunded</p>
    <p>Please call the call centre for additional support</p>
    <a href="tel:03305515165">03305515165</a>
    '@
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'en' -Key 'PaymentErrorTitle' -Translation 'Change failed'
        
        ### fr-FR
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'fr-FR' -Key 'PaymentErrorDescription' -Translation @'
    <p>Nous n'avons pas pu apporter cette modification à votre {transport}.<br />Si des frais vous ont été facturés, ils vous seront remboursés.</p>
    <p>Veuillez appeler le centre d’appels pour obtenir une assistance supplémentaire</p>
    <a href="tel:+33170392545">+33170392545</a><span> / </span><a href="tel:+41225910447">+41225910447</a>
    '@
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'fr-FR' -Key 'PaymentErrorTitle' -Translation 'Échec de la modification'
    
        ### de-DE
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'de-DE' -Key 'PaymentErrorDescription' -Translation @'
    <p>Wir konnten diese Änderung an Ihrem {transport} nicht vornehmen.<br />Wenn Ihnen eine Gebühr in Rechnung gestellt wurde, wird diese erstattet</p>
    <p>Bitte rufe das Callcenter an, um weitere Unterstützung zu erhalten</p>
    <a href="tel:+493016635692">+493016635692</a><span> / </span><a href="tel:+41225910447">+41225910447</a>
    '@
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'de-DE' -Key 'PaymentErrorTitle' -Translation 'Änderung fehlgeschlagen'
    
        ### fr-CH
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'fr-CH' -Key 'PaymentErrorDescription' -Translation @'
    <p>Nous n'avons pas pu apporter cette modification à votre {transport}.<br />Si des frais vous ont été facturés, ils vous seront remboursés.</p>
    <p>Veuillez appeler le centre d’appels pour obtenir une assistance supplémentaire</p>
    <a href="tel:+41225910447">+41225910447</a><span> / </span><a href="tel:+33170392545">+33170392545</a>
    '@
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'fr-CH' -Key 'PaymentErrorTitle' -Translation 'Échec de la modification'
    
        ### de-CH
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'de-CH' -Key 'PaymentErrorDescription' -Translation @'
    <p>Wir konnten diese Änderung an Ihrem {transport} nicht vornehmen.<br />Wenn Ihnen eine Gebühr in Rechnung gestellt wurde, wird diese erstattet</p>
    <p>Bitte rufe das Callcenter an, um weitere Unterstützung zu erhalten</p>
    <a href="tel:+41225910447">+41225910447</a><span> / </span><a href="tel:+493016635692">+493016635692</a>
    '@
        Set-Translation-Value -ItemPath $amendPaymentContentPath -Language 'de-CH' -Key 'PaymentErrorTitle' -Translation 'Änderung fehlgeschlagen'
    
    }
    
    
    Update-Popup-Content;
