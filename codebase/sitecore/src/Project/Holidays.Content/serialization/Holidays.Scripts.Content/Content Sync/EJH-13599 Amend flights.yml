  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource) {
    	$rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    
    $pageTemplateId = "{56A636F9-775C-4BA1-BABE-03EE4B65FED7}"
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Slim Design" -pageTemplateId $pageTemplateId
    
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking" -ItemName "Change Flight" -TemplateId $pageTemplateId
    $page.Editing.BeginEdit();
    $page["Name"] = "Change Your Flights"
    $page["Subtitle"] = "Fancy a change?"
    $page["PageDescription"] = "Change your flight times or your departure airport for the same day"
    $page["Image"] = '<image mediaid="{35B47096-DE09-4713-9650-CFB6BAC7664C}" />'
    $page.Editing.EndEdit() | Out-Null
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create Html Block For Grey Banner
    $htmlBlock = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Grey Banner" -TemplateId "{C4A47ADF-2552-40E2-99F6-CA660419C835}"
    $htmlBlock.Editing.BeginEdit();
    $htmlBlock["Html"] = '<div class="wrapper-component-container wrapper-component-container--grey"><div class="wrapper-component-container__inner py-4" style="font-size: 14px;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin justo est, sodales vel vehicula a, rutrum vitae velit. Vivamus sit amet accumsan risus. Phasellus est tellus, condimentum non quam non, consectetur posuere purus.</div></div>'
    $htmlBlock.Editing.EndEdit() | Out-Null
    
    Update-Rendering-DataSource -Item $page -PlaceHolder "/body" -RenderingId "{6C234F53-080F-4C8E-AC01-CE83E3C28998}" -NewDataSource $htmlBlock.ID 
    
    
    # Create Amend Flights Component
    $amendFlightsComponent = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Change Flights" -TemplateId "{4FDD4CC9-A537-43B9-8062-0F6D868606C5}"
    $amendFlightsComponent.Editing.BeginEdit();
    $amendFlightsComponent["Title"] = "Your Flights"
    $amendFlightsComponent["AlternativeFlightsTitle"] = "Alternative flight Times on the same day"
    $amendFlightsComponent["FiltersOrder"] = "{EC9EA973-22E9-42DD-9878-2CC27987BC27}|{1255525F-3BFF-4BF5-B0FD-3CC60A9DE8A9}|{2CF265A2-B919-43B2-8BB8-1C8DF835BE64}"
    $amendFlightsComponent["TimeFilters"] = "{6ABCF615-E4F2-4238-BE46-49DA783500C0}|{4F9EC44E-AE57-425E-946D-01581BE93D43}|{BC01FEBE-8AB0-4474-A4A6-CB9F26235911}|{928F1ACD-49DF-437D-997D-9D9E7F77F486}|{9177516F-C0DB-4730-A096-0248B70B8D5D}"
    $amendFlightsComponent.Editing.EndEdit() | Out-Null
    
    Update-Rendering-DataSource -Item $page -PlaceHolder "/body/component-wrapper-inner-{23D248E9-6974-4A8B-AD6D-5AED8641A71B}-0" -RenderingId "{3D03DD73-2B47-4149-BFF2-80A2DB3E1323}" -NewDataSource $amendFlightsComponent.ID 
    
