    $onboardcabinbags_popupcontent_dafb4cfc559445aa8473d4feefc8829b_en_v1 = @"
    <p>Everyone can bring on board one small under seat cabin bag (max. 45 x 36 x 20cm), to keep under the seat in front of you. If you are sitting in an Extra Legroom seat; this row requires you to place and store all your hand baggage and loose items in an overhead locker for take-off and landing. If there is no available space in the overhead locker above you, your bags will be placed into the nearest available locker further down the plane.<br />
    <div>&nbsp;</div>
    </p>
    <p style="text-align: center;"><img alt="" src="-/jssmedia/cdf468cb893e4f5c979bcfbdaddb1440.ashx?h=163&amp;w=188" style="height: 163px; width: 188px;" /></p>
    <p>You can<strong> purchase</strong> a large cabin bag&nbsp;(max. 56 x 45 x 25cm) on the Extras page which can be placed in an overhead locker. Cabin bags are a lot cheaper when booked online in advance, so remember to add them before you travel.&nbsp;</p>
    <p>If you try and take a large cabin bag without purchasing one, you will be charged &pound;48 at the gate each way.</p>
    <p style="text-align: center;"><img alt="" src="-/jssmedia/d0ccfb4043c9453b8c44d583cd9b3ef1.ashx?h=178&amp;w=174" style="height: 178px; width: 174px; top: 294px;" /></p>
