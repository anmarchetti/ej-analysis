    <p>Our dedicated <strong>Assisted Travel Team</strong> are happy to help if you require assistance when it comes to your flights, transfer or hotel. Please contact our team <strong>as soon as you’ve booked</strong>, you’ll find the contact information in your documents and booking confirmation. Once we know your requirements, we can work with our service partners to see how we can best meet your needs.</p>
    <p>For hotel requests you must tell us at least 72 hours before you travel. Due to the short notice, availability may be limited.</p>
    <p>For airport and airline assistance you must tell us a minimum of 48 hours before departure. &nbsp;</p><div>&nbsp;</div>
    "@
