    $travellingwithchildren_popupcontent_9b817fff4bf04e2da472baa69fb728ec_en_v1 = @"
    <p>For safety reasons infants must be accompanied by an adults and cannot be seated in the following seats:</p><p>[no-infants-seats-list]</p><p>Only 1 infant can be seated per row of 3 seats. Baby changing facilities are at the front and rear of the plane.</p><p>Please try and seat your family together. If you haven&rsquo;t bought seats for your family then the best chance of sitting together is to check in as early as possible. Our seating system will always try to group you together, but seats are allocated on a first come first served basis so the earlier you check in the more likely you are to sit together.</p><p>If you aren&rsquo;t able to get seats together at check-in, we&rsquo;ll still make sure each child under 12 is seated close to an adult on your booking. However we may only be able to arrange this at the airport or during boarding and not everyone may be seated together.</p>
    "@
    $seatsmap_cancellationpopuptitle_ad84c25e75084806934ac04d5ec271fe_en_v2 = @"
