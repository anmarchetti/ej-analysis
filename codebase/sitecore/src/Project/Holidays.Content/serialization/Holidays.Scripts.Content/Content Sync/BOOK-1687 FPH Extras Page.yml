    $seatsmap_downgradingtext_ad84c25e75084806934ac04d5ec271fe_en_v2 = @"
    <p><span class="ui-provider yt b c d e f g h i j k l m n o p q r s t u v w x y z ab ac ae af ag ah ai aj ak" dir="ltr">It looks like one or more of the seats you&rsquo;ve now selected are a different type to your previously selected seats. If you downgrade your seat type, this will mean you'll lose some of your seat benefits, an example could be extra legroom.</span></p>
    <p><span class="ui-provider yt b c d e f g h i j k l m n o p q r s t u v w x y z ab ac ae af ag ah ai aj ak" dir="ltr">Make sure you&rsquo;re happy with the new benefits included in your new seats before confirming this change.&nbsp;</span></p>
