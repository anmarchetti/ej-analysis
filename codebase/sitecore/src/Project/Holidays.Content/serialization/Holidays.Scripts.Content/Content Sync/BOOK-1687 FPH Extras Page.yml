    $seatsmap_exitseatspopuptext_ad84c25e75084806934ac04d5ec271fe_en_v2 = @"
    <p style="color: #131313; margin-top: 0px;">You've selected a seat near an emergency exit. In the very unlikely event of an emergency evacuation, customers in these seats need to be able and willing to assist our Cabin Crew.</p>
    <p style="color: #131313;">To sit here, regulations require that you:</p>
    <ul style="color: #131313;">
        <li>are aged 16 or over</li>
        <li>are not travelling with an infant</li>
        <li>willing and able to operate an exit door if required</li>
        <li>have no physical limitations on the day of travel that would prevent you from moving quickly such as illness, injury, age, pregnancy, or disability&nbsp;</li>
        <li>do not require additional equipment (eg. extension seat belt, support cushion, car seat)</li>
        <li>can understand and respond to instructions quickly, without assistance&nbsp;</li>
    </ul>
    <p style="color: #131313;">If you choose this seat for a passenger in one of the above categories, you will be moved by a member of Cabin Crew prior to take off, which may not be a seat of your choice and no refund will be given.&nbsp;</p>
    "@
