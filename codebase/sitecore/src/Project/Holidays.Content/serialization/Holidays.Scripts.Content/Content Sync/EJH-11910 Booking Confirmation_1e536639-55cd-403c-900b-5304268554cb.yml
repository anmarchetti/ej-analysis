  Hint: Script
  Value: |
    $bookingConfirmationPage  = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation" -ErrorAction SilentlyContinue
    $rendering = Get-Rendering -Item $bookingConfirmationPage  | Where-Object { $_.ItemId -eq "{9FD91E19-714F-4313-9E52-FF77B4E9F030}" } | Select -First 1
    Set-Rendering -Item $bookingConfirmationPage  -Instance $rendering -Datasource "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage"
    
    $rendering = Get-Rendering -Item $bookingConfirmationPage  | Where-Object { $_.ItemId -eq "{E10ECB4E-19CE-4255-982C-04E6E3592A20}" } | Select -First 1
    Set-Rendering -Item $bookingConfirmationPage  -Instance $rendering -Datasource "/sitecore/content/EasyJet/Holidays/Data/Luggage Configuration"
    
    
    Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage' | Remove-Item  -Recurse
    $luggagesForClone = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_booking/Page Components/Luggage" -ErrorAction SilentlyContinue
    $pageComponents = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components" -ErrorAction SilentlyContinue
    $luggageItem = New-ItemClone -Item $luggagesForClone -Destination $pageComponents  -Recurse
    
    $cabinBags = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Cabin bags" -ErrorAction SilentlyContinue
    $cabinBagValue = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Cabin bags/Before 10 Feb"  -ErrorAction SilentlyContinue
    if ($cabinBagValue -ne $null){
        $cabinBags.Editing.BeginEdit()
        $cabinBags.Fields["Messages"].Value =$cabinBagValue.ID
        $cabinBags.Editing.EndEdit()
    } 
    
    $cabinBagsSmall = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Small cabin bags" -ErrorAction SilentlyContinue
    $cabinBagValue = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Luggage/2 x Small cabin bags/After 10 Feb" -ErrorAction SilentlyContinue
    if ($cabinBagsSmall -ne $null){
        $cabinBagsSmall.Editing.BeginEdit()
        $cabinBagsSmall.Fields["Messages"].Value =$cabinBagValue.ID
        $cabinBagsSmall.Editing.EndEdit()
    } 
    
    $helpLinks = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Bottom Help Links" -ErrorAction SilentlyContinue
    $link1 = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Bottom Help Links/Chat To Us" -ErrorAction SilentlyContinue
    $link2 = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation/Page Components/Bottom Help Links/Contact Us" -ErrorAction SilentlyContinue
    if ($helpLinks -ne $null){
        $helpLinks.Editing.BeginEdit()
        $helpLinks.Fields["Links"].Value ="$($link1.ID)|$($link2.ID)"
        $helpLinks.Editing.EndEdit()
    } 
    
    $rendering = Get-Rendering -Item $bookingConfirmationPage  | Where-Object { $_.ItemId -eq "{9133F3CA-553F-42F5-8529-54734B53A378}" } | Select -First 1
    if ($rendering -ne $null) {
        Set-Rendering -Item $bookingConfirmationPage -Instance $rendering -Parameter @{ "Variant" = "Card With Border" } 
    }
