                 function Add-Renderings($pagePath, $datasourcePath) {
                    $page = Get-Item -Path $pagePath
                    $viewBookingRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $viewBookingRenderingId}
                    $cancellationUnavailableRendering = Get-Item -Path $cancellationUnavailableRenderingPath
                    $cancellationUnavailableInstance = New-Rendering -Item $cancellationUnavailableRendering 
                    Add-Rendering -Item $page -Instance $cancellationUnavailableInstance -Index 12 -Placeholder "/body/toolbar-top-section-$($viewBookingRendering.UniqueId)-0" -DataSource $cancellDatasoursePath
                    
                    
                    $cancellUnavailableRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $cancellationUnavailableRenderingId}
                    $contactUsBannerRendering = Get-Item -Path $contactUsBannerRenderingPath
                    $contactUsBannerRenderingInstance = New-Rendering -Item $contactUsBannerRendering
                    
                    Add-Rendering -Item $page -Instance $contactUsBannerRenderingInstance -Index 13 -Placeholder "/body/toolbar-top-section-$($viewBookingRendering.UniqueId)-0/contact-us-$($cancellUnavailableRendering.UniqueId)-0" -DataSource $contactUsBannerDatasourcePath -Parameter  @{ "ShowButtonOnly" = "1" } 
    
                    
                    New-Content -PagePath $pagePath -DatasoursePath $datasoursePath;
                 }
    
