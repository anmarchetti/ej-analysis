- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $lcbCategoryPath = '/sitecore/content/EasyJet/Holidays/Data/Luggage/Cabin Bags'
    $categoryTemplate = '{928655D3-BFC1-4E24-99A5-096BE1B24D09}'
    $lcbPath = '/sitecore/content/EasyJet/Holidays/Data/Luggage/Cabin Bags/Large Cabin Bag';
    $lcbTemplate = '{41775FBB-D551-4813-B3D7-1BDC7C6DB534}'
    
    function updateLuggageText($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
       
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
        
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
        
    $category = Get-Or-Create-Item -Path $lcbCategoryPath -Template $categoryTemplate
    if($category -ne $null) {
        $category.Editing.BeginEdit()
        $category['Code'] = 'CABI'
        $category['Name'] = 'Cabin Bags'
        $category['Type'] = 'Cabin Bags'
        $category.Editing.EndEdit() | Out-Null
    }
    $item = Get-Or-Create-Item -Path $lcbPath -Template $lcbTemplate
    if($item -ne $null) {
        $item.Editing.BeginEdit()
        $item['Code'] = 'SCB1'
        $item['Name'] = 'Large Cabin Bags'
        $item.Editing.EndEdit() | Out-Null
    }
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
        
    $translations = @{
            
            "fr-CH" = @{
                "CatName" = "Sacs à cabines"
                "Name" = "Grands sacs de cabine"
            }
            "fr-FR" = @{
                "CatName" = "Sacs à cabines"
                "Name" = "Grands sacs de cabine"
            }
            "de-CH" = @{
                "CatName" = "Kabinentaschen"
                "Name" = "Große Kabinentaschen"
            }
            "de-DE" = @{
                "CatName" = "Kabinentaschen"
                "Name" = "Große Kabinentaschen"
            }
        }
        
        foreach ($lang in $translations.Keys) {
            create-lang-version -item $category -lang $lang -field "Name" -value $translations[$lang]["CatName"]
            
            
            create-lang-version -item $item -lang $lang -field "Name" -value $translations[$lang]["Name"]
        }    
