    $description_ffbb47c125254b0890b93092c47e43e7_frfr_v1 = @"
    <p>Si vous rencontrez des probl&egrave;mes pendant votre s&eacute;jour, notre &eacute;quipe d'assistance vacances est &agrave; votre disposition 24 h/24, 7 j/7 de notre équipe d'assistance en vacances basée au Royaume-Uni. Vous pouvez la joindre au :</p><p><a href="tel:+03309126594">+03309126594</a></p><p>Veuillez vous munir de votre num&eacute;ro de r&eacute;servation easyJet holidays &agrave; sept chiffres. N'oubliez pas de v&eacute;rifier aupr&egrave;s de votre op&eacute;rateur les frais d'appel sur place.</p>
    "@
    $description_ffbb47c125254b0890b93092c47e43e7_en_v1 = @"
    If you have any issues while you are away, we&rsquo;re here for you 24/7 through our UK based On Holiday Support team. You can reach us on<p><a href="tel:+03309126594">+03309126594.</a></p><p>Please have your seven digit easyJet holidays booking reference ready. Make sure you check with your network provider for call charges while you're away.</p>
    "@
    $description_ffbb47c125254b0890b93092c47e43e7_frch_v1 = @"
    <p>Si vous rencontrez des probl&egrave;mes pendant votre s&eacute;jour, notre &eacute;quipe d'assistance vacances est &agrave; votre disposition 24 h/24, 7 j/7 de notre équipe d'assistance en vacances basée au Royaume-Uni. Vous pouvez la joindre au :</p><p><a href="tel:+03309126594">+03309126594</a></p><p>Veuillez vous munir de votre num&eacute;ro de r&eacute;servation easyJet holidays &agrave; sept chiffres. N'oubliez pas de v&eacute;rifier aupr&egrave;s de votre op&eacute;rateur les frais d'appel sur place.</p>
    "@
    $description_ffbb47c125254b0890b93092c47e43e7_dede_v1 = @"
    <p>Wenn du w&auml;hrend deinen Ferien Unterst&uuml;rtzung brauchst, ist unser Service Team rund um die Uhr f&uuml;r dich da - mit unserem On Holiday Support Team in Großbritannien. Du kannst uns hier erreichen:</p><p><a href="tel:+03309126594">+03309126594</a></p><p>Bitte halte deine siebenstellige easyJet holidays Buchungsnummer bereit und erkundige dich bei deinem Netzbetreiber nach den Geb&uuml;hren f&uuml;r Anrufe aus dem Ausland.</p>
    "@
    $description_ffbb47c125254b0890b93092c47e43e7_dech_v1 = @"
