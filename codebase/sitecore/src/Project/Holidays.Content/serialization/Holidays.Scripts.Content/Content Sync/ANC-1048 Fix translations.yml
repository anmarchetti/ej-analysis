  Hint: Script
  Value: |
    $bicyclePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage Popup"
    
    function updateLuggageText($itemPath, $language, $key, $translation) {
            $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
        
            if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
                Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
            }
           
          $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
            
            if($item -ne $null) {
                $item.Editing.BeginEdit()
                $item[$key] = $translation
                $item.Editing.EndEdit() | Out-Null
            }
           
        }
    
     updateLuggageText -ItemPath $bicyclePath -Language 'de-DE' -Key 'NoLuggageAddedButton' -Translation "Überspringen"
