  Hint: Script
  Value: |
    function Update-Component-For-Site($holdLuggageComponentPath){
        $item = Get-Item -Path $holdLuggageComponentPath -ErrorAction SilentlyContinue
        
        $item.Editing.BeginEdit()
        
        $item["PramHeading"] = "Pram"
        $item["PramDescription"] = "1 pram or pushchair per infant. Outbound and return."
        $item["PramIcon"] = '<image mediaid="{B7DFB1A3-F9E4-48D0-868F-53AE33B3B347}" />'
                
        $item.Editing.EndEdit() | Out-Null
    }
        
    $holdLuggageComponentPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal";
    Update-Component-For-Site -holdLuggageComponentPath $holdLuggageComponentPath
