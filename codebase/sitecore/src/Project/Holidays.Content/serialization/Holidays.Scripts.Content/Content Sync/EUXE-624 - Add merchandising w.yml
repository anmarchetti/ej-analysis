    "/sitecore/content/EasyJet/Holidays/Home/Page Components/EUX/Hero Carousel - default France",
    "/sitecore/content/EasyJet/Holidays/Home/Page Components/EUX/Hero Carousel - default Germany",
    "/sitecore/content/EasyJet/Holidays/Home/Page Components/EUX/Partnership Component EU",
    "/sitecore/content/EasyJet/Holidays/Home/Page Components/EUX/EUX Hotels",
    "/sitecore/content/EasyJet/Holidays/Data/Homepage promo blocks",
    "/sitecore/content/EasyJet/Holidays/Data/Mosaic Promo Blocks EU",
    "/sitecore/content/EasyJet/Holidays/Data/Footer Copyright Folder/Footer Copyright EU",
    "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/EUX",
    "/sitecore/content/EasyJet/Holidays/Home/Holiday Types/CH")
    
    
    function Update-Workflow($rootItem){
        $rootItem.Editing.BeginEdit()
        $rootItem["__Workflow"] = "{45313D33-461E-4E35-943D-DF738067BAEF}"
        $rootItem["__Workflow state"] = "{CBB9EC41-7806-4652-AECE-05CF5EEBA3F2}"
        $rootItem["__Default workflow"] = "{45313D33-461E-4E35-943D-DF738067BAEF}"
        $rootItem.Editing.EndEdit() | Out-Null
        Write-Host $rootItem.Paths.FullPath
        
        foreach($item in $rootItem.Children){
            Update-Workflow -rootItem $item
        }
    }
    
    foreach($path in $paths){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -ne $null){
           Update-Workflow -rootItem $item
        }
    }
    
