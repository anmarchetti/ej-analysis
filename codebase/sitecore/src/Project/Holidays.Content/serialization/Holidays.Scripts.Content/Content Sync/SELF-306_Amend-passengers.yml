SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource) {
    	$rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    		Write-Host $item.Name "Rendering successfully updated"
    	}
    }
    
    function Set-Page-Design ($designPath,$pageTemplateId) {
    	$designItem = Get-Item -Path "$($designPath)" -ErrorAction SilentlyContinue
    	if ($designItem -ne $null) {
    		[Sitecore.Data.Fields.MultilistField]$pageTemplates = $designItem.Fields["PageTemplates"];
    
    		if (!$pageTemplates.Contains($pageTemplateId)) {
    			$designItem.Editing.BeginEdit();
    			$pageTemplates.add($pageTemplateId);
    			$designItem.Editing.EndEdit() | Out-Null
    			Write-Host $designItem.Name "Page Templates updated"
    		}
    	}
    }
    
    
    $pageTemplateId = "{0F2BB3A3-BA6B-4CF3-9455-2FA30495C558}"
    
    # Add Page To PageDesigns
    Set-Page-Design -designPath "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Slim Design" -pageTemplateId $pageTemplateId
    
    # Create Page
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking" -ItemName "Passenger Details" -TemplateId $pageTemplateId
    $page.Editing.BeginEdit();
    $page["Name"] = "Passenger Details"
    $page["Subtitle"] = "add/edit your"
    $page["PageDescription"] = "change the passenger details for this trip. lorem ipsum add some text."
    $page["Image"] = '<image mediaid="{35B47096-DE09-4713-9650-CFB6BAC7664C}" />'
    $page.Editing.EndEdit() | Out-Null
    
    # Create Page Components
    $pageComponents = Get-Or-Create-Item -Path $page.FullPath -ItemName "Page Components" -TemplateId "{05BBE519-F066-4B38-B0FC-CBC9C2F1C567}"
    
    # Create Amend Passenger Component
    $amendPassengerComponent = Get-Or-Create-Item -Path $pageComponents.FullPath -ItemName "Change Passengers Details" -TemplateId "{994482F2-C7EF-4255-8225-F90269796BFC}"
    $amendPassengerComponent.Editing.BeginEdit();
    $amendPassengerComponent["Title"] = "Change Passengers Details"
    $amendPassengerComponent.Editing.EndEdit() | Out-Null
    
    Update-Rendering-DataSource -Item $page -PlaceHolder "/body/component-wrapper-inner-{23D248E9-6974-4A8B-AD6D-5AED8641A71B}-0" -RenderingId "{0548A519-2CDB-4251-A6EE-033692B781AC}" -NewDataSource $amendPassengerComponent.ID 
