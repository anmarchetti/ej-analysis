    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    # Create Late Checkout Settings
    $templateId = "{CE99B346-F3B0-400C-B86A-16D1676B1D46}"
    $pathToItem = "/sitecore/content/EasyJet/Holidays/Settings/Late Checkout Settings"
    $item = Get-Item -Path $pathToItem -ErrorAction SilentlyContinue;
    
    if ($item -eq $null){
        $item = New-Item -Path $pathToItem -ItemType $templateId;
        Write-Host "Late Checkout Settings created";
        
        $item.Editing.BeginEdit()
        $item["IsLateCheckoutEnabled"] = "1";
        $item["TimeForLateRoomCheckout"] = "20210909T120000Z";
        $item.Editing.EndEdit() | Out-Null
    }
    
    $templateId = "{B01F62CB-5C39-4A59-A04C-64DBBB1BFAD0}"
    $pathToItem = "/sitecore/content/EasyJet/Holidays/Settings/Price Breakdown Settings/Late Checkout Room"
    $item = Get-Item -Path $pathToItem -ErrorAction SilentlyContinue;
    
    if ($item -eq $null){
        $item = New-Item -Path $pathToItem -ItemType $templateId;
        Write-Host "Late Checkout Settings created";
        
        $item.Editing.BeginEdit()
        $item["Code"] = "Late Checkout Room";
        $item["AtcomCodes"] = "Late Checkout Room";
        $item["Text"] = "Late Checkout";
        $item.Editing.EndEdit() | Out-Null
    }
    
    #Add Late checkout component data source
    $componentDataSource = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Late Checkout Component" -templateId "{625B71A7-67CD-42E1-93B9-02BB58781018}"
    if ($componentDataSource -ne $null) {
        $componentDataSource.Editing.BeginEdit()
