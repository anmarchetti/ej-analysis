    $postBookBannerDataSource["PopUpIcon"] = "<image mediaid='{0E94C53D-CD74-45A3-9B2B-703F7E4D1D48}' />";
        $postBookBannerDataSource["PopUpTitle"] = "Late checkout details";
        $postBookBannerDataSource["PopUpDescription"] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ac auctor augue mauris augue neque gravida. Aliquet bibendum enim facilisis gravida. Egestas tellus rutrum tellus pellentesque eu tincidunt. ";
        $postBookBannerDataSource.Editing.EndEdit() | Out-Null
    }  
    
    #Add Late checkout post book banner rendering to confirmation page
    $confirmationPagePath=  '/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation';
    $confirmationPage= Get-Item -Path $confirmationPagePath;
    
    Add-Rendering-To -Item $confirmationPage -RenderingId "{E10ECB4E-19CE-4255-982C-04E6E3592A20}" -NewRenderingId "{D6CF6F5C-D137-49CB-A3FB-C2D6ADC47F6C}" -Datasource "/sitecore/content/EasyJet/Holidays/Data/Late Checkout Post Booking Banner" -SpecificPlaceholder 'late-checkout-banner' ;
    
    #Add Late checkout post book banner rendering to view booking page
    $bookingPagePath=  '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking';
