    #Add Late checkout component rendering to extras
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        if($parameters -ne $null)
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
        }
        else
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
        }
    }
    
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $specificPlaceholder, $sign){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if($index -gt 0)
                {
                    $incrementIndex = $index
                    if ($sing -ne 0){
                        $incrementIndex = $index + $sign
                    }
                
                     if($specificPlaceholder -ne $null){
                         if($_.Placeholder[0] -ne '/'){
                              Add-New-Rendering -Item $item -Placeholder "/$($_.Placeholder)/$($specificPlaceholder)-$($_.UniqueId)-0" -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex
                         } else {
                              Add-New-Rendering -Item $item -Placeholder "$($_.Placeholder)/$($specificPlaceholder)-$($_.UniqueId)-0" -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex
                         }
                    }
                    else{
                        Add-New-Rendering -Item $item -Placeholder $_.Placeholder -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex 
                    }
                }
                return
            }
        }
    }
    
    $extrasPagePath=  '/sitecore/content/EasyJet/Holidays/Home/Booking';
    $extrasPage= Get-Item -Path $extrasPagePath;
    
    Add-Rendering-To -Item $extrasPage -RenderingId "{3ADDD538-1DF0-4510-BBAA-934E9A6A2E74}" -NewRenderingId "{B97059BD-C924-4211-951E-FF95765CB9C8}" -Datasource "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Late Checkout Component" -SIgn 1;
    
    #Add Late checkout post book banner data
    $postBookBannerDataSource = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Late Checkout Post Booking Banner" -templateId "{6701C332-3AC2-4DE9-89DE-D0BC6174A21C}"
