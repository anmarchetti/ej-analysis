DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info"
    
    $item.Editing.BeginEdit()
    
    $amendTypes = Get-ChildItem -path "/sitecore/content/EasyJet/Holidays/Data/Amend Types"
    
    $item["AmendTypes"] = ""
    
    if ($amendTypes -ne $null) {
        forEach($amendType in $amendTypes) {
           if (![string]::IsNullOrEmpty($item["AmendTypes"])) {
            $item["AmendTypes"] += "|";
        }
        $item["AmendTypes"] += $amendType.ID.ToString()   
        }
    }
    
    $item.Editing.EndEdit() | Out-Null
