- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        
        return $null
    }
    
    function create-lang-version($item, $lang) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
    }
    
    $schemaItem = create-item -Path "/sitecore/content/EasyJet/Holidays/Home/Page Components" -ItemName "Schema" -ItemType "{8E548865-214D-4CBF-A68B-680789B41D62}"
    
    if ($schemaItem -ne $null) {
        # UK homepage: 
        Create-Lang-Version -Item $schemaItem -Lang "en"
      
        # CH-FR homepage:   
        Create-Lang-Version -Item $schemaItem -Lang "fr-CH"
        
        # CH-DE homepage:
        Create-Lang-Version -Item $schemaItem -Lang "de-CH"
        
        $homepageItem = Get-Item -Database "master" -Path "/sitecore/content/EasyJet/Holidays/Home"
        
        if ($homepageItem -ne $null) {
            $schemaRendering = Get-Item -Database "master" -Path "/sitecore/layout/Renderings/Feature/PageContent/Schema" | New-Rendering -Placeholder '/body'
                
            Add-Rendering -Item $homepageItem -Instance $schemaRendering -Index -1 -PlaceHolder "/body" -DataSource $schemaItem.Paths.FullPath
        }
    }
    
