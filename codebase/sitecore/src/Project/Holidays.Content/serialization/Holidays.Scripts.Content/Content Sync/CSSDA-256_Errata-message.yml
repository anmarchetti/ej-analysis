- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
      function create-lang-version($item,$lang,$field,$value) {
          $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
      
          if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
              Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
          }
      
          if ($null -ne $field) {
              $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
              $targetLangItem.Editing.BeginEdit()
              $targetLangItem[$field] = $value;
              $targetLangItem.Editing.EndEdit() | Out-Null
          }
      }
      
      $amedDatesSummaryServiceMessageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Attention Message" -ErrorAction SilentlyContinue;
      $amedDatesServiceMessageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Page Components/Date Change Attention Message" -ErrorAction SilentlyContinue;
      
      $enTitle = "Please read carefully";
      $frTitle = "Lisez attentivement s'il vous plaît";
      $deTitle = "Bitte aufmerksam lesen";
      
      
      if ($amedDatesSummaryServiceMessageItem -ne $null) {
          $amedDatesSummaryServiceMessageItem.Editing.BeginEdit();
      
      	$amedDatesSummaryServiceMessageItem["Title"]= $enTitle;
      	$amedDatesSummaryServiceMessageItem["Type"]= "errata";
          $amedDatesSummaryServiceMessageItem["Description"]= "";
      
      	# Creating languages versions
      	@('fr-CH', 'fr-FR') | % {
             Create-Lang-Version -Item $amedDatesSummaryServiceMessageItem -Lang $_ -Field "Title" -Value $frTitle;
             Create-Lang-Version -Item $amedDatesSummaryServiceMessageItem -Lang $_ -Field "Description" -Value "";
          }
        @('de-CH', 'de-DE') | % {
             Create-Lang-Version -Item $amedDatesSummaryServiceMessageItem -Lang $_ -Field "Title" -Value $deTitle;
             Create-Lang-Version -Item $amedDatesSummaryServiceMessageItem -Lang $_ -Field "Description" -Value "";
        }
      
      	Write-Host $amedDatesSummaryServiceMessageItem.Name "Updated";
          $amedDatesSummaryServiceMessageItem.Editing.EndEdit() | Out-Null;
      }
      if ($amedDatesServiceMessageItem -ne $null) {
          $amedDatesServiceMessageItem.Editing.BeginEdit();
      
      	$amedDatesServiceMessageItem["Title"]= $enTitle;
          $amedDatesServiceMessageItem["Type"]= "errata";
          $amedDatesServiceMessageItem["Description"]= "";
      
      	# Creating languages versions
      	@('fr-CH', 'fr-FR') | % {
             Create-Lang-Version -Item $amedDatesServiceMessageItem -Lang $_ -Field "Title" -Value $frTitle;
             Create-Lang-Version -Item $amedDatesServiceMessageItem -Lang $_ -Field "Description" -Value "";
          }
          @('de-CH', 'de-DE') | % {
             Create-Lang-Version -Item $amedDatesServiceMessageItem -Lang $_ -Field "Title" -Value $deTitle;
             Create-Lang-Version -Item $amedDatesServiceMessageItem -Lang $_ -Field "Description" -Value "";
          }
      
      	Write-Host $amedDatesServiceMessageItem.Name "Updated";
          $amedDatesServiceMessageItem.Editing.EndEdit() | Out-Null;
      }
