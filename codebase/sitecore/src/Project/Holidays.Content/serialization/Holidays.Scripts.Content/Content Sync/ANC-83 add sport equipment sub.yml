- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $holdLuggageListsPathHolidays = "/sitecore/content/EasyJet/Holidays/Data/Ancillaries/Extra Luggage Lists"
    $holdLuggageListsPathTrade = "/sitecore/content/EasyJet/TradePortal/Data/Ancillaries/Extra Luggage Lists"
        
    function create-lang-version ($itemPath,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $itemPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
        	Add-ItemLanguage -Path $itemPath -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            $targetLangItem = Get-Item -Path $itemPath -Language $lang
        }
        
        if ($null -ne $field) {
        	$targetLangItem = Get-Item -Path $itemPath -Language $lang
        	$targetLangItem.Editing.BeginEdit()
        	$targetLangItem[$field] = $value;
        	$targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
        
    create-lang-version -itemPath $holdLuggageListsPathHolidays -lang 'en' -field 'SportsEquipmentSubtitle' -value 'Sports Equipment may incur additional charges to cover large item transfer. The prices below <b>do not include transfer costs</b>, but will be included in your total package price depending on your transfer type'
    create-lang-version -itemPath $holdLuggageListsPathHolidays -lang 'de-CH' -field 'SportsEquipmentSubtitle' -value 'Für Sportgeräte können zusätzliche Gebühren für den Transfer großer Gegenstände anfallen. Die nachstehenden Preise <b>enthalten keine Transferkosten</b>, sind aber je nach Art des Transfers in Ihrem Gesamtpaketpreis enthalten'
    create-lang-version -itemPath $holdLuggageListsPathHolidays -lang 'de-DE' -field 'SportsEquipmentSubtitle' -value 'Für Sportgeräte können zusätzliche Gebühren für den Transfer großer Gegenstände anfallen. Die nachstehenden Preise <b>enthalten keine Transferkosten</b>, sind aber je nach Art des Transfers in Ihrem Gesamtpaketpreis enthalten'
    create-lang-version -itemPath $holdLuggageListsPathHolidays -lang 'fr-CH' -field 'SportsEquipmentSubtitle' -value "Les équipements sportifs peuvent faire l'objet de frais supplémentaires pour couvrir le transfert d'articles volumineux. Les prix ci-dessous <b>ne comprennent pas les frais de transfert</b>, mais ils seront inclus dans le prix total de votre forfait en fonction du type de transfert."
    create-lang-version -itemPath $holdLuggageListsPathHolidays -lang 'fr-FR' -field 'SportsEquipmentSubtitle' -value "Les équipements sportifs peuvent faire l'objet de frais supplémentaires pour couvrir le transfert d'articles volumineux. Les prix ci-dessous <b>ne comprennent pas les frais de transfert</b>, mais ils seront inclus dans le prix total de votre forfait en fonction du type de transfert."
        
