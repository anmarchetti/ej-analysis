                    }
                    "FullOverviewPopupDescription" = @{
                        "en" = @'
    Examples of extraordinary circumstances:<br />
    - your hotel or resort is affected by a natural disaster, or severe weather, which causes flight cancellations<br />
    - air traffic control restrictions, industrial action which cause flight delays or cancellations a natural disaster occurs very close to your hotel, resort, or city meaning we&rsquo;re unable to safely or operationally fulfil the rest of your holiday<br />
    - the government travel advice issued by the FCDO changes to advise travellers against all non-essential travel.
    <p><strong>What happens if widespread disruption means my holiday can&rsquo;t go ahead?</strong></p>
    If travel disruption or another situation beyond our control means we can&rsquo;t fulfil 
    your holiday, we&rsquo;ll cancel it and you can either have a full refund, choose to 
    receive account credit (subject to our Credit on Account Terms and Conditions), 
    or accept a replacement holiday from us of which is at least equivalent in 
    standard and price (if we&rsquo;re able to offer you one) or a lower quality holiday, if 
    that&rsquo;s all we can offer, and then we&rsquo;ll refund you any difference in price between 
    your original holiday purchased and the new one.
    '@
                        "fr-CH" = @'
    Exemples de circonstances exceptionnelles :<br />
    - votre hôtel ou votre complexe touristique est touché par une catastrophe naturelle ou des conditions météorologiques extrêmes entraînant l'annulation de vols<br />
    - des restrictions imposées par le contrôle aérien ou des grèves entraînent des retards ou des annulations de vols une catastrophe naturelle se produit à proximité immédiate de votre hôtel, complexe touristique ou ville, nous empêchant ainsi d'assurer la sécurité et le bon déroulement du reste de votre séjour<br />
    - les conseils aux voyageurs émis par le FCDO changent et déconseillent tout voyage non essentiel.
    <p><strong>Que se passe-t-il si des perturbations généralisées empêchent le déroulement de mes vacances ?</strong></p>
    Si des perturbations de voyage ou une autre situation indépendante de notre volonté nous empêchent d'assurer 
    vos vacances, nous les annulerons et vous pourrez soit obtenir un remboursement complet, soit choisir de 
    recevoir un crédit sur votre compte (sous réserve de nos conditions générales relatives aux crédits sur compte), 
    soit accepter des vacances de remplacement de notre part, d'un niveau et d'un prix au moins équivalents 
    (si nous en mesure de vous en proposer un) ou un séjour de qualité inférieure, si 
    c'est tout ce que nous pouvons vous offrir, auquel cas nous vous rembourserons la différence de prix entre 
    le séjour initialement acheté et le nouveau séjour.
    '@
                        "de-CH" = @'
    Beispiele für außergewöhnliche Umstände:<br />
    - Ihr Hotel oder Resort ist von einer Naturkatastrophe oder Unwettern betroffen, die zu Flugausfällen führen. <br />
    - Flugverkehrsbeschränkungen, Arbeitskämpfe, die zu Flugverspätungen oder -ausfällen führen. Eine Naturkatastrophe ereignet sich in unmittelbarer Nähe Ihres Hotels, Resorts oder Ihrer Stadt, sodass wir den Rest Ihres Urlaubs nicht sicher oder operativ durchführen können. <br />
    - Die Reisewarnung der britischen Außenministeriums (FCDO) wird geändert und Reisenden wird von allen nicht unbedingt notwendigen Reisen abgeraten.
    <p><strong>Was passiert, wenn mein Urlaub aufgrund weitreichender Störungen nicht stattfinden kann?</strong></p>
    Wenn wir aufgrund von Reiseunterbrechungen oder anderen Umständen, die außerhalb unserer Kontrolle liegen, Ihren Urlaub nicht durchführen können,
     stornieren wir ihn und Sie können entweder eine vollständige Rückerstattung erhalten, sich für eine 
    Gutschrift auf Ihr Konto entscheiden (gemäß unseren Allgemeinen Geschäftsbedingungen für Gutschriften) 
    oder einen Ersatzurlaub von uns annehmen, der mindestens dem gleichen 
    Standard und Preis entspricht (sofern wir Ihnen einen solchen anbieten können) oder einen Urlaub von geringerer Qualität, wenn 
    wir Ihnen nichts anderes anbieten können, und erstatten Ihnen dann die Preisdifferenz zwischen 
    Ihrem ursprünglich gebuchten Urlaub und dem neuen Urlaub.
    '@
                        "fr-FR" = @'
    Exemples de circonstances exceptionnelles :<br />
    - votre hôtel ou votre complexe touristique est touché par une catastrophe naturelle ou des conditions météorologiques extrêmes entraînant l'annulation de vols<br />
    - des restrictions imposées par le contrôle aérien ou des grèves entraînent des retards ou des annulations de vols une catastrophe naturelle se produit à proximité immédiate de votre hôtel, complexe touristique ou ville, nous empêchant ainsi d'assurer la sécurité et le bon déroulement du reste de votre séjour<br />
    - les conseils aux voyageurs émis par le FCDO changent et déconseillent tout voyage non essentiel.
    <p><strong>Que se passe-t-il si des perturbations généralisées empêchent le déroulement de mes vacances ?</strong></p>
    Si des perturbations de voyage ou une autre situation indépendante de notre volonté nous empêchent d'assurer 
    vos vacances, nous les annulerons et vous pourrez soit obtenir un remboursement complet, soit choisir de 
    recevoir un crédit sur votre compte (sous réserve de nos conditions générales relatives aux crédits sur compte), 
    soit accepter des vacances de remplacement de notre part, d'un niveau et d'un prix au moins équivalents 
    (si nous en mesure de vous en proposer un) ou un séjour de qualité inférieure, si 
    c'est tout ce que nous pouvons vous offrir, auquel cas nous vous rembourserons la différence de prix entre 
    le séjour initialement acheté et le nouveau séjour.
    '@
                        "de-DE" = @'
    Beispiele für außergewöhnliche Umstände:<br />
    - Ihr Hotel oder Resort ist von einer Naturkatastrophe oder Unwettern betroffen, die zu Flugausfällen führen. <br />
    - Flugverkehrsbeschränkungen, Arbeitskämpfe, die zu Flugverspätungen oder -ausfällen führen. Eine Naturkatastrophe ereignet sich in unmittelbarer Nähe Ihres Hotels, Resorts oder Ihrer Stadt, sodass wir den Rest Ihres Urlaubs nicht sicher oder operativ durchführen können. <br />
    - Die Reisewarnung der britischen Außenministeriums (FCDO) wird geändert und Reisenden wird von allen nicht unbedingt notwendigen Reisen abgeraten.
    <p><strong>Was passiert, wenn mein Urlaub aufgrund weitreichender Störungen nicht stattfinden kann?</strong></p>
    Wenn wir aufgrund von Reiseunterbrechungen oder anderen Umständen, die außerhalb unserer Kontrolle liegen, Ihren Urlaub nicht durchführen können,
     stornieren wir ihn und Sie können entweder eine vollständige Rückerstattung erhalten, sich für eine 
    Gutschrift auf Ihr Konto entscheiden (gemäß unseren Allgemeinen Geschäftsbedingungen für Gutschriften) 
