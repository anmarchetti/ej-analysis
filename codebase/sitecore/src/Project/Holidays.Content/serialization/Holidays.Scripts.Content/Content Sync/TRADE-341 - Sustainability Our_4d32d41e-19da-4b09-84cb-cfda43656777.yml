- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -Language "en" -ErrorAction SilentlyContinue
        
        if (-Not $item){
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    $sustainabilityPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Sustainability"
    $pageComponentsPath = "$($sustainabilityPagePath)/Page Components"
    
    # Our Approach text block data source
    $video = Get-Or-Create-Item -Path "$($pageComponentsPath)/Video 1" -TemplateId "{70FA1604-EA9A-48C6-8E33-DBD0BE54BA24}"
    
    if ($video -ne $null) {
        $video.Editing.BeginEdit()
        $video["IsMuted"] = "1"
        $video["ShowPreviewOnMobile"] = "1"
        $video.Editing.EndEdit() | Out-Null
        
        Write-Host "Video data source settings updated"
    }
    
