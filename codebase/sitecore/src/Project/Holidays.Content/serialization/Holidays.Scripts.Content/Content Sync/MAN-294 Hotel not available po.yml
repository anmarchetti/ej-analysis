  Hint: Script
  Value: |
    function update-item-with-lang ($data,$item) {
    	function create-lang-version ($item,$lang,$field,$value) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
    
    		if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    			Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    		}
    
    		if ($null -ne $field) {
    			$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
    			$targetLangItem.Editing.BeginEdit()
    			$targetLangItem[$field] = $value;
    			$targetLangItem.Editing.EndEdit() | Out-Null
    		}
    	};
    
    	if ($item -ne $null) {
    		$data | ForEach-Object {
    			$fieldName = $_.fieldName;
    			$values = $_.Values;
    
    			if ($values -ne $null) {
    				if ($values.en -ne $null) {
    					$item.Editing.BeginEdit();
    					$item[$fieldName] = $values.en;
    					$item.Editing.EndEdit() | Out-Null
    				}
    				if ($values.fr -ne $null) {
    					@( 'fr-CH','fr-FR') | % {
    						Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
    					}
    				}
    				if ($values.de -ne $null) {
    					@( 'de-CH','de-DE') | % {
    						Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
    					}
    				}
    
    				Write-Host $fieldName "Updated"
    			}
    		}
    	}
    };
    
    function Add-Or-Update-Page-Rendering ($page,$renderingPath,$renderingPlaceholder,$dataSourcePath,$params) {
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath -ErrorAction SilentlyContinue;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -DataSource $dataSourcePath -Parameter $params;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Data/Hotel Unavailable Popup";
    
    # Creating and populating hotel popup
    $rbcUnavailablePopup = Get-Or-Create-Item -Path $dataSourcePath -Template "{C8C39B93-2202-4B2D-937F-8F644B0D3183}";
    
    if ($rbcUnavailablePopup -ne $null) {
    	$popupData = @(
    		@{
    			fieldName = "Title";
    			Values = @{
    				en = "Your selection is no longer available";
    				fr = "NOUS SOMMES DÉSOLÉS, IL N'Y A PAS D'AUTRES OPTIONS DE CHAMBRE ET DE PENSION DISPONIBLES POUR L'HÔTEL CHOISI";
    				de = "ES TUT UNS LEID, ES SIND KEINE ALTERNATIVEN OPTIONEN FÜR IHR GEWÄHLTES HOTEL VERFÜGBAR"
    			}
    		},
    		@{
    			fieldName = "Description";
    			Values = @{
    				en = "We’re sorry. Unfortunately, part of your package is no longer available. Please go back and review your hotel selection.";
    				fr = "Nous sommes désolés. Malheureusement, une partie de votre forfait n'est plus disponible. Veuillez revenir en arrière et revoir votre sélection d'hôtels.";
    				de = "Es tut uns leid. Leider ist ein Teil Ihres Pakets nicht mehr verfügbar. Bitte gehen Sie zurück und überprüfen Sie Ihre Hotelauswahl."
    			}
    		},
    		@{
    			fieldName = "CTA";
    			Values = @{
    				en = "Back to change your hotel";
    				fr = "Retour au changement d'hôtel";
    				de = "Zurück zu Ihrem Hotelwechsel";
    			}
    		},
    		@{
    			fieldName = "Icon";
    			Values = @{
    				en = '<image mediaid="{A484212A-377A-4DC9-8754-BABFE7701E3D}" alt="Exclamation mark" />';
    			}
    		}
    	);
    
    
    	update-item-with-lang -Data $popupData -Item $rbcUnavailablePopup;
    }
    
    # Updateing my_booking page rendering
    $changeHotelPage = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Hotel";
    $attentionPopupRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $renderingPlaceholder = "/body/attention-popup-{A04779CC-AE61-4870-A0F0-13ED5434F301}-0";
    
    
    Add-Or-Update-Page-Rendering -page $changeHotelPage -renderingPath $attentionPopupRenderingPath -renderingPlaceholder $renderingPlaceholder -dataSourcePath $dataSourcePath;
    Write-Host $myBookingPage.Name "Render was updated";
    
