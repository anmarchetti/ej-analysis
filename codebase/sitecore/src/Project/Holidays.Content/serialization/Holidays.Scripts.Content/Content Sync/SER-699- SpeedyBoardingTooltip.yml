        Import-Function "Import Content"
        
        $itineraryDatasorcePath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Hotel Summary"
        $itineraryTemplatePath = "/sitecore/templates/Feature/Booking/View Booking/Itinerary Summary/Flight Data"
        $hotelSummaryDatasorcePath = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Itinerary Summary"
        $hotelSummaryTeplatePath = "/sitecore/templates/Foundation/Destinations/Base/_Base Cabin Bags/Cabin Bags Shared Fields"
        
    
    
    function New-Speedy-Boarding-Tooltip($datasoursePath, $templatePath) {
            $updates = @(
                @{
                    Path         = $datasoursePath
                    TemplatePath = $templatePath
                    Fields      = @{
                        "SpeedyBoardingTooltip" = @{
                            "en" = "Subject to airport fulfilment/availability"
                            "fr-CH" = "Sous réserve de disponibilité/traitement à l’aéroport"
                            "de-CH" = "Vorbehaltlich der Erfüllung/Verfügbarkeit am Flughafen"
                            "fr-FR" = "Sous réserve de disponibilité/traitement à l’aéroport"
                            "de-DE" = "Vorbehaltlich der Erfüllung/Verfügbarkeit am Flughafen"
                        }
                    }
                }
            )
            ImportContent -itemsToCreate $updates
        }
        
            
        
        
            New-Speedy-Boarding-Tooltip -DatasoursePath $itineraryDatasorcePath -TemplatePath $itineraryTemplatePath;
            New-Speedy-Boarding-Tooltip -DatasoursePath $hotelSummaryDatasorcePath -TemplatePath $hotelSummaryTeplatePath;
        
     
       
    
    
    
