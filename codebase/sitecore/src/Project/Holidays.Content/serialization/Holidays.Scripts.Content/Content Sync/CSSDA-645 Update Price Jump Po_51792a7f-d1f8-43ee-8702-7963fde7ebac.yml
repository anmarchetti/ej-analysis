SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
    
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
       
    
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    
        }
    
       
    
        if ($null -ne $field) {
    
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
            $targetLangItem.Editing.BeginEdit()
    
            $targetLangItem[$field] = $value;
    
            $targetLangItem.Editing.EndEdit() | Out-Null
    
        }
    
    }
    
     
    
     
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Price Jump Popup/Labels/Refund Description"
    
    
    
    @('de-CH', 'de-DE') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Aufgrund der Preisänderung erhalten Sie nun eine Erstattung von {refundAmount}."
    
    }
    
    
    @('fr-CH', 'fr-FR') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "En raison du changement de prix, vous recevrez désormais un remboursement de {refundAmount}."
    
    }
    
    @('en') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Due to the change in price, you will now receive a refund of {refundAmount}."
    
    }
    
