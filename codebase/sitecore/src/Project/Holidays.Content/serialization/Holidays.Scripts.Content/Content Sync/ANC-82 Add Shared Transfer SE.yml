    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Create-Data-Source-Item($name, $path, $templateId){
        $item = Get-Item -Path "$path/$name" -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
            
            if($item -ne $null){
                Write-Host "Transfer Section Datasource is created"
            }
                
            return $item
        }
        
        return $item
    }
    
    function Update-Rendering($pagePath, $data, $renderingId) {
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        
        if ($page) {
            $rendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
       
            if ($rendering -ne $null) {
                Set-Rendering -Item $page -Instance $rendering -Datasource $data
            }
        }
    }
    
    function Transfer-Update($website){
        $dataSourceName = "Transfer Section"
        $dataSourcePath ="/sitecore/content/EasyJet/$website/Home/Booking/Page Components"
        $transferDataSourceTemplateId = "{1D188ABB-6067-499F-A457-51C8EF666CC5}"
        
        # Create and fill transfer datasource
        $dataSourceItem = Create-Data-Source-Item -Name $dataSourceName -Path $dataSourcePath -TemplateId $transferDataSourceTemplateId
        
        if($dataSourceItem -ne $null) {
            $dataSourceItem.Editing.BeginEdit()
            $dataSourceItem["SharedFeesTitle"] = "Additional fees included"
            $dataSourceItem["SharedFeesDescription"] = "Our transfer partner charges an additional {price} per sports equipment item. This has been added to your holiday package cost."
            $dataSourceItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Transfer Section Datasource updated"
        }
        
        # Add fees label to Hold Luggage Data Source
        $holdLuggagePath = "/sitecore/content/EasyJet/$website/Data/Ancillaries/Hold Luggage"
        $holdLuggageDataSource = Get-Item -Path $holdLuggagePath -ErrorAction SilentlyContinue
            
        if($holdLuggageDataSource -ne $null){
            $holdLuggageDataSource.Editing.BeginEdit()
            $holdLuggageDataSource["SportTransferFees"] = "(excl. transfer costs)"
            $holdLuggageDataSource.Editing.EndEdit() | Out-Null
            Write-Host "Hold Luggage Datasource updated"
        }
        
        # Add translations on Holidays
        if($website -eq "Holidays"){
            foreach ($lang in $translations.Keys) {
                create-lang-version -item $dataSourceItem -lang $lang -field "SharedFeesTitle" -value $translations[$lang]["SharedFeesTitle"]
                create-lang-version -item $dataSourceItem -lang $lang -field "SharedFeesDescription" -value $translations[$lang]["SharedFeesDescription"]
                create-lang-version -item $holdLuggageDataSource -lang $lang -field "SportTransferFees" -value $translations[$lang]["SportTransferFees"]
                
                Write-Host "Translations added"
            }
        }
        
        $bookingPath = "/sitecore/content/EasyJet/$website/Home/Booking"
        $dataSourceFullPath ="$dataSourcePath/$dataSourceName"
        $transferRenderingId = "{62F93471-0DCA-49AE-95AF-2B346D8098D8}"
        Update-Rendering -pagePath $bookingPath -data $dataSourceFullPath -renderingId $transferRenderingId
        Write-Host "Transfers updated on" $website
    }
    
    Transfer-Update -website "Holidays"
    Transfer-Update -website "TradePortal"
    
