    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    #create data
    $translations = @{
                    "en" = @{
                        "Title"= 'Your cancelled holiday'
                    }
                    "fr-CH" = @{
                        "Title"= 'Votre vacances annulées'
                    }
                    "fr-FR" = @{
                         "Title"= 'Votre vacances annulées'
                    }
                    "de-CH" = @{
                        "Title"= 'Ihr abgesagter Urlaub'
                       
                    }
                    "de-DE" = @{
                        "Title"= 'Ihr abgesagter Urlaub'
                    }
                }
                
    $data = Get-Or-Create-Item -path '/sitecore/content/EasyJet/Holidays/Home/Booking/Booking Cancelled/Page Components/Hotel Summary' -templateId '{D7B81D43-5CEF-4EF3-ADDE-7238000012C3}'
    foreach ($lang in $translations.Keys) {
                create-lang-version -item $data -lang $lang -field "Title" -value $translations[$lang]["Title"]
            }    
    
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Booking Cancelled" -ErrorAction SilentlyContinue
    Get-Rendering -Item $page | Where-Object -FilterScript {$_.ItemID -eq '{00E6EA38-0298-454C-B2B1-91BBC3BFAE70}' } | Set-Rendering -Item $page -Datasource $data.ID
    
    $data = Get-Item -Database "master" -Path '/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Inspire Me Banner' -ErrorAction SilentlyContinue
    Get-Rendering -Item $page | Where-Object -FilterScript {$_.ItemID -eq '{5A4E2577-32C2-420F-9F52-494394DA3364}' } | Set-Rendering -Item $page -Datasource $data.ID
    
    $data = Get-Item -Database "master" -Path '/sitecore/content/EasyJet/Holidays/Data/Recommended Hotels Carousel Folder/Post Travel Page Recommended Hotels Carousel' -ErrorAction SilentlyContinue
    Get-Rendering -Item $page | Where-Object -FilterScript {$_.ItemID -eq '{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}' } | Set-Rendering -Item $page -Datasource $data.ID
    
    #set parameters to all pages
    function SetParams($path, $params, $rendId){
        $item = Get-Item -Path $path
        Get-Rendering -Item $item | Where-Object -FilterScript {$_.ItemID -eq $rendId } | Set-RenderingParameter -Parameter $params  | Set-Rendering -Item $item
    }
    
    
    $params =  [ordered]@{"IsOpeningPopupLinkVisible"="1"}
    SetParams -path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/in-destination' -params $params -rendId '{00E6EA38-0298-454C-B2B1-91BBC3BFAE70}'
    SetParams -path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel' -params $params -rendId '{00E6EA38-0298-454C-B2B1-91BBC3BFAE70}'
    SetParams -path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/post-travel' -params $params -rendId '{00E6EA38-0298-454C-B2B1-91BBC3BFAE70}'
    
    $params =  [ordered]@{"IsNarrowContainer"="1"; "OpenLinksInNewTab"="1"}
    SetParams -path '/sitecore/content/EasyJet/Holidays/Home/Booking/Booking Cancelled' -params $params -rendId '{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}'
    
    #set order params
    $renderings = Get-Rendering -Item $page | Where-Object -FilterScript {$_.ItemID -eq '{630D2676-483E-420D-8F04-4C15212F3EFF}' }
    $index = 1
    foreach ($rendering in $renderings) {
        $params =  [ordered]@{"ItemOrderOnMobile"=$index}
        
        Set-RenderingParameter -Instance $rendering -Parameter $params  | Set-Rendering -Item $page
        
        $index++
    }
