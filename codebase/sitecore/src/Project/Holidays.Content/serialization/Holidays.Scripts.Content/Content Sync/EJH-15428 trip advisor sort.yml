- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Set-StrictMode -Version Latest
    #$ErrorActionPreference = "Stop"
    #$PSDefaultParameterValues['*:ErrorAction']='Stop'
    
    $tripAdvisorSortId = "{F0A71603-A18D-4F07-B0E3-F4C603557DE8}"
    $defaultSearchSortsPath = "/sitecore/content/EasyJet/Holidays/Data/Sort Orders/Default Ordering For Search Results"
    $defaultPromoSortsPath = "/sitecore/content/EasyJet/Holidays/Data/Sort Orders/Default Ordering For Promo Page"
    $sortOrderSettingsTemplateId = "{F1A11D93-990A-4932-9DFC-F19C3E98BE3A}"
    
    #common functions
    
    function Get-ItemBasedOnTemplate {
            param(
                [string]$TemplateId
            )
        
            $queue = New-Object System.Collections.Queue
            $processedLookup = New-Object System.Collections.Generic.HashSet[string]
            if(-not(Test-Path -Path "master:$($TemplateId)")) { return }
            $processedLookup.Add($TemplateId) > $null  
            Get-ItemReferrer -Id $TemplateId -ItemLink | 
                Where-Object { $_.SourceItemID } | 
                ForEach-Object { $queue.Enqueue($_.SourceItemID) }
        
            $database = Get-Database -Name "master"
            while($queue.Count -and ($referrerId = $queue.Dequeue())) {
                if($processedLookup.Contains($referrerId)) { continue }
                $processedLookup.Add($referrerId) > $null
                $referrer = $database.GetItem($referrerId)
                if(!$referrer) { continue }
                if($referrer.Paths.FullPath.StartsWith("/sitecore/templates")) { 
                    if($referrer.Name -eq "__Standard values") { continue }
                    foreach($referrerItemLink in Get-ItemReferrer -Id $referrerId -ItemLink | Where-Object { $_.SourceItemID }) {
                        $queue.Enqueue($referrerItemLink.SourceItemID)
                    }
                    $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrerId, $database)
                } else {
                    $itemTemplate = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($referrer)
                }
                
                if ($itemTemplate -and $itemTemplate.DescendsFromOrEquals($TemplateId)) {
                    $referrer
                }
            }
        }
    
    #script functions
    
    function AddTripAdvisorSortToSortSettings($sortSettingsItem)
    {
        $sortOrder = $sortSettingsItem.Fields["SortOrders"].Value;
    
        if(!($sortOrder -like "*$($tripAdvisorSortId)*"))
        {
            $newValue = "$($sortOrder)|$($tripAdvisorSortId)"
            $sortSettingsItem.Editing.BeginEdit()
            $sortSettingsItem.Fields["SortOrders"].Value = $newValue
            $sortSettingsItem.Editing.EndEdit()
            Write-Host "Added trip advisor sort to $($sortSettingsItem.DisplayName) - $($sortSettingsItem.Id)"
        }
    }
    
    function AddTripAdvisorSortToAllPromos()
    {
        $items = Get-ItemBasedOnTemplate -TemplateId $sortOrderSettingsTemplateId
        $items = $items | Where-Object { $_.Paths.FullPath.StartsWith("/sitecore/content/EasyJet/Holidays/Home/Root") }
    
        foreach($item in $items)
        {
            AddTripAdvisorSortToSortSettings -sortSettingsItem $item
        }
    }
    
    $defaultSearchSortsItem = Get-Item $defaultSearchSortsPath
    AddTripAdvisorSortToSortSettings -sortSettingsItem $defaultSearchSortsItem
    
    $defaultPromoSortsItem = Get-Item $defaultPromoSortsPath
    AddTripAdvisorSortToSortSettings -path Get-Item $defaultPromoSortsItem
    
    AddTripAdvisorSortToAllPromos
