- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index ){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
    }
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $sign, $specificPlaceholder){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if($index -gt 0)
                {
                    $incrementIndex = $index
                    if ($sing -ne 0){
                        $incrementIndex = $index + $sign
                    }
                
                    if($specificPlaceholder -ne $null){
                        Add-New-Rendering -Item $item -Placeholder "/body/excursions-$($_.UniqueId)-0" -RenderingId $newRenderingId -DataSource $datasource -Index $incrementIndex
                    }
                }
                return
            }
        }
    }
    
    #Get datasource
    $excursionsData = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Excursions" -ErrorAction SilentlyContinue
    if ($excursionsData -ne $null) {
    	$excursionsData.Editing.BeginEdit()
    	$excursionsData["Title"] = 'Exciting tours and activities'
    	$excursionsData.Editing.EndEdit() | Out-Null;
    }
    
    if($excursionsData -ne $null){
        $confirmationPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation" -ErrorAction SilentlyContinue;
        Add-Rendering-To -Item $confirmationPage -RenderingId "{E10ECB4E-19CE-4255-982C-04E6E3592A20}" -NewRenderingId "{9C3DFA27-58E8-466E-AB02-1158188EE582}" -Datasource $excursionsData.ID -Sign 6 -SpecificPlaceholder "excursions";
        
        $viewBookingPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking" -ErrorAction SilentlyContinue;
        Add-Rendering-To -Item $viewBookingPage -RenderingId "{B932CD1B-05BD-4F1D-947F-1E6F48C4F649}" -NewRenderingId "{9C3DFA27-58E8-466E-AB02-1158188EE582}" -Datasource $excursionsData.ID -Sign 7 -SpecificPlaceholder "excursions";
    }
    
    
    
