- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $paths = @("/sitecore/content/EasyJet/Holidays/Data/Search Pod Data Folder",
    "/sitecore/content/EasyJet/TradePortal/Data/Search Pod Data Folder")
    
    $paths | % {
        $item = gi -Path $_ -ErrorAction SilentlyContinue
    
        if ($null -ne $item) {
            $item | Remove-Item -Recurse
        }
    }
    
    # dictionaries
     
    $keys = @(
        "SearchPod.Labels.AirportPlural",
        "SearchPod.Labels.AllCountries",
        "SearchPod.Labels.AllCountriesTitle",
        "SearchPod.Labels.CustomMenuTitle",
        "SearchPod.Labels.Resort",
        "SearchPod.Labels.RegionSingular",
        "SearchPod.Labels.RegionPlural",
        "SearchPod.Labels.Selected",
        "SearchPod.Labels.SelectedQuantity",
        "SearchPod.Labels.AllDestinations"
        )
        
    $keys | % {
        $item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod//*[@Key='$_']"
    
        if ($item -ne $null) {
                Remove-Item -Path $item.Paths.FullPath -Permanently
        
            Write-Host "Item" $item.Name "successfully removed from Holidays/Dictionary/"
        }
        
        $itemT = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/TradePortal/Dictionary/Search Pod//*[@Key='$_']"
        
        if ($itemT -ne $null) {
                Remove-Item -Path $itemT.Paths.FullPath -Permanently
        
            Write-Host "Item" $itemT.Name "successfully removed from TradePortal/Dictionary/"
        }
    }
    
