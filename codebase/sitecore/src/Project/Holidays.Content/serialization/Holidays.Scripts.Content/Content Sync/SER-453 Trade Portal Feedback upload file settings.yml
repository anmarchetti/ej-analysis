    - ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
      Hint: Script
      Value: |
            # Für Sitecore PowerShell ISE ausführen!
            # Falls in normaler PowerShell: Sitecore PowerShell Extensions Module laden
            
            $itemPath = "/sitecore/content/EasyJet/TradePortal/Settings"
            $itemName = "Feedback Attached File Settings"
            $itemTemplateId = "{86f9d889-dd33-4fac-8b14-1535e00fac2b}"
            
            $fullPath = "$itemPath/$itemName"
            $item = Get-Item -Path $fullPath -ErrorAction SilentlyContinue
            
            if ($item -eq $null) {
            Write-Host "Creating item '$itemName'..."
            $item = New-Item -Path $itemPath -Name $itemName -ItemType $itemTemplateId
            if ($item -ne $null) {
            Write-Host "Item '$itemName' successfully created"
            $item.Editing.BeginEdit()
            $item["MaxFileCount"] = "5"
            $item["MaxFileSize"] = "10485760"
            $item["AllowedFileExtensions"] = ".pdf,.jpeg,.png"
            $item.Editing.EndEdit()
            Write-Host "Item '$itemName' successfully updated"
        } else {
        Write-Host "Error: Item could not be created"
        }
        } else {
            Write-Host "Item '$itemName' already exists. Updating..."
            $item.Editing.BeginEdit()
            $item["MaxFileCount"] = "5"
            $item["MaxFileSize"] = "10485760"
            $item["AllowedFileExtensions"] = ".pdf,.jpeg,.png"
            $item.Editing.EndEdit()
            Write-Host "Item '$itemName' successfully updated"
        }
