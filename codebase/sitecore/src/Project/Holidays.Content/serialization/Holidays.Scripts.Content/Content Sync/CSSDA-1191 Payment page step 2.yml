    - ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
      Hint: Script
      Value: |
          ## UPDATE FILEDS WITH LANGS
             function update-item-with-lang($data, $item) {
                 function create-lang-version($item, $lang, $field, $value) {
                     $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                     
                     if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                         Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
                     }
                     
                     if ($null -ne $field) {
                         $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                         $targetLangItem.Editing.BeginEdit()
                         $targetLangItem[$field] = $value;
                         $targetLangItem.Editing.EndEdit() | Out-Null
                     }
             };
             
                 if ($item -ne $null) {
                     $data | ForEach-Object {
                     $fieldName = $_.fieldName;
                     $values = $_.values;
                 
                     if ($values -ne $null) {
                       
                         if ($values.en -ne $null) {
                             $item.Editing.BeginEdit();
                             $item[$fieldName] = $values.en;
                             $item.Editing.EndEdit() | Out-Null
                         }
                          if ($values.fr -ne $null) {
                              @('fr-CH', 'fr-FR') | % {
                                 Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                             }
                         }
                          if ($values.de -ne $null) {
                              @('de-CH', 'de-DE') | % {
                                 Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                             }
                         }
                         
                         Write-Host $fieldName "Updated"
                     }
                 }
                 }
             };
             ##
             
             
             # Amend Payment Item
             $manePaymentItem = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Payment" -ErrorAction SilentlyContinue;
             $amendPaymentItemData = @(
                 @{
                   fieldName = "PayFullAmendTitle";
                   values = @{
                       en = "Pay for your change now";
                       fr = "Payez votre monnaie maintenant";
                       de = "Bezahlen Sie jetzt für Ihr Wechselgeld";
                   };
               },
               @{
                   fieldName = "AddAmendToBalanceTitle";
                   values = @{
                       en = "Pay for your change later";
                       fr = "Payez votre monnaie plus tard";
                       de = "Bezahlen Sie Ihr Wechselgeld später";
                   };
               },
               @{
                   fieldName = "CreditDescription";
                   values = @{
                       en = "<p>Choosing this option means you'll receive {amount} to spend within <strong>12 months</strong> on another easyJet Holiday.</p><br /><p>This will be immediately refunded to your easyJet account.</p>";
                       fr = "<p>En choisissant cette option, vous recevrez {amount} à dépenser dans les <strong>12 mois</strong> sur un autre séjour easyJet.</p><br /><p>Ce montant vous sera immédiatement remboursé sur votre compte easyJet.</p>";
                       de = "<p>Wenn Sie diese Option wählen, erhalten Sie {amount}, den Sie innerhalb von <strong>12 Monaten</strong> für einen anderen easyJet-Urlaub ausgeben können.</p><br /><p>Dieser Betrag wird Ihrem easyJet-Konto sofort gutgeschrieben.</p>";
                   };
               },
               @{
                   fieldName = "PayFullAmendDescription";
                   values = @{
                       en = "<p>Confirm your changes and pay a total of <strong data-cs-mask=`"true`"{amount} now.</strong></p>";
                       fr = "<p>Confirmez vos changements et payez un total de <strong data-cs-mask=`"true`"{amount} maintenant.</strong></p>";
                       de = "<p>Bestätigen Sie Ihre Änderungen und zahlen Sie jetzt einen Gesamtbetrag von <strong data-cs-mask=`"true`"{amount}.</strong></p>";
                   };
               },
               @{
                   fieldName = "RefundDescription";
                   values = @{
                       en = "Choosing to refund to original payment method means we'll refund you the total amount of the changed {transport} of {amount}.";
                       fr = "En choisissant de rembourser le mode de paiement initial, nous vous rembourserons le montant total du {transport} modifié de {amount}.";
                       de = "Wenn Sie sich für die Rückerstattung mit der ursprünglichen Zahlungsmethode entscheiden, erstatten wir Ihnen den Gesamtbetrag der geänderten {transport} von {amount}.";
                   };
               },
               @{
                   fieldName = "OutstandingPaymentOptionDescriptionExtraPrice";
                   values = @{
                       en = "Confirm your change and add the additional cost of {amount} to your holiday balance to total {price}. This needs to be paid by {date}.";
                       fr = "Confirmez votre changement et ajoutez le coût supplémentaire de {amount} à votre solde de vacances pour un total de {price}. Ce montant doit être payé avant le {date}.";
                       de = "Bestätigen Sie Ihre Änderung und addieren Sie die zusätzlichen Kosten von {amount} zu Ihrem Urlaubssaldo auf insgesamt {price}. Dieser Betrag muss bis {date} bezahlt werden.";
                   };
               }
             );
             
             update-item-with-lang -Item $manePaymentItem -Data $amendPaymentItemData;
