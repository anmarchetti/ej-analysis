    ## GET OR CREATE ITEM
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    ###
    
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    ## GET OR CREATE ITEM AND POPULATE IT
    function Get-Or-Create-Item-And-Populate($itemPath, $template, $data) {
        $item = Get-Or-Create-Item -Path $itemPath -Template $template;
        
        if ($item -ne $null) {
            Write-Host $item.Name "Has been created/find";
            
            update-item-with-lang -Data $data -Item $item;
        }
        
        return $item;
    }
    
    ## UPDATE PAGE RENDERING
    function Add-Or-Update-Page-Rendering ($pagePath, $renderingPath, $renderingPlaceholder, $dataSourcePath, $parameters = @{}) {
        $page = Get-Item -Path $pagePath;
    	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
    	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
    
    
    	if ($pageRenderingInstance -eq $null) {
    		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
    		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Parameter $parameters -DataSource $dataSourcePath;
    		Write-Host $renderingItem "Rendering instance added";
    	}
    	else {
    		Write-Host $pageRenderingInstance "Already exists";
    	}
    }
    ##
    
    $popupPath = "/sitecore/content/EasyJet/Holidays/Data/Amend Dates Unavailable Popup";
    $popupRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Product Unavailable Popup";
    
    $popupTemlate = Get-Item -Path "/sitecore/templates/Feature/PageContent/Popup Unavailable Product" -ErrorAction SilentlyContinue;
    $data = @(
        @{
            fieldName = "Title";
            values = @{
                en = "Holiday Package No Longer Available";
                fr = "Le forfait vacances n'est plus disponible";
                de = "Urlaubspaket nicht mehr verfügbar";
            }
        },
        @{
            fieldName = "Description";
            values = @{
                en = "Due to inactivity the dates you have selected are no longer available. Please go back to the calendar and select new dates.";
                fr = "En raison de l'inactivité, les dates que vous avez sélectionnées ne sont plus disponibles. Veuillez retourner au calendrier et sélectionner de nouvelles dates.";
                de = "Aufgrund von Inaktivität sind die von Ihnen ausgewählten Termine nicht mehr verfügbar. Bitte gehen Sie zurück zum Kalender und wählen Sie neue Termine aus.";
            }
        },
        @{
            fieldName = "Icon";
            values = @{
                en = '<image mediaid="{9AD6CCA7-4EC3-4FDB-AE89-7CEB74C92569}" />';
            }
        },
        @{
            fieldName = "CTA";
            values = @{
                en = 'Back to Calendar';
                fr = "Retour au calendrier";
                de = "Zurück zu Kalender";
            }
        }
    );
    
    $amendDatePopup = Get-Or-Create-Item-And-Populate -ItemPath $popupPath -Template $popupTemlate.ID -Data $data;
    
    Add-Or-Update-Page-Rendering -PagePath "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment" -RenderingPath $popupRenderingPath -RenderingPlaceholder "/body/product-unavailable-popup-{8490EEB0-F576-488C-810F-59CBF716C135}-0" -DataSourcePath $popupPath -Parameters @{ product = "Dates" };
    Add-Or-Update-Page-Rendering -PagePath "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -RenderingPath $popupRenderingPath -RenderingPlaceholder "/body/product-unavailable-popup-{38583CEB-D1E1-46EF-9AEA-A2E284152FA6}-0" -DataSourcePath $popupPath -Parameters @{ product = "Dates" };
    
    $unusedPopup = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Dates Unavailable Popup" -ErrorAction SilentlyContinue;
    if ($unusedPopup -ne $null) {
        $unusedPopup.Delete();
    }
    
    
    
    
    
    
