Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SEATS-447-TRADE-20-manage-seat-selection-fail"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $datasourceTemplate= Get-Item -Path "/sitecore/templates/Project/Trade Portal/Datasource/Seats Availability Error Popup Trade"
    $tradePortalPageComponentItem= Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking/Page Components" -ErrorAction SilentlyContinue;
    if ($tradePortalPageComponentItem-ne $null) {
        $tradeItem = New-Item -Path $tradePortalPageComponentItem.Paths.Path -Name "Seats Availability Error Popup Trade" -ItemType $datasourceTemplate.ID
    
    if ($tradeItem -ne $null) {
        	$tradeItem.Editing.BeginEdit();
        	$tradeItem["Title"] = "There is a problem with your seats";
        	$tradeItem["Description"] = "One or more of the seats you have picked for your flights are now unavailable.<br><br>" +
        		"You can choose other seats, or go back and view your holiday booking.<br><br>" +
        		"You can reserve seats up to 30 days before departure date.";
        	$tradeItem["ReselectSeatsButtonText"] = "Choose other seats"
        	$tradeItem["ClearSeatsButtonText"] = "Back to view booking";
                $tradeItem["ConfirmationCheckboxLabel"] = "I have read and explained this message to the customer, and they have agreed they understand.";
        	$tradeItem.Editing.EndEdit() | Out-Null;
        	Write-Host $tradeItem.Name "is updated";
    }
    $renderingPath = "/sitecore/layout/Renderings/Feature/SeatMap/Seats Not Available Popup"
    $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder "body"
    
    # Find the item to receive the new rendering
    $item = Get-Item -Path "master://sitecore/content/EasyJet/TradePortal/Home/Booking/View Booking"
    # Add the rendering to the item
    Add-Rendering -Item $item -PlaceHolder "body" -Instance $renderingItem -DataSource $tradeItem.ID.ToString() 
    }
