    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq3_Id = "{E99EFCA2-E06E-4C6A-850E-91DBD57B9BDB}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq6_Id = "{0E6BE4AF-D377-4C98-87C6-1F980C93E34F}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotel_Id = "{BF89707A-DC47-45BC-9753-B793ED9AD012}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq2_Id = "{5410F31B-F68F-4D34-BB8D-75AE0213A45D}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq5_Id = "{82EC431A-56D4-440A-AE36-BA9ADD688ED5}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq1_Id = "{5FB1505F-4BAF-487F-A0D9-2BA7B2869947}"
    $holidayshomerootinfodisruptionpagecomponentswhattodonowquestionsflightplushotelq4_Id = "{13F47D25-F152-46A9-B924-9F73C622321D}"
    $q5_answer_82ec431a56d4440aae36ba9add688ed5_frfr_v1 = @"
    <p>Mettre fin à vos vacances et vous ramener chez vous plus tôt que prévu est une solution de dernier recours. Nous sommes conscients de la déception que cela peut représenter. Si cela s’avère nécessaire, nous vous contacterons et vous communiquerons les informations relatives à vos nouveaux horaires de transfert (le cas échéant) et de vol, qui peuvent être dans plusieurs jours, en fonction de notre calendrier de vol. </p>
    <p>En cas de perturbations importantes, nous pourrions vous demander de prendre vos propres dispositions pour le retour et éventuellement de réserver votre propre hébergement pour la nuit. Toutes les&nbsp;<a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">dépenses effectuées dans les limites du raisonnable</span></strong></a> vous seront remboursées.</p>
    <p>Sachez que nous vous aiderons à rentrer chez vous, même si cela ne peut se faire immédiatement. Dans des cas extrêmes, tels qu’une catastrophe naturelle, les autorités locales peuvent intervenir et dans ce cas, il est essentiel de suivre leurs instructions. Nous nous efforcerons de rester en contact avec vous. Veuillez consulter régulièrement vos e-mails et votre téléphone. Vous recevrez par e-mail et SMS des informations actualisées envoyées aux coordonnées indiquées lors de la réservation de vos vacances.  </p>
    "@
    $q3_answer_e99efca2e06e4c6a850e91dbd57b9bdb_frfr_v2 = @"
    <p><strong>Mon vol aller est annulé</strong>
    </p>
    <p>Si votre vol aller est annulé avant votre départ, nous vous présentons nos excuses et ferons tout notre
    possible pour vous transférer sur un autre vol approprié. Si nous ne parvenons pas à trouver un autre vol,
    nous annulerons malheureusement votre séjour et procéderons immédiatement
    à son remboursement.
    </p>
    <p><strong>Mon vol retour est annulé</strong>
    </p>
    <p>Si votre vol retour est annulé pendant vos vacances, ne vous inquiétez pas.
    Nous ferons tout notre possible pour trouver d’autres solutions pendant
    votre séjour afin que vous puissiez rentrer chez vous. Nous disposons d’une équipe dédiée qui vous contactera
    de manière proactive en utilisant les coordonnées indiquées lors de
    la réservation de vos vacances. Pour connaître vos droits, consultez la page de nos <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z"><strong><span style="text-decoration: underline;">conditions générales de réservation</span></strong></a>&nbsp;ou
    consultez notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">centre d'aide</span></strong></a>&nbsp;pour en savoir plus.</p>
    <p>Pour que vous sachiez à quoi vous attendre, notre délai moyen pour effectuer ces
    arrangements est de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe
    recherche la meilleure alternative pour vous.</p>
    "@
    $q4_answer_13f47d25f15246a9b9249f73c622321d_dede_v2 = @"
    <p>Wir wissen, wie ärgerlich eine Planänderung sein kann. Wenn du länger bleiben musst, werden wir unser Bestes tun, schnellstmöglich eine Unterkunft für dich und deine Gruppe zu finden. Wir werden versuchen, dich in deinem derzeitigen Hotel unterzubringen, aber es kann vorkommen, dass du in ein anderes Hotel umziehen musst. </p>
    <p>In Extremfällen, wie beispielsweise bei Naturkatastrophen, kann es sein, dass die Behörden vor Ort die Kontrolle übernehmen. Es ist wichtig, deren Anweisungen zu befolgen. Wir bleiben über die Kontaktdaten, die du bei der Buchung angegeben hast, mit dir in Verbindung. Bitte überprüfe regelmässig deine E-Mails und SMS.&nbsp;</p>
    <p>Wenn du eine Unterkunft brauchst, werden wir dir die notwendigen Details zukommen lassen oder dich fragen, ob du selbst eine Unterkunft finden und buchen kannst, für die wir die <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">Kosten in angemessener Höhe </span></strong></a> erstatten.</p>
    <p>Unser deutschsprachiges Service Team ist rund um die Uhr erreichbar und darauf spezialisiert, Gäste in diesen Situationen zu unterstützen. Da dein Urlaubspaket weitere Leistungen wie Transfers oder Hotels umfasst, können Gäste von easyJet holidays die Self-Service-App der easyJet Airline nicht zur Buchung einer Übernachtungsmöglichkeit nutzen.  </p>
    <br />
    "@
    $q2_answer_5410f31bf68f4d34bb8d75ae0213a45d_dech_v2 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Wenn dein Flug versp&auml;tet ist oder verschoben wurde, meldet sich das easyJet holidays Team bei dir. M&ouml;glicherweise erh&auml;ltst du auch eine Nachricht, die vom Team der Airline an die bei der Buchung deiner Ferien angegebenen Kontaktdaten gesendet wird.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Im Normalfall brauchen wir f&uuml;r die Umbuchung nicht l&auml;nger als eine Stunde. Wir bitten daher um etwas Geduld, w&auml;hrend unser Team die n&auml;chstbeste Alternative f&uuml;r dich und deine Gruppe findet.</p>
    "@
    $q4_answer_13f47d25f15246a9b9249f73c622321d_en_v2 = @"
    <p>We understand how frustrating this can be if you find yourself needing to stay longer than planned, we&rsquo;ll do our best to secure somewhere for you to stay. While we aim to keep you at your current hotel, it's more than likely that you'll need to move to a different one. </p>
    <p>In extreme cases, such as a natural disaster, local authorities may take control, and it&rsquo;s essential to follow their instructions. We&rsquo;ll try to keep in touch with you on the contact details provided when you made your booking, so please check your emails and phone regularly.&nbsp;</p>
    <p>If you need somewhere to stay overnight, we&rsquo;ll provide you with the necessary details or let you know if you&rsquo;re able to find and book your own and claim back <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">reasonable expenses</span></strong></a>.</p>
    <p>Our UK-based 24/7 On Holiday Support team is dedicated to assisting&nbsp;customers in times like these. Because there are other components to your holiday package, such as transfers or hotels, easyJet holidays customers can't use the easyJet airline self-service app to book somewhere to stay overnight.  </p>
    <br />
    "@
    $q2_answer_5410f31bf68f4d34bb8d75ae0213a45d_dede_v2 = @"
    <p>Wenn dein Flug verspätet ist oder verschoben wurde, meldet sich das easyJet holidays Team bei dir. Möglicherweise erhältst du auch eine Nachricht, die vom Team der Airline an die bei der Buchung deines Urlaubs angegebenen Kontaktdaten gesendet wird.</p>
    <p>Im Normalfall brauchen wir für die Umbuchung nicht länger als eine Stunde. Wir bitten daher um etwas Geduld, während unser Team die nächstbeste Alternative für dich und deine Gruppe findet.</p>
    "@
    $q6_answer_0e6be4afd3774c9887c61f980c93e34f_dech_v1 = @"
    <span style="color: #000000; background-color: #ffffff;">Wenn eine Flug&auml;nderung oder andere Umst&auml;nde, die ausserhalb unserer Kontrolle liegen, dazu f&uuml;hren, dass deine Ferien nicht stattfinden k&ouml;nnen, stornieren wir die Buchung. Du hast die Wahl zwischen einer vollst&auml;ndigen R&uuml;ckerstattung, einer Gutschrift auf dein easyJet holidays Konto (gem&auml;ss unseren AGB f&uuml;r Guthaben) oder einer Ersatzreise von uns:</span>
    <ul style="color: #000000; background-color: #ffffff;">
        <li>die mindestens dem gleichen Standard und Preis entspricht, sofern wir dir eine solche anbieten k&ouml;nnen; oder</li>
        <li>die einer niedrigeren Preiskategorie <span style="color: #000000; background-color: #ffffff;">entspricht</span>, sofern wir dir eine solche anbieten k&ouml;nnen, wobei wir die Differenz zum urspr&uuml;nglichen Reisepreis zur&uuml;ckerstatten.</li>
    </ul>
    "@
    $q4_answer_13f47d25f15246a9b9249f73c622321d_frfr_v2 = @"
    <p>Nous comprenons à quel point cela peut être frustrant de devoir rester plus longtemps que prévu, mais nous ferons de notre mieux pour vous trouver un endroit où séjourner. Même si nous mettons tout en œuvre pour vous permettre de rester dans votre hôtel actuel, dans certaines situations il est possible que vous deviez en changer. </p>
    <p>Dans des cas extrêmes, tels qu’une catastrophe naturelle, les autorités locales peuvent prendre en charge la situation et il est indispensable que vous suiviez leurs instructions. Nous essaierons de vous contacter via les coordonnées fournies lors de votre réservation. Veuillez donc vérifier régulièrement vos e-mails et votre téléphone.&nbsp;</p>
    <p>Si vous avez besoin d’un hébergement pour la nuit, nous vous communiquerons les informations nécessaires, ou si vous en réservez un par vous-même à un prix raisonnable, nous vous indiquerons comment demander le <a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">remboursement</span></strong></a>.</p>
    <p>Notre équipe d’assistance vacances disponible 24 h/24, 7 j/7 est entièrement dédiée à aider nos clients dans ce type de situations. Comme d’autres éléments sont compris dans votre séjour, tels que les transferts ou l’hôtel, nos clients easyJet holidays ne peuvent pas utiliser l’application en libre-service de la compagnie aérienne easyJet pour réserver un hébergement pour la nuit.  </p>
    <br />
    "@
    $q5_answer_82ec431a56d4440aae36ba9add688ed5_frch_v1 = @"
    <p>Mettre fin &agrave; vos vacances et vous ramener chez vous plus t&ocirc;t que pr&eacute;vu est une solution de dernier recours. Nous sommes conscients de la d&eacute;ception que cela peut repr&eacute;senter. Si cela s&rsquo;av&egrave;re n&eacute;cessaire, nous vous contacterons et vous communiquerons les informations relatives &agrave; vos nouveaux horaires de transfert (le cas &eacute;ch&eacute;ant) et de vol, qui peuvent &ecirc;tre dans plusieurs jours, en fonction de notre calendrier de vol.
    </p>
    <p>
    En cas de perturbations importantes, nous pourrions vous demander de prendre vos propres dispositions pour le retour et &eacute;ventuellement de r&eacute;server votre propre h&eacute;bergement pour la nuit. Toutes les <a href="~/link.aspx?_id=1BF845E9475E44D492D902899964BE87&amp;_z=z"><span style="text-decoration: underline;"><strong>d&eacute;penses effectu&eacute;es dans les limites du raisonnable</strong></span></a>&nbsp;vous seront rembours&eacute;es.
    </p>
    <p>
    Sachez que nous vous aiderons &agrave; rentrer chez vous, m&ecirc;me si cela ne peut se faire imm&eacute;diatement. Dans des cas extr&ecirc;mes, tels qu&rsquo;une catastrophe naturelle, les autorit&eacute;s locales peuvent intervenir et dans ce cas, il est essentiel de suivre leurs instructions. Nous nous efforcerons de rester en contact avec vous. Veuillez consulter r&eacute;guli&egrave;rement vos e-mails et votre t&eacute;l&eacute;phone. Vous recevrez par e-mail et SMS des informations actualis&eacute;es envoy&eacute;es aux coordonn&eacute;es indiqu&eacute;es lors de la r&eacute;servation de vos vacances.</p>
    "@
    $q6_answer_0e6be4afd3774c9887c61f980c93e34f_dede_v1 = @"
    Wenn eine Flug&auml;nderung oder andere Umst&auml;nde, die au&szlig;erhalb unserer Kontrolle liegen, dazu f&uuml;hren, dass dein Urlaub nicht stattfinden kann, stornieren wir ihn. Du hast die Wahl zwischen einer vollst&auml;ndigen R&uuml;ckerstattung, einer Gutschrift auf deinen easyJet holidays Account (gem&auml;&szlig; unseren AGB f&uuml;r Guthaben) oder einem Ersatzurlaub von uns:
    <ul>
        <li>der mindestens dem gleichen Standard und Preis entspricht, sofern wir dir einen solchen anbieten k&ouml;nnen; oder </li>
        <li>der einer niedrigeren Preiskategorie entspricht, sofern wir dir einen solchen anbieten k&ouml;nnen, wobei wir die Differenz zum urspr&uuml;nglichen Reisepreis zur&uuml;ckerstatten.</li>
    </ul>
    "@
    $q2_answer_5410f31bf68f4d34bb8d75ae0213a45d_frch_v2 = @"
    <p>Si votre vol est retardé ou reprogrammé, l'équipe easyJet holidays vous contactera. Vous pouvez également recevoir un message de notre part envoyé par l'équipe de la compagnie aérienne  aux coordonnées fournies lors de la réservation de votre séjour. </p>
    <p>Pour que vous sachiez à quoi vous attendre, sachez que nous effectuons généralement ces  modifications dans un délai de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche  la meilleure alternative pour vous. </p>
    "@
    $q1_answer_5fb1505f4baf487fa0d92ba7b2869947_dede_v2 = @"
    <p>Wenn dein Flug ausf&auml;llt oder sich versp&auml;tet, werden wir alles tun, um dich
    auf dem Laufenden zu halten. Du kannst auch den easyJet <a href="https://www.easyjet.com/de/flug-plan"><strong><span style="text-decoration: underline;">Flight-Tracker</span></strong></a> auf unserer Website
    oder in unserer App aufrufen, um die aktuellsten Fluginformationen zu erhalten. </p>
    <p>
    Da wir uns um deine gesamte Urlaubsreise k&uuml;mmern, m&uuml;ssen wir m&ouml;glicherweise verschiedene Segmente
    deiner Reise anpassen, angefangen bei deinem Flug &uuml;ber dein Hotel bis hin zum Transfer
    (falls enthalten). W&auml;hrend wir mit unseren Partnern vor Ort arbeiten,
    erh&auml;ltst du m&ouml;glicherweise mehrere Updates. Das ist v&ouml;llig normal und hilft uns,
    dich so schnell wie m&ouml;glich &uuml;ber den aktuellen Stand zu informieren. Bitte schau regelm&auml;&szlig;ig in deinen E-Mail-Eingang und
    achte auch auf SMS von uns. Updates werden an die&nbsp;Kontaktdaten gesendet, die du bei der Buchung deines
    Urlaubs angegeben hast. </p>
    <p>
    Wenn die Flug&auml;nderung weitreichend ist oder durch externe Faktoren wie Wetter,
    Flugsicherung oder Streik verursacht wird, findest du aktuelle Informationen und Ratschl&auml;ge auf unserer Seite <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;">Reiseinformationen</span></strong></a>.  </p>
    "@
    $q1_answer_5fb1505f4baf487fa0d92ba7b2869947_en_v2 = @"
    <p>If your flight is significantly disrupted or delayed by more than 3 hours, we&rsquo;ll always do our best to get in touch
    and share updates. You can also check the easyJet <a href="https://www.easyjet.com/en/flight-tracker"><strong><span style="text-decoration: underline;">flight tracker</span></strong></a> on our website
    or app for the most up-to-date flight information. </p>
    <p>
    As we look after your entire holiday, we may need to adjust different parts of
    your trip &mdash; starting with your flight, then your hotel, and finally your transfers
    (if included). You might receive several updates as we work through each stage
    with our trusted partners. That&rsquo;s completely normal and helps us keep you
    informed as quickly as possible. Keep checking your emails for updates and
    look out for texts from us to the contact details provided when you booked your
    holiday. </p>
    <p>
    If the disruption is widespread or caused by external factors such as weather,
    air traffic control, or industrial action, you can also visit our latest <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;">travel information</span></strong></a>&nbsp;page for broader travel updates and advice.  </p>
    "@
    $q2_answer_5410f31bf68f4d34bb8d75ae0213a45d_en_v2 = @"
    <p>If your flight is delayed by more than 3 hours or re-scheduled, you&rsquo;ll be contacted by the easyJet holidays team. You may also receive a message from us sent by the airline team  to the details provided when you booked your holiday.</p>
    <p>Just so you know what to expect, our average speed in making these  arrangements is within 60 minutes so please bear with us while our team look  at the next best alternative for you.</p>
    "@
    $q3_answer_e99efca2e06e4c6a850e91dbd57b9bdb_en_v2 = @"
    <p><strong>My outbound flight is cancelled</strong>
    </p>
    <p>If your outbound flight is cancelled before you go, we&rsquo;re sorry and we&rsquo;ll do our
    very best to move you on to a suitable alternative flight. If we can&rsquo;t find one,
    then unfortunately we&rsquo;ll cancel your holiday and press the button on a refund
    straight away.
    </p>
    <p><strong>My return flight is cancelled</strong>
    </p>
    <p>If your return flight is cancelled while you're on holiday, please try not to worry.
    We&rsquo;ll do everything possible to help with alternative arrangements whilst you&rsquo;re
    in resort to get you home. And we have a dedicated team that&rsquo;ll proactively
    reach out to you using the contact details provided when you booked your
    holiday. For information on your rights, check our <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z"><strong><span style="text-decoration: underline;">booking conditions</span></strong></a>&nbsp;page or
    visit our <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">help centre</span></strong></a>&nbsp;to find out more.</p>
    <p>Just so you know what to expect, our average speed in making these
    arrangements is within 60 minutes so please bear with us while our team look
    at the next best alternative for you. And because there are other components to your holiday package, such as transfers or hotels, easyJet holidays customers can't use the easyJet airline self-service app to book somewhere to stay overnight.</p>
    "@
    $q6_answer_0e6be4afd3774c9887c61f980c93e34f_en_v1 = @"
    If travel disruption or another situation beyond our control means we can&rsquo;t fulfil your holiday, we&rsquo;ll cancel it and you can either have a full refund, choose to receive account credit (subject to our Credit on Account Terms and Conditions), or accept a replacement holiday from us of:
    <ul>
        <li>at least equivalent standard and price, if we&rsquo;re able to offer you one or; </li>
        <li>a lower quality holiday, if we&rsquo;re able to offer you one and then we&rsquo;ll refund you any difference in price between your original holiday purchased and the new one.</li>
    </ul>
    "@
    $q1_answer_5fb1505f4baf487fa0d92ba7b2869947_frfr_v2 = @"
    <p>Si votre vol subit des perturbations ou est retard&eacute;, nous ferons toujours de notre mieux pour vous contacter
    et vous communiquer des informations actualis&eacute;es. Vous pouvez aussi consulter le <a href="https://www.easyjet.com/fr/suivi-de-vol-en-direct"><strong><span style="text-decoration: underline;">flight tracker</span></strong></a> easyJet sur notre site Internet
    ou notre application pour obtenir les toutes derni&egrave;res informations concernant votre vol. </p>
    <p>
    Comme nous nous occupons de l&rsquo;ensemble de vos vacances, nous pourrions &ecirc;tre amen&eacute;s &agrave; modifier diff&eacute;rents &eacute;l&eacute;ments de
    votre voyage, &agrave; commencer par votre vol, puis votre h&ocirc;tel et enfin vos transferts
    (le cas &eacute;ch&eacute;ant). Vous recevrez sans doute &agrave; plusieurs reprises des informations actualis&eacute;es au fur et &agrave; mesure que nous progresserons
    avec nos partenaires de confiance. Cela est normal et nous permet de vous tenir
    inform&eacute;s aussi vite que possible. Consultez r&eacute;guli&egrave;rement vos e-mails pour toute mise &agrave; jour, ainsi que
    les SMS que nous vous enverrons aux coordonn&eacute;es indiqu&eacute;es lors de
    la r&eacute;servation de vos vacances. </p>
    <p>
    Si les perturbations sont g&eacute;n&eacute;ralis&eacute;es ou ont &eacute;t&eacute; caus&eacute;es par des facteurs externes, tels que les conditions m&eacute;t&eacute;orologiques,
    le contr&ocirc;le du trafic a&eacute;rien ou une gr&egrave;ve, vous pouvez &eacute;galement vous rendre sur notre page indiquant les derni&egrave;res <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z"><strong><span style="text-decoration: underline;">informations sur les voyages</span></strong></a>&nbsp;pour trouver plus de mises &agrave; jour ou de conseils.  </p>
    "@
    $q3_answer_e99efca2e06e4c6a850e91dbd57b9bdb_dech_v2 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;"><span><strong>Mein Hinflug wurde storniert</strong></span></p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn dein Hinflug vor deiner Abreise storniert wird, bedauern wir dies sehr und werden unser Bestes tun, einen geeigneten Alternativflug f&uuml;r dich und deine Gruppe zu organisieren. Wenn es keine passende Alternative gibt, werden wir deine Ferien leider stornieren m&uuml;ssen und eine sofortige R&uuml;ckerstattung veranlassen.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;"><span><strong>Mein R&uuml;ckflug wurde storniert</strong></span></p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn dein R&uuml;ckflug w&auml;hrend deiner Ferien storniert wird, sollte das kein Grund zur Beunruhigung sein. Wir werden alles tun, um w&auml;hrend deines Aufenthalts eine alternative L&ouml;sung f&uuml;r deine Heimreise zu finden. Unser engagiertes Team wird sich unter den bei der Buchung deiner Ferien angegebenen Kontaktdaten proaktiv mit dir in Verbindung setzen. Informationen zu deinen Rechten findest du in unseren&nbsp;<a tabindex="0" href="https://www.easyjet.com/ch-de/ferien/information/buchungsbedingungen" data-path="/information/booking-conditions" style="color: #ff6600; background-color: initial;"><span>Buchungsbedingungen</span></a>&nbsp;oder in unseren&nbsp;<a tabindex="0" href="https://www.easyjet.com/ch-de/ferien/hilfe" data-path="/hilfe" style="color: #ff6600; background-color: initial;"><span>FAQs</span></a>.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Im Durchschnitt dauert die Umbuchung etwa eine Stunde. Wir bitten dich daher um etwas Geduld, w&auml;hrend unser Team die n&auml;chstbeste Alternative f&uuml;r dich findet.</p>
    "@
    $q5_answer_82ec431a56d4440aae36ba9add688ed5_en_v1 = @"
    <p>Having to end your holiday and bring you home early is a last resort, and we recognise how disappointing this can be. If a situation occurs where this becomes necessary, we&rsquo;ll contact you and provide details of your new transfer times (if applicable) and flight times, which may not be for a few days depending on our flight schedule. </p>
    <p>At times of significant travel disruption, we may invite you to make your own return travel arrangements, and possibly to find and book your own overnight hotel. You&rsquo;ll be reimbursed for all&nbsp;<a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">reasonable expenses</span></strong></a> you incur.</p>
    <p>Please know that we&rsquo;ll get you home, even if it cannot happen immediately. In extreme cases, such as a natural disaster, local authorities may take control over a situation and if so, you should follow their instructions. We&rsquo;ll try and keep in touch with you, and you should check your emails and phone regularly. You&rsquo;ll get updates by email and text message to the contact details provided when you booked your holiday.  </p>
    "@
    $q1_answer_5fb1505f4baf487fa0d92ba7b2869947_frch_v2 = @"
    <p>Si votre vol subit des perturbations ou est retard&eacute;, nous ferons toujours de notre mieux pour vous contacter et vous communiquer des informations actualis&eacute;es. Vous pouvez aussi consulter le <a href="https://www.easyjet.com/ch-fr/suivi-de-vol-en-direct"><span style="text-decoration: underline;"><strong>flight tracker</strong></span></a> easyJet sur notre site Internet ou notre application pour obtenir les toutes derni&egrave;res informations concernant votre vol.
    </p>
    <p>Comme nous nous occupons de l&rsquo;ensemble de vos vacances, nous pourrions &ecirc;tre amen&eacute;s &agrave; modifier diff&eacute;rents &eacute;l&eacute;ments de votre voyage, &agrave; commencer par votre vol, puis votre h&ocirc;tel et enfin vos transferts (le cas &eacute;ch&eacute;ant). Vous recevrez sans doute &agrave; plusieurs reprises des informations actualis&eacute;es au fur et &agrave; mesure que nous progresserons avec nos partenaires de confiance. Cela est normal et nous permet de vous tenir inform&eacute;s aussi vite que possible. Consultez r&eacute;guli&egrave;rement vos e-mails pour toute mise &agrave; jour, ainsi que les SMS que nous vous enverrons aux coordonn&eacute;es indiqu&eacute;es lors de la r&eacute;servation de vos vacances.
    </p>
    <p>Si les perturbations sont g&eacute;n&eacute;ralis&eacute;es ou ont &eacute;t&eacute; caus&eacute;es par des facteurs externes, tels que les conditions m&eacute;t&eacute;orologiques, le contr&ocirc;le du trafic a&eacute;rien ou une gr&egrave;ve, vous pouvez &eacute;galement vous rendre sur notre page indiquant les derni&egrave;res <a href="https://www.easyjet.com/ch-fr/vacances/informations/travel-information"><strong><span style="text-decoration: underline;">informations sur les voyages</span></strong></a> pour trouver plus de mises &agrave; jour ou de conseils.</p>
    "@
    $q5_answer_82ec431a56d4440aae36ba9add688ed5_dede_v1 = @"
    <p>Deinen Urlaub vorzeitig zu beenden und dich früher als ursprünglich geplant nach Hause zu bringen, ist der letzte Ausweg und wir sind uns bewusst, wie enttäuschend das sein kann. Sollte eine Situation eintreten, in der dies notwendig wird, werden wir dich kontaktieren und dir die neuen Flugzeiten mitteilen. Deine neuen Flüge finden je nach Flugplan möglicherweise erst in einigen Tagen statt. Wir teilen dir auch die neue Abholzeit für deinen Transfer mit (falls zutreffend). </p>
    <p>Bei erheblichen Reisestörungen bitten wir dich möglicherweise, deine Rückreise selbst zu organisieren und dir gegebenenfalls selbst eine Übernachtungsmöglichkeit in einem Hotel zu suchen und zu buchen. Wir werden dir sämtliche&nbsp;<a href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section"><strong><span style="text-decoration: underline;">angemessenen Kosten</span></strong></a>, die dir dadurch entstehen, erstatten.</p>
    <p>Du kannst dich darauf verlassen, dass wir dich nach Hause bringen, auch wenn dies vielleicht nicht sofort möglich ist. In Extremfällen, wie beispielsweise bei einer Naturkatastrophe, können die örtlichen Behörden die Kontrolle übernehmen. In solch einem Fall solltest du ihren Anweisungen folgen. Wir werden versuchen, mit dir in Kontakt zu bleiben, überprüfe daher bitte regelmässig deine E-Mails und SMS. Du erhältst Updates per E-Mail und SMS an die Kontaktdaten, die du bei der Buchung deines Urlaubs angegeben hast.  </p>
    "@
    $q4_answer_13f47d25f15246a9b9249f73c622321d_frch_v2 = @"
    <p>Nous comprenons &agrave; quel point cela peut &ecirc;tre frustrant de devoir rester plus longtemps que pr&eacute;vu, mais nous ferons de notre mieux pour vous trouver un endroit o&ugrave; s&eacute;journer. M&ecirc;me si nous mettons tout en &oelig;uvre pour vous permettre de rester dans votre h&ocirc;tel actuel, dans certaines situations il est possible que vous deviez en changer.
    </p>
    <p>Dans des cas extr&ecirc;mes, tels qu&rsquo;une catastrophe naturelle, les autorit&eacute;s locales peuvent prendre en charge la situation et il est indispensable que vous suiviez leurs instructions. Nous essaierons de vous contacter via les coordonn&eacute;es fournies lors de votre r&eacute;servation. Veuillez donc v&eacute;rifier r&eacute;guli&egrave;rement vos e-mails et votre t&eacute;l&eacute;phone.
    </p>
    <p>Si vous avez besoin d&rsquo;un h&eacute;bergement pour la nuit, nous vous communiquerons les informations n&eacute;cessaires, ou si vous en r&eacute;servez un par vous-m&ecirc;me &agrave; un prix raisonnable, nous vous indiquerons comment demander le <a href="~/link.aspx?_id=1BF845E9475E44D492D902899964BE87&amp;_z=z"><strong><span style="text-decoration: underline;">remboursement</span></strong></a>.
    </p>
    <p>Notre &eacute;quipe d&rsquo;assistance vacances disponible 24 h/24, 7 j/7 est enti&egrave;rement d&eacute;di&eacute;e &agrave; aider nos clients dans ce type de situations. Comme d&rsquo;autres &eacute;l&eacute;ments sont compris dans votre s&eacute;jour, tels que les transferts ou l&rsquo;h&ocirc;tel, nos clients easyJet holidays ne peuvent pas utiliser l&rsquo;application en libre-service de la compagnie a&eacute;rienne easyJet pour r&eacute;server un h&eacute;bergement pour la nuit.</p>
    "@
    $q6_question_0e6be4afd3774c9887c61f980c93e34f_dech_v1 = @"
    Meine Ferien können aufgrund weitreichender Störungen nicht stattfinden.
    "@
    $q4_answer_13f47d25f15246a9b9249f73c622321d_dech_v2 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Wir wissen, wie &auml;rgerlich eine Plan&auml;nderung sein kann. Wenn du l&auml;nger bleiben musst, werden wir unser Bestes tun, schnellstm&ouml;glich eine Unterkunft f&uuml;r dich und deine Gruppe zu finden. Wir werden versuchen, dich in deinem derzeitigen Hotel unterzubringen, aber es kann vorkommen, dass du in ein anderes Hotel umziehen musst.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">In Extremf&auml;llen, wie beispielsweise bei Naturkatastrophen, kann es sein, dass die Beh&ouml;rden vor Ort die Kontrolle &uuml;bernehmen. Es ist wichtig, deren Anweisungen zu befolgen. Wir bleiben &uuml;ber die Kontaktdaten, die du bei der Buchung angegeben hast, mit dir in Verbindung. Bitte &uuml;berpr&uuml;fe regelm&auml;ssig deine E-Mails und SMS.&nbsp;</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn du eine Unterkunft brauchst, werden wir dir die notwendigen Details zukommen lassen oder dich fragen, ob du selbst eine Unterkunft finden und buchen kannst, f&uuml;r die wir die&nbsp;<a tabindex="0" href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section" data-path="/information/flugunterbrechung#compensation-forms-section" style="color: #ff6600; background-color: initial;"><span>Kosten in angemessener H&ouml;he&nbsp;</span></a>erstatten.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Unser deutschsprechendes Service Team ist rund um die Uhr erreichbar und darauf spezialisiert, G&auml;ste in diesen Situationen zu unterst&uuml;tzen. Da dein Pauschalpaket weitere Leistungen wie Transfers oder Hotels umfasst, k&ouml;nnen G&auml;ste von easyJet holidays die Self-Service-App der easyJet Airline nicht zur Buchung einer &Uuml;bernachtungsm&ouml;glichkeit nutzen.</p>
    "@
    $q3_answer_e99efca2e06e4c6a850e91dbd57b9bdb_dede_v2 = @"
    <p><strong>Mein Hinflug wurde storniert</strong>
    </p>
    <p>Wenn dein Hinflug vor deiner Abreise storniert wird, bedauern wir dies sehr und werden unser Bestes tun,
    einen geeigneten Alternativflug f&uuml;r dich und deine Gruppe zu organisieren. Wenn es keine passende Alternative gibt,
    werden wir deinen Urlaub leider stornieren m&uuml;ssen und eine sofortige R&uuml;ckerstattung
    veranlassen.
    </p>
    <p><strong>Mein R&uuml;ckflug wurde storniert</strong>
    </p>
    <p>Wenn dein R&uuml;ckflug w&auml;hrend deines Urlaubs storniert wird, sollte das kein Grund zur Beunruhigung sein.
    Wir werden alles tun, um w&auml;hrend deines Aufenthalts eine alternative L&ouml;sung
    f&uuml;r deine Heimreise zu finden. Unser engagiertes Team wird sich
    unter den bei der Buchung deines Urlaubs angegebenen Kontaktdaten proaktiv mit dir in Verbindung setzen. Informationen zu deinen Rechten findest du in unseren <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z"><strong><span style="text-decoration: underline;">Buchungsbedingungen</span></strong></a> oder
    in unseren <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">FAQs</span></strong></a>.</p>
    <p>Im Durchschnitt dauert die Umbuchung
    etwa eine Stunde. Wir bitten dich daher um etwas Geduld, w&auml;hrend unser Team
    die n&auml;chstbeste Alternative f&uuml;r dich findet.</p>
    "@
    $q6_answer_0e6be4afd3774c9887c61f980c93e34f_frfr_v1 = @"
    Si des perturbations de voyage ou une autre situation indépendante de notre volonté nous empêchent d’organiser votre séjour, nous l’annulerons et vous pourrez soit obtenir un remboursement intégral, soit choisir de recevoir un avoir sur votre compte (conformément à nos conditions générales relatives aux avoirs), soit accepter de notre part un nouveau séjour :
    <ul>
        <li>d’un standing et d’un prix équivalents, si nous sommes en mesure de vous en proposer un ou ; </li>
        <li>d’un standing inférieur, si nous sommes en mesure de vous en proposer un, et nous vous rembourserons alors toute différence de prix entre le séjour initialement réservé et le nouveau.</li>
    </ul>
    "@
    $q3_answer_e99efca2e06e4c6a850e91dbd57b9bdb_frch_v2 = @"
    <p><span><strong>Mon vol aller est annul&eacute;</strong></span></p>
    <p>Si votre vol aller est annul&eacute; avant votre d&eacute;part, nous vous pr&eacute;sentons nos excuses et ferons tout notre possible pour vous transf&eacute;rer sur un autre vol appropri&eacute;. Si nous ne parvenons pas &agrave; trouver un autre vol, nous annulerons malheureusement votre s&eacute;jour et proc&eacute;derons imm&eacute;diatement &agrave; son remboursement.</p>
    <p><span><strong>Mon vol retour est annul&eacute;</strong></span></p>
    <p>Si votre vol retour est annul&eacute; pendant vos vacances, ne vous inqui&eacute;tez pas. Nous ferons tout notre possible pour trouver d&rsquo;autres solutions pendant votre s&eacute;jour afin que vous puissiez rentrer chez vous. Nous disposons d&rsquo;une &eacute;quipe d&eacute;di&eacute;e qui vous contactera de mani&egrave;re proactive en utilisant les coordonn&eacute;es indiqu&eacute;es lors de la r&eacute;servation de vos vacances. Pour conna&icirc;tre vos droits, consultez la page de nos&nbsp;<a href="~/link.aspx?_id=912E490A633C4ECA8942727A28DF20DD&amp;_z=z"><strong><span style="text-decoration: underline;">conditions de r&eacute;servation</span></strong></a><span>&nbsp;ou
    visitez notre </span><a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">centre d'aide</span></strong></a><span>&nbsp;pour en savoir plus.</span></p>
    <p style="margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Pour que vous sachiez &agrave; quoi vous attendre, notre d&eacute;lai moyen pour effectuer ces arrangements est de 60&nbsp;minutes. Nous vous remercions donc de votre patience pendant que notre &eacute;quipe recherche la meilleure alternative pour vous.</p>
    "@
    $q5_answer_82ec431a56d4440aae36ba9add688ed5_dech_v1 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Deine Ferien vorzeitig zu beenden und dich fr&uuml;her als urspr&uuml;nglich geplant nach Hause zu bringen, ist der letzte Ausweg und wir sind uns bewusst, wie entt&auml;uschend das sein kann. Sollte eine Situation eintreten, in der dies notwendig wird, werden wir dich kontaktieren und dir die neuen Flugzeiten mitteilen. Deine neuen Fl&uuml;ge finden je nach Flugplan m&ouml;glicherweise erst in einigen Tagen statt. Wir teilen dir auch die neue Abholzeit f&uuml;r deinen Transfer mit (falls zutreffend).</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Bei erheblichen Reisest&ouml;rungen bitten wir dich m&ouml;glicherweise, deine R&uuml;ckreise selbst zu organisieren und dir gegebenenfalls selbst eine &Uuml;bernachtungsm&ouml;glichkeit in einem Hotel zu suchen und zu buchen. Wir werden dir s&auml;mtliche&nbsp;<a tabindex="0" href="~/link.aspx?_id=562E0B52E9704A8DBE72017B204B3BF5&amp;_z=z#compensation-forms-section" data-path="/information/flugunterbrechung#compensation-forms-section" style="color: #ff6600; background-color: initial;"><span>angemessenen Kosten</span></a>, die dir dadurch entstehen, erstatten.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Du kannst dich darauf verlassen, dass wir dich nach Hause bringen, auch wenn dies vielleicht nicht sofort m&ouml;glich ist. In Extremf&auml;llen, wie beispielsweise bei einer Naturkatastrophe, k&ouml;nnen die &ouml;rtlichen Beh&ouml;rden die Kontrolle &uuml;bernehmen. In solch einem Fall solltest du ihren Anweisungen folgen. Wir werden versuchen, mit dir in Kontakt zu bleiben, &uuml;berpr&uuml;fe daher bitte regelm&auml;ssig deine E-Mails und SMS. Du erh&auml;ltst Updates per E-Mail und SMS an die Kontaktdaten, die du bei der Buchung deiner Ferien angegeben hast.</p>
    "@
    $q6_answer_0e6be4afd3774c9887c61f980c93e34f_frch_v1 = @"
    <span>Si des perturbations de voyage ou une autre situation ind&eacute;pendante de notre volont&eacute; nous emp&ecirc;chent d&rsquo;organiser votre s&eacute;jour, nous l&rsquo;annulerons et vous pourrez soit obtenir un remboursement int&eacute;gral, soit choisir de recevoir un avoir sur votre compte (conform&eacute;ment &agrave; nos conditions g&eacute;n&eacute;rales relatives aux avoirs), soit accepter de notre part un nouveau s&eacute;jour&nbsp;:</span>
    <ul>
        <li>d&rsquo;un standing et d&rsquo;un prix &eacute;quivalents, si nous sommes en mesure de vous en proposer un ou&nbsp;;</li>
        <li>d&rsquo;un standing inf&eacute;rieur, si nous sommes en mesure de vous en proposer un, et nous vous rembourserons alors toute diff&eacute;rence de prix entre le s&eacute;jour initialement r&eacute;serv&eacute; et le nouveau.</li>
    </ul>
    "@
    $q1_answer_5fb1505f4baf487fa0d92ba7b2869947_dech_v2 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Wenn dein Flug ausf&auml;llt oder sich versp&auml;tet, werden wir alles tun, um dich auf dem Laufenden zu halten. Du kannst auch den easyJet&nbsp;<a tabindex="0" target="_blank" href="https://www.easyjet.com/de/flug-plan" rel="noopener noreferrer" style="color: #ff6600; background-color: initial;"><span>Flight-Tracker</span></a>&nbsp;auf unserer Website oder in unserer App aufrufen, um die aktuellsten Fluginformationen zu erhalten.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Da wir uns um deine gesamte Ferienreise k&uuml;mmern, m&uuml;ssen wir m&ouml;glicherweise verschiedene Segmente deiner Reise anpassen, angefangen bei deinem Flug &uuml;ber dein Hotel bis hin zum Transfer (falls enthalten). W&auml;hrend wir mit unseren Partnern vor Ort arbeiten, erh&auml;ltst du m&ouml;glicherweise mehrere Updates. Das ist v&ouml;llig normal und hilft uns, dich so schnell wie m&ouml;glich &uuml;ber den aktuellen Stand zu informieren. Bitte schau regelm&auml;ssig in deinen E-Mail-Eingang und achte auch auf SMS von uns. Updates werden an die&nbsp;Kontaktdaten gesendet, die du bei der Buchung deiner Ferien angegeben hast.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn die Flugunterbrechung weitreichend ist oder durch externe Faktoren wie Wetter, Flugsicherung oder Streik verursacht wird, findest du aktuelle Informationen und Ratschl&auml;ge auf unserer Seite&nbsp;<a tabindex="0" href="https://www.easyjet.com/ch-de/ferien/information/travel-information" data-path="/information/travel-information" style="color: #ff6600; background-color: initial;"><span>Reiseinformationen</span></a>.</p>
    "@
    $q2_answer_5410f31bf68f4d34bb8d75ae0213a45d_frfr_v2 = @"
    <p>Si votre vol est retardé ou reprogrammé, l’équipe easyJet holidays vous contactera. Vous pouvez également recevoir un message de notre part, envoyé par l’équipe de la compagnie aérienne, aux coordonnées que vous avez fournies lors de la réservation de vos vacances.</p>
    <p>Pour que vous sachiez à quoi vous attendre, notre délai moyen pour effectuer ces arrangements est de 60 minutes. Nous vous remercions donc de votre patience pendant que notre équipe recherche la meilleure alternative pour vous.</p>
    "@
