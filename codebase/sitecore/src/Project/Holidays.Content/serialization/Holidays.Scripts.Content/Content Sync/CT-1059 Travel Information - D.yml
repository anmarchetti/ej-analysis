    $holidayshomerootinfodisruptionpagecomponentsstillhavequestionsflightplushotelq3_Id = "{53493E50-C314-49C1-8B8D-0560A6F105F5}"
    $q4_question_481c3a2d7a704d0e81f36f81746e875f_frfr_v1 = @"
    Quelles dépenses puis-je me faire rembourser par mon assurance voyage ?
    "@
    $q1_question_4e53d7c7e570419aaacd4c97055e9a63_frch_v1 = @"
    Comment trouver mes nouvelles informations de vol?
    "@
    $q2_answer_a0700f2dc7154bda94c2087c7e9a08e3_frch_v1 = @"
    <p>Nous essayons g&eacute;n&eacute;ralement d&rsquo;organiser un transport pour vous emmener &agrave; votre nouvel a&eacute;roport de d&eacute;part. Si votre vol est report&eacute; au lendemain, nous faisons &eacute;galement de notre mieux pour vous trouver un endroit o&ugrave; passer la nuit.</p>
    <p>Selon les circonstances, les horaires et la disponibilit&eacute;, votre h&ocirc;tel pour la nuit peut &ecirc;tre situ&eacute; pr&egrave;s de votre a&eacute;roport de d&eacute;part initial ou plus pr&egrave;s du nouveau.</p>
    <p>Si nous vous demandons d&rsquo;effectuer vos propres r&eacute;servations, veuillez conserver tous les re&ccedil;us relatifs aux d&eacute;penses effectu&eacute;es dans les limites du raisonnable, afin de pouvoir en demander le remboursement plus tard.</p>
    <p>&Agrave; moins que nous ne vous ayons contact&eacute; pour vous informer du contraire en utilisant les coordonn&eacute;es fournies lors de la r&eacute;servation de vos vacances, si votre vol retour atterrit &agrave; un autre a&eacute;roport, vous devrez rentrer chez vous par vos propres moyens et conserver vos re&ccedil;us afin de pouvoir demander le remboursement de vos frais de transport dans les limites du raisonnable.</p>
    "@
    $q4_question_481c3a2d7a704d0e81f36f81746e875f_en_v1 = @"
    What expenses should I claim back from my travel insurance?
    "@
    $q3_answer_53493e50c31449c18b8d0560a6f105f5_en_v2 = @"
    <p>If your original return flight has been cancelled due to disruption, we&rsquo;ll book you on to an alternative easyJet flight back to the UK and do our best to minimise any inconvenience. </p>
    <p>If the new flight we confirm isn&rsquo;t suitable, and you&rsquo;ve found reasonably priced alternative transport at least a day earlier than the flight we&rsquo;ve rebooked you on, you may book that transport and claim back reasonable expenses. </p>
    <p>To submit a successful expense claim, please makre sure to let us know that you&rsquo;ve booked an alternative option, by <a rel="noopener noreferrer" href="https://www.easyjet.com/en?utm_id=confirmation" target="_blank">logging into your booking</a> to initiate a chat with us.&nbsp;</p>
    "@
    $q1_question_4e53d7c7e570419aaacd4c97055e9a63_en_v1 = @"
    How do I find my new flight details?
    "@
    $q3_answer_53493e50c31449c18b8d0560a6f105f5_dech_v2 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Wenn dein urspr&uuml;nglicher Heimflug aufgrund von St&ouml;rungen&nbsp;storniert wurde, buchen wir dich auf einen alternativen R&uuml;ckflug mit easyJet um und setzen alles daran, die Unannehmlichkeiten aufs Minimum zu beschr&auml;nken.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn dir der von uns best&auml;tigte neue Flug nicht zusagt und du mindestens einen Tag vor dem von uns umgebuchten Flug eine alternative Bef&ouml;rderungsm&ouml;glichkeit gefunden hast, kannst du diese buchen und eine Erstattung der Kosten in angemessener H&ouml;he beantragen.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Um deine Kosten erfolgreich geltend zu machen, musst du uns mitteilen, dass du einen alternativen Tansport gebucht hast, beispielsweise indem du&nbsp;<a tabindex="0" href="~/link.aspx?_id=CE1EB23F27E2418B97906F508A4FC91F&amp;_z=z" data-path="/hilfe/hilfe-im-urlaub" style="color: #ff6600; background-color: initial;"><span>einen Chat mit uns startest oder unser Support-Team anrufst</span></a>. Das erm&ouml;glicht es uns, Sitzpl&auml;tze f&uuml;r andere Reisende verf&uuml;gbar zu machen, sodass alle G&auml;ste so bald wie m&ouml;glich nach Hause kommen k&ouml;nnen.</p>
    "@
    $q4_question_481c3a2d7a704d0e81f36f81746e875f_frch_v1 = @"
    Quelles dépenses puis-je me faire rembourser par mon assurance voyage?
    "@
    $q1_question_4e53d7c7e570419aaacd4c97055e9a63_dede_v1 = @"
    Wie finde ich meine neuen Fluginformationen?
    "@
    $q4_answer_481c3a2d7a704d0e81f36f81746e875f_en_v1 = @"
    <p>If you&rsquo;ve incurred additional expenses, we strongly recommend contacting your travel insurance provider, especially for costs such as: </p>
    <ul>
        <li>Missed days at work </li>
        <li>Missed appointments </li>
        <li>Medical bills </li>
        <li>Pet care
        </li>
    </ul>
    <p>Your insurer may be able to cover expenses that easyJet holidays can&rsquo;t, such as those beyond your package or regulatory entitlements.  </p>
    "@
    $q1_answer_4e53d7c7e570419aaacd4c97055e9a63_en_v1 = @"
    <p>We&rsquo;ll proactively contact you by email, and sometimes text, to the contact details provided when you booked your holiday, if there are any changes to your flight, so there&rsquo;s no need to call us for this information.<br />
    <br />
    You can also view the latest live details of your new flight by logging in to <a href="https://www.easyjet.com/"><strong><span style="text-decoration: underline;">easyJet.com</span></strong></a> and checking your booking. You&rsquo;ll need your flight details and flight reference number beginning with &lsquo;K&rsquo;, which you can find in the emails we&rsquo;ve previously sent. </p>
    "@
    $q3_answer_53493e50c31449c18b8d0560a6f105f5_frfr_v2 = @"
    <p>Si votre vol retour a été annulé en raison de perturbations, nous vous réserverons un autre vol easyJet pour rentrer chez vous et ferons tout notre possible pour minimiser les désagréments. </p>
    <p>Si le nouveau vol que nous confirmons ne vous convient pas et que vous avez trouvé un autre moyen de transport au moins un jour avant le vol que nous avons réservé pour vous, vous pouvez réserver ce moyen de transport et demander le remboursement des frais dans les limites du raisonnable. </p>
    <p>Pour soumettre une demande de remboursement des frais, veillez à nous informer que vous avez réservé une autre option, par exemple en <a href="~/link.aspx?_id=CE1EB23F27E2418B97906F508A4FC91F&amp;_z=z"><span style="text-decoration: underline;"><strong>lançant un chat avec nous ou en appelant notre équipe</strong></span></a>. Cela nous permet également de libérer des sièges afin que d’autres passagers puissent rentrer chez eux plus tôt.  </p>
    "@
    $q3_question_53493e50c31449c18b8d0560a6f105f5_frch_v2 = @"
    Puis-je réserver moi-même mon vol retour?
    "@
    $q1_answer_4e53d7c7e570419aaacd4c97055e9a63_frfr_v1 = @"
    <p>En cas de modification de votre vol, nous vous contacterons  de mani&egrave;re proactive par e-mail, et parfois par SMS, aux coordonn&eacute;es fournies lors de la r&eacute;servation de vos vacances. Vous n&rsquo;aurez donc pas besoin de nous appeler pour obtenir ces informations.<br />
    <br />
    Vous pouvez &eacute;galement consulter les derni&egrave;res informations en direct concernant votre nouveau vol en vous connectant &agrave; <span style="text-decoration: underline;"><strong><a href="https://www.easyjet.com/fr">easyJet.com/fr</a></strong></span> e<a href="https://www.easyjet.com/"><strong><span style="text-decoration: underline;"><strong><span style="text-decoration: underline;"></span></strong></span></strong></a>t en consultant votre r&eacute;servation. Vous aurez besoin de vos informations de vol et du num&eacute;ro de r&eacute;f&eacute;rence du vol commen&ccedil;ant par un &laquo;&nbsp;K&nbsp;&raquo;, que vous trouverez dans les e-mails que nous vous avons pr&eacute;c&eacute;demment envoy&eacute;s. </p>
    "@
    $q3_question_53493e50c31449c18b8d0560a6f105f5_en_v2 = @"
    Can I book my own flight home?
    "@
    $q4_question_481c3a2d7a704d0e81f36f81746e875f_dede_v1 = @"
    Welche Kosten kann ich von meiner Reiseversicherung zurückfordern?
    "@
    $q3_question_53493e50c31449c18b8d0560a6f105f5_dech_v2 = @"
    Kann ich meinen eigenen Rückflug buchen?
    "@
    $q4_answer_481c3a2d7a704d0e81f36f81746e875f_dede_v1 = @"
    <p>Wenn dir zusätzliche Kosten entstanden sind, empfehlen wir dir, dich unbedingt an deinen Reiseversicherungsanbieter zu wenden, insbesondere bei Kosten wie: </p>
    <ul>
        <li>Versäumte Arbeitstage </li>
        <li>Versäumte Termine </li>
        <li>Arztrechnungen </li>
        <li>Haustierbetreuung
        </li>
    </ul>
    <p>Dein Versicherer kann möglicherweise Kosten übernehmen, die easyJet holidays nicht erstattet, beispielsweise Kosten, die über dein Pauschalangebot oder deine gesetzlichen Ansprüche hinausgehen.  </p>
    "@
    $q2_question_a0700f2dc7154bda94c2087c7e9a08e3_en_v1 = @"
    What if my new flight leaves or arrives at a different UK airport?
    "@
    $q4_question_481c3a2d7a704d0e81f36f81746e875f_dech_v1 = @"
    Welche Kosten kann ich von meiner Reiseversicherung zurückfordern?
    "@
    $q1_question_4e53d7c7e570419aaacd4c97055e9a63_dech_v1 = @"
    Wie finde ich meine neuen Fluginformationen?
    "@
    $q2_answer_a0700f2dc7154bda94c2087c7e9a08e3_en_v1 = @"
    <p>We&rsquo;ll usually organise transportation to take you to your new UK departure airport. If you have an overnight delay, we&rsquo;ll also do our best to find you somewhere to stay for the night. </p>
    <p>Depending on circumstances, timing, and availability, your overnight hotel may be near your original departure airport or closer to your new one. </p>
    <p>If we invite you to make your own arrangements, please keep hold of all receipts for reasonable expenses, which you can claim back later. </p>
    <p>Unless we&rsquo;ve contacted you to say otherwise using the contact details provided when you booked your holiday if your return flight lands at a different UK airport, you should make your own way home and keep receipts to claim for reasonable transport expenses.</p>
    "@
    $q4_answer_481c3a2d7a704d0e81f36f81746e875f_dech_v1 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">Wenn dir zus&auml;tzliche Kosten entstanden sind, empfehlen wir dir, dich unbedingt an deinen Reiseversicherungsanbieter zu wenden, insbesondere bei Kosten wie:</p>
    <ul style="color: #000000; background-color: #ffffff;">
        <li>Vers&auml;umte Arbeitstage</li>
        <li>Vers&auml;umte Termine</li>
        <li>Arztrechnungen</li>
        <li>Haustierbetreuung</li>
    </ul>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Dein Versicherer kann m&ouml;glicherweise Kosten &uuml;bernehmen, die easyJet holidays nicht erstattet, beispielsweise Kosten, die &uuml;ber dein Pauschalangebot oder deine gesetzlichen Anspr&uuml;che hinausgehen.</p>
    "@
    $q2_answer_a0700f2dc7154bda94c2087c7e9a08e3_frfr_v1 = @"
    <p>Nous essayons g&eacute;n&eacute;ralement d&rsquo;organiser un transport pour vous emmener &agrave; votre nouvel a&eacute;roport de d&eacute;part. Si votre vol est report&eacute; au lendemain, nous faisons &eacute;galement de notre mieux pour vous trouver un endroit o&ugrave; passer la nuit. </p>
    <p>Selon les circonstances, les horaires et la disponibilit&eacute;, votre h&ocirc;tel pour la nuit peut &ecirc;tre situ&eacute; pr&egrave;s de votre a&eacute;roport de d&eacute;part initial ou plus pr&egrave;s du nouveau. </p>
    <p>Si nous vous demandons d&rsquo;effectuer vos propres r&eacute;servations, veuillez conserver tous les re&ccedil;us relatifs aux d&eacute;penses effectu&eacute;es dans les limites du raisonnable, afin de pouvoir en demander le remboursement plus tard. </p>
    <p>&Agrave; moins que nous ne vous ayons contact&eacute; pour vous informer du contraire en utilisant les coordonn&eacute;es fournies lors de la r&eacute;servation de vos vacances, si votre vol retour atterrit &agrave; un autre a&eacute;roport, vous devrez rentrer chez vous par vos propres moyens et conserver vos re&ccedil;us afin de pouvoir demander le remboursement de vos frais de transport dans les limites du raisonnable.</p>
    "@
    $q2_question_a0700f2dc7154bda94c2087c7e9a08e3_dede_v1 = @"
    Was passiert, wenn mein neuer Flug von einem anderen Flughafen abfliegt oder dort ankommt?
    "@
    $q2_question_a0700f2dc7154bda94c2087c7e9a08e3_dech_v1 = @"
    Was passiert, wenn mein neuer Flug von einem anderen Flughafen abfliegt oder dort ankommt?
    "@
    $q4_answer_481c3a2d7a704d0e81f36f81746e875f_frfr_v1 = @"
    <p>Si vous avez engagé des frais supplémentaires, nous vous recommandons vivement de contacter votre prestataire d’assurance voyage, en particulier pour des frais tels que : </p>
    <ul>
        <li>Les jours de travail manqués </li>
        <li>Les rendez-vous manqués </li>
        <li>Les frais médicaux </li>
        <li>La garde d’animaux de compagnie
        </li>
    </ul>
    <p>Votre assureur sera peut-être en mesure de rembourser les dépenses qui ne sont pas prises en charge par easyJet holidays, comme celles non comprises dans votre séjour ou dans les prestations prévues par la réglementation.  </p>
    "@
    $q3_answer_53493e50c31449c18b8d0560a6f105f5_frch_v2 = @"
    <p>Si votre vol retour a &eacute;t&eacute; annul&eacute; en raison de perturbations, nous vous r&eacute;serverons un autre vol easyJet pour rentrer chez vous et ferons tout notre possible pour minimiser les d&eacute;sagr&eacute;ments.</p>
    <p>Si le nouveau vol que nous confirmons ne vous convient pas et que vous avez trouv&eacute; un autre moyen de transport au moins un jour avant le vol que nous avons r&eacute;serv&eacute; pour vous, vous pouvez r&eacute;server ce moyen de transport et demander le remboursement des frais dans les limites du raisonnable.</p>
    <p>Pour soumettre une demande de remboursement des frais, veillez &agrave; nous informer que vous avez r&eacute;serv&eacute; une autre option, par exemple en&nbsp;<a href="https://www.easyjet.com/ch-fr/vacances/aide/assistance-pendant-vos-vacances"><span style="text-decoration: underline;"><strong>lan&ccedil;ant un chat avec nous ou en appelant notre &eacute;quipe</strong></span></a>. Cela nous permet &eacute;galement de lib&eacute;rer des si&egrave;ges afin que d&rsquo;autres passagers puissent rentrer chez eux plus t&ocirc;t.</p>
    "@
    $q3_question_53493e50c31449c18b8d0560a6f105f5_frfr_v2 = @"
    Puis-je réserver moi-même mon vol retour ?
    "@
    $q2_answer_a0700f2dc7154bda94c2087c7e9a08e3_dede_v1 = @"
    <p>In der Regel organisieren wir den Transfer zu deinem neuen Abflughafen. Bei einer Verspätung über Nacht bemühen wir uns außerdem um eine Unterkunft für dich und deine Gruppe. </p>
    <p>Je nach den Umständen, dem Zeitpunkt und der Verfügbarkeit kann deine Unterkunft in der Nähe deines ursprünglichen Abflughafens oder näher an deinem neuen Abflughafen liegen. </p>
    <p>Wenn wir dich bitten, dich selbst um eine Unterkunft zu kümmern, bewahre bitte sämtliche Belege über angemessene Ausgaben auf, die du später geltend machen kannst. </p>
    <p>Sofern wir dich nicht unter den bei deiner Buchung angegebenen Kontaktdaten anderweitig informiert haben, solltest du, wenn dein Rückflug an einem anderen Flughafen landet, selbst für deine Heimreise sorgen und die Belege aufbewahren, um die angemessenen Transportkosten geltend machen zu können.</p>
    "@
    $q1_answer_4e53d7c7e570419aaacd4c97055e9a63_dech_v1 = @"
    <p><span style="color: #000000; background-color: #ffffff;">Wir werden dich im Falle von &Auml;nderungen an deinem Flug proaktiv per E-Mail und manchmal auch per SMS unter den Kontaktdaten benachrichtigen, die du bei der Buchung deiner Ferien angegeben hast, sodass du uns nicht anrufen musst, um diese Informationen zu erhalten.</span><br style="color: #000000; background-color: #ffffff;" />
    <br style="color: #000000; background-color: #ffffff;" />
    <span style="color: #000000; background-color: #ffffff;">Die aktuellen Daten zu deinem neuen Flug kannst du auch einsehen, indem du dich bei&nbsp;</span><a tabindex="0" target="_blank" href="https://www.easyjet.com/ch-de/" rel="noopener noreferrer" style="color: #ff6600; background-color: #ffffff;"><span>easyJet.com/ch-de</span></a><span style="color: #000000; background-color: #ffffff;">&nbsp;einloggst und deine Buchung aufrufst. Du brauchst deine Fluginformationen und die Flugreferenznummer, die mit einem &bdquo;K&ldquo; beginnt. Diese findest du in den E-Mails, die wir dir geschickt haben.</span> </p>
    "@
    $q3_question_53493e50c31449c18b8d0560a6f105f5_dede_v2 = @"
    Kann ich meinen eigenen Rückflug buchen?
    "@
    $q1_answer_4e53d7c7e570419aaacd4c97055e9a63_frch_v1 = @"
    <p>En cas de modification de votre vol, nous vous contacterons de mani&egrave;re proactive par e-mail, et parfois par SMS, aux coordonn&eacute;es fournies lors de la r&eacute;servation de vos vacances. Vous n&rsquo;aurez donc pas besoin de nous appeler pour obtenir ces informations.<br />
    <br />
    Vous pouvez &eacute;galement consulter les derni&egrave;res informations en direct concernant votre nouveau vol en vous connectant &agrave; <strong><a href="https://www.easyjet.com/fr">easyJet.com/fr</a>&nbsp;</strong>et en consultant votre r&eacute;servation. Vous aurez besoin de vos informations de vol et du num&eacute;ro de r&eacute;f&eacute;rence du vol commen&ccedil;ant par un &laquo;&nbsp;K&nbsp;&raquo;, que vous trouverez dans les e-mails que nous vous avons pr&eacute;c&eacute;demment envoy&eacute;s.</p>
    "@
    $q2_question_a0700f2dc7154bda94c2087c7e9a08e3_frch_v1 = @"
    Que se passe-t-il si mon nouveau vol part ou arrive dans un autre aéroport?
    "@
    $q1_answer_4e53d7c7e570419aaacd4c97055e9a63_dede_v1 = @"
    <p>Wir werden dich im Falle von &Auml;nderungen an deinem Flug proaktiv per E-Mail und manchmal auch per SMS unter den Kontaktdaten benachrichtigen, die du bei der Buchung deines Urlaubs angegeben hast, sodass du uns nicht anrufen musst, um diese Informationen zu erhalten.<br />
    <br />
    Die aktuellen Details zu deinem neuen Flug kannst du auch einsehen, indem du dich bei <a href="https://www.easyjet.com/de"><strong><span style="text-decoration: underline;">easyJet.com/de</span></strong></a> einloggst und deine Buchung aufrufst. Du brauchst deine Fluginformationen und die Flugreferenznummer, die mit einem &bdquo;K&ldquo; beginnt. Diese findest du in den E-Mails, die wir dir geschickt haben. </p>
    "@
    $q3_answer_53493e50c31449c18b8d0560a6f105f5_dede_v2 = @"
    <p>Wenn dein urspr&uuml;nglicher Heimflug aufgrund von St&ouml;rungen storniert wurde, buchen wir dich auf einen alternativen R&uuml;ckflug mit easyJet um und setzen alles daran, die Unannehmlichkeiten aufs Minimum zu beschr&auml;nken. </p>
    <p>Wenn dir der von uns best&auml;tigte neue Flug nicht zusagt und du mindestens einen Tag vor dem von uns umgebuchten Flug eine alternative Bef&ouml;rderungsm&ouml;glichkeit gefunden hast, kannst du diese buchen und eine Erstattung der Kosten in angemessener H&ouml;he beantragen. </p>
    <p>Um deine Kosten erfolgreich geltend zu machen, musst du uns mitteilen, dass du einen alternativen Tansport gebucht hast, beispielsweise indem du <a href="~/link.aspx?_id=CE1EB23F27E2418B97906F508A4FC91F&amp;_z=z"><span style="text-decoration: underline;"><strong>einen Chat mit uns startest oder unser Support-Team anrufst</strong></span></a>. Das erm&ouml;glicht es uns, Sitzpl&auml;tze f&uuml;r andere Reisende verf&uuml;gbar zu machen, sodass alle G&auml;ste so bald wie m&ouml;glich nach Hause kommen k&ouml;nnen.  </p>
    "@
    $q4_answer_481c3a2d7a704d0e81f36f81746e875f_frch_v1 = @"
    <p>Si vous avez engag&eacute; des frais suppl&eacute;mentaires, nous vous recommandons vivement de contacter votre prestataire d&rsquo;assurance voyage, en particulier pour des frais tels que&nbsp;:</p>
    <ul>
        <li>Les jours de travail manqu&eacute;s</li>
        <li>Les rendez-vous manqu&eacute;s</li>
        <li>Les frais m&eacute;dicaux</li>
        <li>La garde d&rsquo;animaux de compagnie</li>
    </ul>
    <p>Votre assureur sera peut-&ecirc;tre en mesure de rembourser les d&eacute;penses qui ne sont pas prises en charge par easyJet holidays, comme celles non comprises dans votre s&eacute;jour ou dans les prestations pr&eacute;vues par la r&eacute;glementation.</p>
    "@
    $q1_question_4e53d7c7e570419aaacd4c97055e9a63_frfr_v1 = @"
    Comment trouver mes nouvelles informations de vol ?
    "@
    $q2_question_a0700f2dc7154bda94c2087c7e9a08e3_frfr_v1 = @"
    Que se passe-t-il si mon nouveau vol part ou arrive dans un autre aéroport ?
    "@
    $q2_answer_a0700f2dc7154bda94c2087c7e9a08e3_dech_v1 = @"
    <p style="color: #000000; background-color: #ffffff; margin-right: 0px; margin-bottom: 10px; margin-left: 0px;">In der Regel organisieren wir den Transfer zu deinem neuen Abflughafen. Bei einer Versp&auml;tung &uuml;ber Nacht bem&uuml;hen wir uns ausserdem um eine Unterkunft f&uuml;r dich und deine Gruppe.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Je nach den Umst&auml;nden, dem Zeitpunkt und der Verf&uuml;gbarkeit kann deine Unterkunft in der N&auml;he deines urspr&uuml;nglichen Abflughafens oder n&auml;her an deinem neuen Abflughafen liegen.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Wenn wir dich bitten, dich selbst um eine Unterkunft zu k&uuml;mmern, bewahre bitte s&auml;mtliche Belege &uuml;ber angemessene Ausgaben auf, die du sp&auml;ter geltend machen kannst.</p>
    <p style="color: #000000; background-color: #ffffff; margin: 0px 0px 10px;">Sofern wir dich nicht unter den bei deiner Buchung angegebenen Kontaktdaten anderweitig informiert haben, solltest du, wenn dein R&uuml;ckflug an einem anderen Flughafen landet, selbst f&uuml;r deine Heimreise sorgen und die Belege aufbewahren, um die angemessenen Transportkosten geltend machen zu k&ouml;nnen.</p>
    "@
