    $holidayshomerootinfodisruptionpagecomponentscontactussectiontitleflightplushotel_Id = "{D8177143-CD00-4ACB-A4B1-5B595F32A1D2}"
    $contactussectiontitleflightplushotel_title_d8177143cd004acba4b15b595f32a1d2_en_v6 = @"
    STILL STUCK?
    "@
    $contactussectiontitleflightplushotel_icon_d8177143cd004acba4b15b595f32a1d2_frch_v6 = @"
    <image mediaid="{911BA700-854E-49C8-A401-3027C414F1B6}" alt="message" height="80" width="80" hspace="" vspace="" />
    "@
    $contactussectiontitleflightplushotel_icon_d8177143cd004acba4b15b595f32a1d2_frfr_v6 = @"
    <image mediaid="{911BA700-854E-49C8-A401-3027C414F1B6}" alt="message" height="80" width="80" hspace="" vspace="" />
    "@
    $contactussectiontitleflightplushotel_description_d8177143cd004acba4b15b595f32a1d2_dede_v6 = @"
    <p style="font-size: 14px;">Wir verstehen, dass das Warten stressig sein kann, aber danke, dass du uns etwas Zeit gibst. Unser Team arbeitet gerade an alternativen L&ouml;sungen und wird sich mit dir in Verbindung setzen, sobald wir mehr Infos haben. Wir nutzen daf&uuml;r die Kontaktdaten, die du bei der Buchung deines Urlaubs angegeben hast. </p>
    <p style="font-size: 14px;">In der Zwischenzeit kannst du unsere&nbsp;<a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">FAQs</span></strong></a>&nbsp;oder unsere <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Kontaktseite</span></strong></a>&nbsp;besuchen, wenn du weitere Hilfe ben&ouml;tigst. </p>
    "@
    $contactussectiontitleflightplushotel_description_d8177143cd004acba4b15b595f32a1d2_frch_v6 = @"
    <p>Nous sommes parfaitement conscients qu'attendre peut &ecirc;tre particuli&egrave;rement stressant, et nous vous remercions de votre patience. Notre &eacute;quipe travaille actuellement &agrave; la mise en place de solutions alternatives et vous contactera d&egrave;s que nous aurons plus d&rsquo;informations, en utilisant les coordonn&eacute;es fournies lors de la r&eacute;servation de vos vacances.</p>
    <p>En attendant, n&rsquo;h&eacute;sitez pas &agrave; consulter notre&nbsp;<a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp;pour plus d&rsquo;informations, ou notre page&nbsp;<a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Nous contacter</span></strong></a>&nbsp;si vous avez besoin d&rsquo;une assistance compl&eacute;mentaire.</p>
    "@
    $contactussectiontitleflightplushotel_title_d8177143cd004acba4b15b595f32a1d2_frfr_v6 = @"
    VOUS NE SAVEZ TOUJOURS PAS QUOI FAIRE ?
    "@
    $contactussectiontitleflightplushotel_icon_d8177143cd004acba4b15b595f32a1d2_dech_v6 = @"
    <image mediaid="{911BA700-854E-49C8-A401-3027C414F1B6}" alt="Nachricht" height="80" width="80" hspace="" vspace="" />
    "@
    $contactussectiontitleflightplushotel_description_d8177143cd004acba4b15b595f32a1d2_dech_v6 = @"
    <p style="color: #333333; background-color: #f1f5f6;">Wir verstehen, dass das Warten stressig sein kann, aber danke, dass du uns etwas Zeit gibst. Unser Team arbeitet gerade an alternativen L&ouml;sungen und wird sich mit dir in Verbindung setzen, sobald wir mehr Infos haben. Wir nutzen daf&uuml;r die Kontaktdaten, die du bei der Buchung deiner Ferien angegeben hast.</p>
    <p style="color: #333333; background-color: #f1f5f6;">In der Zwischenzeit kannst du unsere&nbsp;<a tabindex="0" href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z" data-path="/hilfe" style="color: #ff6600; background-color: initial;"><span>FAQs</span></a>&nbsp;oder unsere&nbsp;<span><a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z">Kontaktseite</a></span>&nbsp;besuchen, wenn du weitere Hilfe ben&ouml;tigst.</p>
    "@
    $contactussectiontitleflightplushotel_title_d8177143cd004acba4b15b595f32a1d2_frch_v6 = @"
    VOUS NE SAVEZ TOUJOURS PAS QUOI FAIRE?
    "@
    $contactussectiontitleflightplushotel_title_d8177143cd004acba4b15b595f32a1d2_dech_v6 = @"
    DU STECKST IMMER NOCH FEST?
    "@
    $contactussectiontitleflightplushotel_title_d8177143cd004acba4b15b595f32a1d2_dede_v6 = @"
    DU STECKST IMMER NOCH FEST?
    "@
    $contactussectiontitleflightplushotel_icon_d8177143cd004acba4b15b595f32a1d2_en_v6 = @"
    <image mediaid="{911BA700-854E-49C8-A401-3027C414F1B6}" alt="message" height="80" width="80" hspace="" vspace="" />
    "@
    $contactussectiontitleflightplushotel_icon_d8177143cd004acba4b15b595f32a1d2_dede_v6 = @"
    <image mediaid="{911BA700-854E-49C8-A401-3027C414F1B6}" alt="message" height="80" width="80" hspace="" vspace="" />
    "@
    $contactussectiontitleflightplushotel_description_d8177143cd004acba4b15b595f32a1d2_frfr_v6 = @"
    <p style="font-size: 14px;">Nous sommes parfaitement conscients qu'attendre peut être particulièrement stressant, et nous vous remercions de votre patience. Notre équipe travaille actuellement à la mise en place de solutions alternatives et vous contactera dès que nous aurons plus d’informations, en utilisant les coordonnées fournies lors de la réservation de vos vacances. </p>
    <p style="font-size: 14px;">En attendant, n’hésitez pas à consulter notre <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z"><strong><span style="text-decoration: underline;">Centre d'aide</span></strong></a>&nbsp;pour plus d’informations, ou notre page <a href="~/link.aspx?_id=2E3D3AB01BB143608729E411F5496F54&amp;_z=z"><strong><span style="text-decoration: underline;">Nous contacter</span></strong></a>&nbsp;si vous avez besoin d’une assistance complémentaire.</p>
    "@
    $contactussectiontitleflightplushotel_description_d8177143cd004acba4b15b595f32a1d2_en_v6 = @"
    <p style="font-size: 14px;">We understand waiting can feel stressful, but thanks for giving us some time. Our team is currently working on alternative arrangements and will reach out as soon as we have more information using the contact details provided when you booked your holiday. </p>
    <p style="font-size: 14px;">In the meantime, feel free to visit our <a href="~/link.aspx?_id=4842693FD3F7438F9D5100C64A2E8047&amp;_z=z"><strong><span style="text-decoration: underline;">help centre</span></strong></a>&nbsp;for assistance, or our <a href="~/link.aspx?_id=ADCD2BC5066645E78246B8ABAD045313&amp;_z=z"><strong><span style="text-decoration: underline;">contact us</span></strong></a>&nbsp;page if you still need extra help.</p>
    "@
