    $holidayshomerootinfotravelinformationpagecomponentstextblockstravelinfobeforeaccordionsflightplushotel_Id = "{C46D4391-7108-4CF8-9228-FBB5604A1385}"
    $travelinfobeforeaccordionsflightplushotel_description_c46d439171084cf89228fbb5604a1385_frfr_v38 = @"
    <p>Veuillez consulter ci-dessous nos derni&egrave;res informations de voyage pour les clients easyJet.</p>
    <p>Si vous avez r&eacute;serv&eacute; un vol uniquement avec easyJet, veuillez consulter la page d&rsquo;<a href="https://www.easyjet.com/fr/aide/preparer-votre-voyage/dernieres-informations-de-voyage">informations de voyage pour les vols</a>.</p>
    "@
    $travelinfobeforeaccordionsflightplushotel_description_c46d439171084cf89228fbb5604a1385_frch_v38 = @"
    <p>Veuillez consulter ci-dessous nos derni&egrave;res informations de voyage pour les clients easyJet. </p>
    <p>Si vous avez r&eacute;serv&eacute; un vol uniquement avec easyJet, veuillez consulter la page d&rsquo;<a href="https://www.easyjet.com/fr/aide/preparer-votre-voyage/dernieres-informations-de-voyage">informations de voyage pour les vols</a>. </p>
    "@
    $travelinfobeforeaccordionsflightplushotel_description_c46d439171084cf89228fbb5604a1385_dede_v38 = @"
    <p>Wir k&ouml;nnen es kaum erwarten, dich in deinen wohlverdienten Urlaub zu schicken. Unten sind einige wichtige Dinge aufgef&uuml;hrt, die du vor deiner Reise beachten solltest.</p>
    <p>Wenn du nur einen Flug bei easyJet gebucht hast, sieh dir bitte die&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/de/hilfe/boarding-und-fliegen/verspatungen-und-annullierung" target="_blank">Reiseinformationsseite&nbsp;</a>f&uuml;r Fl&uuml;ge an. Diese Seite ist nur f&uuml;r Kunden von&nbsp;easyJet bestimmt.</p>
    "@
    $travelinfobeforeaccordionsflightplushotel_description_c46d439171084cf89228fbb5604a1385_dech_v38 = @"
    <p>Wir k&ouml;nnen es kaum erwarten, dich in deine wohlverdienten Ferien zu bringen. Unten findest du einige wichtige Informationen, die du vor deiner Reise beachten solltest. </p>
    <p>Wenn du nur einen Flug mit easyJet gebucht hast, sieh dir bitte die&nbsp;<a rel="noopener noreferrer" target="_blank" href="https://www.easyjet.com/de/hilfe/boarding-und-fliegen/verspatungen-und-annullierung">Reiseinformationsseite</a>&nbsp;f&uuml;r Fl&uuml;ge an. Diese Seite ist nur f&uuml;r Kunden von&nbsp;easyJet bestimmt.</p>
    "@
    $travelinfobeforeaccordionsflightplushotel_description_c46d439171084cf89228fbb5604a1385_en_v38 = @"
    <p>Please&nbsp;see below our latest travel information for easyJet customers. If you have a flight only booking with easyJet, please refer to the latest&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/help/preparing-to-fly/latest-travel-information" target="_blank">travel information page&nbsp;</a>for flights. </p>
    "@
