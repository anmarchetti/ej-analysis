    $sportsItemsSmallHolidays = Get-ChildItem -Path $sportsEquipmentSmallHolidays
    $sportsItemsLargeTrade = Get-ChildItem -Path $sportsEquipmentLargeTrade
    $sportsItemsSmallTrade = Get-ChildItem -Path $sportsEquipmentSmallTrade
    
    $sportsiItemsListLargeHolidays= ($sportsItemsLargeHolidays | select -ExpandProperty Id) -join "|"
    $sportsiItemsListSmallHolidays= ($sportsItemsSmallHolidays | select -ExpandProperty Id) -join "|"
