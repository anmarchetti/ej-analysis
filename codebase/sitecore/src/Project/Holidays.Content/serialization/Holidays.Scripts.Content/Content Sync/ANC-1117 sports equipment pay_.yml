    function setSportsEquipmentList($itemPath, $codesList, $lang) {
        $sportsEquipmentItem = Get-Item -Path $itemPath -Language $lang
        $sportsEquipmentItem
        
         if($sportsEquipmentItem -eq $null -or $sportsEquipmentItem.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        
            if($sportsEquipmentItem -ne $null) {
            $sportsEquipmentItem.Editing.BeginEdit()
            $sportsEquipmentItem["SportEquipmentItems"] = $codesList
            $sportsEquipmentItem.Editing.EndEdit() | Out-Null
            }
    }
    
    
    setSportsEquipmentList -itemPath $payBalancePathHolidays -codesList $sportsItemsListHolidays -lang 'en'
    setSportsEquipmentList -itemPath $payBalancePathHolidays -codesList $sportsItemsListHolidays -lang 'fr-FR'
    setSportsEquipmentList -itemPath $payBalancePathHolidays -codesList $sportsItemsListHolidays -lang 'de-DE'
    setSportsEquipmentList -itemPath $payBalancePathHolidays -codesList $sportsItemsListHolidays -lang 'fr-CH'
    setSportsEquipmentList -itemPath $payBalancePathHolidays -codesList $sportsItemsListHolidays -lang 'de-CH'
    
    
