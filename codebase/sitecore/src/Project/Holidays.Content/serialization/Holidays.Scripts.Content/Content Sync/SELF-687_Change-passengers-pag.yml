DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $passengerDetailsItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details" -ErrorAction SilentlyContinue;
    $siteSettingsItem = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Amend Booking Settings" -ErrorAction SilentlyContinue;
    
    
    if ($passengerDetailsItem -ne $null) {
    	$passengerDetailsItem.Editing.BeginEdit();
    	
    	$passengerDetailsItem["PageDescription"]="change the passenger details for this trip. Edit your passenger names for your upcoming trip."
    	
    	Write-Host $passengerDetailsItem.Name "Updated";
        $passengerDetailsItem.Editing.EndEdit() | Out-Null;
    }
    
    if ($siteSettingsItem -ne $null) {
    	$siteSettingsItem.Editing.BeginEdit();
    	
    	$siteSettingsItem["IsAmendPassengerChangeCountEnabled"]="0"
    	
    	Write-Host $siteSettingsItem.Name "Updated";
        $siteSettingsItem.Editing.EndEdit() | Out-Null;
    }
