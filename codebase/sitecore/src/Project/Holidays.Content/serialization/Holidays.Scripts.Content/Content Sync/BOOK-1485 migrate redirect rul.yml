SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Import-Function "Import Content"
    $holidaysdataredirectrules_Id = [GUID]"{0F952439-3B95-4633-8F53-5A205155C0C9}"
    $itemsToCreate = @(
        @{
            Path        = "/sitecore/content/EasyJet/Holidays/Data/Redirect Rules"
            TemplatePath = "Feature/Redirects/Redirect Map Grouping"
            Id          = $holidaysdataredirectrules_Id
        }
    )
    ImportContent -itemsToCreate $itemsToCreate
    
    
    $target = "/sitecore/content/EasyJet/Holidays/Data/Redirect Rules"
    $folderTemplate = "Feature/Redirects/Redirect Map Grouping"
    $ruleTemplate = "Feature/Redirects/Redirect Map"
    
    $source = "/sitecore/content/EasyJet/Holidays/Settings/Redirect Map Grouping"
    
    $allRules = gci -Path $source
    
    $allRules | % {
        $group = $_
        
        $groupName = $group.Name
        $redirects = [System.Web.HttpUtility]::ParseQueryString($group.UrlMapping)
        $type = $group.RedirectType
        $filters = $group.FilterPageTypes
        
        $groupPath = $target + "/" + $groupName
        
        $existingGroup = gi -path $groupPath -ErrorAction SilentlyContinue
        if ($existingGroup -eq $null) {
            New-Item -Path $target -Name $groupName -ItemType $folderTemplate
        }
        $index = 0
        $redirects.AllKeys | % { 
            $index++
            $fromUrl = $_
            $toUrl = $redirects[$_]
            
            $item = New-Item -Path $groupPath -Name $index -ItemType $ruleTemplate
            
            
            $item.Editing.BeginEdit()
            $item.FromUrl = $fromUrl
            $item.ToUrl = $toUrl
            $item.RedirectType = $type
            $item.FilterPageTypes = $filters
            $item.Editing.EndEdit() | Out-Null
        }
    }
