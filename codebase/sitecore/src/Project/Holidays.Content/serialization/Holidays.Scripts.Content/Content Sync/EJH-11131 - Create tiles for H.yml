- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Promo-Block {
      param([item]$item,[string]$title,[string]$image,[string]$link)
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Title"] = $title;
            $item["Image"] = $image;
            $item["Link"] = $link;
            $item.Editing.EndEdit() | Out-Null
        }
    }
    
    function Get-Or-Create-Item {
      param($parent,$itemName,$templateId)
      if ($parent -ne $null) {
        $item = Get-ChildItem -Item $parent | Where-Object { $_.Name -eq $itemName } | Select -First 1
        if ($item.Count -eq 0) {
          New-Item -Parent $parent -Name $itemName -ItemType $templateId
        }
        return $item
      }
    }
    
    function Get-Item-Id ($itemPath) {
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        
      if ($item -eq $null) {
          return "";
      }
      return $item.ID
    }
    
    $dealsPromoBlocksItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Deals/Page Components/Promo Blocks" -ErrorAction SilentlyContinue
    $bestDealsItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Deals/Page Components/Promo Blocks/Our Best Deals" -ErrorAction SilentlyContinue #ID Our Best Deals component
    $lastMinuteHolidaysPageId = Get-Item-Id -itemPath "/sitecore/content/EasyJet/Holidays/Home/Root/Last minute beach holidays"
    $allInclusiveHolidaysPageId = Get-Item-Id -itemPath "/sitecore/content/EasyJet/Holidays/Home/Root/All inclusive holidays"
    $summerHolidaysPageId = Get-Item-Id -itemPath "/sitecore/content/EasyJet/Holidays/Home/Root/Summer holidays"
    $familyHolidaysPageId = Get-Item-Id -itemPath "/sitecore/content/EasyJet/Holidays/Home/Root/Family holidays"
    
    $horizontalTilesPromoBlocks = Get-Or-Create-Item -parent $dealsPromoBlocksItem -itemName "Our Best Deals" -templateId "{EB30259D-FF9A-46CB-8E0C-4616B148F3A8}" # Template ID of PromoBlockFolder
    $promoBlockLastMinuteDeals = Get-Or-Create-Item -parent $horizontalTilesPromoBlocks -itemName "Tile1" -templateId "{84ACB697-5638-4525-9801-B31CAC2E0394}"
    $promoBlockAllInclusiveDeals = Get-Or-Create-Item -parent $horizontalTilesPromoBlocks -itemName "Tile2" -templateId "{84ACB697-5638-4525-9801-B31CAC2E0394}"
    $promoBlockSummerDeals = Get-Or-Create-Item -parent $horizontalTilesPromoBlocks -itemName "Tile3" -templateId "{84ACB697-5638-4525-9801-B31CAC2E0394}"
    $promoBlockFamilyHolidays = Get-Or-Create-Item -parent $horizontalTilesPromoBlocks -itemName "Tile4" -templateId "{84ACB697-5638-4525-9801-B31CAC2E0394}"
    
    $lastMinutePromoBlockLinkTag = '<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{0}" />' -f $lastMinuteHolidaysPageId
    $allInclusivePromoBlockLinkTag = '<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{0}" />' -f $allInclusiveHolidaysPageId
    $summerPromoBlockLinkTag = '<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{0}" />' -f $summerHolidaysPageId
    $familyPromoBlockLinkTag = '<link text="" anchor="" linktype="internal" class="" title=""  querystring="" id="{0}" />' -f $familyHolidaysPageId
    
    Update-Promo-Block -item $promoBlockLastMinuteDeals -title "Last minute deals" -image '<image mediaid="{A5DB1002-B954-4F0A-A1BA-7B61B7D899FC}" />' -link $lastMinutePromoBlockLinkTag
    Update-Promo-Block -item $promoBlockAllInclusiveDeals -title "All inclusive deals" -image '<image mediaid="{EEB263F3-A027-4B31-AF37-DAACC0449CA9}" />' -link $allInclusivePromoBlockLinkTag
    Update-Promo-Block -item $promoBlockSummerDeals -title "Summer deals" -image '<image mediaid="{68127ACC-DA52-43D2-A485-34CE582E4A8B}" />' -link $summerPromoBlockLinkTag
    Update-Promo-Block -item $promoBlockFamilyHolidays -title "Family holidays" -image '<image mediaid="{47D5BD86-6DC3-400D-BE19-3FDB6A5AF9A0}" />' -link $familyPromoBlockLinkTag
    
