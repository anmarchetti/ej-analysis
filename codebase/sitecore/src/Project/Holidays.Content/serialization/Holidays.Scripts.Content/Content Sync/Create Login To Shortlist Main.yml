  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    $loginMaintenance = Get-Or-Create-Item -path "master:/content/EasyJet/Holidays/Data/Login To Shortlist Maintenance Popup" -templateId "{5C4A2D07-6BE0-409B-97A9-0829970283B1}";
    
    if ($loginMaintenance -ne $null) {
        $loginMaintenance.Editing.BeginEdit()
        $loginMaintenance["Icon"] = '<image mediaid="{90267470-172A-4102-B274-CCD136CD9651}" />';
        $loginMaintenance["Title"] = "Unfortunately, you can't log in to view your shortlists. Please, bear with us.";
        $loginMaintenance["Description"] = "We&rsquo;re working on making a better experience for you.<br /> We apologise for any inconveniences caused and thank you for your patience.";
        $loginMaintenance.Editing.EndEdit() | Out-Null
    }
    
    #Add login popup to header
    function Add-Login($page){
        if ($page -ne $null) {
            $headerRenderings = Get-Rendering -Item $page -Placeholder "header";
            
            if ($headerRenderings -is [array]) {
                $pageHeaderRendering = $headerRenderings[0];
            } else { 
                $pageHeaderRendering = $headerRenderings;
            }
            
            $loginPlaceHolder=  '/header/login-popup-'+ $pageHeaderRendering.UniqueId +'-0'
            $loginRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Login To Shortlist Popup"
            $loginItem = Get-Item -Database "master" -Path $loginRenderingPath | New-Rendering -Placeholder $loginPlaceHolder
            Add-Rendering -Item $page -PlaceHolder $loginPlaceHolder -Instance $loginItem  
        }
    }
    
    $header = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Header" -ErrorAction SilentlyContinue
    $slim = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Header" -ErrorAction SilentlyContinue
    
    Add-Login -page $header;
    Add-Login -page $slim;
