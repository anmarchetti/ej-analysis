    function Set-Translation-Value-To-Multilist($itemPath, $language, $key, $value) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            $item = Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
            Write-Host "Created" $language "version for" $item.Name "item"
        } else {
            Write-Host $language "version for Item" $item.Name "already exist"
        }
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $item[$key] + $value
            $item.Editing.EndEdit() | Out-Null
            Write-Host "Field" $key "for" $item.Name "item updated with value" $translation
        }
    }
    
    function Create-Lang-Version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
    
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
    
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item){
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    function updateBreadcrumbsDictionary() {
        $dictionaryPath = "/sitecore/content/EasyJet/Holidays/Dictionary/Path Breadcrumbs/Labels/Cancel Booking"
        $dictionaryItem = Get-Or-Create-Item -Path $dictionaryPath -TemplateId "{6D1CD897-1936-4A3A-A511-289A94C2A7B1}"
    
        @('en') | % {
            Create-Lang-Version -Item $dictionaryItem -Lang $_ -Field "Key" -Value 'PathBreadcrumbs.Labels.CancelBooking'
            Create-Lang-Version -Item $dictionaryItem -Lang $_ -Field "Phrase" -Value "Cancel your holiday"
        }
    
        @('de-CH', 'de-DE') | % {
            Create-Lang-Version -Item $dictionaryItem -Lang $_ -Field "Phrase" -Value "Urlaub stornieren"
        }
    
        @('fr-CH', 'fr-FR') | % {
            Create-Lang-Version -Item $dictionaryItem -Lang $_ -Field "Phrase" -Value "Annulez vos vacances"
        }
    
        Write-Host "Updated dictionary GenericMessages.LinkToContactFormHTML"
    }
    
    Set-Translation-Value-To-Multilist -ItemPath $slimDesignsPath -Language 'en' -Key 'PageTemplates' -Value "|{E9544BE7-0494-410B-9E66-E0EC96B44ED6}"
    
    @('de-CH', 'de-DE', 'fr-CH', 'fr-FR') | % {
        Set-Translation-Value-To-Multilist -ItemPath $slimDesignsPathEU -Language $_ -Key 'PageTemplates' -Value "|{E9544BE7-0494-410B-9E66-E0EC96B44ED6}"
    }
    
    updateBreadcrumbsDictionary
