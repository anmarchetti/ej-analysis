Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-700 - Add Date Picker Label Switcher"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    
    $tab = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components/Date Picker Tab" -ErrorAction SilentlyContinue
    @('en') | % {
    	Create-Lang-Version -Item $tab -Lang $_ -Field "MonthPickerTabLabel" -Value "I am flexible"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "DatePickerTabLabel" -Value "Let me pick dates"
    }
    
    @('de-CH','de-DE') | % {
    	Create-Lang-Version -Item $tab -Lang $_ -Field "MonthPickerTabLabel" -Value "Ich bin flexibel"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "DatePickerTabLabel" -Value "Lassen Sie mich die Daten auswählen"
    }
    
    @('fr-CH','fr-FR') | % {
        Create-Lang-Version -Item $tab -Lang $_ -Field "MonthPickerTabLabel" -Value "Je suis flexible"
    	Create-Lang-Version -Item $tab -Lang $_ -Field "DatePickerTabLabel" -Value "Laissez-moi choisir les dates"
    }
