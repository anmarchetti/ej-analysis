        $seatMap.Editing.BeginEdit();
        $seatMap["InfoPopups"] = ""
    
        foreach($infoPopup in $infoPopup.Children) { 
            if (![string]::IsNullOrEmpty($seatMap["InfoPopups"])) {
                $seatMap["InfoPopups"] += "|";
            }
            $seatMap["InfoPopups"] += $infoPopup.ID.ToString()
        } 
        $seatMap.Editing.EndEdit()
    }
    
    
