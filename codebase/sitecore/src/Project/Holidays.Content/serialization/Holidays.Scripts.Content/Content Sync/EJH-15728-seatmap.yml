    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    function Update-Benefits($seatMap){
        $benefits = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Benefits"
        $seatMap.Editing.BeginEdit();
        $seatMap["Benefits"] = ""
    
        foreach($benefit in $benefits.Children) { 
            if (![string]::IsNullOrEmpty($seatMap["Benefits"])) {
                $seatMap["Benefits"] += "|";
            }
            $seatMap["Benefits"] += $benefit.ID.ToString()
        } 
        $seatMap.Editing.EndEdit()
    }
    
    function Update-InfoPopup($seatMap){
