    $infoText1["PopupTitle"] = "Special assistance & other restrictions"
    $infoText1["PopupContent"] = "<p>Special assistance passengers board at the front of the aircraft. If you do decide to choose a specific seat for your comfort we recommend selecting one towards the front of the cabin.</p><p>Not all seats have a liftable armrest. If you need to be seated in a seat with liftable armrests, please contact our Special Assistance team who will discuss your requirements with you.</p><p>Please add any Special Assistance requests before completing your booking. We can then pass on the request to the airports Special Assistance provider in good time.</p><p><strong>You can add a request after you&rsquo;ve booked by:</strong></p><p>&bull; logging into 'Manage Bookings' on easyjet.com and adding your requirements <br /> &bull; calling our Special Assistance team, with your booking reference <br /> &bull; emailing us at&nbsp;<a href='mailto:special.assistance@easyJet.com' target='_blank'>special.assistance@easyJet.com </a> with the subject &lsquo;Special Assistance Request&rsquo;. Where possible, please email 14 days in advance of your departure date</p><p>However, please make sure you let us know your requirements at least 48 hours before the scheduled departure time of your flight.</p>"
    $infoText1["Label"] = "Special assistance & other restrictions"
