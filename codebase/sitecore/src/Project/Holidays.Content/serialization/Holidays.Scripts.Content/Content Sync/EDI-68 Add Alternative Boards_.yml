- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $renderingId = "{5A3F1735-4675-4157-80E8-9ABB84EEFF79}"
    $itemPath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    $itemPathTrade = "/sitecore/content/EasyJet/TradePortal/Home/MixedResultList"
    $placeholder = "/body"
    
    $datasourcename = "Alternative Boards Popup"
    $datasourceitemtemplateid = "{FEEBD005-3DDA-4A48-A216-DAB9041ED7AF}"
    $datasourcepath ="/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components"
    $datasourcepathTrade ="/sitecore/content/EasyJet/TradePortal/Home/MixedResultList/Page Components"
    
    function create-datasource-item($name, $path, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
            return $item
        }
        
        return $item
    }
    
    function add-rendering-with-datasource-to-item($renderingId, $item, $datasource, $placeholderName){
        $existsRendering = Get-Rendering -Item $item -PlaceHolder $placeholderName  | Where-Object {$_.ItemId -eq $renderingId}
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering  -Placeholder $placeholderName
        if($existsRendering -eq $null){
            Add-Rendering -Item $item -PlaceHolder $placeholderName  -DataSource $datasource.FullPath -Instance $renderingItem
        }
    }
    
    # Holidays
    $datasourceitem = create-datasource-item -Name $datasourcename -Path $datasourcepath -TemplateId $datasourceitemtemplateid
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    if($item -ne $null){
        add-rendering-with-datasource-to-item -RenderingId $renderingId -Item $item -Datasource $datasourceitem -PlaceholderName $placeholder
    }
    
    # Trade
    $datasourceitemTrade = create-datasource-item -Name $datasourcename -Path $datasourcepathTrade -TemplateId $datasourceitemtemplateid
    $itemTrade = Get-Item -Path $itemPathTrade -ErrorAction SilentlyContinue
    if($itemTrade -ne $null){
        add-rendering-with-datasource-to-item -RenderingId $renderingId -Item $itemTrade -Datasource $datasourceitemTrade -PlaceholderName $placeholder
    }
