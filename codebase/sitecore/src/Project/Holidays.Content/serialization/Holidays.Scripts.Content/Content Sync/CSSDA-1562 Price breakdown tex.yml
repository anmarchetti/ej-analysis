- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Summary Trade'
    
    $data = Get-Item -Path $tradePath -ErrorAction SilentlyContinue
    
    if($data -ne $null) {
        $data.Editing.BeginEdit()
        $data['PriceBreakdownTitle'] = "Price Breakdown"
        $data['SeatsChange'] = "Seats change"
        $data['ChangeTooltip'] = "Price subject to change &amp; availability due to daily system updates. The price displayed here does factor in any change to your promotional code."
        $data['ChangeFeeTitle'] = "Change fee"
        $data['TotalCostOfChange'] = "Total cost of change"
        $data['PayNow'] = "Pay now"
        $data['RefundAmount'] = "Refund amount"
        $data['NoChangeTotal'] = "Total"
        $data.Editing.EndEdit() | Out-Null
        Write-Host $data.Name "Updated";
    }
    
    
    
    
    
