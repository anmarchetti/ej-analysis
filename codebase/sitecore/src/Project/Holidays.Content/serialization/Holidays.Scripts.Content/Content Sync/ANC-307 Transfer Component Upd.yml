    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
            
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Transfer-Update($website){
       if ($website -eq "TradePortal") {
            $dataSourcePath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Transfer Section Trade"
        } else {
            $dataSourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Transfer Section"
        }
        
        $dataSourceItem = Get-Item -Path $dataSourcePath -ErrorAction SilentlyContinue;
        
        if($dataSourceItem -ne $null) {
            $dataSourceItem.Editing.BeginEdit()
            $dataSourceItem["SharedCTADescription"] = "Book shared transfer"
            $dataSourceItem["PrivateCTADescription"] = "Book private taxi"
            $dataSourceItem["UpgradeForText"] = "Upgrade for"
            $dataSourceItem["IncludedForFreeText"] = "Included for free"
            $dataSourceItem["NoTransferCTADescription"] = "I’ll make my own way"
            $dataSourceItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Transfer Section Datasource updated"
        }
        
        # Add translations for Holidays
        if($website -eq "Holidays"){
            foreach ($lang in $translations.Keys) {
                $trans = $translations[$lang]
                create-lang-version $dataSourceItem $lang "SharedCTADescription" $trans["SharedCTADescription"]
                create-lang-version $dataSourceItem $lang "PrivateCTADescription" $trans["PrivateCTADescription"]
                create-lang-version $dataSourceItem $lang "UpgradeForText" $trans["UpgradeForText"]
                create-lang-version $dataSourceItem $lang "IncludedForFreeText" $trans["IncludedForFreeText"]
                create-lang-version $dataSourceItem $lang "NoTransferCTADescription" $trans["NoTransferCTADescription"]
                
                Write-Host "Translations added for language" $lang
            }
        }
        
        Write-Host "Transfers updated on" $website
    }
    
    Transfer-Update -website "Holidays"
    Transfer-Update -website "TradePortal"
    
    function No-Transfer-Update($website, $path){
        $dataSourceItem = Get-Item -Path $path -ErrorAction SilentlyContinue;
        
        if($dataSourceItem -ne $null) {
            $dataSourceItem.Editing.BeginEdit()
            $dataSourceItem["Content"] = "<div>You can make your own way to and from the airport, free of charge.</div>"
            $dataSourceItem.Editing.EndEdit() | Out-Null
            
            Write-Host "Transfer Section Datasource updated"
        }
        
        # Add translations for Holidays
        if($website -eq "Holidays"){
            foreach ($lang in $translations.Keys) {
                $trans = $translations[$lang]
                create-lang-version $dataSourceItem $lang "Content" $trans["Content"]
                
                Write-Host "Translations added for language" $lang
            }
        }
        
        Write-Host "No Transfer Content updated on" $website
    }
    
    No-Transfer-Update -website "Holidays" -path "/sitecore/content/EasyJet/Holidays/Data/Transfers/No Shared DMC"
    No-Transfer-Update -website "TradePortal" -path "/sitecore/content/EasyJet/Holidays/Data/Transfers/No Shared DMC"
    
    No-Transfer-Update -website "Holidays" -path "/sitecore/content/EasyJet/$website/Data/Transfers/No Private DMC"
    No-Transfer-Update -website "TradePortal" -path "/sitecore/content/EasyJet/$website/Data/Transfers/No Private DMCC"
