  Hint: Script
  Value: |
    function get-or-create-item ($name,$path,$templateId) {
    	$item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue;
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $name -ItemType $templateId;
    		return $item;
    	}
    
    	return $item;
    }
    
    function add-footer-seo-rendering($path, $datasourceId){
        $item = Get-Item -Database "master" -Path $path
        $placeholder = "/footer";
        $renderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Footer All Holidays And Flights";
        $renderingId = "{1F56A2E2-6217-4749-A104-010F800B94E1}";
        $rendering = Get-Rendering -Item $item -PlaceHolder $renderigPlaceholder | Where-Object { $_.ItemId -eq $renderingId };
        
        if ($rendering -eq $null) {
        	$renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -PlaceHolder $placeholder;
        	Add-Rendering -Item $item -PlaceHolder $placeholder -Instance $renderingItem -DataSource $datasourceId;
        	Write-host "Footer All Holidays And Flights added to full footer"
        }
    }
    
    $footerPartialPath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Footer"
    $footerSlimPath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Footer"
    $footerPartialPhonePath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Full Footer - Phone Number"
    $footerMediaCenterPath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Media Center Footer"
    
    $datasourceName = "Footer All Holidays And Flights";
    $datasourceTemplateId = "{E8DA8930-0BA7-429C-A456-5AF4B1FE5F45}";
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Data/Navigations";
    $datasourceitem = get-or-create-item -Name $datasourceName -Path $datasourcePath -TemplateId $datasourceTemplateId;
    
    add-footer-seo-rendering -Path $footerPartialPath -DatasourceId $datasourceItem.ID;
    add-footer-seo-rendering -Path $footerSlimPath -DatasourceId $datasourceItem.ID;
    add-footer-seo-rendering -Path $footerMediaCenterPath -DatasourceId $datasourceItem.ID;
    add-footer-seo-rendering -Path $footerPartialPhonePath -DatasourceId $datasourceItem.ID;
    
    Write-host "EJH-15446 script execution success"
