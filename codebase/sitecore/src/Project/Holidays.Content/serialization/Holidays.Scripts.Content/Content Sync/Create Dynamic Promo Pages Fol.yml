- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $dynamicPromoPagesFolderPath = "/sitecore/content/EasyJet/Holidays/Home"
    $dynamicPromoPagesFolderTemplateId = "{FFAF0D1E-30DE-4282-82D3-A9CACABF1BB0}"
    $dynamicPromoPagesFolderName = "DynamicPromoPages"
    $dynamicPromoPagesFolderDisplayName = "Dynamic Promo Pages"
    
    $dynamicPromoPageTemplateId = "{5FEB3CD0-845B-4102-9703-FD0AAB2E042F}"
    
    function create-item($path, $name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId -ForceId "{828f7213-3d5f-4882-82fa-ff22b2af91c7}"
        }
        return $item
    }
    
     function update-display-name($item, $displayname){
         if($item -ne $null){
            $item.Editing.BeginEdit()
            $item["__Display name"] = $displayname
            $item.editing.EndEdit()
         }
     }
     
    function add-to-page-design(){
        $designItem = Get-Item -path "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design";
        if ($designItem -ne $null) {
            [Sitecore.Data.Fields.MultilistField]$field = $designItem.Fields["PageTemplates"];
        
            if(!$field.Contains($dynamicPromoPageTemplateId)) {
                $designItem.Editing.BeginEdit();
                $field.add($dynamicPromoPageTemplateId);
                $designItem.Editing.EndEdit() | Out-Null
            }
        }
    }
    
     $dynamicPromoPagesFolderItem = create-item -Path $dynamicPromoPagesFolderPath -Name $dynamicPromoPagesFolderName -TemplateId $dynamicPromoPagesFolderTemplateId
     update-display-name -Item $dynamicPromoPagesFolderItem -DisplayName $dynamicPromoPagesFolderDisplayName
     add-to-page-design 
     create-item -Path "$($dynamicPromoPagesFolderPath)/$($dynamicPromoPagesFolderName)" -Name "Dynamic Promo Page 1" -TemplateId $dynamicPromoPageTemplateId
