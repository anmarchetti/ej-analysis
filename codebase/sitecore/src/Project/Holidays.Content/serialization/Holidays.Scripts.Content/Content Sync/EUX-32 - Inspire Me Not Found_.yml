- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    $item = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components/Not Found Tab" -ErrorAction SilentlyContinue
    
    @('en') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditQuizCTAText" -Value "Edit your answers"
    }
    
    @('de-CH','de-DE') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditQuizCTAText" -Value "Bearbeiten Sie Ihre Antworten"
    }
    @('fr-CH','fr-FR') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditQuizCTAText" -Value "Modifiez vos réponses"
    }
