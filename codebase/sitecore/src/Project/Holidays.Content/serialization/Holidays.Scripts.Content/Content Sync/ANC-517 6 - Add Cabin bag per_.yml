- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    $template = '{DC0AF2C8-0371-4A55-B9F7-47847203455B}'
    $path = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags'
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags'
    
    $data = Get-Or-Create-Item -Path $path -Template $template
    
    if($data -ne $null) {
        $data.Editing.BeginEdit()
        $data['OverheadBagAddedLabel'] = "{count} x large overhead cabin bags with speedy boarding"
        $data['OverheadAddedIcon'] = '<image mediaid="{D04439D4-A1E7-409F-B074-CBA5D1B14D5E}" />'
        $data['OverheadBagAddedDropdownLabel'] = '1 x large overhead cabin bags (10kg) with speedy boarding'
        $data.Editing.EndEdit() | Out-Null
    }
    
    $dataTrade = Get-Or-Create-Item -Path $tradePath -Template $template
    
    if($dataTrade -ne $null) {
        $dataTrade.Editing.BeginEdit()
        $dataTrade['OverheadBagAddedLabel'] = "{count} x large overhead cabin bags with speedy boarding"
        $dataTrade['OverheadAddedIcon'] = '<image mediaid="{D04439D4-A1E7-409F-B074-CBA5D1B14D5E}" />'
        $dataTrade['OverheadBagAddedDropdownLabel'] = '1 x large overhead cabin bags (10kg) with speedy boarding'
        $dataTrade.Editing.EndEdit() | Out-Null
    }
    
    $translations = @{
            
            "fr-CH" = @{
                "OverheadBagAddedLabel" = "{count} x grandes cabines aériennes avec embarquement rapide"
                "OverheadBagAddedDropdownLabel" = "1 x grands sacs de cabine (10 kg) avec embarquement rapide"
            }
            "fr-FR" = @{
                "OverheadBagAddedLabel" = "{count} x grandes cabines aériennes avec embarquement rapide"
                 "OverheadBagAddedDropdownLabel" = "1 x grands sacs de cabine (10 kg) avec embarquement rapide"
            }
            "de-CH" = @{
                "OverheadBagAddedLabel" = "{count} x große Gepäckstücke in der Kabine mit zügigem Boarding"
                 "OverheadBagAddedDropdownLabel" = "1 x großes Handgepäck (10 kg) mit zügigem Boarding"
            }
            "de-DE" = @{
                "OverheadBagAddedLabel" = "{count} x große Gepäckstücke in der Kabine mit zügigem Boarding"
                 "OverheadBagAddedDropdownLabel" = "1 x großes Handgepäck (10 kg) mit zügigem Boarding"
            }
        }
        
        foreach ($lang in $translations.Keys) {
            create-lang-version -item $data -lang $lang -field "OverheadBagAddedLabel" -value $translations[$lang]["OverheadBagAddedLabel"]
            create-lang-version -item $data -lang $lang -field "OverheadBagAddedDropdownLabel" -value $translations[$lang]["OverheadBagAddedDropdownLabel"]
        }    
    
    
    
