Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-16362 Remove redundant renderings and items and add new promo blocks"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    function Remove-Item-Internal ($path){
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
        if($item -ne $null){
            $item | Remove-Item -Recurse
        }
    }
    
    function Get-Rendering-Index ($item, $renderingItemId) {
        $i = 0
        Get-Rendering -Item $item | ForEach-Object {
            if ($_.ItemID -eq $renderingItemId) {
                return $i
            }
            $i++
        }
    }
    
    function Remove-Rendering-WithSameSource ($item, $dataSourcePath) {
        $rendering = Get-Rendering -Item $item -DataSource $dataSourcePath
        if($rendering -ne $null) {
           if($rendering -is [array]){
                for ($i=0; $i -lt $rendering.Count; $i++){
                    Remove-Rendering -Item $item -Instance $rendering[$i]
                    Write-Host "Contact Us Page rendering removed"
                }
            }else{
                Remove-Rendering -Item $item -Instance $rendering
                Write-Host "Contact Us Page rendering removed"
            }
        }
    }
    
    
    # Remove unused items
    
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Accordion"
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Accordion - Contact"
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Html Blocks"
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Chatbot"
    
    # remove text and add new text
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Text Blocks/Travel info before accordions"
    Remove-Item-Internal "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Text Blocks/Travel info after accordions"
    
    # edit title and image
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us"
    
    $contactUsItem = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($contactUsItem -ne $null) {
        $contactUsItem.Editing.BeginEdit()
        $contactUsItem["Name"] = "Contact the easyJet Holidays Team"
        $contactUsItem["Image"] = '<image mediaid="{68E23BAD-5A2B-4C1F-A27B-A9CF6C261BCE}" />'
        $contactUsItem.Editing.EndEdit()
        
        Write-Host "Item" $contactUsItem.Name"successfully updated"
    }
    
    # remove unused renderings
    
    Remove-Rendering-WithSameSource $contactUsItem "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Accordion"
    Remove-Rendering-WithSameSource $contactUsItem "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Html Blocks/Contact Us iFrame"
    Remove-Rendering-WithSameSource $contactUsItem "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us/Page Components/Chatbot"
