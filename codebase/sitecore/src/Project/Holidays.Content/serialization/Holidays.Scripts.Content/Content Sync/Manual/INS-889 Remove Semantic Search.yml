Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/Manual/INS-889 Remove Semantic Search Pod Rendering Parameter"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $renderingId = "{216FE85C-936E-4135-894B-E7DE8BF8A4C2}" #/sitecore/layout/Renderings/Foundation/Destinations/Search Pod
    
    function Remove-RenderingParams($item){
        $path = $item.Paths.FullPath
    
    	#Final Layout
    	$searchPodRenderingsFinalLayout = Get-Rendering -Item $item -FinalLayout | Where-Object { $_.ItemId -eq $renderingId }
    	foreach ($rendering in $searchPodRenderingsFinalLayout) {
    		$rendering | Remove-RenderingParameter -Name "EnableNewDesign" | Set-Rendering -Item $item -FinalLayout
    	}
    
    	#Shared Layout
    	$searchPodRenderingsSharedLayout = Get-Rendering -Item $item | Where-Object { $_.ItemId -eq $renderingId }
    	foreach ($rendering in $searchPodRenderingsSharedLayout) {
    		$rendering | Remove-RenderingParameter -Name "EnableNewDesign" | Set-Rendering -Item $item
    	}
    	
    	Write-Host "Item: $path Shared and Final Layout - NewDesign parameter has been removed"
    }
    
    function Has-BaseTemplate($item, $baseTemplateId)
    {
        if ($item -eq $null)
        {
            return false;
        }
        $template = [Sitecore.Data.Managers.TemplateManager]::GetTemplate($item);
        return $template -ne $null -and $template.InheritsFrom($baseTemplateId);
    }
    
    function Update-Destinations-Recursive($root){
        foreach($child in $root.Children){
            if(Has-BaseTemplate -item $child -baseTemplateId "{168F65DC-9ECD-4A6E-AD93-A46464E45F79}"){
    
                Remove-RenderingParams $child
                
                if($child.TemplateId -eq "{28E5E169-8F72-4F90-A277-280A8302B607}")
                {
                    return
                }
                
                Update-Destinations-Recursive $child
            }
        }
    }
    
    $stopWatch = New-Object -TypeName System.Diagnostics.Stopwatch
    $stopWatch.Start()
    
    
    # Remove New Design params for non destinations pages    
    @("/sitecore/content/EasyJet/Holidays/Home", "/sitecore/content/EasyJet/Holidays/Home/Hotel Details", "/sitecore/content/EasyJet/Holidays/Home/MixedResultList", "/sitecore/content/EasyJet/Holidays/Home/Extras hub" ) | % {
        $item = Get-Item -Path $_
        Remove-RenderingParams $item
    }
    
    $root =  Get-Item "master:/sitecore/content/EasyJet/Holidays/Home/Destinations"
    # Remove New Design params for destinations pages  
    Update-Destinations-Recursive -root $root
    
    $stopWatch.Stop()
    Write-Host "Info: Elapsed time - $($StopWatch.Elapsed)"
