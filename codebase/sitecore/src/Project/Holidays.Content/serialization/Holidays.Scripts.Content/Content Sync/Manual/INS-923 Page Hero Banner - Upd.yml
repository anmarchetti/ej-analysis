ID: "b7602a27-aa6b-4539-b512-6fe2d2a4c442"
Parent: "b8c56fd2-1e24-4961-884b-de21791ff5c5"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/Manual/INS-923 Page Hero Banner - Update Variants"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $items = Get-ItemReferrer -Path "master:/sitecore/layout/Renderings/Feature/Destinations/Page Hero Banner"
    
    
    $i = 0
    foreach ($item in $items) {
    	$searchPodRenderings = Get-Rendering -Item $item -FinalLayout | Where-Object { $_.Placeholder -like "*floating-searchpod*" }
    	$hasFloatingSearchPod = $searchPodRenderings -ne $null
    	$pageHeroBannerRendering = Get-Rendering -Item $item -FinalLayout | Where-Object { $_.ItemId -eq "{8697E1B1-A31B-4641-B6F9-0DBC289C5B59}" }
    
    	foreach ($rendering in $pageHeroBannerRendering) {
    		if ($hasFloatingSearchPod) {
    			$path = $item.Paths.FullPath
    			$params = Get-RenderingParameter -Rendering $rendering
    			$variant = $params["Variant"]
    			Write-Host "Item: $path has variant $variant"
    
    			$parameters = [ordered]@{ "Variant" = "Shadow Full Banner No Shard" }
    			$rendering |
    			Set-RenderingParameter -Parameter $parameters |
    			Set-Rendering -Item $item -FinalLayout
    
    			$updatedParams = Get-RenderingParameter -Rendering $rendering
    			$variant = $updatedParams["Variant"]
    
    			Write-Host "Item: $path variant has been updated to: $variant"
    		}
    	}
        $i++
    	Write-Warning "Procceded: $i"
    } 
