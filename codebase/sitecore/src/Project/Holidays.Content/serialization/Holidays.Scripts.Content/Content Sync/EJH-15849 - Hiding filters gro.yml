Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15849 - Hiding filters group in UI"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Rename Facility Headers to Facilities Filter Groups
    $facilityGroupFolder = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Data/*[@@templateid='{327E2D6C-4F48-45AA-A944-97B7483EF8BE}']"
    $facilityGroupFolder.Editing.BeginEdit();
    $facilityGroupFolder.Name = "Facilities Filter Groups";
    $facilityGroupFolder.Editing.EndEdit();
    
    #Update Filter setting
    $filterSetting = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Filter Settings"
    $filterSetting.Editing.BeginEdit();
    
    $filterSetting['ShowFacilityFilterGroupList'] = ""
    $filterSetting["IsPublic"] = "1"
    
    $facilitiesGroups = $facilityGroupFolder.Children | Where-Object Name -ne "Environmental"
    foreach($facilitiesGroupItem in $facilitiesGroups) { 
        if (![string]::IsNullOrEmpty($filterSetting['ShowFacilityFilterGroupList'])) {
            $filterSetting['ShowFacilityFilterGroupList'] += "|";
        }
        $filterSetting['ShowFacilityFilterGroupList'] += $facilitiesGroupItem.ID.ToString()
    } 
    
    
    $filterSetting.Editing.EndEdit();
    
    
    
