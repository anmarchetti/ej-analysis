SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Update "Profile > Logged In" icon
    $itemPath = "master:/sitecore/content/EasyJet/TradePortal/Data/Navigations/Button/Profile Logged In"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["Image"] = '<image mediaid="{0D82D124-C499-4A9E-9D43-1ED40D1614EF}" />'
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    # Update Trade Logo
    $slimHeaderPath = "master:/sitecore/content/EasyJet/TradePortal/Data/Navigations/Headers/Slim Header"
    $fullHeaderPath = "master:/sitecore/content/EasyJet/TradePortal/Data/Navigations/Headers/Full Header"
    
    $slimHeader = Get-Item -path $slimHeaderPath -ErrorAction SilentlyContinue
    $fullHeader = Get-Item -path $fullHeaderPath -ErrorAction SilentlyContinue
    
    if ($slimHeader -ne $null) {
        $slimHeader.Editing.BeginEdit()
        $slimHeader["TradeLogo"] = '<image mediaid="{06169F1C-C901-4E3F-BBB3-91D192E75A02}" />'
        $slimHeader.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $slimHeader.Name "successfully updated"
    }
    
    if ($fullHeader -ne $null) {
        $fullHeader.Editing.BeginEdit()
        $fullHeader["TradeLogo"] = '<image mediaid="{06169F1C-C901-4E3F-BBB3-91D192E75A02}" />'
        $fullHeader.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $fullHeader.Name "successfully updated"
    }
