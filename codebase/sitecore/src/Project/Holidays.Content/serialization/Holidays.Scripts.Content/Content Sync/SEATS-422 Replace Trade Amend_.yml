Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SEATS-422 Replace Trade Amend Payment Page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Remove old page
    $oldItemPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment"
    $item = Get-Item -Path $oldItemPath -ErrorAction SilentlyContinue
    if ($item -ne $null){
        $item | Remove-Item -Recurse -Permanently
        Write-Host "Item" $item.Name "successfully removed"
    }
    
    # Add page with new template
    $itemPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment"
    $itemTemplateId = "{0487d358-37f1-40be-ab4f-99c9a9dc9f21}"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    if ($item -eq $null) {
        $item = New-Item -Path $itemPath -ItemType $itemTemplateId
        Write-Host "Item" $item.Name "successfully created"
    }
    
    # Add Page Components
    $pageComponentsPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components"
    $pageComponentsTemplateId = "{577146F6-301B-4514-BF73-D6E73E337452}"
    $pageComponents = Get-Item -path $pageComponentsPath -ErrorAction SilentlyContinue
    if ($pageComponents -eq $null) {
        $pageComponents = New-Item -Path $pageComponentsPath -ItemType $pageComponentsTemplateId
        Write-Host "Item" $pageComponents.Name "successfully created"
    }
    
    # Add Datasources with values
    # Add Amend Payment Header
    $amendPaymentHeaderPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Header"
    $amendPaymentHeaderTemplateId = "{3B35DE07-2FCA-418F-8E18-D9A0C5D02D55}"
    $amendPaymentHeader = Get-Item -path $amendPaymentHeaderPath -ErrorAction SilentlyContinue
    if ($amendPaymentHeader -eq $null) {
        $amendPaymentHeader = New-Item -Path $amendPaymentHeaderPath -ItemType $amendPaymentHeaderTemplateId
        Write-Host "Item" $amendPaymentHeader.Name "successfully created"
        
        $amendPaymentHeader.Editing.BeginEdit()
        $amendPaymentHeader["PayTitle"] = "Confirm & pay"
        $amendPaymentHeader["RefundTitle"] = "Confirm refund"
        $amendPaymentHeader.Editing.EndEdit() | Out-Null
        Write-Host "Item" $amendPaymentHeader.Name "successfully updated"
    }
    # Add Amend Payment Summary Trade
    $amendPaymentSummaryTradePath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Summary Trade"
    $amendPaymentSummaryTradeTemplateId = "{71D4C9D6-9F67-4651-8324-5EBA7D538EF9}"
    $amendPaymentSummaryTrade = Get-Item -path $amendPaymentSummaryTradePath -ErrorAction SilentlyContinue
    if ($amendPaymentSummaryTrade -eq $null) {
        $amendPaymentSummaryTrade = New-Item -Path $amendPaymentSummaryTradePath -ItemType $amendPaymentSummaryTradeTemplateId
        Write-Host "Item" $amendPaymentSummaryTrade.Name "successfully created"
        
        $amendPaymentSummaryTrade.Editing.BeginEdit()
        $amendPaymentSummaryTrade["TotalCost"] = "Total cost"
        $amendPaymentSummaryTrade["ConfirmRefund"] = "Get refund"
        $amendPaymentSummaryTrade["ConfirmChanges Label"] = "Confirm changes"
        $amendPaymentSummaryTrade["AdditionalCost"] = "Additional cost"
        $amendPaymentSummaryTrade.Editing.EndEdit() | Out-Null
        Write-Host "Item" $amendPaymentSummaryTrade.Name "successfully updated"
    }
    # Add Amend Item Info
    $amendItemInfoPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Item Info"
    $amendItemInfoTemplateId = "{D5D8F8FC-FA15-43ED-B338-E21B7478AAAA}"
    $amendItemInfo = Get-Item -path $amendItemInfoPath -ErrorAction SilentlyContinue
    if ($amendItemInfo -eq $null) {
        $amendItemInfo = New-Item -Path $amendItemInfoPath -ItemType $amendItemInfoTemplateId
        Write-Host "Item" $amendItemInfo.Name "successfully created"
        
        $amendItemInfo.Editing.BeginEdit()
        $amendItemInfo["Title"] = "Your new selection"
        $amendItemInfo["Subtitle"] = "Please check the details of your new selection carefully."
        $amendItemInfo["AmountText"] = "Amount"
        $amendItemInfo["RefundText"] = "Refund amount"
        $amendItemInfo["NewAmendment"] = "New"
        $amendItemInfo["PrevAmendment"] = "Previous"
        $amendItemInfo.Editing.EndEdit() | Out-Null
        Write-Host "Item" $amendItemInfo.Name "successfully updated"
    }
    # Add Seats Not Available Popup
    $seatsNotAvailablePopupPath = "master:/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Seats Not Available Popup"
    $seatsNotAvailablePopupTemplateId = "{1F96DD24-930E-4314-8E10-BCFD27315288}"
    $seatsNotAvailablePopup = Get-Item -path $seatsNotAvailablePopupPath -ErrorAction SilentlyContinue
    if ($seatsNotAvailablePopup -eq $null) {
        $seatsNotAvailablePopup = New-Item -Path $seatsNotAvailablePopupPath -ItemType $seatsNotAvailablePopupTemplateId
        Write-Host "Item" $seatsNotAvailablePopup.Name "successfully created"
        
        $seatsNotAvailablePopup.Editing.BeginEdit()
        $seatsNotAvailablePopup["Title"] = "There is a problem with your seats"
        $seatsNotAvailablePopup["Description"] = "One or more of the seats you have picked for your flights are now unavailable.<br /><br />You can choose other seats, or go back and view your holiday booking.<br /><br />You can reserve seats up to 30 days before departure date."
        $seatsNotAvailablePopup["ReselectSeatsButtonText"] = "Choose other seats"
        $seatsNotAvailablePopup["ClearSeatsButtonText"] = "Back to view booking"
        $seatsNotAvailablePopup.Editing.EndEdit() | Out-Null
        Write-Host "Item" $seatsNotAvailablePopup.Name "successfully updated"
    }
    
    # Set datasources for renderings
    function Update-Rendering-DataSource ($item,$renderingId,$placeHolder,$newDataSource) {
    	$rendering = Get-Rendering -Item $item -PlaceHolder $placeHolder | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
    
    	if ($rendering -ne $null) {
    		Set-Rendering -Item $item -Instance $rendering -DataSource $newDataSource
    	}
    }
    
    Update-Rendering-DataSource -Item $item -RenderingId "{491706BB-AF33-46EA-84CE-70FC10F99653}" -PlaceHolder "/body/component-wrapper-inner-{ccc913b8-b294-4339-a5cb-447bf58d8ad1}-0" -NewDataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Header"
    Update-Rendering-DataSource -Item $item -RenderingId "{DB2BA5D7-CAAE-4F2B-ABF3-D74925FA31BB}" -PlaceHolder "/body/component-wrapper-inner-{ccc913b8-b294-4339-a5cb-447bf58d8ad1}-0" -NewDataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Item Info"
    Update-Rendering-DataSource -Item $item -RenderingId "{2757EE1B-1E83-4D6C-84D9-C3BAC94308B9}" -PlaceHolder "/body/component-wrapper-inner-{ccc913b8-b294-4339-a5cb-447bf58d8ad1}-0" -NewDataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Amend Payment Summary Trade"
    Update-Rendering-DataSource -Item $item -RenderingId "{7910DC7C-14B7-48F1-9256-C570F700F085}" -PlaceHolder "/body/component-wrapper-inner-{ccc913b8-b294-4339-a5cb-447bf58d8ad1}-0/seats-and-bags-{2efc5e79-1290-4a3d-a8be-c0fe374fcdfe}-0" -NewDataSource "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags"
    Update-Rendering-DataSource -Item $item -RenderingId "{8AE530B1-7702-48B7-A4B9-442E50845EFA}" -PlaceHolder "body" -NewDataSource "/sitecore/content/EasyJet/TradePortal/Home/Booking/Amend Payment/Page Components/Seats Not Available Popup"
    
    # Add template to Slim Page Design
    $pageDesign = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Presentation/Page Designs/Slim Design"
    if ($pageDesign -ne $null) {
    	[Sitecore.Data.Fields.MultilistField]$linksField = $pageDesign.Fields["PageTemplates"];
    
    	$pageDesign.Editing.BeginEdit();
    	$linksField.add("{0487D358-37F1-40BE-AB4F-99C9A9DC9F21}");
    	$pageDesign.Editing.EndEdit() | Out-Null;
    	
        Write-Host "Design added"
    }
