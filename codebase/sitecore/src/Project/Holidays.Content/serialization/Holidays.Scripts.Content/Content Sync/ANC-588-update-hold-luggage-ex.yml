- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function updateHoldLuggage($path) {
    	$holdLuggageItem  = Get-Item -Path $path -ErrorAction SilentlyContinue
    
    	if ($luggageSettings -eq $null){
    	   Write-Host "Start updating Sport Description Hold Luggage"
    
    	   $holdLuggageItem.Editing.BeginEdit()
    	   
    	   $holdLuggageItem.Fields["BagExtraSportDescription"].Value = "<p>All hold luggage is applicable to both outbound and return flights.</p>"
    
    	   $holdLuggageItem.Editing.EndEdit() | Out-Null
    	   
    	   Write-Host "Updated Hold Luggage"
    	}
    }
    
    updateHoldLuggage -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage"
    updateHoldLuggage -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal"
    
    Write-Host "Script is completed"
    
