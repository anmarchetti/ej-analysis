- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $hotelDetailsItem = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Hotel Details"
    
    if($hotelDetailsItem -ne $null)
    {
        $hotelDetailsItem.Editing.BeginEdit()
    	$hotelDetailsItem."TrackingGoal" = "{DA0FE302-6AED-49A2-9C7A-622D3E6C98F3}"
    	$hotelDetailsItem."ShouldTrackUrl" = 1 
    	$hotelDetailsItem.Editing.EndEdit() > $null
    	Write-Host "Set hotel details page tracking goal and should track url values"
    }
    
    $geustDetailsItem = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details"
    
    if($geustDetailsItem -ne $null -and $geustDetailsItem.Fields["__Tracking"].Value -notlike "*event*")
    {
        $geustDetailsItem.Editing.BeginEdit()
        $geustDetailsItem.Fields["__Tracking"].Value = "<tracking><event id=""{6832464E-097C-4BC2-A5A7-101F545936D0}"" name=""Guest Details"" /></tracking>"   
    	$geustDetailsItem.Editing.EndEdit() > $null
    	Write-Host "Updated Guest Details Page's goal"
    }
    
    $bookingConformationPage = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation"
    
    if($bookingConformationPage -ne $null -and $bookingConformationPage.Fields["__Tracking"].Value -notlike "*event*")
    {
    	$bookingConformationPage.Editing.BeginEdit()
    	$bookingConformationPage.Fields["__Tracking"].Value = "<tracking><event id=""{89CCF381-B482-45C1-8A3D-34A740973DB3}"" name=""Booking Confirmation"" /></tracking>"
    	$bookingConformationPage.Editing.EndEdit() > $null
        Write-Host "Updated Booking conformation page's goal"
    }
    
    
