  Hint: Script
  Value: |
    #Update Amend Passengers Attention Item
    $amendPassengersAttentionMessagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Attention Passengers Count Change Message";
    $amendPassengersAttentionMessageItem =  Get-Item -Path $amendPassengersAttentionMessagePath;
    if ($amendPassengersAttentionMessageItem -ne $null) {
    	$amendPassengersAttentionMessageItem.Editing.BeginEdit();
    	
        $amendPassengersAttentionMessageItem["Description"]="On this page, you can make one free of charge change of up to three characters to the full names of anyone on your booking (excluding the lead passenger). If you need to change more than {amount} characters, or want to add or remove anyone from your booking, please get in touch with our team.";
    	
    	Write-Host $amendPassengersAttentionMessageItem.Name "Updated";
        $amendPassengersAttentionMessageItem.Editing.EndEdit() | Out-Null;
    }
