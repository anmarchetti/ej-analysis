  Hint: Script
  Value: |
    $slimHeaderPartialDesignPath = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs/Slim Header"
    $noFooterPageDesignName = "No Footer Design"
    $designsPath = "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs"
    $partialDesignTemplateId = "{4B960AA8-24C3-4A4E-A27F-F4718D189EF6}"
    $genericPageSlimTemplateId = "{CFA7AD4C-85E5-40CF-BAED-99F81BDB856A}"
    
    function Create-Or-Update($path, $name, $templateId, $pageTemplateId, $partialDesignId)
    {
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null)
        {
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
        
        $item.Editing.BeginEdit()
        $item["PartialDesigns"] = $partialDesignId
        $item["PageTemplates"] = $pageTemplateId
        $item.editing.EndEdit() > $null
    }
    
    $slimHeaderPartialDesign = Get-Item -Path $slimHeaderPartialDesignPath -ErrorAction SilentlyContinue
    Create-Or-Update -Path $designsPath -Name $noFooterPageDesignName -TemplateId $partialDesignTemplateId -PageTemplateId $genericPageSlimTemplateId -PartialDesignId $slimHeaderPartialDesign.Id
