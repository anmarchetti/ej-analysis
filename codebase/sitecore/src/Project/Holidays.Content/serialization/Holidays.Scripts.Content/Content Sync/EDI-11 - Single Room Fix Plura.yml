- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Room-Types-Datasource($path, $field, $value) {
        $item = Get-Item -Database "master" -path $path"/Page Components/Room Types" -ErrorAction SilentlyContinue
    
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$field] = $value
            $item.Editing.EndEdit()
            
            Write-Host "Item" $item.Name "successfully updated"
        }
    }
    
    function Update-Dictionary($itemPath, $value) {
    	$item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    	if ($item -ne $null) {
    		$item.Editing.BeginEdit()
    		$item["Phrase"] = $value
    		$item.Editing.EndEdit() | Out-Null
    
    		Write-Host "Dictionary" $item.DisplayName "successfully updated"
    	}
    }
        
    # Update Trade Portal Dictionary   
    Update-Dictionary -ItemPath '/sitecore/content/EasyJet/TradePortal/Dictionary/Room Types/Buttons/Show More' -Value "See alternative rooms"
    Update-Dictionary -ItemPath '/sitecore/content/EasyJet/TradePortal/Dictionary/Room Types/Buttons/Show Less' -Value "Hide alternative rooms"
    
    # Update Room Types Datasources Holidays
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details" -Field "TitleNextToSelectedRoomSingular" -Value "{number} Other room available"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details" -Field "TitleNextToSelectedRoomPlural" -Value "{number} Other rooms available"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/Holidays/Home/Booking" -Field "TitleNextToSelectedRoomSingular" -Value "Select another room"
    
    # Update Room Types Datasources Trade Portal
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details" -Field "TitleNextToSelectedRoomSingular" -Value "{number} Other room available"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details" -Field "TitleNextToSelectedRoomPlural" -Value "{number} Other rooms available"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking" -Field "TitleNextToSelectedRoomSingular" -Value "Select another room"
    
