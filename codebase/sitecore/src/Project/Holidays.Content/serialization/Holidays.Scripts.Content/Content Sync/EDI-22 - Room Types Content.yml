- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-Room-Types-Datasource($path) {
        $item = Get-Item -Database "master" -path $path"/Page Components/Room Types" -ErrorAction SilentlyContinue
    
        if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Title"] = "Your room"
            $item["Description"] = "Best room choice according to your selected duration and dates"
            $item["TitleMobile"] = "Change your Room"
            $item["DescriptionMobile"] = "Fancy an upgrade? Here’s all our available room alternatives at this hotel."
            $item.Editing.EndEdit()
            
            Write-Host "Item" $item.Name "successfully updated"
        }
    }
    
    # Update Room Types Datasources Holidays
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/Holidays/Home/Booking"
    
    # Update Room Types Datasources Trade Portal
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details"
    Update-Room-Types-Datasource -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking"
