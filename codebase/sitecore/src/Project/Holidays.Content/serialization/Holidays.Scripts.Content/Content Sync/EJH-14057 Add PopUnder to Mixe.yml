Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-14057 Add PopUnder to MixedResultList page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    function Update-Pop-Under () {
    	$popUnder.Editing.BeginEdit()
    	$popUnder["Title"] = 'Searching for flights? How about a holiday';
    	$popUnder["Description"] = 'ATOL protected and covered by our industry leading Protection Promise';
    	$popUnder["OfferOptions"] = [string]::Join("|",($popUnder.Children | Select-Object -ExpandProperty Id));
    	$popUnder["ButtonText"] = 'See holidays';
    	$popUnder["BottomMark"] = '*On selected holidays';
    	$popUnder["Image"] = '<image mediaid="{1ED9E6B0-30C3-4E56-BDFC-FE79FDD56B5D}" />';
    	$popUnder["TextBeforeNumber"] = 'Book today for just';
    	$popUnder["NumberValue"] = '£60';
    	$popUnder["TextAfterNumber"] = 'pp';
    	$popUnder.Editing.EndEdit() | Out-Null
    }
    
    function Update-View-Booking-Renderings () {
    	$popUnderRendering = Get-Rendering -Item $mixedResultListPage | Where-Object { $_.ItemID -eq $popUnderRenderingId } | Select -First 1;
    
    	if (($popUnderRendering -eq $null) -and ($popUnder -ne $null)) {
    		$renderingInstance = Get-Item -Path "master:" -Id $popUnderRenderingId | New-Rendering;
    		$popUnderPlaceholder = '/body';
    		Add-Rendering -Item $mixedResultListPage -PlaceHolder $popUnderPlaceholder -Instance $renderingInstance -DataSource $popUnder.ID;
    		$privacyBookingRendering = Get-Rendering -Item $mixedResultListPage -PlaceHolder $popUnderPlaceholder;
    
    		Write-Host "Pop Under added to MixedResultList page";
    	}
    }
    
    function Create-Item {
    	param($itemPath,$templateId)
    
    	$item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    	if ($item -eq $null) {
    		# create item 
    		$item = New-Item -Path $itemPath -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    }
    
    function Create-Icon-Tiles {
    	param($iconTileNames,$iconValues,$iconTemplateId,$parentPath)
    
    	for ($counter = 0; $counter -lt $iconTileNames.Length; $counter++) {
    		$iconPath = "$($parentPath)/$($iconTileNames[$counter])"
    		Create-Item -itemPath $iconPath -templateId $iconTemplateId
    		$iconItem = Get-Item -Path $iconPath
    
    		if ($iconItem -ne $null) {
    			$iconItem.Editing.BeginEdit()
    			$iconItem["TileText"] = $iconTileNames[$counter]
    			$iconItem["Icon"] = $iconValues[$counter]
    			$iconItem.Editing.EndEdit() | Out-Null
    		}
    	}
    }
    
    $pagePath = "master:/sitecore/content/EasyJet/Holidays/Home/MixedResultList";
    $mixedResultListPage = Get-Item -Path $pagePath -ErrorAction SilentlyContinue;
    
    $popUnderPath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components/Pop Under";
    $popUnderTemplateId = "{439B8ADB-C382-4F71-A49B-714910197C84}";
    $popUnder = Get-Or-Create-Item -Path $popUnderPath -templateId $popUnderTemplateId;
    $popUnderRenderingId = "{7DF04043-64C8-4CC5-A3CB-4F93E9E0C7B7}";
    
    $iconTemplateId = "{4BC7F67B-FB62-492E-ABD6-DC614AC865C4}"
    $iconTileNames = @( "Flights","23kg bags","Hotel","Transfer*")
    $iconValues = @( '<image mediaid="{74B949B3-D10A-4D8F-AFF8-1ECBB8720ADD}" />','<image mediaid="{4C737C4F-6119-42A2-BAFF-9D55154C54C4}" />','<image mediaid="{E911CEA6-41BE-4E52-B9DB-31B7E22A9847}" />','<image mediaid="{9A651704-AEEE-4A33-ABD8-A9C5E51E6276}" />')
    
    Create-Icon-Tiles -iconTileNames $iconTileNames -iconValues $iconValues -iconTemplateId $iconTemplateId -parentPath $popUnderPath
    
    
    Update-Pop-Under
    Update-View-Booking-Renderings 
