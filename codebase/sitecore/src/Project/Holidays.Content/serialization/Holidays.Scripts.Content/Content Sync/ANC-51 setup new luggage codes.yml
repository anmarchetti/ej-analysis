    ### TRANSLATIONS
    
    function Create-Lang-Version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    function Update-Luggage-Text($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
    }
    
    function Translate-Categories($rootPath) {
        $translations = @{
            "fr-CH" = @{
                "NameHL" = "Bagages de soute"
                "NameEHL" = "Bagages de soute supplémentaires"
                
            }
            "fr-FR" = @{
                "NameHL" = "Bagages de soute"
                "NameEHL" = "Bagages de soute supplémentaires"
                
            }
            "de-CH" = @{
                "NameHL" = "Aufgegebenes Gepäck"
                "NameEHL" = "Extra aufgegebenes Gepäck"
              
            }
            "de-DE" = @{
                "NameHL" = "Aufgegebenes Gepäck"
                "NameEHL" = "Extra aufgegebenes Gepäck"
               
            }
        }
    
        $path = $rootPath + '/Data/Luggage'
        $luggage = Get-Or-Create-Item -Path $path -Template $lugFolderTemplate
        
        $path = $rootPath + '/Data/Luggage/Hold Baggage'
        $holdBaggage = Get-Or-Create-Item -Path $path -Template $categoryTemplate
        
        $path = $rootPath + '/Data/Luggage/Extra Hold Luggage'
        $extraHoldLuggage = Get-Or-Create-Item -Path $path -Template $categoryTemplate
        
        foreach ($lang in $translations.Keys) {
            Create-Lang-Version -item $luggage -lang $lang
            Create-Lang-Version -item $holdBaggage -lang $lang -field "Name" -value $translations[$lang]["NameHL"]
            Create-Lang-Version -item $extraHoldLuggage -lang $lang -field "Name" -value $translations[$lang]["NameEHL"]
        }
    }
    
