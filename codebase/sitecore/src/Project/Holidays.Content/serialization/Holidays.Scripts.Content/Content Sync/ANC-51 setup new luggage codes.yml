    $luggageItemTemplate = '{41775FBB-D551-4813-B3D7-1BDC7C6DB534}'
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    ### FOLDER AND CATEGORIES
    
    function Update-Or-Create-Categories($rootPath) {
        $lugFolderTemplate = '{8434F506-C87F-4D50-AADA-F50D36E90BFC}'
        $categoryTemplate = '{928655D3-BFC1-4E24-99A5-096BE1B24D09}'
        
        $path =  $rootPath + '/Data/Luggage'
        $luggage = Get-Or-Create-Item -Path $path -Template $lugFolderTemplate
        
        $path =  $rootPath + '/Data/Luggage/Hold Baggage'
        $holdBaggage = Get-Or-Create-Item -Path $path -Template $categoryTemplate
        
        $holdBaggage.Editing.BeginEdit()
        $holdBaggage["Code"] = "BAGE"
        $holdBaggage["Type"] = "Bag"
        $holdBaggage["Name"] = "Hold Baggage"
        $holdBaggage.Editing.EndEdit() | Out-Null
        
        $path = $rootPath + '/Data/Luggage/Extra Hold Luggage'
        $extraHoldLuggage = Get-Or-Create-Item -Path $path -Template $categoryTemplate
        
        $extraHoldLuggage.Editing.BeginEdit()
        $extraHoldLuggage["Code"] = "ADDB"
        $extraHoldLuggage["Type"] = "Bag"
        $extraHoldLuggage["Name"] = "Extra Hold Luggage"
        $extraHoldLuggage.Editing.EndEdit() | Out-Null
        
        #Rename-Item -Item $extraHoldLuggage -NewName "Extra Hold Luggage"
        
        Write-Host $rootPath", Categories Added/Updated";
    }
    
    ### EXTRA
    
    function Rename-Update-Or-Create-Extra($rootPath) {
