        $extra15 = Get-Or-Create-Item -Path $path -Template $luggageItemTemplate
        
        $extra15.Editing.BeginEdit()
        $extra15["Code"] = "LUSE"
        $extra15["Name"] = "Extra 15kg Hold bag"
        $extra15["Description"] = "Maximum 15kg per bag, stored in the plane hold. Outbound and return."
        $extra15["Icon"] = '<image mediaid="{464888DB-56B8-4DFA-B6FB-182F7623CEF2}"/>'
        $extra15["IsLuggageItemEnabled"] = "1"
        $extra15.Name = "Extra Hold Baggage 15kg"
        $extra15.Editing.EndEdit() | Out-Null
        
        #Rename-Item -Item $extra15 -NewName "Extra Hold Baggage 15kg"
        
        $path = $rootPath + '/Data/Luggage/Extra Hold Luggage/Hold Baggage 23kg'
        $extra23 = Get-Or-Create-Item -Path $path -Template $luggageItemTemplate
        
        $extra23.Editing.BeginEdit()
        $extra23["Code"] = "LUGE"
        $extra23["Name"] = "Extra 23kg Hold bag"
        $extra23["Description"] = "Maximum 23kg per bag, stored in the plane hold. Outbound and return."
        $extra23["Icon"] = '<image mediaid="{84AAE8B3-0139-4B87-BB0F-76EB2279CFD9}"/>'
        $extra23["IsLuggageItemEnabled"] = "1"
        $extra23.Name = "Extra Hold Baggage 23kg"
        $extra23.Editing.EndEdit() | Out-Null
        
        #Rename-Item -Item $extra23 -NewName "Extra Hold Baggage 23kg"
        
        Write-Host $rootPath", Extra Added/Updated";
    }
    
