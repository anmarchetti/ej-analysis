Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUXE-886 Update sitemap sections per market"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $sitemapItemPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap"
    
    $sitemapBlockPath = "/sitecore/content/EasyJet/Holidays/Home/Sitemap/Page Components"
    $sitemapBlockItemName = "Sitemap Block"
    $sitemapBlockItemPath = "$($sitemapBlockPath)/$sitemapBlockItemName"
    
    $textBlocksItemName = "Text Blocks"
    $textBlocksItemPath = "$($sitemapBlockPath)/$textBlocksItemName"
    
    $textBlocksSitemapItemName = "Sitemap"
    $textBlocksSitemapItemPath = "$($textBlocksItemPath)/$textBlocksSitemapItemName"
    
    function Get-Section($section) {
        $item = Get-Item "$($sitemapBlockItemPath)/$section" -ErrorAction SilentlyContinue
        
        if ($item -eq $null) {
            Write-Host "Couldn't find section: " $itemPath
        }
        
        return $item
    }
    function Update-SitemapItem($language) {
        $sitemapItem = Add-ItemVersion -Path $sitemapItemPath -IfExist Skip -TargetLanguage $language -Language "en"
    
        $sitemapItem.Editing.BeginEdit()
        $sitemapItem["Name"] = "Sitemap"
        $sitemapItem["Metadata Title"] = "Sitemap"
        $sitemapItem["Tracking Page Title"] = "Sitemap"
        $sitemapItem.Editing.EndEdit() | Out-Null
    }
    function Update-SitemapBlockItem($language, $sections) {
        $item = Add-ItemVersion -Path $sitemapBlockItemPath -IfExist Skip -TargetLanguage $language -Language "en"
        
        $item.Editing.BeginEdit()
        $item["Sections"] = $sections
        $item.Editing.EndEdit() | Out-Null
    }
    function Update-TextBlocksItem($language) {
        Add-ItemVersion -Path $textBlocksItemPath -IfExist Skip -TargetLanguage $language -Language "en" | Out-Null
    }
    function Update-TextBlocksSitemapItem($language) {
        $item = Add-ItemVersion -Path $textBlocksSitemapItemPath -IfExist Skip -TargetLanguage $language -Language "en"
    
        $item.Editing.BeginEdit()
        $item["Title"] = "Sitemap"
        $item.Editing.EndEdit() | Out-Null
    }
    function Update-SitemapBlockItemSection($section, $language, $title, $pages, $pageTemplates) {
        $item = Add-ItemVersion -Path "$($sitemapBlockItemPath)/$section" -IfExist Skip -TargetLanguage $language -Language "en"
    
        $item.Editing.BeginEdit()
        $item["Title"] = $title
        $item["Pages"] = $pages
        $item["Page Templates"] = $pageTemplates
        $item.Editing.EndEdit() | Out-Null
    }
    
    $countries = Get-Section -Section "Countries"
    $regions = Get-Section -Section "Regions"
    $resorts = Get-Section -Section "Resorts"
    $deals = Get-Section -Section "Deals"
    $holidayTypes = Get-Section -Section "Holiday Types"
    $helpfulLinks = Get-Section -Section "Helpful links"
    
    @("fr-CH", "de-CH", "fr-FR", "de-DE") | ForEach-Object {
        Update-SitemapItem -Language $_
        Update-TextBlocksItem -Language $_
        Update-TextBlocksSitemapItem -Language $_
    }
    
    Update-SitemapBlockItem -Language "en" -Sections "$($countries.Id)|$($regions.Id)|$($resorts.Id)|$($deals.Id)|$($holidayTypes.Id)|$($helpfulLinks.Id)"
    Update-SitemapBlockItem -Language "fr-CH" -Sections "$($countries.Id)|$($regions.Id)|$($resorts.Id)|$($holidayTypes.Id)|$($helpfulLinks.Id)"
    Update-SitemapBlockItem -Language "de-CH" -Sections "$($countries.Id)|$($regions.Id)|$($resorts.Id)|$($holidayTypes.Id)|$($helpfulLinks.Id)"
    Update-SitemapBlockItem -Language "fr-FR" -Sections "$($countries.Id)|$($regions.Id)|$($resorts.Id)|$($holidayTypes.Id)|$($helpfulLinks.Id)"
    Update-SitemapBlockItem -Language "de-DE" -Sections "$($countries.Id)|$($regions.Id)|$($resorts.Id)|$($holidayTypes.Id)|$($helpfulLinks.Id)"
    
    @(
        @{
            section       = "Countries";
            titleFR       = "Pays";
            titleDE       = "Länder";
            pages         = "";
            pageTemplates = "{5F03C6EF-EF52-4F2E-BC5A-B1F065A1E745}"
        },
        @{
            section       = "Regions";
            titleFR       = "Régions";
            titleDE       = "Regionen";
            pages         = "";
            pageTemplates = "{2F42EC14-7E56-467A-B300-AB9723C74546}|{799ECB20-C605-4A6C-A32B-27222BDBB91E}"
        },
        @{
            section       = "Resorts";
            titleFR       = "Stations balnéaires";
            titleDE       = "Erholungsorte";
            pages         = "";
            pageTemplates = "{538939B3-07EC-4C23-BF8C-3A68DE0FDC93}"
        },
        @{
            section = "Holiday Types";
            titleFR = "Types de vacances";
            titleDE = "Urlaubsarten";
            pages = "";
            pageTemplates = "{C6C7FCEF-96CD-4D17-81C1-80CDA7873612}"
        },
        @{
            section = "Helpful links";
            titleFR = "Liens utiles";
            titleDE = "Hilfreiche Links";
            pages = "{025A25A5-147A-4240-AC44-06DA980D41FD}|{725A5D37-ACDD-41BB-94E7-EB828BEA2CC5}|{E59FBE6D-763B-4B9D-B8DD-172C42977FC4}|{01FA2D69-2BB3-4BA9-B98D-15DA2DF1D8AC}|{5647B61B-ABC7-46AF-9721-F4AFB9DC1642}|{AE1799B7-8B9A-49E5-9998-97F89EFFEB88}|{8736E068-1634-4EC5-8D1C-3773598D00F5}";
            pageTemplates = ""
        } 
    ) | ForEach-Object { 
        Update-SitemapBlockItemSection -Section $_.section -Language "fr-CH" -Title $_.titleFR -Pages $_.pages -PageTemplates $_.pageTemplates
        Update-SitemapBlockItemSection -Section $_.section -Language "fr-FR" -Title $_.titleFR -Pages $_.pages -PageTemplates $_.pageTemplates
        Update-SitemapBlockItemSection -Section $_.section -Language "de-CH" -Title $_.titleDE -Pages $_.pages -PageTemplates $_.pageTemplates
        Update-SitemapBlockItemSection -Section $_.section -Language "de-DE" -Title $_.titleDE -Pages $_.pages -PageTemplates $_.pageTemplates
    }
