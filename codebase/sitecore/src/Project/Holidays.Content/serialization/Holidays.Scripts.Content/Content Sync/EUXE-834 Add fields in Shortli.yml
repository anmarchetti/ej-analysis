Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUXE-834 Add fields in Shortlists for Redirect Popup"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $fieldValuePairs) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($fieldValuePairs -ne $null) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            foreach ($pair in $fieldValuePairs.GetEnumerator()) {
                $targetLangItem[$pair.Key] = $pair.Value
            }
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $fieldsValuesEN = @{
        "RedirectTitle" = "Change country?"
        "RedirectDescription" = "This holiday is available on&nbsp;<strong>easyjet.com/{market}.</strong>&nbsp;Change countries and continue?"
        "RedirectButtonLabel" = "Change country"
    }
    $fieldsValuesDE = @{
        "RedirectTitle" = "Land ändern?"
        "RedirectDescription" = "Dieses Urlaubsangebot ist auf&nbsp;<strong>easyjet.com/{market}</strong>&nbsp;verf&uuml;gbar. Land &auml;ndern und fortsetzen?"
        "RedirectButtonLabel" = "Land ändern"
    }
    $fieldsValuesFR = @{
        "RedirectTitle" = "Changer de pays ?"
        "RedirectDescription" = "Ces vacances sont disponibles sur&nbsp;<strong>easyjet.com/{market}.</strong>&nbsp;Changer de pays et continuer?"
        "RedirectButtonLabel" = "Changer de pays"
    }
    
    $ShortlistItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Shortlists"
    
    @('en') | % {
        Create-Lang-Version -Item $ShortlistItem -Lang $_ -FieldValuePairs $fieldsValuesEN
    }
    @('de-CH', 'de-DE') | % {
        Create-Lang-Version -Item $ShortlistItem -Lang $_ -FieldValuePairs $fieldsValuesDE
    }
    @('fr-CH', 'fr-FR') | % {
        Create-Lang-Version -Item $ShortlistItem -Lang $_ -FieldValuePairs $fieldsValuesFR
    }
    
