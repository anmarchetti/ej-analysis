Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Move Persistent Info Banner to the Home top
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item "/sitecore/content/EasyJet/Holidays/Home" -ErrorAction SilentlyContinue;
    $renderingId = "{CFDDA56D-9D28-45DE-BED6-FF67AC4C38B5}"
    $position = 0;
    
    $renderingItem = Get-Rendering -Item $item | Where-Object {$_.ItemId -eq $renderingId}
    
    if($renderingItem -ne $null){
        Set-Rendering -Item $item -Instance $renderingItem -Index $position
        Write-Host "Successfully set to" $position "position"
    } else {
        Write-Host "Rendering wasn't found"
    }
    
