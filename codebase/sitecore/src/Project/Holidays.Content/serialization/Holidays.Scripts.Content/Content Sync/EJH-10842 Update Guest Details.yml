- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $path= "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components/Guest Details With Sigin In Prompt";
    $path2 = "/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details/Page Components/Guest Details Info";
    $item= Get-Item -Path $path -ErrorAction SilentlyContinue;
    $item2 = Get-Item -Path $path2 -ErrorAction SilentlyContinue;
    
    $errorMessage = @"
    <span>Your password must be:</span>
    <ul>
        <li>A single word between 10-20 characters</li>
        <li>You can use letters, numbers & special characters (except # & + = or space)</li>
        <li>You must use at least 1 number, 1 lowercase letter & 1 uppercase letter</li>
        <li>It cannot start with a 0</li>
    </ul>
    "@;
    $tooltipMessage = @"
    <ul>
         <li>A single word between 10-20 characters</li>
        <li>You can use letters, numbers & special characters (except # & + = or space)</li>
        <li>You must use at least 1 number, 1 lowercase letter & 1 uppercase letter</li>
        <li>It cannot start with a 0</li>
    </ul>
    "@
    
    if ($item-ne $null) {
        $item.Editing.BeginEdit()
        $item.Fields["PasswordErrorMessage"].Value = $errorMessage
        $item.Fields["PasswordTooltip"].Value = $tooltipMessage
        $item.Editing.EndEdit()
    }
    
    if ($item2-ne $null) {
        $item2.Editing.BeginEdit()
        $item2.Fields["PasswordErrorMessage"].Value = $tooltipMessage
        $item2.Fields["PasswordTooltip"].Value = $tooltipMessage
        $item2.Editing.EndEdit()
    }
    
    Write-Host "Script is completed"
    
    
    
