Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-594 hold luggage selected update"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Edit-Data-Source ($dataSourcePath, $bagsPath){
        # Get data source
        $dataSource = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
        
        $holdBagsPath = $bagsPath + 'Hold Baggage';
        $bags = Get-ChildItem -Path $holdBagsPath;
        $holdLuggageItems = ($bags | select -ExpandProperty Id) -join "|"
        
        $largeSportPath = $bagsPath + 'Large Sports Equipment';
        $largeSport = Get-ChildItem -Path $largeSportPath;
        $largeSportItems = ($largeSport | select -ExpandProperty Id) -join "|"
        
        $smallSportPath = $bagsPath + 'Small Sports Equipment';
        $smallSport = Get-ChildItem -Path $smallSportPath;
        $smallSportItems = ($smallSport | select -ExpandProperty Id) -join "|"
        
        # update data source
        if ($dataSource -ne $null) {
            $dataSource.Editing.BeginEdit()
            $dataSource["EditLabel"] = "Edit";
    	    $dataSource["HoldLuggageItems"] = $holdLuggageItems;
    	    $dataSource["SportDescription"] = "Stored in the plane hold. Outbound and return.";
    	    $dataSource["SportEquipmentIcon"] = '<image mediaid="{1810E659-2B73-4DC1-80A8-40A2B4E604E7}" />';
    	    $dataSource["SportTitle"] = "Sports equipment";
    	    $dataSource["SportsEquipmentItems"] = $largeSportItems + '|' + $smallSportItems;
            $dataSource.Editing.EndEdit() | Out-Null
            Write-Host $dataSource.Name "is updated";
        }
    
    }
    
    # Holidays
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage' -bagsPath '/sitecore/content/EasyJet/Holidays/Data/Luggage/' 
    
    # Trade
    Edit-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal' -bagsPath '/sitecore/content/EasyJet/TradePortal/Data/Luggage/'
    
