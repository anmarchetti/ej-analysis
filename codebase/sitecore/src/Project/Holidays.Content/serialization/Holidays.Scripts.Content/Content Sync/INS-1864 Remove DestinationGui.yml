Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1864 Remove DestinationGuide Usage"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $item = Get-Item "master:/sitecore/content/EasyJet/Holidays/Home/Destinations/Egypt/Sharm el Sheikh"
    
    $renderingId = "{BB8E926A-67A8-41BB-84F4-367CF51B0322}"
    
    $renderings = Get-Rendering -Item $item
    
    $toRemove = $renderings | Where-Object {
        $_.RenderingID -eq $renderingId
    }
    
    if ($toRemove) {
        foreach ($rendering in $toRemove) {
            Remove-Rendering -Item $item -Instance $rendering
        }
    
        Write-Host "Removed $($toRemove.Count) rendering(s) from $($item.Paths.FullPath)"
    }
    else {
        Write-Host "Rendering not found."
    }
