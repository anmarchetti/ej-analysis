Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-9001 Set package icons names"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $iconsFolder = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Package Icons" -ErrorAction SilentlyContinue
    
    if ($iconsFolder -ne $null) {
    	$icons = Get-ChildItem -Item $iconsFolder -Recurse | Where-Object { $_.TemplateId -eq "{DA4503C0-8D8E-4BFB-AC90-EE9707CE5EF7}" }
    
    	foreach ($iconItem in $icons) {
    		$iconItem.Editing.BeginEdit()
    		$iconItem["Name"] = $iconItem["Type"]
    		$iconItem.Editing.EndEdit()
    	}
    } 
