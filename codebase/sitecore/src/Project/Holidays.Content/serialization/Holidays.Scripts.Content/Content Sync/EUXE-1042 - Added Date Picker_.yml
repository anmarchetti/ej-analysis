- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId,$itemId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId -ForceId $itemId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    
    $date = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration/Page Components" -ItemName "Date Picker Tab" -TemplateId "{02A07100-D247-414D-AB60-C44B714A6C5C}"
    $date.Editing.BeginEdit()
    $date["QuestionTitle"] = "When do you want to go?"
    $date["Subtitle"] = "Choose your departure and return dates."
    $date["FlexibleDatesLabel"] = "Are you flexible with your travel dates?"
    $date["SelectedDatesLabel"] = "{numberSelected} nights selected"
    $date["ProgressBarTitle"] = "Dates"
    $date.Editing.EndEdit() | Out-Null
    
    # Update Rendering
    $page = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Holiday Inspiration"
    $dateItem = Get-Item -Path "master:" -Id "{E6FBD7F1-5D54-4819-BF17-F816D361FF5D}"
    $datePicker = Get-Rendering -Item $page -PlaceHolder "*body*" -Rendering $dateItem
    if ($datePicker -ne $null) {
    	Set-Rendering -Item $page -Instance $datePicker -DataSource $date.ID
    	Write-Host $page.Name "Date Picker Tabs Rendering successfully updated"
    }
    
    
