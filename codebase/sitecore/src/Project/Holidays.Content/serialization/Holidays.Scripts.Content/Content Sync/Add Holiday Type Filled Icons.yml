- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Update-FilledIcon($item, $icon){
        $item.Editing.BeginEdit();
        $item["FilledIcon"] = "<image mediaid='$($icon.ID)'/>";
        $item.Editing.EndEdit() | Out-Null
        Write-Host $item.Name "updated"
    }
    
    # Adults Holiday Type
    $adultsTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/City/Adults" -ErrorAction SilentlyContinue
    $adultsFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Adults only-lined" -ErrorAction SilentlyContinue
    if($adultsFilledIcon -ne $null -And $adultsTypeItem -ne $null){
        Update-FilledIcon -Item $adultsTypeItem -Icon $adultsFilledIcon
    }
    
    # Boutique Holiday Type
    $boutiqueTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/Beach/Boutique" -ErrorAction SilentlyContinue
    $boutiqueFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Boutique" -ErrorAction SilentlyContinue
    if($boutiqueFilledIcon -ne $null -And $boutiqueTypeItem -ne $null){
        Update-FilledIcon -Item $boutiqueTypeItem -Icon $boutiqueFilledIcon
    }
    
    # Family Holiday Type
    $familyTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/City/Family" -ErrorAction SilentlyContinue
    $familyFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Family 2-filled" -ErrorAction SilentlyContinue
    if($familyFilledIcon -ne $null -And $familyTypeItem -ne $null){
        Update-FilledIcon -Item $familyTypeItem -Icon $familyFilledIcon
    }
    
    # Beach Luxury Holiday Type
    $luxuryTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/Beach/Luxury" -ErrorAction SilentlyContinue
    $luxuryFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Luxury" -ErrorAction SilentlyContinue
    if($luxuryFilledIcon -ne $null -And $luxuryTypeItem -ne $null){
        Update-FilledIcon -Item $luxuryTypeItem -Icon $luxuryFilledIcon
    }
    
    # City Luxury Holiday Type
    $luxuryTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/City/Luxury" -ErrorAction SilentlyContinue
    $luxuryFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Luxury" -ErrorAction SilentlyContinue
    if($luxuryFilledIcon -ne $null -And $luxuryTypeItem -ne $null){
        Update-FilledIcon -Item $luxuryTypeItem -Icon $luxuryFilledIcon
    }
    
    # Undiscovered Holiday Type
    $undiscoveredTypeItem = Get-Item "master:/content/EasyJet/Holidays/Data/Hotel Themes/City/Undiscovered" -ErrorAction SilentlyContinue
    $undiscoveredFilledIcon = Get-Item "/sitecore/media library/Project/Holidays/Default/Types Filled/Undiscovered" -ErrorAction SilentlyContinue
    if($undiscoveredFilledIcon -ne $null -And $undiscoveredTypeItem -ne $null){
        Update-FilledIcon -Item $undiscoveredTypeItem -Icon $undiscoveredFilledIcon
    }
