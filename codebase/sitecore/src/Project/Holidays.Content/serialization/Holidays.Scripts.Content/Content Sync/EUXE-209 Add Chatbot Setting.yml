  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    
    function Set-Settings ($path) {
    	$settings = Get-Or-Create-Item -Path $path -templateId "{5CBE4FA4-4128-45DE-9F5B-6BFB75DA74C1}"
    
    	$settings.Editing.BeginEdit();
    	$settings["IsChatbotEnabled"] = "1";
    	$settings.Editing.EndEdit();
    }
    
    Set-Settings -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Chatbot Settings" 
