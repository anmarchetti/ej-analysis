Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Virtual Region For Andalucia
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $virtualRegionTemplateId = "{9F623626-ED06-4E71-B4F3-4B75967B3DC8}"
    $virtualRegionsRegionsMapping = @{"Andalucia Virtual" = @(
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Costa Del Sol", 
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Costa De Almeria", 
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Seville", 
        "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain/Granada")}
    
    
    $pathToParent = "/sitecore/content/EasyJet/Holidays/Home/Destinations/Spain"
    
    $virtualSuffix = " Virtual"
    
    New-UsingBlock (New-Object Sitecore.SecurityModel.SecurityDisabler) {
        # Create virtual country items and set resorts to supplied items
        foreach($vc in $virtualRegionsRegionsMapping.GetEnumerator()){
            $pathToItem = Join-Path $pathToParent $vc.Name
    
            $item = Get-Item -Path $pathToItem
    
            if ($item -eq $null){
                $item = New-Item -Path $pathToItem -ItemType $virtualRegionTemplateId
            }
    
            $regionIds = @()
            foreach($regionPath in $vc.Value){
                $regionItem = Get-Item -Path $regionPath
    
                if ($regionItem -ne $null){
                    $regionIds += $regionItem.ID
                }
            }
    
            $item.Editing.BeginEdit()
            $item.Fields["Name"].Value = $vc.Name.Replace($virtualSuffix, "")
            $item.Fields["Regions"].Value = [system.String]::Join("|", $regionIds)
            $item.Editing.EndEdit()
        }
    }
    
    Write-Host "Script is completed"
