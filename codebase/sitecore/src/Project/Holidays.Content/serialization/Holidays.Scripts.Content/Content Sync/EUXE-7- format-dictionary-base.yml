- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
    
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
       
    
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    
        }
    
       
    
        if ($null -ne $field) {
    
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
    
            $targetLangItem.Editing.BeginEdit()
    
            $targetLangItem[$field] = $value;
    
            $targetLangItem.Editing.EndEdit() | Out-Null
    
        }
    
    }
    
     
    
     
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Login/Error Messages/Departure Date Is Invalid"
    
    
    
    @('de-CH', 'de-DE') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Ungültiges Abflugdatum ({date})"
    
    }
    
    
    @('fr-CH', 'fr-FR') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Date de départ non valide ({date})"
    
    }
    
    @('en') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Invalid departure date ({date})"
    
    }
    
    
    
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Error Messages/DOB Exceeded Length"
    
    
    
    @('de-CH', 'de-DE') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Bitte gib dein Geburtsdatum im richtigen Format ein ({date})"
    
    }
    
    @('fr-CH', 'fr-FR') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Veuillez saisir votre date de naissance au bon format ({date})"
    
    }
    
    @('en') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Please type your date of birth in the right format ({date})"
    
    }
    
    
    
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Guest Details/Error Messages/DOB Invalid"
    
    
    
    @('de-CH', 'de-DE') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Bitte gib dein Geburtsdatum im richtigen Format ein ({date})"
    
    }
    
    @('fr-CH', 'fr-FR') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Veuillez saisir votre date de naissance au bon format ({date})"
    
    }
    
    @('en') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Please enter your date of birth in the right format ({date})"
    
    }
    
    $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Price Promise/Errors/Departure Date Invalid"
    
    
    @('de-CH', 'de-DE') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "Das eingegebene Datum ist ungültig ({date}), bitte versuche es erneut"
    
    }
    
     
    
    @('fr-CH', 'fr-FR') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "La date que vous avez saisie n’est pas valide ({date}), veuillez réessayer"
    
    }
    
    @('en') | % {
    
        Create-Lang-Version -Item $item -Lang $_ -Field "Phrase" -Value "The date you've entered is invalid ({date}), please try again"
    
    }
