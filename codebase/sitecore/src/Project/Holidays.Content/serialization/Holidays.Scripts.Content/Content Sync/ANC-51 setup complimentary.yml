        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'Child' -Translation 1
        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'Infant' -Translation 0
    
        ### fr-CH
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'Adult' -Translation 1
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'Child' -Translation 1
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'Infant' -Translation 0
    
        ### de-CH
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'Adult' -Translation 1
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'Child' -Translation 1
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'Infant' -Translation 0
    
        ### LUS
        $path = $rootPath + '/Settings/Ancillaries/Complimentary Settings/Beach Holiday Promotion/Hold Baggage 15kg'
        $beachOnlyBaggage23kg = Get-Or-Create-Item -Path $path -Template $complementBaggageTemplate
        
        ### en-UK (default)
