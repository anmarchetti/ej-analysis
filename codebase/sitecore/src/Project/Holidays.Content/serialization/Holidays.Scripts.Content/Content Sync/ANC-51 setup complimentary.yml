    $complementSettingTemplate = '{1FA43398-D462-49B9-9E13-8B8FB4317E69}'
    $complementBaggageTemplate = '{5C2ECD9A-7C7C-417B-BCC6-8C686CB78F4D}'
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    function Set-Translation-Value($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
    
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
    }
    
    ### Create Ancillaries Folder
    
    function Create-Folders($rootPath) {
        $path = $rootPath + '/Settings/Ancillaries'
        $folderAnc = Get-Or-Create-Item -Path $path -Template "{A87A00B1-E6DB-45AB-8B54-636FEC3B5523}"
        
        $path = $rootPath + '/Settings/Ancillaries/Complimentary Settings'
        $folderComplement = Get-Or-Create-Item -Path $path -Template "{A87A00B1-E6DB-45AB-8B54-636FEC3B5523}"
        
        Write-Host $rootPath", /Settings/Ancillaries/Complimentary Settings folder was added/updated";
    }
    
    ### Create Beach Only Complement Settings
        
    function Create-Beach-Only-Complement-Settings($rootPath) {
        $path = $rootPath + '/Settings/Ancillaries/Complimentary Settings/Beach Holiday Promotion'
        $beachOnlySetting = Get-Or-Create-Item -Path $path -Template $complementSettingTemplate
        
        $beachOnlySetting.Editing.BeginEdit()
        $beachOnlySetting["PromotionCodes"] = "EUBA, EUBF, EUBO, EUBL, EUBU"
        $beachOnlySetting["InternalFallbackCode"] = "EUBO"
        $beachOnlySetting["Comment"] = "Beach holiday complimentary settings, 23kg for each adult or child"
        $beachOnlySetting.Editing.EndEdit() | Out-Null
    
        ### fr-FR
        Set-Translation-Value -ItemPath $path -Language 'fr-FR' -Key 'PromotionCodes' -Translation "FRBL, FRBM, FRBO, FRBR"
        Set-Translation-Value -ItemPath $path -Language 'fr-FR' -Key 'InternalFallbackCode' -Translation "FRBO"
    
        ### de-DE
        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'PromotionCodes' -Translation "DEBL, DEBM, DEBO, DEBR"
        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'InternalFallbackCode' -Translation "DEBO"
    
        ### fr-CH
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'PromotionCodes' -Translation "CHBL, CHBM, CHBO, CHBR"
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'InternalFallbackCode' -Translation "CHBO"
    
        ### de-CH
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'PromotionCodes' -Translation "CHBL, CHBM, CHBO, CHBR"
        Set-Translation-Value -ItemPath $path -Language 'de-CH' -Key 'InternalFallbackCode' -Translation "CHBO"
    
        ### LUG
        $path = $rootPath + '/Settings/Ancillaries/Complimentary Settings/Beach Holiday Promotion/Hold Baggage 23kg'
        $beachOnlyBaggage23kg = Get-Or-Create-Item -Path $path -Template $complementBaggageTemplate
        
        ### en-UK (default)
        $beachOnlyBaggage23kg.Editing.BeginEdit()
        $beachOnlyBaggage23kg["Code"] = "LUG"
        $beachOnlyBaggage23kg["Adult"] = 1
        $beachOnlyBaggage23kg["Child"] = 1
        $beachOnlyBaggage23kg["Infant"] = 0
