        Set-Translation-Value -ItemPath $path -Language 'de-DE' -Key 'Infant' -Translation 0
    
        ### fr-CH
        Set-Translation-Value -ItemPath $path -Language 'fr-CH' -Key 'Adult' -Translation 0
