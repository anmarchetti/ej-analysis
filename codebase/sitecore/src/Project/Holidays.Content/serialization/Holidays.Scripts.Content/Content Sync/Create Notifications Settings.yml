- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $templateId = "{DED27731-F9C5-4B73-9460-55B2ADB818E5}"
    
    $pathToItem = "/sitecore/content/EasyJet/Holidays/Settings/Notifications Settings"
    
    $item = Get-Item -Path $pathToItem -ErrorAction SilentlyContinue;
    
    if ($item -eq $null){
        $item = New-Item -Path $pathToItem -ItemType $templateId;
    
        $item.Editing.BeginEdit();
    	$item["AskNotificationsTitle"] = 'easyjet would like to send you push notifications';
        $item["AskNotificationsDescription"] = 'We&rsquo;d like to show you notification for the latest new and updates. You can manage them any time from your browser settings. Please see our <a href="/en/holidays/info/privacy-policy">privacy policy</a>.';
        $item.Editing.EndEdit() | Out-Null;
    
        Write-Host "Item created";
    }
