- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
             }
        }
        
        function updateTranslation($path) {
        	
        	$confirmationAmendPopup  = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        	if ($confirmationAmendPopup-eq $null) {
        		Write-Host "Missing ConfirmationAmendPopup item in EN language. Missing item: $($path)"
        		return;
        	}
    		
    		@('en') | % {
        		Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelTitle" -Value "WE'VE SUCCESSFULY UPDATED YOUR HOTEL"
    			Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelSubtitle" -Value "We've changed your hotel to:" 
    		}
    
        	@('de-CH', 'de-DE') | % {
        		Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelTitle" -Value "WIR HABEN IHR HOTEL ERFOLGREICH AKTUALISIERT"
    			Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelSubtitle" -Value "Wir haben Ihr Hotel geändert in:" 
        	}
        
        	@('fr-CH', 'fr-FR') | % {
        		Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelTitle" -Value "NOUS AVONS RÉUSSI À METTRE À JOUR VOTRE HÔTEL"
    			Create-Lang-Version -Item $confirmationAmendPopup -Lang $_ -Field "HotelSubtitle" -Value "Nous avons changé votre hôtel en :" 
        	}
    
        	Write-Host "Updated translations"
        }
    
        updateTranslation -path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Confirmation Amend Popup'
