SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $holidaysFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Amend Types"
    
    
    $holidaysPath = "/sitecore/content/EasyJet/Holidays/Data/Amend Types/Seats"
    
    
    $folderHolidays = Get-Item -Path $holidaysFolderPath
        
    $holidaysSeatAndBags = Get-Item -Path $holidaysPath
        
    $translations = @{
        "en" = @{
            "Name" = "Seats"
            "Type" = "Seats"
            
        }
        "fr-CH" = @{
            "Name" = "Sièges"
            "Type" = "Seats"
        }
        "fr-FR" = @{
            "Name" = "Sièges"
            "Type" = "Seats"
        }
        "de-CH" = @{
            "Name" = "Sitze"
            "Type" = "Seats"
        }
        "de-DE" = @{
           "Name" = "Sitze"
            "Type" = "Seats"
        }
    }
    
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $folderHolidays -lang $lang 
    }
    
        
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $holidaysSeatAndBags -lang $lang 
        
        create-lang-version -item $holidaysSeatAndBags -lang $lang -field "Name" -value $translations[$lang]["Name"]
        
    }
    
