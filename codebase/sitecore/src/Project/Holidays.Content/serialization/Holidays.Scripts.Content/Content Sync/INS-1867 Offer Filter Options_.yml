Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1867 Offer Filter Options Tracking"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $languageValues = @{
        "en"    = @{ Over = "More than £100 off";   UpTo = "Less than £100 off" }
        "fr-FR" = @{ Over = "More than 100 € off";  UpTo = "Less than 100 € off" }
        "de-DE" = @{ Over = "More than 100 € off";  UpTo = "Less than 100 € off" }
        "fr-CH" = @{ Over = "More than CHF 100 off"; UpTo = "Less than CHF 100 off" }
        "de-CH" = @{ Over = "More than CHF 100 off"; UpTo = "Less than CHF 100 off" }
    }
    
    $items = @(
        @{ Path = "master:/sitecore/content/EasyJet/Holidays/Data/Offer Filters/Holidays with over X off";      Kind = "Over" },
        @{ Path = "master:/sitecore/content/EasyJet/Holidays/Data/Offer Filters/Holidays with up to X off";     Kind = "UpTo" },
        @{ Path = "master:/sitecore/content/EasyJet/TradePortal/Data/Offer Filters/Holidays with over X off";   Kind = "Over" },
        @{ Path = "master:/sitecore/content/EasyJet/TradePortal/Data/Offer Filters/Holidays with up to X off";  Kind = "UpTo" }
    )
    
    foreach ($entry in $items) {
        foreach ($language in $languageValues.Keys) {
            $value = $languageValues[$language][$entry.Kind]
            $item = Get-Item -Path $entry.Path -Language $language -ErrorAction SilentlyContinue
    
            if ($null -eq $item) {
                Write-Host "Item not found: $($entry.Path) [$language]"
                continue
            }
    
            if ($item.Versions.Count -eq 0) {
                $item = Add-ItemVersion -Item $item -TargetLanguage $language
            }
    
            if ($item["TrackingId"] -eq $value) {
                Write-Host "Already up to date: $($item.Paths.FullPath) [$language]"
                continue
            }
    
            $item.Editing.BeginEdit()
            try {
                $item["TrackingId"] = $value
                $item.Editing.EndEdit() | Out-Null
                Write-Host "Updated: $($item.Paths.FullPath) [$language] -> '$value'"
            }
            catch {
                $item.Editing.CancelEdit()
                Write-Host "Failed: $($item.Paths.FullPath) [$language] - $_"
            }
        }
    }
