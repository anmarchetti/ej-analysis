- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    $page = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Home/Deals" -ErrorAction SilentlyContinue
    $pageCategory = Get-Or-Create-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Seo Settings/Page Categories" -ItemName "Deals" -TemplateId "{93ED4EC6-CF2B-43F5-B12C-A163CB3698C1}"
    
    if ($page -ne $null) {
    	$page.Editing.BeginEdit();
    	$page["PageCategory"] = $pageCategory.Name
    	$page.Editing.EndEdit() | Out-Null
    	Write-Host "Page Category" $pageCategory.Name "set"
    }
    
