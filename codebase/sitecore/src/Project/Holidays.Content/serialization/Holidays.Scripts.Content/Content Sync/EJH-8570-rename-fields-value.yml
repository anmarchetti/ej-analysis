- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function UpdatePhrase {
        param (
            [string]$path,
            [string]$phrase
        )
    
        $item = Get-Item -path $path -ErrorAction SilentlyContinue
    
        if ($item -ne $null) {
                $item.Editing.BeginEdit()
                $item["Phrase"] = $phrase
                $item.Editing.EndEdit() | Out-Null
            
            Write-Host "Item" $item.Name "successfully updated"
        }
    }
    
    UpdatePhrase -path "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Search Pod/Labels/When Dropdown" -phrase "Choose your departure date"
    UpdatePhrase -path "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Search Pod/Labels/When Return Date" -phrase "Tell us when you want to return"
