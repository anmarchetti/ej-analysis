  Hint: Script
  Value: |
    Write-Host  "START SCRIPT: EHD-290 Booking Back Button"
    
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    $BookingPagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking'
    $BookingGuestDetailsPagePath = '/sitecore/content/EasyJet/Holidays/Home/Booking/Guest Details'
    
    function Add-Booking-Back-Button-Item($path){
        # Button on Booking Page
        $itemPath = "$($path)/Page Components/Booking Back Button"
        
        $Item = Get-Or-Create-Item -Path $itemPath -TemplateId "{D807436B-496A-4DFC-A919-B3F4806E2E83}"
        $parentItem = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if ($Item -ne $null) {
            $Item.Editing.BeginEdit()
            $Item["Text"] = 'Back'
            $Item.Editing.EndEdit() | Out-Null
        	
        	Write-Host "Booking Back Button datasource successfully updated"
        }
        
        $dataSourcePath = $itemPath 
        $placeholderPath = 'body'
        $renderingPath = "/sitecore/layout/Renderings/Feature/Booking/Booking Back Button"
        
        $renderingId = "{DDFF4851-3B59-472E-A7C5-BD3BB2D44023}"
        $existsRendering = Get-Rendering -Item $parentItem -PlaceHolder $placeholderPath | Where-Object {$_.ItemId -eq $renderingId}
        $rendering = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholderPath
        
        if($existsRendering -eq $null){
            Add-Rendering -Item $parentItem -Instance $rendering -DataSource $dataSourcePath -Placeholder $placeholderPath -Index 0
            Write-Host "Added rendering: Booking Back Button component"
        } else {
        	Write-Host "Skip adding rendering: Booking Back Button component already exists"
        }
    }
    
    Add-Booking-Back-Button-Item -Path $BookingPagePath
    Add-Booking-Back-Button-Item -Path $BookingGuestDetailsPagePath
    
    
    Write-Host  "END SCRIPT: EHD-290 Booking Back Button"
