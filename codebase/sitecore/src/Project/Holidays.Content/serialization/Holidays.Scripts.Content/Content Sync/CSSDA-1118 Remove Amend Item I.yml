- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$template) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $template
    	}
    	return $item
    }
    
    # Remove Amend Item Info rendering from amend payment page
    $amendPaymentPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment"
    $amendPaymentPage = Get-Or-Create-Item -Path $amendPaymentPagePath
    $amendItemInfo = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info"
    $amendItemInfoRenderingInstance = Get-Rendering -Item $amendPaymentPage -PlaceHolder "/body/component-wrapper-inner-{8a1d1703-69d7-442f-933b-9ae8e6e3d120}-0" -DataSource $amendItemInfo.ID;
    
    if ($amendItemInfoRenderingInstance -ne $null) {
    	Remove-Rendering -Path $amendPaymentPagePath -Instance $amendItemInfoRenderingInstance;
    	Write-Host "Amend payment page Amend Item Info rendering removed";
    }
    
