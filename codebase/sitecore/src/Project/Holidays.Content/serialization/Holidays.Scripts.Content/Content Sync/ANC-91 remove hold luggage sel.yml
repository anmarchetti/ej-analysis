Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-91 remove hold luggage selected rendering from confirmation page"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Delete-Rendering($pagePath, $renderingId){
        $page = Get-Item -Path $pagePath
        $allRenderings = Get-Rendering -Item $page
        
        foreach($rendering in $allRenderings){
             if($rendering.ItemId -eq $renderingId){
                 Remove-Rendering -Item $page -Instance $rendering
                 Write-Host "ItemId: " $rendering.ItemId "successfully removed";
             }
         }
    }
    
    # delete all Hold Luggage Selected renderings from Confirmation Page
    $selectedHLRenderingId = '{771959C1-9EA9-43D6-B8F4-A24D90D06974}'
    
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Confirmation' -renderingId $selectedHLRenderingId
    Delete-Rendering -pagePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Confirmation' -renderingId $selectedHLRenderingId
    
    Write-Host "Hold Luggage Selected rendering successfully removed from confirmation page";
         
