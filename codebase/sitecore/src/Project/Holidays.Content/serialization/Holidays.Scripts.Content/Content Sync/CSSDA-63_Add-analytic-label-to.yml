SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Update health items
    
    $healthItemsFull = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Data/Health Entry Requirements" -Recurse;
    
    $healthItemsFull | ForEach-Object {
       $_.Editing.BeginEdit();
       $_["TrackingLabel"] = $_.Name.TrimStart('Generic - ');
       $_.Editing.EndEdit() | Out-Null;
    }
    
    #Update help links
    
    $helpLinks = Get-ChildItem -Path "master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Bottom Help Links" -Recurse; 
    
    $helpLinks | ForEach-Object {
      $_.Editing.BeginEdit();
           $_["TrackingLabel"] = $_.Name;
           $_.Editing.EndEdit() | Out-Null;
    }
    
    
