DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $summaryPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    $seatMapRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/SeatMap/Seat Map" -ErrorAction SilentlyContinue;
    $seatMapRenderingInstance = New-Rendering -Item $seatMapRenderingItem;
    
    $existingSeatMapRenderingInstance = Get-Rendering -Item $summaryPage -Rendering $seatMapRenderingItem;
    
    if ($existingSeatMapRenderingInstance -eq $null) {
        Add-Rendering -Item $summaryPage -Instance $seatMapRenderingInstance -PlaceHolder "/body/seat-map-{63f67a32-6cf4-4c6f-883d-50d45473daf7}-0" -DataSource "/sitecore/content/EasyJet/Holidays/Data/SeatsMap";
        
        Write-Host "Seat Map rendering has been added to amend dates summary page";
    } else {
        Write-Host "Seat Map rendering has already exist in amend dates summary page";
    }
    
    
    
