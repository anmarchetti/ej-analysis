  Value: |
    ## UPDATE FILEDS WITH LANGS
    function Update-item-with-lang($data, $itemPath) {
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
        
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    ## GET OR CREATE ITEM
    function Get-Or-Create-Item($path, $templateID){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $templateID;
        }
        return $item
    }
    ###
    
    ## GET RENDERING INSTANCE
    function Get-Rendering-Instance($itemPath, $renderingPath, $dataSourcePath) {
        $pageItem = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
        $renderingItem = Get-Item -Path $renderingPath -ErrorAction SilentlyContinue;
        $dataSourceItem = Get-Item -Path $dataSourcePath -ErrorAction SilentlyContinue;
        $rendering = Get-Rendering -Item $pageItem -Rendering $renderingItem -DataSource $dataSourcePath;
        
        if ($rendering -ne $null) {
            return $rendering;
        }
    
     
        return Get-Rendering -Item $pageItem -Rendering $renderingItem -DataSource $dataSourceItem.ID;
    }
    ##
    
    ## Update PAGE RENDERING
     function Update-Page-Rendering ($pagePath, $renderingPath, $dataSourcePath, $newDataSource) {
    	$renderingItem = Get-Item -Path $renderingPath;
    	$pageItem = Get-Item -Path $pagePath;
    	
    	$pageRenderingInstance = Get-Rendering-Instance -ItemPath $pagePath -RenderingPath $renderingPath -DataSourcePath $dataSourcePath;
       
    	if ($pageRenderingInstance -eq $null) {
    		Write-Host $renderingItem.Name "- Not Found";
    	} else {
    		Set-Rendering -Item $pageItem -Instance $pageRenderingInstance -DataSource $newDataSource;
    	}
    }
    ##
    
    
    
    $viewBookingPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking";
    $amendDatesSummaryPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary";
    
    $noFlightsPath = "/sitecore/content/EasyJet/Holidays/Data/No Flights Available Popup";
    $noHotelPath = "/sitecore/content/EasyJet/Holidays/Data/No Hotels Available Popup";
    $noTransfersPath = "/sitecore/content/EasyJet/Holidays/Data/No Tranfers Available Popup";
    $noDatesPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/No Dates Popup";
    $noRBCPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Room And Board Unavailable Popup";
    
    $transfersRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Transfers Unavailable Popup";
    $flightsRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Flights Unavailable Popup";
    $hotelRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Hotels Unavailable Popup";
    
    ### Create new folder
    Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Unavailable Popups" -TemplateID "{A87A00B1-E6DB-45AB-8B54-636FEC3B5523}";
    ###
    
    ### Update fields
    $closeCtaData = @(
        @{
        	fieldName = "NoOptionsCTA";
        	Values = @{
        		en = "Close";
        		fr = "Fermer";
        		de = "Schließen"
        	}
        }
    );
    
    Update-item-with-lang -ItemPath $noFlightsPath -Data $closeCtaData;
    Update-item-with-lang -ItemPath $noTransfersPath -Data $closeCtaData;
    Update-item-with-lang -ItemPath $noDatesPath -Data $closeCtaData;
    Update-item-with-lang -ItemPath $noRBCPath -Data $closeCtaData;
    Update-item-with-lang -ItemPath $noHotelPath -Data $closeCtaData;
    ##
    
    # Update renderings data source
    $newNoFlightsPath = "/sitecore/content/EasyJet/Holidays/Data/Unavailable Popups/No Flights Available Popup";
    $newNoHotelsPath = "/sitecore/content/EasyJet/Holidays/Data/Unavailable Popups/No Hotels Available Popup";
    $newNoTransfersPath = "/sitecore/content/EasyJet/Holidays/Data/Unavailable Popups/No Tranfers Available Popup";
    
    Update-Page-Rendering -PagePath $viewBookingPagePath -RenderingPath $transfersRenderingPath -DataSourcePath $noTransfersPath -NewDataSource $newNoTransfersPath;
    Update-Page-Rendering -PagePath $viewBookingPagePath -RenderingPath $flightsRenderingPath -DataSourcePath $noFlightsPath -NewDataSource $newNoFlightsPath;
    Update-Page-Rendering -PagePath $viewBookingPagePath -RenderingPath $hotelRenderingPath -DataSourcePath $noHotelPath -NewDataSource $newNoHotelsPath;
    
    Update-Page-Rendering -PagePath $amendDatesSummaryPagePath -RenderingPath $transfersRenderingPath -DataSourcePath $noTransfersPath -NewDataSource $newNoTransfersPath;
    Update-Page-Rendering -PagePath $amendDatesSummaryPagePath -RenderingPath $flightsRenderingPath -DataSourcePath $noFlightsPath -NewDataSource $newNoFlightsPath;
    
    ### Move Items
    Move-Item -Path $noTransfersPath -Destination $newNoTransfersPath -ErrorAction SilentlyContinue;
    Move-Item -Path $noFlightsPath -Destination $newNoFlightsPath -ErrorAction SilentlyContinue;
    Move-Item -Path $noHotelPath -Destination $newNoHotelsPath -ErrorAction SilentlyContinue;
