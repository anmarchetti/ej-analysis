  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $seatMap = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/SeatsMap" -template "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
    $seatMap.Editing.BeginEdit()
    $seatMap["AutoseatsTitle"] = "Would you like to book the same seats on the {flightDirection} flight?"
    $seatMap.Editing.EndEdit()
    
    Write-Host "updated seatMap - AutoseatsTitle value"
