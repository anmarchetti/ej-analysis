  Hint: Script
  Value: |
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags'
    
    $data = Get-Item -Path $tradePath -ErrorAction SilentlyContinue
    
    if($data -ne $null) {
        $data.Editing.BeginEdit()
        $data['DescriptionWithoutPrice'] = "Get an extra 10kg cabin bag, and Speedy Boarding"
        $data['AddButtonLabel'] = "Add"
        $data.Editing.EndEdit() | Out-Null
    }
    
    
    
