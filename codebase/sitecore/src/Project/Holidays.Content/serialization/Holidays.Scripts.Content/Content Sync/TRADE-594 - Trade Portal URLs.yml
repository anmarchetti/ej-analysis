- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path, $template) {
        	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
        	if ($item -eq $null) {
        		$item = New-Item -Path $path -ItemType $template
        	}
        	return $item
        }
        
        $navigationsPath = "/sitecore/content/EasyJet/TradePortal/Data/Navigations/User Management"
        $navigationLinkTemplate = "{BC011F0A-976C-4825-9E01-8BAA7C8E6CCA}"
        $navigationLinkFolderTemplate = "{F2AEDD6F-5BE8-4833-84D2-8DE7ABA3D3D1}"
        $userManagementFolder = Get-Or-Create-Item -Path $navigationsPath -template $navigationLinkFolderTemplate
        
        if ($userManagementFolder -ne $null) {
                $item = Get-Or-Create-Item -Path "$navigationsPath/Trade Support Hub" -Template $navigationLinkTemplate
                $item.Editing.BeginEdit()
                $item["Link"] = '<link text="Trade Support Hub" linktype="external" url="/holidays/user-management-app/trade-support-hub" anchor="" target="" rel="" />';
                $item.Editing.EndEdit() | Out-Null
      
                $item = Get-Or-Create-Item -Path "$navigationsPath/Consortium Hub" -Template $navigationLinkTemplate
                $item.Editing.BeginEdit()
                $item["Link"] = '<link text="Consortium Hub" linktype="external" url="/holidays/user-management-app/consortium-hub" anchor="" target="" rel="" />';
                $item.Editing.EndEdit() | Out-Null
                
                $item = Get-Or-Create-Item -Path "$navigationsPath/Manager Hub" -Template $navigationLinkTemplate
                $item.Editing.BeginEdit()
                $item["Link"] = '<link text="Manager Hub" linktype="external" url="/holidays/user-management-app/manager-hub" anchor="" target="" rel="" />';
                $item.Editing.EndEdit() | Out-Null
                
                $item = Get-Or-Create-Item -Path "$navigationsPath/Manage Account" -Template $navigationLinkTemplate
                $item.Editing.BeginEdit()
                $item["Link"] = '<link text="Manage Account" linktype="external" url="/holidays/user-management-app" anchor="" target="" rel="" />';
                $item.Editing.EndEdit() | Out-Null
        }
