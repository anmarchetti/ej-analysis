  Value: |
    function Get-Or-Create-Item($path, $name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
    
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
    
        return $item
    }
    
    
    $creditAndRefundFolder = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Credit and Cash Refund Settings" -ErrorAction SilentlyContinue
    
    if($creditAndRefundFolder -ne $null){
        $creditRefundOnly = Get-Or-Create-Item -Path $creditAndRefundFolder.FullPath -Name "Credit Only Refund" -TemplateId "{83EF1967-587D-4D96-B4B9-B1AAEBC3192E}"
        
        Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Credit and Cash Refund Settings/Exemption Lists" -ErrorAction SilentlyContinue | Remove-Item -Recurse
    }
