- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $maendDatesSummaryPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    $amendSummaryItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Amend Dates Summary Page" -ErrorAction SilentlyContinue;
    
    $seatMapRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/SeatMap/Seat Map" -ErrorAction SilentlyContinue;
    $amendDatesSummaryRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Dates/Amend Dates Summary" -ErrorAction SilentlyContinue
    
    $amendDatesSummaryRenderingInstance = Get-Rendering -Item $maendDatesSummaryPage -Render $amendDatesSummaryRenderingItem;
    $seatMapRenderingInstance = Get-Rendering -Item $maendDatesSummaryPage -Rendering $seatMapRenderingItem;
    
    if ($seatMapRenderingInstance -ne $null) {
        $placeholder = "/body/seat-map-" + $amendDatesSummaryRenderingInstance.UniqueId + "-0";
        
        Set-Rendering -Item $maendDatesSummaryPage -Instance $seatMapRenderingInstance -Placeholder $placeholder;
        
        Write-Host $seatMapRenderingInstance.Name "Updated";
    }
