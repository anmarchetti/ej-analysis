    $luggagePath15kg = "master:/sitecore/content/EasyJet/Holidays/Data/Luggage/Hold Baggage/Hold Baggage 15kg"
    $bikePath = "master:/sitecore/content/EasyJet/Holidays/Data/Luggage/Large Sports Equipment/Bicycle"
    
    
    function translate($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    translate -itemPath $bikePath -language 'fr-FR' -key 'Name' -translation 'Bicyclette'
    translate -itemPath $bikePath -language 'fr-CH' -key 'Name' -translation 'Bicyclette'
    translate -itemPath $bikePath -language 'de-DE' -key 'Name' -translation 'Fahrrad'
    translate -itemPath $bikePath -language 'de-CH' -key 'Name' -translation 'Fahrrad'
    
    translate -itemPath $luggagePath15kg -language 'de-DE' -key 'Name' -translation 'Aufgabegepäck 15kg'
    translate -itemPath $luggagePath15kg -language 'de-CH' -key 'Name' -translation 'Aufgabegepäck 15kg'
    translate -itemPath $luggagePath15kg -language 'fr-CH' -key 'Name' -translation 'Bagages en soute 15kg'
    translate -itemPath $luggagePath15kg -language 'fr-FR' -key 'Name' -translation 'Bagages en soute 15kg'
    
    translate -itemPath $luggagePath15kg -language 'de-DE' -key 'Description' -translation 'Maximal 15 kg pro Tasche, die im Frachtraum des Flugzeugs aufbewahrt wird. Hin- und Rückflug.'
    translate -itemPath $luggagePath15kg -language 'de-CH' -key 'Description' -translation 'Maximal 15 kg pro Tasche, die im Frachtraum des Flugzeugs aufbewahrt wird. Hin- und Rückflug.'
