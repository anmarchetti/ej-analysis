Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-10940 - Policy Banner Placeholder Fix"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $policyBannerId = "{7E2EEFDE-8087-4767-BB9C-398497F6E7C4}" 
    
    
    $item = Get-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    
    
    if($item -ne $null){
        
        $rendering = Get-Rendering -Item $item | Where-Object {$_.ItemId -eq "{025DDD3B-F1EA-42A6-AECF-D2A2698F6137}"}
        
        Get-Rendering -Item $item |
        Foreach-Object { 
            if($_.ItemId -eq $policyBannerId)
            {
    
                $_.Placeholder = $rendering.Placeholder
                Set-Rendering -Item $item -Instance $_ -Index 1
            }
    
        }
    }
    
    
