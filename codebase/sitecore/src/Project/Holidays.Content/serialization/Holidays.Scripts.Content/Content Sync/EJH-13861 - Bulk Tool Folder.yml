  Hint: Script
  Value: |
    $reportsFolderPath = "/sitecore/media library/Files/Bulk Tool Reports"
    
    
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    
    #Create Report Folder
    Get-Or-Create-Item -Path $reportsFolderPath -Template "{FE5DD826-48C6-436D-B87A-7C4210C7413B}"
    
