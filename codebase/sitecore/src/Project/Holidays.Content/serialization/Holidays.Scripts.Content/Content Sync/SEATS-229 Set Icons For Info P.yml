  Hint: Script
  Value: |
        function Get-Or-Create-Item($path, $template){
            $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
            return $item
        }
        
        $specialAssistItem = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/SeatsMap/Special Assistance" -template "{6DFDD4F0-78C8-4D0D-87A1-AC5D1AE293EC}"
        
        $specialAssistItem.Editing.BeginEdit()
        $specialAssistItem["Icon"] = "<image mediaid='{DB685B7B-2B05-4E62-8EE0-8B8BB7CC8112}' />"
        $specialAssistItem.Editing.EndEdit()
        
        Write-Host "updated special assistance item - Icon"
    	
        $childrenItem = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/SeatsMap/Travelling With Children" -template "{6DFDD4F0-78C8-4D0D-87A1-AC5D1AE293EC}"
        
