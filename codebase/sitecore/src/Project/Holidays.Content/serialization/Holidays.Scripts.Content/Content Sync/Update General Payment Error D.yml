SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $key1 = "Payment.FailureMessages.NotLoggedInGateway"
    $item1 = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$key1']"
    
    if ($item1 -ne $null) {
            $item1.Editing.BeginEdit()
            $item1["Phrase"] = "Something went wrong"
            $item1.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item1.Name "successfully updated"
    }
    
    $key2 = "Payment.FailureMessages.NotLoggedInGatewayDescription"
    $item2 = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$key2']"
    
    if ($item2 -ne $null) {
            $item2.Editing.BeginEdit()
            $item2["Phrase"] = "Your transaction wasn't processed, please check the details and try again."
            $item2.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item2.Name "successfully updated"
    }
