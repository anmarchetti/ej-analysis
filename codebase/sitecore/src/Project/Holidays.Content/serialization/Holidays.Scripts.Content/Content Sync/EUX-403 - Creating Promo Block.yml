Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-403 - Creating Promo Block Folder inserting inside already existing promo block"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $itemToCreateExist
    }
    
    function create-lang-version($item,$lang) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
    }
    
    $PromoBlockExistingItemPath = "/sitecore/content/EasyJet/Holidays/Data/Promo Blocks" 
    $PromoBlockExistingItem = Get-Item -Path $PromoBlockExistingItemPath
    $PromoBlockExistingItemID = $PromoBlockExistingItem.ID
    
    $PromoBlockExistingItem.Editing.BeginEdit()
    $PromoBlockExistingItem.Name = "United Kingdom Promo Block"
    $PromoBlockExistingItem."__Display Name" = "United Kingdom Promo Block"
    $PromoBlockExistingItem.Editing.EndEdit()
    
    
    <# Creating the UK Version of the PromoBlockFolder #>
    $PromoBlockWrapper = create-item -Path "/sitecore/content/EasyJet/Holidays/Data" -ItemName "Promo Block Folder" -ItemType "{CA027AB7-1E89-42B8-A065-4412DE13FFC7}"
    $DestinationID = $PromoBlockWrapper.ID
    
    Get-Item -Path "master:" -ID $PromoBlockExistingItemID | Move-Item -Destination "master:$DestinationID"
    
    $switzerlandPromoBlock = create-item -Path $PromoBlockWrapper.Paths.FullPath -ItemName "Switzerland Promo Block" -ItemType "{EB30259D-FF9A-46CB-8E0C-4616B148F3A8}"
    Create-Lang-Version -Item $switzerlandPromoBlock -Lang "fr-CH"
    Create-Lang-Version -Item $switzerlandPromoBlock -Lang "de-CH"
    
    
