- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $pathToItem = "/sitecore/content/EasyJet/Holidays/Settings/Seat Map Settings"
    
    $item = Get-Item -Path $pathToItem -ErrorAction SilentlyContinue;
    
    if ($item -ne $null){
       
        $item.Editing.BeginEdit()
    	$item["MinNumberOfDaysToDeparture"] = 30;
    	$item.Editing.EndEdit() | Out-Null;
    	
    	Write-Host "default number of days to departure have been set";
    }
    
