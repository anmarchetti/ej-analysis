SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $SearchPodAllCountriesTitle = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod/Labels/All Countries Title"
    $SearchPodCustomMenuTitle = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod/Labels/Custom Menu Title"
    
    @('de-CH', 'de-DE') | % {
        Create-Lang-Version -Item $SearchPodAllCountriesTitle -Lang $_ -Field "Phrase" -Value "VOLLSTÄNDIGE LISTE DER REISEZIELE"
        Create-Lang-Version -Item $SearchPodCustomMenuTitle -Lang $_ -Field "Phrase" -Value "UNSERE TOP PICKS"
    }
    @('fr-CH', 'fr-FR') | % {
        Create-Lang-Version -Item $SearchPodAllCountriesTitle -Lang $_ -Field "Phrase" -Value "LISTE COMPLÈTE DES DESTINATIONS"
        Create-Lang-Version -Item $SearchPodCustomMenuTitle -Lang $_ -Field "Phrase" -Value "NOS TOP PICKS"
    }
