SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version ($item,$lang,$field,$value) {
    	$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
    	}
    
    	if ($null -ne $field) {
    		$targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem[$field] = $value
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    
    $item = Get-Item "master:/sitecore/content/EasyJet/Holidays/Home/Shortlists/Page Components/Shortlists" -ErrorAction SilentlyContinue
    
    @('en') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareCTA" -Value "Compare holidays"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareLabel" -Value "Compare"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareMobileCTA" -Value "Compare"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CancelCompareButton" -Value "Cancel Comparison"
    	Create-Lang-Version -Item $item -Lang $_ -Field "ViewCompareButton" -Value "View Comparison"
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditListCTA" -Value "Edit your list"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysPluralLabel" -Value "HOLIDAYS SELECTED"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysSingularLabel" -Value "HOLIDAY SELECTED"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningTitle" -Value "Opps, we need more info!"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningDescription" -Value "Pick your date, unlock unbeatable deals to book your perfect escape now"
    }
    
    @('de-CH','de-DE') | % {
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareCTA" -Value "Ferien vergleichen"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareMobileCTA" -Value "Vergleichen Sie"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareLabel" -Value "Vergleichen Sie"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CancelCompareButton" -Value "Vergleich abbrechen"
    	Create-Lang-Version -Item $item -Lang $_ -Field "ViewCompareButton" -Value "Ansicht Vergleich"
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditListCTA" -Value "Wunschliste bearbeiten"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysPluralLabel" -Value "URLAUB AUSGEWÄHLT"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysSingularLabel" -Value "URLAUB AUSGEWÄHLT"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningTitle" -Value "Ups, wir benötigen mehr Informationen!"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningDescription" -Value "Wählen Sie Ihr Datum, sichern Sie sich unschlagbare Angebote und buchen Sie jetzt Ihren perfekten Urlaub."
    }
    
    @('fr-CH','fr-FR') | % {
        Create-Lang-Version -Item $item -Lang $_ -Field "CompareCTA" -Value "Comparer les vacances"
        Create-Lang-Version -Item $item -Lang $_ -Field "CompareLabel" -Value "Comparer"
        Create-Lang-Version -Item $item -Lang $_ -Field "CompareMobileCTA" -Value "Comparer"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CancelCompareButton" -Value "Annuler la comparaison"
    	Create-Lang-Version -Item $item -Lang $_ -Field "ViewCompareButton" -Value "Voir la comparaison"
    	Create-Lang-Version -Item $item -Lang $_ -Field "EditListCTA" -Value "Modifier votre liste"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysPluralLabel" -Value "SÉJOURS SÉLECTIONNÉS"
    	Create-Lang-Version -Item $item -Lang $_ -Field "SelectedHolidaysSingularLabel" -Value "SÉJOUR SÉLECTIONNÉ"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningTitle" -Value "Oups, nous avons besoin de plus d'informations !"
    	Create-Lang-Version -Item $item -Lang $_ -Field "CompareWarningDescription" -Value "Choisissez votre date, débloquez des offres imbattables pour réserver votre escapade parfaite dès maintenant."
    }
