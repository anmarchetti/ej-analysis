- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $postTravelPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/post-travel"
    
    $feedbackRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/Feedback Banner"
    $hotelSummaryRenderingPath = "/sitecore/layout/Renderings/Feature/Booking/HotelSummary"
    $genericRecomHotelsRenderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Generic Recommended Hotels"
    
    
    function Update-Feedback-Rendering() {
        $pageItem = Get-Item -Path $postTravelPagePath
        
        $masonaryItemRendering = Get-Rendering -Item $pageItem -UniqueId "{AAE7DB74-372E-429A-95FE-D025D90E9B99}"
        if ($masonaryItemRendering -ne $null) {
           	Set-Rendering -Item $pageItem -Instance $masonaryItemRendering -Index 12 -PlaceHolder "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
            Write-Host "Updated placeholder fot Masonary Item"
            
        } else {
            Write-Host "Masonary Item not exists on Post Travel page"
        }
     
        $feedbackItemRendering = Get-Item -Path $feedbackRenderingPath   
        $feedbackPageRendering = Get-Rendering -Item $pageItem -Rendering $feedbackItemRendering
        if ($feedbackPageRendering -ne $null) {
           	Set-Rendering -Item $pageItem -Instance $feedbackPageRendering -Index 11 -PlaceHolder "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0/masonry-item-{AAE7DB74-372E-429A-95FE-D025D90E9B99}-0"
            Write-Host "Updated placeholder fot Feedback Banner"
            
        } else {
            Write-Host "Feedback Banner Rendering not exists on Post Travel page"
        }
    }
    
    function Update-Feedback-Holdiay-Summary() {
        $pageItem = Get-Item -Path $postTravelPagePath
    
        $masonaryItemRendering = Get-Rendering -Item $pageItem -UniqueId "{c69a6aef-4975-4d2c-8c67-46c80ad4e478}"
        if ($masonaryItemRendering -ne $null) {
           	Set-Rendering -Item $pageItem -Instance $masonaryItemRendering -PlaceHolder "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-aside-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0"
            Write-Host "Updated placeholder fot Masonary Item"
            
        } else {
            Write-Host "Masonary Item not exists on Post Travel page"
        }
        
        $hotelSummaryItemRendering = Get-Item -Path $hotelSummaryRenderingPath
        $hotelSummaryPageRendering = Get-Rendering -Item $pageItem -Rendering $hotelSummaryItemRendering
        if ($hotelSummaryPageRendering -ne $null) {
           	Set-Rendering -Item $pageItem -Instance $hotelSummaryPageRendering -PlaceHolder "/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-aside-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0/masonry-item-{c69a6aef-4975-4d2c-8c67-46c80ad4e478}-0"
            Write-Host "Updated placeholder fot Hotel Summary"
            
        } else {
            Write-Host "Hotel Summary Rendering not exists on Post Travel page"
        }
    }
    
    function Update-Rendering-Param() {
        $pageItem = Get-Item -Path $postTravelPagePath
        $genericRecomHotelsItemRendering = Get-Item -Path $genericRecomHotelsRenderingPath
        $genericRecomHotelsPageRendering = Get-Rendering -Item $pageItem -Rendering $genericRecomHotelsItemRendering
        
        $param = @{"IsLeftAligned"='0'}
        if ($genericRecomHotelsPageRendering -ne $null) {
           	Set-RenderingParameter -Instance $genericRecomHotelsPageRendering -Parameter $param
           	Set-Rendering -Item $pageItem -Instance $genericRecomHotelsPageRendering
           	Write-Host "Updated params fot Generic Hotels Recommender"
            
        } else {
            Write-Host "Generic Hotels Recommender not exists on Post Travel page"
        }
    }
    
    Update-Feedback-Rendering
    Update-Feedback-Holdiay-Summary
    Update-Rendering-Param
