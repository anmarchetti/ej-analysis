ID: "6dbf5ac0-4db6-4c80-a6e5-f9243659ca0a"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-13988 View Booking - Transfer Instructions"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Set setting
    $setting= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Transfer Settings"
    if ($setting -ne $null) {
    	$setting.Editing.BeginEdit()
    	$setting["IsTransferInstructionsEnabled"] = "1"
    	$setting.Editing.EndEdit() | Out-Null;
    }
    
    #Create Datasource
    $datasourcePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Transfer Instructions"
    $datasourceTemplateId = "{49838383-E093-4988-9A86-067013F93A3E}"
    
    $datasource = Get-Item -Database "master" -path $datasourcePath -ErrorAction SilentlyContinue
    
    if ($datasource -eq $null) {
        # create item
        $datasource = New-Item -Path $datasourcePath -ItemType $datasourceTemplateId
        Write-Host "Item" $datasource.Name "successfully created"
    }
        
    $datasource.Editing.BeginEdit()
    $datasource["PopupTitle"] = "YOUR TRANSFER INSTRUCTIONS"
    $datasource["PopupArrivalInstructionTitle"] = "To airport"
    $datasource["PopupDepartureInstructionTitle"] = "From airport"
    $datasource["CTA"] = "Your transfer instructions"
    $datasource["Icon"] = "<image mediaid=`"{B7AE57B1-22BD-4C50-A42D-B08AC592F6A5}`" />"
    $datasource.Editing.EndEdit() | Out-Null
    
    Write-Host "Finished"
    
    #Add renderibg
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index, $parameters){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        if($parameters -ne $null)
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -Parameter $parameters -DataSource $datasource -Index $index
        }
        else
        {
            Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
        }
    }
    function Add-Rendering-To($item, $renderingId, $newRenderingId, $datasource, $sign, $specificPlaceholder){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if($index -gt 0)
                {
                    $incrementIndex = $index
                
                    Add-New-Rendering -Item $item -Placeholder $specificPlaceholder -RenderingId $newRenderingId -Datasource $datasource -Index $incrementIndex
                }
                return
            }
        }
    }
    $page = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking";
    $viewBookRend = Get-Rendering -Item $page  | Where-Object { $_.ItemId -eq "{B932CD1B-05BD-4F1D-947F-1E6F48C4F649}" } | Select -First 1
    
    Add-Rendering-To -Item $page -RenderingId '{9FD91E19-714F-4313-9E52-FF77B4E9F030}' -NewRenderingId '{28B6196C-C176-43D4-A585-CE024F7B8BEA}' -Datasource $datasource.Id -sign 0 -SpecificPlaceholder "/body/transfer-instructions-$($viewBookRend.UniqueId)-0"
