- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/
    
    $keyWhoRoomMobile = "SearchPod.Labels.WhoRoomMobile"
    $item = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/Holidays/Dictionary//*[@Key='$keyWhoRoomMobile']"
    
    if ($item -ne $null) {
            Remove-Item -Path $item.Paths.FullPath -Permanently
    
        Write-Host "Item" $item.Name "successfully removed from Holidays/Dictionary/"
    }
    
    $itemT = Get-Item -Path "master:" -Query "/sitecore/content/EasyJet/TradePortal/Dictionary//*[@Key='$keyWhoRoomMobile']"
    
    if ($itemT -ne $null) {
            Remove-Item -Path $itemT.Paths.FullPath -Permanently
    
        Write-Host "Item" $itemT.Name "successfully removed from TradePortal/Dictionary/"
    }
