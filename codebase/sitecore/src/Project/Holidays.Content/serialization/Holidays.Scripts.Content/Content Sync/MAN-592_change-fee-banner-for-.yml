  Value: |
      function update-item-with-lang($data, $item) {
              function create-lang-version($item, $lang, $field, $value) {
                  $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
      
                  if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                      Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
                  }
      
                  if ($null -ne $field) {
                      $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                      $targetLangItem.Editing.BeginEdit()
                      $targetLangItem[$field] = $value;
                      $targetLangItem.Editing.EndEdit() | Out-Null
                  }
          };
      
              if ($item -ne $null) {
                  $data | ForEach-Object {
                  $fieldName = $_.fieldName;
                  $values = $_.values;
      
                  if ($values -ne $null) {
      
                      if ($values.en -ne $null) {
                          $item.Editing.BeginEdit();
                          $item[$fieldName] = $values.en;
                          $item.Editing.EndEdit() | Out-Null
                      }
                       if ($values.fr -ne $null) {
                           @('fr-CH', 'fr-FR') | % {
                              Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                          }
                      }
                       if ($values.de -ne $null) {
                           @('de-CH', 'de-DE') | % {
                              Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                          }
                      }
      
                      Write-Host $fieldName "Updated"
                  }
              }
              }
          };
      
           ## UPDATE PAGE RENDERING
          function Add-Or-Update-Page-Rendering ($pagePath, $renderingPath, $renderingPlaceholder, $dataSourcePath, $parameters = @{}) {
              $page = Get-Item -Path $pagePath;
          	$renderingItem = Get-Item -Database "master" -Path $renderingPath;
          	$pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
      
      
          	if ($pageRenderingInstance -eq $null) {
          		$renderingInstance = $renderingItem | New-Rendering -PlaceHolder $renderingPlaceholder;
          		Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Parameter $parameters -DataSource $dataSourcePath;
          		Write-Host $renderingItem "Rendering instance added";
          	}
          	else {
          		Write-Host $pageRenderingInstance "Already exists";
          	}
          }
          ##
      
      function Create-Or-Update-Item-And-Populate-It-And-Update-Page-Rendering ($itemPath, $renderingPath, $templatePath, $pagePath, $data, $renderingPlaceholder, $dataSourcePath, $parameters) {
          ## GET OR CREATE ITEM
          function Get-Or-Create-Item($path, $templatePath){
              $item = Get-Item -Path $path -ErrorAction SilentlyContinue;
              $template = Get-Item -Path $templatePath -ErrorAction SilentlyContinue;
      
              if($item -eq $null){
                  $item = New-Item -Path $path -ItemType $template.ID;
              }
              return $item
          }
          ###
      
          ## UPDATE FILEDS WITH LANGS
          function update-item-with-lang($data, $item) {
              function create-lang-version($item, $lang, $field, $value) {
                  $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
      
                  if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                      Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
                  }
      
                  if ($null -ne $field) {
                      $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                      $targetLangItem.Editing.BeginEdit()
                      $targetLangItem[$field] = $value;
                      $targetLangItem.Editing.EndEdit() | Out-Null
                  }
          };
      
              if ($item -ne $null) {
                  $data | ForEach-Object {
                  $fieldName = $_.fieldName;
                  $values = $_.values;
      
                  if ($values -ne $null) {
      
                      if ($values.en -ne $null) {
                          $item.Editing.BeginEdit();
                          $item[$fieldName] = $values.en;
                          $item.Editing.EndEdit() | Out-Null
                      }
                       if ($values.fr -ne $null) {
                           @('fr-CH', 'fr-FR') | % {
                              Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                          }
                      }
                       if ($values.de -ne $null) {
                           @('de-CH', 'de-DE') | % {
                              Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                          }
                      }
      
                      Write-Host $fieldName "Updated"
                  }
              }
              }
          };
          ##
      
          ## GET OR CREATE ITEM AND POPULATE IT
          function Get-Or-Create-Item-And-Populate($itemPath, $templatePath, $data) {
              $item = Get-Or-Create-Item -Path $itemPath -Template $templatePath;
      
              if ($item -ne $null) {
                  Write-Host $item.Name "Has been created/find";
      
                  update-item-with-lang -Data $data -Item $item;
              }
      
              return $item;
          }
      
      
      
          ## ACTION
      
          $item = Get-Or-Create-Item-And-Populate -ItemPath $itemPath -TemplatePath $templatePath -Data $data;
      
          Add-Or-Update-Page-Rendering -PagePath $pagePath -RenderingPath $renderingPath -RenderingPlaceholder $renderingPlaceholder -DataSourcePath $dataSourcePath -Parameters $parameters;
      }
      ##
      
      # REMOVE Rendering Instance
      function Remove-Rendering-Instance($pagePath, $renderingPlaceholder, $renderingPath) {
          $page = Get-Item -Path $pagePath;
          $rendering = Get-Item -Path $renderingPath;
          $pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Rendering $rendering;
      
          if ($pageRenderingInstance -ne $null) {
              Remove-Rendering -Item $page -Instance $pageRenderingInstance;
      
              Write-Host $pageRenderingInstance.Name "Removed"
          } else {
              Write-Host $renderingPath "Not found"
          }
      }
      
      
      $changeDatesPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary";
      $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Amend/Change Fee Info";
      $templatePath = "/sitecore/templates/Feature/Destinations/Amend/Change Fee Info";
      $itemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Change Fee Info";
      $data = @(
          @{
              fieldName = "Description";
              values = @{
                  en = "All prices include a {price}pp change fee and any adjustments to promotional codes.";
                  de = "Alle Preise enthalten eine Änderungsgebühr von {price}pp und eventuelle Anpassungen an Aktionscodes.";
                  fr = "Tous les prix incluent des frais de modification de {price}pp et tout ajustement des codes promotionnels."
              }
          }    
      );
      $renderingPlaceholder = "/body/change-fee-info-{38583CEB-D1E1-46EF-9AEA-A2E284152FA6}-0";
      $parameters = @{
          type = "Dates"
      }
      
      
      
      Remove-Rendering-Instance -PagePath $changeDatesPagePath -RenderingPlaceholder $renderingPlaceholder -RenderingPath $renderingPath;
      Create-Or-Update-Item-And-Populate-It-And-Update-Page-Rendering -ItemPath $itemPath -RenderingPath $renderingPath -TemplatePath $templatePath -PagePath $changeDatesPagePath -Data $data -RenderingPlaceholder $renderingPlaceholder -DataSourcePath $itemPath -Parameters $parameters;
      
      
      # Fix Amend Flights Fee Banner Rendering
      $amendFlight = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Flight";
      $feeBannerRenderingInstance = Get-Rendering -Item $amendFlight -DataSource "/sitecore/content/EasyJet/Holidays/Data/Change Fee Info";
      if ($feeBannerRenderingInstance -ne $null) {
          $params =  @{
              "type" = "Flight"
      
          };
          Set-Rendering -Item $amendFlight -Rendering $feeBannerRenderingInstance -Parameter $params;
      }
