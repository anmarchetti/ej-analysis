        $partialDesignItem.Editing.BeginEdit()
        $partialDesignItem["__Renderings"] = $renderingsAsXML
        $partialDesignItem.Editing.EndEdit()
            
        Write-Host "Item" $partialDesignItem.Name "successfully created."
    }
    
    # get the new swiss page design..
    $pageDesignItem = Get-Item -path $pageDesignItemPath -ErrorAction SilentlyContinue
    if ($pageDesignItem -eq $null) {
        # .. or create it, add swiss languages, remove english
        $pageDesignItem = New-Item -Path $pageDesignItemPath -ItemType $pageDesignTemplateID -ForceId $pageDesignItemID | 
            Add-ItemLanguage -TargetLanguage "de-CH" -IfExist Skip |
            Add-ItemLanguage -TargetLanguage "fr-CH" -IfExist Skip | 
            Remove-ItemLanguage -Language "en" 
        Write-Host "Item" $pageDesignItem.Name "successfully created."
        # get the newly created swiss-german version
        $pageDesignItem = Get-Item -path $pageDesignItemPath -ErrorAction SilentlyContinue -Language "de-CH"
        
        $partialDesignIDs = [System.Collections.ArrayList]@()
        $partialDesignIDs.Add($fullHeaderPartialDesignItemID)
        $partialDesignIDs.Add($partialDesignItemID)
        
        $IDsAsString = $partialDesignIDs -join "|"
        
        # add shared designs and version specific templates
        $pageDesignItem.Editing.BeginEdit()
        $pageDesignItem["PartialDesigns"] = $IDsAsString
        $pageDesignItem["PageTemplates"] = $targetPageTemplatesAsString
        $pageDesignItem.Editing.EndEdit() | Out-Null
        
        # get the french version
        $pageDesignItem = Get-Item -path $pageDesignItemPath -ErrorAction SilentlyContinue -Language "fr-CH"
        
        # add version specific templates
        $pageDesignItem.Editing.BeginEdit()
        $pageDesignItem["PageTemplates"] = $targetPageTemplatesAsString
        $pageDesignItem.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $pageDesignItem.Name "successfully updated with Partial Design references."
    }
