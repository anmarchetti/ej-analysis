    $sustainabilityItemTemplateID = "{CA44C600-239E-40CF-8E8A-B4F417C935D9}"
    $targetPageTemplatesArray = [System.Collections.ArrayList]@()
    $targetPageTemplatesArray.Add($homeItemTemplateID)
    $targetPageTemplatesArray.Add($sustainabilityItemTemplateID)
    $targetPageTemplatesAsString = $targetPageTemplatesArray -join "|"
    
    $ukMarketPageDesignPath = "master:/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Full Header And Footer With Phone Number"
    
    # remove swiss market languages from UK page design
    $ukMarketDesignItem = Get-Item -Path $ukMarketPageDesignPath -ErrorAction SilentlyContinue | 
        Remove-ItemLanguage -Language "de-CH" |
        Remove-ItemLanguage -Language "fr-CH"
    
    # add new partial design for the swiss footer
    $partialDesignItem = Get-Item -path $partialDesignItemPath -ErrorAction SilentlyContinue
    if ($partialDesignItem -eq $null){
        $partialDesignItem = New-Item -Path $partialDesignItemPath -ItemType $partialDesignTemplateID -ForceId $partialDesignItemID | 
            Add-ItemLanguage -TargetLanguage "de-CH" -IfExist Skip |
            Add-ItemLanguage -TargetLanguage "fr-CH" -IfExist Skip | 
