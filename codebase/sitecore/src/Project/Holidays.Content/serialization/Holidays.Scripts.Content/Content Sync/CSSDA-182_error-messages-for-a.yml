  Hint: Script
  Value: |
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            $stdoutMessage = $fieldName + " Updated";
        
            if ($values -ne $null) {
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    $amendDatesSummaryItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Amend Dates Summary Page" -ErrorAction SilentlyContinue;
    
    $data = @(
        @{
            fieldName = 'SeatsUnavailableTitle';
            values = @{
                en = 'Seats are unavailable at this time';
                fr = 'Les sièges ne sont pas disponibles pour le moment';
                de = 'Zurzeit sind keine Plätze verfügbar';
            }
        },
        @{
            fieldName = 'SeatsUnavailableDescription';
            values = @{
                en = "We're sorry, seat selection is currently unavailable. You can select your seats at a later date.";
                fr = "Nous sommes désolés, la sélection de sièges n'est pas disponible pour le moment. Vous pourrez sélectionner vos sièges ultérieurement.";
                de = 'Es tut uns leid, die Sitzplatzauswahl ist derzeit nicht verfügbar. Sie können Ihre Plätze zu einem späteren Zeitpunkt auswählen.';
            }
        }  
    );
    
    update-item-with-lang -Item $amendDatesSummaryItem -Data $data;
    
    
    #delete seats unavailable popup
    
    $amendDatesSummaryPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary" -ErrorAction SilentlyContinue;
    $seatsUnavailablePopupRenderingItem = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup" -ErrorAction SilentlyContinue;
    $seatsUnavailablePopupRenderingInstance = Get-Rendering -Item $amendDatesSummaryPageItem -Rendering $seatsUnavailablePopupRenderingItem -DataSource "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Seats Unavailable Popup";
    
    if ($seatsUnavailablePopupRenderingInstance -ne $null) {
        Remove-Rendering -Item $amendDatesSummaryPageItem -Instance $seatsUnavailablePopupRenderingInstance;
        
          Write-Host $seatsUnavailablePopupRenderingItem.Name "was removed from" $amendDatesSummaryPageItem.Name;
    }
    
    
    # Remove unavailable seats popup item
    
    $seatsUnavailablePopupItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Dates/Summary/Page Components/Seats Unavailable Popup" -ErrorAction SilentlyContinue;
    
    if ($seatsUnavailablePopupItem -ne $null) {
        $seatsUnavailablePopupItem.Delete();
        
        Write-Host $seatsUnavailablePopupItem.Name "was removed" 
    }
    
