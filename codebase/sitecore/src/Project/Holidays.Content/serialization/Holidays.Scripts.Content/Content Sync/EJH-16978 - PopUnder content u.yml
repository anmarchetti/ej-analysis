Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-16978 - PopUnder content update"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$itemName,$templateId) {
    	$item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -Name $itemName -ItemType $templateId
    		Write-Host $item.Name "created";
    	}
    	return $item
    }
    
    function Create-Offers ($path) {
    	$offers = @(
    		@{
    			Title = "Just £60pp deposit if booking more than 28 days in advance";
    			Icon = '<image mediaid="{439E1E3C-B056-4F8F-8678-0EFCC345B70D}" />';
    		},
    		@{
    			Title = "Choose from thousands or Europe's top hotels";
    			Icon = '<image mediaid="{7F4A1142-A7A9-48F9-AED6-ADBA04D0A227}" />';
    		},
    		@{
    			Title = "Flights, hotel, and 23kg bag included";
    			Icon = '<image mediaid="{D99DFA86-32C6-47E3-BF8F-24590B97FCBD}" />';
    		},
    		@{
    			Title = "Unbeatable prices and our best price guarantee";
    			Icon = '<image mediaid="{6F995EFD-674D-4C36-9C58-87C546BF4B93}" />';
    		}
    	)
    
    	$offersIds = @();
    
    	foreach ($offer in $offers) {
    		$offerItem = Get-Or-Create-Item -Path $path -ItemName $offer.Title -TemplateId "{B0DBE024-89B2-486D-AADB-1FC3EE655E25}"
    		$offersIds += $offerItem.ID
    
    		$offerItem.Editing.BeginEdit()
    		$offerItem["Title"] = $offer.Title
    		$offerItem["Icon"] = $offer.Icon
    		$offerItem.Editing.EndEdit() | Out-Null
    	}
    
    	return $offersIds;
    }
    
    
    $popUnderPath = '/sitecore/content/EasyJet/Holidays/Home/MixedResultList/Page Components/Pop Under'
    Get-ChildItem -Path $popUnderPath -Recurse | Where-Object { $_.TemplateId -eq '{DA4503C0-8D8E-4BFB-AC90-EE9707CE5EF7}' } | remove-item
    
    Write-Host "Package theme icon children removed"
    
    $offersIds = Create-Offers -Path $popUnderPath;
    
    Write-Host "Offers created"
                
    $item = Get-Item -path $popUnderPath -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["Title"] = "See how much you could save with a package holiday"
        $item["Subtitle"] = "ATOL protected and covered by our industry leading Protection Promise"
        $item["OfferSection"] = ($offersIds -join "|")
        $item["ButtonText"] = "See holidays"
        $item["BottomMark"] = "* Transfers included on beach & lake holidays. £60 per person deposit up to 28 days before travel."
        $item["Image"] = '<image mediaid="{599CF9D8-4676-4A2A-9A25-C3C57C7ADA7E}" />'
        
        $item["DestinationTitle"] = "Interested in {name}? Make it a package holiday"
        $item["DestinationSubtitle"] = "ATOL protected and covered by our industry leading Protection Promise"
        $item["DestinationOfferSection"] = ($offersIds -join "|")
        $item["DestinationButtonText"] = "See holidays"
        $item["DestinationBottomMark"] = "* Transfers included on beach & lake holidays. £60 per person deposit up to 28 days before travel."
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
            
    Write-Host "Finished"
