- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    function Add-Or-Update-Page-Rendering($page, $renderingPath, $renderingPlaceholder, $dataSourcePath) {
        $renderingItem = Get-Item -Database "master" -Path $renderingPath;
        $pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
        
        if ($pageRenderingInstance -eq $null) {
            $renderingInstance = $renderingItem | New-Rendering -Placeholder $renderingPlaceholder;
            Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Datasource $dataSourcePath;
            Write-Host $renderingItem "Rendering instance added";
        } 
        else {
             Write-Host $pageRenderingInstance "Already exists";
        }
    }
    
    
    #Update Amend Passengers Attention Item
    $amendPassengersAttentionMessagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Attention Passengers Count Change Message";
    $amendPassengersAttentionMessageItem =  Get-Or-Create-Item -path $amendPassengersAttentionMessagePath -template "{4E3890D9-808D-4390-BE32-749397BE8A74}"
    
    
    if ($amendPassengersAttentionMessageItem -ne $null) {
    	$amendPassengersAttentionMessageItem.Editing.BeginEdit();
    	
    	$amendPassengersAttentionMessageItem["Name"]="Attention Passengers Count Change Message";
    	$amendPassengersAttentionMessageItem["Title"]="Just so you know...";
        $amendPassengersAttentionMessageItem["Description"]="On this page, you can make one free of charge change of up to three characters to the full names of anyone on your booking (excluding the lead passenger). If you need to change more than three characters, or want to add or remove anyone from your booking, please get in touch with our team.";
    	$amendPassengersAttentionMessageItem["Icon"]='<image mediaid="{51A15C31-80B0-4286-9522-30165F61C780}" />';
    	
    	Write-Host $amendPassengersAttentionMessageItem.Name "Updated";
        $amendPassengersAttentionMessageItem.Editing.EndEdit() | Out-Null;
    }
    
    # Page
    $amendPassengersPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details";
    $amendPassengersPage = Get-Item -path $amendPassengersPagePath -ErrorAction SilentlyContinue;
    
    #Rendering
    $renderingPath = "/sitecore/layout/Renderings/Feature/Destinations/Attention Message";
    $renderigPlaceholder = "/body/attention-message-{b79872c8-b853-4d35-86dd-96bb39bbe554}-0";
    $renderingItem = Get-Item -Database "master" -Path $renderingPath | New-Rendering -Placeholder $renderigPlaceholder;
    $messageKey = "PASSENGERS_COUNT";
    
    if ($amendPassengersAttentionMessageItem -ne $null) {
        Add-Or-Update-Page-Rendering -page $amendPassengersPage -renderingPath $renderingPath -renderingPlaceholder $renderigPlaceholder -dataSourcePath $amendPassengersAttentionMessagePath
    }
    
    #Update Amend Passengers Settings
    $amendSettings = Get-Item "/sitecore/content/EasyJet/Holidays/Settings/Amend Booking Settings";
    if ($amendSettings -ne $null) {
        $amendSettings.Editing.BeginEdit();
        
        $amendSettings["IsRestrictionInfoEnabled"] = "1"
        
        Write-Host $amendSettings.Name "Updated"
        $amendSettings.Editing.EndEdit() | Out-Null;
    }
    
    
    
    
    
    
