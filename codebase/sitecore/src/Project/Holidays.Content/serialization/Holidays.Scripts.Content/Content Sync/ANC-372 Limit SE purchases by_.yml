  Value: |
    function Get-Or-Create-Item($path, $template, $name){
        $itemPath = "$path/$name"
        $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $itemPath -ItemType $template
        }
        
        return $item
    }
    
    function Setup-Seasons($project){
        $template = '{75964261-DCE6-4C41-8518-95450240EA45}'
        $settingPath = "/sitecore/content/EasyJet/$project/Data/Ancillaries/Extra Luggage Lists"
        $firstSeasonID = ''
        
        for (($i = 1); $i -lt 5; $i++)
            {
                $season = Get-Or-Create-Item -Path $settingPath -Template $template -Name "Season $i"
                
                if(($season -ne $null) -and ($i -eq 1)) {
                    $season.Editing.BeginEdit()
                    $season['StartDate'] = '20240901T000000Z'
                    $season['EndDate'] = '20241130T000000Z'
                    $season.Editing.EndEdit() | Out-Null
                    
                    $firstSeasonID = $season.ID
                }
                
                Write-Host "Season $i created under Extra Luggage Lists on $project"
            }
        
        $setting =  Get-Item -Path $settingPath -ErrorAction SilentlyContinue
        
        if($setting -ne $null) {
            $setting.Editing.BeginEdit()
            $setting['RestrictionSeasonsList'] = $firstSeasonID
            $setting.Editing.EndEdit() | Out-Null
            
            Write-Host "First season date set on $project"
        }
    }
    
    Setup-Seasons -Project 'Holidays'
    Setup-Seasons -Project 'TradePortal'
    
