    $footercopyrightflightplushotel_linktext_770f58e8477e4ac58b8a4e22bb750e4e_en_v107 = @"
    *Terms & Conditions
    "@
    $footercopyrightflightplushotel_description_770f58e8477e4ac58b8a4e22bb750e4e_en_v107 = @"
    <p><span><strong>Offer conditions&nbsp;</strong></span><br />
    <span></span><br />
    <span><strong>Holiday Savings</strong> are based on price reductions we&rsquo;ve agreed with some hotel partners&nbsp;</span><span>compared to our standard contract rates together with our own price&nbsp;</span><span>adjustments. These discounts are included in current advertised prices on selected</span>
    <span>holidays. Savings apply to bookings made from 16/03/26, travel from applicable&nbsp; &nbsp;</span><br />
    <span>airports between April 2026 and October 2026 (inclusive). Prices subject to change at&nbsp;</span><span>any time. Holidays subject to availability. Offer may be changed/withdrawn without&nbsp;</span><span>notice.&nbsp;</span><br />
    <span></span><br />
    <span><strong>Hotel price discount</strong> - on selected holidays, we may show that the holiday price&nbsp;</span><span>includes a discount off the hotel cost. This discount is a reduction off the standard&nbsp; &nbsp;</span><br />
    <span>hotel contract rate which has been negotiated with hotels (such as early or late&nbsp;</span><span>booking offers). Discounts are subject to change.&nbsp;</span><span>Free Child Places - One free child place for every two full paying adults sharing&nbsp;</span><span>accommodation is available on selected holidays, where you see the &lsquo;Free child place&rsquo;&nbsp;</span><span>label, subject to availability. Maximum one free child per room. When free child places&nbsp;</span><span>sell out, the current child price will apply. Sometimes restrictions apply to some rooms.&nbsp;</span><span>Supplements still apply for optional extras added to the holiday. A deposit is payable&nbsp;</span><span>for the free child place at the time of booking - this will be deducted from the final&nbsp;</span><span>holiday balance. The child age limit can vary by hotel. Offer can be changed/withdrawn&nbsp;</span><span>without notice.&nbsp;&nbsp;</span><br />
    <span><br />
    </span><br />
    <span><strong>Free Night Included</strong> - available on selected holidays where you see this message near&nbsp;</span><span>the price. The price shown includes a reduction equivalent to one or more free nights&nbsp; &nbsp;</span><br />
    <span>stay. The reduction is based on the same board basis and room type as selected for the&nbsp;</span><span>holiday. These offers are subject to change and available for a limited time. Offers will&nbsp; &nbsp;</span><br />
    <span>require a minimum stay and apply to a particular day/days of the week. Changing&nbsp;</span><span>travel dates may invalidate the offer and/or result in a holiday price change (e.g. if the&nbsp; &nbsp;</span><br />
    <span>flight cost is higher/lower). Offer may be changed/withdrawn without notice. Prices are&nbsp;</span><span>subject to change and holidays/dates are subject to availability.&nbsp;&nbsp;</span><br />
    <span></span></p>
    <p><span><strong>Holiday price savings</strong> - on selected holidays, we may show a comparison to a higher&nbsp;</span><span>price for the same package. The higher price shows the cost before reductions were&nbsp; &nbsp;</span><br />
    <span>applied. When we launch a new season and holidays go on sale, we calculate a basic&nbsp;</span><span>price for each package holiday including all our costs of providing the flight,&nbsp; &nbsp;</span><br />
    <span>accommodation and other services that make up each holiday. We then reduce the&nbsp;</span><span>price for selected packages and the reductions we apply are off our standard hotel&nbsp; &nbsp;</span><br />
    <span>contract rates where we&rsquo;ve negotiated early or late booking offers from hotels. We&nbsp;</span><span>also make our own price adjustments (such as applying promotional discounts) which&nbsp; &nbsp;</span><br />
    <span>are also included in current advertised price. These reductions we apply may go up or&nbsp;</span><span>down and reflect the difference between the higher price we have crossed out and the&nbsp;</span><span>current price.&nbsp; &nbsp;</span><br />
    <span><br />
    </span><br />
    <span><strong>Group holidays - &pound;25 off per person</strong> - &pound;25 off per person for groups of over 10&nbsp;</span><span>passengers on one booking, minimum spend &pound;2,000 per booking based on the total&nbsp;</span><span>price . Promotion valid for new bookings made before 30/9/26 for any travel dates on&nbsp;</span><span>sale on our website at the time of booking. Offer applies to all easyJet holiday&nbsp;</span><span>destinations from applicable UK airports, subject to availability. Prices are subject to&nbsp;</span><span>change. Offer may be changed or withdrawn without notice. Maximum of one discount&nbsp;</span><span>per booking not combinable with any other offer/discount. Discount cannot be used in&nbsp; &nbsp;</span><br />
    <span>conjunction with Free Child Places. If a booking including this discount is&nbsp;</span><span>changed/cancelled, the discount will no longer be valid on the new/amended booking.&nbsp;</span><span>Offer only available by phone. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;&nbsp;</span></p>
    <p><span></span><br />
    <span>Ultimate flexibility: <strong>Refund guarantee </strong>- Receive a refund of your deposit as easyJet&nbsp;</span><span>holidays account credit, if you change your mind and cancel up to 60 days before&nbsp; &nbsp;</span><br />
    <span>departure. Applies to the first cancellation per customer only, subsequent cancellations&nbsp;</span><span>will result in loss of deposit. <strong>Best price guarantee</strong> - If within 24 hours of booking with&nbsp; &nbsp;</span><br />
    <span>us, you find the same holiday cheaper from another ATOL protected holiday company&nbsp;</span><span>that&rsquo;s a member of ABTA, we&rsquo;ll credit the difference in price, plus an additional &pound;5 per&nbsp; &nbsp;</span><br />
    <span>adult/booking, to your online easyJet holidays account. Subject to the <a href="~/link.aspx?_id=AB13D86A7B7A4317ABE43E2E9F488751&amp;_z=z"><span>Best Price&nbsp;</span><span>Guarantee Terms &amp; Conditions</span></a>. <strong>Freedom to change </strong>&ndash; Make online changes up to 28&nbsp;</span><span>days before departure (where possible) or through our contact centre. Changes are&nbsp;</span><span>subject to paying any difference in holiday cost and change fees <a href="~/link.aspx?_id=01FA2D692BB34BA9B98D15DA2DF1D8AC&amp;_z=z">if applicable</a>. <strong>Easy&nbsp;</strong></span><span><strong>ways to pay</strong> - Payment in instalments with your final balance only due 28 days before&nbsp;</span><span>your holiday. These T&amp;C&rsquo;s are supplementary to our <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>. Where easyJet&nbsp;</span>holidays online credit applies, that will be subject to our <a href="~/link.aspx?_id=057B8331443B4FA1B86BBA5BD609FAC9&amp;_z=z">Credit Terms &amp; Conditions</a>.   </p>
    <p>
    <span><strong>"From" prices displayed on the website</strong> - Prices are based on 2 adults sharing a&nbsp;</span><span>standard room type. Prices are usually based on a 2 night or 3 night stay (city breaks)&nbsp;</span><br />
    <span>on selected dates up to June 2026, a 7 night stay (beach holiday destinations) on&nbsp;</span><span>selected dates up to June 2026, or a 7 night stay (lake holiday destinations) on selected&nbsp; &nbsp;</span><br />
    <span>dates up to June 2026. Prices are from various UK departure airports. "From" prices&nbsp;</span><span>displayed on our search results and hotel details pages &ndash; these prices are subject to&nbsp; &nbsp;</span><br />
    <span>system updates. Price and availability shown on these pages are not live but are&nbsp;</span><span>updated at least 3 times per day. A live price check is made from the &lsquo;extras&rsquo; page and&nbsp; &nbsp;</span><br />
    <span>prices/availability can change at any time prior to a booking being confirmed. On&nbsp;</span><span>selected pages, you can change the sort order to show prices &lsquo;low to high&rsquo; in order to&nbsp; &nbsp;</span><br />
    <span>display our lowest priced holidays. All holidays are subject to availability and prices are&nbsp;</span><span>subject to change. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;&nbsp;</span><br />
    <span><br />
    </span><br />
    <span><strong>Room availability</strong> - Where we have only a few rooms available, we may display a&nbsp;</span><span>message near the room type. The statement is based on rooms available at that price.&nbsp; &nbsp;</span><br />
    <span>Price and availability of rooms can change at any time. We occasionally add extra&nbsp;</span><span>rooms on sale at a later time/date if we can secure those from the accommodation&nbsp; &nbsp;</span><br />
    <span>provider.&nbsp;</span><span><br />
    </span><br />
    <span><strong>Seat selection availability</strong> - Where we have only a few seat numbers available for&nbsp;</span><span>selection on the outbound or inbound flight, we may display a message on our Extras&nbsp; &nbsp;</span><br />
    <span>page where you can book your seats on the plane. The statement is based on seats not&nbsp;</span><span>yet selected by other passengers. Price and availability of seats for selection can&nbsp; &nbsp;</span><br />
    <span>change at any time, for example due to cancellations or selections made by other&nbsp;</span><span>passengers. View the seating plan for current availability of both outbound and&nbsp; &nbsp;</span><br />
    <span>inbound flights. Unless otherwise selected in advance, seats will be allocated at check&nbsp;</span><span>in &ndash; more details on the easyJet seating arrangements can be found on easyJet.com.&nbsp;&nbsp;</span><br />
    <span>Large cabin bag availability - Where we have only a few large cabin bag spaces&nbsp;</span><span>available for selection on the outbound or inbound flight, we may display a message&nbsp; &nbsp;</span><br />
    <span>on our Extras page where you can add large cabin bags for the flight(s). The statement&nbsp;</span><span>is based on bag availability not yet purchased by other passengers. Price and&nbsp; &nbsp;</span><br />
    <span>availability of large cabin bags can change at any time, for example due to&nbsp;</span><span>cancellations or selections made by other passengers. Availability for large cabin bags&nbsp; &nbsp;</span><br />
    <span>will be shown on the Extras page per passenger. More details on the easyJet large&nbsp;</span><span>cabin bags policy can be found on easyJet.com.&nbsp;&nbsp;</span><br />
    <span><br />
    </span><br />
    <span><strong>&ldquo;Certified sustainable&rdquo;</strong> - This means the hotel has obtained certification that meets&nbsp;</span><span>the <a href="https://www.gstcouncil.org/">Global Sustainable Tourism Council (GSTC)</a> standard. GSTC manages global&nbsp; &nbsp;</span><br />
    <span>standards for sustainable travel and tourism, and acts as the international&nbsp;</span><span>accreditation body for sustainable tourism certification. Information accurate as at&nbsp; &nbsp;</span><br />
    <span>time of upload. Subject to change without notice. Where our site contains links to other&nbsp;</span><span>sites and resources provided by third parties, these links are provided for your&nbsp; &nbsp;</span><br />
    <span>information only. Such links should not be interpreted as approval by us of those linked&nbsp;</span><span>websites or information you may obtain from them. We have no control over the&nbsp; &nbsp;</span><br />
    <span>contents of those sites or resources.</span></p>
    "@
