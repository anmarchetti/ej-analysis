    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $componentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Refund Infos/Only Credit Refund"
    $templateId = "{78FA9DD5-E2A9-4B90-A73E-A9674884B9F0}"
    
    $item = Get-Or-Create-Item -path $componentPath -template $templateId
    $item.Editing.BeginEdit()
    $item["PopupTitle"] = 'You Will Lose The Expired Staff Credit'
    $item["PopupDescription"] = 'Are you sure you want to cancel your booking? As some or all of your staff credit has expired will not be refunded. Once cancelled your booking cannot be reinstated.'
    $item.Editing.EndEdit()
