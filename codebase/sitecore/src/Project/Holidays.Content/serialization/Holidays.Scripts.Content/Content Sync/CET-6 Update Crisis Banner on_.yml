- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    function UpdateCrisisBannerDatasource($pagePath, $dataSource) {
        $crisiBannerRenderingId = "{8F67CD81-1EF5-4611-BD64-59D6315694FC}" 
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $crisiBannerRenderingId }
    	
    	$crisisBannerRendering = $renderings[0];
    	
    	if ($crisisBannerRendering -ne $null) {
    	    Set-Rendering -Item $page -Instance $crisisBannerRendering  -Datasource $dataSource
    	    Write-Host "Updated $($pagePath) Crisis Banner datasource"
    	}
    }
    
    $crisisBannerDatasource = "/sitecore/content/EasyJet/Holidays/Data/View Booking Data/Common Crisis Banners/Crisis Banner"
    
    UpdateCrisisBannerDatasource -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel' -dataSource $crisisBannerDatasource 
    UpdateCrisisBannerDatasource -pagePath '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel' -dataSource $crisisBannerDatasource 
