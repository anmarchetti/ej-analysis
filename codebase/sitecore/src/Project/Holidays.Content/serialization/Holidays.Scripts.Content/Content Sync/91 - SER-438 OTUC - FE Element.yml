    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    function create-popup($path, $translations ){
        $data = Get-Or-Create-Item -path $path -templateId '{30B4CEE4-5754-4021-B936-4D9D5F71457E}'
        foreach ($lang in $translations.Keys) {
                create-lang-version -item $data -lang $lang -field "IsLinkVisible" -value $translations[$lang]["IsLinkVisible"]
                create-lang-version -item $data -lang $lang -field "LinkText" -value $translations[$lang]["LinkText"]
                create-lang-version -item $data -lang $lang -field "TitlePopup" -value $translations[$lang]["TitlePopup"]
                create-lang-version -item $data -lang $lang -field "TextPopup" -value $translations[$lang]["TextPopup"]
                create-lang-version -item $data -lang $lang -field "PopupUniqueId" -value $translations[$lang]["PopupUniqueId"]
            }    
            
        return $data;
    }
    
    function set-popup($path, $val ){
     $data = Get-Or-Create-Item -Path $path -TemplateId '{039B23C0-8AD4-413C-B0B1-7027F74F6C5F}'
    
        if ($null -ne $data) {
            $currentValues = if ($data['Popups']) { $data['Popups'] -split "\|" } else { @() } 
            
            $currentValues = $currentValues | Where-Object { $_ -ne "" }
    
            $updatedValues = $currentValues + ($val | Where-Object { $_ -notin $currentValues })
    
            $data.Editing.BeginEdit()
            $data['Popups'] = ($updatedValues -join "|")
            $data.Editing.EndEdit() | Out-Null
        }
    } 
    
