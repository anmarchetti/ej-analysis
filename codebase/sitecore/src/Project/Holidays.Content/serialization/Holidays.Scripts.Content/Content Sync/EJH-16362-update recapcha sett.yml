Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-16362-update recapcha settings and remove broken datasource from renderings"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $renderingId = "{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}" #Component Wrapper
    $contactUsPagePath = "/sitecore/content/EasyJet/Holidays/Home/Root/Info/Contact Us"
    
    $contactUsPageItem = Get-Item -Path "master:" -Query $contactUsPagePath
    $renderings = Get-Rendering -Item $contactUsPageItem | Where-Object { $_.ItemID -eq $renderingId }
    
    foreach($rendering in $renderings){
          $rendering.DataSource = $null
          Set-Rendering -Item $contactUsPageItem -Instance $rendering
    }
    
    $reCapchaSettingsPath = "/sitecore/content/EasyJet/Holidays/Settings/reCAPTCHA Settings"
    $reCapchaSettingsItem = Get-Item -Path "master:" -Query $reCapchaSettingsPath
    $reCapchaSettingsItem.Editing.BeginEdit()
    $reCapchaSettingsItem.Fields["IsRecaptchaEnabledContactUs"].Value = "1";
    $reCapchaSettingsItem.Editing.EndEdit()
