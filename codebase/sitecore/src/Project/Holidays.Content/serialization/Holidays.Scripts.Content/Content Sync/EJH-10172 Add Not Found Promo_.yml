SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $itemTemplateId = '{63094ecd-5d80-46b4-914f-e81b73edaa53}';
    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Not Found Promo Banner Settings"
    
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
    
    if ($item -eq $null) {
    	$item = New-Item -Path $itemPath -ItemType $itemTemplateId
    
    	$item.Editing.BeginEdit()
    	$item["IsNotFoundPromoBannerEnabled"] = "1";
    	$item["NotFoundPromoBannerPosition"] = 5;
    	$item["NotFoundPromoBannerFrequency"] = 10;
    	$item.Editing.EndEdit() | Out-Null
    
    	Write-Host $item.Name "successfully created"
    }
    
