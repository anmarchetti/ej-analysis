                              "de-CH" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                              "de-DE" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                          }
                          "DateUnavailableMessage" = @{
                              "en"    = "Sorry, no available dates on this month"
                              "fr-CH" = "Désolé, il n'y a pas de dates disponibles ce mois-ci"
                              "fr-FR" = "Désolé, il n'y a pas de dates disponibles ce mois-ci"
                              "de-CH" = 'Leider sind in diesem Monat keine Termine verfügbar'
                              "de-DE" = 'Leider sind in diesem Monat keine Termine verfügbar'
                          }
                          "FlexibilityOptions" = @{
                              "en"    = $flexabilityOptionIds
                              "fr-CH" = $flexabilityOptionIds
