                              "de-DE" = $flexabilityOptionIds
                          }
                          
                      }
                      TemplatePath = "/sitecore/templates/Foundation/Destinations/Settings/Calendar Settings"
                  },
                  @{
                      Path         = "/sitecore/content/EasyJet/TradePortal/Settings/Calendar Setting"
                      Fields       = @{
                          "DateUnavailableImage" = @{
                              "en"    = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                              "fr-CH" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                              "fr-FR" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                              "de-CH" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                              "de-DE" = '<image mediaid="{82F03044-9FB5-4AAA-8801-45753CA7A5FE}" />'
                          }
                          "DateUnavailableMessage" = @{
                              "en"    = "Sorry, no available dates on this month"
                              "fr-CH" = "Désolé, il n'y a pas de dates disponibles ce mois-ci"
                              "fr-FR" = "Désolé, il n'y a pas de dates disponibles ce mois-ci"
                              "de-CH" = 'Leider sind in diesem Monat keine Termine verfügbar'
                              "de-DE" = 'Leider sind in diesem Monat keine Termine verfügbar'
                          }
                      }
                      "FlexibilityOptions" = @{
                              "en"    = $flexabilityOptionIds
                              "fr-CH" = $flexabilityOptionIds
                              "fr-FR" = $flexabilityOptionIds
                              "de-CH" = $flexabilityOptionIds
                              "de-DE" = $flexabilityOptionIds
                      }
                      TemplatePath = "/sitecore/templates/Foundation/Destinations/Settings/Calendar Settings"
                  }
        )
              
        ImportContent -itemsToCreate $updates
        
        
    #rename folder
    $folder = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Promo Page Search Pods"
    if($folder -ne $null){
        $folder.Editing.BeginEdit()
        $folder.Name = "Search Pods"
        $folder.Editing.EndEdit() | Out-Null
    }
    
    # rename setting
    $setting = Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Settings/Guests Number Validation Settings"
    if($setting -ne $null){
        $setting.Editing.BeginEdit()
        $setting.Name = "Guests Validation Settings"
        $setting.Editing.EndEdit() | Out-Null
    }
    
    
    
        
    # Create Search Pod Datasource
    
      $searchpod = @(
                @{
                      Path         = "/sitecore/content/EasyJet/Holidays/Data/Search Pods/Search Pod"
                      Fields       = @{
                          "SearchToHotelMessageIcon" = @{
                              "en"    = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
                              "fr-CH" = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
                              "fr-FR" = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
                              "de-CH" = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
                              "de-DE" = '<image mediaid="{D2B2D4C7-578A-48BA-960A-C54A1F22287E}" />'
                          }
                          "SearchToHotelMessageText" = @{
                              "en"    = "Click here to search for this hotel"
                              "fr-CH" = "Cliquez ici pour chercher cet hôtel"
                              "fr-FR" = "Cliquez ici pour chercher cet hôtel"
                              "de-CH" = 'Klicke hier, um nach diesem Hotel zu suchen'
                              "de-DE" = 'Klicke hier, um nach diesem Hotel zu suchen'
                          }
                           "SearchToHotelMessageTitle" = @{
                              "en"    = "Want to change your search for {hotelName}?"
                              "fr-CH" = "Vous souhaitez modifier votre recherche pour {hotelName}?"
                              "fr-FR" = "Vous souhaitez modifier votre recherche pour {hotelName}?"
                              "de-CH" = 'Möchtest du deine Suche auf {hotelName}?'
                              "de-DE" = 'Möchtest du deine Suche auf {hotelName}?'
                          }
                      }
                      TemplatePath = "/sitecore/templates/Foundation/Destinations/Search/Search Pod "
                  }
        )
              
        ImportContent -itemsToCreate $searchpod
    
    $searchPodRenderingId = "{216FE85C-936E-4135-894B-E7DE8BF8A4C2}"
        
    
    # remove Airport datasource from search pod
    function Remove-Datasource($lang){
        @("/sitecore/content/EasyJet/Holidays/Home/Copy of Hotel Details",
        "/sitecore/content/EasyJet/Holidays/Home/Hotel Details",
        "/sitecore/content/EasyJet/Holidays/Home/MixedResultList",
        "/sitecore/content/EasyJet/Holidays/Home/Disruption",
        "/sitecore/content/EasyJet/TradePortal/Home",
        "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details",
        "/sitecore/content/EasyJet/TradePortal/Home/MixedResultList") | % {
            $item = Get-Item -Path "master:$_" -Language $lang -ErrorAction SilentlyContinue
            
            if($item -ne $null){
                Get-Rendering -Item $item -FinalLayout -Language $lang | Where-Object {$_.ItemId -eq $searchPodRenderingId} |
                    Foreach-Object { 
                        $_.DataSource = $null 
                        Set-Rendering -Item $item -Instance $_ -FinalLayout -Language $lang
                    }
                Write-Host "$($item.Paths.FullPath) $lang"
            }
    
        }
    }
    
    
    @('de-CH', 'de-DE', 'en', 'fr-CH', 'fr-FR') | % {
        Remove-Datasource -lang $_
    }
        
