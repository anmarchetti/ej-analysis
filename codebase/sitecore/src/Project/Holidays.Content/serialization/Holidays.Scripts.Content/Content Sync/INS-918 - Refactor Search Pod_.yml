        @("/sitecore/content/EasyJet/Holidays/Data/Search Pods/Search Pod With Hero Image", "/sitecore/content/EasyJet/Holidays/Data/Search Pods/Simple Search Pod") | % {
            Remove-Item -Path $_ -Force
        }
        
