  Hint: Script
  Value: |
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
    
    $data = @(
        @{
            fieldName = "Description";
            values = @{
                en = "There are no alternative room & board options online for your selected hotel. <br /><br />If you need to talk to us about changing your holiday package please contact us.";
                fr = "Il n'y a pas d'autres options de chambres et de repas en ligne pour l'hôtel sélectionné. <br /><br />Si vous souhaitez nous parler de la modification de votre forfait de vacances, veuillez nous contacter.";
                de = "Für das von Ihnen gewählte Hotel gibt es online keine alternativen Optionen für Unterkunft und Verpflegung. <br /><br />Wenn Sie mit uns über eine Änderung Ihres Urlaubspakets sprechen möchten, kontaktieren Sie uns bitte.";
            }
        }    
    )
    
    
    $rbcUnavailablePopup = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Room And Board Unavailable Popup" -ErrorAction SilentlyContinue;
    
    update-item-with-lang -Item $rbcUnavailablePopup -Data $data;
