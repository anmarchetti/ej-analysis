    #Add renderings to pages
    function Add-New-Rendering($item, $placeholder, $renderingId, $datasource, $index, $parameters){
        $renderingItem = Get-Item -Path "master:" -ID $renderingId | New-Rendering -Placeholder $placeholder
        Add-Rendering -Item $item -Instance $renderingItem -PlaceHolder $placeholder -DataSource $datasource -Index $index
        Get-Rendering -Item $item -Index $index | Set-RenderingParameter -Parameter @{"IsWhiteBackground"= "1"; "FallbackImage" = "<image mediaid='{B8BDEFA6-5D0E-4F27-B6C3-53BDD9A3A32C}'/>";} | Set-Rendering -Item $item
    }
    function Add-Rendering-To($item, $renderingId, $datasource, $datasourceFilter){
        $index = 0
        Get-Rendering -Item $item |
        Foreach-Object { 
            $index++
            if($_.ItemId -eq $renderingId)
            {
                if(($datasourceFilter -ne $null -and $_.Datasource -eq $datasourceFilter) -or $datasourceFilter -eq $null){
                    if($index -gt 0)
                    {
                        $incrementIndex = $index
                        if ($sing -ne 0){
                            $incrementIndex = $index + $sign
                        }
                        
                        Add-New-Rendering -Item $item -Placeholder "body" -RenderingId "{E78B6A7E-0EC5-4324-A290-971EE74C1FC8}" -Datasource $datasource -Index $incrementIndex 
                        
                    }
                    return
                }
                
            }
        }
    }
    function Add-Carousel($pagePath, $rendId,  $datasource, $datasourceFilter ){
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue;
        if ($page -ne $null) {
             Add-Rendering-To -Item $page -RenderingId $rendId -datasource $datasource.ID  -DatasourceFilter $datasourceFilter;
        }
    }
    
