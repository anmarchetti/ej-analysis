    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    function Create-Recommender-Data($recommenderPath, $placementId) {
        $recomData = Get-Or-Create-Item -Path $recommenderPath -Template "{439330F2-BA2B-4D2D-9198-188D525F5877}";
        if ($recomData -ne $null) {
            $recomData.Editing.BeginEdit()
            $recomData["Title"] = "Glad we could help you, now we can recommend you some holidays";
            $recomData["BD4PlacementId"] = $placementId;
            $recomData.Editing.EndEdit()
        }
        
        return $recomData;
    }
    
