    #update placement ids for other carousels
    function Add-Carousel($path, $placementId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue;
        if ($item -ne $null) {
              $item.Editing.BeginEdit()
              $item["BD4PlacementId"] = $placementId;
              $item.Editing.EndEdit()
        }
    }
    
