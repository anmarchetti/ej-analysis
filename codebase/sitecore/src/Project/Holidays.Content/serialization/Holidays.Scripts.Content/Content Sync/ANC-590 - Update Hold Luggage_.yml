Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-590 - Update Hold Luggage Datasource"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Data source
    $holdLuggageHolidayComponentPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage";
    $holdLuggageTradePortalComponentPath = "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal";
    
    function updateHoldLuggage($componentPath) {
        
        $item = $itemHoliday = Get-Item -Path $componentPath -ErrorAction SilentlyContinue
    
        if($item -ne $null) {
        
        #Populate with updated data
        $item.Editing.BeginEdit()
        
        #Component content
        $item["RequestFailureHeader"] = "Adding hold luggage is unavailable at this time"
        $item["RequestFailureDescription"] ="We're sorry, the ability to add hold luggage is currently unavailable for these flights. You can still book your holiday and add luggage at a later stage."
        
        $item.Editing.EndEdit() | Out-Null
    }
    }
    
    updateHoldLuggage($holdLuggageHolidayComponentPath)
    updateHoldLuggage($holdLuggageTradePortalComponentPath)
    
