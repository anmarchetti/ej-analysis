SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId) {
    	$item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
    	if ($item -eq $null) {
    		$item = New-Item -Path $path -ItemType $templateId
    		Write-Host "Item" $item.Name "successfully created";
    	}
    	return $item
    }
    
    $amendItemInfo = Get-Or-Create-Item "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment/Page Components/Amend Item Info" "{D5D8F8FC-FA15-43ED-B338-E21B7478AAAA}"
    
    if ($amendItemInfo -ne $null) {
    	$amendItemInfo.Editing.BeginEdit();
    
    
    	$amendItemInfo["PromoCodeChangedDescription"] = "Your promo code discount has changed";
    	$amendItemInfo["PromoCodeRemovedDescription"] = "Your promo code is no longer valid";
    	$amendItemInfo["PromoCodeDowngradedSubtextTransfer"] = "Your original promo code has been downgraded to {promoCode}. This decrease in discount has been included in the total package price change.";
    	$amendItemInfo["PromoCodeUpdatedSubtextTransfer"] = "Your original promo code has been upgraded to {promoCode}. This increase in discount has been included in the total package price change.";
    
    
    	$amendItemInfo.Editing.EndEdit() | Out-Null;
    
    	Write-Host $amendItemInfo.Name "updated";
    } 
