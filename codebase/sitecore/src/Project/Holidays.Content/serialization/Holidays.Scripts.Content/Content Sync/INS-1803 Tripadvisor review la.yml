- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Set-TranslatedFieldValue (
    	[Parameter(Mandatory = $true)]
    	[Sitecore.Data.Items.Item]$sourceItem,
    
    	[Parameter(Mandatory = $true)]
    	[string]$lang,
    
    	[Parameter(Mandatory = $true)]
    	[string]$fieldName,
    
    	[Parameter(Mandatory = $true)]
    	[string]$fieldValue
    ) {
    	$targetLangItem = Get-Item -Path $sourceItem.Paths.FullPath -Language $lang
    	if ($null -eq $targetLangItem -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemLanguage -Item $sourceItem -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
    	}
    
    	$targetLangItem = Get-Item -Path $sourceItem.Paths.FullPath -Language $lang
    	$targetLangItem.Editing.BeginEdit()
    	$targetLangItem[$fieldName] = $fieldValue
    	$targetLangItem.Editing.EndEdit() | Out-Null
    	Write-Host ("Updated field '{0}' for language '{1}' on item '{2}'" -f $fieldName,$lang,$targetLangItem.Paths.FullPath)
    }
    
    function Update-Translations {
    	param(
    		[string]$dictionaryPath,
    		[string]$englishText,
    		[string]$germanText,
    		[string]$frenchText
    	)
    
    
    	$item = Get-Item -Path $dictionaryPath -ErrorAction SilentlyContinue
    
    	if ($null -ne $item) {
    		Set-TranslatedFieldValue -sourceItem $item -lang "en" -fieldName "Phrase" -fieldValue $englishText
    
    		if (![string]::IsNullOrWhiteSpace($germanText)) {
    		    @( "de-DE","de-CH") | ForEach-Object {
    				Set-TranslatedFieldValue -sourceItem $item -lang $_ -fieldName "Phrase" -fieldValue $germanText
    			}
    		}
    
    		if (![string]::IsNullOrWhiteSpace($frenchText)) { 
    		    @( "fr-FR","fr-CH") | ForEach-Object {
    				Set-TranslatedFieldValue -sourceItem $item -lang $_ -fieldName "Phrase" -fieldValue $frenchText
    			}
    		}
    	}
    }
    
    
    # Close Reviews List
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/Holidays/Dictionary/Hotel Reviews/Labels/Close Reviews List" -englishText "Hide Tripadvisor reviews" -germanText "Bewertungen von Tripadvisor ausblenden" -frenchText "Masquer les avis Tripadvisor"
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Hotel Reviews/Labels/Close Reviews List" -englishText "Hide Tripadvisor reviews"
    
    # Open Reviews Drawer
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/Holidays/Dictionary/Hotel Reviews/Labels/Open Reviews Drawer" -englishText "See Tripadvisor reviews" -germanText "Bewertungen von Tripadvisor anzeigen" -frenchText "Voir les avis sur Tripadvisor"
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Hotel Reviews/Labels/Open Reviews Drawer" -englishText "See Tripadvisor reviews"
    
    # Close Reviews List
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/Holidays/Dictionary/Hotel Reviews/Labels/Open Reviews List" -englishText "Show Tripadvisor reviews" -germanText "Bewertungen von Tripadvisor anzeigen" -frenchText "Afficher les avis Tripadvisor"
    Update-Translations -dictionaryPath "master:/sitecore/content/EasyJet/TradePortal/Dictionary/Hotel Reviews/Labels/Open Reviews List" -englishText "Show Tripadvisor reviews"
