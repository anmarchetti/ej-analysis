Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Set Values for SearchPod on Promo Pages
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Set-Rendering-Parameters($item){
        $renderingInstance =  Get-Rendering -Item $item -Rendering $searchPodRendering
            
        if($renderingInstance -eq $null){
            return;
        }
        Set-Rendering -Item $item -Instance $renderingInstance -Parameter $parameters
        Write-Host "SerchPod parameters in Promo Page updated"
    }
    
    function Traverse-Items($parentItem){
        ForEach($promo in $parentItem.GetChildren()){
            Set-Rendering-Parameters($promo)
            $childrenPromo = $promo.GetChildren()
            if($childrenPromo -eq $null) {
                return;
            }
            Traverse-Items -parentItem $promo
        }
    }
    
    $promoPagesRootFolderPath = "master:/sitecore/content/EasyJet/Holidays/Home/Root"
    
    $promoPagesRootFolderPathItem = Get-Item -Path $promoPagesRootFolderPath
    
    $searchPodRenderingPath = "master:/sitecore/layout/Renderings/Foundation/Destinations/Search Pod"
    
    $searchPodRendering = Get-Item -Path $searchPodRenderingPath
    
    $parameters = [ordered]@{"IsSticky"= ''; "ShowTitle"= '1';}
    
    Traverse-Items -parentItem $promoPagesRootFolderPathItem
    
    
