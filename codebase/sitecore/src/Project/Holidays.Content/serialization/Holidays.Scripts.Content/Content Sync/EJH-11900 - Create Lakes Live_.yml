- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $livePriceTempalteId = "{8D0058CA-9E2B-428F-A0DC-50F8BD77A694}"
    $livePricePath = "/sitecore/content/EasyJet/Holidays/Data/Live Price/Named Searches"
    $livePricenName = "Lakes"
    
    $destinationItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Destinations" 
    
    $items = $destinationItem.Children | ForEach-Object { $_.Id } 
    $ids= $items -join '|'
    
    function Get-Or-Create-Item($name, $path, $template){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $template
        }
        
        return $item
    }
    
    function Update-Item($item){
        if($item -ne $null){
            $item.Editing.BeginEdit()
            $themsFolder = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes"  -ErrorAction SilentlyContinue
            $lakesTheme = $themsFolder.Children | Where-Object { $_.Name -eq "Lakes" } | Select -First 1
            $item.Fields["ThemeTypes"].Value = $lakesTheme.ID
            $item.Fields["DefaultDuration"].Value = 7
            $item.Fields["NumberOfAdults"].Value = 2
            $item.Fields["NumberOfChildren"].Value = 0
            $item.Editing.EndEdit() > $null
            
            $periodJanMar = Get-Or-Create-Item -Name "Jan - Mar 21" -Path $item.FullPath -Template "{056AC05C-E1D1-4FD4-BC4C-CEC966FA75E2}"
            $periodJanMar.Editing.BeginEdit()
            $periodJanMar.Fields["Destinations"].Value = $ids
            $periodJanMar.Fields["DateOfRunStartDate"].Value = "20210101T000000Z"
            $periodJanMar.Fields["DateOfRunEndDate"].Value = "20220331T000000Z"
            $periodJanMar.Fields["SearchDateRangeStartDate"].Value = "20210401T000000Z"
            $periodJanMar.Fields["SearchDateRangeEndDate"].Value = "20220630T000000Z"
            $periodJanMar.Editing.EndEdit() > $null
            
            $periodAprAugr = Get-Or-Create-Item -Name "Apr - Aug 21" -Path $item.FullPath -Template "{056AC05C-E1D1-4FD4-BC4C-CEC966FA75E2}"
            $periodAprAugr.Editing.BeginEdit()
            $periodAprAugr.Fields["Destinations"].Value = $ids
            $periodAprAugr.Fields["DateOfRunStartDate"].Value = "20210401T000000Z"
            $periodAprAugr.Fields["DateOfRunEndDate"].Value = "20210831T000000Z"
            $periodAprAugr.Fields["SearchDateRangeStartDate"].Value = "20210901T000000Z"
            $periodAprAugr.Fields["SearchDateRangeEndDate"].Value = "20211130T000000Z"
            $periodAprAugr.Editing.EndEdit() > $null
            
            $periodSeptDec = Get-Or-Create-Item -Name "Sept - Dec 20" -Path $item.FullPath -Template "{056AC05C-E1D1-4FD4-BC4C-CEC966FA75E2}"
            $periodSeptDec.Editing.BeginEdit()
            $periodSeptDec.Fields["Destinations"].Value = $ids
            $periodSeptDec.Fields["DateOfRunStartDate"].Value = "20200901T000000Z"
            $periodSeptDec.Fields["DateOfRunEndDate"].Value = "20201231T000000Z"
            $periodSeptDec.Fields["SearchDateRangeStartDate"].Value = "20210101T000000Z"
            $periodSeptDec.Fields["SearchDateRangeEndDate"].Value = "20210630T000000Z"
            $periodSeptDec.Editing.EndEdit() > $null
        }
    }
    
    $item = Get-Or-Create-Item -Name $livePricenName -Path $livePricePath -Template $livePriceTempalteId
    Update-Item -Item $item
