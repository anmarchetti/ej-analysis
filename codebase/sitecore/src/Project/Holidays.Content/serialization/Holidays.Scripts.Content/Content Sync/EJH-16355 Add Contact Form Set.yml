    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Contact Us Settings"
    
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
    
    if ($item -eq $null) {
    	$item = New-Item -Path $itemPath -ItemType $itemTemplateId
    
    	$item.Editing.BeginEdit()
    	$item["isFormEnabled"] = "1";
    	$item.Editing.EndEdit() | Out-Null
    
    	Write-Host $item.Name "successfully created"
    }
