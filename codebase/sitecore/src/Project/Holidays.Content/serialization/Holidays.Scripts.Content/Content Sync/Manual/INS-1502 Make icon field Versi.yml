Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/Manual/INS-1502 Make icon field Versioned for Promo Merch Banner"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Generate $updates entries with this SQL (no trailing comma on last row):
    # WITH cte AS
    # (
    #     SELECT
    #         uf.ItemId,
    #         uf.[Language],
    #         uf.[Value],
    #         ROW_NUMBER() OVER (ORDER BY uf.ItemId, uf.[Language]) AS rn,
    #         COUNT(*) OVER () AS cnt
    #     FROM UnversionedFields uf
    #     INNER JOIN Items i ON uf.ItemId = i.ID
    #     WHERE uf.FieldId = '3376EACA-316C-4E29-9994-2029D9922915'
    #       AND i.TemplateID = '84F4258D-4E3A-4AC1-AFF0-EBF4E14ED3F5'
    #       AND uf.[Value] IS NOT NULL
    #       AND uf.[Value] <> ''
    # )
    # SELECT '@{ Id = "{' + CONVERT(varchar(36), ItemId) + '}"; Language = '''
    #      + REPLACE([Language], '''', '''''')
    #      + '''; Value = '''
    #      + REPLACE([Value], '''', '''''')
    #      + ''' }'
    #      + CASE WHEN rn < cnt THEN ',' ELSE '' END
    # FROM cte
    # ORDER BY rn;
    # Copy the output rows into the $updates array below.
    
    $databaseName = "master"
    $fieldName = "Icon"
    
    # Fill this array with item IDs, language and value to set.
    $updates = @(
        # copy the output rows from the SQL query here
    )
    
    $db = Get-Database $databaseName
    if (-not $db) {
        Write-Warning "Database '$databaseName' not found."
        return
    }
    
    foreach ($entry in $updates) {
        $idRaw = [string]$entry.Id
        $langRaw = [string]$entry.Language
        $newValue = [string]$entry.Value
    
        if (-not [Sitecore.Data.ID]::IsID($idRaw)) {
            Write-Warning "Skipping invalid ID: $idRaw"
            continue
        }
    
        $language = [Sitecore.Globalization.Language]::Parse($langRaw)
    
        $itemId = [Sitecore.Data.ID]::Parse($idRaw)
        $languageItem = $db.GetItem($itemId, $language)
    
        if (-not $languageItem) {
            Write-Warning "Item not found for ID $idRaw in language '$langRaw'"
            continue
        }
    
        $versions = $languageItem.Versions.GetVersions()
        if (-not $versions -or $versions.Count -eq 0) {
            Write-Warning "No versions found for item $idRaw in language '$langRaw'"
            continue
        }
    
        foreach ($versionItem in $versions) {
            [void]$versionItem.Editing.BeginEdit()
            try {
                $versionItem[$fieldName] = $newValue
            }
            finally {
                [void]$versionItem.Editing.EndEdit()
            }
        }
    }
    
    Write-Host "Update completed."
    
