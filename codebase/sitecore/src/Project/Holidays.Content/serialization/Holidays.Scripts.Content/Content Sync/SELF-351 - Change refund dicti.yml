Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SELF-351 - Change refund dictionary values"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $cashRefundItem = Get-Item -path "/sitecore/content/EasyJet/Holidays/Dictionary/Credit Confirm/Refund Cards/Cash Refund Amount"
    $creditRefundItem = Get-Item -path "/sitecore/content/EasyJet/Holidays/Dictionary/Credit Confirm/Refund Cards/Credit Refund Amount"
    
    if ($cashRefundItem -ne $null) {
        $cashRefundItem.Editing.BeginEdit()
        $cashRefundItem["Phrase"] = "Amount refunded to original payment card";
        $cashRefundItem.Editing.EndEdit() | Out-Null
    }
    
    if ($creditRefundItem -ne $null) {
        $creditRefundItem.Editing.BeginEdit()
        $creditRefundItem["Phrase"] = "Amount returned as easyJet holidays credit";
        $creditRefundItem.Editing.EndEdit() | Out-Null
    }
