DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $SearchPodErrorNotInBounds = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod/Errors/Not In Bounds"
    
    @('de-DE') | % {
        Create-Lang-Version -Item $SearchPodErrorNotInBounds -Lang $_ -Field "Phrase" -Value "Sieht leider so aus, als ob du nicht in der Deutschland bist"
    }
    @('fr-FR') | % {
        Create-Lang-Version -Item $SearchPodErrorNotInBounds -Lang $_ -Field "Phrase" -Value "Désolé, il semblerait que vous ne soyez pas en France"
    }
