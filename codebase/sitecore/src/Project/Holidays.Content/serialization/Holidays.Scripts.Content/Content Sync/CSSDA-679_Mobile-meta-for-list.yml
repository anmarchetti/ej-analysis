- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
    
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
        
            if ($values -ne $null) {
              
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    
    
    $amendRBCItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Change Room And Board/Page Components/Amend Room And Board" -ErrorAction SilentlyContinue;
    $data = @(
        @{
            fieldName="RoomsMobileListTitle"; 
            values=@{
                en="Change your Room"; 
                fr="Changer de chambre"; 
                de="Ändern Sie Ihr Zimmer"
            }
        },
        @{
            fieldName="RoomsMobileListDescription"; 
            values=@{
                en="Please view and select alternative room options below."; 
                fr="Veuillez consulter et sélectionner d'autres options de chambres ci-dessous."; 
                de="Bitte sehen Sie sich die alternativen Zimmeroptionen unten an und wählen Sie sie aus."
            }
        },
        @{
            fieldName="AltRoomsTitle"; 
            values=@{
                en="{amount} Other Room Available"; 
                fr="{amount} Autre Pièce Disponible"; 
                de="{amount} Anderes Zimmer Verfügbar"
            }
        },
        @{
            fieldName="AltRoomsTitlePlural"; 
            values=@{
                en="{amount} Other Rooms Available"; 
                fr="{amount} Autres Pièces Disponibles"; 
                de="{amount} Andere Räume Verfügbar"
            }
        }
    );
    
    update-item-with-lang -Data $data -Item $amendRBCItem;
