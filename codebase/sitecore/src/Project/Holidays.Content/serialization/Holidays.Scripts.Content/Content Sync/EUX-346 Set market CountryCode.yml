Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-346 Set market CountryCode"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
        $swissMarket = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/Switzerland" -ErrorAction SilentlyContinue
    
        if($swissMarket -ne $null){
            $swissMarket.Editing.BeginEdit()
            $swissMarket["CountryCode"] = "CH"
            $swissMarket.Editing.EndEdit()
        }
    
        $ukMarket = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom" -ErrorAction SilentlyContinue
    
        if($ukMarket -ne $null){
            $ukMarket.Editing.BeginEdit()
            $ukMarket["CountryCode"] = "GB"
            $ukMarket.Editing.EndEdit()
        }
