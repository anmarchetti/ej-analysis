    function update-dictionary-item($path, $language, $value){
        $item = Get-Item -Path $path -Language $language -ErrorAction SilentlyContinue
     
        if($item -ne $null){
            $item.Editing.BeginEdit()
            $item["Phrase"] = $value
            $item.Editing.EndEdit() | Out-Null
        }
    }
    
