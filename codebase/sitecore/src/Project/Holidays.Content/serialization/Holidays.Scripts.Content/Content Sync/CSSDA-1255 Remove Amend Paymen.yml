SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Update Placeholder for Amend Payment Header Rendering
    $amendPaymentPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/Amend Payment"
    $amendPaymentPage = Get-Item -Path $amendPaymentPagePath
    $amendPaymentRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Payment" -ErrorAction SilentlyContinue;
    
    $componentWrapperRendering = Get-Item -Path "/sitecore/layout/Renderings/Feature/Page Structure/Component Wrapper"
    $renderedComponentWrapper = Get-Rendering -Item $amendPaymentPage -Render $componentWrapperRendering;
    
    $amendPaymentHeaderRenderingPlaceHolder = "/body/component-wrapper-inner-" + $renderedComponentWrapper.UniqueId + "-0";
    $amendPaymentHeaderRenderingTemplate = Get-Item -Path "/sitecore/layout/Renderings/Feature/Destinations/Amend/Amend Payment Header" -ErrorAction SilentlyContinue;
    $amendPaymentHeaderRendering = Get-Rendering -Item $amendPaymentPage -Rendering $amendPaymentPageRenderingTemplate -PlaceHolder $amendPaymentHeaderRenderingPlaceholder
    
    if ($amendPaymentHeaderRendering -ne $null) {
        Set-Rendering -Item $amendPaymentPage -Instance $amendPaymentHeaderRendering -PlaceHolder "body"
        Write-Host "Amend Payment Header Rendering Placeholder updated"
    }
    
    
    
