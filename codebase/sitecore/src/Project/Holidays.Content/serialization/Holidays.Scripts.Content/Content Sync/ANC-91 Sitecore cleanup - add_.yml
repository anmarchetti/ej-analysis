  Hint: Script
  Value: |
    function Create-Item($path,$name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
            
            Write-Host "Ancillaries folder created on " $website
        }
        
        return $item;
    }
    
    function Update-Rendering($pagePath, $data, $renderingId) {
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        
        if ($page) {
            $rendering = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $renderingId } | Select -First 1
       
            if ($rendering -ne $null) {
                Set-Rendering -Item $page -Instance $rendering -Datasource $data
            }
        }
    }
    
    function Update-All-Renderings($pagePath, $data, $renderingId){
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        $allRenderings = Get-Rendering -Item $page
        
        foreach($rendering in $allRenderings){
             if($rendering.ItemId -eq $renderingId){
                 Set-Rendering -Item $page -Instance $rendering -Datasource $data
             }
         }
    }
    
    function ancillaries-cleanup($website){
        $dataPath = "/sitecore/content/EasyJet/$website/Data"
        $bookingPath = "/sitecore/content/EasyJet/$website/Home/Booking"
        
        Create-Item -Path $dataPath -Name "Ancillaries" -TemplateId "{A87A00B1-E6DB-45AB-8B54-636FEC3B5523}"
        
        # move cabin bags
        $newLcbPath = "$dataPath/Ancillaries/Cabin Bags"
        $lcbRenderingId = "{EDCABB4F-676C-4418-BBEE-4E0009F946E5}"
        Move-Item -Path "$dataPath/Cabin Bags" -Destination $newLcbPath -ErrorAction SilentlyContinue
        Update-Rendering -pagePath $bookingPath -data $newLcbPath -renderingId $lcbRenderingId
        Update-Rendering -pagePath "$bookingPath/Confirmation" -data $newLcbPath -renderingId $lcbRenderingId
        Update-Rendering -pagePath "$bookingPath/My_Booking" -data $newLcbPath -renderingId $lcbRenderingId
        Update-Rendering -pagePath "$bookingPath/View Booking" -data $newLcbPath -renderingId $lcbRenderingId
        Write-Host "Cabin Bags moved and updated on " $website
        
        # move cabin bags validation popup
        $newLcbPopupPath = "$dataPath/Ancillaries/Cabin Bags Validation Popup"
        $lcbPopupRenderingId = "{373CCDB1-97B0-426D-B6BF-2A525AE3621E}"
        Move-Item -Path "$dataPath/Cabin Bags Validation Popup" -Destination $newLcbPopupPath -ErrorAction SilentlyContinue
        Update-Rendering -pagePath $bookingPath -data $newLcbPath -renderingId $lcbPopupRenderingId
        Update-Rendering -pagePath "$bookingPath/Guest Details" -data $newLcbPath -renderingId $lcbPopupRenderingId
        Write-Host "Cabin Bags Validation Popup moved and updated on " $website
        
        # move hold luggage
        $newHLPath = "$dataPath/Ancillaries/Hold Luggage"
        $HLRenderingId = "{89F16941-1EA9-4990-88BD-794D3B45292D}"
        Move-Item -Path "$dataPath/Hold Luggage" -Destination $newHLPath -ErrorAction SilentlyContinue
        Update-Rendering -pagePath $bookingPath -data $newHLPath -renderingId $HLRenderingId
        Update-Rendering -pagePath "$bookingPath/Confirmation" -data $newHLPath -renderingId $HLRenderingId
        Write-Host "Hold Luggage moved and updated on " $website
        
        # move seat and bags
        $newSeatBagsPath = "$dataPath/Ancillaries/Seat And Bags"
        $seatBagsRenderingId = "{7910DC7C-14B7-48F1-9256-C570F700F085}"
        Move-Item -Path "$dataPath/Seat And Bags" -Destination $newSeatBagsPath -ErrorAction SilentlyContinue
        Update-All-Renderings -pagePath $bookingPath -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Update-Rendering -pagePath "$bookingPath/Confirmation" -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Update-Rendering -pagePath "$bookingPath/My_Booking" -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Update-Rendering -pagePath "$bookingPath/View Booking" -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Update-Rendering -pagePath "$bookingPath/Amend Payment" -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Update-Rendering -pagePath "$bookingPath/Change Dates/Summary" -data $newSeatBagsPath -renderingId $seatBagsRenderingId
        Write-Host "Seat And Bags moved and updated on " $website
        
        # move seat map
        $seatMapRenderingId = "{F7F45094-B88B-47D0-975F-3854B4AE9A41}"
        
        if ($website -eq "TradePortal") {
            $newSeatMapPathTrade = "$dataPath/Ancillaries/Seats Map Trade"
            Move-Item -Path "$dataPath/Seats Map Trade" -Destination $newSeatMapPathTrade -ErrorAction SilentlyContinue
            Update-Rendering -pagePath $bookingPath -data $newSeatMapPathTrade -renderingId $seatMapRenderingId
            Update-Rendering -pagePath "$bookingPath/View Booking" -data $newSeatMapPathTrade -renderingId $seatMapRenderingId
        } else {
            $newSeatMapPath = "$dataPath/Ancillaries/SeatsMap"
            Move-Item -Path "$dataPath/SeatsMap" -Destination $newSeatMapPath -ErrorAction SilentlyContinue
            Update-Rendering -pagePath $bookingPath -data $newSeatMapPath -renderingId $seatMapRenderingId
            Update-Rendering -pagePath "$bookingPath/My_Booking" -data $newSeatMapPath -renderingId $seatMapRenderingId
            Update-Rendering -pagePath "$bookingPath/Change Dates/Summary" -data $newSeatMapPath -renderingId $seatMapRenderingId
        }
        
        Write-Host "Seats Map moved and updated on " $website
    
        Write-Host "Ancillaries moved on " $website
    }
    
    ancillaries-cleanup -website "Holidays"
    ancillaries-cleanup -website "TradePortal"
