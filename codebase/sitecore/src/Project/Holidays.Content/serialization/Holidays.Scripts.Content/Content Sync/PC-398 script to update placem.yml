- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $folderPath = "/sitecore/content/EasyJet/Holidays/Presentation/Hotel Design"
    
    function Get-Rendering-Index ($item,$renderingItemId) {
        	$i = 0
        	Get-Rendering -Item $item | ForEach-Object {
        		if ($_.ItemID -eq $renderingItemId) {
        			return $i
        		}
        		$i++
        	}
        }
    
    function Update-Rendering {
                param (
                    $pageItem
                )
                
                $index = Get-Rendering-Index -Item $pageItem -renderingItemId '{CB029F29-F813-4455-BBFC-0DEBC0F8478B}'
                $index= $index+1
                $rendering = Get-Rendering -Item $pageItem | Where-Object { $_.ItemId -eq '{9548AF18-BCAB-4DAE-A754-B3A99C14A429}'}  | Set-Rendering -Item $pageItem -Index $index
    }
    
    $item = Get-Item -Path $folderPath
    foreach($customDesign in $item.Children){
        if($customDesign.TemplateName -eq 'Hotel Design'){
            Update-Rendering $customDesign
        }
    }
