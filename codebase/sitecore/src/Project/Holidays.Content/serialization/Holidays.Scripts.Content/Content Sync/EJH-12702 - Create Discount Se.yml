  Hint: Script
  Value: |
    $itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Discount Settings"
    $templateId = "{60C86FDD-E249-477F-A169-9E89136BCE4B}"
    
    $item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -eq $null){
        Write-Host "Creating item"
        
        $item = New-Item -Path $itemPath -ItemType $templateId
        
        $item.Editing.BeginEdit()
        $item.Fields["DiscountThreshold"].Value = "1"
        $item.Editing.EndEdit()
    } else{
        Write-Host "Item already created"
    }
    
    Write-Host "Script is completed"
    
