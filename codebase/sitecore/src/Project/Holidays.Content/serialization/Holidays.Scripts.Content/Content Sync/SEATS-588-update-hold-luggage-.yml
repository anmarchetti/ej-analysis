- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function updateHoldLuggagePopup($path) {
    	$holdLuggagePopupItem  = Get-Item -Path $path -ErrorAction SilentlyContinue
    
    	if ($holdLuggagePopupItem -ne $null){
    	   Write-Host "Start updating Hold Luggage Popup"
    
    	   $holdLuggagePopupItem.Editing.BeginEdit()
    	   
    	   $holdLuggagePopupItem.Fields["DescriptionHoldLuggageAndSport"].Value = "All items selected are included for the outbound and return flights. Add up to 3 additional and 1 piece of sports equipment per passenger."
    	   $holdLuggagePopupItem.Fields["DescriptionHoldLuggage"].Value = "All items selected are included for the outbound and return flights. Add up to 3 additional pieces of luggage per passenger."
    	   $holdLuggagePopupItem.Fields["DescriptionSport"].Value = "All items selected are included for the outbound and return flights. Add up to 1 piece of sports equipment per passenger."
    	   
    	   $holdLuggagePopupItem.Editing.EndEdit() | Out-Null
    	   
    	   Write-Host "Updated Hold Luggage Popup"
    	}
    }
    
    
    function updateHoldLuggage($path) {
    	$holdLuggageItem  = Get-Item -Path $path -ErrorAction SilentlyContinue
    
    	if ($holdLuggageItem -ne $null){
    	   Write-Host "Start updating Hold Luggage"
    
    	   $holdLuggageItem.Editing.BeginEdit()
    	   
    	   $holdLuggageItem.Fields["HoldLuggageAndSportHeading"].Value = "Add Extra Hold Luggage or Sports Equipment"
    	   $holdLuggageItem.Fields["HoldLuggageHeading"].Value = "Add Extra Hold Luggage"
    	   $holdLuggageItem.Fields["SportsHeading"].Value = "Add Sports Equipment"
    	   $holdLuggageItem.Fields["UnavailableMessageHeader"].Value = "Adding hold luggage is currently unavailable"
    	   $holdLuggageItem.Fields["UnavailableMessageDescription"].Value = "We're sorry, adding hold luggage is currently unavailable for this flight. You can still select your flight and add your bags at a later stage."
    
    	   $holdLuggageItem.Editing.EndEdit() | Out-Null
    	   
    	   Write-Host "Updated Hold Luggage"
    	}
    }
    
    updateHoldLuggage -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage"
    updateHoldLuggage -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Trade Portal"
    
    updateHoldLuggagePopup -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage Popup"
    updateHoldLuggagePopup -Path "/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Popup"
    
    Write-Host "Script is completed"
    
