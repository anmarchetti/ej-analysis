  Hint: Script
  Value: |
    function create-item($path, $itemName, $itemType){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
    
            if($createdItem -ne $null){
                Write-Host "$($itemName) item is created"
                return $createdItem
            }
        }
        return $itemToCreateExist
    }
    
     function create-lang-version($item,$lang,$field,$value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            
            if ($field -ne $null) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    
    $globalItem = create-item -Path "/sitecore/content/EasyJet/Holidays/Settings/" -ItemName "Global - Maintenance Mode" -ItemType "{C0DD1FCB-D677-4E93-B7C0-8F36B5A882A0}"
    Create-Lang-Version -Item $globalItem -Lang "en"
    Create-Lang-Version -Item $globalItem -Lang "fr-CH"
    Create-Lang-Version -Item $globalItem -Lang "de-CH"
    
    if ($globalItem -ne $null) {
        $swissMarket = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/Switzerland" -ErrorAction SilentlyContinue
        $swissMarketMode = create-item -Path "/sitecore/content/EasyJet/Holidays/Settings/Global - Maintenance Mode" -ItemName "Switzerland - Maintenance Mode" -ItemType "{3B1C3399-8610-40EE-A397-F2A639EFF262}"
        if($swissMarket -ne $null){
            $swissMarketMode.Editing.BeginEdit()
            $swissMarketMode["Market"] = $swissMarket.ID
            $swissMarketMode.Editing.EndEdit()
            Create-Lang-Version -Item $swissMarketMode -Lang "en" -Field "Market" -Value $swissMarket.ID
            Create-Lang-Version -Item $swissMarketMode -Lang "fr-CH" -Field "Market" -Value $swissMarket.ID
            Create-Lang-Version -Item $swissMarketMode -Lang "de-CH" -Field "Market" -Value $swissMarket.ID
        }
    
    
        $ukMarket = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Market Settings/United Kingdom" -ErrorAction SilentlyContinue
        $ukMarketMode = create-item -Path "/sitecore/content/EasyJet/Holidays/Settings/Global - Maintenance Mode" -ItemName "UK - Maintenance Mode" -ItemType "{3B1C3399-8610-40EE-A397-F2A639EFF262}"
        if($ukMarket -ne $null){
            $ukMarketMode.Editing.BeginEdit()
            $ukMarketMode["Market"] = $ukMarket.ID
            $ukMarketMode.Editing.EndEdit()
            Create-Lang-Version -Item $ukMarketMode -Lang "en" -Field "Market" -Value $ukMarket.ID
            Create-Lang-Version -Item $ukMarketMode -Lang "fr-CH" -Field "Market" -Value $ukMarket.ID
            Create-Lang-Version -Item $ukMarketMode -Lang "de-CH" -Field "Market" -Value $ukMarket.ID
        }
     
    }
    
    Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Maintenance Mode" -ErrorAction SilentlyContinue | Remove-Item -Force -Permanently
