  Hint: Script
  Value: |
    # 1. add filter to the mixedresults page
    $holidayTypeFilter = "{1B59F944-1A5A-424B-BE50-C3B9A35FC7FE}"
    $searchPagePath = "/sitecore/content/EasyJet/Holidays/Home/MixedResultList"
    
    function UpdatePage($lang) {
        $page = gi -Path $searchPagePath -Language $lang
        
        $newFiltersOrder = $page.Fields["Filters Order"].Value
        
        if (-not ($newFiltersOrder -match $holidayTypeFilter)) {
            $newFiltersOrder = "$($newFiltersOrder)|$($holidayTypeFilter)"
            
        }
        
        $page.Editing.BeginEdit()
        $page.Fields["Filters Order"].Value = $newFiltersOrder
        $page.Editing.EndEdit()
    }
    
    @("de-CH", "de-DE", "fr-CH", "fr-FR") | % {
        UpdatePage($_)
    }
    
    # 2. update dictionary
    Import-Function "Import Content"
    $itemsToCreate = @(
        @{
            Path        = "/sitecore/content/EasyJet/Holidays/Dictionary/Filter Types/Labels/Hotel Types"
            TemplatePath = "System/Dictionary/Dictionary entry"
            Id          = [GUID]"{2DBDFC8E-366A-4770-A182-5C0E7CAE5457}"
            Fields      = @{
                "Phrase" = @{
                    "de-CH" = "Ferienfilter"
                    "fr-FR" = "Type de vacances"
                    "de-DE" = "Urlaubsfilter"
                    "fr-CH" = "Type de vacances"
                }
            }
        }
    )
    ImportContent -itemsToCreate $itemsToCreate
    
    # 3. add DE transaltion for luxury option
    
    $description_a745233420084dd1a9aa335c610d43b7_dech_v1 = @"
