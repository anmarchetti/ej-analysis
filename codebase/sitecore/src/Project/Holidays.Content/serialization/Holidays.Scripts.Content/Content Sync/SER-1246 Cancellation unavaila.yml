                 function Add-Renderings($pagePath, $datasourcePath) {
                    $page = Get-Item -Path $pagePath
                    $bookingToolbarRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $viewBookingToolbarRenderingId}
                    $bookingContextRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $bookingContextRenderingId}
                    
                    
                    $cancellationUnavailableRendering = Get-Item -Path $cancellationUnavailableRenderingPath
                    $cancellationUnavailableInstance = New-Rendering -Item $cancellationUnavailableRendering 
                    Add-Rendering -Item $page -Instance $cancellationUnavailableInstance -Index 5 -Placeholder "/body/booking-context-$($bookingContextRendering.UniqueId)-0/toolbar-top-section-$($bookingToolbarRendering.UniqueId)-0" -DataSource $cancellDatasoursePath
                    
                    
                    $cancellUnavailableRendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $cancellationUnavailableRenderingId}
                    $contactUsBannerRendering = Get-Item -Path $contactUsBannerRenderingPath
                    $contactUsBannerRenderingInstance = New-Rendering -Item $contactUsBannerRendering
                    
                    Add-Rendering -Item $page -Instance $contactUsBannerRenderingInstance -Index 6 -Placeholder "/body/booking-context-$($bookingContextRendering.UniqueId)-0/toolbar-top-section-$($bookingToolbarRendering.UniqueId)-0/contact-us-$($cancellUnavailableRendering.UniqueId)-0" -DataSource $contactUsBannerDatasourcePath -Parameter  @{ "ShowButtonOnly" = "1" } 
    
                    
                    New-Content -PagePath $pagePath -DatasoursePath $datasoursePath;
                 }
    
                Add-Renderings -PagePath "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel" -DatasourcePath $cancellDatasoursePath
    
    
