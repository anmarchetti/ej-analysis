                #  function Add-Renderings($pagePath) {
                    $page = Get-Item -Path $pagePath
                    $componentWrapperRenderings = Get-Rendering -Item $page -FinalLayout | Where-Object {$_.ItemId -eq $componentWrapperRenderingId} 
                    
                    $promoBlocksRendering = Get-Item -Path $promoBlocksRenderingPath
                    $promoBlocksInstance = New-Rendering -Item $promoBlocksRendering
                    
                    $updates = @(
                         @{
                            Path         = "/sitecore/content/EasyJet/Holidays/Home/Extras hub/Page Components/Promo Blocks Folder 4"
                            TemplatePath = "/sitecore/templates/Feature/PageContent/Promo Blocks Folder"
                            Id = "{AB26733A-9CC1-4C12-BCAB-FA28C28B5B11}"
                            Fields =@{
                                "Link" = @{
                                    "en" = ""
                                    "fr-CH" = ""
                                    "de-CH" = ""
                                    "fr-FR" = ""
                                    "de-DE" = ""
                                }
                            }
                            })
                    
                    ImportContent -itemsToCreate $updates
                    
                    Remove-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Extras hub/Page Components/Partnership Component" -Permanently
           
                    $partnershipRenderingId = "{EF923FE5-72B8-41AE-9D17-BD2B8B99A377}"
    
                     $languages = @("en", "fr-CH", "de-CH", "fr-FR", "de-DE")
                    foreach ($lang in $languages) {
           
                        $langPage = Get-Item -Path $pagePath -Language $lang
                        $partnershipRendering = Get-Rendering -Item $langPage -FinalLayout | Where-Object {$_.ItemId -eq $partnershipRenderingId} 
                        if ($null -ne $partnershipRendering -and $partnershipRendering.Count -gt 0) {
                            Remove-Rendering -Item $langPage -Instance $partnershipRendering[0] -FinalLayout
                            Write-Host "Removed partnership rendering for language: $lang" -ForegroundColor Yellow
                        } else {
                            Write-Host "Partnership rendering not found for language: $lang, skipping removal" -ForegroundColor Gray
                        }
                        $promoBlocksRendering = Get-Item -Path $promoBlocksRenderingPath
                        $promoBlocksInstance = New-Rendering -Item $promoBlocksRendering
                        $componentWrapperRenderings = Get-Rendering -Item $langPage -FinalLayout | Where-Object {$_.ItemId -eq $componentWrapperRenderingId}
                        Add-Rendering -Item $langPage -Instance $promoBlocksInstance -Language $lang -Index 11 -FinalLayout -Parameter @{"IsButtonOutlined" = "1"; "Theme" = "Vertical Stripe Variant" } -Placeholder "/body/component-wrapper-inner-$($componentWrapperRenderings[1].UniqueId)-0" -DataSource "{AB26733A-9CC1-4C12-BCAB-FA28C28B5B11}"
                        Write-Host "Added rendering for language: $lang" -ForegroundColor Green
                    }
                    
                    New-Content
