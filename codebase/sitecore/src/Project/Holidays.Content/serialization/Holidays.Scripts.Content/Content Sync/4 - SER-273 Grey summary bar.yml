    function Get-Or-Create-Item ($path,$templateId) {
        $item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
         if ($item -eq $null) {
                $item = New-Item -Path $path -ItemType $templateId
                Write-Host "Item" $item.Name "successfully created";
         }
         return $item
    }
    function create-lang-version($item, $lang, $field, $value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value
            $targetLangItem.Editing.EndEdit() | Out-Null
         }
    }
    
    $translations = @{
                    "en" = @{
                        "CancelledOnLabel" = "Cancelled on";
                    }
                    "fr-CH" = @{
                        "CancelledOnLabel" = "Annulé le";
                    }
                    "fr-FR" = @{
                        "CancelledOnLabel" = "Annulé le";
                    }
                    "de-CH" = @{
                        "CancelledOnLabel" = "Storniert am";
                       
                    }
                    "de-DE" = @{
                        "CancelledOnLabel" = "Storniert am";
                    }
                }
    $contentData = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Booking Cancelled/Page Components/Booking Toolbar" -templateId '{35A30F6C-5DBA-4D4E-BC43-9E2EBDFEA21E}'
    foreach ($lang in $translations.Keys) {
        create-lang-version -item $contentData -lang $lang -field "CancelledOnLabel" -value $translations[$lang]["CancelledOnLabel"]
    }   
    
    
    function Update-Rendering {
                param (
                    [string]$itemPath
                )
                
                $pageItem = Get-Item -Path $itemPath
                $parameters = [ordered]@{"IsGreyBackground"="1"}
                
                Get-Rendering -Item $pageItem -Placeholder "/body/booking-context-*" | 
                Where-Object -FilterScript {$_.ItemID -eq '{3CFB6E83-8DFD-418F-86BF-ACDD663328D5}'} | 
                Set-RenderingParameter -Parameter $parameters | 
                Set-Rendering -Item $pageItem
                
                Get-Rendering -Item $pageItem  | 
        Where-Object -FilterScript {$_.ItemID -eq '{A266310A-FCBC-46A1-80C8-3AECB4F06727}'} | 
        Set-Rendering -Item $pageItem -DataSource $contentData.ID
            }
            
