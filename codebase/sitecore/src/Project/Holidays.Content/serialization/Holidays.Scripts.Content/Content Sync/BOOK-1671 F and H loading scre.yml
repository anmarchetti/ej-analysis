    $atolprotected_tileicon_a3bad72c314c442bb0168e7c39080fec_frch_v1 = @"
    <image mediaid="{AEDD4E01-AE10-4F5C-9DCB-7A377D2C2454}" />
    "@
    $atolprotected_tiledescription_a3bad72c314c442bb0168e7c39080fec_en_v1 = @"
    All of our holidays are ATOL protected, plus we're a member of ABTA
    "@
    $atolprotected_tiledescription_a3bad72c314c442bb0168e7c39080fec_dech_v1 = @"
    Alle unsere Ferien sind durch die Lizenz als Reiseflugveranstalter geschützt und wir sind Mitglied des Verbandes britischer Reisebüros (ABTA)
    "@
    $onholidaysupport_tiledescription_6cd19c23d06b47b2935d80183f207b91_dech_v1 = @"
    Wenn du uns w&auml;hrend deinen Ferien brauchst, ist unser Team rund um die Uhr f&uuml;r dich da &ndash; &uuml;ber Chat, Internetanruf oder telefonisch.
    "@
    $bestpriceguarantee_tiledescription_4524ebf5ddd14e179102aa5e9a3843d3_frch_v1 = @"
    Si vous trouvez moins cher ailleurs, nous vous ferons une meilleure offre pour vos vacances
    "@
    $atolprotected_tiledescription_a3bad72c314c442bb0168e7c39080fec_frfr_v1 = @"
    Toutes nos vacances sont protégées par ATOL (licence de prestataire de transport aérien) et nous sommes membres de l'Association of British Travel Agents (ABTA).
    "@
    $bookingtransitionscreenfandh_tiles_3d075b49b6914823a0136ce43c8b5376_en_v2 = @"
    $holidaysdatabookingtransitionscreenfandhspreadthecost_Id|$holidaysdatabookingtransitionscreenfandhonholidaysupport_Id|$holidaysdatabookingtransitionscreenfandhbestpriceguarantee_Id|$holidaysdatabookingtransitionscreenfandhatolprotected_Id
    "@
    $spreadthecost_tiledescription_2a830db0e8764c43b797d762ecbfda71_dech_v1 = @"
    Bezahle in so vielen Raten wie du möchtest, bis zu 28 Tage vor Abreise
    "@
