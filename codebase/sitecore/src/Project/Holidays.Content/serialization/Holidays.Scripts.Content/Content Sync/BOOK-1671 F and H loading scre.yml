    "@
    $onholidaysupport_tiletitle_6cd19c23d06b47b2935d80183f207b91_frch_v1 = @"
    Assistance vacances 24 h/24, 7 j/7
    "@
    $bestpriceguarantee_tileicon_4524ebf5ddd14e179102aa5e9a3843d3_frch_v1 = @"
    <image mediaid="{A8E84CC6-AECC-41E9-8F43-732AC1E942C7}" />
    "@
    $onholidaysupport_tiledescription_6cd19c23d06b47b2935d80183f207b91_dede_v1 = @"
    <span id="docs-internal-guid-e849f34b-7fff-c9c9-b67e-86d89031ab40" style="color: #333333;">Unser Team ist rund um die Uhr f&uuml;r dich da &ndash; per Chat, WLAN-Anruf oder telefonisch</span>
    "@
    $bestpriceguarantee_tiledescription_4524ebf5ddd14e179102aa5e9a3843d3_frfr_v1 = @"
    Nous sommes prêts à vous faire une meilleure offre, si vous trouvez ailleurs le même séjour moins cher&nbsp;
    "@
    $bestpriceguarantee_tileicon_4524ebf5ddd14e179102aa5e9a3843d3_dech_v1 = @"
    <image mediaid="{A8E84CC6-AECC-41E9-8F43-732AC1E942C7}" />
    "@
    $spreadthecost_tileicon_2a830db0e8764c43b797d762ecbfda71_en_v1 = @"
    <image mediaid="{0754344A-31CE-4A36-8FDA-E926DFB1A8B8}" />
    "@
    $onholidaysupport_tileicon_6cd19c23d06b47b2935d80183f207b91_dech_v1 = @"
    <image mediaid="{1ACAAB68-BACF-4C85-BA59-1B64EB21AA1D}" />
    "@
    $onholidaysupport_tileicon_6cd19c23d06b47b2935d80183f207b91_frch_v1 = @"
    <image mediaid="{1ACAAB68-BACF-4C85-BA59-1B64EB21AA1D}" />
    "@
    $bestpriceguarantee_tileicon_4524ebf5ddd14e179102aa5e9a3843d3_dede_v1 = @"
    <image mediaid="{7CB07200-6B99-4AE6-9B8A-359C38A7928B}" />
    "@
    $onholidaysupport_tiledescription_6cd19c23d06b47b2935d80183f207b91_frfr_v1 = @"
    Si vous avez besoin de nous durant votre séjour, notre équipe est à votre disposition 24 h/24 et 7 j/7.
    "@
    $atolprotected_tileicon_a3bad72c314c442bb0168e7c39080fec_en_v1 = @"
    <image mediaid="{AEDD4E01-AE10-4F5C-9DCB-7A377D2C2454}" />
    "@
    $bestpriceguarantee_tiledescription_4524ebf5ddd14e179102aa5e9a3843d3_en_v1 = @"
    We'll beat the price if you find the same holiday cheaper elsewhere&nbsp;
    "@
    $bookingtransitionscreenfandh_tiles_3d075b49b6914823a0136ce43c8b5376_frch_v2 = @"
    {357DD91A-0518-484E-B589-5E03E34B7560}|{6B00182E-B707-4111-9794-C3E9DF42EEDE}|{5A70A966-D91E-4DAB-995A-A5F87781C0D9}|{2438C8F1-2063-466D-9258-44396CC46808}
    "@
    $bestpriceguarantee_tileicon_4524ebf5ddd14e179102aa5e9a3843d3_en_v1 = @"
    <image mediaid="{A8E84CC6-AECC-41E9-8F43-732AC1E942C7}" />
    "@
    $onholidaysupport_tiledescription_6cd19c23d06b47b2935d80183f207b91_frch_v1 = @"
    Si vous avez besoin de nous pendant vos vacances, notre équipe se tient à votre disposition 24 h/24 et 7 j/7
    "@
    $onholidaysupport_tileicon_6cd19c23d06b47b2935d80183f207b91_frfr_v1 = @"
    <image mediaid="{1ACAAB68-BACF-4C85-BA59-1B64EB21AA1D}" />
    "@
