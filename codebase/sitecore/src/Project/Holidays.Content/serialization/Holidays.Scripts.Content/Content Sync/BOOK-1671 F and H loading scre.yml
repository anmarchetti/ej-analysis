    $atolprotected_tiledescription_a3bad72c314c442bb0168e7c39080fec_frch_v1 = @"
    Toutes nos vacances sont protégées par ATOL (licence de prestataire de transport aérien) et nous sommes membres de l'Association of British Travel Agents (ABTA).
    "@
    $spreadthecost_tileicon_2a830db0e8764c43b797d762ecbfda71_frch_v1 = @"
    <image mediaid="{0754344A-31CE-4A36-8FDA-E926DFB1A8B8}" />
    "@
    $onholidaysupport_tileicon_6cd19c23d06b47b2935d80183f207b91_dede_v1 = @"
    <image mediaid="{1ACAAB68-BACF-4C85-BA59-1B64EB21AA1D}" />
    "@
    $spreadthecost_tiledescription_2a830db0e8764c43b797d762ecbfda71_dede_v1 = @"
    <span id="docs-internal-guid-e849f34b-7fff-c9c9-b67e-86d89031ab40" style="color: #333333;">Du zahlst was du willst und wann du willst &ndash; bis 28 Tage vor Abreise</span>
    "@
    $onholidaysupport_tiledescription_6cd19c23d06b47b2935d80183f207b91_en_v1 = @"
    If you need us while you&rsquo;re away, you can reach us through chat, internet calling, or phone and we&rsquo;re here for you 24/7.
    "@
    $spreadthecost_tileicon_2a830db0e8764c43b797d762ecbfda71_dech_v1 = @"
    <image mediaid="{0754344A-31CE-4A36-8FDA-E926DFB1A8B8}" />
    "@
    $bestpriceguarantee_tiledescription_4524ebf5ddd14e179102aa5e9a3843d3_dede_v1 = @"
    <span id="docs-internal-guid-84434eab-7fff-20c7-22f3-d0d0fbd31952" style="color: #333333;">Wir unterbieten den Preis, solltest du denselben Urlaub anderswo g&uuml;nstiger sehen</span>
    "@
    $bookingtransitionscreenfandh_tiles_3d075b49b6914823a0136ce43c8b5376_frfr_v2 = @"
    {357DD91A-0518-484E-B589-5E03E34B7560}|{6B00182E-B707-4111-9794-C3E9DF42EEDE}|{5A70A966-D91E-4DAB-995A-A5F87781C0D9}|{2438C8F1-2063-466D-9258-44396CC46808}
    "@
    $spreadthecost_tileicon_2a830db0e8764c43b797d762ecbfda71_frfr_v1 = @"
    <image mediaid="{7AF48014-C878-478E-9027-E0F11D3F2EFC}" />
    "@
    $atolprotected_tiledescription_a3bad72c314c442bb0168e7c39080fec_dede_v1 = @"
    Alle unsere Reisen sind durch die Lizenz als Reiseflugveranstalter geschützt und wir sind Mitglied des Verbandes britischer Reisebüros (ABTA)
    "@
    $onholidaysupport_tileicon_6cd19c23d06b47b2935d80183f207b91_en_v1 = @"
    <image mediaid="{1ACAAB68-BACF-4C85-BA59-1B64EB21AA1D}" />
    "@
