Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUXE-781 Update dictionary for search pod filters"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item,$lang,$field,$value) {
        $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
        
        if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
        }
        
        if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
        }
    }
    
    $SearchPodFiltersChooseDates = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Pod Filters/Buttons/Choose Dates"
    $TradePortalSearchPodFiltersChooseDates = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Dictionary/Search Pod Filters/Buttons/Choose Dates"
    $SearchResultsEditSearch = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Dictionary/Search Results/Labels/Edit Search"
    $TradePortalSearchResultsEditSearch = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Dictionary/Search Results/Labels/Edit Search"
    
    @('de-CH', 'de-DE') | % {
        Create-Lang-Version -Item $SearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Wählen Sie Daten zum Filtern aus"
        Create-Lang-Version -Item $TradePortalSearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Wählen Sie Daten zum Filtern aus"
        Create-Lang-Version -Item $SearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Bearbeiten"
        Create-Lang-Version -Item $TradePortalSearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Bearbeiten"
    }
    @('fr-CH', 'fr-FR') | % {
        Create-Lang-Version -Item $SearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Choisissez les dates à filtrer"
        Create-Lang-Version -Item $TradePortalSearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Choisissez les dates à filtrer"
        Create-Lang-Version -Item $SearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Modifier"
        Create-Lang-Version -Item $TradePortalSearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Modifier"
    }
    @('en') | % {
        Create-Lang-Version -Item $SearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Choose dates to filter"
        Create-Lang-Version -Item $TradePortalSearchPodFiltersChooseDates -Lang $_ -Field "Phrase" -Value "Choose dates to filter"
        Create-Lang-Version -Item $SearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Edit"
        Create-Lang-Version -Item $TradePortalSearchResultsEditSearch -Lang $_ -Field "Phrase" -Value "Edit"
    }
