    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
        $item["ModalDescription"] = "<a href='tel:+44 330 123 5025'><span data-tid='call-center-phone'>+44 330 123 5025</span></a><p data-tid='call-center-phone-description'>Our 24/7 UK based team are here to help with any issues you have while you&rsquo;re away on a complete easyJet holiday package. If you have a flight only booking with easyJet, please see <a href='https://www.easyjet.com/en/help/contact'><span data-tid='modal-description-link'>here</span></a>.</p>"
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
        
    Write-Host "Finished"
