  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null){
            $item = New-Item -Path $path -ItemType $templateId
        }
        
        return $item
    }
    
    $redirectMapGrouping = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Redirect Map Grouping" -templateId "{AD2205DC-AEC6-427F-B285-4C5AEF8A4478}"
    
    if($redirectMapGrouping -ne $null){
        $redirectMap = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Redirect Map Grouping/Redirect Map - 301" -templateId "{866F48C6-3EE9-495F-80F0-15D94A74DBB4}"
        $redirectMap.Editing.BeginEdit()
        $redirectMap.Fields["RedirectType"].Value = "301"
        $redirectMap.Fields["UrlMapping"].Value = "^(/destinations)(.*)$=%242"
        $redirectMap.Editing.EndEdit()
    }
