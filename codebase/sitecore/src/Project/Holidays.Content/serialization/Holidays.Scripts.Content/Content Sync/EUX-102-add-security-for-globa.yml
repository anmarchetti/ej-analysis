Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-102-add-security-for-globalink"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $ceMenu= "core:/sitecore/content/Applications/Content Editor/Ribbons/Chunks/GlobalLink"
    $weMenu = "core:/sitecore/content/Applications/WebEdit/Ribbons/WebEdit/GlobalLink"
    $permissions = "ar|sitecore\Global Link Access|pe|+item:read|pd|+item:read|"
    
    $ce= Get-Item -path $ceMenu -ErrorAction SilentlyContinue
    
    if ($null -ne $ce) {
            $ce.Editing.BeginEdit()
    	$ce["__security"] = $permissions 
    	$ce.Editing.EndEdit() | Out-Null;
    }
    
    $we= Get-Item -path $weMenu -ErrorAction SilentlyContinue
    
    if ($null -ne $we) {
            $we.Editing.BeginEdit()
    	$we["__security"] = $permissions 
    	$we.Editing.EndEdit() | Out-Null;
    }
