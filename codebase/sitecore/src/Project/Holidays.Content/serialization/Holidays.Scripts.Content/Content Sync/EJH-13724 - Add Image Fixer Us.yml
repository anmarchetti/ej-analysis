  Hint: Script
  Value: |
    $user = Get-User -Identity ImageFixer -ErrorAction SilentlyContinue
    if($user -eq $null){ 
        New-User -Identity ImageFixer -Enabled -Password SIF-Default -FullName "Image Fixer"
        Set-User -Identity ImageFixer -IsAdministrator $true
    }
