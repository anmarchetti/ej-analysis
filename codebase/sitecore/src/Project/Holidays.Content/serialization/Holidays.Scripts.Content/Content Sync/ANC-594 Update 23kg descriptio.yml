- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Edit-Popup-Data-Source ($dataSourcePath){
        # Get data source
        $popupDS = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
        
        # update data source
        if ($popupDS -ne $null) {
            $popupDS.Editing.BeginEdit()
            $popupDS["IncludedBagLabel"] = "{number} included with holiday package";
            $popupDS.Editing.EndEdit() | Out-Null
            Write-Host $popupDS.Name "is updated";
        }
    }
    
    # Holidays
    Edit-Popup-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Hold Luggage Popup'
    
    # Trade
    Edit-Popup-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Hold Luggage Popup'
    
    function Edit-Luggage-Data-Source ($dataSourcePath, $description){
        # Get data source
        $luggageDS = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
        
        # update data source
        if ($luggageDS -ne $null) {
            $luggageDS.Editing.BeginEdit()
            $luggageDS["Description"] = $description;
            $luggageDS.Editing.EndEdit() | Out-Null
            Write-Host $luggageDS.Name "is updated";
        }
    }
    
    # 15kg
    Edit-Luggage-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Data/Luggage/Hold Baggage/Hold Baggage 15kg' -description "Maximum 15kg per bag, stored in the plane hold. Outbound and return."
    Edit-Luggage-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Data/Luggage/Hold Baggage/Hold Baggage 15kg' -description "Maximum 15kg per bag, stored in the plane hold. Outbound and return."
    
    #23kg
    Edit-Luggage-Data-Source -dataSourcePath '/sitecore/content/EasyJet/Holidays/Data/Luggage/Hold Baggage/Hold Baggage 23kg' -description "Maximum 23kg per bag, stored in the plane hold. Outbound and return."
    Edit-Luggage-Data-Source -dataSourcePath '/sitecore/content/EasyJet/TradePortal/Data/Luggage/Hold Baggage/Hold Baggage 23kg' -description "Maximum 23kg per bag, stored in the plane hold. Outbound and return."
    
