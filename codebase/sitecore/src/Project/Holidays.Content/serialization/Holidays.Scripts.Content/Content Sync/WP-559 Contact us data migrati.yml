                        @{ Text = "Gepäck/Fundsachen"; Language = "de-DE" }
                    )
                }
                Booking = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Booking/Pre-departure"
                    Questions = @(
                        @{ Text = "Booking/Pre-departure"; Language = "en" },
                        @{ Text = "Réservation/Pré-départ"; Language = "fr-CH" },
                        @{ Text = "Buchung/Abreise"; Language = "de-CH" },
                        @{ Text = "Réservation/Pré-départ"; Language = "fr-FR" },
                        @{ Text = "Buchung/Abreise"; Language = "de-DE" }
                    )
                }
                easyJet = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "easyJet Customer Service"
                    Questions = @(
