                        @{ Text = "Unterkunft/Reiseziel"; Language = "de-DE" }
                    )
                }
                Airport = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Airport"
                    Questions = @(
                        @{ Text = "Airport"; Language = "en" },
