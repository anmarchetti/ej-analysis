                        @{ Text = "Service client easyJet"; Language = "fr-CH" },
                        @{ Text = "easyJet-Kundenservice"; Language = "de-CH" },
                        @{ Text = "Service client easyJet"; Language = "fr-FR" },
                        @{ Text = "easyJet-Kundenservice"; Language = "de-DE" }
                    )
                }
                Excursions = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Excursions"
                    Questions = @(
                        @{ Text = "Excursions"; Language = "en" },
                        @{ Text = "Excursions"; Language = "fr-CH" },
                        @{ Text = "Ausflüge"; Language = "de-CH" },
                        @{ Text = "Excursions"; Language = "fr-FR" },
                        @{ Text = "Ausflüge"; Language = "de-DE" }
                    )
                }
                Flight = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Flight including cancellation and delays"
                    Questions = @(
                        @{ Text = "Flight including cancellation and delays"; Language = "en" },
                        @{ Text = "Vol incluant l’annulation et les retards"; Language = "fr-CH" },
                        @{ Text = "Flug inkl. Annullierung und Verspätungen"; Language = "de-CH" },
                        @{ Text = "Vol incluant l’annulation et les retards"; Language = "fr-FR" },
                        @{ Text = "Flug inkl. Annullierung und Verspätungen"; Language = "de-DE" }
                    )
                }
                Injury = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Injury or Illness"
                    Questions = @(
                        @{ Text = "Injury or Illness"; Language = "en" },
                        @{ Text = "Blessure ou maladie"; Language = "fr-CH" },
                        @{ Text = "Verletzung oder Krankheit"; Language = "de-CH" },
                        @{ Text = "Blessure ou maladie"; Language = "fr-FR" },
                        @{ Text = "Verletzung oder Krankheit"; Language = "de-DE" }
                    )
                }
                Prepaid = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Pre-paid extras including seating"
                    Questions = @(
                        @{ Text = "Pre-paid extras including seating"; Language = "en" },
                        @{ Text = "Extras prépayés, y compris les sièges"; Language = "fr-CH" },
                        @{ Text = "Vorausbezahlte Extras inklusive Sitzplätze"; Language = "de-CH" },
                        @{ Text = "Extras prépayés, y compris les sièges"; Language = "fr-FR" },
                        @{ Text = "Vorausbezahlte Extras inklusive Sitzplätze"; Language = "de-DE" }
                    )
                }
                Safety = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Safety and security"
                    Questions = @(
                        @{ Text = "Safety and security"; Language = "en" },
                        @{ Text = "Sécurité"; Language = "fr-CH" },
                        @{ Text = "Sicherheit und Schutz"; Language = "de-CH" },
                        @{ Text = "Sécurité"; Language = "fr-FR" },
                        @{ Text = "Sicherheit und Schutz"; Language = "de-DE" }
                    )
                }
                Transfer = @{
                    IsPastHoliday = $true
                    SendTo = "Salesforce"
                    SalesforceCategory = "Transfer"
                    Questions = @(
                        @{ Text = "Transfer"; Language = "en" },
                        @{ Text = "Transfert"; Language = "fr-CH" },
                        @{ Text = "Transfer"; Language = "de-CH" },
                        @{ Text = "Transfert"; Language = "fr-FR" },
                        @{ Text = "Transfer"; Language = "de-DE" }
                    )
                }
            }
        }
    }
    
    
    $parentItem = Get-Item -Path "master:$parentItemPath"
    
    $data.ContactUs.CaseTypes.GetEnumerator() | ForEach-Object {
    $itemName = $_.Key
    
    $caseTypeDetails = $_.Value
    $alternativeItemName = $caseTypeDetails.Questions[0].Text
    $IsPastHoliday = $caseTypeDetails.IsPastHoliday
    $SendTo = $caseTypeDetails.SendTo
    $SalesforceCategory = $caseTypeDetails.SalesforceCategory
    
    if(!($caseTypeItem = Get-Item -Path "master:$parentItemPath/$alternativeItemName" -ErrorAction SilentlyContinue)){
        if (!($caseTypeItem = Get-Item -Path "master:$parentItemPath/$itemName" -ErrorAction SilentlyContinue)) {
            $caseTypeItem = New-Item -Parent $parentItem -Name $itemName -ItemType $templateId
        }
    }
    
    $caseTypeDetails.Questions | ForEach-Object {
    
        $languageVersion = Get-Item -Path "master:$($caseTypeItem.Paths.Path)" -Language $_.Language
        if (-not $languageVersion) {
            $languageVersion = Add-ItemLanguage -Item $caseTypeItem -Language $caseTypeItem.Language -TargetLanguage $_.Language
            $languageVersion = Get-Item -Path "master:$($caseTypeItem.Paths.Path)" -Language $_.Language
        }
        $languageVersion
        $languageVersion.Editing.BeginEdit()
        $languageVersion["Title"] = $_.Text
        $languageVersion["SendTo"] = $SendTo
        $languageVersion["SalesforceCategory"] = $SalesforceCategory
        $languageVersion["EmailSubject"] = $_.EmailSubject
        if ($IsPastHoliday) {
            $languageVersion["State"] = "Past"
        } else {
            $languageVersion["State"] = "Future"
        }
        $languageVersion.Editing.EndEdit() | Out-Null
    }
    }
    
    
