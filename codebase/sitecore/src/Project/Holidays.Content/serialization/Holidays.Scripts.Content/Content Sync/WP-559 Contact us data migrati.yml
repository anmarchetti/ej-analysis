                        @{ Text = "Déposer une plainte"; Language = "fr-CH"; EmailSubject = "Déposer une plainte [ch-fr]" },
                        @{ Text = "Eine Beschwerde einreichen"; Language = "de-CH"; EmailSubject = "Eine Beschwerde einreichen [ch-de]" },
