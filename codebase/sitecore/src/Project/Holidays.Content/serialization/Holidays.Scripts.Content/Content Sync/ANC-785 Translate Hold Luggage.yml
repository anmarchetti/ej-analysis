        updateLuggageText -ItemPath $popupPath -Language "fr-FR" -Key 'Header' -Translation "Ajouter des bagages de soute"
        updateLuggageText -ItemPath $popupPath -Language "fr-FR" -Key 'DescriptionNote' -Translation "* Les prix sont calculés en faisant la moyenne des deux vols de votre séjour pour obtenir le prix que vous paierez. Les prix peuvent varier si vous ajoutez des bagages ultérieurement."
