ID: "5582cf4f-052d-43d0-8c8d-528fb1c94f7d"
Parent: "02f89113-4c03-40f8-988b-5ae62329b681"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-15258 Eco-Certified Facilities"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item ($path,$templateId,$forceId) {
    	$item = Get-Item -Path $path -ErrorAction SilentlyContinue
    	if (-not $item) {
    		$item = New-Item -Path $path -ItemType $templateId -ForceId $forceId
    		Write-Host "Item" $item.Name "successfully created"
    	}
    	return $item
    }
    
    
    $facilityTypeTemplateId = "{0AE072FB-5BCF-4E09-95B5-239CBE370B2B}"
    $ecoCertifiedFacilityID = "{4B03F06C-9538-4591-9498-1802A71E382B}"
    
    # Create Eco certified Facility
    $ecoCertifiedFacility = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Facility Types/Facilities/Eco certified" -TemplateId $facilityTypeTemplateId -ForceId $ecoCertifiedFacilityID
    $ecoCertifiedFacility.Editing.BeginEdit()
    $ecoCertifiedFacility["Code"] = "ECO"
    $ecoCertifiedFacility["Name"] = "Eco certified"
    $ecoCertifiedFacility["TooltipText"] = "Holidays that are ‘Eco-certified’ include hotels that meet our sustainability guidelines.";
    $ecoCertifiedFacility["ShowInFilter"] = "1";
    $ecoCertifiedFacility.Editing.EndEdit() | Out-Null
    
    $greenProgrammes = @(
    	@{
    		FolderName = "Green Programmes - Africa"
    		Facilities = @( "Green Star Hotel Certificate  Egypt")
    	},
    	@{
    		FolderName = "Green Programmes - Americas"
    		Facilities = @( "CST  Costa Rica")
    	},
    	@{
    		FolderName = "Green Programmes - Asia-Pacific"
    		Facilities = @( "EcoCertification EA  Australia")
    	},
    	@{
    		FolderName = "Green Programmes - Europe"
    		Facilities = @(
    			"Austrian Ecolabel Umweltzeichen fr Tourismusbetriebe",
    			"ECO Certification Malta",
    			"TourCert"
    		)
    	},
    	@{
    		FolderName = "Green Programmes - Worldwide"
    		Facilities = @(
    			"Biosphere Certification  Responsible Tourism Institute ITR",
    			"Earth Check",
    			"Green Globe 21",
    			"Green Key  Foundation for Environmental Education FEE",
    			"Green Key Global",
    			"Green Star",
    			"Travelife"
    		)
    	}
    )
    
    # Set Eco Certified FacilityFilterGroup for Green Programmes facilities
    foreach ($programme in $greenProgrammes) {
    	$folder = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Facility Types/$($programme.FolderName)" -ErrorAction SilentlyContinue
    
    
    	foreach ($facility in $programme.Facilities) {
    		$facilityItem = Get-Item -Path "$($folder.FullPath)/$($facility)" -ErrorAction SilentlyContinue
    
    		if ($facilityItem -ne $null) {
    			$facilityItem.Editing.BeginEdit()
    			$facilityItem["FacilityFilterGroup"] = $ecoCertifiedFacility.ID;
    			$facilityItem["ShowInFilter"] = "1";
    			$facilityItem.Editing.EndEdit() | Out-Null
    			Write-Host "Set Eco to" $facilityItem.Name
    		}
    	}
    }
    
    
    # Create Environmental Facilities Headers
    $facilityHeaderTemplateId = "{A5E834E6-986E-4668-8711-B83F507A7871}"
    $facilityHeaderItem = Get-Or-Create-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Facilities Headers/Environmental" -TemplateId $facilityHeaderTemplateId
    $facilityHeaderItem.Editing.BeginEdit()
    $facilityHeaderItem["Name"] = "Environmental"
    $facilityHeaderItem["Facilities"] = $ecoCertifiedFacility.ID
    $facilityHeaderItem.__Sortorder = 7
    $facilityHeaderItem.Editing.EndEdit() > $null
    
    
