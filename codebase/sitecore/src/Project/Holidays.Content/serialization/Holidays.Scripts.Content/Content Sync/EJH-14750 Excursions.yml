DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Create settings
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Settings";
    $itemName = "Excursions Settings";
    $itemTemplateId = '{82027255-F614-4542-BD74-ED795325E963}';
    
    $item = Get-Item -path "$($itemPath)/$($itemName)" -ErrorAction SilentlyContinue
    if ($item -eq $null) {
        #create item
        $item = New-Item -Path $itemPath -ItemType $itemTemplateId -Name $itemName
        Write-Host "Item" $item.Name "successfully created"
    }
    
    #Create datasource
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    $excursionsData = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Data/Excursions" -templateId "{EBC9E11F-ED6E-4283-B55D-4B5E4149D2DB}" 
    if ($excursionsData -ne $null) {
        $excursionsData.Editing.BeginEdit()
        $excursionsData["Title"] = "Exciting tours and activities";
        $excursionsData["FreeCancellation"] = 'Free cancellation';
        $excursionsData["LikelyToSellOut"] = "Likely to sell out";
        $excursionsData["PoweredBy"] = 'Powered by';
        $excursionsData["Logo"] = '<image mediaid="{E59777FD-B55C-46A8-9652-2B2A471DB196}" />';
        $excursionsData["SeeMoreMobile"] = 'See all excursions';
        $excursionsData["SeeMoreDesktop"] = 'See all top excursions';
        $excursionsData.Editing.EndEdit() | Out-Null
    }
    
    function Find-Destinations-Items {
    param($tempateName)
    $criteria = @(
    @{ Filter = "Equals"; Field = "_latestversion"; Value = "true"; }
    @{ Filter = "Equals"; Field = "_templatename"; Value = $tempateName; }
    )
    
    $props = @{
    Index = "sitecore_destinations_master_index"
    Criteria = $criteria
    }
    
    $items = Find-Item @props
    
    return $items
    }
    
    function Set-Datasorse-For-Destination($dest) {
        $countries = Find-Destinations-Items -tempateName $dest;
    $countries | ForEach-Object {
       $destPage =  Get-Item -Path $_.Path -ErrorAction SilentlyContinue
       if($destPage -ne $null){
           $rendering = Get-Rendering -Item $destPage | Where-Object { $_.ItemId -eq '{9C3DFA27-58E8-466E-AB02-1158188EE582}'} | Select -First 1;
           if($rendering -ne $null){
               Set-Rendering -Item $destPage -Instance $rendering -Datasource $excursionsData.Id
           }
       } else {Write-Host "Item" $_.Name "is null"}
    }
    }
    
    Set-Datasorse-For-Destination -dest 'Country' 
    Set-Datasorse-For-Destination -dest 'Region' 
    Set-Datasorse-For-Destination -dest 'Resort' 
    
