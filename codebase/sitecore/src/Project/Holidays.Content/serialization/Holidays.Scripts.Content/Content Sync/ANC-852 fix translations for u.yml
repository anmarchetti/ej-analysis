- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $backToHomePageLabel = '/sitecore/content/EasyJet/Holidays/Dictionary/Luggage Url Popup/Buttons/Back To Homepage'
    $contentLabel = '/sitecore/content/EasyJet/Holidays/Dictionary/Luggage Url Popup/Labels/Content'
    $headerLabel = '/sitecore/content/EasyJet/Holidays/Dictionary/Luggage Url Popup/Labels/Header'
    
    function create-lang-version ($item,$lang,$value) {
    	$targetLangItem = Get-Item -Path $item -Language $lang
        $targetLangItem
    
    	if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
    		Add-ItemVersion -Path $item -TargetLanguage $lang -IfExist Append -DoNotCopyFields
    		$targetLangItem = Get-Item -Path $item -Language $lang
    	}
    
    	if ($null -ne $targetLangItem) {
    		$targetLangItem = Get-Item -Path $item -Language $lang
    		$targetLangItem.Editing.BeginEdit()
    		$targetLangItem['Phrase'] = $value;
    		$targetLangItem.Editing.EndEdit() | Out-Null
    	}
    }
    
    create-lang-version -Item $backToHomePageLabel -Lang 'de-DE' -Value 'Zurück zur Hauptseite'
    create-lang-version -Item $backToHomePageLabel -Lang 'de-CH' -Value 'Zurück zur Hauptseite'
    create-lang-version -Item $backToHomePageLabel -Lang 'fr-FR' -Value "Retour à la page d'accueil"
    create-lang-version -Item $backToHomePageLabel -Lang 'fr-CH' -Value "Retour à la page d'accueil"
    create-lang-version -Item $contentLabel -Lang 'de-DE' -Value 'Es gibt ein Problem mit der URL, auf die Sie zuzugreifen versuchen'
    create-lang-version -Item $contentLabel -Lang 'de-CH' -Value 'Es gibt ein Problem mit der URL, auf die Sie zuzugreifen versuchen'
    create-lang-version -Item $contentLabel -Lang 'fr-FR' -Value "Il y a un problème avec l'URL que vous essayez d'accéder"
    create-lang-version -Item $contentLabel -Lang 'fr-CH' -Value "Il y a un problème avec l'URL que vous essayez d'accéder"
    create-lang-version -Item $headerLabel -Lang 'de-DE' -Value 'Ups, da ist etwas schief gelaufen...'
    create-lang-version -Item $headerLabel -Lang 'de-CH' -Value 'Ups, da ist etwas schief gelaufen...'
    create-lang-version -Item $headerLabel -Lang 'fr-FR' -Value "oops, quelque chose s'est mal passé..."
    create-lang-version -Item $headerLabel -Lang 'fr-CH' -Value "oops, quelque chose s'est mal passé..."
