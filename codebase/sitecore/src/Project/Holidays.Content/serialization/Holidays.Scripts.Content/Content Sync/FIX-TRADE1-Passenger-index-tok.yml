    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    $adult = Get-Or-Create-Item -path "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags/Adult" -template "{3CC028F4-4555-4A87-83EE-15F5AF0C67EB}";
    if ($adult -ne $null){
        $adult.Editing.BeginEdit();
        $adult["TitleConstant"] = "Adult {passengerIndex}";
        $adult.Editing.EndEdit();
        
        Write-Host "updated Tradeportal - Seat And Bag - Passenger Adult index";
    }
    
    
    $adultAndInfant = Get-Or-Create-Item -path "/sitecore/content/EasyJet/TradePortal/Data/Seat And Bags/Adult And Infant" -template "{3CC028F4-4555-4A87-83EE-15F5AF0C67EB}";
    if ($adultAndInfant -ne $null){
        $adultAndInfant.Editing.BeginEdit();
        $adultAndInfant["TitleConstant"] = "Adult {passengerIndex} + infant";
        $adultAndInfant.Editing.EndEdit();
        
        Write-Host "updated Tradeportal - Seat And Bag - Passenger Adult with infant index";
    }
