    $lakesDesignItemName = "Lakes"
    
    $mapRenderingId = "{40F87A5B-8104-4E37-9EF1-6710BDF90C36}"
    
    function Get-Or-Create-Item($name, $path, $template){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $template
        }
        
        return $item
    }
    
    function Create-Or-Update-Lakes-Theme-Types($lakeTheme){
        if($lakeTheme -ne $null){
            $lakeTheme.Editing.BeginEdit()
            $lakeTheme.Fields["Code"].Value = $lakesThemeData.Code
            $lakeTheme.Fields["Icon"].Value = $lakesThemeData.Icon
            $packageIcons = ''
            $lakesThemeData.PackageIcons | Foreach-Object { 
                $packageIcon = Get-Item -Path $_ -ErrorAction SilentlyContinue
                if($packageIcon -ne $null){
                    $packageIcons += "$($packageIcon.ID)|"
                }
            }
            $lakeTheme.Fields["PackageIcons"].Value = $packageIcons.Trim("|")
            $lakeTheme.Fields["DestinationGuideTitle"].Value = $lakesThemeData.DestinationGuideTitle
            $lakeTheme.Fields["DestinationGuideUrl"].Value = $lakesThemeData.DestinationGuideUrl
            $lakeTheme.Editing.EndEdit()
            foreach($themeType in $lakesThemeTypes){
                $themeTypeItem = Get-Or-Create-Item -Name $themeType.Name -Path $lakeTheme.Paths.FullPath -Template $themeTypeTemplateId
                $themeTypeItem.Editing.BeginEdit()
                $themeTypeItem.Fields["Code"].Value = $themeType.Code
                $themeTypeItem.Fields["Description"].Value = $themeType.Description
                $themeTypeItem.Fields["FilledIcon"].Value = $themeType.FilledIcon
                $themeTypeItem.Fields["Icon"].Value = $themeType.Icon
                $themeTypeItem.Fields["DestinationGuideTitle"].Value = $themeType.DestinationGuideTitle
                $themeTypeItem.Fields["DestinationGuideUrl"].Value = $themeType.DestinationGuideUrl
                $themeTypeItem.Editing.EndEdit() > $null
            }
        }
    }
    
    function Update-Lakes-Design($item, $theme){
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item.Fields["Theme"].Value = $theme.Name
            $item.Editing.EndEdit() > $null
            
            $mapRendering = Get-Rendering -Item $item | Where-Object { $_.ItemID -eq "{40F87A5B-8104-4E37-9EF1-6710BDF90C36}" } | Select -First 1
    
            $updatedParams = New-Object System.Collections.Specialized.OrderedDictionary
            foreach($param in $mapRendering.Parameters.Split("&")){
                $keyValueParam = $param.Split("=")
                $paramValue = ''
                If($keyValueParam.length -gt 1) {
                    $paramValue = $keyValueParam[1]
                    
                }
                if($keyValueParam[0] -eq "zoom") {
                    $paramValue = 24
                }
                
                $updatedParams.Add($keyValueParam[0], $paramValue);
            } 
        
            Set-Rendering -Item $item -Instance $mapRendering -Parameter $updatedParams
        }
    }
    
    $lakesTheme = Get-Or-Create-Item -Name $lakesItemName -Path $themesItemPath -Template  $hoetlThemeTempalteId
    Create-Or-Update-Lakes-Theme-Types -LakeTheme $lakesTheme
    
    $designItem = Get-Or-Create-Item -Name $lakesDesignItemName -Path $designsItemPath -Template  $hoetlThemeDesignTempalteId
    
    Update-Lakes-Design -Item $designItem -Theme $lakesTheme
    
    
