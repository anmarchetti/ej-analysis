    function Get-Or-Create-Item($path, $itemName, $templateId){
        $item = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $itemName -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created";
        }
        return $item
    } 
    
    
    $pageItem = Get-Item -Path "master://sitecore/content/EasyJet/Holidays/Home/Root/Info/Cookie policy" -ErrorAction SilentlyContinue
    
    if($pageItem -ne $null) {
        # Create empty  component
        $templateId = "{E8CC82FD-0F37-42D6-AAB5-B23B32ED13B8}"
        $componentItem = Get-Or-Create-Item -path "$($pageItem.FullPath)/Page Components" -itemName "Manage Cookies Preferences" -templateId $templateId
    }
