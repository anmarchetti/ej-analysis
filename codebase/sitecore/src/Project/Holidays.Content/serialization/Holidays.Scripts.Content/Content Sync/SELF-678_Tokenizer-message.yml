  Value: |
    $path = "/sitecore/content/EasyJet/Holidays/Home/Booking/Passenger Details/Page Components/Attention Passengers Count Change Message";
    $amendPassengersAttentionMessageItem = Get-Item -Path $path -ErrorAction SilentlyContinue;
    
    if ($amendPassengersAttentionMessageItem -ne $null) {
    	$amendPassengersAttentionMessageItem.Editing.BeginEdit();
    	
        $amendPassengersAttentionMessageItem["Description"]='<p>On this page, you can make one free of charge change of up to {amount} characters to the full names of anyone on your booking (excluding the lead passenger). If you need to change more than three characters, or want to add or remove anyone from your booking, please <a href="https://www.easyjet.com/en/holidays/help/contact-form" _target="blank">get in touch</a> with our team.</p>';
    	
    	Write-Host $amendPassengersAttentionMessageItem.Name "Updated";
        $amendPassengersAttentionMessageItem.Editing.EndEdit() | Out-Null;
    }
