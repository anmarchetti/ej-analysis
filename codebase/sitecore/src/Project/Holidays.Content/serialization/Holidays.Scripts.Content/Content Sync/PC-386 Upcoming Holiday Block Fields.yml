    $itemPath = "/sitecore/content/EasyJet/Holidays/Home/Page Components/UK/Upcoming Holiday Block"
    $item = Get-Item -Path $itemPath -Language "en" -ErrorAction SilentlyContinue
    if ($item -eq $null) {
