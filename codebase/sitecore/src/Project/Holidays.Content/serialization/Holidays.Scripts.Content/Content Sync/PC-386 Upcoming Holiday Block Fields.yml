        return
    }
    $item.Editing.BeginEdit()
    $item["CountdownTextSingular"] = "{count} day until your holiday!"
    $item["CountdownTextPlural"] = "{count} days until your holiday!"
    $item.Editing.EndEdit() | Out-Null
