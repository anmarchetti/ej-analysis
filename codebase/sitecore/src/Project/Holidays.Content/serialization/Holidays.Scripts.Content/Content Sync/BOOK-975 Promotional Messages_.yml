    function Get-Rendering-Index ($item, $renderingItemId) {
        	$i = 0
        	Get-Rendering -Item $item | ForEach-Object {
        		if ($_.ItemID -eq $renderingItemId) {
        			return $i
        		}
        		$i++
        	}
        }
    
    function Add-Pills-To-Page($pageItem) {
        $ph = '/body/component-wrapper-inner-{3ec4afc7-9857-4894-9552-b00c1f45c41a}-0/promotional-messages-{9ed3c2b4-6fbb-4cf6-9464-9d14a0984c93}-0'
        
        if($pageItem -ne $null) {
            $searchResultsRenderingId = "{76C32F3D-E1E3-4213-BD40-207B954EFF42}"
            $searchResultsRendering = Get-Rendering -Item $pageItem -FinalLayout -Language "en" | Where-Object {$_.ItemId -eq $searchResultsRenderingId}
            $searchResultsRenderingIndex = Get-Rendering-Index -Item $pageItem -RenderingItemId $searchResultsRenderingId -FinalLayout -Language "en"
        
            $promoMessagesRenderingId = "{417834B3-FCF9-434D-BD14-DA73AEBB48D7}"
            $promoMessagesPlaceholder = $searchResultsRendering.Placeholder + '/promotional-messages-' + $searchResultsRendering.UniqueId + '-0'
            $promoMessagesRenderingIndex = $searchResultsRenderingIndex + 1
            $rendering = Get-Rendering -Item $pageItem -PlaceHolder $promoMessagesPlaceholder -FinalLayout -Language "en" | Where-Object {$_.ItemId -eq $promoMessagesRenderingId}
            
            if ($rendering -eq $null) {
                $promoMessagesRendering = Get-Item -Path "master:" -ID $promoMessagesRenderingId | New-Rendering
                Add-Rendering -Item $pageItem -Instance $promoMessagesRendering -DataSource "{5E23681C-971C-4543-B3C2-F03955C7C0AE}" -Placeholder $promoMessagesPlaceholder -Index $promoMessagesRenderingIndex -FinalLayout -Language "en"
                Write-Host "Promotional Messages Rendering added to $($pageItem.Paths.FullPath)"
            } else {
                Set-Rendering -Item $pageItem -Instance $rendering -DataSource "{5E23681C-971C-4543-B3C2-F03955C7C0AE}" -PlaceHolder $promoMessagesPlaceholder -Index $promoMessagesRenderingIndex -FinalLayout -Language "en"
                        Write-Host "Update rendering "($pageItem.Name)
            }
         }
    }
    
    $searchPagePath = '/sitecore/content/EasyJet/TradePortal/Home/MixedResultList'
    $item = gi -path $searchPagePath
    
    Add-Pills-To-Page($item)
    
    $allItems = Get-ChildItem -Path "/sitecore/content/EasyJet/TradePortal/Home/Root" -Recurse
            
            ForEach ($item in $allItems) {
        	    if (($item.TemplateName -eq 'Promo Page') -or ($item.TemplateName -eq 'Recurring Promo Page')) {
        	        Add-Pills-To-Page($item)
        	    }
            }
        
