- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item $($item.Name) successfully created"
        }
        
        return $item
    }
    
    function Remove-Data-Source($path){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
    
        if($item -ne $null){
            $path = $item.FullPath
            Remove-Item -Path $path
        
            Write-Host "Removed data sources: " $path
        }
    }
    
    $sustainabilityPagePath = "master:/sitecore/content/EasyJet/Holidays/Home/Sustainability";
    $ourWorkBannerDataSourcePath = "$($sustainabilityPagePath)/Page Components/Information Banners/Our Work"
    
    # Remove Our work sliced banner data source wich has incorrect template
    Remove-Data-Source -Path $ourWorkBannerDataSourcePath
    
    $item = Get-Or-Create-Item -Path $ourWorkBannerDataSourcePath -TemplateId "{C7077196-F8EC-40CA-A23D-2AE06D8EEB61}"
    
    if ($item -ne $null) {
        $item.Editing.BeginEdit()
    
        $item["Title"] = "Our work";
        $item["Subtitle"] = "When it comes to sustainability we want to raise the bar, positively shake things up and lead the industry. To make sustainability part of our everyday culture, enabling us, our partners, and our customers to reduce their footprint, and make a positive impact on the people and places that make our destinations so special.";
        $item["Image"] = "<image mediaid='{4B489EC4-76BC-4F34-AC22-DD89C8BC1D5C}' />";
    
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Banner data source created"
    }
    
