Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EUX-674 Update language selector"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $langOptions = @(
    	@{
    		Name = "English";
    		Icon = '<image mediaid="{9f2585bb-4742-48de-850b-94470d7bb3bc}" />'
    		IconCircular = '<image mediaid="{834c92e2-3879-4303-8a9a-f3b1207941b1}" />'
    	},
    	@{
    		Name = "French Swiss";
    		Icon = '<image mediaid="{95b06a3a-e7d9-4105-83ab-221c4d007511}" />'
    		IconCircular = '<image mediaid="{8bc95ed3-ced2-42c7-8d85-e76712fe4de4}" />'
    	},
    	@{
    		Name = "German Swiss";
    		Icon = '<image mediaid="{95b06a3a-e7d9-4105-83ab-221c4d007511}" />'
    		IconCircular = '<image mediaid="{8bc95ed3-ced2-42c7-8d85-e76712fe4de4}" />'
    	}
    );
    
    # Update Icons
    foreach ($opt in $langOptions) {
    	$optItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Language Selector/$($opt.Name)" -ErrorAction SilentlyContinue
    
    	if ($optItem -ne $null) {
    		$optItem.Editing.BeginEdit()
    		$optItem["Icon"] = $opt.Icon;
    		$optItem["IconCircle"] = $opt.IconCircular;
    		$optItem.Editing.EndEdit() | Out-Null
    	}
    } 
