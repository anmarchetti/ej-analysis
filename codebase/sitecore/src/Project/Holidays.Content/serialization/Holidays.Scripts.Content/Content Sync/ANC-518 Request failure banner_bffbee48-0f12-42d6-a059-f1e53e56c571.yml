  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
            if($item -eq $null){
                $item = New-Item -Path $path -ItemType $template
            }
        return $item
    }
    
    
    function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
            
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
            }
            
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang -ErrorAction SilentlyContinue;
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
        }
    
    $template = '{63D3079B-9A85-4872-AC5E-34D19D8D972E}'
    $path = '/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/Cabin Bags/Request Failure Banner'
    $tradePath = '/sitecore/content/EasyJet/TradePortal/Home/Booking/Page Components/Cabin Bags/Request Failure Banner'
    
    $banner = Get-Or-Create-Item -Path $path -Template $template
    
    if($banner -ne $null) {
        $banner.Editing.BeginEdit()
        $banner['Subtitle'] = "We're sorry, the ability to add large cabin bags is currently unavailable for these flight. You can still book your holiday and add large cabin bags at a later stage."
        $banner.Editing.EndEdit() | Out-Null
    }
    
    $bannerTrade = Get-Or-Create-Item -Path $tradePath -Template $template
    
    if($bannerTrade -ne $null) {
        $bannerTrade.Editing.BeginEdit()
        $bannerTrade['Subtitle'] = "We're sorry, the ability to add large cabin bags is currently unavailable for these flight. You can still book your holiday and add large cabin bags at a later stage."
        $bannerTrade.Editing.EndEdit() | Out-Null
    }
    
    $translations = @{
            
            "fr-CH" = @{
                "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter des bagages de cabine de grande taille n'est pas disponible pour le moment pour ce vol. Vous pouvez toujours réserver vos vacances et ajouter des bagages de cabine à un stade ultérieur."
            }
            "fr-FR" = @{
                "Subtitle" = "Nous sommes désolés, la possibilité d'ajouter des bagages de cabine de grande taille n'est pas disponible pour le moment pour ce vol. Vous pouvez toujours réserver vos vacances et ajouter des bagages de cabine à un stade ultérieur."
            }
            "de-CH" = @{
                "Subtitle" = "Es tut uns leid, die Möglichkeit, großes Handgepäck hinzuzufügen, ist für diese Flüge derzeit nicht verfügbar. Sie können Ihre Reise immer noch buchen und zu einem späteren Zeitpunkt großes Handgepäck hinzufügen."
            }
            "de-DE" = @{
                "Subtitle" = "Es tut uns leid, die Möglichkeit, großes Handgepäck hinzuzufügen, ist für diese Flüge derzeit nicht verfügbar. Sie können Ihre Reise immer noch buchen und zu einem späteren Zeitpunkt großes Handgepäck hinzufügen."
            }
        }
        
        foreach ($lang in $translations.Keys) {
            create-lang-version -item $banner -lang $lang -field "Subtitle" -value $translations[$lang]["Subtitle"]
        }    
    
    
    
