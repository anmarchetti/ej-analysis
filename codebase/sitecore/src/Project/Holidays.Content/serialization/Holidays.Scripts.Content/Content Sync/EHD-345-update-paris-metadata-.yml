- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    Write-Host "START: EHD-345 Missing Images on DG2"
    Write-Log "START: EHD-345 Missing Images on DG2"
    
    function Update-Paris-Metadata-Category () {
        $item = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Destinations/France/Paris"
        $item.Editing.BeginEdit()
    	$item["PageCategory"] = "Region"
    	$item.Editing.EndEdit() | Out-Null
    	
    	Write-Host "PageCategory set as Region for " $item.FullPath
        Write-Log "PageCategory set as Region for " $item.FullPath
    }
    
    Set-Location -Path master:
    #Set-Location -Path web:
    
    Update-Paris-Metadata-Category
    
    Write-Host "END: EHD-345 Missing Images on DG2"
    Write-Log "END: EHD-345 Missing Images on DG2"
