Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Remove Travel Aware on Price Promise Page
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $pricePromiseTemplateId = "{D3387F64-3182-419F-A6EF-E472985F2D25}"
    $pageDesignFolder = "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs"
    
    # Remove Price Promise Page from Default Page Design
    $defaultDesignItem = Get-Item -Path "$($pageDesignFolder)/Default Design" -ErrorAction SilentlyContinue;
    if ($defaultDesignItem -ne $null) {
        [Sitecore.Data.Fields.MultilistField]$field = $defaultDesignItem.Fields["PageTemplates"];
        
        if($field.Contains($pricePromiseTemplateId)) {
            $defaultDesignItem.Editing.BeginEdit();
            $field.remove($pricePromiseTemplateId);
            $defaultDesignItem.Editing.EndEdit() | Out-Null
            Write-Host "Price Promise removed from Default Design"
        }
    }
    
    
    # Create new Page Design and set Price Promise to it
    $pageDesignName = "Full Header and Footer Without Travel Aware Design"
    $pageDesignItem = Get-Item -Path "$($pageDesignFolder)/$pageDesignName" -ErrorAction SilentlyContinue
    if($pageDesignItem -eq $null) {
        
        # 1. Copy Full Footer
        $partialDesignFolder = "/sitecore/content/EasyJet/Holidays/Presentation/Partial Designs"
        $fullFooterPath = "$($partialDesignFolder)/Full Footer"
        $newFooterPath = "$($partialDesignFolder)/Footer Without Travel Aware"
        
        Copy-Item -Path $fullFooterPath -Destination $newFooterPath
        $newFooter = Get-Item -Path $newFooterPath -ErrorAction SilentlyContinue
        Write-Host "Footer Without Travel Aware created"
        
        # 2. Remove Travel Aware Rendering from copied Footer item  
        $travelAwareRenderingId = "{C9500B31-1890-47FC-8DBB-87AEE89397D6}"
        $travelAwareRendering = Get-Rendering -Item $newFooter | Where-Object {$_.ItemId -eq $travelAwareRenderingId} | Select -First 1
        Remove-Rendering -Item $newFooter -Instance $travelAwareRendering
        Write-Host "Travel Aware Rendering removed"
        
        # 3. Create new Page Design
        $pageDesignItem = New-Item -Path $pageDesignFolder -Name $pageDesignName -ItemType "{4B960AA8-24C3-4A4E-A27F-F4718D189EF6}"
        Write-Host $pageDesignItem.Name "created"
        
        $pageDesignItem.Editing.BeginEdit();
        # 4. Set Full Header and new Footer to partial design
        $pageDesignItem["PartialDesigns"] = "{B628B4D0-99B4-4E94-ABA6-F5596D6E4E57}|$($newFooter.ID)"
        # 5. Set Price Promise Page to new Page design
        $pageDesignItem["PageTemplates"] = $pricePromiseTemplateId
        $pageDesignItem.Editing.EndEdit() | Out-Null
        Write-Host $pageDesignItem.Name "updated"
    }
