SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # create data source
    $dataSourcePath = "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details/Page Components/Hotel Poster"
    $hotelPosterTemplateId = "{311C3F85-FEB2-432E-98A9-DFBA26C95A0C}"
    
    $hotelPosterItem = Get-Item -path $dataSourcePath -ErrorAction SilentlyContinue
    
    if ($hotelPosterItem -eq $null) {
        # create item
        $hotelPosterItem = New-Item -Path $dataSourcePath -ItemType $hotelPosterTemplateId
        Write-Host "Item" $hotelPosterItem.Name "successfully created"
    }
    
    # rendering data source setup
    $renderingId = "{705184BB-B790-4EF3-8DF8-C49FB1D9E89C}" #Hotel poster
    $hotelDetailsPagePath = "/sitecore/content/EasyJet/TradePortal/Home/Hotel Details"
    
    $hotelDetailssPageItem = Get-Item -Path "master:" -Query $hotelDetailsPagePath
    $rendering = Get-Rendering -Item $hotelDetailssPageItem | Where-Object { $_.ItemID -eq $renderingId }
    
    $rendering.DataSource = $dataSourcePath
    Set-Rendering -Item $hotelDetailssPageItem -Instance $rendering
