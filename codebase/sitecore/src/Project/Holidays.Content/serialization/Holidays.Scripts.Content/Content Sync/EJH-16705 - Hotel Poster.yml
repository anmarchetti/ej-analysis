  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/ 
    
    $itemPath = "master:/content/EasyJet/TradePortal/Home/Hotel Details/Page Components/Hotel Poster"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    if ($item -ne $null) {
        
        $item.Editing.BeginEdit()
        $item["Title"] = "You're about to download a summary of the holiday as a PDF file"
        $item["Description"] = 'Please have a look at a preview of the PDF'
        $item["LogoImage"] = '<image mediaid="{01548208-7DD9-42DA-A595-49CB9F683C93}" />'
        $item["ExportPromoLabel"] = "Export promotional poster"
        $item["ExportPromoTooltip"] = "You're able to download a summary of the holiday as a PDF file."
        $item["ReturnLabel"] = "Back to hotel details"
        $item["LogoCheckboxLabel"] = "Place easyJet holidays logo"
        $item["DownloadLabel"] = "Download"
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
