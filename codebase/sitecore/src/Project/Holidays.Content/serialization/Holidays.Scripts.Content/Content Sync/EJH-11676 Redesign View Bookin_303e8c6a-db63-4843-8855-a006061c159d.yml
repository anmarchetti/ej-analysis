Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/EJH-11676 Redesign View Booking Fix"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Update login block theme
    $viewBookingPage = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking"
    $loginBlock = Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Log In For More Info' -ErrorAction SilentlyContinue
    
    if ($loginBlock -ne $null) {
    	$rendering = Get-Rendering -Item $viewBookingPage -DataSource $loginBlock.ID | Select -First 1
    
    	if ($rendering -ne $null) {
    		$rendering.Parameters = "Theme=One Row"
    		Set-Rendering -Item $viewBookingPage -Instance $rendering
    		Write-Host "Login theme is updated";
    	}
    
    }
    
    
