Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-891 - Remove Shortlist from MainNav"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    
    $shortlistItemID = (Get-Item -Path "master:/sitecore/content/EasyJet/Holidays/Data/Navigations/Button/Shortlist").ID
    
    function Remove-Shortlist($lang){
        @("/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Full Header",
        "/sitecore/content/EasyJet/Holidays/Data/Navigations/Headers/Full Header With Market Selector") | % {
            $item = Get-Item -Path "master:$_" -Language $lang -ErrorAction SilentlyContinue
            
            if($item -ne $null){
                [Sitecore.Data.Fields.MultilistField]$mainNav =$item.Fields["MainNav"]
                
                $path = $item.Paths.FullPath
                
                $item.Editing.BeginEdit()
                $mainNav.Remove($shortlistItemID.ToString()) | Out-Null
                $item.Editing.EndEdit() | Out-Null
                
                Write-Host "Main Nav for $lang $path were updated"
            }
    
        }
    }
    
    
    @('de-CH', 'de-DE', 'en', 'fr-CH', 'fr-FR') | % {
        Remove-Shortlist -lang $_
    }
        
