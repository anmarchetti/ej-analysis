Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/ANC-1206 flight extras search promocodes"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function create-lang-version($item, $lang, $field, $value) {
          $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
          
          if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
            Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip
          }
          
          if ($null -ne $field) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            $targetLangItem.Editing.BeginEdit()
            $targetLangItem[$field] = $value;
            $targetLangItem.Editing.EndEdit() | Out-Null
          }
        }
        
        $promoCodeSettingsHolidays = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Promo Code Settings" -Language "en" -ErrorAction SilentlyContinue
           
        Create-Lang-Version -Item $promoCodeSettingsHolidays -Lang "en" -Field "FlightExtrasSearchPromoCode" -Value "EUFO"
        Create-Lang-Version -Item $promoCodeSettingsHolidays -Lang "fr-FR" -Field "FlightExtrasSearchPromoCode" -Value "FRFO"
        Create-Lang-Version -Item $promoCodeSettingsHolidays -Lang "de-DE" -Field "FlightExtrasSearchPromoCode" -Value "DEFO"
        Create-Lang-Version -Item $promoCodeSettingsHolidays -Lang "fr-CH" -Field "FlightExtrasSearchPromoCode" -Value "CHFO"
        Create-Lang-Version -Item $promoCodeSettingsHolidays -Lang "de-CH" -Field "FlightExtrasSearchPromoCode" -Value "CHFO"
        
        $promoCodeSettingsTradePortal = Get-Item -Path "/sitecore/content/EasyJet/TradePortal/Settings/Promo Code Settings" -Language "en" -ErrorAction SilentlyContinue
           
        Create-Lang-Version -Item $promoCodeSettingsTradePortal -Lang "en" -Field "FlightExtrasSearchPromoCode" -Value "EUFO"
        Create-Lang-Version -Item $promoCodeSettingsTradePortal -Lang "fr-FR" -Field "FlightExtrasSearchPromoCode" -Value "FRFO"
        Create-Lang-Version -Item $promoCodeSettingsTradePortal -Lang "de-DE" -Field "FlightExtrasSearchPromoCode" -Value "DEFO"
        Create-Lang-Version -Item $promoCodeSettingsTradePortal -Lang "fr-CH" -Field "FlightExtrasSearchPromoCode" -Value "CHFO"
        Create-Lang-Version -Item $promoCodeSettingsTradePortal -Lang "de-CH" -Field "FlightExtrasSearchPromoCode" -Value "CHFO"
            
        Write-Host "Script was executed"
