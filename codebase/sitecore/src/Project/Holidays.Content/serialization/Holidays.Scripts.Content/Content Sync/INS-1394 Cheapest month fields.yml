SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    ## UPDATE FILEDS WITH LANGS
    function update-item-with-lang($data, $item) {
        function create-lang-version($item, $lang, $field, $value) {
            $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
            if ($targetLangItem -eq $null -or $targetLangItem.Versions.GetVersions().Count -eq 0) {
                Add-ItemLanguage -Item $item -TargetLanguage $lang -IfExist Skip -DoNotCopyFields
            }
            if ($null -ne $field) {
                $targetLangItem = Get-Item -Path $item.Paths.FullPath -Language $lang
                $targetLangItem.Editing.BeginEdit()
                $targetLangItem[$field] = $value;
                $targetLangItem.Editing.EndEdit() | Out-Null
            }
    };
     
        if ($item -ne $null) {
            $data | ForEach-Object {
            $fieldName = $_.fieldName;
            $values = $_.values;
            if ($values -ne $null) {
                if ($values.en -ne $null) {
                    $item.Editing.BeginEdit();
                    $item[$fieldName] = $values.en;
                    $item.Editing.EndEdit() | Out-Null
                }
                 if ($values.fr -ne $null) {
                     @('fr-CH', 'fr-FR') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.fr;
                    }
                }
                 if ($values.de -ne $null) {
                     @('de-CH', 'de-DE') | % {
                        Create-Lang-Version -Item $item -Lang $_ -Field $fieldName -Value $values.de;
                    }
                }
                Write-Host $fieldName "Updated"
            }
        }
        }
    };
    ##
     
    $searchPodSettingsItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Settings/Search Pod Settings";
    $searchPodItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Search Pods/Search Pod";
     
    $dataSettings = @(
    @{
        fieldName = "IsSearchCheapestMonthEnabled";
        values = @{
            en = "1"
        }
    }
    );
     
    $dataSearchPod = @(
    @{
        fieldName = "CheapestMonthLabel";
        values = @{
            en = "Cheapest month"
            de = "Günstigster Monat"
            fr = "Mois le moins cher"
        }
    },
    @{
        fieldName = "CheapestMonthDescriptionLabel";
        values = @{
            en = "Prices based on total holiday price for 2 adults, 1 room. Subject to availability."
            de = "Preise basieren auf dem Gesamtpreis für 2 Erwachsene, 1 Zimmer. Je nach Verfügbarkeit."
            fr = "Prix basés sur le prix total du séjour pour 2 adultes, 1 chambre. Sous réserve de disponibilité."
        }
    },
    @{
        fieldName = "CheapestMonthIcon";
        values = @{
            en = '<image mediaid="{41817C2B-8F54-4D5C-9CEE-2F086613AC5E}" />'
        }
    }
    );
     
    update-item-with-lang -Data $dataSettings -Item $searchPodSettingsItem;
    update-item-with-lang -Data $dataSearchPod -Item $searchPodItem;
