DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # For more information, please visit https://doc.sitecorepowershell.com/ 
    
    $itemPath = "master:/content/EasyJet/TradePortal/Data/Booking Confirmation Config"
    $itemTemplateId = "{56543B59-00A5-4A72-B6DB-0D1339D8B8B2}"
    
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    if ($item -eq $null) {
        
        # create item
        $item = New-Item -Path $itemPath -ItemType $itemTemplateId
        Write-Host "Item" $item.Name "successfully created"
        
        $item.Editing.BeginEdit()
        # Luggage Config
        $item["Infants"] = 1
        $item["ReadMoreLink"] = '<link text="Read more about bags" linktype="external" url="https://www.easyjet.com/en/holidays/help?helpCategory=luggage" anchor="" target="_blank" />'
        
        # Poster Content
        $item["Title"] = "You're about to download a summary of the holiday as a PDF file"
        $item["Description"] = 'Please have a look at a preview of the PDF'
        $item["LogoImage"] = '<image mediaid="{01548208-7DD9-42DA-A595-49CB9F683C93}" />'
        $item["Logos"] = '<image mediaid="{D04475F6-6D23-4A71-A9AD-3EADCD759BA4}" />'
        $item["ExportPromoLabel"] = "Export booking confirmation"
        $item["ExportPromoTooltip"] = "You're able to download a summary of the holiday as a PDF file."
        $item["ReturnLabel"] = "Back to booking confirmation"
        $item["LogoCheckboxLabel"] = "Place easyJet holidays logo"
        $item["DownloadLabel"] = "Download"
        $item["DownloadButton"] = "Download PDF"
        $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    
    $pagePath = Get-Item -Path "master:/content/EasyJet/TradePortal/Home/Booking/Confirmation"
    $renderingPath = "master:/layout/Renderings/Project/Trade Portal/Booking Confirmation"
    $dataSourcePath = "/sitecore/content/EasyJet/TradePortal/Data/Booking Confirmation Config"
    $rendering = Get-Item -Database "master" -Path $renderingPath
    	  
    $rendering = Get-Rendering -Item $pagePath -PlaceHolder 'body' | Where-Object { $_.ItemId -eq '{355B5C34-78DB-4494-AA2C-33C453186F2C}' } | Select -First 1; 
            Set-Rendering -Item $pagePath -Instance $rendering -DataSource $dataSourcePath
