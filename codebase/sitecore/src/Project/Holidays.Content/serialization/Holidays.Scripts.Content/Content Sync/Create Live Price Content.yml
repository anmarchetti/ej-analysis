- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $namesSearchesFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Live Price/Names Searches"
    $periodsFolderPath = "/sitecore/content/EasyJet/Holidays/Data/Live Price/Periods"
    $namesSearchTemplateId = "{8D0058CA-9E2B-428F-A0DC-50F8BD77A694}"
    $periodByDestinationTemplateId = "{056AC05C-E1D1-4FD4-BC4C-CEC966FA75E2}"
    
    function Create-Item($path,$name, $templateId){
        $item = Get-Item -Path "$($path)/$($name)" -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -Name $name -ItemType $templateId
        }
        return $item;
    }
    
    function Add-NamesSearch-Item($name, $nAdults, $nChild, $nNights, $typeId){
        $nsItem = Create-Item -Path $namesSearchesFolderPath -Name $name -TemplateId $namesSearchTemplateId
        
        $nsItem.Editing.BeginEdit()
        $nsItem["NumberOfAdults"] = $nAdults
        $nsItem["NumberOfChildren"] = $nChild
        $nsItem["DefaultDuration"] = $nNights
        $nsItem["ThemeTypes"] = $typeId
        $nsItem.Editing.EndEdit()
    }
    
    function Add-Period-Item($name, $runStart, $runEnd, $searchStart, $searchEnd, $isNextYear){
        $nsItem = Create-Item -Path $periodsFolderPath -Name $name -TemplateId $periodByDestinationTemplateId
        
        $nsItem.Editing.BeginEdit()
        $nsItem["DateOfRunStartDate"] = $runStart
        $nsItem["DateOfRunEndDate"] = $runEnd
        $nsItem["SearchDateRangeStartDate"] = $searchStart
        $nsItem["SearchDateRangeEndDate"] = $searchEnd
        $nsItem["NextYearDate"] = $isNextYear
        $nsItem.Editing.EndEdit()
    }
    
    $cityItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/City"
    $beachItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Beach"
    $familyItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Data/Hotel Themes/Beach/Family"
    
    Add-NamesSearch-Item -Name "City" -nAdults 2 -nNights 5 -typeId $cityItem.Id
    Add-NamesSearch-Item -Name "Beach" -nAdults 2 -nChild 1 -nNights 7 -typeId $beachItem.Id
    Add-NamesSearch-Item -Name "Family" -nAdults 2 -nChild 1 -nNights 5 -typeId $familyItem.Id
    
    Add-Period-Item -Name "All Jan 20" -runStart "20200101T000000Z" -runEnd "20200330T000000Z" -searchStart "20200501T000000Z" -searchEnd "20200715T000000Z" -isNextYear 0
    Add-Period-Item -Name "All Apr 20" -runStart "20200401T000000Z" -runEnd "20200730T000000Z" -searchStart "20200601T000000Z" -searchEnd "20200831T000000Z" -isNextYear 0
    Add-Period-Item -Name "All August 20" -runStart "20200801T000000Z" -runEnd "20200831T000000Z" -searchStart "20200801T000000Z" -searchEnd "20200930T000000Z" -isNextYear 0
    Add-Period-Item -Name "All September 20" -runStart "20200901T000000Z" -runEnd "20201231T000000Z" -searchStart "20210601T000000Z" -searchEnd "20210831T000000Z" -isNextYear 1
