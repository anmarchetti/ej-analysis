Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SER-76 Fix Special Requests and update order"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $inDestinationPagePath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/in-destination';
    $preTravelPagePath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel';
    $postTravelPagePath = 'master:/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/post-travel';
    
    function updateSpecialRequestsPlaceholder($pagePath) {
        $masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}" 
        
        # Get newly added rendering
        $page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
        $renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
        
        # SpecialRequests wrapper id
        $wrapperId = $renderings[4].UniqueId;
        $placeholder = '/body/booking-context-{0b3a1889-94df-4381-aaef-272a10e79e98}-0/masonry-section-{b93f1826-b25c-47d5-8fe3-dffe24e63a17}-0';
        
        $specialRequestsRenderingId = "{2A35FBE1-E039-4D16-B301-37FD96B0C10F}"
        
        $rendering = Get-Rendering -Item $page | Where-Object {$_.ItemId -eq $specialRequestsRenderingId};
        $rendering.Placeholder = "$($placeholder)/masonry-item-$($wrapperId)-0"
        Set-Rendering -Item $page -Instance $rendering;
        
        Write-Host "Update special requests placeholder on $($pagePath)"
    }
    
    function updatePostTravelOrder($pagePath) {
    	# Add Masonry Wrapper Item
    	$masonryRenderingId = "{630D2676-483E-420D-8F04-4C15212F3EFF}" 
    
    	# Get newly added rendering
    	$page = Get-Item -Path $pagePath -ErrorAction SilentlyContinue
    	$renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $masonryRenderingId }
    		
    	# Hotel wrapper
    	$hotelSummaryWrapperRendering = $renderings[0]
    	
    	Set-Rendering -Item $page -Instance $hotelSummaryWrapperRendering -Parameter @{ "ItemOrderOnMobile" = "1" }
    	
    	# Contact us
    	$contactUsWrapperRendering = $renderings[1]
    	
    	if ($contactUsWrapperRendering -ne $null) {
    	    Set-Rendering -Item $page -Instance $contactUsWrapperRendering  -Parameter @{ "ItemOrderOnMobile" = "50" }
    	}
    	
    	# Feedback Banner
    	$feedbackBannerWrapperRendering = $renderings[2]
    	
    	if ($feedbackBannerWrapperRendering -ne $null) {
    	    Set-Rendering -Item $page -Instance $feedbackBannerWrapperRendering  -Parameter @{ "ItemOrderOnMobile" = "10" }
    	}
    	
    	# Social Banner
    	$socialMediaWrapperRendering = $renderings[3]
    	
    	if ($socialMediaWrapperRendering -ne $null) {
    	    Set-Rendering -Item $page -Instance $socialMediaWrapperRendering  -Parameter @{ "ItemOrderOnMobile" = "30" }
    	}
    	
    	Write-Host "Update rendering order on $($pagePath)"
    }
    
    updateSpecialRequestsPlaceholder($inDestinationPagePath);
    updateSpecialRequestsPlaceholder($preTravelPagePath);
    updatePostTravelOrder($postTravelPagePath)
    
