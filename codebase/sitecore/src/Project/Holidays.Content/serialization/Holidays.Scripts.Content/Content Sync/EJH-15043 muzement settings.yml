  Value: |
    $muzementSettignsPath = "/sitecore/content/EasyJet/Holidays/Settings/Destination Mappings Settings"
    $templateId = "{26DC94DC-3A89-4BB8-856D-02A3E89897D4}"
    
    function Get-Or-Create-Item($path, $templateId){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if ($item -eq $null){
            $item = New-Item -Path $path -ItemType $templateId
        }
        
        return $item
    }
    
    $item = Get-Or-Create-Item -Path $muzementSettignsPath -Template $templateId
    if ($item -ne $null){
        $item.Editing.BeginEdit()
        $item.Fields["CountryRadius"].Value = "100"
        $item.Fields["RegionRadius"].Value = "100"
        $item.Editing.EndEdit()
    }
