    function create-item($path, $itemPath, $itemName, $itemType, $key, $content){
        $itemToCreateExist = Get-Item "$($path)/$itemName" -ErrorAction SilentlyContinue
        if($itemToCreateExist -eq $null){
            $createdItem = New-Item -Path $path -Name $itemName -ItemType $itemType
        } else {
            $createdItem = $itemToCreateExist
        }
            
        if($createdItem -ne $null){
            Write-Host $createdItem
            $createdItem.Editing.BeginEdit()
             $createdItem[$key] = $content
            $createdItem.Editing.EndEdit() | Out-Null
            return $createdItem
        }
        return $itemToCreateExist
    }
    
    function translate-item($itemPath, $language, $key, $translation) {
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -eq $null -or $item.Versions.GetVersions().Count -eq 0){
            Add-ItemLanguage -Path $itemPath -TargetLanguage $language -IfExist Skip -DoNotCopyFields;
        }
        $item = Get-Item -Path $itemPath -Language $language -ErrorAction SilentlyContinue;
    
        if($item -ne $null) {
            $item.Editing.BeginEdit()
            $item[$key] = $translation
            $item.Editing.EndEdit() | Out-Null
        }
       
    }
    
    
