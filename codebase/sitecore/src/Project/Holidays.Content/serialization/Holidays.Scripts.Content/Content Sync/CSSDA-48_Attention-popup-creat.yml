- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
        }
        return $item
    }
    
    function Add-Or-Update-Page-Rendering($page, $renderingPath, $renderingPlaceholder, $dataSourcePath) {
        $renderingItem = Get-Item -Database "master" -Path $renderingPath;
        $pageRenderingInstance = Get-Rendering -Item $page -PlaceHolder $renderingPlaceholder -DataSource $dataSourcePath;
        
        if ($pageRenderingInstance -eq $null) {
            $renderingInstance = $renderingItem | New-Rendering -Placeholder $renderingPlaceholder;
            Add-Rendering -Item $page -PlaceHolder $renderingPlaceholder -Instance $renderingInstance -Datasource $dataSourcePath;
            Write-Host $renderingItem "Rendering instance added";
        } 
        else {
            Write-Host $pageRenderingInstance "Already exists";
        }
    }
    #Page
    $myBookingPageItem = Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking";
    
    $inventoryErrorPopupItemPath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Booking/Page Components/Inventory Error Popup";
    
    #Creating InventoryErrorPopupItem
    $inventoryErrorPopupItem = Get-Or-Create-Item -path $inventoryErrorPopupItemPath -template "{C8C39B93-2202-4B2D-937F-8F644B0D3183}";
    
    #Update item's details
    if ($inventoryErrorPopupItem -ne $null) {
        $inventoryErrorPopupItem.Editing.BeginEdit();
        
        $inventoryErrorPopupItem["Title"]="Inventory Error";
        $inventoryErrorPopupItem["Description"]="<p>Please try again or call the call the call centre {number} for additional support. </p>";
        $inventoryErrorPopupItem["Icon"]='<image mediaid="{A484212A-377A-4DC9-8754-BABFE7701E3D}" />';
        $inventoryErrorPopupItem["CTA"]="Close";
        
        $inventoryErrorPopupItem.Editing.EndEdit() | Out-Null;
    }
    
    #Add layout controls to page
    $attentionPopupRenderPath = "/sitecore/layout/Renderings/Feature/Destinations/Popups/Attention Popup";
    $attentionPopupRenderItem = Get-Item -Path $attentionPopupRenderPath;
    
    if ($attentionPopupRenderItem -ne $null) {
        Add-Or-Update-Page-Rendering -page $myBookingPageItem -renderingPath $attentionPopupRenderPath  -renderingPlaceholder "/body/attention-popup-{5500AC44-5DF4-4473-8E8C-EA635A187882}-0" -dataSourcePath $inventoryErrorPopupItemPath;
        
        Write-Host $myBookingPageItem.Name "Updated";
    }
    
    
    
    
    
    
    
