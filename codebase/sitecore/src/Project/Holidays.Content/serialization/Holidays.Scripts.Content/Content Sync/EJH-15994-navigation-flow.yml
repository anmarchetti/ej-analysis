    function Get-Or-Create-Item($path, $template){
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if($item -eq $null){
            $item = New-Item -Path $path -ItemType $template
    	
            Write-Host "labels created";
        }
        return $item
    }
    $item = Get-Or-Create-Item -path "/sitecore/content/EasyJet/Holidays/Home/Booking/Page Components/SeatsMap" -template "{54E8234A-234C-4BDC-9EA6-778F7CC75D76}"
    $item.Editing.BeginEdit()
    
    # Outbound text
    $item["OutboundActionTextEmptySelection"] = "{outSeats} of {totalPassengers} outbound seats picked";
    $item["OutboundActionTextPartialSelection"] = "{outSeats} of {totalPassengers} outbound seats picked";
    $item["OutboundActionTextFullSelection"] = "All outbound seats picked!";
    
    # Outbound button text
    $item["OutboundActionBtnTextEmptySelection"] = "Skip outbound flight";
    $item["OutboundActionBtnTextPartialSelection"] = "Continue to return flight";
    $item["OutboundActionBtnTextFullSelection"] = "Continue to return flight";
    
    # Inbound text
    $item["InboundActionTextEmptySelection"] = "{inSeats} of {totalPassengers} return seats picked";
    $item["InboundActionTextPartialSelection"] = "{inSeats} of {totalPassengers} return seats picked";
    $item["InboundActionTextFullSelection"] = "All return seats picked!";
    
    # Inbound button text
    $item["InboundActionBtnTextEmptySelection"] = "Skip return flight";
    $item["InboundActionBtnTextPartialSelection"] = "Confirm seats";
    $item["InboundActionBtnTextFullSelection"] = "Confirm seats";
    
    $item.Editing.EndEdit() | Out-Null;
    	
    Write-Host "labels values have been set";
