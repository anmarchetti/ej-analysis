Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SELF-363 Trade Contradictory SSR"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
        function Get-Or-Create-Item ($path,$templateId) {
        	$item = Get-Item -Database "master" -Path $path -ErrorAction SilentlyContinue
        	if ($item -eq $null) {
        		$item = New-Item -Path $path -ItemType $templateId
        		Write-Host $item.Name "successfully created";
        	}
        	return $item
        }
        
        $contradictoryGroups = @(
        	@{
        		Name = "Floor type"
        		Options = "{9399E29F-E987-4629-BCDE-C04FFEE8F8AD}|{5407161A-71D6-44FE-8133-A88DA0715CE4}|{A33F62BF-63F8-4310-9995-DACF270FBB53}"
        	}
        	@{
        		Name = "Bed type"
        		Options = "{28703AC5-9078-49B1-92FA-136BDED0D279}|{AFF38D29-6AB1-4DB2-A96F-1374ED706CD1}"
        	}
        )
        
        $specialRequests = Get-Item -Path "master:/sitecore/content/EasyJet/TradePortal/Data/Special Requests" -ErrorAction SilentlyContinue
        
        if ($specialRequests -ne $null) {
        	# Create groups folder
        	$folder = Get-Or-Create-Item -Path "$($specialRequests.FullPath)/Contradictory Requests Groups" -TemplateId "{83B89909-0E5D-452A-AE3B-AC5C7B6823BB}"
        	$groupIds = @()
        
        	# Create groups
        	foreach ($group in $contradictoryGroups) {
        		$groupItem = Get-Or-Create-Item -Path "$($folder.FullPath)/$($group.Name)" -TemplateId "{0F8839BE-74AF-40BD-B777-0AD6DBB3BBCE}"
        
        		$groupItem.Editing.BeginEdit()
        		$groupItem["Options"] = $group.Options
        		$groupItem.Editing.EndEdit() | Out-Null
        
        		$groupIds += $groupItem.ID
        	}
        
        	# Set Contradictory Special Requests
        	$specialRequests.Editing.BeginEdit()
        	$specialRequests["SpecialRequestsContradictoryGroups"] = [string]::Join("|",$groupIds)
        	$specialRequests["ContradictoryPopupTitle"] = "PLEASE CHOOSE ONE"
        	$specialRequests["ContradictoryPopupDescription"] = "You have selected special requests that contradict each other. Please confirm that you would like to swap to the new selection."
        	$specialRequests["ContradictoryOriginalSelectionTitle"] = "Original selection"
        	$specialRequests["ContradictoryNewSelectionTitle"] =  "You’re new selection"
            $specialRequests["AddRequestTitle"] = "SPECIAL REQUESTS"
            $specialRequests["AddRequestDescription"] = "Are you going on holiday for a special occasion and would like to let the hotel know, or simply have a  preferences on things like bed type, then make your requests with the hotel now."
            $specialRequests["AmendRequestIcon"] = "<image mediaid='{C0D4A8E6-BA76-4D93-BF0A-7D850F10D974}' />"
            $specialRequests["InfoDescriptionViewBooking"] = "If you’ve booked a holiday, need special assistance, or you need to make changes to your holiday and have already requested assistance, please contact us."
            $specialRequests["AddRequestsCTA"] = "Add special requests"
            $specialRequests["EditRequestsCTA"] = "Edit special requests"
        	$specialRequests.Editing.EndEdit() | Out-Null
        	Write-Host "Special Requests updated"
        } 
        
        $specialRequestCOT = Get-Item -Path "master:///sitecore/content/EasyJet/TradePortal/Data/Special Requests/Special Requests - Accommodation/Cot" -ErrorAction SilentlyContinue
    
    if ($specialRequestCOT -ne $null) {
        $specialRequestCOT.Editing.BeginEdit();
    	$specialRequestCOT["AlertTitle"] = "We’ve included a crib"
    	$specialRequestCOT.Editing.EndEdit() | Out-Null
    }
