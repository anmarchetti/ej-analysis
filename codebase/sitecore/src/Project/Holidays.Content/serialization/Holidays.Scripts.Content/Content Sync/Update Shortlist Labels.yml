    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Shortlist/Errors/Pick New Dates"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "Please pick new dates"
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
    
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Dictionary/Shortlist/Errors/Holiday Expired"
    $item = Get-Item -path $itemPath -ErrorAction SilentlyContinue
    
    if ($item -ne $null) {
            $item.Editing.BeginEdit()
            $item["Phrase"] = "This holiday has expired"
            $item.Editing.EndEdit() | Out-Null
        
        Write-Host "Item" $item.Name "successfully updated"
    }
