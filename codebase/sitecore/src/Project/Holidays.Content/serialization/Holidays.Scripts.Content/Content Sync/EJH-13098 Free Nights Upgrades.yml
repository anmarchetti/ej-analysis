SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Create-Settings () {
    	$itemTemplateId = '{6e9cbf06-c5b6-4af5-8028-49d7b27ba176}';
    	$itemPath = "/sitecore/content/EasyJet/Holidays/Settings/Free Upgrades Settings"
    
    	$item = Get-Item -Path $itemPath -ErrorAction SilentlyContinue;
    
    	if ($item -eq $null) {
    		$item = New-Item -Path $itemPath -ItemType $itemTemplateId
    
    		$item.Editing.BeginEdit()
    		$item["IsFreeNightsEnabled"] = "1";
    		$item["FreeNightsIcon"] = '<image mediaid="{CAE7372B-1B62-4A92-9F23-CFC4D9E536AE}" />'
    		$item.Editing.EndEdit() | Out-Null
    
    		Write-Host $item.Name "successfully created"
    	}
    }
    
    Create-Settings
    
    
