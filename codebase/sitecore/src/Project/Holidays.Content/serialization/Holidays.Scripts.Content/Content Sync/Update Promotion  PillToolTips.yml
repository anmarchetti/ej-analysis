    function Get-Dictionary($items)
    {
        $dictionary = New-Object "System.Collections.Generic.Dictionary``2[System.String,Item]"
        foreach ($item in $items)
        {
            $dictionary.Add($item.Name, $item)
        }
        return $dictionary
    }
    
    function To-New-Key($sourceItems,$targetItems)
    {
        if($sourceItems -ne $null -AND $targetItems -ne $null)
        {
            $targetItems.GetEnumerator() | ForEach-Object{
                $newkey = $sourceItems[$_.key].Fields["Key"].value
                $_.value.Editing.BeginEdit()
                $_.value.Fields["Key"].value = $newkey
                $_.value.Editing.EndEdit() > $null
            }
        }
    }
    
    $sourceToolTipsItems = Get-Dictionary -Items $branchToolTips.Children
    $targetToolTipsItems = Get-Dictionary -Items $contentToolTips.Children
    
    $sourceBookingPaymentItems = Get-Dictionary -Items $branchBookingPayment.Children
    $targetBookingPaymentItems = Get-Dictionary -Items $contentBookingPayment.Children
    
    $sourceCancelledBookingMessagesItems = Get-Dictionary -Items $branchCancelledBookingMessages.Children
    $targetCancelledBookingMessagesItems = Get-Dictionary -Items $contentCancelledBookingMessages.Children
    
    $sourceLoginErrorMessagesItems = Get-Dictionary -Items $branchLoginErrorMessages.Children
    $targetLoginErrorMessagesItems = Get-Dictionary -Items $contentLoginErrorMessages.Children
    
    $sourceSearchPodFiltersLabelsItems = Get-Dictionary -Items $branchSearchPodFiltersLabels.Children
    $targetSearchPodFiltersLabelsItems = Get-Dictionary -Items $contentSearchPodFiltersLabels.Children
    
    $sourcePriceGraphLabelsItems = Get-Dictionary -Items $branchPriceGraphLabels.Children
    $targetPriceGraphLabelsItems = Get-Dictionary -Items $contentPriceGraphLabels.Children
    
    To-New-Key -SourceItems $sourceToolTipsItems -TargetItems $targetToolTipsItems
    To-New-Key -SourceItems $sourceBookingPaymentItems -TargetItems $targetBookingPaymentItems
    To-New-Key -SourceItems $sourceCancelledBookingMessagesItems -TargetItems $targetCancelledBookingMessagesItems
    
    To-New-Key -SourceItems $sourceLoginErrorMessagesItems -TargetItems $targetLoginErrorMessagesItems
    To-New-Key -SourceItems $sourceSearchPodFiltersLabelsItems -TargetItems $targetSearchPodFiltersLabelsItems
    To-New-Key -SourceItems $sourcePriceGraphLabelsItems -TargetItems $targetPriceGraphLabelsItems
