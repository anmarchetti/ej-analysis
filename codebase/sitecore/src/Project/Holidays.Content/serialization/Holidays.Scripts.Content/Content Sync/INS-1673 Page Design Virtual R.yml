Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/INS-1673 Page Design Virtual Resort"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $paths = @(
        "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/Default Design",
        "/sitecore/content/EasyJet/TradePortal/Presentation/Page Designs/Default Design",
        "/sitecore/content/EasyJet/Holidays/Presentation/Page Designs/EU - Default design"
    )
    
    $fieldName = "PageTemplates"
    $valueToAppend = "{31FC60A9-A529-4081-BB33-7B1751F0BDAD}"
    $languages = @('en', 'fr-CH', 'fr-FR', 'de-CH', 'de-DE')
    
    foreach ($path in $paths) {
        $baseItem = Get-Item "master:$path"
        if (-not $baseItem) { continue }
    
        foreach ($language in $languages) {
            $itemInLanguage = Get-Item "master:$path" -Language $language
            if (-not $itemInLanguage -or $itemInLanguage.Versions.Count -eq 0) { continue }
    
            $current = [string]$itemInLanguage[$fieldName]
            if ($current -like "*$valueToAppend*") { continue }
    
            $newValue = if ([string]::IsNullOrEmpty($current)) {
                $valueToAppend
            } else {
                "$current|$valueToAppend"
            }
    
            $itemInLanguage.Editing.BeginEdit()
            try {
                $itemInLanguage[$fieldName] = $newValue
                $itemInLanguage.Editing.EndEdit()
                Write-Host "Updated: $path [$language]"
            }
            catch {
                $itemInLanguage.Editing.CancelEdit()
                Write-Host "Failed: $path [$language] - $($_.Exception.Message)"
            }
        }
    }
