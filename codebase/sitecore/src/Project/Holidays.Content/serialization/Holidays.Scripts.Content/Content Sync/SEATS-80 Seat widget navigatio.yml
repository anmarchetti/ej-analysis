SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $seatMapDatasourcePath = "/sitecore/content/EasyJet/Holidays/Data/SeatsMap"
    $seatMapDatasource = Get-Item -Path $seatMapDatasourcePath -ErrorAction SilentlyContinue
        
    $seatMapDatasource.Editing.BeginEdit()
    
    $seatMapDatasource["SelectionActionText"] = "{selectedSeatsCount} of {seatsCount} {flightDirection} seats picked";
    $seatMapDatasource["FullSelectionActionText"] = "All {flightDirection} seats picked!";
    $seatMapDatasource["PreselectedSeatsFullSelectionActionText"] = "All {flightDirection} seats picked! Prices will be updated at checkout.";
    
    $seatMapDatasource["EmptySelectionBtnText"] = "Skip {flightDirection} flight";
    $seatMapDatasource["ContinueToReturnBtnText"] = "Continue to return flight";
    $seatMapDatasource["ConfirmSeatsBtnText"] = "Confirm seats";
    
    $seatMapDatasource.Editing.EndEdit() | Out-Null;
    	
    Write-Host "labels values have been set";
