  Hint: Script
  Value: |
    #Create setting
    $itemPath = "master:/sitecore/content/EasyJet/Holidays/Settings/";
    $itemTemplateId = '{05403E2A-A7D8-4FF8-B607-D2BD07A4ADEB}';
    
    $item = Get-Item -path $itemPath 
    if ($item -ne $null) {
        #create item
        $item = New-Item -Path $itemPath -ItemType $itemTemplateId -Name "Image Carousel Settings"
        Write-Host "Item" $item.Name "successfully created"
        
        $item.Editing.BeginEdit()
        $item["IsFullScreenCarouselEnabledHotelDetailsDesktop"] = "1";
        $item["IsFullScreenCarouselEnabledHotelDetailsMobile"] = "1";
    
        $item.Editing.EndEdit() | Out-Null
    }
    
