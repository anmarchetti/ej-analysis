Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync/SER-1091 Remove CheckIn rendering"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
        $preTravelPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/pre-travel"
        $inDestPagePath = "/sitecore/content/EasyJet/Holidays/Home/Booking/My_Bookings/in-destination"
        $checkInRenderingId = "{73898448-EA74-47B0-9286-98642CB5A8AF}"
    
               function Remove-Check-In-Renderings($pagePath) {
    
                    $page = Get-Item -Path $pagePath
                
                    $renderings = Get-Rendering -Item $page | Where-Object { $_.ItemId -eq $checkInRenderingId }
                    foreach ($rendering in $renderings) {
                        Remove-Rendering -Item $page -Instance $rendering
                        Remove-Rendering -Item $page -Instance $rendering -FinalLayout
                    }
                
                    Write-Host "Removed Check-In renderings from Shared and Final layout"
                }
    
    
    
                Remove-Check-In-Renderings -PagePath $preTravelPagePath
                Remove-Check-In-Renderings -PagePath $inDestPagePath
    
    
