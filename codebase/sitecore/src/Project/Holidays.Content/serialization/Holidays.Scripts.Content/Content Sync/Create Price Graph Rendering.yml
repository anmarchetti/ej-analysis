Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Create Price Graph Rendering
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    function Get-Or-Create-Item($path, $templateId) {
        $item = Get-Item -Path $path -ErrorAction SilentlyContinue
        if (-Not $item) {
            $item = New-Item -Path $path -ItemType $templateId
            Write-Host "Item" $item.Name "successfully created"
        }
        return $item
    }
    
    # Add Content
    $content = Get-Or-Create-Item -path "master:/content/EasyJet/Holidays/Data/Compare Price Module" -templateId "{112403DD-191A-41BD-9582-61C9BFFB7107}"
              
    if ($content -ne $null) {
        $content.Editing.BeginEdit()
        $content["IsBestValueEnabled"] = '1';
        $content["Variant"] = 'Calendar First Variant'
        $content.Editing.EndEdit() | Out-Null
    }
    
    #Add rendering
    $renderings = Get-Rendering -Path '/sitecore/content/EasyJet/Holidays/Home/Hotel Details';
    
    $renderings| ForEach-Object {
        if ($_.ItemID -eq '{B37F9DEA-D7C1-4D09-9344-D2FFE1A590AF}') {
            $alternativeFlights = $_;
        }
    }
    
    $hotelDetailsPage= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Hotel Details" -ErrorAction SilentlyContinue
    $modulePlaceholder=  $alternativeFlights.Placeholder + '/price-graph-'+ $alternativeFlights.UniqueId +'-0'
    $moduleRenderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Compare Price Module"
    $moduleItem = Get-Item -Database "master" -Path $moduleRenderingPath | New-Rendering -Placeholder $modulePlaceholder
    Add-Rendering -Item $hotelDetailsPage -PlaceHolder $modulePlaceholder -Instance $moduleItem  -Index '19' -DataSource $content.Id
    
    #Add rendering
    $renderings = Get-Rendering -Path '/sitecore/content/EasyJet/Holidays/Home/Booking';
    
    $renderings| ForEach-Object {
        if ($_.ItemID -eq '{B37F9DEA-D7C1-4D09-9344-D2FFE1A590AF}') {
            $alternativeFlights = $_;
        }
    }
    
    $bookingPage= Get-Item -Path "/sitecore/content/EasyJet/Holidays/Home/Booking" -ErrorAction SilentlyContinue
    $modulePlaceholder=  $alternativeFlights.Placeholder + '/price-graph-'+ $alternativeFlights.UniqueId +'-0'
    $moduleRenderingPath = "/sitecore/layout/Renderings/Feature/PageContent/Compare Price Module"
    $moduleItem = Get-Item -Database "master" -Path $moduleRenderingPath | New-Rendering -Placeholder $modulePlaceholder
    Add-Rendering -Item $bookingPage -PlaceHolder $modulePlaceholder -Instance $moduleItem  -Index '6' -DataSource $content.Id
