    <p>Wenn Sie eine Änderung an Ihrem Urlaub vornehmen möchten, aber die Option auf dieser Seite nicht sehen, ist unser engagiertes Luxus-Support-Team für Sie da. Bitte kontaktieren Sie uns unter der unten angegebenen Nummer und einer unserer Spezialisten wird Ihnen bei Ihrer Anfrage behilflich sein.</p><p><a href="tel:+03309126594">+03309126594</a></p><p>Bitte halten Sie Ihre siebenstellige easyJet holidays Buchungsnummer bereit. Bitte erkundigen Sie sich bei Ihrem Netzbetreiber nach den Gesprächsgebühren während Ihrer Abwesenheit.</p>
    "@
    $popup_description_fr = @"
