    $popup_description_en = @"
    <p>If you'd like to make a change to your holiday but don't see the option on this page, our dedicated luxury support team is here to help. Please contact us using the number below, and one of our specialists will assist you with your request.</p><p><a href="tel:+03309126594">+03309126594</a></p><p>Please have your seven digit easyJet holidays booking reference ready. Make sure you check with your network provider for call charges while you're away.</p>
    "@
