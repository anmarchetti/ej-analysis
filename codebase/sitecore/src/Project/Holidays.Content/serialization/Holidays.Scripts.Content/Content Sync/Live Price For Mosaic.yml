Path: /sitecore/system/Modules/PowerShell/Script Library/Content Sync/Live Price For Mosaic
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Update Mosaic promo blocks params
    $homePage = Get-Item -Path '/sitecore/content/EasyJet/Holidays/Home';
    $renderings = Get-Rendering -Path '/sitecore/content/EasyJet/Holidays/Home';
    
    $renderings| ForEach-Object {
        $params = [Sitecore.Web.WebUtil]::ParseQueryString($_[0].Parameters)
        
    	if ($params["Theme"] -eq "Mosaic%20Variant") {
            $mosaicRendering = $_;
    	}
    }
    
    Set-Rendering -Item $homePage -Instance $mosaicRendering -Parameter @{ 
        "IsLivePriceEnabled" = "1";
    } 
    
    
    
    
    
    
    
    
    
