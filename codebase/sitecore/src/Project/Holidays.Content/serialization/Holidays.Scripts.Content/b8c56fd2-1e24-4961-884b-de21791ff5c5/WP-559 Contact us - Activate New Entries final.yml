    function Add-ToSitecoreMultilist {
        param(
            [Parameter(Mandatory=$true)]
            [string]$path,
            [Parameter(Mandatory=$true)]
            [string]$language,
        
            [Parameter(Mandatory=$true)]
            [string]$fieldName,
            [Parameter(Mandatory=$true)]
            [string[]]$idsToAdd
        )
     $item = Get-Item -Path $path -Language $language
    
        $item.Editing.BeginEdit()
        try {
            $existingIds=$item[$fieldName]
            $currentIds =  $existingIds -split '\|'
            foreach ($idToAdd in $idsToAdd) {
                if ($currentIds -notcontains $idToAdd) {
                    $currentIds += $idToAdd
                    Write-Host "ID added: $idToAdd"
                }
            }
    
            $item[$fieldName] = $currentIds -join "|"
            $item.Editing.EndEdit()
        } catch {
            $item.Editing.CancelEdit()
            Write-Host "Error adding IDs"
        }
    }
    
    
