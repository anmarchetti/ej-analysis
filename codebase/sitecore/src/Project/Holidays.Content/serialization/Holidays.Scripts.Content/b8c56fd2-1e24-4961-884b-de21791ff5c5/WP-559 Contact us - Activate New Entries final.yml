    $parentItem = Get-Item -Path "master:$parentItemPath"
    
    $formItem = Get-Item -Path "master:$formItemPath"
    
    
    $selectedIDs = @()
    
    $data.ContactUs.CaseTypes.GetEnumerator() | ForEach-Object {
        $itemName = $_.Key
        
        $caseTypeDetails = $_.Value
        $alternativeItemName = $caseTypeDetails.Questions[0].Text
        $IsPastHoliday = $caseTypeDetails.IsPastHoliday
        $SendTo = $caseTypeDetails.SendTo
        $SalesforceCategory = $caseTypeDetails.SalesforceCategory
        
        if(!($caseTypeItem = Get-Item -Path "master:$parentItemPath/$alternativeItemName" -ErrorAction SilentlyContinue)){
            if (!($caseTypeItem = Get-Item -Path "master:$parentItemPath/$itemName" -ErrorAction SilentlyContinue)) {
                $caseTypeItem = New-Item -Parent $parentItem -Name $itemName -ItemType $templateId
            }
        }
    
        if ($selectedIDs -notcontains $caseTypeItem.ID) {
            $selectedIDs += $caseTypeItem.ID
        }
    
        $caseTypeDetails.Questions | ForEach-Object {
        
            $languageVersion = Get-Item -Path "master:$($caseTypeItem.Paths.Path)" -Language $_.Language
            if (-not $languageVersion) {
                $languageVersion = Add-ItemLanguage -Item $caseTypeItem -Language $caseTypeItem.Language -TargetLanguage $_.Language
                $languageVersion = Get-Item -Path "master:$($caseTypeItem.Paths.Path)" -Language $_.Language
            }
            $languageVersion
            $languageVersion.Editing.BeginEdit()
            $languageVersion["Title"] = $_.Text
            $languageVersion["SendTo"] = $SendTo
            $languageVersion["SalesforceCategory"] = $SalesforceCategory
            $languageVersion["EmailSubject"] = $_.EmailSubject
            if ($IsPastHoliday) {
                $languageVersion["State"] = "Past"
            } else {
                $languageVersion["State"] = "Future"
            }
            $languageVersion.Editing.EndEdit() | Out-Null
        }
    }
    
    foreach($language in $formItem.Languages) {
    
        $langItem = Get-Item -Path "master:$formItemPath" -Language $language.Name
    
    
        if($langItem.Versions.Count -gt 0) {
            Write-Host "Adjust QuestionList for $($language.Name)."
            Add-ToSitecoreMultilist -path "master:$formItemPath" -Language $language.Name -fieldName "QuestionList" -idsToAdd $selectedIDs
            
            
        }
    }
    
    
