Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Content Sync - User Management/Recurrence/Publish All Items"
DB: master
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    $database = Get-Database -Name "master"
    
    $appName = "UserManagement";
    
    $paths = @(
        "/sitecore/content/EasyJet/$appName",
        "/sitecore/templates/Project/MicroApps/$appName",
        "/sitecore/layout/Layouts/Project/MicroApps/$appName",
        "/sitecore/layout/Renderings/Project/MicroApps/$appName",
        "/sitecore/layout/Placeholder Settings/Project/MicroApps/$appName",
        "/sitecore/system/Settings/Project/MicroApps/$appName",
        "/sitecore/media library/Project/MicroApps/$appName"
    );
    
    $targets = @()
    foreach ($publishingTarget in [Sitecore.Publishing.PublishManager]::GetPublishingTargets($database)) {
        $targets += Get-Database -Name $publishingTarget[[Sitecore.FieldIDs]::PublishingTargetDatabase]
    }
    
    $languages = [Sitecore.Data.Managers.LanguageManager]::GetLanguages($database)
    
    # Item publish with children
    $paths | ForEach-Object {
        $item = Get-Item -Path "master:$_"
        [Sitecore.Publishing.PublishManager]::PublishItem($item, $targets, $languages, $true, $true, $true)
    }
    
    
