    - ID: "25f2b050-7347-4a39-a348-af8c34b8dd59"
      Hint: TermsAndConditionsContent
      Value: |
        <p>
        <span style="text-decoration: underline;">
        <strong>
        Promo codes
        </strong>
        </span>
        </p>
        <p>
        <strong>
        Save up to &pound;200 per booking with code TRADESAVER
        </strong>, save &pound;100 min spend &pound;800 or save &pound;200 min spend &pound;2000. Spend/saving amount is per booking based on the total holiday price and the code must be applied on the 'extras' page of easyJet.com/holidays/trade-portal. Promo code valid for new bookings made between 8am on 8/3/24 and 11pm 21/3/24 for holidays taking place between 1/11/24 and 31/10/25. Offer applies to all easyJet holidays to beach destinations, subject to availability.  Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. Discount is transferable to an amended booking only, subject to the amended booking meeting these promo code terms. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking conditions</a> apply.
        </p>
        <p>
        <strong>
        Save &pound;100 per booking with code LIVERPOOL
        </strong>, min spend &pound;1000.  Spend/saving amount is per booking based on the total holiday price and the code must be applied on the 'extras' page of easyJet.com/holidays/trade-portal. Promo code valid for new bookings made between 8am on 15/3/24 and 11pm 1/4/24 for holidays completed by 31/10/25. Offer applies to all easyJet holidays from Liverpool airport, subject to availability.  Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. Discount is transferable to an amended booking only, subject to the amended booking meeting these promo code terms. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking conditions</a> apply.
        </p>
        <p>
        <strong>
        Save &pound;100 per booking with code BIRMINGHAM
        </strong>, min spend &pound;1000.  Spend/saving amount is per booking based on the total holiday price and the code must be applied on the 'extras' page of easyJet.com/holidays/trade-portal. Promo code valid for new bookings made between 8am on 15/3/24 and 11pm 1/4/24 for holidays completed by 31/10/25. Offer applies to all easyJet holidays from Birmingham airport, subject to availability.  Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. Discount is transferable to an amended booking only, subject to the amended booking meeting these promo code terms. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking conditions</a> apply.
        </p>
        <p>
        <strong>
        Extra saving on holidays with only one adult travelling - Use code ONEADULT
        </strong> - &pound;50 discount for the adult, plus &pound;25 off each child, minimum spend &pound;800, children must be aged 12 or under. Save up to &pound;100 is based on 1 adult and 2 children travelling on the same booking. Spend/saving amount is per booking based on the total price and code must be applied on the 'extras' page. Promo code valid for new bookings made before 30/09/2024 for holidays taking place between 02/02/2022 and completed by 31/10/2025. Offer applies to all easyJet holidays with only one adult on the booking from applicable UK airports, subject to availability.
        </p>
        <p>
        <span style="text-decoration: underline;">
        <strong>
        Other offer conditions
        </strong>
        </span>
        </p>
        <p>
        <strong>
        Refund guarantee
        </strong> - We know things can change, or customers might simply change their mind. We'll do all we can to support you and your customers in this scenario, which might<br />
        include free amendments. And if we need to cancel your holiday, we'll offer a full refund to customers.
        </p>
        <p>
        <strong>
        Freedom to change
        </strong> - Change your customers' holiday with ease, by calling us on 0330 551 5175. You can change the holiday destination, departure dates, customer names and more for a flat &pound;25 fee* per booking. Changes can be made right up until 28 days before departure. *if the final value of the holiday goes up, the &pound;25 admin fee does not apply.
        </p>
        <p>
        <strong>
        Best Price Guarantee
        </strong> - We're so confident in our great value holidays, we guarantee to beat the price if you find the same holiday cheaper from another tour operator, bookable through your retail store, within 24hrs of booking after making an easyJet holidays booking. Once confirmed we'll apply a discount to the price of your easyJet holidays booking of the difference (plus an extra &pound;5pp) - meaning you can book with confidence and never lose out. If you think you have a booking that meets this criteria and our terms and conditions, including all the extras that you get with your easyJet holiday such as 23kg luggage, then let us know here and we'll be in touch. Where we agree with your claim, we'll process the credit for you within 14 days.
        </p>
        <p>
        <strong>
        More time to decide
        </strong> - Want flexibility? You've got it. We have reduced final balance payment terms with your consortia. The final balance is now due 35 days* before departure, giving your customers flexibility if plans change. (Final balance date reduced from 70 to 35 days*). *payment terms may vary by consortia / agency head office.
        </p>
        <p>
        <strong>
        Low deposits
        </strong> - Plan ahead with confidence. We offer a low deposit of &pound;60 per person giving your customers the freedom and flexibility to book a holiday without a big financial commitment.
        </p>
        <p>
        <span style="text-decoration: underline;">
        <strong>
        Promotional offers
        </strong>
        </span>
        </p>
        <p>
        <strong>
        Free Child Places
        </strong> - One free child place for every two full paying adults sharing accommodation is available on selected holidays, where you see the 'Free child place' label, subject to availability. Maximum one free child per room. When free child places sell out, the current child price will apply. Sometimes restrictions apply to some rooms. Supplements still apply for optional extras added to the holiday. A deposit is payable for the free child place at the time of booking - this will be deducted from the final holiday balance. The child age limit can vary by hotel. Offer can be changed/withdrawn without notice.
        </p>
        <p>
        <strong>
        Free Night Included
        </strong> - available on selected holidays where you see this message near the price. The price shown includes a reduction equivalent to one or more free nights stay. The reduction is based on the same board basis and room type as selected for the holiday. These offers are subject to change and available for a limited time. Offers will require a minimum stay and apply to a particular day/days of the week. Changing travel dates may invalidate the offer and/or result in a holiday price change (e.g. if the flight cost is higher/lower). Offer may be changed/withdrawn without notice. Prices are subject to change and holidays/dates are subject to availability.
        </p>
        <p>
        <strong>
        Group holidays - &pound;25 off per person
        </strong> - &pound;25 off per person for groups of over 10 passengers on one booking, minimum spend &pound;2,000 per booking based on the total price . Promotion valid for new bookings made before 30/9/24 for holidays taking place between 01/01/2022 and completed by 31/10/2025. Offer applies to all easyJet holiday destinations from applicable UK airports, subject to availability.  Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. Discount cannot be used in conjunction with Free Child Places. If a booking including this discount is changed/cancelled, the discount will no longer be valid on the new/amended booking. Offer only available by phone. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking conditions</a> apply.
        </p>
        <p>
        <span style="text-decoration: underline;">
        <strong>
        Conditions applying to all promo codes:
        </strong>
        </span>
        </p>
        <p>
        Code must be applied on the 'extras' page of this website. Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. Discount is transferable to an amended booking only, subject to the amended booking meeting these promo code terms. Booking conditions apply. We occasionally make available promotional codes for use on our website (and/or through our call centre). Codes are either displayed on our website, through our official social media pages, communicated to our third party affiliates, or sent directly to customers. Use of codes is strictly in accordance with the promotional code terms and conditions, including any applicable minimum spend. Promo codes sent directly to individual customers are intended solely for that customers use - sharing of promo codes by any means is not permitted and will invalidate the promo code. Any booking discount received following improper use or use of a non-valid promo code will be removed and the discounted amount will be payable in full, otherwise the booking will be cancelled (and cancellation charges applied).
        </p>
        <p>
        <span style="text-decoration: underline;">
        <strong>
        General information
        </strong>
        </span>
        </p>
        <p>Transfers included: Applies to beach &amp; lake holidays only. Check holiday description for details. Transfers are shared with other customers.<br />
        23kg luggage allowance: 23kg pp for adults and children (excluding infants). UK departures only.<br />
        easyJet holidays Ltd (ABTA Y6633) is ATOL protected (11694). Standard <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">booking conditions</a> apply.</p>
