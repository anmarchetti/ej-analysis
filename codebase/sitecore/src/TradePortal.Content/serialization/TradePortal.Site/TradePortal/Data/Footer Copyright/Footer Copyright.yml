    - ID: "f5874ba0-da30-48c4-9ea4-1f44fb9491dc"
      Hint: Description
      Value: |
        <p><span><strong><strong><strong><span>Save up to &pound;200 off per booking on Summer 2022 holidays to Spain<em> </em></span></strong><span><em></em></span></strong><span></span></strong><strong>-</strong><strong><span></span><span></span><span></span></strong>Applies to beach holidays for travel from all UK airports to Spain, valid for new bookings made from 09.00 Wednesday 2/2/22 to 23.00 hours on Tuesday 8/2/22 (inclusive) for holidays taking place between 1st March and 31 October 2022 (inclusive). &pound;200 saving is based on 2 adults and 2 children sharing one room.&nbsp; Offer based on &pound;50 discount per person, this discount is already included in the prices shown. Prices subject to change at any time. Holidays subject to availability. Offer for a limited time only and may be changed/withdrawn without notice. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking Conditions</a>&nbsp;apply.</span></p>
        <p><span><strong>Extra savings on last minute beach holidays -&nbsp;</strong>We have reduced the price of flights included in our package holidays, compared to the flight prices before this promotional period. It applies to a limited number of seats per flight. Our holiday package prices are already discounted to include the saving where applicable. Offer applies to bookings made from 15/1/22, travel from applicable UK airports between 15/01/2022 and 31/03/2022 (inclusive). Prices subject to change at any time. Holidays subject to availability. Offer may be changed/withdrawn without notice.&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;</span></p>
        <p><span><strong>Summer 2022 holidays - 7 nights from &pound;219pp</strong> - From prices are based on thousands of selected holidays for 2 adults sharing. Prices apply to 7 nights stay departing between April 2022 and October 2022 from various UK departure airports with easyJet. Prices are subject to change. Holidays subject to availability and <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;</span></p>
        <p><span><strong>City breaks - 3 nights from &pound;149pp</strong>&nbsp;- From prices are based on thousands of selected holidays for 2 adults sharing. Prices apply to 3 nights stay departing between February&nbsp;2022 and October 2022 from various UK departure airports with easyJet. Prices are subject to change. Holidays subject to availability and&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;</span></p>
        <p>Protection Promise:<strong> Refund guarantee</strong> - Free cancellations with a full refund if you change your mind up to 28 days before departure. This includes a refund of your deposit by way of credit to your online easyJet holidays account. <strong>Best price guarantee</strong> - If within 24 hours of booking with us, you find the same holiday cheaper from another ATOL protected holiday company that&rsquo;s a member of ABTA, we&rsquo;ll credit the difference in price, plus an additional &pound;5 per adult/booking, to your online easyJet holidays account. Subject to&nbsp;the&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/price-guarantee-terms" target="_blank">Best Price Guarantee Terms &amp; Conditions</a>. <strong>Freedom to change</strong> - Free online changes up to 28 days before departure (where possible), or just &pound;25 per booking amendment fee if you call our Customer Service team. Changes are subject to paying any difference in holiday cost. <strong>Take your time</strong> - Payment in instalments with your final balance only due 28 days before your holiday. These T&amp;C&rsquo;s are supplementary to our&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking Conditions</a>.&nbsp;Where easyJet holidays online credit applies, that will be subject to our&nbsp;<a href="~/link.aspx?_id=057B8331443B4FA1B86BBA5BD609FAC9&amp;_z=z">Credit Terms &amp; Conditions</a>.&nbsp;</p>
        <p><strong>Extra saving on holidays with only one adult travelling - Use code ONEADULT</strong> - &pound;50 discount for the adult, plus &pound;25 off each child, minimum spend &pound;800. Save up to &pound;100 is based on on 1 adult and 2 children travelling on the same booking. Spend/saving amount is per booking based on the total price and code must be applied on the &lsquo;extras&rsquo; page. Promo code valid for new bookings made between 09.00 Tuesday 02/02/2022 and 22.00 on Tuesday 31/03/2022 (inclusive) for holidays taking place between 02/02/2022 and completed by 31/03/2023. Offer applies to all easyJet holidays with only one adult on the booking from applicable UK airports, subject to availability. Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. If a booking including this discount is changed/cancelled, the discount will no longer be valid on the new/amended booking. Offer not available by phone. <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking Conditions</a>&nbsp;apply.&nbsp;</p>
        <p><strong>Free Child Places -</strong>&nbsp;One free child place for every two full paying adults sharing accommodation is available on selected holidays departing between 01/04/2022-31/10/2022 and 01/04/2023-31/10/2023, where you see the &lsquo;Free child place&rsquo; label, subject to availability. Maximum one free child per room. When free child places sell out, the current child price will apply. Sometimes restrictions apply to some rooms. Supplements still apply for optional extras added to the holiday. A deposit is payable for the free child place at the time of booking - this will be deducted from the final holiday balance. The child age limit can vary by hotel. Offer can be changed/withdrawn without notice.</p>
        <p><strong>Free Night Included</strong>&nbsp;- available on selected holidays where you see this message near the price. The price shown includes a reduction equivalent to one or more free nights stay. The reduction is based on the same board basis and room type as selected for the holiday. These offers are subject to change and available for a limited time. Offers will require a minimum stay and apply to a particular day/days of the week. Changing travel dates may invalidate the offer and/or result in a holiday price change (e.g. if the flight cost is higher/lower). Offer may be changed/withdrawn without notice. Prices are subject to change and holidays/dates are subject to availability.</p>
        <p><strong>Group holidays - &pound;25 off per person&nbsp;</strong>-&nbsp;&pound;25 off per person for groups of over 10 passengers on one booking, minimum spend &pound;2,000 per booking based on the total price . Promotion valid for new bookings made from 01/12/2021 for holidays taking place between 01/01/2022 and completed by 31/10/2023. Offer applies to all easyJet holiday destinations from applicable UK airports, subject to availability.&nbsp; Prices are subject to change. Offer may be changed or withdrawn without notice. Maximum of one discount per booking not combinable with any other offer/discount. If a booking including this discount is changed/cancelled, the discount will no longer be valid on the new/amended booking. Offer only available by phone.&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking Conditions</a>&nbsp;apply.</p>
        <p>From pricing displayed across the website: Prices&nbsp;are based on 2 adults sharing a standard room type, usually on a room only basis. Prices are based on a 3 night stay (city breaks) on selected dates between Mar 2022 - Oct 2022, a 7 night stay (beach holiday destination) on selected dates between Mar 2022 - Oct 2022, or a 7 night stay (lake holiday destination) on selected dates between Mar 2022 - Oct 2022. Prices are from various UK departure airports with easyJet, including 23kgs luggage. Beach &amp; lake holidays also include transfers. All holidays are subject to availability.&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z" target="_blank">Booking Conditions</a>&nbsp;apply.&nbsp;Prices are subject to change.</p>
        <p>We occasionally make available promotional codes for use on our website (and through our call centre). Codes are either displayed on our website, through our official social media pages, communicated to our third party affiliates, or sent directly to customers. Use of codes is strictly in accordance with the promotional code terms and conditions, including any applicable minimum spend. Promo codes sent directly to individual customers are intended solely for that customers use - sharing of promo codes by any means is not permitted and will invalidate the promo code. Any booking discount received following improper use or use of a non-valid promo code will be removed and the discounted amount will be payable in full, otherwise the booking will be cancelled (and cancellation charges applied).<br />
        &nbsp;<br />
        Transfers included: Applies to beach &amp; lake holidays only. Check holiday description for details. Transfers are shared with other customers.&nbsp;&nbsp;<br />
        <br />
        23kg luggage allowance: 23kg pp for adults and children (excluding infants). UK departures only.&nbsp;<br />
        <br />
        easyJet holidays Ltd (ABTA Y6633) is ATOL protected (11694).</p>
