        <p><span><strong>Family Holidays next summer - Extra &pound;50 off child prices:</strong> Applies to selected holidays (beach destinations only) for travel from applicable UK airports departing between 1/4/22 and 31/10/22 (inclusive). Offer based on &pound;50 discount per child, for up to 2 children sharing one room.&nbsp; Prices subject to change at any time.&nbsp; Our package prices are already discounted to include the saving where applicable. Holidays subject to availability. Offer for a limited time only and may be changed/withdrawn without notice. <a href="https://www.easyjet.com/en/holidays/info/booking-conditions">Booking Conditions</a>&nbsp;apply.&nbsp;</span></p>
        <p>From pricing displayed across the website: Prices&nbsp;are based on 2 adults sharing a standard room type, usually on a room only basis.&nbsp; Prices are based on a 3 night stay (city breaks) on selected dates between Sep - Dec 2021, a 7 night stay (beach holiday destination) on selected dates between Sep 2021 - May 2022, or a 7 night stay (lake holiday destination) on selected dates between Sep 2021 - May 2022. Prices are from various UK departure airports with easyJet, including 23kgs luggage.&nbsp; Beach &amp; lake holidays also include transfers. All holidays are subject to availability.&nbsp;<a href="https://www.easyjet.com/en/holidays/info/booking-conditions">Booking Conditions</a>&nbsp;apply. Prices are subject to change.</p>
        <p>Protection Promise:<strong> Refund guarantee</strong> - Free cancellations with a full refund if you change your mind up to 28 days before departure. This includes a refund of your deposit by way of credit to your online easyJet holidays account. <strong>Best price guarantee</strong> - If within 24 hours of booking with us, you find the same holiday cheaper from another ATOL protected holiday company that&rsquo;s a member of ABTA, we&rsquo;ll credit the difference in price, plus an additional &pound;5 per adult/booking, to your online easyJet holidays account. Subject to&nbsp;the&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/price-guarantee-terms" target="_blank">Best Price Guarantee Terms &amp; Conditions</a>. <strong>Freedom to change</strong> - Free online changes up to 28 days before departure (where possible), or just &pound;25 per booking amendment fee if you call our Customer Service team. Changes are subject to paying any difference in holiday cost. <strong>Take your time</strong> - Payment in instalments with your final balance only due 28 days before your holiday. These T&amp;C&rsquo;s are supplementary to our&nbsp;<a href="https://www.easyjet.com/en/holidays/info/booking-conditions">Booking Conditions</a>.&nbsp;Where easyJet holidays online credit applies, that will be subject to our&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Credit Terms &amp; Conditions</a>.&nbsp;</p>
