        <p>From pricing displayed across the website: Prices&nbsp;are based on 2 adults sharing a standard room type, usually on a room only basis.&nbsp; Prices are based on a 3 night stay (city breaks) on selected dates between Nov 2021 - Mar 2022, a 7 night stay (beach holiday destination) on selected dates between Nov 2021 - Jun 2022, or a 7 night stay (lake holiday destination) on selected dates between Mar - Sep 2022. Prices are from various UK departure airports with easyJet, including 23kgs luggage.&nbsp; Beach &amp; lake holidays also include transfers. All holidays are subject to availability.&nbsp;<a href="https://www.easyjet.com/en/holidays/info/booking-conditions">Booking Conditions</a>&nbsp;apply. Prices are subject to change.</p>
