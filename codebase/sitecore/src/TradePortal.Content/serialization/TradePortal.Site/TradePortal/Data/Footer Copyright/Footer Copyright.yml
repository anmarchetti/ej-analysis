        <p>Dive into the Balearics: Check entry requirements for your destination before travelling. See <a href="~/link.aspx?_id=725A5D37ACDD41BB94E7EB828BEA2CC5&amp;_z=z">latest travel information</a>. Holidays subject to availability and <a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;</p>
        <p>Free Child Places: One free child place for every two full paying adults sharing accommodation is available on selected holidays departing between 1/4/22 and 31/10/22, where you see the &lsquo;Free child place&rsquo; label, subject to availability.&nbsp; Maximum one free child per room.&nbsp; When free child places sell out, the current child price will apply.&nbsp; Sometimes restrictions apply to some rooms. Supplements still apply for optional extras added to the holiday.&nbsp; A deposit is payable for the free child place at the time of booking - this will be deducted from the final holiday balance.&nbsp; The child age limit varies by hotel, see the accommodation description for details.&nbsp; Offer ends on 11th July 2021 and can be changed/withdrawn without notice.</p>
        <p>Green List Destinations: Please check entry requirements for your destination before travelling. Destinations may only be open to vaccinated travellers. Green list destinations are reviewed regularly by the government and changes can happen at short notice.&nbsp;Holidays subject to availability and&nbsp;<a href="~/link.aspx?_id=025A25A5147A4240AC4406DA980D41FD&amp;_z=z">Booking Conditions</a>&nbsp;apply.&nbsp;</p>
        <p>From pricing displayed across the website: Prices&nbsp;are based on 2 adults sharing a standard room type, usually on a room only basis.&nbsp; Prices are based on a 3 night stay (city breaks) on selected dates between Sep - Dec 2021, a 7 night stay (beach holiday destination) on selected dates between Sep 2021 - May 2022, or a 7 night stay (lake holiday destination) on selected dates between Sep 2021 - May 2022. Prices are from various UK departure airports with easyJet, including 23kgs luggage.&nbsp; Beach holidays include transfers. All holidays and city breaks are subject to availability.&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/booking-conditions" target="_blank">Booking Conditions</a>&nbsp;apply. Prices are subject to change.</p>
        <p>Protection Promise: Free cancellations with a full refund if you change your mind up to 28 days before departure. This includes a refund of your deposit by way of credit to your online easyJet holidays account. Best Price Guarantee (if within 24 hours of booking with us, you find the same holiday cheaper from another ATOL protected holiday company that&rsquo;s a member of ABTA, we&rsquo;ll credit the difference in price, plus an additional &pound;5 per adult/booking, to your online easyJet holidays account). Free online changes up to 28 days before departure (where possible).&nbsp; Or just &pound;25 per booking amendment fee if you call our Customer Service team. Changes are subject to paying any difference in holiday cost. Payment in instalments with your final balance only due 28 days before your holiday. These T&amp;C&rsquo;s are supplementary to our Booking Conditions. Please refer to our&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/booking-conditions" target="_blank">Booking Conditions</a>&nbsp;and the&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/price-guarantee-terms" target="_blank">Best Price Guarantee Terms &amp; Conditions</a>. Where easyJet holidays online credit applies, that will be subject to our&nbsp;<a rel="noopener noreferrer" rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/Info/Credit-Terms" target="_blank">Credit Terms &amp; Conditions</a>.&nbsp;</p>
        <p>We occasionally make available promotional codes for use on our website (and through our call centre).&nbsp; Codes are either displayed on our website, through our official social media pages, communicated to our third party affiliates, or sent directly to customers. Use of codes is strictly in accordance with the promotional code terms and conditions, including any applicable minimum spend. Promo codes sent directly to individual customers are intended solely for that customers use - sharing of promo codes by any means is not permitted and will invalidate the promo code. Any booking discount received following improper use or use of a non-valid promo code will be removed and the discounted amount will be payable in full, otherwise the booking will be cancelled (and cancellation charges applied).<br />
        &nbsp;<br />
        Transfers included: Applies to beach holidays only. Check holiday description for details. Transfers are shared with other customers.&nbsp;&nbsp;<br />
        <br />
        23kg luggage allowance: 23kg pp for adults and children (excluding infants). UK departures only.&nbsp;<br />
        <br />
        easyJet holidays Ltd (ABTA Y6633) is ATOL protected.</p>
