    - ID: "32a927ee-0909-403e-b8dc-13e05167844f"
      Hint: PopupContent
      Value: |
        <p><span style="background-color: #ffffff; color: #242424;">Special assistance passengers board at the front of the aircraft. If you do decide to choose a specific seat for your comfort we recommend selecting one towards the front of the cabin.</span></p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">Not all seats have a liftable armrest. If you need to be seated in a seat with liftable armrests, please contact our Special Assistance team who will discuss your requirements with you.</p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">&nbsp;</p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">If you require specific special assistance, you must call us prior to booking.</p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">&nbsp;</p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">To make sure your holiday includes everything you need, you can call us on 0330 551 5165</p>
        <p style="color: #242424; background-color: #ffffff; margin: 0px;">&nbsp;</p>
        <p style="color: #242424; background-color: #ffffff; margin-top: 0px; margin-right: 0px; margin-left: 0px;"><small>Mon &ndash; Fri 10am - 8pm &amp; Sat - Sun 9am &ndash; 6pm. Cost of a local call. Calls from mobile or other networks may vary.<small></small></small></p>
        <small><small>
