      Value: |
        <p>It looks like one or more of the seats you've now selected are a different type to your previously selected seats. If you downgrade your seat type, this will mean you'll lose some of your seat benefits - such as your large cabin bag. Make sure you check you're happy with the hand luggage allowance included with your new seats carefully before confirming this change.</p>
