    - ID: "2424481a-62fa-49f3-94bc-533226157ff5"
      Hint: ExitSeatsPopupText
      Value: |
        <p>You've selected a seat near an emergency exit. In the very unlikely event of an emergency evacuation, customers in these seats need to be able and willing to assist our cabin crew.</p>
        <p>To sit here, regulations require that you:</p>
        <ul>
            <li>are aged 16 or over</li>
            <li>are not travelling with an infant</li>
            <li>willing and able to operate an exit door if required</li>
            <li>have no physical limitations on the day of travel that would prevent you from moving quickly such as illness, injury, age, pregnancy, or disability&nbsp;</li>
            <li>do not require additional equipment (eg. extension seat belt, support cushion, car seat)</li>
            <li>can understand and respond to instructions quickly, without assistance&nbsp;</li>
        </ul>
        <p>
        </p>
        <p>If you choose this seat for a passenger in one of the above categories, you will be moved by a member of ground staff or cabin crew prior to take off, which may not be a seat of your choice and no refund will be given.&nbsp;</p>
