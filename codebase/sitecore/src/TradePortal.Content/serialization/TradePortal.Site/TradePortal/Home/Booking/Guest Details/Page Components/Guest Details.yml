    - ID: "b0cd631c-114f-4d7a-ae92-ae7a192a9f2c"
      Hint: ImportantInformation
      Value: |
        <p>It&rsquo;s essential you read our Covid-19 <a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/travel-information" target="_blank">information page</a>&nbsp;and&nbsp;<a href="-/jssmedia/5698904f8bae452e8f1b81311e5f41a4.ashx" target="_blank">pre-travel checklist</a>. It&rsquo;s your responsibility to ensure that you meet entry requirements for your&nbsp;<a href="https://www.gov.uk/foreign-travel-advice">holiday destination</a>&nbsp;and&nbsp;<a href="https://www.gov.uk/uk-border-control">return to the UK</a>,&nbsp;which may change between booking and travel.&nbsp;This may include, but is not limited to, submitting documentation in advance to show at the airport, proof of a negative Covid-19 test and/or complying with any applicable vaccination rules.&nbsp;Failure to do so could result in you being unable to go on holiday and incurring cancellation charges, or being unable to return to the UK as planned&nbsp;and incurring additional costs.<br />
        <br />
        From making a booking, ensure you have sufficient travel insurance to cover you and your party if you have to cancel your trip or are unable to return to the UK as planned.<br />
        <br />
        Passports must be valid for six months beyond the date of entry and less than ten years old (some exemptions and variations to this may apply if travelling outside the EU). If you renewed your current passport before the previous one expired, extra months may have been added to its expiry date and these may not count towards the six months needed. Check the FCDO page for &nbsp;<a rel="noopener noreferrer" href="https://www.gov.uk/foreign-travel-advice" target="_blank">your destination</a>&nbsp; and use the government <a href="https://www.gov.uk/check-a-passport-travel-europe">passport checker</a>. Ensure it is signed and in good condition.<br />
        <br />
        You can find information about&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/help?helpCategory=onholiday&amp;helpQuestion=taxes" target="_blank">tourist taxes</a>&nbsp;&amp;&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/help?helpCategory=visa" target="_blank">visa requirements</a>&nbsp;which apply to your destination in our&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/help" target="_blank">help centre</a>.<br />
        <br />
        Please&nbsp;<a rel="noopener noreferrer" href="https://www.easyjet.com/en/holidays/info/contact-us" target="_blank">contact us</a>&nbsp;to let us know&nbsp;before booking if anyone travelling requires any additional assistance (e.g. difficulty walking).</p>
