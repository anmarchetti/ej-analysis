        <p><strong>Looking to pick your seats or add more bags?</strong></p>
        <p>If you'd like to bring a large overhead cabin bag on board (max 56 x 45 x 25 cm including wheels and handles), you'll need to either buy an Up Front or Extra Legroom seat, or book a large cabin bag for your flight. Subject to availability, you can pick your seats and get any extra hold luggage when you check in for your flight 30 days before departure.&nbsp;</p>
        <p>If you've got a transfer included in your holiday and you'd like to take any extra hold bags or sports equipment, please get in touch with our team after booking. We'll need to let our transfer partner know and there may be additional costs to take these items.&nbsp;</p>
