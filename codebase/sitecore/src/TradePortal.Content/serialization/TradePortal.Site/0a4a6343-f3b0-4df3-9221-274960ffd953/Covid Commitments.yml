        <p><img alt="" height="120" width="120" src="-/jssmedia/e0d14ca8ca4a435bbd607a5b9c6f470e.ashx" /></p>
        <p><strong><span>Covid commitments </span></strong></p>
        <p style="color: #131313;">Worried about changing travel rules and regulations? We&rsquo;re offering additional flexibility where holidays are affected by the government traffic light system or restrictions in destination. All holidays can be changed, fee free, up to 28 days before travel, and if your holiday destination is on the amber list in the run up to your departure date, you can make fee free changes to your booking or cancel for credit right up to 24 hours before departure. If your destination is on the red list, you&rsquo;ll also benefit from fee free changes or cancelling for credit. If you&rsquo;d rather wait to see what happens, but the destination doesn&rsquo;t come off the red list, we&rsquo;ll cancel your holiday no later than seven days before you&rsquo;re due to travel and refund you in full. We&rsquo;ll also cancel any holidays where there is a known quarantine requirement in destination, or where there is a hotel quarantine requirement when returning home to the UK. Find out more about our three key commitments <a href="https://www.easyjet.com/en/holidays/info/covid-19-response">here</a>.</p>
