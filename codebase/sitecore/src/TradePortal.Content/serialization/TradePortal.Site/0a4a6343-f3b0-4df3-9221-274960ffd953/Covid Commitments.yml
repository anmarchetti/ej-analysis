        <p><strong><span>Covid commitments </span></strong></p>
        <p style="color: #131313;">Worried about changing travel rules and regulations? We&rsquo;re closely monitoring and we&rsquo;ll cancel any holidays, where at the point of departure, there&rsquo;s a known routine quarantine requirement in destination. And if we know before you travel that restrictions at home are likely to impact your ability to go on holiday or require quarantine on return we&rsquo;ll give you the option to cancel at short notice (even if the FCDO advice still permits travel).</p>
