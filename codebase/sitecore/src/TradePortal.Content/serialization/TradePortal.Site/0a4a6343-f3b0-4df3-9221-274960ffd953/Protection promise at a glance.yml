      Value: |
        <p style="margin-bottom: 0.0001pt;"><span style="color: black;">From our Best Price Guarantee, to the flexibility to book now and make changes to your holiday plans later, you&rsquo;re protected with easyJet holidays. That&rsquo;s a promise.&nbsp;</span></p>
        <p style="margin-bottom: 0.0001pt;"><span style="color: black;">You&rsquo;ve spoken; we&rsquo;ve listened and taken action. We&rsquo;ve introduced terms and conditions that provide you with great value and flexibility that you&rsquo;ll struggle to find elsewhere.&nbsp; Rest assured, we can and will look after you, especially in this changing climate. We&rsquo;re an ABTA member and all our holidays are ATOL protected, so you can book your next trip with us with ultimate peace of mind.&nbsp;</span></p>
        <p style="margin-bottom: 0.0001pt;"><span style="color: black;">All of our industry leading policies under our Protection Promise are in addition to the guidance, support and short-term flexibility we&rsquo;re providing to you under our three key Covid commitments.&nbsp;<br />
