        <p><strong><strong>Freedom to change</strong></strong></p>
        <p>
        You have the flexibility to change your holiday if things change and there are no fees for changes made online until 28 days before departure.</p>
        <ul>
            <li>It's easy to make changes to your holiday</li>
            <li>You can make changes yourself online free of charge until 28 days before departure</li>
            <li>Changes made via our customer service team incur a low flat admin fee of &pound;25 per booking</li>
        </ul>
