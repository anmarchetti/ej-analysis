sonar.projectKey=easyjet-dev_ejh-web-digital_frontend
sonar.organization=easyjet-dev

# Set initial root dir for both source code files and tests
sonar.sources=src

# Narrow down exclusions (see https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/#example-2)
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.test.js,src/**/*.mocks.ts,src/temp/**,src/**/__mocks__/**

# Encoding of the source code files
sonar.sourceEncoding=UTF-8

# Exclusions list needs to be manually kept in sync with jest.config.js
sonar.coverage.exclusions=src/**/*.d.ts,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.test.js,src/**/*.mocks.ts,src/backend/**,src/code/localUrls.ts,src/code/routes.ts,src/code/settings.ts,src/code/tokens.ts,src/code/validation.config.ts,src/frontend/components/icons/**,src/frontend/components/icons-new/**,src/typings/**,src/models/enum/**,src/models/sitecore/**,src/frontend/utils/tests.utils.ts,src/temp/**,src/**/__mocks__/**,src/frontend/components/common/MapComponent/Map/**/*.js,src/frontend/components/common/SearchBarDropdownWhen/components/DateViewDropdown/DateViewDropdown.tsx,src/frontend/components/common/SearchBar/Dropdowns/SearchBarDropdownWhen/WhenFieldMobile.tsx,src/frontend/services/workers/service-worker.js,src/pages/_document.js

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# Ignore Blocks
sonar.issue.ignore.block=accessibilityFixIgnore
sonar.issue.ignore.block.accessibilityFixIgnore.beginBlockRegexp=NOSONAR_BEGIN
sonar.issue.ignore.block.accessibilityFixIgnore.endBlockRegexp=NOSONAR_END

# Specify tsconfig for SonarQube
sonar.typescript.tsconfigPaths=tsconfig.sonarqube.json
